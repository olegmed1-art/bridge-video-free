name: DDS Stage 2B — temporary preparation evidence

# Temporary read-only execution harness. This branch/PR must be closed without
# merging after the evidence artifact is verified. It performs no DDS call and
# does not open validation or sealed test.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/dds-stage2b-prepare-pr-evidence.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: dds-stage2b-pr-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  TRAIN_ARTIFACT_ID: '9302550154'
  TRAIN_ARTIFACT_ZIP_SHA256: c46cda2fb127371cbc1ab836c74580b25f0a0bb8ab358dfaab97cf591dd8a246
  WORK: dds_training/work/pilot
  OUT: dds_training/work/stage2b
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare-evidence:
    if: >-
      github.actor == 'olegmed1-art' &&
      github.event.pull_request.head.ref == 'dds-stage2b-prepare-execution-20260818'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout temporary evidence merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Compile and run Stage 2B contracts
        working-directory: dds_training
        run: |
          set -euo pipefail
          python -m compileall -q .
          python stage2b_blueprint_selftest.py
          python stage2b_v24_selftest.py
          python stage2b_prepare_selftest.py
          python test_runner.py --manifest test_matrix.json --check-only

      - name: Restore exact completed 30k TRAIN artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/dds-main-train "$WORK" "$OUT"
          mkdir -p /tmp/dds-main-train dds_training/work
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${TRAIN_ARTIFACT_ID}/zip" \
            > /tmp/dds-main-train/artifact.zip
          echo "$TRAIN_ARTIFACT_ZIP_SHA256  /tmp/dds-main-train/artifact.zip" | sha256sum -c -
          unzip -q /tmp/dds-main-train/artifact.zip -d /tmp/dds-main-train/extracted
          test -f /tmp/dds-main-train/extracted/dds-main-train-progress-state.tgz
          test -f /tmp/dds-main-train/extracted/dds-main-train-progress-state.sha256
          (cd /tmp/dds-main-train/extracted && sha256sum -c dds-main-train-progress-state.sha256)
          tar -xzf /tmp/dds-main-train/extracted/dds-main-train-progress-state.tgz -C dds_training/work
          test -f "$WORK/training.sqlite3"
          test -f "$WORK/blind_tasks_crossfit.jsonl"
          test -f "$WORK/blind_tasks_crossfit_main.jsonl"
          test -f "$WORK/derived_blind_tasks.jsonl"

      - name: Verify immutable TRAIN closure and holdout isolation
        working-directory: dds_training
        run: |
          set -euo pipefail
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(Path('work/pilot/training.sqlite3'))
          counts = dict(db.execute('select split,count(*) from dds_results group by split'))
          assert counts == {'derived': 2497, 'sealed_test': 3000, 'train': 42000, 'validation': 3000}, counts
          assert db.execute('select count(*) from dds_results').fetchone()[0] == 50497
          events = dict(db.execute('select event_type,count(*) from investigation_events group by event_type'))
          assert events == {'opened': 8140, 'resolved': 8140}, events
          print({'dds_results': 50497, 'train': 42000, 'validation_unchanged': 3000, 'sealed_unchanged': 3000, 'open_investigations': 0})
          PY
          sha256sum work/pilot/training.sqlite3 > /tmp/stage2b-db-before.sha256

      - name: Prepare Stage 2B from TRAIN facts only
        working-directory: dds_training
        run: |
          set -euo pipefail
          mkdir -p work/stage2b
          python stage2b_prepare.py \
            --work work/pilot \
            --tasks \
              work/pilot/blind_tasks_crossfit.jsonl \
              work/pilot/blind_tasks_crossfit_main.jsonl \
              work/pilot/derived_blind_tasks.jsonl \
            --out work/stage2b \
            --line-sources 500 \
            --continuations 2000 \
            --line-cards 16 \
            | tee work/stage2b/stage2b_prepare.log

      - name: Verify prepared evidence and unchanged database
        working-directory: dds_training
        run: |
          set -euo pipefail
          sha256sum -c /tmp/stage2b-db-before.sha256
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          root = Path('work/stage2b')
          summary = json.loads((root / 'stage2b_summary.json').read_text(encoding='utf-8'))
          ready = summary['readiness']
          assert ready['train_rows'] == 42000, ready
          assert ready['oof_rows'] == 42000, ready
          assert ready['continuation_tasks'] == 2000, ready
          assert sum(ready['continuation_by_actor'].values()) == 2000, ready
          assert ready['continuation_by_actor'].get('declarer', 0) > 0, ready
          assert ready['continuation_by_actor'].get('defense', 0) > 0, ready
          assert ready['dds_called'] is False
          assert ready['mass_training_started'] is False
          assert ready['validation_opened'] is False
          assert ready['sealed_opened'] is False
          manifest = json.loads((root / 'CURRENT_STAGE_MANIFEST.json').read_text(encoding='utf-8'))
          assert manifest['holdout_status'] == 'closed'
          assert manifest['sealed_status'] == 'closed'
          assert manifest['metadata']['dds_results'] == 50497
          db = sqlite3.connect(Path('work/pilot/training.sqlite3'))
          counts = dict(db.execute('select split,count(*) from dds_results group by split'))
          assert counts == {'derived': 2497, 'sealed_test': 3000, 'train': 42000, 'validation': 3000}, counts
          print({
              'stage2b_prepared': True,
              'oof_rows': ready['oof_rows'],
              'continuations': ready['continuation_tasks'],
              'continuation_by_actor': ready['continuation_by_actor'],
              'counterexample_candidates': ready['counterexample_candidates'],
              'structural_investigations': ready['investigations']['structural'],
              'card_level_investigations': ready['investigations']['card_level'],
              'database_unchanged': True,
              'paid_api_used': False,
          })
          PY
          test -f work/stage2b/dds-stage2b-prepared-compact.tgz
          test -f work/stage2b/dds-stage2b-prepared-compact.tgz.sha256
          (cd work/stage2b && sha256sum -c dds-stage2b-prepared-compact.tgz.sha256)

      - name: Verify repository source tree remained clean
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all | grep -v '^?? dds_training/work/' || true)"

      - name: Upload Stage 2B preparation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dds-stage2b-prepared-evidence-${{ github.run_id }}
          path: |
            dds_training/work/stage2b/stage2b_summary.json
            dds_training/work/stage2b/stage2b_readiness.json
            dds_training/work/stage2b/CURRENT_STAGE_MANIFEST.json
            dds_training/work/stage2b/oof_comparison_v03_vs_v02.json
            dds_training/work/stage2b/oof_calibration_v2.json
            dds_training/work/stage2b/candidate_model_v03.json
            dds_training/work/stage2b/oof_predictions_v03.jsonl
            dds_training/work/stage2b/line_wave_sources.jsonl
            dds_training/work/stage2b/continuation_curriculum.jsonl
            dds_training/work/stage2b/counterexample_candidates.jsonl
            dds_training/work/stage2b/investigation_resolution_classes.json
            dds_training/work/stage2b/review_queue_projection.json
            dds_training/work/stage2b/dds-stage2b-prepared-compact.tgz
            dds_training/work/stage2b/dds-stage2b-prepared-compact.tgz.sha256
          if-no-files-found: warn
          retention-days: 14
