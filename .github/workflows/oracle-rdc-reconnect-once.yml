name: Oracle RDC reconnect once

on:
  pull_request:
    paths:
      - '.github/workflows/oracle-rdc-reconnect-once.yml'

permissions:
  contents: read

jobs:
  reconnect:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/bridgit-rank-layout-shadow-609' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      ORACLE_HOST: 158.180.47.161
      ORACLE_USER: ubuntu
      EXPECTED_FINGERPRINT: SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk
      SSH_KEY_ORACLE: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
      SSH_KEY_OCI: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
      SSH_KEY_VM: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
      SSH_KEY_BRIDGE: ${{ secrets.BRIDGE_SCHOOL_ORACLE_SSH_PRIVATE_KEY }}
      SSH_KEY_ORACLE_ALT: ${{ secrets.ORACLE_SSH_KEY }}
      SSH_KEY_OCI_ALT: ${{ secrets.OCI_SSH_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Resolve trusted SSH transport
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          known="$RUNNER_TEMP/known_hosts"
          ops/oracle_known_hosts_from_scan.sh "$ORACLE_HOST" "$EXPECTED_FINGERPRINT" "$known"
          selected=''
          for name in SSH_KEY_ORACLE SSH_KEY_OCI SSH_KEY_VM SSH_KEY_BRIDGE SSH_KEY_ORACLE_ALT SSH_KEY_OCI_ALT; do
            if [[ -n "${!name:-}" ]]; then selected="$name"; break; fi
          done
          [[ -n "$selected" ]]
          key="$RUNNER_TEMP/id_oracle"
          printf '%s\n' "${!selected}" > "$key"
          chmod 0600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          echo "known=$known" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Reconnect existing cached RDC client
        shell: bash
        run: |
          set -euo pipefail
          ssh -i '${{ steps.ssh.outputs.key }}' \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile='${{ steps.ssh.outputs.known }}' -o ConnectTimeout=15 \
            "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          pkill -u "$(id -u)" -f '[d]esktop-commander.*remote' 2>/dev/null || true
          for _ in $(seq 1 10); do
            if ! pgrep -u "$(id -u)" -f '[d]esktop-commander.*remote' >/dev/null; then break; fi
            sleep 1
          done
          if pgrep -u "$(id -u)" -f '[d]esktop-commander.*remote' >/dev/null; then
            printf 'RDC_RECONNECT_REFUSED reason=stale_client_would_not_stop\n'
            exit 4
          fi
          umask 077
          mkdir -p "$HOME/.cache"
          log="$HOME/.cache/rdc-remote.log"
          : > "$log"
          if command -v desktop-commander >/dev/null 2>&1; then
            nohup desktop-commander remote </dev/null >"$log" 2>&1 &
            mode=installed_binary
          elif [[ -x "$HOME/.local/bin/desktop-commander" ]]; then
            nohup "$HOME/.local/bin/desktop-commander" remote </dev/null >"$log" 2>&1 &
            mode=local_binary
          elif command -v npx >/dev/null 2>&1; then
            nohup npx --offline --yes @wonderwhy-er/desktop-commander@latest remote </dev/null >"$log" 2>&1 &
            mode=cached_npx
          else
            printf 'RDC_RECONNECT_REFUSED reason=no_existing_client\n'
            exit 2
          fi
          disown || true
          for _ in $(seq 1 30); do
            if pgrep -u "$(id -u)" -f '[d]esktop-commander.*remote' >/dev/null; then
              printf 'RDC_RECONNECT_PASS mode=%s\n' "$mode"
              exit 0
            fi
            sleep 1
          done
          printf 'RDC_RECONNECT_REFUSED reason=client_did_not_stay_running mode=%s\n' "$mode"
          exit 3
          REMOTE
