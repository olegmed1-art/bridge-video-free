name: Tournament Analyzer v3 Confirmed Longitudinal

on:
  pull_request:
    paths:
      - "bridge_school_api/tournament_teacher_confirmed_longitudinal_v3.py"
      - "tools/tournament_teacher_confirmed_longitudinal_v3.py"
      - "tests/test_tournament_teacher_confirmed_longitudinal_v3.py"
      - ".github/workflows/tournament-analyzer-v3-confirmed-longitudinal.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  confirmed-longitudinal-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile modules
        run: |
          python -m py_compile bridge_school_api/tournament_teacher_confirmed_longitudinal_v3.py
          python -m py_compile tools/tournament_teacher_confirmed_longitudinal_v3.py
      - name: Run focused contracts
        run: |
          python -m pytest -q \
            tests/test_tournament_teacher_review_bundle_v3.py \
            tests/test_tournament_teacher_confirmed_longitudinal_v3.py
      - name: Restore exact portable real-evidence bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9558677983/zip" \
            -o /tmp/teacher-bundle.zip
          echo "6c0fd70f8b8f12a6f27f709dcb637ce198f66fbffb28798dc0dcf0773b625b66  /tmp/teacher-bundle.zip" | sha256sum -c -
          mkdir -p evidence/bundle
          unzip -q /tmp/teacher-bundle.zip -d evidence/bundle
          BUNDLE="$(find evidence/bundle -type f -name 'tournament-teacher-review-bundle.json' -print -quit)"
          test -n "$BUNDLE"
          echo "BUNDLE=$BUNDLE" >> "$GITHUB_ENV"
      - name: Prove pending reviews cannot enter confirmed longitudinal view
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python tools/tournament_teacher_confirmed_longitudinal_v3.py \
            --bundle "$BUNDLE" \
            --out-json tournament-teacher-confirmed-longitudinal.json \
            --out-md tournament-teacher-confirmed-longitudinal.md
          cat tournament-teacher-confirmed-longitudinal.md
      - name: Real evidence gate
        run: |
          python - <<'PY'
          import json
          p=json.load(open('tournament-teacher-confirmed-longitudinal.json', encoding='utf-8'))
          assert p['schema']=='tournament-teacher-confirmed-longitudinal-v1'
          assert p['bundle_id']=='9bbb8f44afe9e8beff93627f1ec1e03d5ae9c97aa761ab2d8ceae6d82ee59033'
          assert p['teacher_decision_gate_enforced'] is True
          assert p['technical_relevance_only'] is True
          assert p['automatic_methodology_mapping_allowed'] is False
          assert p['automatic_student_error_attribution_allowed'] is False
          assert p['causal_error_attribution_allowed'] is False
          assert p['status_counts']['PENDING']==17
          assert p['status_counts']['CONFIRMED_TECHNICAL_RELEVANCE']==0
          assert p['status_counts']['DISMISSED']==0
          assert p['status_counts']['NEEDS_CONTEXT']==0
          assert p['confirmed_items']==[]
          assert p['clusters']==[]
          assert p['persistent_clusters']==[]
          print('TOURNAMENT_TEACHER_CONFIRMED_LONGITUDINAL_PENDING_GATE_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tournament-analyzer-v3-confirmed-longitudinal-pending-gate
          path: |
            tournament-teacher-confirmed-longitudinal.json
            tournament-teacher-confirmed-longitudinal.md
          if-no-files-found: error
          retention-days: 30
