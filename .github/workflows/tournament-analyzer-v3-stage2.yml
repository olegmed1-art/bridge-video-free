name: Tournament Analyzer v3 Stage2

on:
  pull_request:
    paths:
      - "bridge_school_api/tournament_adapters_v3.py"
      - "bridge_school_api/tournament_longitudinal_v3.py"
      - "tests/test_tournament_analyzer_v3_stage2.py"
      - ".github/workflows/tournament-analyzer-v3-stage2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile stage2 modules
        run: python -m py_compile bridge_school_api/tournament_adapters_v3.py bridge_school_api/tournament_longitudinal_v3.py
      - name: Run Tournament Analyzer stage2 tests
        run: python -m pytest -q tests/test_tournament_analyzer_v3.py tests/test_tournament_analyzer_v3_stage2.py
