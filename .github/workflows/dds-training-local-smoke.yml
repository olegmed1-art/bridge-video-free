name: DDS integration contract (local solver)

on:
  push:
    branches: [dds-training-local]
    paths:
      - 'dds_training/**'
      - '.github/workflows/dds-training-v23-smoke.yml'
      - '.github/workflows/dds-training-local-smoke.yml'
  workflow_dispatch:

concurrency:
  group: dds-test-heavy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Compile DDS Python modules
        working-directory: dds_training
        run: python -m compileall -q .

      - name: Run fail-closed test-runner guard directly
        working-directory: dds_training
        run: python test_runner_selftest.py

      - name: Run fail-closed architecture guard directly
        working-directory: dds_training
        run: python test_architecture_selftest.py

      - name: Validate canonical test inventory and coverage contract
        working-directory: dds_training
        run: python test_runner.py --manifest test_matrix.json --check-only

      - name: Restore verified DDS3 wheel and Bazel state
        id: dds-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            dds_training/.wheel-cache/dds3
            ~/.cache/bazel-dds3
          key: dds3-wheel-v5-${{ runner.os }}-py314-${{ hashFiles('dds_training/bootstrap_linux.sh') }}
          restore-keys: |
            dds3-wheel-v5-${{ runner.os }}-py314-

      - name: Bootstrap pinned local DDS3 and run technical preflight
        run: bash dds_training/bootstrap_linux.sh

      - name: Record whether DDS wheel cache was rebuilt
        id: dds-cache-state
        run: |
          if [ -f dds_training/.wheel-cache/dds3/.cache_rebuilt ]; then
            echo "rebuilt=true" >> "$GITHUB_OUTPUT"
          else
            echo "rebuilt=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prove verified wheel cache can restore without DDS rebuild
        run: |
          set -euo pipefail
          rm -rf dds_training/.venv dds_training/.build/dds3
          DDS_REQUIRE_WHEEL_CACHE=1 bash dds_training/bootstrap_linux.sh
          test ! -f dds_training/.wheel-cache/dds3/.cache_rebuilt

      - name: Verify deterministic DDS golden preflight twice
        working-directory: dds_training
        run: |
          set -euo pipefail
          source .venv/bin/activate
          python preflight.py --quick > /tmp/dds-preflight-run-1.json
          python preflight.py --quick > /tmp/dds-preflight-run-2.json
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          from pathlib import Path
          paths = [Path('/tmp/dds-preflight-run-1.json'), Path('/tmp/dds-preflight-run-2.json')]
          payloads = [json.loads(path.read_text(encoding='utf-8')) for path in paths]
          canonical = [json.dumps(payload, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode('utf-8') for payload in payloads]
          hashes = [hashlib.sha256(item).hexdigest() for item in canonical]
          assert canonical[0] == canonical[1], (payloads[0], payloads[1])
          assert hashes[0] == hashes[1], hashes
          evidence = {
              'schema': 'dds-golden-repeatability-v1',
              'repetitions': 2,
              'identical_canonical_json': True,
              'canonical_sha256': hashes[0],
              'run_sha256': hashes,
              'result': payloads[0],
          }
          Path('/tmp/dds-preflight-repeatability.json').write_text(json.dumps(evidence, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(evidence, ensure_ascii=False, indent=2))
          PY

      - name: Run isolated DDS-backed test suite with runtime coverage
        working-directory: dds_training
        env:
          DDS_COVERAGE_ROOT: ${{ github.workspace }}/dds_training
          DDS_COVERAGE_DIR: /tmp/dds-coverage-heavy
          DDS_COVERAGE_MANIFEST: ${{ github.workspace }}/dds_training/test_matrix.json
          DDS_COVERAGE_SUITE: dds
        run: |
          set -euo pipefail
          source .venv/bin/activate
          rm -rf "$DDS_COVERAGE_DIR"
          mkdir -p "$DDS_COVERAGE_DIR"
          python test_runner.py \
            --manifest test_matrix.json \
            --suite dds \
            --report /tmp/dds-test-report-dds.json

      - name: Enforce measured DDS-suite runtime coverage
        working-directory: dds_training
        run: |
          source .venv/bin/activate
          python coverage_report.py \
            --root . \
            --manifest test_matrix.json \
            --fragments /tmp/dds-coverage-heavy \
            --suite dds \
            --out /tmp/dds-runtime-coverage-heavy.json \
            --fail-on-error

      - name: Cross-check DDS3 with independent bridge-solver
        run: |
          set -euo pipefail
          rm -rf /tmp/bridge-solver-independent
          git clone --quiet https://github.com/macroxue/bridge-solver.git /tmp/bridge-solver-independent
          git -C /tmp/bridge-solver-independent checkout --quiet --detach dc2d4df68d21822c18fc1688b9f6f183c927c11c
          g++ -std=c++17 -O2 \
            -o /tmp/bridge-solver-independent/solver-independent \
            /tmp/bridge-solver-independent/solver.cc
          cd dds_training
          source .venv/bin/activate
          python independent_crosscheck.py \
            --solver /tmp/bridge-solver-independent/solver-independent \
            --count 4 | tee /tmp/dds-independent-crosscheck.json

      - name: Verify unauthorized direct mass evaluation is blocked before import
        working-directory: dds_training
        run: |
          set -euo pipefail
          source .venv/bin/activate
          rm -rf /tmp/dds-pilot-prepared
          python run_stage.py prepare --stage pilot --out /tmp/dds-pilot-prepared
          set +e
          DDS_TRAINING_CONFIRM=YES python run_stage.py evaluate \
            --stage pilot \
            --work /tmp/dds-pilot-prepared \
            --predictions /tmp/does-not-exist.jsonl \
            --splits train \
            --start \
            2>/tmp/unauthorized-launch.err
          rc=$?
          set -e
          test "$rc" -eq 86
          grep -q "DDS launch blocked before run_stage import" /tmp/unauthorized-launch.err

      - name: Check deterministic pilot preparation and manifest audit
        working-directory: dds_training
        run: |
          set -euo pipefail
          source .venv/bin/activate
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/dds-pilot-prepared')
          summary = json.loads((root / 'corpus_summary.json').read_text())
          state = json.loads((root / 'state.json').read_text())
          assert summary['count'] == 10000, summary
          assert summary['splits'] == {'train': 7000, 'validation': 1500, 'sealed_test': 1500}, summary['splits']
          assert state['manifest_audit']['status'] == 'ok', state['manifest_audit']
          assert state['fresh_base_deals_for_stage'] == 10000, state
          assert state['fresh_base_tasks_for_stage'] == 20000, state
          tasks = sum(1 for _ in (root / 'blind_tasks.jsonl').open())
          assert tasks == 20000, tasks
          print({'pilot_deals': summary['count'], 'splits': summary['splits'], 'blind_tasks': tasks, 'manifest_audit': 'ok', 'dds_training_started': False})
          PY

      - name: Audit empty prepared database without starting training
        working-directory: dds_training
        run: |
          set -euo pipefail
          source .venv/bin/activate
          python run_stage.py audit \
            --work /tmp/dds-pilot-prepared \
            --fail-on-error

      - name: Expand corpus and execute non-mass Stage 2 readiness rehearsal
        working-directory: dds_training
        run: |
          set -euo pipefail
          source .venv/bin/activate
          python run_stage.py prepare --stage main --out /tmp/dds-pilot-prepared
          python prepare_stage2.py --work /tmp/dds-pilot-prepared
          python stage2_readiness.py \
            --work /tmp/dds-pilot-prepared \
            --require main_train
          python - <<'PY'
          import json
          import sqlite3
          from pathlib import Path
          root = Path('/tmp/dds-pilot-prepared')
          ready = json.loads((root / 'stage2_readiness.json').read_text())
          assert ready['main_train']['ready'] is True, ready
          assert ready['main_train']['actual_total_deals'] == 30000, ready
          assert ready['main_train']['actual_fresh_tasks'] == 40000, ready
          assert ready['holdout']['ready'] is False, ready
          assert ready['skill_claim']['ready'] is False, ready
          database = sqlite3.connect(root / 'training.sqlite3')
          assert database.execute('select count(*) from dds_results').fetchone()[0] == 0
          print({'stage2_main_train_ready': True, 'fresh_tasks': ready['main_train']['actual_fresh_tasks'], 'holdout_still_closed': True, 'stable_skill_claim_still_closed': True, 'mass_dds_results': 0, 'paid_api_used': False})
          PY

      - name: Verify tests did not modify tracked sources
        run: git diff --exit-code

      - name: Upload machine-readable DDS integration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dds-test-report-heavy-${{ github.run_id }}
          path: |
            /tmp/dds-test-report-dds.json
            /tmp/dds-runtime-coverage-heavy.json
            /tmp/dds-independent-crosscheck.json
            /tmp/dds-preflight-repeatability.json
            dds_training/.wheel-cache/dds3/build_provenance.json
            /tmp/dds-pilot-prepared/stage2_readiness.json
          if-no-files-found: warn
          retention-days: 14

      - name: Save rebuilt verified DDS3 wheel and Bazel state
        if: always() && steps.dds-cache-state.outputs.rebuilt == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            dds_training/.wheel-cache/dds3
            ~/.cache/bazel-dds3
          key: dds3-wheel-v5-${{ runner.os }}-py314-${{ hashFiles('dds_training/bootstrap_linux.sh') }}-${{ github.run_id }}
