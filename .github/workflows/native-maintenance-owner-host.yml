name: Light AFTER incident read-only diagnostic (branch only)

on:
  pull_request:
    paths:
      - '.github/workflows/native-maintenance-owner-host.yml'
      - 'ops/incident/light_after_probe*_20260928.py'
      - 'tests/test_light_after_probe*_20260928.py'
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: 'Legacy input name: exact reviewed DIAGNOSTIC branch commit; main stays pinned to 8bbc1d6'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'olegmed1-art/bridge-video-free' && github.ref == 'refs/heads/fix/light-after-readonly-probe-20260928' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && inputs.expected_main_sha == github.sha && 'oracle-instance-workload-mutation' || format('light-after-probe-noop-{0}', github.run_id) }}
  cancel-in-progress: false
  queue: max

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Offline incident helper and transport safety tests
        run: python -m unittest -q tests.test_light_after_probe_20260928 tests.test_light_after_probe_runner_20260928

  probe:
    needs: contract
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'olegmed1-art/bridge-video-free' &&
      github.ref == 'refs/heads/fix/light-after-readonly-probe-20260928' &&
      github.actor == github.repository_owner && github.triggering_actor == github.repository_owner &&
      inputs.expected_main_sha == github.sha
    environment: database-production
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    concurrency:
      group: oracle-light-backup-mutation
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Observe fixed AFTER gates on Oracle without a restore request
        env:
          NATIVE_OWNER_DATABASE_URL: ${{ secrets.LIGHT_MAINTENANCE_DATABASE_URL }}
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN: 8bbc1d61010ef70c3fca02b5151ac86fce02a144
          ACCEPTED_PROBE_SHA: ${{ inputs.expected_main_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          python -m pip download --disable-pip-version-check --only-binary=:all: \
            --platform manylinux_2_28_aarch64 --platform manylinux_2_27_aarch64 \
            --python-version 312 --implementation cp --abi cp312 --no-deps \
            --require-hashes --index-url https://pypi.org/simple \
            -r ops/native_driver_requirements.txt --dest "$work/wheels"
          [[ -n "${SSH_PRIVATE_KEY:-}" ]]
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$work/key"
          unset SSH_PRIVATE_KEY
          ssh-keygen -y -P '' -f "$work/key" > "$work/public" 2>/dev/null
          bash ops/oracle_known_hosts_from_scan.sh 92.5.47.149 SHA256:XBR1x74uJ41BxmDF7Y9P20GjIjNbrYXqieV4c2MC0Go "$work/known_hosts"
          PYTHONPATH=. python ops/incident/light_after_probe_runner_20260928.py "$work/key" "$work/known_hosts" "$work/wheels"
