name: TEMP Assistant Lab production DDS3 canary

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  dds3-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch pre-created bounded DDS3 golden job
        shell: bash
        run: |
          set -euo pipefail
          url='https://bridge-video-free.vercel.app/v1/assistant-lab/jobs/2ffc8cf2-da04-48f0-bb03-832898790897/dispatch?nonce=6ded0eb18a84f3b1758157499d74353351f4224dc8d883a3ecc0bbd76a000ef1'
          curl --fail-with-body --silent --show-error --max-time 60 "$url" | tee /tmp/result.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/result.json'))
          assert d['status']=='COMPLETED', d
          r=d['result']
          assert r['engine']=='DDS3' and r['fallback_used'] is False, r
          assert r['operation']=='dd_table', r
          assert r['par_score_ns']==-110, r
          assert r['par_contracts']==['2S-EW'], r
          assert r['dd_table']=={'S':[5,8,5,8],'H':[6,6,6,6],'D':[5,7,5,7],'C':[7,5,7,5],'NT':[6,6,6,6]}, r
          print('ASSISTANT_LAB_PRODUCTION_DDS3_PASS')
          PY
