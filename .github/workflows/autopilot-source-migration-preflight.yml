name: Autopilot source migration preflight

on:
  pull_request:
    paths: ['.github/workflows/autopilot-source-migration-preflight.yml', 'ops/oracle_autopilot_source_preflight.py', 'ops/test_oracle_autopilot_source_preflight.py']
  push:
    branches: [main]
    paths: ['.github/workflows/autopilot-source-migration-preflight.yml', 'ops/oracle_autopilot_source_preflight.py', 'ops/test_oracle_autopilot_source_preflight.py']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: python -m ops.test_oracle_autopilot_source_preflight

  preflight:
    needs: contract
    if: github.repository == 'olegmed1-art/bridge-video-free' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.3.4'
      - name: Check pinned production credentials without writes
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          AUTOPILOT_CALLBACK_DATABASE_URL: ${{ secrets.AUTOPILOT_CALLBACK_DATABASE_URL }}
          BRIDGE_WORKER_DATABASE_URL: ${{ secrets.BRIDGE_WORKER_DATABASE_URL }}
          BRIDGE_HEALTH_DATABASE_URL: ${{ secrets.BRIDGE_HEALTH_DATABASE_URL }}
        run: python -m ops.oracle_autopilot_source_preflight
