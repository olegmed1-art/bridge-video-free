name: DDS Stage 2C.4 — blind regression retest

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/dds-stage2c4-blind-regression.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: dds-stage2c4-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  STAGE2B_ARTIFACT_ID: '9318545935'
  STAGE2C2_ARTIFACT_ID: '9352988318'
  GH_TOKEN: ${{ github.token }}

jobs:
  blind-regression:
    if: >-
      github.actor == 'olegmed1-art' &&
      github.event.pull_request.head.ref == 'dds-stage2c4-blind-regression-20260820'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact PR merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Restore Stage 2B tasks and Stage 2C.2 immutable evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/s2b /tmp/s2c2 dds_training/work/stage2c4
          mkdir -p /tmp/s2b /tmp/s2c2 dds_training/work/stage2c4
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${STAGE2B_ARTIFACT_ID}/zip" > /tmp/s2b/artifact.zip
          unzip -q /tmp/s2b/artifact.zip -d /tmp/s2b/files
          test -f /tmp/s2b/files/continuation_curriculum_balanced.jsonl
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${STAGE2C2_ARTIFACT_ID}/zip" > /tmp/s2c2/artifact.zip
          unzip -q /tmp/s2c2/artifact.zip -d /tmp/s2c2/files
          cont="$(find /tmp/s2c2/files -name 'stage2c2_continuation_results.jsonl' -print -quit)"
          pairs="$(find /tmp/s2c2/files -name 'stage2c2_counterexample_pair_audit.jsonl' -print -quit)"
          test -n "$cont"
          test -n "$pairs"
          cp "$cont" /tmp/s2c2/continuations.jsonl
          cp "$pairs" /tmp/s2c2/pairs.jsonl

      - name: Run family-disjoint blind regression retest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, math, statistics
          from collections import Counter, defaultdict
          from pathlib import Path

          S='SHDC'; R='AKQJT98765432'; RV={r:14-i for i,r in enumerate(R)}
          out=Path('dds_training/work/stage2c4'); out.mkdir(parents=True,exist_ok=True)

          def rows(p):
              return [json.loads(x) for x in Path(p).read_text(encoding='utf-8').splitlines() if x.strip()]
          def parse_deal(pbn):
              seats='NESW'; start=seats.index(pbn[0]); hs=pbn[2:].split(); d={}
              for i,h in enumerate(hs): d[(start+i)%4]=h.split('.')
              return d
          def legal(hand, current):
              cards=[(s,r) for s,h in enumerate(hand) for r in h]
              if current:
                  led=S.index(current[0]['card'][0]); same=[c for c in cards if c[0]==led]
                  if same: return same
              return cards
          def tok(c): return S[c[0]]+c[1]
          def fold_for(fam): return int(hashlib.sha256(str(fam).encode()).hexdigest()[:8],16)%5
          def difficulty(nopt):
              return 'critical_1_2' if nopt<=2 else 'constrained_3_4' if nopt<=4 else 'flexible_5_8' if nopt<=8 else 'trivial_9_plus'

          tasks={str(x['task_id']):x for x in rows('/tmp/s2b/files/continuation_curriculum_balanced.jsonl')}
          old=rows('/tmp/s2c2/continuations.jsonl')
          assert len(tasks)==2000 and len(old)==2000

          examples=[]
          for x in old:
              t=tasks[str(x['task_id'])]; r=x['dds_result']; p=x['prediction']; fam=x.get('family_id') or t.get('root_deal_id')
              scores=r.get('candidate_scores') or r.get('scores') or {}
              optimal=r.get('optimal_cards') or []
              if not scores:
                  # continuation_eval stores card_scores in some versions
                  scores=r.get('card_scores') or {}
              if not optimal and scores:
                  best=max(scores.values()); optimal=sorted(k for k,v in scores.items() if v==best)
              chosen=str(p.get('card','')).upper()
              regret=r.get('dd_regret')
              if regret is None and scores and chosen in scores:
                  regret=max(scores.values())-scores[chosen]
              hand=parse_deal(t['remaining_deal'])[int(t['next_seat'])]
              cur=t.get('current_trick') or []
              cards=legal(hand,cur)
              examples.append({'raw':x,'task':t,'fam':str(fam),'fold':fold_for(fam),'scores':scores,'optimal':optimal,'old_card':chosen,'old_regret':regret,'legal':cards})

          # Cross-fit empirical correction. Learn only from other families/folds.
          # Feature = actor, strain class, follow/lead state, suit length bucket, rank bucket, trump/nontrump.
          def card_features(e,c):
              t=e['task']; hand=parse_deal(t['remaining_deal'])[int(t['next_seat'])]; cur=t.get('current_trick') or []
              strain=int(t['strain']); actor=t['actor']; s,r=c
              follow='follow' if cur else 'lead'
              sl=min(5,len(hand[s]))
              rb='honor' if r in 'AKQJ' else 'mid' if r in 'T987' else 'low'
              tr='nt' if strain==4 else ('trump' if s==strain else 'side')
              return (actor, 'nt' if strain==4 else 'suit', follow, sl, rb, tr)

          pred_rows=[]
          for held in range(5):
              stat=defaultdict(lambda:[0.0,0])
              global_actor=defaultdict(lambda:[0.0,0])
              for e in examples:
                  if e['fold']==held: continue
                  if not e['scores']: continue
                  best=max(e['scores'].values())
                  for card,score in e['scores'].items():
                      c=(S.index(card[0]),card[1]); loss=best-score
                      f=card_features(e,c)
                      stat[f][0]+=loss; stat[f][1]+=1
                      global_actor[e['task']['actor']][0]+=loss; global_actor[e['task']['actor']][1]+=1
              for e in examples:
                  if e['fold']!=held: continue
                  ranked=[]
                  for c in e['legal']:
                      f=card_features(e,c); total,n=stat[f]
                      if n>=8: est=total/n
                      else:
                          gt,gn=global_actor[e['task']['actor']]; est=(gt/gn if gn else 1.0)
                      # deterministic small human-view preference to break empirical ties
                      tie=0.001*(RV[c[1]]/14)+0.0001*c[0]
                      ranked.append((est+tie,c))
                  ranked.sort(key=lambda z:(z[0],z[1][0],-RV[z[1][1]]))
                  card=tok(ranked[0][1])
                  if e['scores'] and card in e['scores']:
                      best=max(e['scores'].values()); new_regret=best-e['scores'][card]
                  else: new_regret=None
                  pred_rows.append({'task_id':e['task']['task_id'],'family_id':e['fam'],'fold':held,'actor':e['task']['actor'],'old_card':e['old_card'],'new_card':card,'old_regret':e['old_regret'],'new_regret':new_regret,'optimal_cards':e['optimal'],'difficulty':difficulty(len(e['optimal'])),'prediction_changed':card!=e['old_card']})

          assert len(pred_rows)==2000
          def metrics(rs,key):
              vals=[x[key] for x in rs if x[key] is not None]
              return {'n':len(vals),'optimal':sum(v==0 for v in vals),'optimal_rate':sum(v==0 for v in vals)/len(vals),'mean_regret':statistics.fmean(vals),'regret_2plus':sum(v>=2 for v in vals)}
          sections={}
          for actor in ('declarer','defense'):
              ar=[x for x in pred_rows if x['actor']==actor]
              sections[actor]={'old':metrics(ar,'old_regret'),'new':metrics(ar,'new_regret'),'by_difficulty':{}}
              for d in ('critical_1_2','constrained_3_4','flexible_5_8','trivial_9_plus'):
                  rr=[x for x in ar if x['difficulty']==d]
                  sections[actor]['by_difficulty'][d]={'old':metrics(rr,'old_regret'),'new':metrics(rr,'new_regret')}

          # Regression subset = all previous nonzero card errors.
          regression=[x for x in pred_rows if x['old_regret'] is not None and x['old_regret']>0]
          reg_old=metrics(regression,'old_regret'); reg_new=metrics(regression,'new_regret')
          improved=sum((x['new_regret'] is not None and x['new_regret']<x['old_regret']) for x in regression)
          worsened=sum((x['new_regret'] is not None and x['new_regret']>x['old_regret']) for x in regression)

          # Counterexample pair audit remains a separate transfer gate; no contamination from labels is allowed.
          pairs=rows('/tmp/s2c2/pairs.jsonl')
          action=[x for x in pairs if x.get('truth_changed') and not x.get('both_equal_optimal',False)]

          summary={
            'schema':'dds-stage2c4-blind-regression-v1','stage':'2C.4','status':'blind_regression_complete',
            'method':'5-fold family-disjoint empirical card-loss cross-fit','families_overlap_across_train_test':False,
            'new_dds_calls':False,'validation_opened':False,'sealed_opened':False,
            'continuations':sections,
            'regression_subset':{'n':len(regression),'old':reg_old,'new':reg_new,'improved':improved,'worsened':worsened},
            'counterexample_pair_rows_available':len(pairs),
            'action_flip_like_rows_for_followup':len(action),
            'promotion_allowed':False,
            'next_gate':'methodology_audit_then_owner_decision_on_validation'
          }
          with (out/'stage2c4_predictions.jsonl').open('w',encoding='utf-8') as f:
              for x in sorted(pred_rows,key=lambda z:str(z['task_id'])): f.write(json.dumps(x,ensure_ascii=False,sort_keys=True)+'\n')
          (out/'STAGE2C4_BLIND_REGRESSION_EVIDENCE.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (out/'STAGE2C4_REPORT_RU.md').write_text(
              '# DDS Stage 2C.4 — Blind Regression Retest\n\n'
              f"Family-disjoint 5-fold retest завершён без новых DDS-вызовов. Validation/sealed закрыты.\n\n"
              f"Защита: optimal {sections['defense']['old']['optimal_rate']:.3%} → {sections['defense']['new']['optimal_rate']:.3%}; mean regret {sections['defense']['old']['mean_regret']:.3f} → {sections['defense']['new']['mean_regret']:.3f}.\n\n"
              f"Разыгрывающий: optimal {sections['declarer']['old']['optimal_rate']:.3%} → {sections['declarer']['new']['optimal_rate']:.3%}; mean regret {sections['declarer']['old']['mean_regret']:.3f} → {sections['declarer']['new']['mean_regret']:.3f}.\n\n"
              f"Regression subset: {len(regression)} позиций; улучшено {improved}, ухудшено {worsened}.\n\n"
              'Следующий gate: methodology audit; автоматическое открытие validation запрещено.\n', encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY

      - name: Verify fail-closed gates and package evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('dds_training/work/stage2c4/STAGE2C4_BLIND_REGRESSION_EVIDENCE.json')
          s=json.loads(p.read_text())
          assert s['status']=='blind_regression_complete'
          assert s['new_dds_calls'] is False
          assert s['validation_opened'] is False and s['sealed_opened'] is False
          assert s['families_overlap_across_train_test'] is False
          assert s['promotion_allowed'] is False
          print({'verified':True,'next_gate':s['next_gate']})
          PY
          tar -czf dds-stage2c4-blind-regression.tgz -C dds_training/work stage2c4
          sha256sum dds-stage2c4-blind-regression.tgz > dds-stage2c4-blind-regression.tgz.sha256

      - name: Upload Stage 2C.4 evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dds-stage2c4-blind-regression-${{ github.run_id }}
          path: |
            dds_training/work/stage2c4/STAGE2C4_BLIND_REGRESSION_EVIDENCE.json
            dds_training/work/stage2c4/STAGE2C4_REPORT_RU.md
            dds_training/work/stage2c4/stage2c4_predictions.jsonl
            dds-stage2c4-blind-regression.tgz
            dds-stage2c4-blind-regression.tgz.sha256
          retention-days: 30
          if-no-files-found: error
