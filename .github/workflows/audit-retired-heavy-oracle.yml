name: Audit retired heavy Oracle residue

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  audit:
    if: >-
      github.actor == github.repository_owner &&
      github.event.issue.number == 1131 &&
      github.event.comment.body == '/audit-retired-heavy-oracle'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OCI_REGION: eu-frankfurt-1
      OCI_INSTANCE_OCID: ocid1.instance.oc1.eu-frankfurt-1.antheljtruoejaica7hj5oubnh2cctnjr7ti7llcgo6ho6wdvgvui6td7saq
      EXPECTED_NAME: bridge-school-dds3-frankfurt
      OLD_PUBLIC_IP: 158.180.47.161
    steps:
      - name: Configure read-only OCI client
        env:
          OCI_CLI_CONFIG: ${{ secrets.OCI_CLI_CONFIG }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
        run: |
          set -euo pipefail
          test -n "${OCI_CLI_CONFIG:-}"
          test -n "${OCI_CLI_KEY_CONTENT:-}"
          python -m pip install --disable-pip-version-check --quiet 'oci-cli==3.90.3'
          umask 077
          mkdir -p "$HOME/.oci"
          if [[ "$OCI_CLI_KEY_CONTENT" == base64:* ]]; then
            printf '%s' "${OCI_CLI_KEY_CONTENT#base64:}" | base64 --decode > "$HOME/.oci/key.pem"
          else
            printf '%s\n' "$OCI_CLI_KEY_CONTENT" > "$HOME/.oci/key.pem"
          fi
          printf '%s\n' "$OCI_CLI_CONFIG" > "$HOME/.oci/config"
          openssl pkey -in "$HOME/.oci/key.pem" -traditional -out "$HOME/.oci/key.pkcs1.pem"
          mv "$HOME/.oci/key.pkcs1.pem" "$HOME/.oci/key.pem"
          fp="$(openssl pkey -in "$HOME/.oci/key.pem" -pubout -outform DER | openssl md5 -r | awk '{print $1}' | sed 's/../&:/g;s/:$//')"
          OCI_FP="$fp" python - <<'PY'
          import os
          from pathlib import Path
          p=Path.home()/'.oci/config'
          out=[]; found=set()
          repl={'key_file':str(Path.home()/'.oci/key.pem'),'region':'eu-frankfurt-1','fingerprint':os.environ['OCI_FP']}
          for line in p.read_text().splitlines():
              key=line.partition('=')[0].strip()
              if key in repl:
                  out.append(f'{key}={repl[key]}'); found.add(key)
              else:
                  out.append(line)
          for key,value in repl.items():
              if key not in found: out.append(f'{key}={value}')
          p.write_text('\n'.join(out)+'\n')
          PY
          chmod 0600 "$HOME/.oci/config" "$HOME/.oci/key.pem"
          oci iam region list --output json >/dev/null

      - name: Collect exact read-only inventory
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          import oci

          cfg=oci.config.from_file()
          compute=oci.core.ComputeClient(cfg)
          block=oci.core.BlockstorageClient(cfg)
          network=oci.core.VirtualNetworkClient(cfg)

          def all_pages(fn, *args, **kwargs):
              try:
                  return oci.pagination.list_call_get_all_results(fn,*args,**kwargs).data
              except Exception as exc:
                  print(f'AUDIT_SOURCE_ERROR {fn.__name__}: {type(exc).__name__}')
                  return []

          def d(x):
              return oci.util.to_dict(x)

          def short(v):
              if isinstance(v,str) and v.startswith('ocid1.'):
                  return '…'+v[-12:]
              if isinstance(v,list):
                  return [short(x) for x in v]
              return v

          def pick(items, fields, active=None):
              out=[]
              for obj in items:
                  x=d(obj)
                  state=x.get('lifecycle_state')
                  if active and state not in active:
                      continue
                  out.append({k:short(x.get(v)) for k,v in fields.items()})
              return out

          inst=compute.get_instance(os.environ['OCI_INSTANCE_OCID']).data
          ix=d(inst)
          assert ix['display_name']==os.environ['EXPECTED_NAME']
          comp=ix['compartment_id']; ad=ix['availability_domain']

          boot_att=all_pages(compute.list_boot_volume_attachments,compartment_id=comp,availability_domain=ad,instance_id=ix['id'])
          vol_att=all_pages(compute.list_volume_attachments,compartment_id=comp,instance_id=ix['id'])
          vnic_att=all_pages(compute.list_vnic_attachments,compartment_id=comp,instance_id=ix['id'])
          boots=all_pages(block.list_boot_volumes,compartment_id=comp,availability_domain=ad)
          vols=all_pages(block.list_volumes,compartment_id=comp,availability_domain=ad)
          boot_bak=all_pages(block.list_boot_volume_backups,compartment_id=comp)
          vol_bak=all_pages(block.list_volume_backups,compartment_id=comp)
          ips=all_pages(network.list_public_ips,scope='REGION',compartment_id=comp)

          detached_volume_details=[]
          for attachment in vol_att:
              vid=getattr(attachment,'volume_id',None)
              if not vid: continue
              try:
                  vx=d(block.get_volume(vid).data)
                  detached_volume_details.append({
                    'id':short(vx.get('id')),'name':vx.get('display_name'),
                    'state':vx.get('lifecycle_state'),'gb':vx.get('size_in_gbs'),
                    'created':str(vx.get('time_created'))
                  })
              except Exception as exc:
                  detached_volume_details.append({'id':short(vid),'state':'LOOKUP_ERROR','error':type(exc).__name__})

          report={
            'exact_instance':{'name':ix.get('display_name'),'state':ix.get('lifecycle_state'),'id':short(ix.get('id')),'created':str(ix.get('time_created'))},
            'boot_attachments':pick(boot_att,{'id':'id','state':'lifecycle_state','boot_volume':'boot_volume_id'}),
            'block_attachments':pick(vol_att,{'id':'id','state':'lifecycle_state','volume':'volume_id'}),
            'formerly_attached_block_volumes':detached_volume_details,
            'vnic_attachments':pick(vnic_att,{'id':'id','state':'lifecycle_state','vnic':'vnic_id'}),
            'active_boot_volumes':pick(boots,{'id':'id','name':'display_name','state':'lifecycle_state','gb':'size_in_gbs','created':'time_created'},{'AVAILABLE','PROVISIONING','RESTORING'}),
            'active_block_volumes':pick(vols,{'id':'id','name':'display_name','state':'lifecycle_state','gb':'size_in_gbs','created':'time_created'},{'AVAILABLE','PROVISIONING','RESTORING'}),
            'available_boot_backups':pick(boot_bak,{'id':'id','name':'display_name','state':'lifecycle_state','gb':'size_in_gbs','created':'time_created'},{'AVAILABLE','CREATING'}),
            'available_volume_backups':pick(vol_bak,{'id':'id','name':'display_name','state':'lifecycle_state','gb':'size_in_gbs','created':'time_created'},{'AVAILABLE','CREATING'}),
            'public_ips':pick(ips,{'id':'id','name':'display_name','ip':'ip_address','lifetime':'lifetime','state':'lifecycle_state','assigned':'assigned_entity_id'})
          }
          old=os.environ['OLD_PUBLIC_IP']
          report['old_public_ip_present']=any(x.get('ip')==old for x in report['public_ips'])
          tokens=('bridge-school-dds3-frankfurt','dds3-frankfurt','heavy')
          candidates=[]
          for kind in ('active_boot_volumes','active_block_volumes','available_boot_backups','available_volume_backups','public_ips'):
              for x in report[kind]:
                  text=json.dumps(x,ensure_ascii=False,default=str).lower()
                  if any(t in text for t in tokens) or old in text:
                      candidates.append({'kind':kind,**x})
          report['named_or_ip_candidates']=candidates
          print(json.dumps(report,indent=2,ensure_ascii=False,sort_keys=True,default=str))
          live=lambda xs: sum(x.get('state') not in ('TERMINATED','DETACHED') for x in xs)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('### Retired heavy Oracle read-only audit\n')
              f.write(f"- exact instance: {report['exact_instance']['state']}\n")
              f.write(f"- live boot attachments: {live(report['boot_attachments'])}\n")
              f.write(f"- live block attachments: {live(report['block_attachments'])}\n")
              f.write(f"- formerly attached block volumes: {json.dumps(report['formerly_attached_block_volumes'],default=str)}\n")
              f.write(f"- live VNIC attachments: {live(report['vnic_attachments'])}\n")
              f.write(f"- old public IP present: {report['old_public_ip_present']}\n")
              f.write(f"- named/IP deletion candidates: {len(candidates)}\n")
              f.write(f"- active boot volumes in compartment/AD: {len(report['active_boot_volumes'])}\n")
              f.write(f"- active block volumes in compartment/AD: {len(report['active_block_volumes'])}\n")
              f.write(f"- available boot backups: {len(report['available_boot_backups'])}\n")
              f.write(f"- available block backups: {len(report['available_volume_backups'])}\n")
          PY
