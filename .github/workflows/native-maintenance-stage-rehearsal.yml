name: Native maintenance read-only stage rehearsal

on:
  pull_request:
    paths:
      - '.github/workflows/native-maintenance-stages.yml'
      - '.github/workflows/native-maintenance-stage-rehearsal.yml'
      - 'ops/native_maintenance_*.py'
      - 'ops/native_driver_requirements.txt'
      - 'tests/test_native_maintenance_*.py'
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact reviewed main for this fixed launcher
        required: true
        type: string
      accepted_request_digest:
        description: Independently accepted SHA256 of the private canonical request
        required: true
        type: string
      request_store_action:
        description: Explicit first install is never a lost-ledger recovery action
        required: true
        default: rehearse
        type: choice
        options:
          - rehearse
          - first_install
          - candidate
          - inspect

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'olegmed1-art/bridge-video-free' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && inputs.expected_main_sha == github.sha && 'oracle-instance-workload-mutation' || format('native-rehearsal-noop-{0}', github.run_id) }}
  cancel-in-progress: false
  queue: max

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: python -m pip install --disable-pip-version-check -q 'psycopg[binary]==3.3.4'
      - shell: bash
        run: |
          set -Eeuo pipefail
          runtime_test_site="$(python -c 'from pathlib import Path; import psycopg; print(Path(psycopg.__file__).resolve().parent.parent)')"
          sudo -n env PYTHONPATH="$PWD:$runtime_test_site" "$(command -v python)" -m unittest discover -s tests -p 'test_native_maintenance_*.py' -v

  rehearsal:
    needs: contract
    if: >-
      github.repository == 'olegmed1-art/bridge-video-free' &&
      github.ref == 'refs/heads/main' && github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.event_name == 'workflow_dispatch' && inputs.expected_main_sha == github.sha
    environment: database-production
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    concurrency:
      group: oracle-light-backup-mutation
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: python -m pip install --disable-pip-version-check -q oci==2.186.0 'psycopg[binary]==3.3.4'
      - name: Run one fixed rehearsal command under HOLD
        env:
          OCI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_KEY: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_REGION: ${{ secrets.OCI_CLI_REGION }}
          ACCEPTED_REQUEST_DIGEST: ${{ inputs.accepted_request_digest }}
          REQUEST_STORE_ACTION: ${{ inputs.request_store_action }}
          NATIVE_OWNER_DATABASE_URL: ${{ secrets.LIGHT_MAINTENANCE_DATABASE_URL }}
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN: ${{ inputs.expected_main_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          python -m pip download --disable-pip-version-check --only-binary=:all: \
            --platform manylinux_2_28_aarch64 --platform manylinux_2_27_aarch64 \
            --python-version 312 --implementation cp --abi cp312 --no-deps \
            --require-hashes --index-url https://pypi.org/simple \
            -r ops/native_driver_requirements.txt --dest "$work/wheels"
          [[ -n "${SSH_PRIVATE_KEY:-}" ]]
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$work/key"
          unset SSH_PRIVATE_KEY
          ssh-keygen -y -P '' -f "$work/key" > "$work/public" 2>/dev/null
          bash ops/oracle_known_hosts_from_scan.sh 92.5.47.149 SHA256:XBR1x74uJ41BxmDF7Y9P20GjIjNbrYXqieV4c2MC0Go "$work/known_hosts"
          PYTHONPATH="$PWD:$PWD/ops" python ops/native_maintenance_stage_launcher.py rehearsal "$work/key" "$work/known_hosts" "$work/wheels"
