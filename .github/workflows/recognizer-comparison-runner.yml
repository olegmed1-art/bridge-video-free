name: Recognizer comparison runner

on:
  pull_request:
    paths:
      - 'tools/recognizer_compare.py'
      - 'tests/test_recognizer_compare.py'
      - 'docs/recognizer-comparison-runner.md'
      - '.github/workflows/recognizer-comparison-runner.yml'

permissions:
  contents: read

jobs:
  offline-recorder:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: runner
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 546f52d6bab7f836dcb4f6325a6caa79c982f16e
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 74c98215d433c0383a8cc1021b4a24f9caade8fe
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install bounded dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest==8.4.1 numpy==2.2.6 opencv-python-headless==4.11.0.86
          Pillow==11.2.1 requests==2.32.3 google-auth==2.40.3
          reportlab==4.4.0 PyMuPDF==1.26.0 PyYAML==6.0.2 'psycopg[binary]==3.3.4'
      - name: Verify exact heads and run recorder controls
        env:
          EXPECTED_RUNNER: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git -C runner rev-parse HEAD)" = "$EXPECTED_RUNNER"
          test "$(git -C baseline rev-parse HEAD)" = 546f52d6bab7f836dcb4f6325a6caa79c982f16e
          test "$(git -C candidate rev-parse HEAD)" = 74c98215d433c0383a8cc1021b4a24f9caade8fe
          export RECOGNIZER_BASELINE_ROOT="$PWD/baseline"
          export RECOGNIZER_CANDIDATE_ROOT="$PWD/candidate"
          mkdir results
          git -C runner rev-parse HEAD > results/runner-sha.txt
          git -C baseline rev-parse HEAD > results/baseline-sha.txt
          git -C candidate rev-parse HEAD > results/candidate-sha.txt
          cd runner
          python -B -m pytest -q -ra -p no:cacheprovider tests/test_recognizer_compare.py --junitxml=../results/runner.xml
      - name: Refuse skips
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse('results/runner.xml').iter('testcase'))
          assert cases and not any(c.find('skipped') is not None for c in cases)
          print({'executed_controls': len(cases), 'real_video_accuracy_evaluated': False})
          PY
      - name: Retain only public synthetic test receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recognizer-runner-${{ github.event.pull_request.head.sha }}
          path: results/
          retention-days: 14
