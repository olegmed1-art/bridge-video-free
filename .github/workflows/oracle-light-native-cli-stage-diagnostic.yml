name: Oracle Light native CLI stage diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/oracle-light-native-cli-stage-diagnostic.yml'
      - 'ops/oracle_light_native_cli_stage_once.py'
      - 'tests/test_oracle_light_native_cli_stage_once.py'
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact reviewed current main SHA for a read-only stage diagnostic
        required: true
        type: string

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: |
          python -m unittest -q tests.test_oracle_light_native_cli_stage_once
          ruby -e 'require "yaml"; YAML.parse_file(ARGV.fetch(0))' .github/workflows/oracle-light-native-cli-stage-diagnostic.yml

  diagnose:
    needs: contract
    if: >-
      github.repository == 'olegmed1-art/bridge-video-free' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.actor == github.repository_owner &&
      inputs.expected_main_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Report fixed guard codes without npm or credential access
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          umask 077
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          [[ -n "${SSH_PRIVATE_KEY:-}" ]]
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$work/key"
          unset SSH_PRIVATE_KEY
          ssh-keygen -y -P '' -f "$work/key" > "$work/public" 2>/dev/null
          bash ops/oracle_known_hosts_from_scan.sh 92.5.47.149 SHA256:XBR1x74uJ41BxmDF7Y9P20GjIjNbrYXqieV4c2MC0Go "$work/known_hosts"
          ssh -F /dev/null -i "$work/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$work/known_hosts" -o ConnectTimeout=15 -o ConnectionAttempts=1 ubuntu@92.5.47.149 'python3 - --diagnose' < ops/oracle_light_native_cli_stage_once.py
