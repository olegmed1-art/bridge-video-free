name: Secret gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  committed-secret-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Check tracked secret material
        run: bash ops/check_no_committed_secrets.sh
