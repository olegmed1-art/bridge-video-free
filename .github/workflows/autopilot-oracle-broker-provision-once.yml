name: One-shot Oracle Autopilot broker boundary provision

on:
  push:
    branches:
      - codex/oracle-autopilot-lite-shadow
    paths:
      - '.github/workflows/autopilot-oracle-broker-provision-once.yml'

permissions:
  contents: read

concurrency:
  group: oracle-instance-workload-mutation
  cancel-in-progress: false

jobs:
  provision:
    if: github.repository == 'olegmed1-art/bridge-video-free'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ORACLE_HOST: 158.180.47.161
      ORACLE_USER: ubuntu
      EXPECTED_FINGERPRINT: SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk
      SOURCE_REV: 2735ecbb4a455bec58007064210913c341795896
      EXPECTED_SOURCE_TREE: d4eebbeee2921bd0d9ba01ca68e0006843e1d414
      VERCEL_PROJECT: bridge-school-autopilot
      VERCEL_SCOPE: olegmed1-4368s-projects
      NODE_IMAGE: node:24.19.0-bookworm
      VERCEL_CLI_VERSION: 59.10.0
      SSH_KEY_ORACLE: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
      SSH_KEY_OCI: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
      SSH_KEY_VM: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
      SSH_KEY_BRIDGE: ${{ secrets.BRIDGE_SCHOOL_ORACLE_SSH_PRIVATE_KEY }}
      SSH_KEY_ORACLE_ALT: ${{ secrets.ORACLE_SSH_KEY }}
      SSH_KEY_OCI_ALT: ${{ secrets.OCI_SSH_KEY }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Resolve verified Oracle SSH credential
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/oracle-broker-provision"
          mkdir -p "$work"
          known="$work/known_hosts"
          ops/oracle_known_hosts_from_scan.sh "$ORACLE_HOST" "$EXPECTED_FINGERPRINT" "$known"

          selected=''
          index=0
          for name in SSH_KEY_ORACLE SSH_KEY_OCI SSH_KEY_VM SSH_KEY_BRIDGE SSH_KEY_ORACLE_ALT SSH_KEY_OCI_ALT; do
            raw="${!name:-}"
            [[ -n "$raw" ]] || continue
            index=$((index + 1))
            base="$work/key-$index"
            printf '%s\n' "$raw" > "$base.raw"
            tr -d '\r' < "$base.raw" > "$base.crlf"
            printf '%s' "$raw" | python -c '
          import sys
          raw = sys.stdin.read()
          path = sys.argv[1]
          if "\\n" in raw and "\n" not in raw:
              raw = raw.replace("\\r", "").replace("\\n", "\n")
          with open(path, "w", newline="\n") as handle:
              handle.write(raw)
              if not raw.endswith("\n"):
                  handle.write("\n")
          ' "$base.escaped"
            for key in "$base.raw" "$base.crlf" "$base.escaped"; do
              chmod 0600 "$key"
              ssh-keygen -y -f "$key" >/dev/null 2>&1 || continue
              if ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes \
                   -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" \
                   -o ConnectTimeout=10 "$ORACLE_USER@$ORACLE_HOST" true >/dev/null 2>&1; then
                selected="$key"
                break 2
              fi
            done
          done
          [[ -n "$selected" ]]
          cp "$selected" "$work/id_oracle"
          chmod 0600 "$work/id_oracle"
          echo "key=$work/id_oracle" >> "$GITHUB_OUTPUT"
          echo "known=$known" >> "$GITHUB_OUTPUT"

      - name: Generate, deploy, and install bounded Preview boundary
        id: provision
        shell: bash
        run: |
          set -euo pipefail
          ssh -tt -i '${{ steps.ssh.outputs.key }}' \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile='${{ steps.ssh.outputs.known }}' -o ConnectTimeout=15 \
            "$ORACLE_USER@$ORACLE_HOST" \
            "sudo -n env SOURCE_REV='$SOURCE_REV' EXPECTED_SOURCE_TREE='$EXPECTED_SOURCE_TREE' VERCEL_PROJECT='$VERCEL_PROJECT' VERCEL_SCOPE='$VERCEL_SCOPE' NODE_IMAGE='$NODE_IMAGE' VERCEL_CLI_VERSION='$VERCEL_CLI_VERSION' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          repo=/opt/bridge-school/bridge-video-free
          service=school-autopilot-shadow.service
          final=/opt/bridge-school/school-autopilot/autopilot-broker.env
          container="autopilot-broker-provision-$(date +%s)"
          work="$(mktemp -d /var/tmp/autopilot-broker-provision.XXXXXXXX)"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            if [[ "$work" == /var/tmp/autopilot-broker-provision.* && -d "$work" ]]; then
              find "$work" -depth -delete
            fi
          }
          trap cleanup EXIT HUP INT TERM

          systemctl is-active --quiet "$service"
          command -v docker >/dev/null
          [[ -d "$repo/.git" ]]
          [[ ! -e "$final" ]]

          git -C "$repo" fetch --quiet --no-tags origin "$SOURCE_REV"
          git -C "$repo" cat-file -e "$SOURCE_REV^{commit}"
          actual_tree="$(git -C "$repo" rev-parse "$SOURCE_REV:autopilot_token_broker_service")"
          [[ "$actual_tree" == "$EXPECTED_SOURCE_TREE" ]]
          mkdir -p "$work/source" "$work/output"
          chmod 0700 "$work/source" "$work/output"
          git -C "$repo" archive "$SOURCE_REV" autopilot_token_broker_service \
            | tar -x -C "$work/source" --strip-components=1

          cat > "$work/run.sh" <<'CONTAINER'
          #!/bin/sh
          set -eu
          umask 077
          export HOME=/tmp/vercel-home
          export npm_config_cache=/tmp/npm-cache
          export NO_UPDATE_NOTIFIER=1
          export VERCEL_TELEMETRY_DISABLED=1
          export NO_COLOR=1
          mkdir -p "$HOME" /tmp/source
          cp -a /input/. /tmp/source/
          cd /tmp/source

          npm install --global --no-audit --no-fund "vercel@${VERCEL_CLI_VERSION}"
          vercel --version
          vercel login
          vercel link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" >/dev/null

          node -e "process.stdout.write(require('node:crypto').randomBytes(48).toString('base64url'))" > /tmp/broker-secret
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const home = process.env.HOME;
          const candidates = [
            path.join(home, '.local/share/com.vercel.cli/auth.json'),
            path.join(home, '.vercel/auth.json'),
          ];
          let token = '';
          for (const candidate of candidates) {
            if (!fs.existsSync(candidate)) continue;
            const payload = JSON.parse(fs.readFileSync(candidate, 'utf8'));
            if (typeof payload.token === 'string') token = payload.token;
          }
          if (!/^[A-Za-z0-9._-]{20,512}$/.test(token)) {
            throw new Error('Vercel CLI credential unavailable');
          }
          fs.writeFileSync('/tmp/vercel-token', token, {encoding: 'utf8', flag: 'wx', mode: 0o600});

          const broker = fs.readFileSync('/tmp/broker-secret', 'utf8');
          if (!/^[A-Za-z0-9_-]{43,512}$/.test(broker)) {
            throw new Error('generated broker secret invalid');
          }
          fs.writeFileSync('/tmp/env-request.json', JSON.stringify([{
            key: 'AUTOPILOT_TOKEN_BROKER_SECRET',
            value: broker,
            type: 'sensitive',
            target: ['preview'],
            comment: 'Oracle Autopilot Preview broker ingress',
          }]), {encoding: 'utf8', flag: 'wx', mode: 0o600});
          fs.writeFileSync('/tmp/protection-request.json', JSON.stringify({
            generate: {note: 'Oracle Autopilot Preview canary'},
          }), {encoding: 'utf8', flag: 'wx', mode: 0o600});
          NODE

          vercel_token="$(cat /tmp/vercel-token)"
          curl -fsS --max-time 30 --request POST \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT/env?upsert=true&slug=$VERCEL_SCOPE" \
            -H "Authorization: Bearer $vercel_token" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/env-request.json > /tmp/env-response.json
          curl -fsS --max-time 30 --request PATCH \
            "https://api.vercel.com/v1/projects/$VERCEL_PROJECT/protection-bypass?slug=$VERCEL_SCOPE" \
            -H "Authorization: Bearer $vercel_token" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/protection-request.json > /tmp/protection-response.json
          unset vercel_token

          node - <<'NODE'
          const fs = require('node:fs');
          const envPayload = JSON.parse(fs.readFileSync('/tmp/env-response.json', 'utf8'));
          const entries = Array.isArray(envPayload.created)
            ? envPayload.created
            : [envPayload.created];
          if (!entries.some(item => item && item.key === 'AUTOPILOT_TOKEN_BROKER_SECRET')) {
            throw new Error('broker environment upsert response invalid');
          }
          if (Array.isArray(envPayload.failed) && envPayload.failed.length !== 0) {
            throw new Error('broker environment upsert reported failures');
          }
          const protection = JSON.parse(fs.readFileSync('/tmp/protection-response.json', 'utf8'));
          const boundary = protection && protection.protectionBypass;
          const candidates = [];
          if (typeof boundary === 'string') candidates.push(boundary);
          if (boundary && typeof boundary === 'object') {
            for (const [key, value] of Object.entries(boundary)) {
              if (/^[A-Za-z0-9_-]{32,512}$/.test(key)) candidates.push(key);
              if ((key === 'secret' || key === 'value') && typeof value === 'string') {
                candidates.push(value);
              }
            }
          }
          const secret = [...new Set(candidates)].find(
            value => /^[A-Za-z0-9_-]{32,512}$/.test(value),
          );
          if (!secret) {
            throw new Error('automation bypass response invalid');
          }
          fs.writeFileSync('/tmp/bypass-secret', secret, {encoding: 'utf8', flag: 'wx', mode: 0o600});
          NODE

          preview_url="$(vercel deploy --yes --target=preview --scope "$VERCEL_SCOPE")"
          case "$preview_url" in
            https://bridge-school-autopilot-*-olegmed1-4368s-projects.vercel.app) ;;
            *) echo 'preview_url_invalid' >&2; exit 71 ;;
          esac

          broker="$(cat /tmp/broker-secret)"
          bypass="$(cat /tmp/bypass-secret)"
          case "$broker" in *[!A-Za-z0-9_-]*|'') exit 72;; esac
          case "$bypass" in *[!A-Za-z0-9_-]*|'') exit 73;; esac
          [ "${#broker}" -ge 43 ] && [ "${#broker}" -le 512 ]
          [ "${#bypass}" -ge 32 ] && [ "${#bypass}" -le 512 ]

          health="$(curl -fsS --max-time 20 \
            -H "x-vercel-protection-bypass: $bypass" "$preview_url/healthz")"
          HEALTH_JSON="$health" node - <<'NODE'
          const payload = JSON.parse(process.env.HEALTH_JSON);
          const expected = {
            status: 'ok',
            service: 'school-autopilot-github-token-broker',
            service_version: '0.2.0',
            preview_only: true,
            production_mutations_enabled: false,
            github_token_broker_enabled: true,
            raw_installation_token_exposed: false,
            bounded_draft_executor_enabled: true,
          };
          for (const [key, value] of Object.entries(expected)) {
            if (payload[key] !== value) throw new Error(`health mismatch: ${key}`);
          }
          NODE

          {
            printf 'AUTOPILOT_TOKEN_BROKER_URL=%s/v1/github/draft-repair\n' "$preview_url"
            printf 'AUTOPILOT_TOKEN_BROKER_SECRET=%s\n' "$broker"
            printf 'AUTOPILOT_VERCEL_BYPASS_SECRET=%s\n' "$bypass"
          } > /output/autopilot-broker.env
          chmod 0600 /output/autopilot-broker.env
          unset broker bypass health
          CONTAINER
          chmod 0700 "$work/run.sh"

          docker pull "$NODE_IMAGE" >/dev/null
          resolved_image="$(docker image inspect --format '{{index .RepoDigests 0}}' "$NODE_IMAGE")"
          [[ "$resolved_image" == node@sha256:* ]]
          docker run --rm -it --name "$container" --cpus=1 --memory=1g --pids-limit=256 \
            --cap-drop=ALL --security-opt=no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=1024m \
            --mount type=bind,src="$work/source",dst=/input,readonly \
            --mount type=bind,src="$work/output",dst=/output \
            --mount type=bind,src="$work/run.sh",dst=/runner/run.sh,readonly \
            -e VERCEL_PROJECT -e VERCEL_SCOPE -e VERCEL_CLI_VERSION -e TERM=xterm \
            "$resolved_image" /bin/sh /runner/run.sh

          candidate="$work/output/autopilot-broker.env"
          python3 - "$candidate" <<'PY'
          import re
          import sys
          values = {}
          for line in open(sys.argv[1], encoding='utf-8'):
              name, value = line.rstrip('\n').split('=', 1)
              assert name not in values
              values[name] = value
          assert set(values) == {
              'AUTOPILOT_TOKEN_BROKER_URL',
              'AUTOPILOT_TOKEN_BROKER_SECRET',
              'AUTOPILOT_VERCEL_BYPASS_SECRET',
          }
          assert re.fullmatch(
              r'https://bridge-school-autopilot-[a-z0-9]+-olegmed1-4368s-projects\.vercel\.app/v1/github/draft-repair',
              values['AUTOPILOT_TOKEN_BROKER_URL'],
          )
          assert re.fullmatch(r'[A-Za-z0-9_-]{43,512}', values['AUTOPILOT_TOKEN_BROKER_SECRET'])
          assert re.fullmatch(r'[A-Za-z0-9_-]{32,512}', values['AUTOPILOT_VERCEL_BYPASS_SECRET'])
          PY
          install -m 0600 -o root -g root "$candidate" "$final"
          [[ "$(stat -c '%U:%G:%a' "$final")" == root:root:600 ]]
          systemctl is-active --quiet "$service"
          echo 'AUTOPILOT_BROKER_SECRET_PROVISION=PASS'
          echo 'AUTOPILOT_BROKER_ENV_MODE=root:root:600'
          echo 'AUTOPILOT_BROKER_PREVIEW_HEALTH=PASS'
          echo 'AUTOPILOT_SERVICE_REMAINED_ACTIVE=YES'
          echo 'ORACLE_INSTANCE_STOP_REQUESTED=NO'
          REMOTE

      - name: Confirm bounded provisioning result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          printf 'production_requested=false\n'
          printf 'merge_requested=false\n'
          printf 'video_requested=false\n'
          printf 'train_requested=false\n'
          printf 'oracle_instance_stop_requested=false\n'
          [[ '${{ steps.provision.outcome }}' == 'success' ]]
