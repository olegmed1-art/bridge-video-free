name: Autopilot Universal Video P1 isolated registration

on:
  push:
    branches: [autopilot/uv-p1-dispatch-20260901]
    paths: ['.github/workflows/autopilot-uv-p1-register-isolated.yml']

permissions:
  contents: read

concurrency:
  group: autopilot-universal-video-p1-isolated-registration
  cancel-in-progress: false

jobs:
  register:
    if: github.repository == 'olegmed1-art/bridge-video-free'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: database-production
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      PROJECT_ID: misty-poetry-18012774
      TEMP_BRANCH_ID: br-still-tooth-b1ilkfcj
      PRODUCTION_BRANCH_ID: br-cold-moon-a1sgkzfd
      MIGRATION_ROLE: autopilot_migration_owner_login
      RUNTIME_TASK_KEY: uv-p1-runtime-pr997-1eeaa3ed-20260901
      RUNTIME_PR: '997'
      RUNTIME_HEAD: 1eeaa3ed27506237ff76b07c94e29523eccf8f79
      INTAKE_TASK_KEY: uv-p1-intake-pr1000-8f1ace18-20260901
      INTAKE_PR: '1000'
      INTAKE_HEAD: 8f1ace183e90b7ff2454b669e4c9013bcc29be1e
      INTEGRATION_TASK_KEY: uv-p1-integration-pr1047-621ab073-20260901
      INTEGRATION_PR: '1047'
      INTEGRATION_HEAD: 621ab073418b3f3d1b75cb6abb074dba4ea305cb
    steps:
      - name: Checkout exact dispatcher source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client >/dev/null

      - name: Resolve and verify only the temporary Neon branch
        id: neon
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "${NEON_API_KEY:-}" ]] || { echo 'UV_NEON_VERIFY_SECRET_MISSING'; exit 1; }
          [[ "$TEMP_BRANCH_ID" != "$PRODUCTION_BRANCH_ID" ]] || { echo 'UV_NEON_VERIFY_PRODUCTION_GUARD_FAILED'; exit 1; }
          api="https://console.neon.tech/api/v2/projects/$PROJECT_ID"
          auth=(-H "Authorization: Bearer $NEON_API_KEY" -H 'Accept: application/json')
          branch_json="$(curl -fsS --retry 2 --retry-all-errors --max-time 20 "${auth[@]}" "$api/branches/$TEMP_BRANCH_ID")"
          role_json="$(curl -fsS --retry 2 --retry-all-errors --max-time 20 "${auth[@]}" "$api/branches/$TEMP_BRANCH_ID/roles/$MIGRATION_ROLE")"
          uri_json="$(curl -fsS --retry 2 --retry-all-errors --max-time 20 "${auth[@]}" \
            "$api/connection_uri?branch_id=$TEMP_BRANCH_ID&database_name=neondb&role_name=$MIGRATION_ROLE&pooled=false")"
          uri="$(BRANCH_JSON="$branch_json" ROLE_JSON="$role_json" URI_JSON="$uri_json" python3 - <<'PY'
          import json, os, sys, urllib.parse
          bid = os.environ['TEMP_BRANCH_ID']
          role = os.environ['MIGRATION_ROLE']
          branch_payload = json.loads(os.environ['BRANCH_JSON'])
          role_payload = json.loads(os.environ['ROLE_JSON'])
          uri_payload = json.loads(os.environ['URI_JSON'])
          branch = branch_payload.get('branch', branch_payload)
          role_obj = role_payload.get('role', role_payload)
          uri = uri_payload.get('uri')
          checks = [
              (branch.get('id') == bid, 'UV_NEON_VERIFY_BRANCH_ID_MISMATCH'),
              (branch.get('default') is False, 'UV_NEON_VERIFY_BRANCH_DEFAULT_UNSAFE'),
              (role_obj.get('name') == role, 'UV_NEON_VERIFY_ROLE_MISMATCH'),
              (isinstance(uri, str) and bool(uri), 'UV_NEON_VERIFY_URI_MISSING'),
          ]
          for ok, code in checks:
              if not ok:
                  print(code, file=sys.stderr)
                  raise SystemExit(1)
          parsed = urllib.parse.urlsplit(uri)
          field_checks = [
              (parsed.username == role, 'UV_NEON_VERIFY_URI_ROLE_MISMATCH'),
              ((parsed.path.lstrip('/') or 'neondb') == 'neondb', 'UV_NEON_VERIFY_DATABASE_MISMATCH'),
              ((parsed.hostname or '').lower().endswith('.neon.tech'), 'UV_NEON_VERIFY_HOST_MISMATCH'),
          ]
          for ok, code in field_checks:
              if not ok:
                  print(code, file=sys.stderr)
                  raise SystemExit(1)
          print(uri)
          PY
          )"
          echo "::add-mask::$uri"
          echo "database_url=$uri" >> "$GITHUB_OUTPUT"
          echo 'NEON_TARGET_BRANCH_VERIFIED=YES'
          echo 'NEON_PRODUCTION_BRANCH_TARGETED=NO'

      - name: Read-only Autopilot schema preflight
        env:
          DATABASE_URL: ${{ steps.neon.outputs.database_url }}
        shell: bash
        run: |
          set -Eeuo pipefail
          row="$(psql "$DATABASE_URL" -X -A -t -F '|' -v ON_ERROR_STOP=1 <<'SQL'
          SELECT current_database(),
                 current_user,
                 to_regclass('autopilot.task') IS NOT NULL,
                 to_regclass('autopilot.evidence') IS NOT NULL,
                 to_regprocedure('autopilot.create_shadow_task(text,text,jsonb,integer,bigint,text,text)') IS NOT NULL;
          SQL
          )"
          [[ "$row" == 'neondb|autopilot_migration_owner_login|t|t|t' ]] || { echo 'UV_AUTOPILOT_SCHEMA_PREFLIGHT_FAILED'; exit 1; }
          echo 'AUTOPILOT_SCHEMA_PREFLIGHT=PASS'
          echo 'MIGRATION_APPLIED=NO'
          echo 'PRODUCTION_MUTATION=NO'

      - name: Register three exact-head durable tasks
        id: tasks
        env:
          DATABASE_URL: ${{ steps.neon.outputs.database_url }}
        shell: bash
        run: |
          set -Eeuo pipefail
          register_task() {
            local label="$1" task_key="$2" pr_number="$3" head_sha="$4" owner="$5" zone="$6"
            local row task_id status created
            row="$(psql "$DATABASE_URL" -X -A -t -F '|' -v ON_ERROR_STOP=1 \
              -v task_key="$task_key" -v pr_number="$pr_number" -v head_sha="$head_sha" -v owner="$owner" -v zone="$zone" <<'SQL'
          SELECT task_id,status,created
            FROM autopilot.create_shadow_task(
              :'task_key',
              'GITHUB_CI_READ_ONLY_V1',
              jsonb_build_object(
                'repository', 'olegmed1-art/bridge-video-free',
                'pr_number', (:'pr_number')::integer,
                'expected_head_sha', :'head_sha',
                'require_draft', true,
                'dispatcher_owner', :'owner',
                'responsibility_zone', :'zone',
                'media_execution_allowed', false,
                'production_mutation_allowed', false
              ),
              10,
              0,
              'DIRECTOR_P1_20260901',
              'UV_READY_FOR_ONE_CANARY_DISPATCH'
            );
          SQL
            )"
            IFS='|' read -r task_id status created <<<"$row"
            [[ "$task_id" =~ ^[0-9a-f-]{36}$ ]] || { echo "UV_P1_${label^^}_REGISTRATION_INVALID"; exit 1; }
            echo "${label}_task_id=$task_id" >> "$GITHUB_OUTPUT"
            echo "UV_P1_${label^^}_TASK_ID=$task_id"
            echo "UV_P1_${label^^}_REGISTER_STATUS=$status"
            echo "UV_P1_${label^^}_REGISTER_CREATED=$created"
          }
          register_task runtime "$RUNTIME_TASK_KEY" "$RUNTIME_PR" "$RUNTIME_HEAD" 'runtime-owner-pr997' 'container-runtime-import-closure'
          register_task intake "$INTAKE_TASK_KEY" "$INTAKE_PR" "$INTAKE_HEAD" 'intake-owner-pr1000' 'intake-drive-terminal-evidence'
          register_task integration "$INTEGRATION_TASK_KEY" "$INTEGRATION_PR" "$INTEGRATION_HEAD" 'integration-owner-temp-neon-pr1047' 'neon-queue-oracle-safety-integration'
          echo 'AUTOPILOT_DURABLE_TASK_COUNT=3'

      - name: Capture durable registration receipt
        env:
          DATABASE_URL: ${{ steps.neon.outputs.database_url }}
          RUNTIME_TASK_ID: ${{ steps.tasks.outputs.runtime_task_id }}
          INTAKE_TASK_ID: ${{ steps.tasks.outputs.intake_task_id }}
          INTEGRATION_TASK_ID: ${{ steps.tasks.outputs.integration_task_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for id in "$RUNTIME_TASK_ID" "$INTAKE_TASK_ID" "$INTEGRATION_TASK_ID"; do
            row="$(psql "$DATABASE_URL" -X -A -t -F '|' -v ON_ERROR_STOP=1 -c \
              "SELECT task_id,status,task_key,task_type,COALESCE(terminal_reason_code,''),attempts FROM autopilot.task WHERE task_id='$id'::uuid;")"
            [[ -n "$row" ]] || { echo 'UV_P1_TASK_READBACK_FAILED'; exit 1; }
            echo "UV_P1_DURABLE_TASK=$row"
          done
          echo 'AUTOPILOT_DURABLE_REGISTRATION=PASS'
          echo 'REAL_VIDEO_EXECUTION=NO'
          echo 'DRIVE_WRITE=NO'
          echo 'PRODUCTION_MUTATION=NO'

      - name: Publish registration receipt
        if: ${{ always() }}
        env:
          RUNTIME_TASK_ID: ${{ steps.tasks.outputs.runtime_task_id }}
          INTAKE_TASK_ID: ${{ steps.tasks.outputs.intake_task_id }}
          INTEGRATION_TASK_ID: ${{ steps.tasks.outputs.integration_task_id }}
        shell: bash
        run: |
          {
            echo '### Universal Video P1 isolated Autopilot registration'
            echo "- dispatcher branch: \`$GITHUB_REF_NAME\` @ \`$GITHUB_SHA\`"
            echo "- temporary Neon branch: \`$TEMP_BRANCH_ID\`"
            echo '- production/default branch targeted: `NO`'
            echo '- migration applied: `NO`'
            echo "- runtime task: \`${RUNTIME_TASK_ID:-unresolved}\` — PR #$RUNTIME_PR @ \`$RUNTIME_HEAD\`"
            echo "- intake task: \`${INTAKE_TASK_ID:-unresolved}\` — PR #$INTAKE_PR @ \`$INTAKE_HEAD\`"
            echo "- integration task: \`${INTEGRATION_TASK_ID:-unresolved}\` — PR #$INTEGRATION_PR @ \`$INTEGRATION_HEAD\`"
            echo '- real media execution: `NO`'
            echo '- Drive write: `NO`'
            echo '- production mutation: `NO`'
          } >> "$GITHUB_STEP_SUMMARY"
