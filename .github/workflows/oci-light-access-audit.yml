name: OCI Light access audit

on:
  pull_request:
    paths:
      - '.github/workflows/oci-light-access-audit.yml'
      - 'ops/oci_light_access_audit.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/oci-light-access-audit.yml'
      - 'ops/oci_light_access_audit.py'

permissions:
  contents: read

concurrency:
  group: oci-light-access-readonly
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Validate read-only API allowlist
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          source = Path('ops/oci_light_access_audit.py').read_text()
          tree = ast.parse(source)
          allowed = {'compute': {'get_instance'}, 'iam': {'list_dynamic_groups', 'list_user_group_memberships', 'list_policies'}}
          seen = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Attribute) and isinstance(node.value, ast.Name) and node.value.id in allowed:
                  assert node.attr in allowed[node.value.id], node.attr
                  seen.add((node.value.id, node.attr))
          assert seen == {(client, method) for client, methods in allowed.items() for method in methods}
          scope = {'__name__': 'test'}
          exec(compile(tree, '<audit>', 'exec'), scope)
          assert scope['exact_light_rule']("instance.id = '" + scope['LIGHT'] + "'")
          assert not scope['exact_light_rule']("instance.compartment.id = '" + scope['TENANCY'] + "'")
          assert not scope['exact_light_rule']("instance.id = 'other'")
          assert scope['scalar']('region=eu-frankfurt-1', 'region') == 'eu-frankfurt-1'
          print('READ_ONLY_CONTRACT_PASS')
          PY
      - name: Install official SDK for offline configuration regression
        run: python -m pip install --disable-pip-version-check -q oci==2.186.0
      - name: Verify real SDK clients with disposable in-memory key, no API calls
        run: |
          python - <<'PY'
          import importlib.util
          from cryptography.hazmat.primitives.asymmetric import rsa
          from cryptography.hazmat.primitives import serialization
          spec = importlib.util.spec_from_file_location('audit', 'ops/oci_light_access_audit.py')
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          key = rsa.generate_private_key(public_exponent=65537, key_size=2048)
          pem = key.private_bytes(serialization.Encoding.PEM, serialization.PrivateFormat.PKCS8, serialization.NoEncryption()).decode()
          config = {'user': 'ocid1.user.oc1..test', 'tenancy': m.TENANCY, 'fingerprint': ':'.join(['00'] * 16), 'region': 'eu-frankfurt-1'}
          compute, iam = m.clients(config, pem)
          print('REAL_SDK_OFFLINE_CONFIG_PASS')
          PY

  audit:
    if: github.event_name == 'push' && github.repository == 'olegmed1-art/bridge-video-free'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install official Oracle SDK
        run: python -m pip install --disable-pip-version-check -q oci==2.186.0
      - name: Read sanitized Light and IAM evidence
        env:
          OCI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_KEY: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_REGION: ${{ secrets.OCI_CLI_REGION }}
        run: python ops/oci_light_access_audit.py
