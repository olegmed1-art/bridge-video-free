name: Light 0355 retirement contract

on:
  pull_request:
    paths:
      - 'ops/autopilot_light_0355_*.sql'
      - 'ops/autopilot_light_0355_retirement.md'
      - 'tests/test_light_0355_retirement_contract.py'
      - '.github/workflows/light-0355-retirement-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Parse SQL and verify exact fence predicate
        run: |
          python -m pip install pytest 'pglast>=7,<8'
          python -m pytest -q tests/test_light_0355_retirement_contract.py
