name: Oracle Light baseline backup
on:
  pull_request:
    paths: ['.github/workflows/oracle-light-baseline-backup.yml', 'ops/oci_light_first_backup.py']
  push:
    branches: [main]
    paths: ['.github/workflows/oracle-light-baseline-backup.yml', 'ops/oci_light_first_backup.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oracle-light-backup-mutation
  cancel-in-progress: false
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: python -m py_compile ops/oci_light_first_backup.py ops/oci_storage_audit.py
  backup:
    needs: contract
    if: github.repository == 'olegmed1-art/bridge-video-free' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: python -m pip install --disable-pip-version-check -q oci==2.186.0
      - name: Create or resume one free-slot boot backup
        env:
          OCI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_KEY: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_REGION: ${{ secrets.OCI_CLI_REGION }}
        run: python ops/oci_light_first_backup.py
