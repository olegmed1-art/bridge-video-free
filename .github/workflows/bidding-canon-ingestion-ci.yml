name: Bidding Canon Ingestion CI

on:
  pull_request:
    paths:
      - 'docs/research/bidding-engine/canon-ingestion/**'
      - 'tests/test_bidding_canon_ingestion_contract.py'
      - '.github/workflows/bidding-canon-ingestion-ci.yml'
  push:
    branches: [main]
    paths:
      - 'docs/research/bidding-engine/canon-ingestion/**'
      - 'tests/test_bidding_canon_ingestion_contract.py'
      - '.github/workflows/bidding-canon-ingestion-ci.yml'

permissions:
  contents: read

jobs:
  ingestion-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Run canon ingestion contract
        run: python tests/test_bidding_canon_ingestion_contract.py
