name: Oracle Light serial native consumer contracts

on:
  pull_request:
    paths:
      - '.github/workflows/light-native-lane.yml'
      - 'oracle_autopilot/light_native_*.py'
      - 'oracle_autopilot/codex_cli_*.py'
      - 'ops/light_native_lane_owner.py'
      - 'database/light_native_pilot_intake.py'
      - 'tests/test_oracle_autopilot_light_native_*.py'
      - 'tests/test_light_native_lane_owner.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/light-native-lane.yml'
      - 'oracle_autopilot/light_native_*.py'
      - 'oracle_autopilot/codex_cli_*.py'
      - 'ops/light_native_lane_owner.py'
      - 'database/light_native_pilot_intake.py'
      - 'tests/test_oracle_autopilot_light_native_*.py'
      - 'tests/test_light_native_lane_owner.py'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest==8.4.2' 'psycopg[binary]==3.3.4'
      - name: Exercise serial handoff, durable quarantine and existing native contracts
        run: >-
          python -m pytest -q
          tests/test_oracle_autopilot_light_native_lane.py
          tests/test_light_native_lane_owner.py
          tests/test_oracle_autopilot_light_native_pilot.py
          tests/test_oracle_autopilot_light_native_adapter.py
          tests/test_oracle_autopilot_codex_cli_delivery.py
          tests/test_light_native_pilot_intake.py
