name: DDS v2.3 one-time cleanup

on:
  push:
    branches: [dds-training-local]
    paths:
      - '.github/workflows/dds-v23-one-time-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dds-training-local

      - name: Remove superseded draft self-tests and this one-time workflow
        run: |
          set -euo pipefail
          rm -f \
            dds_training/v23_selftest.py \
            dds_training/algorithm_review_v23_selftest.py \
            dds_training/run_stage_v23_selftest.py \
            .github/workflows/dds-v23-one-time-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to clean.'
            exit 0
          fi
          git commit -m 'Remove superseded DDS v2.3 draft self-tests'
          git push origin HEAD:dds-training-local
