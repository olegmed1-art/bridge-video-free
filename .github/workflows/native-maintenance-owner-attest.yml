name: Native maintenance owner read-only attestation

on:
  pull_request:
    paths:
      - '.github/workflows/native-maintenance-owner-attest.yml'
      - 'ops/native_maintenance_owner_attest.py'
      - 'ops/native_maintenance_registry_scope.py'
      - 'ops/oracle_autopilot_source_preflight.py'
      - 'database/native_cli_permission_engine.py'
      - 'tests/test_native_maintenance_owner_attest.py'
      - 'tests/test_native_maintenance_registry_scope.py'
      - 'tests/test_native_cli_connection_parameters.py'
      - 'tools/canon_auth/owner_probe.py'
      - 'tools/canon_auth/resident_preflight.py'
      - 'tools/canon_auth/test_owner_probe.py'
      - 'tools/canon_auth/test_owner_resident.py'
      - 'tools/canon_auth/installation_checks.py'
      - 'tools/canon_auth/test_installed_owner_workflow.py'
  workflow_dispatch:
    inputs:
      probe_scope:
        description: Explicit read-only inventory scope
        required: true
        type: choice
        default: maintenance
        options: [maintenance, canon-readonly]
      expected_probe_sha:
        description: Reviewed exact main SHA for canon-readonly; must equal expected_main_sha
        required: false
        type: string
      expected_main_sha:
        description: Exact reviewed main for read-only owner-path verification
        required: true
        type: string

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.3.4' pytest==8.4.2 PyYAML==6.0.2
      - run: python -m pytest -q tools/canon_auth/test_owner_probe.py tools/canon_auth/test_owner_resident.py tools/canon_auth/test_installed_owner_workflow.py
      - run: python -m unittest discover -s tests -p 'test_native_maintenance_owner_attest.py' -v
      - run: python -m unittest discover -s tests -p 'test_native_maintenance_registry_scope.py' -v
      - run: python -m unittest discover -s tests -p 'test_native_cli_connection_parameters.py' -v

  attest:
    needs: contract
    if: >-
      github.repository == 'olegmed1-art/bridge-video-free' &&
      github.ref == 'refs/heads/main' && github.actor == github.repository_owner &&
      github.event_name == 'workflow_dispatch' && inputs.probe_scope == 'maintenance' &&
      inputs.expected_main_sha == github.sha
    environment: database-production
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.3.4'
      - name: Verify exact production owner path without mutations
        env:
          NATIVE_OWNER_DATABASE_URL: ${{ secrets.LIGHT_MAINTENANCE_DATABASE_URL || secrets.NEON_DATABASE_URL }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN: ${{ inputs.expected_main_sha }}
        run: python -m ops.native_maintenance_owner_attest
      - name: Observe registry workflow credential and catalog without writes
        env:
          NATIVE_REGISTRY_DATABASE_URL: ${{ secrets.LIGHT_MAINTENANCE_DATABASE_URL }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN: ${{ inputs.expected_main_sha }}
        run: python -m ops.native_maintenance_registry_scope

  canon-owner-probe:
    needs: contract
    if: >-
      github.repository == 'olegmed1-art/bridge-video-free' &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner && github.triggering_actor == github.repository_owner &&
      github.event_name == 'workflow_dispatch' && inputs.probe_scope == 'canon-readonly' &&
      inputs.expected_probe_sha == github.sha &&
      inputs.expected_main_sha == github.sha
    environment: database-production
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.3.4'
      - name: Inventory existing owner connection without writes
        env:
          NATIVE_OWNER_DATABASE_URL: ${{ secrets.LIGHT_MAINTENANCE_DATABASE_URL || secrets.NEON_DATABASE_URL }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN: ${{ inputs.expected_main_sha }}
          EXPECTED_PROBE_SHA: ${{ inputs.expected_probe_sha }}
          OWNER_PROBE_SCOPE: ${{ inputs.probe_scope }}
        run: python -m tools.canon_auth.owner_probe
