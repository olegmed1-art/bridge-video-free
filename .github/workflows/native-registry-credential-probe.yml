name: Backup source preflight ONLY (review harness)

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Current main SHA (must be the reviewed baseline)
        required: true
        type: string
      expected_review_sha:
        description: Exact published review SHA; no backup is permitted
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: backup-source-preflight-only-20261001
  cancel-in-progress: false

jobs:
  preflight_only:
    if: >-
      github.repository == 'olegmed1-art/bridge-video-free' &&
      github.ref == 'refs/heads/test/neon-backup-maintenance-review-20261001' &&
      github.event_name == 'workflow_dispatch' &&
      github.actor == 'olegmed1-art' && github.triggering_actor == 'olegmed1-art' &&
      github.run_attempt == 1 && inputs.expected_review_sha == github.sha &&
      inputs.expected_main_sha == '1440920191e1778fb9a9ba24e6701937a1a7459c'
    environment: database-production
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: One read-only preflight and sanitized receipt
        env:
          DATABASE_URL: ${{ secrets.LIGHT_MAINTENANCE_DATABASE_URL }}
          EXPECTED_MAIN: ${{ inputs.expected_main_sha }}
          EXPECTED_REVIEW: ${{ inputs.expected_review_sha }}
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 100s python -m ops.neon_backup_preflight_once
