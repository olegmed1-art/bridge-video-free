name: Autopilot Universal Video P1 task registration

on:
  push:
    branches: [codex/oracle-autopilot-lite-shadow]
    paths: ['.github/workflows/autopilot-uv-p1-register.yml']

permissions:
  contents: read

concurrency:
  group: autopilot-universal-video-p1-registration
  cancel-in-progress: false

jobs:
  register:
    if: github.repository == 'olegmed1-art/bridge-video-free'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: database-production
    env:
      SOURCE_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      PROJECT_ID: misty-poetry-18012774
      TEMP_BRANCH_ID: br-still-tooth-b1ilkfcj
      PRODUCTION_BRANCH_ID: br-wispy-lab-b1rq54of
      TEMP_ENDPOINT_ID: ep-floral-field-b1pjs2of
      REPOSITORY: olegmed1-art/bridge-video-free
      RUNTIME_TASK_KEY: uv-p1-runtime-pr997-545ef013-20260901
      RUNTIME_PR: '997'
      RUNTIME_HEAD: 545ef0135e3cfe436b918c3ec26f5e2b77500977
      INTAKE_TASK_KEY: uv-p1-intake-pr1000-5af0675a-20260901
      INTAKE_PR: '1000'
      INTAKE_HEAD: 5af0675a9e13a9725348661be297abc5f52ff0e4
      IDLE_TASK_KEY: uv-p1-idle-pr1047-621ab073-20260901
      IDLE_PR: '1047'
      IDLE_HEAD: 621ab073418b3f3d1b75cb6abb074dba4ea305cb
    steps:
      - name: Checkout exact Autopilot source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client >/dev/null

      - name: Derive exact temporary-branch DSN without contacting source host
        id: neon
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${SOURCE_DATABASE_URL:-}" || { echo 'NEON_DATABASE_URL unavailable'; exit 1; }
          [[ "$TEMP_BRANCH_ID" != "$PRODUCTION_BRANCH_ID" ]]
          SOURCE_DATABASE_URL="$SOURCE_DATABASE_URL" TEMP_ENDPOINT_ID="$TEMP_ENDPOINT_ID" python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib, os, re, urllib.parse

          raw = os.environ["SOURCE_DATABASE_URL"]
          endpoint_id = os.environ["TEMP_ENDPOINT_ID"]
          parsed = urllib.parse.urlsplit(raw)
          source_host = (parsed.hostname or "").lower()
          assert parsed.scheme in {"postgres", "postgresql"}
          assert source_host.endswith(".neon.tech")
          assert re.fullmatch(r"ep-[a-z0-9-]+(?:-pooler)?\..+\.neon\.tech", source_host)
          first, suffix = source_host.split(".", 1)
          pooled = first.endswith("-pooler")
          temp_endpoint = endpoint_id + ("-pooler" if pooled else "")
          temp_host = temp_endpoint + "." + suffix
          assert temp_host != source_host
          user = urllib.parse.quote(parsed.username or "", safe="")
          password = urllib.parse.quote(parsed.password or "", safe="")
          assert user and password
          port = f":{parsed.port}" if parsed.port else ""
          temp = urllib.parse.urlunsplit(
              (parsed.scheme, f"{user}:{password}@{temp_host}{port}", parsed.path, parsed.query, parsed.fragment)
          )
          print(f"::add-mask::{temp}")
          print(f"database_url={temp}")
          print(f"temp_host_sha256={hashlib.sha256(temp_host.encode()).hexdigest()}")
          print("SOURCE_NEON_HOST_CONTACTED=NO")
          print("NEON_PRODUCTION_BRANCH_TARGETED=NO")
          PY
      - name: Verify active Autopilot schema without applying migrations
        env:
          DATABASE_URL: ${{ steps.neon.outputs.database_url }}
        shell: bash
        run: |
          set -Eeuo pipefail
          row="$(psql "$DATABASE_URL" -X -A -t -F '|' -v ON_ERROR_STOP=1 <<'SQL'
          SELECT current_setting('neon.project_id', true),
                 current_setting('neon.branch_id', true),
                 current_database(),
                 current_user,
                 EXISTS(SELECT 1 FROM public.schema_migration WHERE migration_key='0302_autopilot_github_ci_read_only'),
                 EXISTS(SELECT 1 FROM public.schema_migration WHERE migration_key='0303_autopilot_github_draft_repair'),
                 to_regprocedure('autopilot.create_shadow_task(text,text,jsonb,integer,bigint,text,text)') IS NOT NULL,
                 has_function_privilege(current_user, 'autopilot.create_shadow_task(text,text,jsonb,integer,bigint,text,text)', 'EXECUTE');
          SQL
          )"
          IFS='|' read -r project_id branch_id database_name database_user migration_0302 migration_0303 function_present caller_can_execute <<<"$row"
          [[ "$project_id" == "$PROJECT_ID" ]]
          [[ "$branch_id" == "$TEMP_BRANCH_ID" ]]
          [[ "$database_name" == neondb ]]
          [[ "$database_user" != autopilot_runtime_login && "$database_user" != autopilot_prod_canary_login ]]
          [[ "$migration_0302" == t && "$migration_0303" == t ]]
          [[ "$function_present" == t && "$caller_can_execute" == t ]]
          echo 'AUTOPILOT_SCHEMA_PREFLIGHT=PASS'
          echo 'MIGRATION_APPLIED=NO'
          echo 'PRODUCTION_MUTATION=NO'
      - name: Register three exact-head durable tasks
        id: tasks
        env:
          DATABASE_URL: ${{ steps.neon.outputs.database_url }}
        shell: bash
        run: |
          set -Eeuo pipefail
          register_task() {
            local label="$1" task_key="$2" pr_number="$3" head_sha="$4"
            local row task_id status created
            row="$(psql "$DATABASE_URL" -X -A -t -F '|' -v ON_ERROR_STOP=1 \
              -v task_key="$task_key" -v pr_number="$pr_number" -v head_sha="$head_sha" <<'SQL'
          SELECT task_id,status,created
            FROM autopilot.create_shadow_task(
              :'task_key',
              'GITHUB_CI_READ_ONLY_V1',
              jsonb_build_object(
                'repository', 'olegmed1-art/bridge-video-free',
                'pr_number', (:'pr_number')::integer,
                'expected_head_sha', :'head_sha',
                'require_draft', true
              ),
              10,
              0,
              'DIRECTOR_CHAT_GO_20260901',
              'UV_P1_READ_ONLY_REGISTRATION'
            );
          SQL
            )"
            IFS='|' read -r task_id status created <<<"$row"
            [[ "$task_id" =~ ^[0-9a-f-]{36}$ ]]
            [[ "$status" =~ ^(READY|RUNNING|WAITING_EXTERNAL|EVALUATING|DONE|FAILED_CLOSED|OWNER_REQUIRED|BUDGET_STOP)$ ]]
            echo "${label}_task_id=$task_id" >> "$GITHUB_OUTPUT"
            echo "UV_P1_${label^^}_TASK_ID=$task_id"
            echo "UV_P1_${label^^}_REGISTER_STATUS=$status"
            echo "UV_P1_${label^^}_REGISTER_CREATED=$created"
          }
          register_task runtime "$RUNTIME_TASK_KEY" "$RUNTIME_PR" "$RUNTIME_HEAD"
          register_task intake "$INTAKE_TASK_KEY" "$INTAKE_PR" "$INTAKE_HEAD"
          register_task idle "$IDLE_TASK_KEY" "$IDLE_PR" "$IDLE_HEAD"
          echo 'AUTOPILOT_DURABLE_TASK_COUNT=3'

      - name: Observe controller claim or external-wait transition
        env:
          DATABASE_URL: ${{ steps.neon.outputs.database_url }}
          RUNTIME_TASK_ID: ${{ steps.tasks.outputs.runtime_task_id }}
          INTAKE_TASK_ID: ${{ steps.tasks.outputs.intake_task_id }}
          IDLE_TASK_ID: ${{ steps.tasks.outputs.idle_task_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ids=("$RUNTIME_TASK_ID" "$INTAKE_TASK_ID" "$IDLE_TASK_ID")
          for _ in $(seq 1 24); do
            ready=0
            for id in "${ids[@]}"; do
              status="$(psql "$DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c "SELECT status FROM autopilot.task WHERE task_id='$id'::uuid;")"
              [[ "$status" == READY ]] && ready=$((ready + 1))
            done
            [[ "$ready" -eq 0 ]] && break
            sleep 5
          done
          for id in "${ids[@]}"; do
            row="$(psql "$DATABASE_URL" -X -A -t -F '|' -v ON_ERROR_STOP=1 -c \
              "SELECT status,attempts,COALESCE(terminal_reason_code,''),(SELECT count(*) FROM autopilot.task_event e WHERE e.task_id=t.task_id),(SELECT count(*) FROM autopilot.evidence v WHERE v.task_id=t.task_id AND v.retained) FROM autopilot.task t WHERE task_id='$id'::uuid;")"
            IFS='|' read -r status attempts reason events evidence <<<"$row"
            echo "UV_P1_TASK_STATE=$id|$status|attempts=$attempts|reason=${reason:-none}|events=$events|retained_evidence=$evidence"
            [[ "$status" != READY ]]
          done
          echo 'AUTOPILOT_CONTROLLER_CLAIMED_ALL=PASS'
          echo 'REAL_VIDEO_EXECUTION=NO'
          echo 'DRIVE_WRITE=NO'
          echo 'PRODUCTION_MUTATION=NO'

      - name: Publish registration receipt
        if: ${{ always() }}
        env:
          RUNTIME_TASK_ID: ${{ steps.tasks.outputs.runtime_task_id }}
          INTAKE_TASK_ID: ${{ steps.tasks.outputs.intake_task_id }}
          IDLE_TASK_ID: ${{ steps.tasks.outputs.idle_task_id }}
        shell: bash
        run: |
          {
            echo '### Universal Video P1 Autopilot registration'
            echo "- temporary Neon branch: \`$TEMP_BRANCH_ID\`"
            echo '- production/default branch targeted: `NO`'
            echo '- migration applied: `NO`'
            echo "- runtime task: \`${RUNTIME_TASK_ID:-unresolved}\` — PR #$RUNTIME_PR @ \`$RUNTIME_HEAD\`"
            echo "- intake task: \`${INTAKE_TASK_ID:-unresolved}\` — PR #$INTAKE_PR @ \`$INTAKE_HEAD\`"
            echo "- idle-guard task: \`${IDLE_TASK_ID:-unresolved}\` — PR #$IDLE_PR @ \`$IDLE_HEAD\`"
            echo '- real media execution: `NO`'
            echo '- Drive write: `NO`'
            echo '- production mutation: `NO`'
          } >> "$GITHUB_STEP_SUMMARY"
