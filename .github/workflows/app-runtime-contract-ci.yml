name: Bridge App Runtime Contract CI

on:
  pull_request:
    paths:
      - 'database/runtime_app_preflight.py'
      - 'tests/test_app_runtime_dsn_contract.py'
      - '.github/workflows/app-runtime-contract-ci.yml'
  push:
    branches: [main]
    paths:
      - 'database/runtime_app_preflight.py'
      - 'tests/test_app_runtime_dsn_contract.py'
      - '.github/workflows/app-runtime-contract-ci.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install minimal dependency
        run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.3.4'
      - name: Compile app preflight
        run: python -m py_compile database/runtime_app_preflight.py tests/test_app_runtime_dsn_contract.py
      - name: Verify synthetic app URI contract
        run: PYTHONPATH=. python tests/test_app_runtime_dsn_contract.py
