name: Comparison auction consumer integration
on:
  pull_request:
    paths:
      - 'universal_video/comparison_artifacts.py'
      - 'tests/test_universal_video_comparison_artifacts.py'
      - 'tests/test_comparison_auction_consumer_integration.py'
      - '.github/workflows/comparison-auction-consumer.yml'
permissions:
  contents: read
jobs:
  pinned-synthetic-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: consumer
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: runner
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 1ca55ffc99d733e3da639d55a770ca839b193b28
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: a1a288c36c6b57e8600ea5b1e8df5abff456b22a
          path: auction-candidate
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install bounded public dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest==8.4.1 numpy==2.2.6 opencv-python-headless==4.11.0.86
          Pillow==11.2.1 requests==2.32.3 chardet==5.2.0 google-auth==2.40.3
          reportlab==4.4.0 PyMuPDF==1.26.0 PyYAML==6.0.2 'psycopg[binary]==3.3.4'
      - name: Check request dependency compatibility without suppressing warnings
        run: python -W error -c 'import requests, chardet; assert chardet.__version__ == "5.2.0"'
      - name: Verify exact checkouts and replay published producer into consumer
        env:
          EXPECTED_CONSUMER: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git -C consumer rev-parse HEAD)" = "$EXPECTED_CONSUMER"
          test "$(git -C runner rev-parse HEAD)" = "$EXPECTED_CONSUMER"
          test "$(git -C baseline rev-parse HEAD)" = 1ca55ffc99d733e3da639d55a770ca839b193b28
          test "$(git -C auction-candidate rev-parse HEAD)" = a1a288c36c6b57e8600ea5b1e8df5abff456b22a
          export COMPARISON_R3_RUNNER_ROOT="$PWD/runner"
          export COMPARISON_R3_RUNNER_SHA="$EXPECTED_CONSUMER"
          export COMPARISON_CONSUMER_ROOT="$PWD/consumer"
          export COMPARISON_CONSUMER_SHA="$EXPECTED_CONSUMER"
          export RECOGNIZER_BASELINE_ROOT="$PWD/baseline"
          export RECOGNIZER_BASELINE_SHA=1ca55ffc99d733e3da639d55a770ca839b193b28
          export RECOGNIZER_AUCTION_CANDIDATE_ROOT="$PWD/auction-candidate"
          export RECOGNIZER_AUCTION_CANDIDATE_SHA=a1a288c36c6b57e8600ea5b1e8df5abff456b22a
          mkdir results
          git -C consumer rev-parse HEAD > results/consumer-sha.txt
          git -C runner rev-parse HEAD > results/runner-sha.txt
          git -C baseline rev-parse HEAD > results/baseline-sha.txt
          git -C auction-candidate rev-parse HEAD > results/candidate-sha.txt
          cd consumer
          python -B -m pytest -q -s -ra -p no:cacheprovider tests/test_universal_video_comparison_artifacts.py tests/test_comparison_auction_consumer_integration.py --junitxml=../results/consumer.xml
      - name: Enforce executed integration and no skips
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse('results/consumer.xml').iter('testcase'))
          assert cases and not any(c.find(t) is not None for c in cases for t in ('skipped', 'failure', 'error'))
          integration = [c for c in cases if c.get('name') == 'test_pinned_r3_auction_output_is_lossless_consumer_input']
          assert len(integration) == 1
          print({'consumer_controls': len(cases), 'synthetic_producer_consumer_executed': True, 'real_video_accuracy_evaluated': False})
          PY
      - name: Retain public synthetic receipts only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: consumer-r3-${{ github.event.pull_request.head.sha }}
          path: results/
          retention-days: 14
