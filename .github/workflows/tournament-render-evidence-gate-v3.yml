name: Tournament Render Evidence Gate v3

on:
  pull_request:
    paths:
      - "bridge_school_api/tournament_render_release_evidence_v3.py"
      - "bridge_school_api/tournament_portfolio_release_gate_v3.py"
      - "bridge_school_api/tournament_coverage_release_v3.py"
      - "tests/test_tournament_render_release_evidence_v3.py"
      - "tests/test_tournament_portfolio_release_gate_v3.py"
      - ".github/workflows/tournament-render-evidence-gate-v3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile render evidence module
        run: python -m py_compile bridge_school_api/tournament_render_release_evidence_v3.py
      - name: Run render and adjacent release contracts
        run: >-
          python -m pytest -q
          tests/test_tournament_render_release_evidence_v3.py
          tests/test_tournament_portfolio_release_gate_v3.py
