name: DDS v2.3 patch canonical algorithm review loop

on:
  push:
    branches: [dds-training-local]
    paths:
      - '.github/workflows/dds-v23-patch-algorithm-review.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dds-training-local

      - name: Add evidence-driven post-stage review to canonical algorithm
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('dds_training/ALGORITHM_DDS_LEARNING_V2_3_RU.md')
          text=path.read_text(encoding='utf-8')
          marker='## 27. Финальный принцип\n'
          assert marker in text
          insert='''## 27. Автоматический пересмотр алгоритма после каждого этапа

После каждого завершённого этапа запускается отдельный post-stage review.
Он анализирует не только итоговую точность, но и качество самого эксперимента:

- баланс семейств задач;
- утечку holdout;
- независимый transfer;
- количество и качество контрпримеров;
- калибровку уверенности;
- долю расследований без линии;
- наличие DD-траекторий;
- регрессии отдельных семейств модели;
- надёжность shards и возобновления;
- результаты negative controls.

Результатом является версионный список `candidate_change`:

```text
наблюдаемая проблема
→ доказательства
→ предлагаемое изменение алгоритма
→ обязательная проверка изменения
→ paired fresh-data comparison
→ non-regression audit
→ новая версия
```

Post-stage review не имеет права автоматически переписывать код, правила или
исторические факты. Изменение становится активным только после отдельного теста,
проверки на свежих данных и, если оно влияет на массовый этап, явного одобрения.

## 28. Финальный принцип
'''
          text=text.replace(marker,insert,1)
          path.write_text(text,encoding='utf-8')
          PY
          rm -f .github/workflows/dds-v23-patch-algorithm-review.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate evidence-driven post-stage review into DDS v2.3 algorithm'
          git push origin HEAD:dds-training-local
