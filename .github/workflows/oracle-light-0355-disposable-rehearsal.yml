name: Oracle Light 0355 disposable rehearsal

on:
  pull_request:
    paths:
      - 'ops/oracle_light_0355_rehearsal.py'
      - 'tests/test_oracle_light_0355_rehearsal.py'
      - '.github/workflows/oracle-light-0355-disposable-rehearsal.yml'
  workflow_dispatch:
    inputs:
      main_sha:
        description: 'Reviewed exact current main SHA'
        required: true
        type: string
      sql_head:
        description: 'Reviewed exact PR1857 head SHA'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: oracle-light-0355-disposable-rehearsal
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: |
          python -m pip install 'pytest>=8,<9'
          python -m pytest -q tests/test_oracle_light_0355_rehearsal.py

  rehearsal:
    needs: contract
    if: github.repository == 'olegmed1-art/bridge-video-free' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: database-production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client >/dev/null
      - name: Rehearse only on an expiring child branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN: ${{ inputs.main_sha }}
          SQL_HEAD: ${{ inputs.sql_head }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          [[ "$EXPECTED_MAIN" =~ ^[0-9a-f]{40}$ && "$SQL_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_MAIN" ]]
          [[ "$(gh api repos/olegmed1-art/bridge-video-free/git/ref/heads/main --jq .object.sha)" == "$EXPECTED_MAIN" ]]
          [[ "$(gh api repos/olegmed1-art/bridge-video-free/pulls/1857 --jq .head.sha)" == "$SQL_HEAD" ]]
          git diff --exit-code HEAD --
          unset GH_TOKEN
          [[ -n "${NEON_API_KEY:-}" ]]
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          git fetch --no-tags --depth=1 origin "$SQL_HEAD"
          git show "$SQL_HEAD:ops/autopilot_light_0355_retire.sql" > "$work/retire.sql"
          git show "$SQL_HEAD:ops/autopilot_light_0355_refence.sql" > "$work/refence.sql"
          python ops/oracle_light_0355_rehearsal.py "$work/retire.sql" "$work/refence.sql"
