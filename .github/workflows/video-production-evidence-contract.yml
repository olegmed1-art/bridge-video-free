name: Bridge Video Production Evidence Contract

on:
  push:
    paths:
      - '.github/workflows/video-production-evidence-contract.yml'
      - '.github/workflows/bridge-video-3.1-free.yml'
      - '.github/workflows/bridge-video-auto-discovery.yml'
      - '.github/workflows/bridge-video-r25-15-candidate.yml'
      - '.github/workflows/bridge-video-r25-15-diagnostics.yml'
      - 'run_drive_3_1_free_generic.py'
      - 'route_drive_job_outputs.py'
      - 'bridge_speaker_identity_postprocess.py'
      - 'r29_identity_overlay_probe.py'
      - 'bridge_speaker_mapping_r29.py'
      - 'check_completed_job.py'
      - 'bridge_runtime_hardening_r25_6.py'
      - 'bridge_runtime_hardening_r25_7.py'
      - 'bridge_runtime_hardening_r25_14.py'
      - 'bridge_runtime_hardening_r25_15.py'
      - 'run_master_3_1_free.py'
      - 'run_master_3_1_free_semantic.py'
      - 'run_master_3_1_free_semantic_v2.py'
      - 'bridge_speaker_diarization.py'
      - 'bridge_speaker_diarization_v2.py'
      - 'bridge_speaker_diarization_v3.py'
      - 'bridge_speaker_diarization_v3_core.py'
      - 'bridge_speaker_diarization_v3_repair.py'
      - 'diana_longitudinal_quality_v2.py'
      - 'tests/test_production_evidence_contract.py'
      - 'tests/test_asr_policy_r25_6.py'
      - 'tests/test_pdf_presentation_r25_6.py'
      - 'tests/test_speaker_diarization_v2.py'
      - 'tests/test_speaker_diarization_v3.py'
      - 'tests/test_speaker_mapping_r29.py'
      - 'tests/test_integrated_speaker_identity_postprocess.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/video-production-evidence-contract.yml'
      - '.github/workflows/bridge-video-3.1-free.yml'
      - '.github/workflows/bridge-video-auto-discovery.yml'
      - '.github/workflows/bridge-video-r25-15-candidate.yml'
      - '.github/workflows/bridge-video-r25-15-diagnostics.yml'
      - 'run_drive_3_1_free_generic.py'
      - 'route_drive_job_outputs.py'
      - 'bridge_speaker_identity_postprocess.py'
      - 'r29_identity_overlay_probe.py'
      - 'bridge_speaker_mapping_r29.py'
      - 'check_completed_job.py'
      - 'bridge_runtime_hardening_r25_6.py'
      - 'bridge_runtime_hardening_r25_7.py'
      - 'bridge_runtime_hardening_r25_14.py'
      - 'bridge_runtime_hardening_r25_15.py'
      - 'run_master_3_1_free.py'
      - 'run_master_3_1_free_semantic.py'
      - 'run_master_3_1_free_semantic_v2.py'
      - 'bridge_speaker_diarization.py'
      - 'bridge_speaker_diarization_v2.py'
      - 'bridge_speaker_diarization_v3.py'
      - 'bridge_speaker_diarization_v3_core.py'
      - 'bridge_speaker_diarization_v3_repair.py'
      - 'diana_longitudinal_quality_v2.py'
      - 'tests/test_production_evidence_contract.py'
      - 'tests/test_asr_policy_r25_6.py'
      - 'tests/test_pdf_presentation_r25_6.py'
      - 'tests/test_speaker_diarization_v2.py'
      - 'tests/test_speaker_diarization_v3.py'
      - 'tests/test_speaker_mapping_r29.py'
      - 'tests/test_integrated_speaker_identity_postprocess.py'

permissions:
  contents: read

jobs:
  evidence-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BRIDGE_REQUESTED_ALGORITHM_REVISION: 3.1-free-r25.15
      WHISPER_MODEL: small
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install regression runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core
          python -m pip install --disable-pip-version-check -r requirements-worker.txt
          python -m pip install --disable-pip-version-check 'numpy==2.2.6' 'pytest==9.1.1'
      - name: Verify production route and evidence preservation
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/test_production_evidence_contract.py
          # r25.15 inherits r25.14 -> r25.7 -> the proven r25.6 policies.
          PYTHONPATH=. python tests/test_asr_policy_r25_6.py
          PYTHONPATH=. python tests/test_unreliable_asr_isolation_r25_4.py
          PYTHONPATH=. python tests/test_pdf_presentation_r25_6.py
          # Speaker repair is part of production; preserve both v2 compatibility
          # and the v3 collapse-repair regression suite.
          PYTHONPATH=. python -m pytest -q tests/test_speaker_diarization_v2.py tests/test_speaker_diarization_v3.py
          # r29 is now a standard post-transcription identity overlay. It must
          # remain evidence-gated, idempotent, privacy-safe, and optional when
          # private identity evidence does not exist.
          PYTHONPATH=. python -m pytest -q tests/test_speaker_mapping_r29.py tests/test_integrated_speaker_identity_postprocess.py
          python -m py_compile \
            bridge_runtime_hardening_r25_6.py \
            bridge_runtime_hardening_r25_7.py \
            bridge_runtime_hardening_r25_14.py \
            bridge_runtime_hardening_r25_15.py \
            run_master_3_1_free.py \
            run_master_3_1_free_semantic.py \
            run_master_3_1_free_semantic_v2.py \
            bridge_speaker_diarization.py \
            bridge_speaker_diarization_v2.py \
            bridge_speaker_diarization_v3.py \
            bridge_speaker_diarization_v3_core.py \
            bridge_speaker_diarization_v3_repair.py \
            bridge_speaker_mapping_r29.py \
            r29_identity_overlay_probe.py \
            bridge_speaker_identity_postprocess.py \
            route_drive_job_outputs.py \
            diana_longitudinal_quality_v2.py \
            run_drive_3_1_free_generic.py \
            check_completed_job.py
