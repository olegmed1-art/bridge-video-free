name: Oracle DDS3 Pilot-10k task counts

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  read:
    if: ${{ github.event.comment.user.login == 'olegmed1-art' && github.event.comment.body == '/dds3-pilot10k task-counts' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ORACLE_HOST: 158.180.47.161
      ORACLE_USER: ubuntu
      EXPECTED_FINGERPRINT: SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk
      SSH_KEY_ORACLE: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
      SSH_KEY_OCI: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
      SSH_KEY_VM: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
      SSH_KEY_BRIDGE: ${{ secrets.BRIDGE_SCHOOL_ORACLE_SSH_PRIVATE_KEY }}
      SSH_KEY_ORACLE_ALT: ${{ secrets.ORACLE_SSH_KEY }}
      SSH_KEY_OCI_ALT: ${{ secrets.OCI_SSH_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Resolve verified Oracle SSH credential
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/oracle-pilot10k-counts"; mkdir -p "$work"
          known="$work/known_hosts"
          ops/oracle_known_hosts_from_scan.sh "$ORACLE_HOST" "$EXPECTED_FINGERPRINT" "$known"
          selected=''; idx=0
          for name in SSH_KEY_ORACLE SSH_KEY_OCI SSH_KEY_VM SSH_KEY_BRIDGE SSH_KEY_ORACLE_ALT SSH_KEY_OCI_ALT; do
            raw="${!name:-}"; [[ -n "$raw" ]] || continue
            idx=$((idx+1)); base="$work/key-$idx"
            printf '%s\n' "$raw" > "$base.raw"
            tr -d '\r' < "$base.raw" > "$base.crlf"
            RAW_KEY="$raw" OUT_KEY="$base.escaped" python - <<'PY'
          import os
          raw=os.environ['RAW_KEY']
          if '\\n' in raw and '\n' not in raw:
              raw=raw.replace('\\r','').replace('\\n','\n')
          with open(os.environ['OUT_KEY'],'w',newline='\n') as f:
              f.write(raw)
              if not raw.endswith('\n'): f.write('\n')
          PY
            for key in "$base.raw" "$base.crlf" "$base.escaped"; do
              chmod 0600 "$key"
              ssh-keygen -y -f "$key" >/dev/null 2>&1 || continue
              if ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" -o ConnectTimeout=10 "$ORACLE_USER@$ORACLE_HOST" true >/dev/null 2>&1; then
                selected="$key"; break 2
              fi
            done
          done
          [[ -n "$selected" ]]
          cp "$selected" "$work/id_oracle"; chmod 0600 "$work/id_oracle"
          echo "key=$work/id_oracle" >> "$GITHUB_OUTPUT"
          echo "known=$known" >> "$GITHUB_OUTPUT"

      - name: Read task and prediction counts
        id: counts
        shell: bash
        run: |
          set -euo pipefail
          key='${{ steps.ssh.outputs.key }}'; known='${{ steps.ssh.outputs.known }}'
          out="$RUNNER_TEMP/pilot10k-counts.txt"
          ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST" 'sudo -n python3 -' <<'PY' | tee "$out"
          import json, hashlib
          from pathlib import Path
          work=Path('/opt/bridge-school/dds3-mass-validation/work/pilot-replay')
          tasks=[json.loads(x) for x in (work/'blind_tasks.jsonl').read_text().splitlines() if x.strip()]
          preds=[json.loads(x) for x in (work/'locked_predictions_train.jsonl').read_text().splitlines() if x.strip()]
          by_split={}
          for t in tasks: by_split[t.get('split')]=by_split.get(t.get('split'),0)+1
          tids={t.get('task_id') for t in tasks}
          train_ids={t.get('task_id') for t in tasks if t.get('split')=='train'}
          pids={p.get('task_id') for p in preds}
          print('tasks_total='+str(len(tasks)))
          print('tasks_by_split='+json.dumps(by_split,sort_keys=True))
          print('predictions_total='+str(len(preds)))
          print('prediction_ids_unique='+str(len(pids)))
          print('train_ids_unique='+str(len(train_ids)))
          print('prediction_ids_in_train='+str(len(pids & train_ids)))
          print('prediction_ids_not_in_train='+str(len(pids-train_ids)))
          print('train_ids_without_prediction='+str(len(train_ids-pids)))
          print('first_prediction_not_train='+str(next(iter(sorted(pids-train_ids)),'')))
          print('first_train_without_prediction='+str(next(iter(sorted(train_ids-pids)),'')))
          for name in ('raw.pbn','manifest.jsonl','blind_tasks.jsonl','locked_predictions_train.jsonl'):
              p=work/name
              print(name+'_sha256='+hashlib.sha256(p.read_bytes()).hexdigest())
          PY
          {
            echo 'text<<EOF'
            cat "$out"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TEXT: ${{ steps.counts.outputs.text }}
        shell: bash
        run: |
          set -euo pipefail
          body="Pilot-10k task-count diagnostic:\n\n\`\`\`text\n${TEXT:-diagnostic_failed}\n\`\`\`"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -f body="$body" >/dev/null
