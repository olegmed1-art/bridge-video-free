name: Internal UV003 source patch v3

on:
  push:
    branches:
      - 'fix/uv003-bootstrap-contract-615'
    paths:
      - 'ops/internal-uv003-source-patch-v3-request-615.json'

permissions:
  contents: write

concurrency:
  group: internal-uv003-source-patch-v3-615
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 2
      - name: Execute the validated v2 source patch without its EOF-only defect
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          request = json.loads(Path('ops/internal-uv003-source-patch-v3-request-615.json').read_text(encoding='utf-8'))
          assert request == {
              'request_id': 'internal-uv003-source-patch-v3-615-01',
              'issue': 615,
              'scope': 'non-workflow-source-only',
          }

          workflow = Path('.github/workflows/internal-uv003-source-patch-v2.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n      - name: Run bounded static and unit validation"
          assert workflow.count(start_marker) == 1
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          indented = workflow[start:end].splitlines()
          assert indented and all((not line) or line.startswith('          ') for line in indented)
          script = '\n'.join(line[10:] if line else '' for line in indented) + '\n'
          old = "text.rstrip() + addition + '\\n'"
          new = "text.rstrip() + addition.rstrip() + '\\n'"
          assert script.count(old) == 2
          script = script.replace(old, new)
          assert script.count(new) == 2
          exec(compile(script, '<uv003-source-patch-v3>', 'exec'), {'__name__': '__main__'})
          PY
      - name: Run bounded static and unit validation
        shell: bash
        run: |
          set -euo pipefail
          bash -n ops/universal_video_diana11_003_operator.sh
          bash -n ops/install_universal_video_diana11_003_operator.sh
          python -m py_compile ops/probe_uv003_operator_bootstrap.py
          python -m pip install --disable-pip-version-check -q pytest pyyaml
          python -m pytest -q tests/test_uv003_bootstrap_diagnostic.py tests/test_uv003_execution_contract.py
          git diff --check
      - name: Commit corrected non-workflow source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/universal_video_diana11_003_operator.sh \
            ops/install_universal_video_diana11_003_operator.sh \
            ops/probe_uv003_operator_bootstrap.py \
            tests/test_uv003_bootstrap_diagnostic.py \
            tests/test_uv003_execution_contract.py
          git commit -m 'Fix UV003 bootstrap evidence and readonly env handoff (#615)'
          git push origin "HEAD:${GITHUB_REF_NAME}"
