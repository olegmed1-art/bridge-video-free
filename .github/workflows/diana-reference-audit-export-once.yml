name: Diana reference audit artifact cleanup one-shot

on:
  push:
    branches: [codex/diana-autonomous-finalize-20260911]
    paths: ['.github/workflows/diana-reference-audit-export-once.yml']

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    if: github.repository == 'olegmed1-art/bridge-video-free'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Delete audit artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ARTIFACT_ID: '10275767882'
        shell: bash
        run: |
          set -Eeuo pipefail
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/delete-response" --write-out '%{http_code}' \
            --request DELETE \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/artifacts/$ARTIFACT_ID")"
          if [[ "$status" != 204 && "$status" != 404 ]]; then
            cat "$RUNNER_TEMP/delete-response"
            exit 1
          fi
          echo "ARTIFACT_CLEANUP_PASS status=$status"
