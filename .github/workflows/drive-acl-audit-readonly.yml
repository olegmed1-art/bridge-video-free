name: Drive ACL audit — read only

on:
  push:
    branches:
      - drive-acl-audit-20260820
    paths:
      - 'tools/drive_acl_audit_readonly.py'
      - '.github/workflows/drive-acl-audit-readonly.yml'

permissions:
  contents: read

concurrency:
  group: drive-acl-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BRIDGE_PROJECT_ROOT_ID: 1uzpcT49YcV34gcv_Jo2U86a9qHUuqPpj
      ZOOM_RECORDINGS_ROOT_ID: 1W-5gfOFUrSJ0a7XN0zXjU8o8JTUcorP1
      DRIVE_AUDIT_FOLDER_ID: 1clTBNYOACadYlPtnfSjedSoTf-gM0IxE
      DRIVE_AUDIT_OWNER_EMAIL: olegmed1@gmail.com
    steps:
      - name: Checkout audit code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Install read-only audit dependencies
        run: python -m pip install --disable-pip-version-check 'requests==2.32.5' 'google-auth==2.40.3' 'google-auth-oauthlib==1.2.2'

      - name: Recursive permission audit
        env:
          GOOGLE_DRIVE_OAUTH_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_JSON }}
        run: |
          set -euo pipefail
          python tools/drive_acl_audit_readonly.py > "$RUNNER_TEMP/drive-acl-audit-receipt-line.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          line = Path(os.environ['RUNNER_TEMP']) / 'drive-acl-audit-receipt-line.json'
          receipt = json.loads(line.read_text(encoding='utf-8'))
          safe = receipt['safe_summary']
          assert receipt['status'] == 'READ_ONLY_AUDIT_COMPLETE'
          assert safe['write_operations_to_existing_items'] == 0
          print(json.dumps({
              'status': receipt['status'],
              'safe_summary': safe,
              'private_detail_drive_id': receipt['private_detail_drive_id'],
              'private_safe_drive_id': receipt['private_safe_drive_id'],
              'detail_sha256': receipt['detail_sha256'],
              'safe_sha256': receipt['safe_sha256'],
          }, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload safe audit receipt only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: drive-acl-audit-safe-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/drive-acl-audit/receipt.json
          if-no-files-found: warn
          retention-days: 14
