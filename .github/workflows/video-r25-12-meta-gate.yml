name: Bridge Video r25.12 META Evidence Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'bridge_runtime_hardening_r25_12_meta.py'
      - 'database/**'
      - 'tests/fixtures/asr_block_11_r25_11.json'
      - 'tests/test_meta_asr_gate_r25_12.py'
      - '.github/workflows/video-r25-12-meta-gate.yml'
  push:
    branches:
      - agent/video-meta-evidence-r25-12

permissions:
  contents: read

jobs:
  candidate-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install regression runtime
        run: python -m pip install --disable-pip-version-check -r requirements-worker.txt
      - name: Verify candidate and inherited evidence contracts
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/test_meta_asr_gate_r25_12.py
          PYTHONPATH=. python tests/test_asr_policy_r25_6.py
          PYTHONPATH=. python tests/test_unreliable_asr_isolation_r25_4.py
          PYTHONPATH=. python tests/test_pdf_presentation_r25_6.py
          PYTHONPATH=. python tests/test_content_persistence_r25_10.py
          PYTHONPATH=. python -m unittest tests.test_diana_longitudinal_postprocess tests.test_diana_longitudinal_quality_v2 -v
          python -m py_compile \
            bridge_runtime_hardening_r25_12_meta.py \
            database/video_result_persistence.py
      - name: Verify candidate preserves the live production baseline
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED_FILES="$(git diff --name-only HEAD^1 HEAD)"
            META_CANDIDATE_CHANGED=false
            if printf '%s\n' "$CHANGED_FILES" | grep -Eq \
              '^(bridge_runtime_hardening_r25_12_meta\.py|tests/fixtures/asr_block_11_r25_11\.json|tests/test_meta_asr_gate_r25_12\.py)$'; then
              META_CANDIDATE_CHANGED=true
            fi
            if [ "$META_CANDIDATE_CHANGED" = "true" ] && \
               printf '%s\n' "$CHANGED_FILES" | grep -Eq \
                 '^(\.github/workflows/bridge-video-3\.1-free\.yml|run_drive_3_1_free_generic\.py)$'; then
              echo 'META implementation/test candidate must not modify the production workflow/runtime adapter.' >&2
              exit 1
            fi
          fi
          python - <<'PY'
          import ast
          import dis
          from pathlib import Path
          import re

          workflow = Path('.github/workflows/bridge-video-3.1-free.yml').read_text(encoding='utf-8')
          adapter = Path('run_drive_3_1_free_generic.py').read_text(encoding='utf-8')

          binding_opcodes = {'STORE_NAME', 'STORE_GLOBAL', 'DELETE_NAME', 'DELETE_GLOBAL'}

          def module_instructions(source, filename):
              tree = ast.parse(source, filename=filename)
              if any(
                  isinstance(node, ast.ImportFrom)
                  and any(alias.name == '*' for alias in node.names)
                  for node in ast.walk(tree)
              ):
                  raise SystemExit(f'wildcard import is forbidden: {filename}')
              instructions = list(dis.get_instructions(compile(source, filename, 'exec')))
              return instructions

          def bindings_for(instructions, name):
              return [
                  instruction
                  for instruction in instructions
                  if instruction.opname in binding_opcodes and instruction.argval == name
              ]

          match = re.search(
              r'BRIDGE_REQUESTED_ALGORITHM_REVISION:\s*["\']3\.1-free-r([0-9]+(?:\.[0-9]+)*)["\']',
              workflow,
          )
          if not match:
              raise SystemExit('production algorithm revision is missing or malformed')
          requested_revision = f"3.1-free-r{match.group(1)}"

          adapter_tree = ast.parse(adapter, filename='run_drive_3_1_free_generic.py')
          runtime_modules = [
              alias.name
              for node in adapter_tree.body
              if isinstance(node, ast.Import)
              for alias in node.names
              if alias.asname == 'hardening'
              and re.fullmatch(r'bridge_runtime_hardening_r[0-9_]+', alias.name)
          ]
          adapter_bindings = bindings_for(
              module_instructions(adapter, 'run_drive_3_1_free_generic.py'), 'hardening'
          )
          if len(runtime_modules) != 1 or len(adapter_bindings) != 1:
              raise SystemExit('production adapter must import exactly one versioned runtime as hardening')
          runtime_module = runtime_modules[0]
          runtime_path = Path(f'{runtime_module}.py')
          if not runtime_path.is_file():
              raise SystemExit(f'production runtime module is missing: {runtime_module}')
          runtime = runtime_path.read_text(encoding='utf-8')
          runtime_tree = ast.parse(runtime, filename=str(runtime_path))
          literal_revisions = [
              node.value.value
              for node in runtime_tree.body
              if isinstance(node, ast.Assign)
              and len(node.targets) == 1
              and isinstance(node.targets[0], ast.Name)
              and node.targets[0].id == 'REVISION'
              and isinstance(node.value, ast.Constant)
              and isinstance(node.value.value, str)
          ]
          revision_bindings = bindings_for(
              module_instructions(runtime, str(runtime_path)), 'REVISION'
          )
          if (
              len(revision_bindings) != 1
              or literal_revisions != [requested_revision]
          ):
              raise SystemExit(
                  'production workflow/runtime mismatch: '
                  f'workflow requests {requested_revision}, '
                  f'{runtime_module} binding_count={len(revision_bindings)} '
                  f'literals={literal_revisions!r}'
              )
          print(
              'Production baseline preserved and internally consistent: '
              f'{requested_revision} via {runtime_module}'
          )
          PY
