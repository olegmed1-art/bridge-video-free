name: Bridge Video r25.5 Diana 9 E2E

on:
  push:
    branches: [validation/3.1-free-r25.5-asr-isolation-2026-08-15]
    paths: ['.github/workflows/video-r25-5-diana9-e2e.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridge-video-r25-5-diana9-e2e
  cancel-in-progress: false

jobs:
  diana9-e2e:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      BRIDGE_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      BRIDGE_RUNNER_LABEL: ubuntu-24.04
      BRIDGE_LARGER_RUNNER: "false"
      BRIDGE_PAID_CLOUD: "false"
      BRIDGE_BILLING_FALLBACK: "false"
      BRIDGE_JOB_ID: 50b5b5c4c77e4b49f1dd745275066012
      BRIDGE_REQUESTED_ALGORITHM_REVISION: 3.1-free-r25.5
      PYTHONUNBUFFERED: "1"
      WHISPER_MODEL: small
    steps:
      - name: Checkout r25.5 validation
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {persist-credentials: false}
      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: "3.12"}
      - name: Install free runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check -r requirements-worker.txt
      - name: Run inherited regression tests
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/test_semantic_gate_r25_2.py
          PYTHONPATH=. python tests/test_late_oauth_r25_3.py
          PYTHONPATH=. python tests/test_unreliable_asr_isolation_r25_4.py
          python -m py_compile bridge_runtime_hardening_r25_1.py bridge_runtime_hardening_r25_4.py run_drive_3_1_free_generic.py
      - name: Google Drive OAuth preflight
        env:
          GOOGLE_DRIVE_OAUTH_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_JSON }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from run_drive_3_1_free_oidc import user_oauth_token
          assert user_oauth_token(), 'BLOCKED_ACCESS: Drive OAuth unavailable'
          print('Google Drive OAuth preflight: PASS')
          PY
      - name: FREE-GUARD
        run: python bridge_worker_3_1_free.py
      - name: Validate Diana 9 pathological ASR remains fail-closed
        env:
          GOOGLE_DRIVE_OAUTH_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_JSON }}
        run: |
          set -euo pipefail
          LOG_PATH="${RUNNER_TEMP}/diana9-r25-5.log"
          set +e
          python run_drive_3_1_free_oidc.py 2>&1 | tee "$LOG_PATH"
          worker_exit="${PIPESTATUS[0]}"
          set -e
          WORKER_EXIT="$worker_exit" LOG_PATH="$LOG_PATH" python - <<'PY'
          import json, os
          from pathlib import Path
          code=int(os.environ['WORKER_EXIT'])
          text=Path(os.environ['LOG_PATH']).read_text(encoding='utf-8', errors='replace')
          events=[]
          for line in text.splitlines():
              p=line.find('{')
              if p < 0: continue
              try: e=json.loads(line[p:])
              except json.JSONDecodeError: continue
              if e.get('stage') == 'ASR_QC_STRICT_R25_1': events.append(e)
          if code == 0: raise SystemExit('Diana 9 unexpectedly passed r25.5')
          if not events: raise SystemExit('missing strict ASR QC evidence')
          final=events[-1]
          if final.get('exit_code') != 1 or int(final.get('qc_hallucination_blocks') or 0) < 1:
              raise SystemExit(f'pathological hallucination did not block: {final}')
          if 'RuntimeError: ASR_QC_FAILED' not in text:
              raise SystemExit('ASR failure did not stop worker')
          if '"stage": "PDF_QC"' in text or '"status": "AI_DONE"' in text:
              raise SystemExit('bad ASR continued into publication')
          print(f"R25_5_DIANA9_FAIL_CLOSED: PASS hallucination_blocks={final.get('qc_hallucination_blocks')}")
          PY
