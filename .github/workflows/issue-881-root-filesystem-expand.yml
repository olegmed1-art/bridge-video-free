name: Issue 881 one-shot root filesystem expansion

on:
  pull_request:
    paths:
      - '.github/workflows/issue-881-root-filesystem-expand.yml'
      - 'ops/oracle_universal_video_root_filesystem_expand.sh'
      - 'ops/issue-881-root-filesystem-expand-request.json'
      - 'tests/test_issue_881_root_filesystem_expand_contract.py'
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('issue-881-root-expand-pr-{0}', github.run_id) || 'oracle-instance-workload-mutation' }}
  cancel-in-progress: false

jobs:
  contract:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {persist-credentials: false}
      - run: |
          set -euo pipefail
          ruby -e "require 'yaml'; YAML.parse_file(ARGV.fetch(0))" .github/workflows/issue-881-root-filesystem-expand.yml
          bash -n ops/oracle_universal_video_root_filesystem_expand.sh
          python - <<'PY'
          import runpy
          for path in (
              'tests/test_issue_881_root_filesystem_expand_contract.py',
              'tests/test_issue_881_current_main_recovery_contract.py',
          ):
              namespace = runpy.run_path(path)
              for name, value in namespace.items():
                  if name.startswith('test_') and callable(value):
                      value()
          PY

  expand-and-recover:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 881 &&
      github.event.comment.user.login == 'olegmed1-art' &&
      github.event.comment.body == '/oracle-ops issue-881-expand-root-and-recover-bba508'
    runs-on: ubuntu-24.04
    # The explicit OCI waiters consume at most 210 minutes: 60 minutes each for
    # backup and restore, 30 minutes each for launch and termination, and five
    # minutes for each of six dependency-deletion checks.  GitHub's six-hour
    # ceiling leaves 150 minutes for setup, SSH acceptance, recovery, and the
    # EXIT cleanup trap instead of cancelling exactly at the waiter ceiling.
    timeout-minutes: 360
    env:
      ORACLE_HOST: 158.180.47.161
      ORACLE_USER: ubuntu
      EXPECTED_HOSTNAME: bridge-school-dds3-frankfurt
      EXPECTED_FINGERPRINT: SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk
      EXACT_RUNTIME_SHA: bba508350cbe63a7a8ec93fa9c007db9ee9eae6c
      SSH_KEY_ORACLE: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
      OCI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_KEY: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      OCI_REGION: ${{ secrets.OCI_CLI_REGION }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Validate immutable one-shot request
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          expected = {
              'operation': 'expand_existing_root_filesystem',
              'host': '158.180.47.161',
              'hostname': 'bridge-school-dds3-frankfurt',
              'expected_volume_gb': 97,
              'runtime_sha': 'bba508350cbe63a7a8ec93fa9c007db9ee9eae6c',
          }
          assert json.load(open('ops/issue-881-root-filesystem-expand-request.json')) == expected
          PY
      - name: Create fresh full backup and prove isolated restored-root boot acceptance
        id: backup
        run: |
          set -euo pipefail
          for value in OCI_USER OCI_TENANCY OCI_FINGERPRINT OCI_KEY OCI_REGION; do
            [[ -n "${!value:-}" ]] || exit 21
          done
          [[ "$OCI_REGION" == eu-frankfurt-1 ]] || exit 22
          python -m pip install --disable-pip-version-check -q 'oci-cli==3.90.3'
          install -d -m 0700 "$HOME/.oci"
          printf '%s' "$OCI_KEY" | python -c 'import sys; raw=sys.stdin.read().replace("\\r","").replace("\\n","\n"); open(sys.argv[1],"w").write(raw if raw.endswith("\n") else raw+"\n")' "$HOME/.oci/key.pem"
          chmod 0600 "$HOME/.oci/key.pem"
          python - <<'PY'
          import os
          from pathlib import Path
          def scalar(env, key):
              lines=[x.strip() for x in os.environ[env].replace('\r','').splitlines() if x.strip()]
              matches=[x.split('=',1)[1].strip() for x in lines if x.startswith(key+'=')]
              if len(matches)==1 and matches[0]: return matches[0]
              if not matches and len(lines)==1 and '=' not in lines[0]: return lines[0]
              raise SystemExit(f'ambiguous {env}')
          values={'user':scalar('OCI_USER','user'),'fingerprint':scalar('OCI_FINGERPRINT','fingerprint'),'tenancy':scalar('OCI_TENANCY','tenancy'),'region':scalar('OCI_REGION','region')}
          text='[DEFAULT]\n'+''.join(f'{k}={v}\n' for k,v in values.items())+f"key_file={Path.home()/'.oci'/'key.pem'}\n"
          (Path.home()/'.oci'/'config').write_text(text)
          PY
          chmod 0600 "$HOME/.oci/config"
          export OCI_CLI_REGION="$OCI_REGION"
          roots="$(oci iam compartment list --include-root --all --output json)"
          tenancy_id="$(printf '%s' "$roots" | python -c 'import json,sys; xs=[x["id"] for x in json.load(sys.stdin)["data"] if x.get("id","").startswith("ocid1.tenancy.")]; assert len(xs)==1; print(xs[0])')"
          instances="$(oci compute instance list --compartment-id "$tenancy_id" --display-name bridge-school-dds3-frankfurt --all --output json)"
          instance_id="$(printf '%s' "$instances" | python -c 'import json,sys; xs=[x for x in json.load(sys.stdin)["data"] if x.get("lifecycle-state") not in {"TERMINATED","TERMINATING"}]; assert len(xs)==1; print(xs[0]["id"])')"
          instance_json="$(oci compute instance get --instance-id "$instance_id" --output json)"
          INSTANCE="$instance_json" python - <<'PY'
          import json,os
          d=json.loads(os.environ['INSTANCE'])['data']
          assert d['display-name']=='bridge-school-dds3-frankfurt'
          assert d['lifecycle-state']=='RUNNING'
          assert d['compartment-id'].startswith('ocid1.tenancy.')
          PY
          ad="$(printf '%s' "$instance_json" | python -c 'import json,sys; print(json.load(sys.stdin)["data"]["availability-domain"])')"
          attachments="$(oci compute boot-volume-attachment list --compartment-id "$tenancy_id" --availability-domain "$ad" --instance-id "$instance_id" --all --output json)"
          boot_id="$(printf '%s' "$attachments" | python -c 'import json,sys; xs=[x for x in json.load(sys.stdin)["data"] if x.get("lifecycle-state")=="ATTACHED"]; assert len(xs)==1; print(xs[0]["boot-volume-id"])')"
          boot_size="$(oci bv boot-volume get --boot-volume-id "$boot_id" --query 'data."size-in-gbs"' --raw-output)"
          [[ "$boot_size" == 97 ]] || exit 30
          source_vnics="$(oci compute vnic-attachment list --compartment-id "$tenancy_id" --instance-id "$instance_id" --all --output json)"
          source_vnic_id="$(printf '%s' "$source_vnics" | python -c 'import json,sys; xs=[x["vnic-id"] for x in json.load(sys.stdin)["data"] if x.get("lifecycle-state")=="ATTACHED"]; assert len(xs)==1; print(xs[0])')"
          source_vnic_json="$(oci network vnic get --vnic-id "$source_vnic_id" --output json)"
          source_public_ip="$(printf '%s' "$source_vnic_json" | python -c 'import json,sys; print(json.load(sys.stdin)["data"].get("public-ip") or "")')"
          [[ "$source_public_ip" == "$ORACLE_HOST" ]] || exit 34
          shape="$(printf '%s' "$instance_json" | python -c 'import json,sys; print(json.load(sys.stdin)["data"]["shape"])')"
          shape_config="$(printf '%s' "$instance_json" | python -c 'import json,sys; d=json.load(sys.stdin)["data"].get("shape-config") or {}; print(json.dumps({"ocpus":d.get("ocpus"),"memoryInGBs":d.get("memory-in-gbs")},separators=(",",":")))')"
          stamp="issue-881-${GITHUB_RUN_ID}"
          backup_id="" restored_id="" drill_instance_id="" drill_public_ip="" drill_started=""
          drill_vcn_id="" drill_ig_id="" drill_route_id="" drill_security_id="" drill_subnet_id=""
          restored_attempted=0 drill_vcn_attempted=0 drill_ig_attempted=0
          drill_route_attempted=0 drill_security_attempted=0 drill_subnet_attempted=0
          discover_named_id() {
            local resource="$1" expected="$2" output id
            local -a command
            for _ in $(seq 1 6); do
              case "$resource" in
                backup) command=(oci bv boot-volume-backup list --compartment-id "$tenancy_id" --boot-volume-id "$boot_id" --all) ;;
                boot-volume) command=(oci bv boot-volume list --compartment-id "$tenancy_id" --availability-domain "$ad" --all) ;;
                vcn) command=(oci network vcn list --compartment-id "$tenancy_id" --all) ;;
                internet-gateway) command=(oci network internet-gateway list --compartment-id "$tenancy_id" --vcn-id "$drill_vcn_id" --all) ;;
                route-table) command=(oci network route-table list --compartment-id "$tenancy_id" --vcn-id "$drill_vcn_id" --all) ;;
                security-list) command=(oci network security-list list --compartment-id "$tenancy_id" --vcn-id "$drill_vcn_id" --all) ;;
                subnet) command=(oci network subnet list --compartment-id "$tenancy_id" --vcn-id "$drill_vcn_id" --all) ;;
                *) return 2 ;;
              esac
              output="$("${command[@]}" --output json)" || return 1
              id="$(EXPECTED_DISPLAY_NAME="$expected" python -c 'import json,os,sys; xs=[x["id"] for x in json.load(sys.stdin).get("data",[]) if x.get("display-name")==os.environ["EXPECTED_DISPLAY_NAME"] and x.get("lifecycle-state") not in {"TERMINATED","TERMINATING"}]; assert len(xs)<=1; print(xs[0] if xs else "")' <<<"$output")" || return 1
              if [[ -n "$id" ]]; then
                printf '%s\n' "$id"
                return 0
              fi
              sleep 5
            done
            return 0
          }
          wait_absent() {
            local resource="$1" id="$2" output
            local -a command
            for _ in $(seq 1 60); do
              case "$resource" in
                boot-volume) command=(oci bv boot-volume get --boot-volume-id "$id") ;;
                subnet) command=(oci network subnet get --subnet-id "$id") ;;
                security-list) command=(oci network security-list get --security-list-id "$id") ;;
                route-table) command=(oci network route-table get --rt-id "$id") ;;
                internet-gateway) command=(oci network internet-gateway get --ig-id "$id") ;;
                vcn) command=(oci network vcn get --vcn-id "$id") ;;
                *) return 2 ;;
              esac
              if output="$("${command[@]}" 2>&1)"; then
                sleep 5
                continue
              fi
              # Treat only OCI's explicit not-found response as deletion.
              # Authentication, throttling and transport failures remain fatal.
              if grep -Fq 'NotAuthorizedOrNotFound' <<<"$output" \
                  && grep -Eq '"status"[[:space:]]*:[[:space:]]*404' <<<"$output"; then
                return 0
              fi
              return 1
            done
            return 1
          }
          cleanup_temp_resources() {
            local failed=0 state candidates
            if [[ -z "$restored_id" && "$restored_attempted" == 1 ]]; then
              restored_id="$(discover_named_id boot-volume "$stamp-restore")" || failed=1
            fi
            if [[ -z "$drill_vcn_id" && "$drill_vcn_attempted" == 1 ]]; then
              drill_vcn_id="$(discover_named_id vcn "$stamp-vcn")" || failed=1
            fi
            if [[ -n "$drill_vcn_id" ]]; then
              if [[ -z "$drill_ig_id" && "$drill_ig_attempted" == 1 ]]; then
                drill_ig_id="$(discover_named_id internet-gateway "$stamp-ig")" || failed=1
              fi
              if [[ -z "$drill_route_id" && "$drill_route_attempted" == 1 ]]; then
                drill_route_id="$(discover_named_id route-table "$stamp-route")" || failed=1
              fi
              if [[ -z "$drill_security_id" && "$drill_security_attempted" == 1 ]]; then
                drill_security_id="$(discover_named_id security-list "$stamp-ssh-only")" || failed=1
              fi
              if [[ -z "$drill_subnet_id" && "$drill_subnet_attempted" == 1 ]]; then
                drill_subnet_id="$(discover_named_id subnet "$stamp-subnet")" || failed=1
              fi
            fi
            # If launch returned after creating the instance but before its JSON
            # reached this runner, recover the OCID from the unique run stamp.
            if [[ -z "$drill_instance_id" && -n "$drill_subnet_id" ]]; then
              candidates="$(oci compute instance list --compartment-id "$tenancy_id" --display-name "$stamp-boot-acceptance" --all --output json 2>/dev/null || true)"
              drill_instance_id="$(printf '%s' "$candidates" | python -c 'import json,sys; xs=[x["id"] for x in json.load(sys.stdin).get("data",[]) if x.get("lifecycle-state") not in {"TERMINATED","TERMINATING"}]; assert len(xs)<=1; print(xs[0] if xs else "")' 2>/dev/null || true)"
            fi
            if [[ -n "$drill_instance_id" ]]; then
              oci compute instance terminate --instance-id "$drill_instance_id" --preserve-boot-volume false --force >/dev/null 2>&1 || true
              state=""
              for _ in $(seq 1 360); do
                state="$(oci compute instance get --instance-id "$drill_instance_id" --query 'data."lifecycle-state"' --raw-output 2>/dev/null || printf UNKNOWN)"
                [[ "$state" == TERMINATED ]] && break
                sleep 5
              done
              [[ "$state" == TERMINATED ]] || failed=1
            fi
            if [[ -n "$restored_id" ]]; then
              oci bv boot-volume delete --boot-volume-id "$restored_id" --force >/dev/null 2>&1 || true
              wait_absent boot-volume "$restored_id" || failed=1
            fi
            if [[ -n "$drill_subnet_id" ]]; then
              oci network subnet delete --subnet-id "$drill_subnet_id" --force >/dev/null 2>&1 || true
              wait_absent subnet "$drill_subnet_id" || failed=1
            fi
            if [[ -n "$drill_security_id" ]]; then
              oci network security-list delete --security-list-id "$drill_security_id" --force >/dev/null 2>&1 || true
              wait_absent security-list "$drill_security_id" || failed=1
            fi
            if [[ -n "$drill_route_id" ]]; then
              oci network route-table delete --rt-id "$drill_route_id" --force >/dev/null 2>&1 || true
              wait_absent route-table "$drill_route_id" || failed=1
            fi
            if [[ -n "$drill_ig_id" ]]; then
              oci network internet-gateway delete --ig-id "$drill_ig_id" --force >/dev/null 2>&1 || true
              wait_absent internet-gateway "$drill_ig_id" || failed=1
            fi
            if [[ -n "$drill_vcn_id" ]]; then
              oci network vcn delete --vcn-id "$drill_vcn_id" --force >/dev/null 2>&1 || true
              wait_absent vcn "$drill_vcn_id" || failed=1
            fi
            return "$failed"
          }
          cleanup() {
            local rc=$? cleanup_rc=0
            trap - EXIT
            set +e
            cleanup_temp_resources
            cleanup_rc=$?
            if (( cleanup_rc != 0 )); then
              echo 'UV_ROOT_TEMP_CLEANUP_INCOMPLETE' >&2
              (( rc != 0 )) || rc=90
            fi
            exit "$rc"
          }
          trap cleanup EXIT
          if backup="$(oci bv boot-volume-backup create --boot-volume-id "$boot_id" --type FULL --display-name "$stamp-full" --output json)"; then
            backup_id="$(printf '%s' "$backup" | python -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])')"
          else
            backup_id="$(discover_named_id backup "$stamp-full")"
          fi
          [[ -n "$backup_id" ]] || exit 36
          oci bv boot-volume-backup get --boot-volume-backup-id "$backup_id" --wait-for-state AVAILABLE --max-wait-seconds 3600 >/dev/null
          backup_json="$(oci bv boot-volume-backup get --boot-volume-backup-id "$backup_id" --output json)"
          BACKUP="$backup_json" BOOT_ID="$boot_id" python - <<'PY'
          import datetime,json,os
          d=json.loads(os.environ['BACKUP'])['data']
          assert d['boot-volume-id']==os.environ['BOOT_ID']
          assert d['lifecycle-state']=='AVAILABLE' and d['type']=='FULL' and d['size-in-gbs']==97
          created=datetime.datetime.fromisoformat(d['time-created'].replace('Z','+00:00'))
          assert (datetime.datetime.now(datetime.timezone.utc)-created).total_seconds() < 86400
          PY
          restored_attempted=1
          if restored="$(oci bv boot-volume create --boot-volume-backup-id "$backup_id" --availability-domain "$ad" --compartment-id "$tenancy_id" --display-name "$stamp-restore" --output json)"; then
            restored_id="$(printf '%s' "$restored" | python -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])')"
          else
            restored_id="$(discover_named_id boot-volume "$stamp-restore")"
          fi
          [[ -n "$restored_id" ]] || exit 37
          oci bv boot-volume get --boot-volume-id "$restored_id" --wait-for-state AVAILABLE --max-wait-seconds 3600 >/dev/null
          # Never boot the restored production image in a production network.  The
          # temporary VCN permits only stateful inbound SSH from this runner and
          # has no egress rules, NAT gateway, or service gateway.  Consequently
          # copied workers cannot initiate connections to Neon, OCI services, or
          # any other production endpoint while root usability is inspected.
          runner_ip="$(curl -fsS --max-time 15 https://api.ipify.org)"
          [[ "$runner_ip" =~ ^[0-9]+(\.[0-9]+){3}$ ]] || exit 35
          drill_vcn_attempted=1
          drill_vcn_json="$(oci network vcn create --compartment-id "$tenancy_id" --cidr-block 10.254.0.0/24 --display-name "$stamp-vcn" --output json)" || drill_vcn_json=""
          drill_vcn_id="$(printf '%s' "$drill_vcn_json" | python -c 'import json,sys; d=json.load(sys.stdin).get("data",{}) if sys.stdin.isatty() is False else {}; print(d.get("id", ""))' 2>/dev/null || true)"
          [[ -n "$drill_vcn_id" ]] || drill_vcn_id="$(discover_named_id vcn "$stamp-vcn")"
          [[ -n "$drill_vcn_id" ]] || exit 38
          oci network vcn get --vcn-id "$drill_vcn_id" --wait-for-state AVAILABLE --max-wait-seconds 600 >/dev/null
          drill_ig_attempted=1
          drill_ig_json="$(oci network internet-gateway create --compartment-id "$tenancy_id" --vcn-id "$drill_vcn_id" --is-enabled true --display-name "$stamp-ig" --output json)" || drill_ig_json=""
          drill_ig_id="$(printf '%s' "$drill_ig_json" | python -c 'import json,sys; print(json.load(sys.stdin).get("data",{}).get("id", ""))' 2>/dev/null || true)"
          [[ -n "$drill_ig_id" ]] || drill_ig_id="$(discover_named_id internet-gateway "$stamp-ig")"
          [[ -n "$drill_ig_id" ]] || exit 39
          oci network internet-gateway get --ig-id "$drill_ig_id" --wait-for-state AVAILABLE --max-wait-seconds 600 >/dev/null
          drill_route_attempted=1
          drill_route_json="$(oci network route-table create --compartment-id "$tenancy_id" --vcn-id "$drill_vcn_id" --display-name "$stamp-route" --route-rules "[{\"cidrBlock\":\"0.0.0.0/0\",\"networkEntityId\":\"$drill_ig_id\"}]" --output json)" || drill_route_json=""
          drill_route_id="$(printf '%s' "$drill_route_json" | python -c 'import json,sys; print(json.load(sys.stdin).get("data",{}).get("id", ""))' 2>/dev/null || true)"
          [[ -n "$drill_route_id" ]] || drill_route_id="$(discover_named_id route-table "$stamp-route")"
          [[ -n "$drill_route_id" ]] || exit 40
          oci network route-table get --rt-id "$drill_route_id" --wait-for-state AVAILABLE --max-wait-seconds 600 >/dev/null
          ingress="[{\"protocol\":\"6\",\"source\":\"$runner_ip/32\",\"sourceType\":\"CIDR_BLOCK\",\"isStateless\":false,\"tcpOptions\":{\"destinationPortRange\":{\"min\":22,\"max\":22}}}]"
          drill_security_attempted=1
          drill_security_json="$(oci network security-list create --compartment-id "$tenancy_id" --vcn-id "$drill_vcn_id" --display-name "$stamp-ssh-only" --egress-security-rules '[]' --ingress-security-rules "$ingress" --output json)" || drill_security_json=""
          drill_security_id="$(printf '%s' "$drill_security_json" | python -c 'import json,sys; print(json.load(sys.stdin).get("data",{}).get("id", ""))' 2>/dev/null || true)"
          [[ -n "$drill_security_id" ]] || drill_security_id="$(discover_named_id security-list "$stamp-ssh-only")"
          [[ -n "$drill_security_id" ]] || exit 41
          oci network security-list get --security-list-id "$drill_security_id" --wait-for-state AVAILABLE --max-wait-seconds 600 >/dev/null
          drill_subnet_attempted=1
          drill_subnet_json="$(oci network subnet create --availability-domain "$ad" --compartment-id "$tenancy_id" --vcn-id "$drill_vcn_id" --cidr-block 10.254.0.0/28 --display-name "$stamp-subnet" --route-table-id "$drill_route_id" --security-list-ids "[\"$drill_security_id\"]" --prohibit-public-ip-on-vnic false --output json)" || drill_subnet_json=""
          drill_subnet_id="$(printf '%s' "$drill_subnet_json" | python -c 'import json,sys; print(json.load(sys.stdin).get("data",{}).get("id", ""))' 2>/dev/null || true)"
          [[ -n "$drill_subnet_id" ]] || drill_subnet_id="$(discover_named_id subnet "$stamp-subnet")"
          [[ -n "$drill_subnet_id" ]] || exit 42
          oci network subnet get --subnet-id "$drill_subnet_id" --wait-for-state AVAILABLE --max-wait-seconds 600 >/dev/null
          launch="$(oci compute instance launch --availability-domain "$ad" --compartment-id "$tenancy_id" --subnet-id "$drill_subnet_id" --shape "$shape" --shape-config "$shape_config" --display-name "$stamp-boot-acceptance" --source-details "{\"sourceType\":\"bootVolume\",\"bootVolumeId\":\"$restored_id\"}" --assign-public-ip true --output json)"
          drill_instance_id="$(printf '%s' "$launch" | python -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])')"
          oci compute instance get --instance-id "$drill_instance_id" --wait-for-state RUNNING --max-wait-seconds 1800 >/dev/null
          drill_started="$(date -u +%s)"
          drill_vnic_id="$(oci compute vnic-attachment list --compartment-id "$tenancy_id" --instance-id "$drill_instance_id" --all --query 'data[?"lifecycle-state"==`ATTACHED`]."vnic-id" | [0]' --raw-output)"
          drill_public_ip="$(oci network vnic get --vnic-id "$drill_vnic_id" --query 'data."public-ip"' --raw-output)"
          [[ "$drill_public_ip" =~ ^[0-9]+(\.[0-9]+){3}$ ]] || exit 31
          known="$RUNNER_TEMP/drill-known-hosts"
          for _ in $(seq 1 60); do
            if ops/oracle_known_hosts_from_scan.sh "$drill_public_ip" "$EXPECTED_FINGERPRINT" "$known" 2>/dev/null; then break; fi
            sleep 5
          done
          [[ -s "$known" ]] || exit 32
          key="$RUNNER_TEMP/id_oracle-drill"
          printf '%s\n' "$SSH_KEY_ORACLE" > "$key"; chmod 0600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          acceptance="$(ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" -o ConnectTimeout=15 "$ORACLE_USER@$drill_public_ip" 'set -e; test -r /etc/os-release; findmnt -n -o SOURCE,FSTYPE /; test "$(findmnt -n -o OPTIONS /)" != ""; test -r /var/lib/bridge-school; echo UV_RESTORED_ROOT_BOOT_ACCEPTANCE_PASS')"
          grep -Fq UV_RESTORED_ROOT_BOOT_ACCEPTANCE_PASS <<<"$acceptance"
          drill_seconds="$(( $(date -u +%s) - drill_started ))"
          if ! cleanup_temp_resources; then
            # Do not invoke the EXIT trap a second time after a fully bounded
            # explicit cleanup attempt; fail closed with the retained IDs/name
            # stamp available in this run's log for operator reconciliation.
            trap - EXIT
            echo 'UV_ROOT_TEMP_CLEANUP_INCOMPLETE' >&2
            exit 90
          fi
          drill_instance_id=""; restored_id=""; drill_subnet_id=""; drill_security_id=""
          drill_route_id=""; drill_ig_id=""; drill_vcn_id=""
          trap - EXIT
          echo "backup_id=$backup_id" >> "$GITHUB_OUTPUT"
          echo "source_boot_id=$boot_id" >> "$GITHUB_OUTPUT"
          echo "source_instance_id=$instance_id" >> "$GITHUB_OUTPUT"
          echo "temporary_instance_seconds=$drill_seconds" >> "$GITHUB_OUTPUT"
          echo 'UV_ROOT_BACKUP_GATE_PASS type=FULL size_gb=97 state=AVAILABLE age_lt_24h=true restored_root_boot_acceptance=true isolated_no_egress_network=true source_public_ip_bound=true temporary_instance_deleted=true temporary_volume_deleted=true temporary_network_deleted=true temporary_paid_capacity_authorized=true'
      - name: Resolve pinned SSH identity
        id: ssh
        run: |
          set -euo pipefail
          known="$RUNNER_TEMP/known_hosts"
          ops/oracle_known_hosts_from_scan.sh "$ORACLE_HOST" "$EXPECTED_FINGERPRINT" "$known"
          key="$RUNNER_TEMP/id_oracle"
          printf '%s\n' "$SSH_KEY_ORACLE" > "$key"
          chmod 0600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          echo "known=$known" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Create and restore-test partition recovery point
        run: |
          set -euo pipefail
          ssh -i '${{ steps.ssh.outputs.key }}' -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='${{ steps.ssh.outputs.known }}' -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST" \
            "sudo -n env EXPECTED_HOSTNAME='$EXPECTED_HOSTNAME' EXPECTED_MIN_DISK_BYTES=90000000000 EXPECTED_MAX_DISK_BYTES=105000000000 MIN_FREE_KB=5242880 CHECKPOINT_ONLY=1 /bin/bash -s" \
            < ops/oracle_universal_video_root_filesystem_expand.sh | tee "$RUNNER_TEMP/root-checkpoint.txt"
          line="$(grep -E '^UV_ROOT_CHECKPOINT_PASS disk_bytes=[0-9]+ checkpoint=/var/lib/bridge-school/root-partition-recovery/issue-881-before-expand\.sfdisk sha256=[0-9a-f]{64}$' "$RUNNER_TEMP/root-checkpoint.txt")"
          disk_bytes="$(sed -E 's/^.*disk_bytes=([0-9]+).*$/\1/' <<<"$line")"
          expected_sha="$(sed -E 's/^.*sha256=([0-9a-f]{64})$/\1/' <<<"$line")"
          ssh -i '${{ steps.ssh.outputs.key }}' -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='${{ steps.ssh.outputs.known }}' -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST" \
            'sudo -n cat /var/lib/bridge-school/root-partition-recovery/issue-881-before-expand.sfdisk' > "$RUNNER_TEMP/root-before.sfdisk"
          [[ "$(sha256sum "$RUNNER_TEMP/root-before.sfdisk" | awk '{print $1}')" == "$expected_sha" ]]
          truncate -s "$disk_bytes" "$RUNNER_TEMP/restore-test.img"
          sudo sfdisk "$RUNNER_TEMP/restore-test.img" < "$RUNNER_TEMP/root-before.sfdisk"
          sudo sfdisk --verify "$RUNNER_TEMP/restore-test.img"
          rm -f "$RUNNER_TEMP/restore-test.img"
      - name: Retain recovery point
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-881-root-partition-recovery-${{ github.sha }}
          path: ${{ runner.temp }}/root-before.sfdisk
          if-no-files-found: error
          retention-days: 30
      - name: Reconcile current main immediately before mutation
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]]
          export OCI_CLI_REGION="$OCI_REGION"
          instance_id='${{ steps.backup.outputs.source_instance_id }}'
          boot_id='${{ steps.backup.outputs.source_boot_id }}'
          backup_id='${{ steps.backup.outputs.backup_id }}'
          instance_json="$(oci compute instance get --instance-id "$instance_id" --output json)"
          INSTANCE="$instance_json" python - <<'PY'
          import json,os
          d=json.loads(os.environ['INSTANCE'])['data']
          assert d['display-name']=='bridge-school-dds3-frankfurt'
          assert d['lifecycle-state']=='RUNNING'
          PY
          ad="$(printf '%s' "$instance_json" | python -c 'import json,sys; print(json.load(sys.stdin)["data"]["availability-domain"])')"
          tenancy_id="$(printf '%s' "$instance_json" | python -c 'import json,sys; print(json.load(sys.stdin)["data"]["compartment-id"])')"
          source_vnics="$(oci compute vnic-attachment list --compartment-id "$tenancy_id" --instance-id "$instance_id" --all --output json)"
          source_vnic_id="$(printf '%s' "$source_vnics" | python -c 'import json,sys; xs=[x["vnic-id"] for x in json.load(sys.stdin)["data"] if x.get("lifecycle-state")=="ATTACHED"]; assert len(xs)==1; print(xs[0])')"
          source_public_ip="$(oci network vnic get --vnic-id "$source_vnic_id" --query 'data."public-ip"' --raw-output)"
          [[ "$source_public_ip" == "$ORACLE_HOST" ]]
          attachments="$(oci compute boot-volume-attachment list --compartment-id "$tenancy_id" --availability-domain "$ad" --instance-id "$instance_id" --all --output json)"
          ATTACHMENTS="$attachments" BOOT_ID="$boot_id" python - <<'PY'
          import json,os
          xs=[x for x in json.loads(os.environ['ATTACHMENTS'])['data'] if x.get('lifecycle-state')=='ATTACHED' and x.get('boot-volume-id')==os.environ['BOOT_ID']]
          assert len(xs)==1
          PY
          boot_size="$(oci bv boot-volume get --boot-volume-id "$boot_id" --query 'data."size-in-gbs"' --raw-output)"
          [[ "$boot_size" == 97 ]]
          backup="$(oci bv boot-volume-backup get --boot-volume-backup-id "$backup_id" --output json)"
          BACKUP="$backup" BOOT_ID="$boot_id" python - <<'PY'
          import datetime,json,os
          d=json.loads(os.environ['BACKUP'])['data']
          assert d['boot-volume-id']==os.environ['BOOT_ID'] and d['lifecycle-state']=='AVAILABLE' and d['type']=='FULL' and d['size-in-gbs']==97
          created=datetime.datetime.fromisoformat(d['time-created'].replace('Z','+00:00'))
          assert (datetime.datetime.now(datetime.timezone.utc)-created).total_seconds() < 86400
          PY
          echo 'UV_ROOT_LAST_SECOND_REVALIDATION_PASS attachment=true source_public_ip_bound=true backup_available=true backup_age_lt_24h=true restored_root_boot_acceptance=true'
      - name: Expand existing root partition and filesystem
        run: |
          set -euo pipefail
          ssh -i '${{ steps.ssh.outputs.key }}' -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='${{ steps.ssh.outputs.known }}' -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST" \
            "sudo -n env EXPECTED_HOSTNAME='$EXPECTED_HOSTNAME' EXPECTED_MIN_DISK_BYTES=90000000000 EXPECTED_MAX_DISK_BYTES=105000000000 MIN_FREE_KB=5242880 /bin/bash -s" \
            < ops/oracle_universal_video_root_filesystem_expand.sh | tee "$RUNNER_TEMP/root-expand.txt"
          grep -E '^UV_ROOT_EXPAND_PASS .*disk_bytes=[0-9]+ .*free_kb_after=[0-9]+$' "$RUNNER_TEMP/root-expand.txt"
      - name: Recover exact image and restart only container service
        run: |
          set -euo pipefail
          ssh -i '${{ steps.ssh.outputs.key }}' -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='${{ steps.ssh.outputs.known }}' -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST" \
            "sudo -n env UNIVERSAL_VIDEO_EXPECTED_SHA='$EXACT_RUNTIME_SHA' /bin/bash -s" \
            < ops/oracle_universal_video_container_missing_image_recover.sh | tee "$RUNNER_TEMP/recovery.txt"
          grep -E '^UV_CONTAINER_RECOVERY_PASS runtime_sha=[0-9a-f]{40} backup=/var/lib/bridge-school/universal-video-container-recovery/[^ ]+ image_digest=sha256:[0-9a-f]{64}$' "$RUNNER_TEMP/recovery.txt"
      - name: Publish bounded operational receipt
        if: ${{ always() }}
        env:
          BACKUP_OUTCOME: ${{ steps.backup.outcome }}
          TEMP_INSTANCE_SECONDS: ${{ steps.backup.outputs.temporary_instance_seconds }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/issue-881-root-expand-receipt.md"
          {
            echo '## Issue #881 guarded root expansion and exact-image recovery'
            echo
            echo "- workflow outcome: \\`${{ job.status }}\\`"
            echo "- fresh 97 GB FULL backup gate: \\`${BACKUP_OUTCOME}\\`"
            echo '- fresh backup retained: `true` (billable backup storage may apply)'
            echo '- temporary cleanup: `ENFORCED_BY_EXIT_TRAP`; inspect the run before accepting a failed gate'
            echo "- temporary instance runtime seconds: \\`${TEMP_INSTANCE_SECONDS:-unknown}\\`"
            echo '- exact monetary charge: `PENDING_OCI_BILLING_EXPORT`'
            echo '- media canary: `false`'
            echo "- run: ${RUN_URL}"
          } > "$body"
          gh issue comment 881 --repo "$GITHUB_REPOSITORY" --body-file "$body"
