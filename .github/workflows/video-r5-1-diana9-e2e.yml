name: Bridge Video r5.1 Diana 9 E2E

on:
  push:
    branches:
      - algorithm/3.1-free-r5.1-asr-zero-fail
    paths:
      - '.github/workflows/video-r5-1-diana9-e2e.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: bridge-video-r5-1-diana9-e2e
  cancel-in-progress: false

jobs:
  diana9-e2e:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      BRIDGE_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      BRIDGE_RUNNER_LABEL: ubuntu-24.04
      BRIDGE_LARGER_RUNNER: "false"
      BRIDGE_PAID_CLOUD: "false"
      BRIDGE_BILLING_FALLBACK: "false"
      BRIDGE_JOB_ID: 50b5b5c4c77e4b49f1dd745275066012
      PYTHONUNBUFFERED: "1"
      WHISPER_MODEL: small

    steps:
      - name: Checkout r5.1 candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install free open-source runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check -r requirements-worker.txt

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: bridge-video-automation
          workload_identity_provider: projects/499454355457/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: bridge-video-worker@bridge-video-automation.iam.gserviceaccount.com
          create_credentials_file: true

      - name: Google Drive user OAuth preflight
        env:
          GOOGLE_DRIVE_OAUTH_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_JSON }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from run_drive_3_1_free_oidc import user_oauth_token
          token = user_oauth_token()
          if not token:
              raise SystemExit('BLOCKED_ACCESS: GOOGLE_DRIVE_OAUTH_JSON secret is not configured')
          print('Google Drive user OAuth preflight: PASS')
          PY

      - name: Optional database runtime preflight
        env:
          BRIDGE_WORKER_DATABASE_URL: ${{ secrets.BRIDGE_WORKER_DATABASE_URL }}
        run: |
          set -uo pipefail
          if [ -z "${BRIDGE_WORKER_DATABASE_URL:-}" ]; then
            echo 'DATABASE_PERSIST_SKIPPED: BRIDGE_WORKER_DATABASE_URL is not configured'
            echo 'BRIDGE_WORKER_DATABASE_URL=' >> "$GITHUB_ENV"
          elif python database/runtime_worker_preflight.py; then
            echo 'BRIDGE_WORKER_DATABASE_URL='${BRIDGE_WORKER_DATABASE_URL} >> "$GITHUB_ENV"
          else
            echo 'DATABASE_PERSIST_SKIPPED: database preflight failed; core video processing will continue' >&2
            echo 'BRIDGE_WORKER_DATABASE_URL=' >> "$GITHUB_ENV"
          fi

      - name: FREE-GUARD
        run: python bridge_worker_3_1_free.py

      - name: Process Diana 9 with r5.1 candidate
        env:
          GOOGLE_DRIVE_OAUTH_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_JSON }}
        run: |
          set -euo pipefail
          python run_drive_3_1_free_oidc.py
