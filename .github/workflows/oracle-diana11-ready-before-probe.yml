name: Oracle Diana 11 READY_BEFORE Probe

on:
  pull_request:
    paths:
      - '.github/workflows/oracle-diana11-ready-before-probe.yml'
      - 'ops/probe_uv003_ready_before.py'
      - 'tests/test_uv003_ready_before_probe.py'
      - 'ops/oracle_known_hosts_from_scan.sh'
  push:
    branches: [main]
    paths:
      - 'ops/oracle-diana11-ready-before-probe-requests/*.json'

permissions:
  contents: read
  issues: write

concurrency:
  group: oracle-diana11-ready-before-probe-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      issue: ${{ steps.request.outputs.issue }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Validate read-only diagnostic contract
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile ops/probe_uv003_ready_before.py
          bash -n ops/oracle_known_hosts_from_scan.sh
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q tests/test_uv003_ready_before_probe.py
          grep -Fq 'READY_HOST = "127.0.0.1"' ops/probe_uv003_ready_before.py
          grep -Fq 'READY_PORT = 8080' ops/probe_uv003_ready_before.py
          grep -Fq 'READY_PATH = "/readyz"' ops/probe_uv003_ready_before.py
          grep -Fq 'UV003_READY_BEFORE_CODE=' ops/probe_uv003_ready_before.py
          for forbidden in 'spool/inbox' 'submit-bridge' 'drive_results' 'GOOGLE_DRIVE' 'ffmpeg' 'faster_whisper' 'systemctl restart' 'systemctl stop' 'systemctl start'; do
            ! grep -Fq "$forbidden" ops/probe_uv003_ready_before.py || { echo "forbidden probe surface: $forbidden" >&2; exit 1; }
          done
      - name: Validate exact diagnostic request
        id: request
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff-tree -m --no-commit-id --name-only -r "$GITHUB_SHA" \
            | grep -E '^ops/oracle-diana11-ready-before-probe-requests/[^/]+\.json$' | sort -u)
          [[ ${#files[@]} -eq 1 ]] || { echo 'expected exactly one UV003 READY_BEFORE probe request' >&2; exit 1; }
          REQUEST_FILE="${files[0]}" python - <<'PY' >> "$GITHUB_OUTPUT"
          import json,os,re
          x=json.load(open(os.environ['REQUEST_FILE'], encoding='utf-8'))
          assert set(x)=={'request_id','issue','probe'}
          assert re.fullmatch(r'[A-Za-z0-9._-]{1,80}', str(x['request_id']))
          assert x['issue']==566
          assert x['probe']=='ready-before-local-v1'
          print('issue=566')
          PY

  probe:
    if: ${{ github.event_name == 'push' }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ORACLE_HOST: 158.180.47.161
      ORACLE_USER: ubuntu
      SSH_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ needs.validate.outputs.issue }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Verify host identity and key
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          key="$RUNNER_TEMP/id_oracle"
          printf '%s\n' "$SSH_KEY" > "$key"
          chmod 0600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          known="$RUNNER_TEMP/known_hosts"
          : > "$known"
          index=0
          for expected in \
            'SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk' \
            'SHA256:UGJo5yPdnk/wf8DVrzvXt2xJkE9GJ8+3IIcQ2vA+mkc' \
            'SHA256:eRCJ8c4V7HCBlIoNVSlpPSWZE5xPUMjBD6f0PvHDj64'; do
            part="$RUNNER_TEMP/known_hosts.$index"
            ops/oracle_known_hosts_from_scan.sh "$ORACLE_HOST" "$expected" "$part"
            cat "$part" >> "$known"
            index=$((index + 1))
          done
          sort -u -o "$known" "$known"
          test -s "$known"
          actual="$(ssh-keygen -lf "$known" | awk '{print $2}' | sort -u | paste -sd, -)"
          expected="$(printf '%s\n' \
            'SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk' \
            'SHA256:UGJo5yPdnk/wf8DVrzvXt2xJkE9GJ8+3IIcQ2vA+mkc' \
            'SHA256:eRCJ8c4V7HCBlIoNVSlpPSWZE5xPUMjBD6f0PvHDj64' | sort -u | paste -sd, -)"
          [[ "$actual" == "$expected" ]] || exit 1
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "known=$known" >> "$GITHUB_OUTPUT"
      - name: Execute exact local read-only discriminator
        id: discriminator
        shell: bash
        run: |
          set -euo pipefail
          ssh_cmd=(ssh -i '${{ steps.ssh.outputs.key }}' -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='${{ steps.ssh.outputs.known }}' -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST")
          cat ops/probe_uv003_ready_before.py | "${ssh_cmd[@]}" 'cat > /tmp/uv003-ready-before-probe.py && chmod 0500 /tmp/uv003-ready-before-probe.py'
          raw=''
          rc=0
          if raw="$("${ssh_cmd[@]}" 'python3 /tmp/uv003-ready-before-probe.py' 2>&1)"; then
            rc=0
          else
            rc=$?
          fi
          RAW="$raw" RC="$rc" python - <<'PY' > "$RUNNER_TEMP/uv003-ready-before-safe.txt"
          import os,re
          codes=(
            'ASSISTANT_SERVICE_INACTIVE','VIDEO_SERVICE_INACTIVE','SYSTEMCTL_UNAVAILABLE',
            'CONNECT_REFUSED','FETCH_TIMEOUT','FETCH_FAILED','HTTP_NOT_2XX',
            'BODY_TOO_LARGE','UTF8_INVALID','JSON_INVALID','JSON_NOT_OBJECT',
            'STATUS_MISSING','STATUS_NOT_READY','ENGINE_MISSING','ENGINE_NOT_DDS3',
            'FALLBACK_MISSING','FALLBACK_NOT_FALSE','POSITION_SOLVER_MISSING',
            'POSITION_SOLVER_NOT_READY','INTERNAL_FAILURE','PASS',
          )
          allowed=re.compile(r'^UV003_READY_BEFORE_CODE=(?:'+'|'.join(codes)+r')$')
          seen=[]
          for line in os.environ['RAW'].splitlines():
              if allowed.fullmatch(line) and line not in seen:
                  seen.append(line)
          if os.environ['RC'] != '0' or len(seen) != 1:
              print('UV003_READY_BEFORE_CODE=REMOTE_UNCLASSIFIED')
          else:
              print(seen[0])
          PY
          cat "$RUNNER_TEMP/uv003-ready-before-safe.txt"
          [[ "$(wc -l < "$RUNNER_TEMP/uv003-ready-before-safe.txt")" == 1 ]]
          grep -Eq '^UV003_READY_BEFORE_CODE=(ASSISTANT_SERVICE_INACTIVE|VIDEO_SERVICE_INACTIVE|SYSTEMCTL_UNAVAILABLE|CONNECT_REFUSED|FETCH_TIMEOUT|FETCH_FAILED|HTTP_NOT_2XX|BODY_TOO_LARGE|UTF8_INVALID|JSON_INVALID|JSON_NOT_OBJECT|STATUS_MISSING|STATUS_NOT_READY|ENGINE_MISSING|ENGINE_NOT_DDS3|FALLBACK_MISSING|FALLBACK_NOT_FALSE|POSITION_SOLVER_MISSING|POSITION_SOLVER_NOT_READY|INTERNAL_FAILURE|PASS|REMOTE_UNCLASSIFIED)$' "$RUNNER_TEMP/uv003-ready-before-safe.txt"
          code="$(cut -d= -f2 "$RUNNER_TEMP/uv003-ready-before-safe.txt")"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo 'observed=true' >> "$GITHUB_OUTPUT"
      - name: Record bounded diagnostic evidence
        if: ${{ always() }}
        shell: bash
        env:
          OBSERVED: ${{ steps.discriminator.outputs.observed }}
          CODE: ${{ steps.discriminator.outputs.code }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/comment.md"
          {
            echo '[OBSERVATORY] UV003 READY_BEFORE read-only discriminator.'
            echo
            if [[ "${OBSERVED:-}" == true && -s "$RUNNER_TEMP/uv003-ready-before-safe.txt" ]]; then
              echo '```text'
              cat "$RUNNER_TEMP/uv003-ready-before-safe.txt"
              echo '```'
              echo
              echo 'The diagnostic read only local service state and the bounded local readiness document.'
            else
              echo 'The discriminator failed closed before producing one allowlisted code.'
            fi
            echo 'No service restart, runtime-env mutation, job submit, media/ASR processing, Drive write, retry, publication, or production promotion occurred.'
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$body"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$body"
