name: Book WORLD contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'bridge_contracts/book_*.py'
      - 'database/book_world_persistence.py'
      - 'database/book_source_reconciliation.py'
      - 'database/source_registration.py'
      - 'database/source_identity_persistence.py'
      - 'database/book_source_operator.py'
      - 'database/video_result_persistence.py'
      - 'database/tournament_facts_importer.py'
      - 'database/migrations/**'
      - 'database/scripts/migrate.sh'
      - 'tests/test_shared_source_registration_postgres.py'
      - 'bridge_school_api/knowledge.py'
      - 'bridge_school_api/book_runtime_identity.py'
      - 'tests/test_book_*.py'
      - 'tools/book_candidate_import/**'
      - 'tests/fixtures/book_world_postgres.sql'
      - 'schemas/book-material-staging-v1.schema.json'
      - '.github/workflows/book-world-contract.yml'

permissions:
  contents: read

jobs:
  synthetic-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: book_world_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      BOOK_WORLD_PG_TEST: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-api.txt pytest==8.4.2 httpx==0.28.1 jsonschema==4.25.1
      - run: >-
          python -m pytest -q tests/test_book_candidate_import.py
          tests/test_book_material_staging.py tests/test_book_world.py
          tests/test_book_world_admission.py
          tests/test_book_teacher_api.py tests/test_book_world_postgres.py
          tests/test_book_runtime_identity.py tests/test_book_source_identity.py
          tests/test_book_source_registration.py tests/test_book_source_operator.py
          tests/test_book_source_registration_postgres.py
          tests/test_knowledge_read_api.py tests/test_canon_source_domain_policy.py


  shared-registration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: book_world_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      BOOK_WORLD_PG_TEST: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-api.txt pytest==8.4.2 httpx==0.28.1 jsonschema==4.25.1
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply unchanged migrations to disposable database
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/book_world_test
          LC_ALL: C
        run: bash database/scripts/migrate.sh
      - name: Verify shared writers on the migrated schema
        run: python -m pytest -q tests/test_shared_source_registration_postgres.py
