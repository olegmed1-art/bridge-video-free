name: Delete retired heavy Oracle

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: retired-heavy-oracle-deletion
  cancel-in-progress: false

jobs:
  delete:
    if: >-
      github.actor == github.repository_owner &&
      github.event.issue.number == 1131 &&
      github.event.comment.body == '/delete-retired-heavy-oracle confirm-delete-instance-and-boot-volume'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OCI_REGION: eu-frankfurt-1
      OCI_INSTANCE_OCID: ocid1.instance.oc1.eu-frankfurt-1.antheljtruoejaica7hj5oubnh2cctnjr7ti7llcgo6ho6wdvgvui6td7saq
      EXPECTED_INSTANCE_NAME: bridge-school-dds3-frankfurt
      EXPECTED_BOOT_GB: "97"
    steps:
      - name: Validate credential presence
        env:
          OCI_CLI_CONFIG: ${{ secrets.OCI_CLI_CONFIG }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
        run: |
          set -euo pipefail
          test -n "${OCI_CLI_CONFIG:-}"
          test -n "${OCI_CLI_KEY_CONTENT:-}"

      - name: Install OCI CLI
        run: python -m pip install --disable-pip-version-check --quiet 'oci-cli==3.90.3'

      - name: Configure bounded OCI client
        env:
          OCI_CLI_CONFIG: ${{ secrets.OCI_CLI_CONFIG }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.oci"
          if [[ "$OCI_CLI_KEY_CONTENT" == base64:* ]]; then
            printf '%s' "${OCI_CLI_KEY_CONTENT#base64:}" | base64 --decode > "$HOME/.oci/oci_api_key.pem"
          else
            printf '%s\n' "$OCI_CLI_KEY_CONTENT" > "$HOME/.oci/oci_api_key.pem"
          fi
          printf '%s\n' "$OCI_CLI_CONFIG" > "$HOME/.oci/config"
          openssl pkey -in "$HOME/.oci/oci_api_key.pem" -noout -check >/dev/null
          openssl pkey -in "$HOME/.oci/oci_api_key.pem" -traditional -out "$HOME/.oci/oci_api_key.pkcs1.pem"
          mv "$HOME/.oci/oci_api_key.pkcs1.pem" "$HOME/.oci/oci_api_key.pem"
          actual_fingerprint="$(openssl pkey -in "$HOME/.oci/oci_api_key.pem" -pubout -outform DER | openssl md5 -r | awk '{print $1}' | sed 's/../&:/g;s/:$//')"
          OCI_DERIVED_FINGERPRINT="$actual_fingerprint" python - <<'PY'
          import os
          from pathlib import Path
          p=Path.home()/'.oci/config'
          out=[]; seen_key=False; seen_region=False; seen_fp=False
          for line in p.read_text().splitlines():
              if line.strip().startswith('key_file='):
                  out.append(f'key_file={Path.home()}/.oci/oci_api_key.pem'); seen_key=True
              elif line.strip().startswith('region='):
                  out.append('region=eu-frankfurt-1'); seen_region=True
              elif line.strip().startswith('fingerprint='):
                  out.append(f'fingerprint={os.environ["OCI_DERIVED_FINGERPRINT"]}'); seen_fp=True
              else:
                  out.append(line)
          if not seen_key: out.append(f'key_file={Path.home()}/.oci/oci_api_key.pem')
          if not seen_region: out.append('region=eu-frankfurt-1')
          if not seen_fp: out.append(f'fingerprint={os.environ["OCI_DERIVED_FINGERPRINT"]}')
          p.write_text('\n'.join(out)+'\n')
          PY
          oci iam region list --output json >/dev/null

      - name: Resolve exact instance and boot volume
        id: target
        run: |
          set -euo pipefail
          instance_json="$(oci compute instance get --instance-id "$OCI_INSTANCE_OCID" --output json)"
          INSTANCE_JSON="$instance_json" python - <<'PY'
          import json, os
          d=json.loads(os.environ["INSTANCE_JSON"])["data"]
          assert d["id"] == os.environ["OCI_INSTANCE_OCID"]
          assert d["display-name"] == os.environ["EXPECTED_INSTANCE_NAME"]
          assert d["region"] == os.environ["OCI_REGION"]
          assert d["lifecycle-state"] in {"RUNNING","STOPPED"}
          PY
          compartment="$(printf '%s' "$instance_json" | python -c 'import json,sys; print(json.load(sys.stdin)["data"]["compartment-id"])')"
          ad="$(printf '%s' "$instance_json" | python -c 'import json,sys; print(json.load(sys.stdin)["data"]["availability-domain"])')"
          attachments="$(oci compute boot-volume-attachment list --compartment-id "$compartment" --availability-domain "$ad" --instance-id "$OCI_INSTANCE_OCID" --all --output json)"
          boot_id="$(printf '%s' "$attachments" | python -c 'import json,os,sys; xs=[x for x in json.load(sys.stdin)["data"] if x.get("instance-id")==os.environ["OCI_INSTANCE_OCID"] and x.get("lifecycle-state")=="ATTACHED"]; assert len(xs)==1; print(xs[0]["boot-volume-id"])')"
          boot_json="$(oci bv boot-volume get --boot-volume-id "$boot_id" --output json)"
          BOOT_JSON="$boot_json" EXPECTED_BOOT_ID="$boot_id" EXPECTED_COMPARTMENT="$compartment" EXPECTED_AD="$ad" python - <<'PY'
          import json, os
          d=json.loads(os.environ["BOOT_JSON"])["data"]
          assert d["id"] == os.environ["EXPECTED_BOOT_ID"]
          assert d["compartment-id"] == os.environ["EXPECTED_COMPARTMENT"]
          assert d["availability-domain"] == os.environ["EXPECTED_AD"]
          assert d["lifecycle-state"] == "AVAILABLE"
          assert str(d["size-in-gbs"]) == os.environ["EXPECTED_BOOT_GB"]
          PY
          echo "boot_volume_id=$boot_id" >> "$GITHUB_OUTPUT"
          echo "exact target resolved"

      - name: Terminate instance and delete boot volume
        id: terminate
        env:
          BOOT_VOLUME_ID: ${{ steps.target.outputs.boot_volume_id }}
        run: |
          set -euo pipefail
          test -n "$BOOT_VOLUME_ID"
          oci compute instance terminate --instance-id "$OCI_INSTANCE_OCID" --preserve-boot-volume false --force >/dev/null
          instance_state=""
          for _ in $(seq 1 120); do
            instance_state="$(oci compute instance get --instance-id "$OCI_INSTANCE_OCID" --query 'data."lifecycle-state"' --raw-output 2>/dev/null || true)"
            [[ "$instance_state" == TERMINATED ]] && break
            [[ "$instance_state" == TERMINATING || "$instance_state" == STOPPING || "$instance_state" == RUNNING || "$instance_state" == STOPPED ]] || { echo "unexpected instance state: ${instance_state:-ABSENT}" >&2; exit 7; }
            sleep 10
          done
          [[ "$instance_state" == TERMINATED ]] || { echo "instance termination timed out" >&2; exit 8; }

          explicit_delete=0
          for _ in $(seq 1 120); do
            if ! boot_state="$(oci bv boot-volume get --boot-volume-id "$BOOT_VOLUME_ID" --query 'data."lifecycle-state"' --raw-output 2>/dev/null)"; then
              echo "instance=TERMINATED boot_volume=ABSENT"
              exit 0
            fi
            case "$boot_state" in
              TERMINATED)
                echo "instance=TERMINATED boot_volume=TERMINATED"
                exit 0
                ;;
              AVAILABLE)
                if [[ "$explicit_delete" == 0 ]]; then
                  oci bv boot-volume delete --boot-volume-id "$BOOT_VOLUME_ID" --force >/dev/null
                  explicit_delete=1
                fi
                ;;
              TERMINATING) ;;
              *) echo "unexpected boot state: $boot_state" >&2; exit 9 ;;
            esac
            sleep 10
          done
          echo "boot volume deletion timed out" >&2
          exit 10

      - name: Publish receipt
        if: ${{ always() }}
        run: |
          {
            echo "### Retired heavy Oracle deletion"
            echo "- exact instance: $EXPECTED_INSTANCE_NAME"
            echo "- exact OCID: $OCI_INSTANCE_OCID"
            echo "- preserve boot volume: false"
            echo "- expected boot size: $EXPECTED_BOOT_GB GB"
            echo "- result: ${{ steps.terminate.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
