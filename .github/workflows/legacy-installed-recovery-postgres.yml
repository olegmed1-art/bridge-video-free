name: Legacy installed 0060 recovery PostgreSQL 18
on:
  pull_request:
    paths:
      - '.github/workflows/legacy-installed-recovery-postgres.yml'
      - 'database/**'
      - 'tests/test_legacy_installed_recovery_packet.py'
      - 'tests/test_universal_video_connector_recovery.py'
permissions:
  contents: read
concurrency:
  group: legacy-installed-0060-disposable
  cancel-in-progress: false
jobs:
  legacy-recovery:
    if: >-
      github.repository == 'olegmed1-art/bridge-video-free' &&
      github.event.repository.private == false && github.actor == github.repository_owner &&
      github.run_attempt == 1 &&
      github.event.pull_request.head.repo.full_name == 'olegmed1-art/bridge-video-free' &&
      github.event.pull_request.head.ref == 'codex/legacy-0060-recovery-local-20261016'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
        env:
          POSTGRES_DB: neondb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_INITDB_ARGS: >-
            -c max_connections=8 -c superuser_reserved_connections=0
            -c reserved_connections=0 -c max_wal_senders=0
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --cpus 2 --memory 1536m
          --health-cmd "test -f /tmp/legacy-ready || (pg_isready -h 127.0.0.1 -U postgres -d neondb && touch /tmp/legacy-ready)"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact proposal parent and historical installer source
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          test "$(git cat-file -p HEAD | sed -n 's/^parent //p')" = 3c44cf1b650404b2cd5585ae7e16b990d2161bf9
          git fetch --no-tags --depth=1 origin 744d068a2cddfb8347411c8e4fb2bd69d19c09ab
          mkdir -p "$RUNNER_TEMP/legacy-evidence" "$RUNNER_TEMP/legacy-home"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/legacy-evidence/source.txt"
          git diff --diff-filter=ACMR --name-only HEAD^ HEAD -z | xargs -0 sha256sum > "$RUNNER_TEMP/legacy-evidence/source-sha256.txt"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install public test dependencies
        timeout-minutes: 3
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client >/dev/null
          fi
          python -m pip install 'pytest==8.4.2' 'psycopg[binary]==3.3.4'
      - name: Offline old and new recovery contracts
        run: |
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/legacy-home" PYTHONPATH="$GITHUB_WORKSPACE" \
            PYTHONDONTWRITEBYTECODE=1 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            python -m pytest -q -p no:cacheprovider tests/test_universal_video_connector_recovery.py \
            tests/test_legacy_installed_recovery_packet.py --basetemp="$RUNNER_TEMP/legacy-pytest" \
            --junitxml="$RUNNER_TEMP/legacy-evidence/unit.xml"
      - name: Both immutable migration histories
        run: |
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/legacy-home" PYTHONPATH="$GITHUB_WORKSPACE" \
            PYTHONDONTWRITEBYTECODE=1 python database/tests/fixed_subset_admission/history_compatibility_fixture.py \
            --execute --evidence "$RUNNER_TEMP/legacy-evidence/history"
      - name: Exact historical installer and proposed recovery v2
        run: |
          timeout --signal=INT --kill-after=20s 840s \
            env -i PATH="$PATH" HOME="$RUNNER_TEMP/legacy-home" PYTHONPATH="$GITHUB_WORKSPACE" \
            PYTHONDONTWRITEBYTECODE=1 python database/tests/fixed_subset_admission/legacy_installed_recovery_fixture.py \
            --execute --evidence "$RUNNER_TEMP/legacy-evidence/runner"
      - name: Capture final database census
        if: always()
        timeout-minutes: 1
        run: |
          mkdir -p "$RUNNER_TEMP/legacy-evidence"
          env -i PATH="$PATH" PGCONNECT_TIMEOUT=5 PGOPTIONS='-c statement_timeout=5000' \
            timeout 15s psql 'postgresql://postgres:postgres@127.0.0.1:5432/neondb' -X -A -t -v ON_ERROR_STOP=1 -c \
            "SELECT jsonb_build_object('version',current_setting('server_version_num'),'other_clients',(SELECT count(*) FROM pg_stat_activity WHERE backend_type='client backend' AND pid<>pg_backend_pid()),'advisory_locks',(SELECT count(*) FROM pg_locks WHERE locktype='advisory'),'prepared',(SELECT count(*) FROM pg_prepared_xacts));" \
            > "$RUNNER_TEMP/legacy-evidence/final-census.json"
      - name: Destroy only the disposable service and storage
        if: always()
        timeout-minutes: 2
        env:
          PG_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          python - <<'PY'
          import json, os, pathlib, re, subprocess
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'legacy-evidence'
          out.mkdir(exist_ok=True)
          result = {'status':'FAIL_OR_UNKNOWN','commands':[]}
          def call(*args):
              r = subprocess.run(['docker',*args],capture_output=True,text=True,timeout=25)
              result['commands'].append({'args':args,'code':r.returncode,'stdout':r.stdout,'stderr':r.stderr})
              return r
          try:
              cid = os.environ['PG_SERVICE_ID']
              assert re.fullmatch(r'[0-9a-f]{64}',cid)
              inspected = call('inspect',cid)
              assert inspected.returncode == 0
              data = json.loads(inspected.stdout)[0]
              assert data['Config']['Image'] == 'postgres:18-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c'
              networks = list(data['NetworkSettings']['Networks'])
              assert len(networks) == 1 and networks[0].startswith('github_network_')
              volumes = [m['Name'] for m in data['Mounts'] if m['Type']=='volume']
              assert call('rm','--force','--volumes',cid).returncode == 0
              assert call('inspect',cid).returncode != 0
              assert all(call('volume','inspect',v).returncode != 0 for v in volumes)
              assert call('network','rm',networks[0]).returncode == 0
              assert call('network','inspect',networks[0]).returncode != 0
              result['status'] = 'PASS'
          finally:
              (out/'cleanup.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
      - name: Accept complete evidence only
        if: always()
        run: |
          python - <<'PY'
          import json, os, pathlib, xml.etree.ElementTree as ET
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'legacy-evidence'
          r=json.loads((out/'runner/results.json').read_text())
          assert r['status']=='PASS_LEGACY_INSTALLED_RECOVERY_V2'
          assert len(r['negative_cases'])==16 and all(x['status']=='PASS' and x['exact_snapshot_equal'] for x in r['negative_cases'])
          assert r['retained_rows'] and r['duplicate_reservations'] and r['legacy_acl_owner_definition_equal'] and r['original_registry_unchanged']
          assert r['retained_tables']==4 and r['retained_roles']==5
          assert r['consumers']=={n:'PASS' for n in ('041','042','043')}
          h=json.loads((out/'history/history-compatibility.json').read_text())
          assert h['status']=='PASS' and h['cleanup']=='PASS'
          census=json.loads((out/'final-census.json').read_text())
          assert 180000 <= int(census['version']) < 190000
          assert all(census[k]==0 for k in ('other_clients','advisory_locks','prepared'))
          assert json.loads((out/'cleanup.json').read_text())['status']=='PASS'
          suites=list(ET.parse(out/'unit.xml').getroot().iter('testsuite'))
          assert sum(int(s.attrib['tests']) for s in suites)==32
          assert all(int(s.attrib[k])==0 for s in suites for k in ('failures','errors','skipped'))
          (out/'acceptance.json').write_text(json.dumps({'status':'PASS_LEGACY_INSTALLED_RECOVERY_V2','unit_pass':32,'negative_pass':16,'cleanup':'PASS','production_executed':False})+'\n')
          PY
      - name: Preserve bounded synthetic evidence in logs
        if: always()
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'legacy-evidence'
          files={}
          for p in sorted(root.rglob('*')):
              if p.is_file():
                  data=p.read_bytes()
                  assert len(data)<=16*1024*1024
                  files[str(p.relative_to(root))]={'sha256':hashlib.sha256(data).hexdigest(),'base64':base64.b64encode(data).decode()}
          raw=json.dumps(files,sort_keys=True).encode()
          blob=gzip.compress(raw,mtime=0)
          assert len(blob)<=2*1024*1024
          print('LEGACY_RECOVERY_EVIDENCE_SHA256='+hashlib.sha256(raw).hexdigest())
          print('LEGACY_RECOVERY_EVIDENCE_GZIP_BASE64='+base64.b64encode(blob).decode())
          PY
