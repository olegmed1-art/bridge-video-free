name: Oracle idle STOP guard CI

on:
  pull_request:
    paths:
      - 'assistant_lab/oracle_idle_schema.sql'
      - 'ops/oracle_idle_state.sh'
      - 'ops/oracle_stop_guard.sh'
      - 'tests/test_oracle_idle_stop_guard.py'
      - '.github/workflows/oracle-idle-stop-guard-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-closed-idle-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded test dependency
        run: python -m pip install --disable-pip-version-check 'pytest>=8,<9'
      - name: Validate no-side-effect shell boundaries
        shell: bash
        run: |
          set -euo pipefail
          bash -n ops/oracle_idle_state.sh
          bash -n ops/oracle_stop_guard.sh
      - name: Prove BUSY IDLE UNKNOWN and UNKNOWN blocks STOP
        run: python -m pytest -q tests/test_oracle_idle_stop_guard.py
