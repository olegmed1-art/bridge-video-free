name: Light Oracle existing multi-key SSH recovery probe

on:
  push:
    branches: [ops/rdc-light-enroll-20260910]
    paths: ['.github/workflows/rdc-light-enroll-20260910.yml']

permissions:
  contents: read

concurrency:
  group: oracle-light-rdc-enrollment
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OCI_CLI_CONFIG: ${{ secrets.OCI_CLI_CONFIG }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
      OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
      ORACLE_VM_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
      BRIDGE_SCHOOL_ORACLE_SSH_PRIVATE_KEY: ${{ secrets.BRIDGE_SCHOOL_ORACLE_SSH_PRIVATE_KEY }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
      OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
    steps:
      - name: Install OCI CLI
        run: python -m pip install --disable-pip-version-check --quiet 'oci-cli==3.90.3' 'pexpect==4.9.0' 'pyte==0.8.2'

      - name: Configure existing principals
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${OCI_CLI_CONFIG:-}"
          test -n "${OCI_CLI_KEY_CONTENT:-}"
          test -n "${ORACLE_SSH_PRIVATE_KEY:-}"
          umask 077
          mkdir -p "$HOME/.oci"
          if [[ "$OCI_CLI_KEY_CONTENT" == base64:* ]]; then
            printf '%s' "${OCI_CLI_KEY_CONTENT#base64:}" | base64 --decode > "$HOME/.oci/key.pem"
          else
            printf '%s\n' "$OCI_CLI_KEY_CONTENT" > "$HOME/.oci/key.pem"
          fi
          printf '%s\n' "$OCI_CLI_CONFIG" > "$HOME/.oci/config"
          openssl pkey -in "$HOME/.oci/key.pem" -traditional -out "$HOME/.oci/key-pkcs1.pem"
          mv "$HOME/.oci/key-pkcs1.pem" "$HOME/.oci/key.pem"
          fingerprint="$(openssl pkey -in "$HOME/.oci/key.pem" -pubout -outform DER | openssl md5 -r | awk '{print $1}' | sed 's/../&:/g;s/:$//')"
          export OCI_DERIVED_FINGERPRINT="$fingerprint"
          python - <<'PY'
          import os
          from pathlib import Path
          p=Path.home()/'.oci/config'
          lines=[]; key=region=fp=False
          for line in p.read_text().splitlines():
              s=line.strip()
              if s.startswith('key_file='):
                  lines.append(f'key_file={Path.home()}/.oci/key.pem'); key=True
              elif s.startswith('region='):
                  lines.append('region=eu-frankfurt-1'); region=True
              elif s.startswith('fingerprint='):
                  lines.append(f'fingerprint={os.environ["OCI_DERIVED_FINGERPRINT"]}'); fp=True
              else: lines.append(line)
          if not key: lines.append(f'key_file={Path.home()}/.oci/key.pem')
          if not region: lines.append('region=eu-frankfurt-1')
          if not fp: lines.append(f'fingerprint={os.environ["OCI_DERIVED_FINGERPRINT"]}')
          p.write_text(chr(10).join(lines)+chr(10))
          PY
          printf '%s\n' "$ORACLE_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/oracle_ssh_key"
          chmod 600 "$RUNNER_TEMP/oracle_ssh_key"
          ssh-keygen -y -f "$RUNNER_TEMP/oracle_ssh_key" > "$RUNNER_TEMP/oracle_ssh_key.pub"
          permanent_key_type="$(awk '{print $1}' "$RUNNER_TEMP/oracle_ssh_key.pub")"
          echo "PERMANENT_KEY_TYPE=$permanent_key_type"
          ssh-keygen -q -t rsa -b 2048 -N '' -f "$RUNNER_TEMP/console_key"
          echo 'CONSOLE_KEY_TYPE=ssh-rsa'
          oci iam region list --output json >/dev/null
          echo 'CONTROL_PRINCIPALS=PASS'

      - name: Resolve exact Light and create console connection
        shell: bash
        run: |
          set -Eeuo pipefail
          tenancy="$(python -c 'import configparser,pathlib; p=configparser.ConfigParser(); p.read(pathlib.Path.home()/".oci"/"config"); print(p["DEFAULT"]["tenancy"])')"
          oci iam compartment list --compartment-id "$tenancy" --include-root --compartment-id-in-subtree true --access-level ACCESSIBLE --all > "$RUNNER_TEMP/compartments.json"
          python - "$RUNNER_TEMP/compartments.json" > "$RUNNER_TEMP/compartments" <<'PY'
          import json,sys
          for x in json.load(open(sys.argv[1]))['data']:
              if x.get('lifecycle-state')=='ACTIVE' and isinstance(x.get('id'),str): print(x['id'])
          PY
          : > "$RUNNER_TEMP/instances.jsonl"
          while IFS= read -r compartment; do
            oci compute instance list --compartment-id "$compartment" --all |
              python -c 'import json,sys; [print(json.dumps(x,separators=(",",":"))) for x in json.load(sys.stdin)["data"]]' >> "$RUNNER_TEMP/instances.jsonl"
          done < "$RUNNER_TEMP/compartments"
          python - "$RUNNER_TEMP/instances.jsonl" > "$RUNNER_TEMP/target.env" <<'PY'
          import json,sys
          rows=[json.loads(x) for x in open(sys.argv[1]) if x.strip()]
          rows=[x for x in rows if x.get('display-name')=='bridge-school-autopilot-lite' and x.get('lifecycle-state') not in {'TERMINATED','TERMINATING'}]
          assert len(rows)==1
          x=rows[0]
          assert x['lifecycle-state']=='RUNNING'
          assert x['shape']=='VM.Standard.A1.Flex'
          print('INSTANCE_ID='+x['id'])
          print('COMPARTMENT_ID='+x['compartment-id'])
          PY
          source "$RUNNER_TEMP/target.env"
          oci compute instance list-vnics --instance-id "$INSTANCE_ID" --all > "$RUNNER_TEMP/vnics.json"
          public_ip="$(python - "$RUNNER_TEMP/vnics.json" <<'PY'
          import json,sys
          rows=[x for x in json.load(open(sys.argv[1]))['data'] if x.get('is-primary')]
          assert len(rows)==1 and rows[0].get('public-ip')
          print(rows[0]['public-ip'])
          PY
          )"
          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"
          echo "COMPARTMENT_ID=$COMPARTMENT_ID" >> "$GITHUB_ENV"
          echo "PUBLIC_IP=$public_ip" >> "$GITHUB_ENV"
          echo 'LIGHT_EXACT_TARGET=PASS'

      - name: Probe all existing Oracle SSH credentials read-only
        id: multikey
        shell: bash
        run: |
          set -Eeuo pipefail
          selected=''
          for name in ORACLE_SSH_PRIVATE_KEY OCI_SSH_PRIVATE_KEY ORACLE_VM_SSH_PRIVATE_KEY BRIDGE_SCHOOL_ORACLE_SSH_PRIVATE_KEY ORACLE_SSH_KEY OCI_SSH_KEY; do
            value="${!name:-}"
            [[ -n "$value" ]] || continue
            key="$RUNNER_TEMP/key-$name"
            printf '%s\n' "$value" | tr -d '\r' > "$key"
            chmod 600 "$key"
            ssh-keygen -y -f "$key" >/dev/null 2>&1 || continue
            if ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/light-known-hosts" -o ConnectTimeout=10 "ubuntu@$PUBLIC_IP" 'true' >/dev/null 2>&1; then
              selected="$name"
              cp "$key" "$RUNNER_TEMP/light-selected-key"
              chmod 600 "$RUNNER_TEMP/light-selected-key"
              break
            fi
          done
          echo "LIGHT_EXISTING_KEY_MATCH=${selected:-NONE}"
          [[ -n "$selected" ]]
          echo 'LIGHT_SSH=PASS'

      - name: Read-only Light host/service inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$RUNNER_TEMP/light-selected-key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/light-known-hosts" "ubuntu@$PUBLIC_IP" '
            set -u
            echo "HOSTNAME=$(hostname)"
            echo "UPTIME_SECONDS=$(cut -d. -f1 /proc/uptime)"
            echo "FAILED_UNIT_COUNT=$(systemctl --failed --no-legend 2>/dev/null | sed "/^[[:space:]]*$/d" | wc -l)"
            echo "AUTOPILOT_UNITS_BEGIN"
            systemctl list-units --type=service --all --no-pager --no-legend 2>/dev/null | grep -Ei "autopilot|bridge|worker|queue" || true
            echo "AUTOPILOT_UNITS_END"
            echo "CONTAINERS_BEGIN"
            if command -v docker >/dev/null 2>&1; then sudo -n docker ps --format "{{.Names}}|{{.Status}}|{{.Image}}" 2>/dev/null || true; fi
            if command -v podman >/dev/null 2>&1; then podman ps --format "{{.Names}}|{{.Status}}|{{.Image}}" 2>/dev/null || true; fi
            echo "CONTAINERS_END"
            echo "AUTOPILOT_PROCESSES_BEGIN"
            pgrep -af "autopilot|bridge.*worker|queue.*worker" || true
            echo "AUTOPILOT_PROCESSES_END"
            echo "RDC_PROCESSES_BEGIN"
            pgrep -af "desktop-commander.*remote" || true
            echo "RDC_PROCESSES_END"
          '
          echo 'LIGHT_READONLY_HOST_PROBE=PASS'

      - name: Remove temporary console connection
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${CONNECTION_ID:-}" ]]; then
            oci compute instance-console-connection delete --instance-console-connection-id "$CONNECTION_ID" --force
            echo 'TEMP_CONSOLE_CONNECTION_REMOVED=PASS'
          fi
