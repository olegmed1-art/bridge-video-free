name: Drive backup folder readonly ONLY (review harness)
on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact reviewed main baseline
        required: true
        type: string
      expected_review_sha:
        description: Exact reviewed Drive probe commit
        required: true
        type: string
      operation:
        description: Must be DRIVE_BACKUP_FOLDER_READONLY_V1
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: drive-backup-folder-readonly-20261001
  cancel-in-progress: false
jobs:
  readonly:
    if: >-
      github.repository == 'olegmed1-art/bridge-video-free' &&
      github.ref == 'refs/heads/test/drive-backup-folder-readonly-20261001' &&
      github.event_name == 'workflow_dispatch' &&
      github.actor == 'olegmed1-art' && github.triggering_actor == 'olegmed1-art' &&
      github.run_attempt == 1 && inputs.expected_review_sha == github.sha &&
      inputs.expected_main_sha == '1440920191e1778fb9a9ba24e6701937a1a7459c' &&
      inputs.operation == 'DRIVE_BACKUP_FOLDER_READONLY_V1'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Offline contract tests before credentials
        run: python -m unittest discover -s tests -p test_drive_backup_folder_readonly.py
      - name: Existing OAuth exact folder readonly probe
        env:
          GOOGLE_DRIVE_OAUTH_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_JSON }}
          EXPECTED_MAIN: ${{ inputs.expected_main_sha }}
          EXPECTED_REVIEW: ${{ inputs.expected_review_sha }}
          DRIVE_PROBE_OPERATION: ${{ inputs.operation }}
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          timeout --signal=TERM --kill-after=5s 95s python -m ops.drive_backup_folder_readonly
