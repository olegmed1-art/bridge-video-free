          oci_json_request oci bv boot-volume-backup get --boot-volume-backup-id "$backup_id"
          backup="$OCI_JSON_OUTPUT"
          BACKUP="$backup" BOOT_ID="$boot_id" BACKUP_ID="$backup_id" python - <<'PY'
          import datetime,json,os
          d=json.loads(os.environ['BACKUP']).get('data')
          assert isinstance(d,dict) and d.get('id')==os.environ['BACKUP_ID']
          assert d['boot-volume-id']==os.environ['BOOT_ID'] and d['lifecycle-state']=='AVAILABLE' and d['type']=='FULL' and d['size-in-gbs']==97
          created=datetime.datetime.fromisoformat(d['time-created'].replace('Z','+00:00'))
          age=(datetime.datetime.now(datetime.timezone.utc)-created).total_seconds()
          assert 0 <= age < 86400
          PY
          echo 'UV_ROOT_LAST_SECOND_REVALIDATION_PASS attachment=true source_public_ip_bound=true backup_available=true backup_age_lt_24h=true restored_root_boot_acceptance=true'
      - name: Expand root and recover exact image under shared host lock
        if: ${{ steps.backup.outputs.cleanup_only != 'true' }}
        id: mutation
        run: |
          set -euo pipefail
          mutation_deadline='${{ steps.budget.outputs.mutation_deadline }}'
          monotonic_now="$(awk '{print int($1)}' /proc/uptime)"
          remaining=$((mutation_deadline - monotonic_now))
          (( remaining > 0 )) || exit 42
          mutation="$RUNNER_TEMP/issue-881-locked-mutation.sh"
          {
            cat ops/oracle_universal_video_root_filesystem_expand.sh
            printf '\n'
            cat ops/oracle_universal_video_container_missing_image_recover.sh
          } > "$mutation"
          timeout --signal=KILL "${remaining}s" ssh -i '${{ steps.ssh.outputs.key }}' -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='${{ steps.ssh.outputs.known }}' -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST" \
            "sudo -n env EXPECTED_HOSTNAME='$EXPECTED_HOSTNAME' EXPECTED_MIN_DISK_BYTES=90000000000 EXPECTED_MAX_DISK_BYTES=105000000000 MIN_FREE_KB=5242880 UNIVERSAL_VIDEO_EXPECTED_SHA='$EXACT_RUNTIME_SHA' /usr/bin/flock -x /run/lock/oracle-workload-mutation.lock /bin/bash -s" \
            < "$mutation" | tee "$RUNNER_TEMP/locked-mutation.txt"
          grep -E '^UV_ROOT_EXPAND_PASS .*disk_bytes=[0-9]+ .*free_kb_after=[0-9]+$' "$RUNNER_TEMP/locked-mutation.txt"
          grep -E '^UV_CONTAINER_RECOVERY_PASS runtime_sha=[0-9a-f]{40} backup=/var/lib/bridge-school/universal-video-container-recovery/[^ ]+ image_digest=sha256:[0-9a-f]{64}$' "$RUNNER_TEMP/locked-mutation.txt"
      - name: Publish bounded operational receipt
        if: ${{ always() }}
        env:
          BACKUP_OUTCOME: ${{ steps.backup.outcome }}
          BACKUP_ID: ${{ steps.backup.outputs.backup_id }}
          SUPERSEDED_BACKUP_COUNT: ${{ steps.backup.outputs.superseded_backup_count }}
          TEMP_INSTANCE_SECONDS: ${{ steps.backup.outputs.temporary_instance_seconds }}
          JOB_STATUS: ${{ job.status }}
          MUTATION_OUTCOME: ${{ steps.mutation.outcome }}
          PRIMARY_DEADLINE: ${{ steps.budget.outputs.primary_deadline }}
          CLEANUP_DEADLINE: ${{ steps.budget.outputs.cleanup_deadline }}
          MUTATION_DEADLINE: ${{ steps.budget.outputs.mutation_deadline }}
          RECEIPT_DEADLINE: ${{ steps.budget.outputs.receipt_deadline }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/issue-881-root-expand-receipt.md"
          receipt_monotonic_now="$(awk '{print int($1)}' /proc/uptime)"
          STATE_PATH="$RUNNER_TEMP/issue-881-step4-state.json" BODY_PATH="$body" RECEIPT_MONOTONIC_NOW="$receipt_monotonic_now" python - <<'PY'
          import json, os
          from pathlib import Path

          state_path = Path(os.environ['STATE_PATH'])
          state = json.loads(state_path.read_text()) if state_path.exists() else {}
          def value(key, fallback='unknown'):
              return str(state.get(key) or fallback)
          def code(text):
              return '`' + str(text).replace('`', "'") + '`'

          deadline_values = [
              os.environ.get('PRIMARY_DEADLINE') or 'unknown',
              os.environ.get('CLEANUP_DEADLINE') or 'unknown',
              os.environ.get('MUTATION_DEADLINE') or 'unknown',
              os.environ.get('RECEIPT_DEADLINE') or 'unknown',
          ]
          receipt_now = os.environ.get('RECEIPT_MONOTONIC_NOW') or ''
          receipt_inside_deadline = (
              receipt_now.isdigit()
              and deadline_values[-1].isdigit()
              and int(receipt_now) < int(deadline_values[-1])
          )

          backup_id = os.environ.get('BACKUP_ID') or state.get('retained_backup_id')
          lines = [
              '## Issue #881 guarded root expansion and exact-image recovery',
              '',
              '- operation: ' + code('FAILED_RUN_RECONCILIATION_ONLY' if value('cleanup_only', '0') == '1' else 'EXPAND_AND_RECOVER'),
              '- workflow outcome: ' + code(os.environ['JOB_STATUS']),
              '- fresh 97 GB FULL backup gate: ' + code('NOT_APPLICABLE' if value('cleanup_only', '0') == '1' else os.environ['BACKUP_OUTCOME']),
              '- last recorded phase: ' + code(value('phase')),
              '- failing phase before cleanup: ' + code(value('failure_phase', 'none')),
              '- failure rc: ' + code(value('failure_rc', 'none')),
              '- monotonic primary/cleanup/mutation/receipt deadlines: ' + code('/'.join(deadline_values)),
              '- receipt started inside reserved deadline: ' + code(str(receipt_inside_deadline).lower()),
              '- prior-run reconciliation: ' + code(value('prior_cleanup_status', 'NOT_RECORDED')),
              '- prior-run exact resource count: ' + code(value('prior_resource_count', 'unknown')),
              '- prior-run exact resource IDs: ' + code(value('prior_resource_ids', 'none')),
              '- prior-run exact typed resources: ' + code(value('prior_resource_summary', 'none')),
              '- failed-run backup cleanup: ' + code(value('failed_run_backup_cleanup_status', 'NOT_APPLICABLE')),
              '- failed-run backup IDs: ' + code(value('failed_run_backup_ids', 'none')),
              '- failed-run backup direct-GET states: ' + code(value('failed_run_backup_direct_get_states', 'not_listed')),
              '- superseded backup cleanup: ' + code(value('superseded_backup_cleanup_status', 'NOT_RECORDED')) + '; candidates: ' + code(value('superseded_backup_candidate_count', '0')),
              '- backup selection status: ' + code(value('backup_selection_status', 'NOT_RECORDED')),
              '- backup selection failure rc: ' + code(value('backup_selection_failure_rc', 'none')),
              '- reusable backup candidate count: ' + code(value('backup_candidate_count', '0')),
              '- reusable backup candidate IDs: ' + code(value('backup_candidate_ids', 'none')),
              '- ineligible backup candidate IDs: ' + code(value('backup_ineligible_candidate_ids', 'none')),
              '- blocking non-AVAILABLE backup IDs: ' + code(value('backup_blocking_candidate_ids', 'none')),
              '- invalid backup metadata IDs: ' + code(value('backup_invalid_candidate_ids', 'none')),
              '- backup availability wait: ' + code(value('backup_wait_status', 'NOT_RECORDED')),
              '- backup availability last state: ' + code(value('backup_wait_last_state', 'none')),
              '- backup availability failure rc: ' + code(value('backup_wait_failure_rc', 'none')),
              '- last exact-name discovery: ' + code(value('last_discovery_resource', 'none')) + '; status: ' + code(value('last_discovery_status', 'NOT_RECORDED')) + '; rc: ' + code(value('last_discovery_failure_rc', 'none')),
              '- backup create request: ' + code(value('backup_create_status', 'NOT_APPLICABLE')) + '; rc: ' + code(value('backup_create_failure_rc', 'none')),
              '- restored volume create request: ' + code(value('restored_volume_create_status', 'NOT_RECORDED')) + '; rc: ' + code(value('restored_volume_create_failure_rc', 'none')),
              '- isolated VCN create request: ' + code(value('vcn_create_status', 'NOT_RECORDED')) + '; rc: ' + code(value('vcn_create_failure_rc', 'none')),
              '- isolated internet-gateway create request: ' + code(value('internet_gateway_create_status', 'NOT_RECORDED')) + '; rc: ' + code(value('internet_gateway_create_failure_rc', 'none')),
              '- isolated route-table create request: ' + code(value('route_table_create_status', 'NOT_RECORDED')) + '; rc: ' + code(value('route_table_create_failure_rc', 'none')),
              '- isolated security-list create request: ' + code(value('security_list_create_status', 'NOT_RECORDED')) + '; rc: ' + code(value('security_list_create_failure_rc', 'none')),
              '- isolated subnet create request: ' + code(value('subnet_create_status', 'NOT_RECORDED')) + '; rc: ' + code(value('subnet_create_failure_rc', 'none')),
              '- isolated instance create request: ' + code(value('instance_create_status', 'NOT_RECORDED')) + '; rc: ' + code(value('instance_create_failure_rc', 'none')),
              '- restored volume readiness: ' + code(value('restored_volume_wait_status', 'NOT_RECORDED')) + '; state: ' + code(value('restored_volume_wait_last_state', 'none')) + '; rc: ' + code(value('restored_volume_wait_failure_rc', 'none')),
              '- restored volume hydration: ' + code(value('restored_volume_hydration_status', 'NOT_RECORDED')) + '; state: ' + code(value('restored_volume_hydration_last_state', 'none')) + '; rc: ' + code(value('restored_volume_hydration_failure_rc', 'none')),
              '- isolated VCN readiness: ' + code(value('vcn_wait_status', 'NOT_RECORDED')) + '; state: ' + code(value('vcn_wait_last_state', 'none')) + '; rc: ' + code(value('vcn_wait_failure_rc', 'none')),
              '- isolated internet-gateway readiness: ' + code(value('internet_gateway_wait_status', 'NOT_RECORDED')) + '; state: ' + code(value('internet_gateway_wait_last_state', 'none')) + '; rc: ' + code(value('internet_gateway_wait_failure_rc', 'none')),
              '- isolated route-table readiness: ' + code(value('route_table_wait_status', 'NOT_RECORDED')) + '; state: ' + code(value('route_table_wait_last_state', 'none')) + '; rc: ' + code(value('route_table_wait_failure_rc', 'none')),
              '- isolated security-list readiness: ' + code(value('security_list_wait_status', 'NOT_RECORDED')) + '; state: ' + code(value('security_list_wait_last_state', 'none')) + '; rc: ' + code(value('security_list_wait_failure_rc', 'none')),
              '- isolated subnet readiness: ' + code(value('subnet_wait_status', 'NOT_RECORDED')) + '; state: ' + code(value('subnet_wait_last_state', 'none')) + '; rc: ' + code(value('subnet_wait_failure_rc', 'none')),
              '- isolated instance readiness: ' + code(value('instance_wait_status', 'NOT_RECORDED')) + '; state: ' + code(value('instance_wait_last_state', 'none')) + '; rc: ' + code(value('instance_wait_failure_rc', 'none')),
              '- isolated VNIC attachment: ' + code(value('vnic_attachment_status', 'NOT_RECORDED')) + '; rc: ' + code(value('vnic_attachment_failure_rc', 'none')),
              '- isolated VNIC public IPv4: ' + code(value('vnic_public_ip_status', 'NOT_RECORDED')) + '; rc: ' + code(value('vnic_public_ip_failure_rc', 'none')),
              '- current-run temporary cleanup: ' + code(value('current_cleanup_status', 'NOT_RECORDED')),
              '- current-run stamp: ' + code(value('run_stamp')),
              '- temporary instance ID: ' + code(value('temporary_instance_id', 'none')),
              '- temporary restored-volume ID: ' + code(value('temporary_restored_volume_id', 'none')),
              '- temporary VCN ID: ' + code(value('temporary_vcn_id', 'none')),
              '- temporary internet-gateway ID: ' + code(value('temporary_internet_gateway_id', 'none')),
              '- temporary route-table ID: ' + code(value('temporary_route_table_id', 'none')),
              '- temporary security-list ID: ' + code(value('temporary_security_list_id', 'none')),
              '- temporary subnet ID: ' + code(value('temporary_subnet_id', 'none')),
              '- post-cleanup allocation summary: ' + code(value('allocation_summary', 'not_collected')),
          ]
          if backup_id and value('cleanup_only', '0') == '1':
              lines.append('- backup candidate retained: ' + code('AVAILABLE_FULL_97GB_REQUIRES_NEW_ISOLATED_BOOT_ACCEPTANCE') + '; candidate ID: ' + code(backup_id) + ' (billable backup storage may apply)')
          elif backup_id:
              lines.append('- fresh backup retained: ' + code(value('retained_backup_status', 'true')) + '; accepted backup ID: ' + code(backup_id) + ' (billable backup storage may apply)')
