name: Oracle DDS3 Pilot-10k PR diagnose

on:
  pull_request:
    branches: [main]
    paths:
      - 'ops/oracle-dds3-pilot10k-diag-requests/*.json'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ORACLE_HOST: 158.180.47.161
      ORACLE_USER: ubuntu
      EXPECTED_FINGERPRINT: SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk
      SSH_KEY_ORACLE: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
      SSH_KEY_OCI: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
      SSH_KEY_VM: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
      SSH_KEY_BRIDGE: ${{ secrets.BRIDGE_SCHOOL_ORACLE_SSH_PRIVATE_KEY }}
      SSH_KEY_ORACLE_ALT: ${{ secrets.ORACLE_SSH_KEY }}
      SSH_KEY_OCI_ALT: ${{ secrets.OCI_SSH_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Resolve verified SSH credential
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/pilot10k-diag"; mkdir -p "$work"
          known="$work/known_hosts"; : > "$known"
          for attempt in 1 2 3; do ssh-keyscan -T 10 -t ed25519,ecdsa,rsa "$ORACLE_HOST" >> "$known" 2>/dev/null || true; [[ -s "$known" ]] && break; sleep $((attempt*2)); done
          sort -u -o "$known" "$known"
          ssh-keygen -lf "$known" | awk '{print $2}' | grep -Fx "$EXPECTED_FINGERPRINT" >/dev/null
          selected=''; idx=0
          for name in SSH_KEY_ORACLE SSH_KEY_OCI SSH_KEY_VM SSH_KEY_BRIDGE SSH_KEY_ORACLE_ALT SSH_KEY_OCI_ALT; do
            raw="${!name:-}"; [[ -n "$raw" ]] || continue; idx=$((idx+1)); base="$work/key-$idx"
            printf '%s\n' "$raw" > "$base.raw"; tr -d '\r' < "$base.raw" > "$base.crlf"
            RAW_KEY="$raw" OUT_KEY="$base.escaped" python - <<'PY'
import os
raw=os.environ['RAW_KEY']
if '\\n' in raw and '\n' not in raw: raw=raw.replace('\\r','').replace('\\n','\n')
open(os.environ['OUT_KEY'],'w').write(raw if raw.endswith('\n') else raw+'\n')
PY
            for key in "$base.raw" "$base.crlf" "$base.escaped"; do chmod 0600 "$key"; ssh-keygen -y -f "$key" >/dev/null 2>&1 || continue; if ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" -o ConnectTimeout=10 "$ORACLE_USER@$ORACLE_HOST" true >/dev/null 2>&1; then selected="$key"; break 2; fi; done
          done
          [[ -n "$selected" ]]; cp "$selected" "$work/id_oracle"; chmod 0600 "$work/id_oracle"
          echo "key=$work/id_oracle" >> "$GITHUB_OUTPUT"; echo "known=$known" >> "$GITHUB_OUTPUT"
      - name: Diagnose service
        shell: bash
        run: |
          set -euo pipefail
          ssh -i '${{ steps.ssh.outputs.key }}' -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='${{ steps.ssh.outputs.known }}' -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST" 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          state=/opt/bridge-school/dds3-mass-validation
          echo '=== systemd ==='
          systemctl show dds3-mass@10000.service -p LoadState -p ActiveState -p SubState -p Result -p ExecMainCode -p ExecMainStatus --no-pager || true
          echo '=== files ==='
          for p in "$state/requests/10000.json" "$state/evidence/10000.json" "$state/work/pilot-replay/raw.pbn" "$state/work/pilot-replay/blind_tasks.jsonl" "$state/work/pilot-replay/locked_predictions_train.jsonl"; do
            if [[ -e "$p" ]]; then stat -c '%U:%G %a %s %n' "$p"; else echo "MISSING $p"; fi
          done
          echo '=== dds3-mass identity access ==='
          sudo -u dds3-mass test -r "$state/requests/10000.json" && echo request_readable=true || echo request_readable=false
          sudo -u dds3-mass test -w "$state/evidence" && echo evidence_writable=true || echo evidence_writable=false
          sudo -u dds3-mass /opt/bridge-school/bridge-video-free/dds_training/.venv/bin/python - <<'PY' || true
import sys
sys.path.insert(0,'/opt/bridge-school/bridge-video-free/dds_training')
import oracle_mass_dispatch_v2
print('dispatcher_import=ok')
PY
          echo '=== journal ==='
          journalctl -u dds3-mass@10000.service -n 80 --no-pager 2>&1 | sed -E 's/(token|password|secret|key|dsn)=([^[:space:]]+)/\1=[REDACTED]/Ig'
          REMOTE
