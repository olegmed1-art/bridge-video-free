name: TEMP Diana 29912 cross-session DDS3

on:
  pull_request:
    paths:
      - '.github/workflows/temp-diana-29912-all-dds3.yml'
      - 'scripts/temp_diana_29912_extract_sources.py'
      - 'scripts/temp_diana_29912_multi_dds3.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Restore pinned verified event 29912 source facts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/olegmed1-art/bridge-video-free/actions/artifacts/9470920077/zip" \
            -o source-facts.zip
          unzip -q source-facts.zip
          test -d facts29912
          sha256sum -c <<'EOF'
          34fe5c59d901686b712c2384078aac618a191a4528c694db2ea8c6af2ae51073  facts29912/tournament_29912_round1_diana_facts.json
          806ed04726195fefb3b941d0ca2a132822cb24de514ae424c52b6330fa81fc27  facts29912/tournament_29912_round2_diana_facts.json
          7cc1822cc64ed6464b99dce0937fc6c5a64efbeee2a6a5e8f9596500a3dde637  facts29912/tournament_29912_round4_diana_facts.json
          432d386551745509218911075c099230e1fbb1d4f485832d99ee0f9aa6954e67  facts29912/tournament_29912_round5_diana_facts.json
          ebc064b8921560e56829409f65e3add3a192206dd62971a91664df116e94c7dd  facts29912/tournament_29912_round6_diana_facts.json
          EOF
          python3 - <<'PY'
          import json,glob
          total=0
          sessions=[]
          for f in glob.glob('facts29912/*.json'):
              x=json.load(open(f)); total+=len(x['boards']); sessions.append(x['source']['round']); assert x['source']['site_dd_used'] is False
          assert total==100,total
          assert sorted(sessions)==[1,2,4,5,6],sessions
          print('PINNED_SOURCE_FACTS_PASS',total,sorted(sessions))
          PY
      - name: Build pinned canonical DDS3 core
        run: docker build -f Dockerfile.dds3 -t bridge-school-dds3 .
      - name: Build canonical DDS3 runtime
        run: docker build -f dds3_runtime/Dockerfile -t bridge-school-dds3-runtime:diana29912all .
      - name: Start runtime
        run: docker run -d --rm --name dds3-diana29912all -p 18080:8080 -e DDS3_RUNTIME_TOKEN=diana29912all-secret bridge-school-dds3-runtime:diana29912all
      - name: Require DDS3 ready / no fallback
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/readyz > diana29912all-ready.json; then
              cat diana29912all-ready.json
              python3 - <<'PY'
          import json
          r=json.load(open('diana29912all-ready.json'))
          assert r['status']=='ready' and r['engine']=='DDS3' and r['fallback_used'] is False and r['position_solver']=='ready'
          PY
              exit 0
            fi
            sleep 1
          done
          docker logs dds3-diana29912all; exit 1
      - name: Run actual DDS3 over all 100 played boards
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/temp_diana_29912_multi_dds3.py --facts-dir facts29912 --base-url http://127.0.0.1:18080 --token diana29912all-secret --out-json diana-29912-cross-session-dds3.json --out-md diana-29912-cross-session-dds3.md
          cat diana-29912-cross-session-dds3.md
      - name: Evidence gate
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('diana-29912-cross-session-dds3.json'))
          assert r['schema']=='diana-29912-multi-session-dds3-v2'
          assert r['policy']['engine']=='DDS3' and r['policy']['fallback_used'] is False and r['policy']['site_dd_used'] is False
          assert r['aggregate']['sessions']==[1,2,4,5,6]
          assert r['aggregate']['played_boards']==100
          assert r['aggregate']['decision_analyzable_boards']==99
          bad=r['aggregate']['source_inconsistencies']
          assert len(bad)==1 and bad[0]['round']==1 and bad[0]['board']==5,bad
          assert all(b['dds3']['engine']=='DDS3' and b['dds3']['fallback_used'] is False for s in r['sessions'] for b in s['boards'])
          assert sum(1 for s in r['sessions'] for b in s['boards'] if not b['source_consistency']['ok'])==1
          print('DIANA_29912_CROSS_SESSION_DDS3_PASS')
          PY
      - name: Runtime logs on failure
        if: failure()
        run: docker logs dds3-diana29912all || true
      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diana-29912-cross-session-dds3
          path: |
            diana29912all-ready.json
            facts29912/
            diana-29912-cross-session-dds3.json
            diana-29912-cross-session-dds3.md
          if-no-files-found: error
          retention-days: 30
