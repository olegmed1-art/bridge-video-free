name: Tournament Analyzer v3 committed teacher decisions

on:
  pull_request:
    paths:
      - "bridge_school_api/tournament_committed_teacher_decisions_v3.py"
      - "bridge_school_api/tournament_teacher_confirmed_portfolio_longitudinal_v3.py"
      - "bridge_school_api/tournament_portfolio_episode_scoring_v3.py"
      - "tests/test_tournament_committed_teacher_decisions_v3.py"
      - "data/tournaments/teacher_decisions/**"
      - ".github/workflows/tournament-analyzer-v3-committed-teacher-decisions.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  contract-and-real-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests and compile
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m py_compile \
            bridge_school_api/tournament_committed_teacher_decisions_v3.py \
            bridge_school_api/tournament_teacher_confirmed_portfolio_longitudinal_v3.py \
            bridge_school_api/tournament_portfolio_episode_scoring_v3.py
          python -m pytest -q \
            tests/test_tournament_committed_teacher_decisions_v3.py \
            tests/test_tournament_teacher_confirmed_portfolio_longitudinal_v3.py \
            tests/test_tournament_portfolio_episode_scoring_v3.py \
            tests/test_tournament_analyzer_v3_stage2.py

      - name: Restore exact portfolio evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/portfolio evidence/historical evidence/opening
          for spec in \
            "9569845552:/tmp/portfolio.zip:evidence/portfolio" \
            "9558677983:/tmp/historical.zip:evidence/historical" \
            "9569379785:/tmp/opening.zip:evidence/opening"; do
            IFS=: read -r aid zip dest <<< "$spec"
            curl -fsSL --retry 3 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${aid}/zip" \
              -o "$zip"
            unzip -q "$zip" -d "$dest"
          done
          PORTFOLIO="$(find evidence/portfolio -type f -name 'tournament-teacher-review-portfolio.json' -print -quit)"
          HISTORICAL="$(find evidence/historical -type f -name 'tournament-teacher-review-bundle.json' -print -quit)"
          OPENING="$(find evidence/opening -type f -name 'tournament-30041-opening-lead-review-handoff.json' -print -quit)"
          test -n "$PORTFOLIO" && test -n "$HISTORICAL" && test -n "$OPENING"
          echo "PORTFOLIO=$PORTFOLIO" >> "$GITHUB_ENV"
          echo "HISTORICAL=$HISTORICAL" >> "$GITHUB_ENV"
          echo "OPENING=$OPENING" >> "$GITHUB_ENV"

      - name: Apply committed board decisions through exact portfolio gate
        run: |
          PYTHONPATH="$PWD" python - <<'PY'
          import glob
          import json
          import os

          from bridge_school_api.tournament_committed_teacher_decisions_v3 import (
              sync_committed_board_decisions_into_portfolio_intake,
          )
          from bridge_school_api.tournament_portfolio_episode_scoring_v3 import (
              apply_portfolio_episode_scoring_intake,
              build_portfolio_episode_scoring_template,
          )
          from bridge_school_api.tournament_teacher_confirmed_portfolio_longitudinal_v3 import (
              build_portfolio_teacher_confirmed_longitudinal_report,
          )
          from bridge_school_api.tournament_teacher_review_bundle_v3 import (
              build_teacher_review_bundle,
              verify_teacher_review_bundle,
          )
          from bridge_school_api.tournament_teacher_review_portfolio_intake_v3 import (
              apply_portfolio_teacher_decision_intake,
              build_portfolio_teacher_decision_template,
          )
          from bridge_school_api.tournament_teacher_review_release_gate_v3 import (
              build_event_teacher_review_release_gate,
          )

          portfolio = json.load(open(os.environ['PORTFOLIO'], encoding='utf-8'))
          historical = json.load(open(os.environ['HISTORICAL'], encoding='utf-8'))
          opening_handoff = json.load(open(os.environ['OPENING'], encoding='utf-8'))
          opening = build_teacher_review_bundle(
              opening_handoff['queue'],
              opening_handoff['decision_ledger'],
              opening_handoff['dossier'],
          )
          verify_teacher_review_bundle(opening)
          bundles = [historical, opening]

          decision_paths = sorted(glob.glob('data/tournaments/teacher_decisions/30041_round2_board*_teacher_decision_v1.json'))
          assert decision_paths == [
              'data/tournaments/teacher_decisions/30041_round2_board14_teacher_decision_v1.json',
              'data/tournaments/teacher_decisions/30041_round2_board19_teacher_decision_v1.json',
          ], decision_paths
          records = [json.load(open(path, encoding='utf-8')) for path in decision_paths]

          template = build_portfolio_teacher_decision_template(portfolio, bundles)
          sync = sync_committed_board_decisions_into_portfolio_intake(
              template,
              records,
              decision_actor='teacher:interactive-chatgpt',
              decision_references=decision_paths,
          )
          assert sync['decision_record_count'] == 2
          assert sync['applied_count'] == 2
          assert sync['blocked_count'] == 0
          assert sync['automatic_methodology_mapping_allowed'] is False
          assert sync['automatic_student_error_attribution_allowed'] is False

          result = apply_portfolio_teacher_decision_intake(portfolio, bundles, sync['intake'])
          assert result['decided_count'] == 2
          assert result['pending_count'] == 19

          gate = build_event_teacher_review_release_gate(
              portfolio, bundles, result, event_id='30041'
          )
          assert gate['review_item_count'] == 11
          assert gate['confirmed_technical_count'] == 1
          assert gate['dismissed_count'] == 0
          assert gate['status_counts']['CONFIRMED_TECHNICAL_RELEVANCE'] == 1
          assert gate['status_counts']['NEEDS_CONTEXT'] == 1
          assert gate['status_counts']['PENDING'] == 9
          assert gate['unresolved_review_count'] == 10
          assert gate['teacher_review_release_ready'] is False
          assert gate['automatic_episode_scoring_allowed'] is False
          assert gate['automatic_methodology_mapping_allowed'] is False
          assert gate['automatic_student_error_attribution_allowed'] is False

          longitudinal = build_portfolio_teacher_confirmed_longitudinal_report(
              portfolio, bundles, result
          )
          assert longitudinal['status_counts']['CONFIRMED_TECHNICAL_RELEVANCE'] == 1
          assert longitudinal['status_counts']['NEEDS_CONTEXT'] == 1
          assert longitudinal['status_counts']['PENDING'] == 19
          assert len(longitudinal['confirmed_items']) == 1
          assert len(longitudinal['clusters']) == 1
          assert len(longitudinal['persistent_clusters']) == 0
          confirmed = longitudinal['confirmed_items'][0]
          assert confirmed['event_id'] == '30041'
          assert confirmed['deal_id'] == '30041:round-2:19'
          assert confirmed['category'] == 'dds3_pair_same_contract_delta'
          assert confirmed['repeat_key'] == 'DDS3_PAIR_SAME_CONTRACT_DELTA_V1'
          assert confirmed['technical_trick_loss'] == 2.0
          assert confirmed['causal_link'] == 'NOT_ESTABLISHED'
          assert confirmed['methodology_mapping'] is None
          assert confirmed['student_error_attribution'] is None
          cluster = longitudinal['clusters'][0]
          assert cluster['repeat_key'] == 'DDS3_PAIR_SAME_CONTRACT_DELTA_V1'
          assert cluster['finding_count'] == 1
          assert cluster['event_count'] == 1
          assert cluster['persistent_across_events'] is False
          assert cluster['technical_trick_loss_mass'] == 2.0
          assert longitudinal['automatic_methodology_mapping_allowed'] is False
          assert longitudinal['automatic_student_error_attribution_allowed'] is False
          assert longitudinal['causal_error_attribution_allowed'] is False

          scoring_template = build_portfolio_episode_scoring_template(
              portfolio, bundles, result
          )
          assert scoring_template['review_item_count'] == 21
          assert scoring_template['confirmed_technical_count'] == 1
          assert scoring_template['dismissed_count'] == 0
          assert scoring_template['unresolved_teacher_review_count'] == 20
          assert scoring_template['automatic_episode_scoring_allowed'] is False
          pending_scoring = [
              row for row in scoring_template['rows']
              if row['status'] == 'PENDING_EPISODE_SCORING'
          ]
          assert len(pending_scoring) == 1
          score_row = pending_scoring[0]
          assert score_row['event_id'] == '30041'
          assert score_row['deal_id'] == '30041:round-2:19'
          assert score_row['category'] == 'dds3_pair_same_contract_delta'
          assert score_row['explicit_episode_adjudication'] is False
          assert score_row['impact_score'] is None
          assert score_row['transferability_score'] is None
          assert score_row['reliability_score'] is None
          assert score_row['score_actor'] is None
          assert score_row['score_provenance'] is None

          scoring_result = apply_portfolio_episode_scoring_intake(
              portfolio, bundles, result, scoring_template
          )
          assert scoring_result['explicitly_scored_count'] == 0
          assert scoring_result['confirmed_unscored_count'] == 1
          assert scoring_result['dismissed_count'] == 0
          assert scoring_result['unresolved_teacher_review_count'] == 20
          assert scoring_result['portfolio_episode_scoring_complete'] is False
          assert scoring_result['scored_items'] == []
          assert scoring_result['automatic_episode_scoring_used'] is False
          assert scoring_result['automatic_methodology_mapping_used'] is False
          assert scoring_result['automatic_student_error_attribution_used'] is False
          assert scoring_result['causal_error_attribution_allowed'] is False

          json.dump(sync, open('tournament-30041-committed-decision-sync.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          json.dump(result, open('tournament-30041-portfolio-decision-result.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          json.dump(gate, open('tournament-30041-teacher-review-release-gate.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          json.dump(longitudinal, open('tournament-30041-confirmed-longitudinal.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          json.dump(scoring_template, open('tournament-30041-portfolio-scoring-intake.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          json.dump(scoring_result, open('tournament-30041-portfolio-scoring-result.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          print('TOURNAMENT_30041_COMMITTED_TEACHER_DECISIONS_REAL_PASS')
          print('applied', sync['applied_count'], 'blocked', sync['blocked_count'])
          print('portfolio_decided', result['decided_count'], 'portfolio_pending', result['pending_count'])
          print('event_confirmed', gate['confirmed_technical_count'], 'event_needs_context', gate['status_counts']['NEEDS_CONTEXT'])
          print('event_pending', gate['status_counts']['PENDING'], 'event_unresolved', gate['unresolved_review_count'])
          print('longitudinal_confirmed', len(longitudinal['confirmed_items']))
          print('longitudinal_clusters', len(longitudinal['clusters']), 'persistent', len(longitudinal['persistent_clusters']))
          print('confirmed_unscored', scoring_result['confirmed_unscored_count'])
          print('explicit_scores', scoring_result['explicitly_scored_count'], 'scoring_complete', scoring_result['portfolio_episode_scoring_complete'])
          PY

      - name: Upload decision-sync evidence
        uses: actions/upload-artifact@v4
        with:
          name: tournament-30041-committed-teacher-decisions
          path: |
            tournament-30041-committed-decision-sync.json
            tournament-30041-portfolio-decision-result.json
            tournament-30041-teacher-review-release-gate.json
            tournament-30041-confirmed-longitudinal.json
            tournament-30041-portfolio-scoring-intake.json
            tournament-30041-portfolio-scoring-result.json
          if-no-files-found: error
          retention-days: 30
