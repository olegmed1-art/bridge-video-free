name: bridge-video-3.1-free

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Opaque deterministic job id"
        required: true
        type: string
      output_folder_id:
        description: "Optional Drive folder for derived outputs; source video is never moved"
        required: false
        type: string
      work_folder_id:
        description: "Optional Drive folder for processing receipts"
        required: false
        type: string
      lesson_number:
        description: "Optional historical lesson number"
        required: false
        type: string
      lesson_date_candidate:
        description: "Optional ISO lesson-date candidate"
        required: false
        type: string
      lesson_date_evidence_json:
        description: "Optional JSON array of independent Zoom/Calendar/email/chat date evidence"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'run_requests/*.txt'

permissions:
  contents: read

concurrency:
  group: bridge-video-heavy
  cancel-in-progress: false

jobs:
  free-guard-and-worker:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330

    env:
      BRIDGE_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      BRIDGE_RUNNER_LABEL: ubuntu-24.04
      BRIDGE_LARGER_RUNNER: "false"
      BRIDGE_PAID_CLOUD: "false"
      BRIDGE_BILLING_FALLBACK: "false"
      BRIDGE_REQUESTED_ALGORITHM_REVISION: "3.1-free-r25.16"
      BRIDGE_DIARIZATION_ENABLED: "true"
      PYTHONUNBUFFERED: "1"
      WHISPER_MODEL: small

    steps:
      - name: Checkout public technical code only
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Enforce single active production compute route
        shell: bash
        run: python ops/validate_universal_video_runtime_routing.py --require-active github_actions_legacy

      - name: Resolve job and Diana longitudinal context
        shell: bash
        env:
          INPUT_JOB_ID: ${{ inputs.job_id }}
          INPUT_OUTPUT_FOLDER_ID: ${{ inputs.output_folder_id }}
          INPUT_WORK_FOLDER_ID: ${{ inputs.work_folder_id }}
          INPUT_LESSON_NUMBER: ${{ inputs.lesson_number }}
          INPUT_LESSON_DATE_CANDIDATE: ${{ inputs.lesson_date_candidate }}
          INPUT_LESSON_DATE_EVIDENCE_JSON: ${{ inputs.lesson_date_evidence_json }}
        run: |
          set -euo pipefail
          OUTPUT_FOLDER_ID=""
          WORK_FOLDER_ID=""
          ORIGINAL_SOURCE_DRIVE_ID=""
          LESSON_NUMBER=""
          LESSON_DATE_CANDIDATE=""
          LESSON_DATE_SOURCE=""
          LESSON_DATE_EVIDENCE_JSON=""
          PERSIST_DATABASE="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            JOB_ID="$INPUT_JOB_ID"
            OUTPUT_FOLDER_ID="$INPUT_OUTPUT_FOLDER_ID"
            WORK_FOLDER_ID="$INPUT_WORK_FOLDER_ID"
            LESSON_NUMBER="$INPUT_LESSON_NUMBER"
            LESSON_DATE_CANDIDATE="$INPUT_LESSON_DATE_CANDIDATE"
            LESSON_DATE_EVIDENCE_JSON="$INPUT_LESSON_DATE_EVIDENCE_JSON"
          else
            REQUEST_FILES="$(git diff-tree --no-commit-id --name-only -r -m "$GITHUB_SHA" | sort -u | grep -E '^run_requests/.*\.txt$' || true)"
            REQUEST_COUNT="$(printf '%s\n' "$REQUEST_FILES" | sed '/^$/d' | wc -l | tr -d '[:space:]')"
            test "$REQUEST_COUNT" -eq 1 || { echo "Expected exactly one run request in triggering commit; found $REQUEST_COUNT" >&2; exit 2; }
            REQUEST_FILE="$(printf '%s\n' "$REQUEST_FILES" | head -n 1)"
            JOB_ID="$(sed -n 's/^JOB_ID=//p' "$REQUEST_FILE" | tail -n 1 | tr -d '[:space:]')"
            OUTPUT_FOLDER_ID="$(sed -n 's/^OUTPUT_FOLDER_ID=//p' "$REQUEST_FILE" | tail -n 1 | tr -d '[:space:]')"
            WORK_FOLDER_ID="$(sed -n 's/^WORK_FOLDER_ID=//p' "$REQUEST_FILE" | tail -n 1 | tr -d '[:space:]')"
            ORIGINAL_SOURCE_DRIVE_ID="$(sed -n 's/^ORIGINAL_SOURCE_DRIVE_ID=//p' "$REQUEST_FILE" | tail -n 1 | tr -d '[:space:]')"
            LESSON_NUMBER="$(sed -n 's/^LESSON_NUMBER=//p' "$REQUEST_FILE" | tail -n 1 | tr -d '[:space:]')"
            LESSON_DATE_CANDIDATE="$(sed -n 's/^LESSON_DATE_CANDIDATE=//p' "$REQUEST_FILE" | tail -n 1 | tr -d '[:space:]')"
            LESSON_DATE_SOURCE="$(sed -n 's/^LESSON_DATE_SOURCE=//p' "$REQUEST_FILE" | tail -n 1)"
            LESSON_DATE_EVIDENCE_JSON="$(sed -n 's/^LESSON_DATE_EVIDENCE_JSON=//p' "$REQUEST_FILE" | tail -n 1)"
            PERSIST_DATABASE="$(sed -n 's/^PERSIST_DATABASE=//p' "$REQUEST_FILE" | tail -n 1 | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
            PERSIST_DATABASE="${PERSIST_DATABASE:-false}"
            if [ -z "$JOB_ID" ]; then
              JOB_ID="$(basename "$REQUEST_FILE" .txt)"
            fi
          fi
          test -n "$JOB_ID"
          case "$JOB_ID" in
            *[!0-9a-f]*) echo "invalid opaque job id" >&2; exit 2 ;;
          esac
          test "${#JOB_ID}" -eq 32
          for ID_VALUE in "$OUTPUT_FOLDER_ID" "$WORK_FOLDER_ID" "$ORIGINAL_SOURCE_DRIVE_ID"; do
            if [ -n "$ID_VALUE" ]; then
              case "$ID_VALUE" in
                *[!0-9A-Za-z_-]*) echo "invalid Drive id" >&2; exit 2 ;;
              esac
            fi
          done
          if [ -n "$LESSON_NUMBER" ]; then
            case "$LESSON_NUMBER" in *[!0-9]*) echo "invalid lesson number" >&2; exit 2 ;; esac
          fi
          if [ -n "$LESSON_DATE_CANDIDATE" ]; then
            case "$LESSON_DATE_CANDIDATE" in
              ????-??-??) ;;
              *) echo "lesson date candidate must be YYYY-MM-DD" >&2; exit 2 ;;
            esac
          fi
          if [ -n "$LESSON_DATE_EVIDENCE_JSON" ]; then
            LESSON_DATE_EVIDENCE_JSON="$LESSON_DATE_EVIDENCE_JSON" python - <<'PY'
          import json, os
          value=json.loads(os.environ['LESSON_DATE_EVIDENCE_JSON'])
          if not isinstance(value,list): raise SystemExit('lesson date evidence must be a JSON array')
          PY
          fi
          case "$PERSIST_DATABASE" in true|false) ;; *) echo "PERSIST_DATABASE must be true or false" >&2; exit 2 ;; esac
          {
            echo "BRIDGE_JOB_ID=$JOB_ID"
            echo "BRIDGE_OUTPUT_FOLDER_ID=$OUTPUT_FOLDER_ID"
            echo "BRIDGE_WORK_FOLDER_ID=$WORK_FOLDER_ID"
            echo "BRIDGE_ORIGINAL_SOURCE_DRIVE_ID=$ORIGINAL_SOURCE_DRIVE_ID"
            echo "BRIDGE_LESSON_NUMBER=$LESSON_NUMBER"
            echo "BRIDGE_LESSON_DATE_CANDIDATE=$LESSON_DATE_CANDIDATE"
            echo "BRIDGE_LESSON_DATE_SOURCE=$LESSON_DATE_SOURCE"
            echo "BRIDGE_PERSIST_DATABASE=$PERSIST_DATABASE"
          } >> "$GITHUB_ENV"
          if [ -n "$LESSON_DATE_EVIDENCE_JSON" ]; then
            {
              echo 'BRIDGE_LESSON_DATE_EVIDENCE_JSON<<BRIDGE_DATE_EOF'
              echo "$LESSON_DATE_EVIDENCE_JSON"
              echo 'BRIDGE_DATE_EOF'
            } >> "$GITHUB_ENV"
          fi

      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Deterministic source identity preflight
        if: env.BRIDGE_ORIGINAL_SOURCE_DRIVE_ID != ''
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from bridge_worker_3_1_free import stable_job_id

          source_id = os.environ["BRIDGE_ORIGINAL_SOURCE_DRIVE_ID"].strip()
          job_id = os.environ["BRIDGE_JOB_ID"].strip()
          expected = stable_job_id("drive", source_id)
          if job_id != expected:
              raise SystemExit(
                  "BLOCKED_IDENTITY_PREFLIGHT: BRIDGE_JOB_ID does not match deterministic Drive source identity"
              )
          print("Deterministic source identity preflight: PASS")
          PY

      - name: Install lightweight Drive, database and longitudinal dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            'requests==2.34.2' 'google-auth==2.56.3' 'pymupdf==1.28.2' \
            'psycopg[binary]==3.3.4' 'numpy==2.2.6'

      - name: Terminal receipt preflight
        id: terminal
        env:
          GOOGLE_DRIVE_OAUTH_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_JSON }}
        run: python check_completed_job.py

      - name: Record durable worker start checkpoint
        if: steps.terminal.outputs.already_completed != 'true'
        env:
          BRIDGE_WORKER_DATABASE_URL: ${{ secrets.BRIDGE_WORKER_DATABASE_URL }}
        run: python database/run_checkpoint_persistence.py --stage worker_start --state started

      - name: Install free open-source runtime
        if: steps.terminal.outputs.already_completed != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check -r requirements-worker.txt

      - name: Google Drive OAuth preflight
        if: steps.terminal.outputs.already_completed != 'true'
        shell: bash
        env:
          GOOGLE_DRIVE_OAUTH_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_JSON }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from run_drive_3_1_free_oidc import user_oauth_token
          token = user_oauth_token()
          if not token:
              raise SystemExit('BLOCKED_ACCESS: GOOGLE_DRIVE_OAUTH_JSON secret is not configured')
          print('Google Drive OAuth preflight: PASS')
          PY

      - name: Monitor v1 worker-start receipt
        if: steps.terminal.outputs.already_completed != 'true' && env.BRIDGE_WORK_FOLDER_ID != ''
        env:
          GOOGLE_DRIVE_OAUTH_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_JSON }}
          MONITOR_V1_STATUS: WORKER_STARTED
        run: python video_run_monitor_v1.py

      - name: FREE-GUARD
        if: steps.terminal.outputs.already_completed != 'true'
        run: python bridge_worker_3_1_free.py

      - name: Process one opaque Drive job with heartbeat
        id: process
        if: steps.terminal.outputs.already_completed != 'true'
        shell: bash
        env:
          GOOGLE_DRIVE_OAUTH_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_JSON }}
          BRIDGE_WORKER_DATABASE_URL: ${{ secrets.BRIDGE_WORKER_DATABASE_URL }}
        run: |
          set -euo pipefail
          python database/run_checkpoint_persistence.py --stage process_job --state started
          (
            while true; do
              sleep 300
              python database/run_checkpoint_persistence.py \
                --stage process_job --state progress \
                --details-json '{"heartbeat":true}' || true
            done
          ) &
          HEARTBEAT_PID=$!
          cleanup_heartbeat() {
            kill "$HEARTBEAT_PID" 2>/dev/null || true
            wait "$HEARTBEAT_PID" 2>/dev/null || true
          }
          trap cleanup_heartbeat EXIT

          set +e
          python run_drive_3_1_free_oidc.py
          RC=$?
          set -e
          cleanup_heartbeat
          trap - EXIT
          if [ "$RC" -eq 0 ]; then
            python database/run_checkpoint_persistence.py \
              --stage process_job --state completed
          else
            python database/run_checkpoint_persistence.py \
              --stage process_job --state failed \
              --error-class PRIMARY_PROCESS_FAILURE \
              --details-json "{\"exit_code\":$RC}" || true
          fi
          exit "$RC"

      - name: Completed job no-op
        if: steps.terminal.outputs.already_completed == 'true'
        run: |
          echo 'ALREADY_COMPLETED: terminal CLEANUP_ACK exists; heavy runtime skipped.'

      - name: Route derived outputs away from master media
        if: always() && env.BRIDGE_OUTPUT_FOLDER_ID != ''
        env:
          GOOGLE_DRIVE_OAUTH_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_JSON }}
        run: python route_drive_job_outputs.py

      - name: Build quality-first Diana longitudinal candidates (dynamic-learning v3)
        id: longitudinal
        if: always() && (steps.process.outcome == 'success' || steps.terminal.outputs.already_completed == 'true') && env.BRIDGE_OUTPUT_FOLDER_ID != '' && env.BRIDGE_LESSON_NUMBER != ''
        env:
          GOOGLE_DRIVE_OAUTH_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_JSON }}
          BRIDGE_WORKER_DATABASE_URL: ${{ secrets.BRIDGE_WORKER_DATABASE_URL }}
        run: python diana_longitudinal_postprocess_v3.py

      - name: Persist completed raw evidence and analysis to Neon
        id: persist
        if: always() && (steps.process.outcome == 'success' || steps.terminal.outputs.already_completed == 'true') && env.BRIDGE_PERSIST_DATABASE == 'true'
        env:
          GOOGLE_DRIVE_OAUTH_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_JSON }}
          BRIDGE_WORKER_DATABASE_URL: ${{ secrets.BRIDGE_WORKER_DATABASE_URL }}
        run: |
          python - <<'PY'
          from run_drive_3_1_free_oidc import user_oauth_token
          from bridge_neon_persistence import persist_completed_drive_job
          token = user_oauth_token()
          if not token:
              raise SystemExit('BLOCKED_ACCESS: Drive OAuth unavailable')
          if persist_completed_drive_job(token) is None:
              raise SystemExit('DATABASE_PERSIST_NOT_CONFIGURED')
          print('DATABASE_PERSIST_COMPLETE')
          PY

      - name: Record durable workflow final checkpoint
        if: always()
        shell: bash
        env:
          BRIDGE_WORKER_DATABASE_URL: ${{ secrets.BRIDGE_WORKER_DATABASE_URL }}
          PROCESS_OUTCOME: ${{ steps.process.outcome }}
          LONGITUDINAL_OUTCOME: ${{ steps.longitudinal.outcome }}
          PERSIST_OUTCOME: ${{ steps.persist.outcome }}
          ALREADY_COMPLETED: ${{ steps.terminal.outputs.already_completed }}
        run: |
          set -euo pipefail
          STATE=completed
          ERROR_CLASS=""
          if [ "$PROCESS_OUTCOME" = "failure" ]; then
            STATE=failed
            ERROR_CLASS=PRIMARY_PROCESS_FAILURE
          elif [ "$LONGITUDINAL_OUTCOME" = "failure" ]; then
            STATE=failed
            ERROR_CLASS=LONGITUDINAL_POSTPROCESS_FAILURE
          elif [ "$PERSIST_OUTCOME" = "failure" ]; then
            STATE=failed
            ERROR_CLASS=DATABASE_PERSIST_FAILURE
          fi
          DETAILS="{\"process_outcome\":\"$PROCESS_OUTCOME\",\"longitudinal_outcome\":\"$LONGITUDINAL_OUTCOME\",\"persist_outcome\":\"$PERSIST_OUTCOME\",\"already_completed\":\"$ALREADY_COMPLETED\"}"
          if [ -n "$ERROR_CLASS" ]; then
            python database/run_checkpoint_persistence.py \
              --stage workflow_final --state "$STATE" \
              --error-class "$ERROR_CLASS" --details-json "$DETAILS"
          else
            python database/run_checkpoint_persistence.py \
              --stage workflow_final --state "$STATE" --details-json "$DETAILS"
          fi

      - name: Monitor v1 final receipt
        if: always() && env.BRIDGE_WORK_FOLDER_ID != ''
        env:
          GOOGLE_DRIVE_OAUTH_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_JSON }}
          MONITOR_V1_STATUS: RUN_FINISHED
          MONITOR_V1_JOB_STATUS: ${{ job.status }}
        run: python video_run_monitor_v1.py

      # No Google Cloud auth, no paid AI endpoint, no billing fallback.
      # Source/master media is read-only; derived files are routed separately.
      # TECHNICAL_READY, CONTENT_EXTRACTED and METHODOLOGY_READY/PARTIAL are separate receipts.
      # Candidate database writes go only to the staging layer and never activate canon/profile/course.
      # Durable Neon checkpoints are technical observations only and carry no promotion authority.
      # Monitor v1 Drive receipts remain an independent external execution witness.
      # Speaker diarization v3 runs locally with collapse detection/repair; no gated model token is required.
      # User media/transcripts are never uploaded as GitHub workflow artifacts.
