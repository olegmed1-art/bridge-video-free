name: One private OCI backup and readback (review harness)

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Reviewed unchanged main SHA
        required: true
        type: string
      expected_review_sha:
        description: Exact independently reviewed harness SHA
        required: true
        type: string
      operation:
        description: Must be OCI_BACKUP_ONE_CREATE_READBACK_V1; requires separate live approval
        required: true
        type: string
      deadline_epoch:
        description: Owner-approved UTC Unix deadline, within 20 minutes of job start
        required: true
        type: string
      oci_write_approval:
        description: OCI_BACKUP_ONE_CREATE_READBACK_V1:<exact SHA>:policies-reviewed:one-create-approved
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: oracle-light-backup-mutation
  cancel-in-progress: false

jobs:
  one_private_backup:
    if: >-
      github.repository == 'olegmed1-art/bridge-video-free' &&
      github.ref == 'refs/heads/test/neon-backup-maintenance-review-20261001' &&
      github.event_name == 'workflow_dispatch' &&
      github.actor == 'olegmed1-art' && github.triggering_actor == 'olegmed1-art' &&
      github.run_attempt == 1 && inputs.expected_review_sha == github.sha &&
      inputs.expected_main_sha == '1440920191e1778fb9a9ba24e6701937a1a7459c' &&
      inputs.operation == 'OCI_BACKUP_ONE_CREATE_READBACK_V1' &&
      inputs.oci_write_approval == format('OCI_BACKUP_ONE_CREATE_READBACK_V1:{0}:policies-reviewed:one-create-approved', github.sha)
    environment: database-production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Record start before checkout
        shell: bash
        run: echo "VALIDATION_STARTED=$(date -u +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned OCI SDK without credentials
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s python -m pip install --disable-pip-version-check --quiet 'oci==2.187.1'
          python -c "import oci; assert oci.__version__ == '2.187.1'"
      - name: One encrypted OCI create and readback restore with sanitized summary
        env:
          DATABASE_URL: ${{ secrets.LIGHT_MAINTENANCE_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.NEON_BACKUP_PASSPHRASE }}
          EXPECTED_MAIN: ${{ inputs.expected_main_sha }}
          EXPECTED_REVIEW: ${{ inputs.expected_review_sha }}
          VALIDATION_OPERATION: ${{ inputs.operation }}
          VALIDATION_DEADLINE: ${{ inputs.deadline_epoch }}
          OCI_WRITE_APPROVAL: ${{ inputs.oci_write_approval }}
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          timeout --signal=TERM --kill-after=30s 1140s python -m ops.neon_backup_oci_once
      - name: Always remove this run's local containers and files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          timeout 10s docker rm -f -v "backup-validation-${GITHUB_RUN_ID}-source" "backup-validation-${GITHUB_RUN_ID}-restore" >/dev/null 2>&1 || true
          python - <<'PY'
          import os, pathlib, shutil
          base = pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
          target = base / ('backup-validation-' + os.environ['GITHUB_RUN_ID'])
          assert target.parent == base and not target.is_symlink()
          if target.exists():
              shutil.rmtree(target)
          PY
