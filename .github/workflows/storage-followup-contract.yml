name: Read-only storage followup contract
on:
  push:
    branches: [review/admission-containment-20261003]
    paths:
      - 'ops/storage_followup_contract/**'
      - '.github/workflows/storage-followup-contract.yml'
permissions:
  contents: read
concurrency:
  group: storage-followup-synthetic-contract
  cancel-in-progress: false
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Read-only followup and bounded transport tests
        working-directory: ops/storage_followup_contract
        run: |
          set -euo pipefail
          python3 -m unittest discover -v
