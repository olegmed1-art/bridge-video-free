name: Autopilot Vercel environment capability probe (one-shot)

on:
  push:
    branches: [codex/oracle-autopilot-lite-shadow]
    paths: ['.github/workflows/autopilot-vercel-capability-probe-once.yml']

permissions:
  contents: read

concurrency:
  group: oracle-instance-workload-mutation
  cancel-in-progress: false

jobs:
  probe:
    if: github.repository == 'olegmed1-art/bridge-video-free'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      ORACLE_HOST: 158.180.47.161
      ORACLE_USER: ubuntu
      EXPECTED_FINGERPRINT: SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk
      SSH_KEY_ORACLE: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
      EXPECTED_HELPER_HOST: bridge-school-autopilot-87iyugbsy-olegmed1-4368s-projects.vercel.app
      SHARE_URL_CIPHERTEXT_SHA256: c2a49dd43886507348a634699e91826fd8e753bacf1ac4f820f6617edc848f3d
      SHARE_URL_CIPHERTEXT_B64: 
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Verify Oracle SSH boundary
        id: ssh
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/autopilot-vercel-capability-probe"
          mkdir -p "$work"
          key="$work/id_oracle"
          printf '%s\n' "$SSH_KEY_ORACLE" | tr -d '\r' > "$key"
          chmod 0600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          known="$work/known_hosts"
          ops/oracle_known_hosts_from_scan.sh "$ORACLE_HOST" "$EXPECTED_FINGERPRINT" "$known"
          ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" \
            -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST" 'sudo -n true'
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "known=$known" >> "$GITHUB_OUTPUT"
          echo 'ORACLE_SSH_PREFLIGHT=PASS'

      - name: Decrypt share URL only on Oracle and read safe capability booleans
        shell: bash
        run: |
          set -Eeuo pipefail
          cipher="$RUNNER_TEMP/autopilot-vercel-capability-probe/share.oaep"
          printf '%s' "$SHARE_URL_CIPHERTEXT_B64" | base64 --decode > "$cipher"
          [[ "$(wc -c < "$cipher")" == 384 ]]
          [[ "$(sha256sum "$cipher" | awk '{print $1}')" == "$SHARE_URL_CIPHERTEXT_SHA256" ]]
          remote="/tmp/autopilot-capability-${GITHUB_RUN_ID}.oaep"
          scp -q -i '${{ steps.ssh.outputs.key }}' -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile='${{ steps.ssh.outputs.known }}' \
            -o ConnectTimeout=15 "$cipher" "$ORACLE_USER@$ORACLE_HOST:$remote"
          ssh -i '${{ steps.ssh.outputs.key }}' -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile='${{ steps.ssh.outputs.known }}' \
            -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST" \
            "sudo -n env CIPHER='$remote' EXPECTED_HOST='$EXPECTED_HELPER_HOST' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          private=/opt/bridge-school/school-autopilot/bootstrap/oracle-bootstrap-rsa.pem
          work="$(mktemp -d /var/tmp/autopilot-capability.XXXXXXXX)"
          cleanup(){ rm -f -- "$CIPHER"; find "$work" -depth -delete; }
          trap cleanup EXIT HUP INT TERM
          [[ "$(stat -c '%U:%G:%a' "$private")" == root:root:600 ]]
          openssl pkeyutl -decrypt -inkey "$private" -in "$CIPHER" -out "$work/share" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256
          SHARE_FILE="$work/share" EXPECTED_HOST="$EXPECTED_HOST" python3 - <<'PY' > "$work/url"
          import os, re, urllib.parse
          from pathlib import Path
          parsed=urllib.parse.urlsplit(Path(os.environ['SHARE_FILE']).read_text().strip())
          query=urllib.parse.parse_qs(parsed.query, strict_parsing=True)
          assert parsed.scheme == 'https' and parsed.hostname == os.environ['EXPECTED_HOST'] and parsed.path == '/healthz'
          assert set(query) == {'_vercel_share'} and len(query['_vercel_share']) == 1
          token=query['_vercel_share'][0]
          assert re.fullmatch(r'[A-Za-z0-9]{20,128}', token)
          print(f"URL=https://{parsed.hostname}{parsed.path}?_vercel_share={token}")
          PY
          chmod 0600 "$work/url"
          source "$work/url"
          jar="$work/cookies"
          curl --fail --silent --show-error --location --max-redirs 6 \
            --connect-timeout 10 --max-time 60 -c "$jar" -b "$jar" \
            "$URL" -o "$work/health.json"
          HEALTH="$work/health.json" python3 - <<'PY'
          import json, os
          payload=json.load(open(os.environ['HEALTH'], encoding='utf-8'))
          assert payload.get('status') == 'ok'
          assert payload.get('service') == 'school-autopilot-environment-capability-probe'
          assert payload.get('preview_only') is True
          assert payload.get('production_mutations_enabled') is False
          assert payload.get('values_exposed') is False
          caps=payload.get('capabilities')
          assert isinstance(caps, dict)
          allowed={
              'NEON_API_KEY','NEON_DATABASE_URL','DATABASE_URL','POSTGRES_URL',
              'POSTGRES_URL_NON_POOLING','DIRECT_DATABASE_URL','AUTOPILOT_DATABASE_URL',
              'VERCEL_OIDC_TOKEN','VERCEL_AUTOMATION_BYPASS_SECRET',
              'AUTOPILOT_TOKEN_BROKER_SECRET','AUTOPILOT_GITHUB_APP_ID',
              'AUTOPILOT_GITHUB_INSTALLATION_ID','AUTOPILOT_GITHUB_PRIVATE_KEY',
          }
          assert set(caps) == allowed
          for name in sorted(caps):
              assert isinstance(caps[name], bool)
              print(f'AUTOPILOT_VERCEL_CAPABILITY {name}={str(caps[name]).lower()}')
          print('AUTOPILOT_VERCEL_CAPABILITY_PROBE=PASS')
          PY
          echo 'PLAINTEXT_SECRET_EXPOSED=NO'
          echo 'DATABASE_MUTATED=NO'
          echo 'AUTOPILOT_SERVICE_RESTARTED=NO'
          echo 'ORACLE_INSTANCE_STOP_REQUESTED=NO'
          REMOTE
