name: Tournament Analyzer v3 Structural Validation

on:
  pull_request:
    paths:
      - "bridge_school_api/tournament_structural_validation_v3.py"
      - "tools/tournament_structural_validation_v3.py"
      - "tests/test_tournament_structural_validation_v3.py"
      - "data/tournaments/tournament_30041_round2_diana_facts_v1.json"
      - ".github/workflows/tournament-analyzer-v3-structural-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-30041-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile structural validator
        run: |
          python -m py_compile bridge_school_api/tournament_structural_validation_v3.py
          python -m py_compile tools/tournament_structural_validation_v3.py
      - name: Run structural contracts
        run: python -m pytest -q tests/test_tournament_structural_validation_v3.py
      - name: Validate real 30041 source structure
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python tools/tournament_structural_validation_v3.py \
            --facts data/tournaments/tournament_30041_round2_diana_facts_v1.json \
            --out tournament-30041-structural-validation.json
      - name: Enforce v1.4 structural boundary
        run: |
          python - <<'PY'
          import json
          p=json.load(open('tournament-30041-structural-validation.json', encoding='utf-8'))
          assert p['schema']=='tournament-structural-validation-v1'
          assert p['board_count']==24
          assert p['coverage']['complete'] is True
          assert p['coverage']['missing_boards']==[]
          assert p['coverage']['duplicate_boards']==[]
          assert p['status_counts']=={'average':1,'played':21,'unplayed':2}
          assert p['dealer_cycle_pass'] is True
          assert p['vulnerability_cycle_pass'] is True
          assert p['hands_13x4_pass'] is True
          assert p['cards_52_unique_pass'] is True
          assert p['opening_leads_checked']==21
          assert p['opening_leads_legal']==21
          assert p['status_consistency_pass'] is True
          assert p['source_conflict_gate_pass'] is True
          assert p['all_structural_checks_pass'] is True
          by_board={x['board_number']:x for x in p['checks']}
          assert by_board[2]['opening_lead']['leader']=='W' and by_board[2]['opening_lead']['card']=='2S'
          assert by_board[9]['opening_lead']['leader']=='S' and by_board[9]['opening_lead']['card']=='5C'
          assert by_board[24]['opening_lead']['leader']=='E' and by_board[24]['opening_lead']['card']=='AS'
          print('TOURNAMENT_30041_STRUCTURE_V14_GATE_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tournament-analyzer-v3-30041-structural-validation
          path: tournament-30041-structural-validation.json
          if-no-files-found: error
          retention-days: 30
