name: Tournament Analyzer v3 Portfolio Episode Scoring

on:
  pull_request:
    paths:
      - "bridge_school_api/tournament_portfolio_episode_scoring_v3.py"
      - "tests/test_tournament_portfolio_episode_scoring_v3.py"
      - ".github/workflows/tournament-analyzer-v3-portfolio-episode-scoring.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  real-portfolio-episode-scoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests and compile
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m py_compile bridge_school_api/tournament_portfolio_episode_scoring_v3.py
          python -m pytest -q tests/test_tournament_portfolio_episode_scoring_v3.py
      - name: Restore exact portfolio and source review batches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/portfolio evidence/historical evidence/opening
          for spec in \
            "9569845552:/tmp/portfolio.zip:evidence/portfolio" \
            "9558677983:/tmp/historical.zip:evidence/historical" \
            "9569379785:/tmp/opening.zip:evidence/opening"; do
            IFS=: read -r aid zip dest <<< "$spec"
            curl -fsSL --retry 3 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${aid}/zip" \
              -o "$zip"
            unzip -q "$zip" -d "$dest"
          done
          PORTFOLIO="$(find evidence/portfolio -type f -name 'tournament-teacher-review-portfolio.json' -print -quit)"
          HISTORICAL="$(find evidence/historical -type f -name 'tournament-teacher-review-bundle.json' -print -quit)"
          OPENING="$(find evidence/opening -type f -name 'tournament-30041-opening-lead-review-handoff.json' -print -quit)"
          test -n "$PORTFOLIO" && test -n "$HISTORICAL" && test -n "$OPENING"
          echo "PORTFOLIO=$PORTFOLIO" >> "$GITHUB_ENV"
          echo "HISTORICAL=$HISTORICAL" >> "$GITHUB_ENV"
          echo "OPENING=$OPENING" >> "$GITHUB_ENV"
      - name: Rebuild exact opening-lead bundle and current decisions
        run: |
          PYTHONPATH="$PWD" python - <<'PY'
          import json, os
          from bridge_school_api.tournament_teacher_review_bundle_v3 import build_teacher_review_bundle
          from bridge_school_api.tournament_teacher_review_portfolio_intake_v3 import build_portfolio_teacher_decision_template, apply_portfolio_teacher_decision_intake
          p=json.load(open(os.environ['PORTFOLIO'],encoding='utf-8'))
          h=json.load(open(os.environ['HISTORICAL'],encoding='utf-8'))
          handoff=json.load(open(os.environ['OPENING'],encoding='utf-8'))
          o=build_teacher_review_bundle(handoff['queue'],handoff['decision_ledger'],handoff['dossier'])
          bundles=[h,o]
          template=build_portfolio_teacher_decision_template(p,bundles)
          result=apply_portfolio_teacher_decision_intake(p,bundles,template)
          json.dump(o,open('opening-bundle.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          json.dump(result,open('portfolio-decision-result.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          assert result['pending_count']==21 and result['decided_count']==0
          PY
      - name: Prove all 21 review items are represented in scoring authority
        run: |
          PYTHONPATH="$PWD" python - <<'PY'
          import json, os
          from bridge_school_api.tournament_portfolio_episode_scoring_v3 import build_portfolio_episode_scoring_template, apply_portfolio_episode_scoring_intake
          p=json.load(open(os.environ['PORTFOLIO'],encoding='utf-8'))
          h=json.load(open(os.environ['HISTORICAL'],encoding='utf-8'))
          o=json.load(open('opening-bundle.json',encoding='utf-8'))
          result=json.load(open('portfolio-decision-result.json',encoding='utf-8'))
          bundles=[h,o]
          intake=build_portfolio_episode_scoring_template(p,bundles,result)
          out=apply_portfolio_episode_scoring_intake(p,bundles,result,intake)
          assert intake['review_item_count']==21
          assert intake['confirmed_technical_count']==0
          assert intake['unresolved_teacher_review_count']==21
          assert len(intake['rows'])==21
          assert all(row['status']=='BLOCKED_TEACHER_DECISION' for row in intake['rows'])
          assert out['explicitly_scored_count']==0
          assert out['unresolved_teacher_review_count']==21
          assert out['portfolio_episode_scoring_complete'] is False
          assert out['automatic_episode_scoring_used'] is False
          assert out['automatic_methodology_mapping_used'] is False
          assert out['automatic_student_error_attribution_used'] is False
          json.dump({'intake':intake,'result':out},open('portfolio-episode-scoring.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print('TOURNAMENT_PORTFOLIO_EPISODE_SCORING_REAL_PASS')
          print('review_items',intake['review_item_count'],'blocked_teacher_decision',out['unresolved_teacher_review_count'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tournament-analyzer-v3-portfolio-episode-scoring
          path: portfolio-episode-scoring.json
          if-no-files-found: error
          retention-days: 30
