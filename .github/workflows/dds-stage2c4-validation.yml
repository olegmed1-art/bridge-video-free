name: DDS Stage 2C.4 — validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/dds-stage2c4-validation.yml'
      - 'dds_training/stage2c4_validation.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: dds-stage2c4-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  STAGE2B_ARTIFACT_ID: '9318545935'
  STAGE2B_ARTIFACT_NAME: 'dds-stage2b-v25-prepared-evidence-32121009819'
  STAGE2B_ARTIFACT_DIGEST: 'sha256:efdd62ab9a2643f231d3faea5c9475fe519cbd5b2e94dc9a764ca6087c043604'
  STAGE2C2_ARTIFACT_ID: '9352988318'
  STAGE2C2_ARTIFACT_NAME: 'dds-stage2c2-train-v2-32217687615'
  STAGE2C2_ARTIFACT_DIGEST: 'sha256:1fd61be6816df747824467266167dc22e6a88ae4a62794643f14fd176e566da2'
  STAGE2C4_ARTIFACT_ID: '9410795030'
  STAGE2C4_ARTIFACT_NAME: 'dds-stage2c4-blind-regression-32380533183'
  STAGE2C4_ARTIFACT_DIGEST: 'sha256:a2bc363fe9309232f1a8377961a4e19eabc72b911c94497b3c896a9d1f4d4bbd'
  TRAIN_DRIVE_LOCATOR: 'dds_training/artifact_locations/dds-main-train-32060398288.json'
  TRAIN_ARTIFACT_ZIP_SHA256: 'c46cda2fb127371cbc1ab836c74580b25f0a0bb8ab358dfaab97cf591dd8a246'
  GH_TOKEN: ${{ github.token }}

jobs:
  validation:
    if: >-
      github.actor == 'olegmed1-art' &&
      github.event.pull_request.head.ref == 'dds-stage2c4-validation-20260820'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact PR merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Compile validation runner and validate Drive restore contract
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile dds_training/stage2c4_validation.py
          python -m pip install --disable-pip-version-check 'requests==2.32.5' 'google-auth==2.40.3'
          PYTHONPATH=. python tests/test_restore_drive_split_artifact.py
          PYTHONPATH=. python tools/restore_drive_split_artifact.py \
            --locator "$TRAIN_DRIVE_LOCATOR" \
            --output /tmp/unused-dds-main-train.zip \
            --validate-only

      - name: Restore and verify immutable TRAIN evidence artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/s2b /tmp/s2c2 /tmp/s2c4
          mkdir -p /tmp/s2b /tmp/s2c2 /tmp/s2c4
          verify_artifact() {
            local id="$1" expected_name="$2" expected_digest="$3" meta="$4"
            gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" > "$meta"
            python - "$meta" "$expected_name" "$expected_digest" <<'PY'
          import json,sys
          p,name,digest=sys.argv[1:]
          m=json.load(open(p,encoding='utf-8'))
          assert m['name']==name,(m['name'],name)
          assert m.get('digest')==digest,(m.get('digest'),digest)
          assert not m.get('expired',False),m
          print({'artifact_id':m['id'],'name':m['name'],'digest':m['digest'],'expired':False})
          PY
          }
          verify_artifact "$STAGE2B_ARTIFACT_ID" "$STAGE2B_ARTIFACT_NAME" "$STAGE2B_ARTIFACT_DIGEST" /tmp/s2b/meta.json
          verify_artifact "$STAGE2C2_ARTIFACT_ID" "$STAGE2C2_ARTIFACT_NAME" "$STAGE2C2_ARTIFACT_DIGEST" /tmp/s2c2/meta.json
          verify_artifact "$STAGE2C4_ARTIFACT_ID" "$STAGE2C4_ARTIFACT_NAME" "$STAGE2C4_ARTIFACT_DIGEST" /tmp/s2c4/meta.json
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${STAGE2B_ARTIFACT_ID}/zip" > /tmp/s2b/artifact.zip
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${STAGE2C2_ARTIFACT_ID}/zip" > /tmp/s2c2/artifact.zip
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${STAGE2C4_ARTIFACT_ID}/zip" > /tmp/s2c4/artifact.zip
          unzip -q /tmp/s2b/artifact.zip -d /tmp/s2b/files
          unzip -q /tmp/s2c2/artifact.zip -d /tmp/s2c2/files
          unzip -q /tmp/s2c4/artifact.zip -d /tmp/s2c4/files
          test -f /tmp/s2b/files/continuation_curriculum_balanced.jsonl
          test -n "$(find /tmp/s2c2/files -name stage2c2_continuation_results.jsonl -print -quit)"
          test -n "$(find /tmp/s2c4/files -name stage2c4_predictions.jsonl -print -quit)"

      - name: Restore exact completed main corpus from verified Drive copy
        shell: bash
        env:
          GOOGLE_DRIVE_OAUTH_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_JSON }}
        run: |
          set -euo pipefail
          rm -rf /tmp/main-train /tmp/train-state
          mkdir -p /tmp/main-train /tmp/train-state
          PYTHONPATH=. python tools/restore_drive_split_artifact.py \
            --locator "$TRAIN_DRIVE_LOCATOR" \
            --output /tmp/main-train/artifact.zip \
            --work-dir /tmp/main-train/parts
          echo "$TRAIN_ARTIFACT_ZIP_SHA256  /tmp/main-train/artifact.zip" | sha256sum -c -
          unzip -q /tmp/main-train/artifact.zip -d /tmp/main-train/extracted
          state="$(find /tmp/main-train/extracted -name 'dds-main-train-progress-state.tgz' -print -quit)"
          test -n "$state"
          tar -xzf "$state" -C /tmp/train-state
          test -n "$(find /tmp/train-state -name blind_tasks_crossfit_main.jsonl -print -quit)"
          test -n "$(find /tmp/train-state -name training.sqlite3 -print -quit)"

      - name: Lock validation scope and predictions before DDS
        working-directory: dds_training
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work/stage2c4-validation
          mkdir -p work/stage2c4-validation/prepared work/stage2c4-validation/result
          main_tasks="$(find /tmp/train-state -name blind_tasks_crossfit_main.jsonl -print -quit)"
          s2c2="$(find /tmp/s2c2/files -name stage2c2_continuation_results.jsonl -print -quit)"
          s2c4="$(find /tmp/s2c4/files -name stage2c4_predictions.jsonl -print -quit)"
          test -n "$main_tasks" && test -n "$s2c2" && test -n "$s2c4"
          python stage2c4_validation.py prepare \
            --main-tasks "$main_tasks" \
            --stage2b /tmp/s2b/files \
            --stage2c2 "$s2c2" \
            --stage2c4 "$s2c4" \
            --out work/stage2c4-validation/prepared \
            --source-total 650 \
            --per-actor 1000 \
            --line-cards 16 \
            | tee work/stage2c4-validation/prepared/prepare.log

      - name: Verify pre-open gates and untouched fresh validation IDs
        working-directory: dds_training
        shell: bash
        run: |
          set -euo pipefail
          (cd work/stage2c4-validation/prepared && sha256sum -c locked_validation_predictions.sha256)
          python - <<'PY'
          import json,sqlite3
          from pathlib import Path
          root=Path('work/stage2c4-validation/prepared')
          e=json.loads((root/'STAGE2C4_VALIDATION_PREOPEN_EVIDENCE.json').read_text())
          assert e['owner_validation_authorized'] is True
          assert e['validation_opened'] is True and e['sealed_opened'] is False
          assert e['dds_called'] is False
          assert e['learning_allowed'] is False and e['learning_mutated'] is False
          assert e['family_overlap_train_validation']==0
          assert e['curriculum']['selected_by_actor']=={'declarer':1000,'defense':1000}
          tasks=[json.loads(x) for x in (root/'validation_continuation_tasks.jsonl').read_text().splitlines() if x.strip()]
          assert len(tasks)==2000 and all(t['source_root_split']=='validation' for t in tasks)
          source_ids={str(t['derived_from_task_id']) for t in tasks}
          derived_ids={str(t['task_id']) for t in tasks}
          db_path=next(Path('/tmp/train-state').rglob('training.sqlite3'))
          con=sqlite3.connect(db_path)
          result_ids={str(x[0]) for x in con.execute('select task_id from dds_results')}
          con.close()
          assert not (source_ids & result_ids), 'fresh main validation source already has DDS result'
          assert not (derived_ids & result_ids), 'validation continuation already has DDS result'
          print({'validation_predictions_locked':True,'positions':2000,'fresh_sources':len(source_ids),'sealed_opened':False,'dds_called':False})
          PY

      - name: Restore verified DDS3 cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            dds_training/.wheel-cache/dds3
            ~/.cache/bazel-dds3
          key: dds3-wheel-v5-${{ runner.os }}-py314-${{ hashFiles('dds_training/bootstrap_linux.sh') }}
          restore-keys: |
            dds3-wheel-v5-${{ runner.os }}-py314-

      - name: Bootstrap pinned local DDS3
        run: DDS_RUN_PREFLIGHT=0 bash dds_training/bootstrap_linux.sh

      - name: Evaluate locked validation predictions with DDS
        working-directory: dds_training
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          python stage2c4_validation.py evaluate \
            --prepared work/stage2c4-validation/prepared \
            --out work/stage2c4-validation/result \
            | tee work/stage2c4-validation/result/evaluate.log

      - name: Verify validation evidence and sealed boundary
        working-directory: dds_training
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('work/stage2c4-validation')
          pre=json.loads((root/'prepared/STAGE2C4_VALIDATION_PREOPEN_EVIDENCE.json').read_text())
          res=json.loads((root/'result/STAGE2C4_VALIDATION_EVIDENCE.json').read_text())
          assert res['status']=='validation_complete'
          assert res['validation_opened'] is True and res['validation_completed'] is True
          assert res['sealed_opened'] is False and res['sealed_evaluated']==0
          assert res['learning_allowed'] is False and res['learning_mutated'] is False
          assert res['historical_database_mutated'] is False
          assert res['automatic_promotion'] is False
          assert res['locked_prediction_sha256']==pre['locked_prediction_sha256']
          assert res['positions']==2000
          assert res['by_actor']['declarer']['old']['n']==1000
          assert res['by_actor']['defense']['old']['n']==1000
          assert res['next_gate'] in {'owner_decision_on_sealed','return_to_train_new_candidate'}
          print({'validation_complete':True,'gate_pass':res['validation_gate_pass'],'next_gate':res['next_gate'],'sealed_opened':False,'learning_mutated':False})
          PY

      - name: Verify repository sources remained unchanged
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all | grep -v '^?? dds_training/work/' || true)"

      - name: Package validation evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -d dds_training/work/stage2c4-validation; then
            tar -czf dds-stage2c4-validation.tgz -C dds_training/work stage2c4-validation
            sha256sum dds-stage2c4-validation.tgz > dds-stage2c4-validation.tgz.sha256
          fi

      - name: Upload Stage 2C.4 validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dds-stage2c4-validation-${{ github.run_id }}
          path: |
            dds_training/work/stage2c4-validation/
            dds-stage2c4-validation.tgz
            dds-stage2c4-validation.tgz.sha256
          retention-days: 30
          if-no-files-found: warn
