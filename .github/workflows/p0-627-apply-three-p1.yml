name: P0 627 safe three-P1 patch writer

on:
  push:
    branches:
      - autopilot/oracle-idle-stop-guard-627-v2
    paths:
      - '.github/workflows/p0-627-apply-three-p1.yml'

permissions:
  contents: write

concurrency:
  group: p0-627-safe-patch-writer
  cancel-in-progress: false

jobs:
  apply-tested-patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply reviewed three-P1 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/p0_627_apply_three_p1.py
          python3 tools/p0_627_apply_three_p1.py
          bash -n ops/install_oracle_idle_state_ocarun.sh ops/oracle_idle_state.sh
          python3 -m py_compile ops/oracle_idle_stop_guard.py tests/test_oracle_idle_workload_fence.py
          ruby -e "require 'yaml'; YAML.parse_file(ARGV.fetch(0))" .github/workflows/oracle-idle-guard-exact-install.yml
          ruby -e "require 'yaml'; YAML.parse_file(ARGV.fetch(0))" .github/workflows/oracle-operator-v2.yml
          git diff --check

      - name: Run targeted no-production tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet pytest pyyaml
          python3 -m pytest -q \
            tests/test_oracle_idle_workload_fence.py \
            tests/test_oracle_idle_stop_guard.py \
            tests/test_oracle_idle_unknown_precedence.py \
            tests/test_universal_video_idle_candidate_contract.py

      - name: Commit final patch only
        shell: bash
        run: |
          set -euo pipefail
          test ! -e tools/p0_627_apply_three_p1.py
          test ! -e .github/workflows/p0-627-apply-three-p1.yml
          git status --short
          git config user.name 'olegmed1-art'
          git config user.email 'olegmed1@gmail.com'
          git add -A
          git commit -m 'fix(oracle): close final install and operator races'
          git push origin HEAD:autopilot/oracle-idle-stop-guard-627-v2
