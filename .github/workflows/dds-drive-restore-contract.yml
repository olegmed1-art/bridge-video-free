name: DDS Drive restore contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/restore_drive_split_artifact.py'
      - 'tests/test_restore_drive_split_artifact.py'
      - 'dds_training/artifact_locations/**'
      - '.github/workflows/dds-main-30k-prepare.yml'
      - '.github/workflows/dds-main-30k-train-authorized.yml'
      - '.github/workflows/dds-stage2b-prepare.yml'
      - '.github/workflows/dds-training-v23-smoke.yml'
      - '.github/workflows/dds-prsafe-drive-attestation.yml'
      - '.github/workflows/dds-drive-restore-contract.yml'
  push:
    branches: [main]
    paths:
      - 'tools/restore_drive_split_artifact.py'
      - 'tests/test_restore_drive_split_artifact.py'
      - 'dds_training/artifact_locations/**'
      - '.github/workflows/dds-main-30k-prepare.yml'
      - '.github/workflows/dds-main-30k-train-authorized.yml'
      - '.github/workflows/dds-stage2b-prepare.yml'
      - '.github/workflows/dds-training-v23-smoke.yml'
      - '.github/workflows/dds-prsafe-drive-attestation.yml'
      - '.github/workflows/dds-drive-restore-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - name: Install restore helper dependencies
        run: python -m pip install --disable-pip-version-check 'requests==2.32.5' 'google-auth==2.40.3'
      - name: Run fail-closed local restore tests
        run: |
          set -euo pipefail
          python -m compileall -q tools/restore_drive_split_artifact.py tests/test_restore_drive_split_artifact.py
          PYTHONPATH=. python tests/test_restore_drive_split_artifact.py
          for locator in \
            dds_training/artifact_locations/dds-main-train-32060398288.json \
            dds_training/artifact_locations/dds-main-30k-prepared-32052220151.json \
            dds_training/artifact_locations/dds-pilot-10k-complete-31909124383.json
          do
            PYTHONPATH=. python tools/restore_drive_split_artifact.py \
              --locator "$locator" \
              --output /tmp/unused.zip \
              --validate-only
          done

          stage2b=.github/workflows/dds-stage2b-prepare.yml
          train=.github/workflows/dds-main-30k-train-authorized.yml
          prepare=.github/workflows/dds-main-30k-prepare.yml
          attest=.github/workflows/dds-prsafe-drive-attestation.yml

          grep -F 'GOOGLE_DRIVE_OAUTH_JSON' "$stage2b"
          ! grep -F '/actions/artifacts/${TRAIN_ARTIFACT_ID}/zip' "$stage2b"
          grep -F 'PREPARED_DRIVE_LOCATOR' "$train"
          grep -F 'GOOGLE_DRIVE_OAUTH_JSON' "$train"
          grep -F 'gh run download "$GITHUB_RUN_ID"' "$train"
          ! grep -F 'PREPARED_RUN_ID' "$train"

          grep -F 'pull_request_target:' "$prepare"
          ! grep -Eq '^  pull_request:$' "$prepare"
          grep -F 'PILOT_DRIVE_LOCATOR' "$prepare"
          grep -F "github.event.pull_request.head.repo.full_name == github.repository" "$prepare"
          grep -F "github.event.pull_request.user.login == 'olegmed1-art'" "$prepare"
          grep -F 'github.event.pull_request.base.sha' "$prepare"
          grep -F 'github.event.pull_request.head.sha' "$prepare"
          grep -F 'GOOGLE_DRIVE_OAUTH_JSON' "$prepare"
          ! grep -F 'PILOT_RUN_ID' "$prepare"
          ! grep -F 'gh run download' "$prepare"
          ! grep -F 'actions: read' "$prepare"

          grep -F 'workflow_run:' "$attest"
          grep -F "DDS main 30k — prepare from preserved pilot" "$attest"
          grep -F "github.event.workflow_run.conclusion == 'success'" "$attest"
          grep -F "github.event.workflow_run.event == 'pull_request_target'" "$attest"
          grep -F "github.event.workflow_run.actor.login == 'olegmed1-art'" "$attest"
          grep -F 'github.event.workflow_run.pull_requests[0].head.repo.full_name == github.repository' "$attest"
          grep -F 'issues: write' "$attest"
          grep -F 'DDS_PRSAFE_DRIVE_PREPARE_PASS' "$attest"
          ! grep -F 'secrets.' "$attest"
          ! grep -F 'contents: write' "$attest"
          ! grep -F 'actions: write' "$attest"

          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/dds-main-30k-prepare.yml').read_text(encoding='utf-8')
          base_checkout = text.index('Checkout trusted base before Drive credential exposure')
          secret = text.index('secrets.GOOGLE_DRIVE_OAUTH_JSON')
          candidate_checkout = text.index('Checkout exact candidate after Drive secret scope has ended')
          assert base_checkout < secret < candidate_checkout
          assert 'secrets.GOOGLE_DRIVE_OAUTH_JSON' not in text[candidate_checkout:]
          assert 'pull_request_target' in text
          assert 'retention-days: 7' in text

          att = Path('.github/workflows/dds-prsafe-drive-attestation.yml').read_text(encoding='utf-8')
          checkout_ref = 'uses:' + ' actions/checkout'
          assert 'workflow_run:' in att
          assert 'issues: write' in att
          assert checkout_ref not in att
          assert 'secrets.' not in att
          assert 'github.event.workflow_run.pull_requests[0].number' in att
          assert 'github.event.workflow_run.pull_requests[0].head.sha' in att
          assert 'needs.' not in att
          print('DDS_PRSAFE_DRIVE_BOUNDARY: PASS')
          PY
