name: Bridge Backfill Integrity CI

on:
  pull_request:
    paths:
      - 'database/backfill_video_results.py'
      - 'tests/test_backfill_identity.py'
      - '.github/workflows/backfill-integrity-ci.yml'
  push:
    branches: [main]
    paths:
      - 'database/backfill_video_results.py'
      - 'tests/test_backfill_identity.py'
      - '.github/workflows/backfill-integrity-ci.yml'

permissions:
  contents: read

jobs:
  backfill-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install import dependencies
        run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.3.4' requests google-auth pymupdf
      - name: Compile backfill modules
        run: python -m py_compile database/backfill_video_results.py tests/test_backfill_identity.py
      - name: Run backfill identity regression tests
        run: PYTHONPATH=. python tests/test_backfill_identity.py
