name: Oracle Universal Video Batch Intake

on:
  pull_request:
    paths:
      - '.github/workflows/oracle-universal-video-batch-intake.yml'
      - 'ops/universal-video-batch-request.schema.json'
      - 'ops/universal-video-batch-intake.schema.json'
      - 'tests/test_universal_video_batch_workflow_contract.py'
  push:
    branches: [main]
    paths:
      - 'ops/oracle-universal-video-batch-requests/*.json'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('oracle-video-batch-pr-{0}', github.event.pull_request.number) || format('oracle-video-batch-request-{0}', github.sha) }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      encoded_intake: ${{ steps.request.outputs.encoded_intake }}
      request_key: ${{ steps.request.outputs.request_key }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Validate bounded project-neutral request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q requests
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            python -m pip install --disable-pip-version-check -q pytest google-auth
            python -m py_compile universal_video/video_queue.py universal_video/video_queue_intake.py
            python -m pytest -q tests/test_universal_video_batch_workflow_contract.py tests/test_universal_video_neon_queue.py
            echo 'encoded_intake=' >> "$GITHUB_OUTPUT"
            echo 'request_key=contract-only' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -t files < <(git diff-tree -m --no-commit-id --name-only -r "$GITHUB_SHA" \
            | grep -E '^ops/oracle-universal-video-batch-requests/[^/]+\.json$' | sort -u)
          [[ ${#files[@]} -eq 1 ]] || { echo 'expected exactly one batch request' >&2; exit 1; }
          REQUEST_FILE="${files[0]}" python - <<'PY' >> "$GITHUB_OUTPUT"
          import base64, json, os, re
          from universal_video.video_queue import validate_intake_request

          path=os.environ['REQUEST_FILE']
          if os.path.getsize(path)>16384: raise SystemExit('batch request too large')
          value=json.load(open(path,encoding='utf-8'))
          assert set(value)=={'request_id','host','user','expected_host_fingerprint','intake'}
          assert re.fullmatch(r'[A-Za-z0-9._-]{1,80}',str(value['request_id']))
          assert value['host']=='158.180.47.161' and value['user']=='ubuntu'
          assert value['expected_host_fingerprint']=='SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk'
          intake=validate_intake_request(value['intake'])
          raw=json.dumps(intake,ensure_ascii=False,separators=(',',':')).encode()
          print('encoded_intake='+base64.b64encode(raw).decode())
          print('request_key='+intake['request_key'])
          PY

  enqueue:
    if: ${{ github.event_name == 'push' }}
    needs: validate
    runs-on: ubuntu-24.04
    # The longest competing bounded mutator (productionize) may hold the host
    # fence for 75 minutes. Each immutable request has its own workflow run, so
    # wait beyond that bound instead of abandoning a durable enqueue.
    # Three bounded 80-minute SSH attempts plus two worst-case 20-minute
    # STOPPING -> STOPPED -> RUNNING recoveries fit below this envelope.
    # GitHub caps one job at 360 minutes. A shared 350-minute deadline leaves
    # ten minutes for bounded error classification and retained evidence.
    timeout-minutes: 360
    env:
      INSTANCE_ID: ocid1.instance.oc1.eu-frankfurt-1.antheljtruoejaica7hj5oubnh2cctnjr7ti7llcgo6ho6wdvgvui6td7saq
      OCI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_KEY: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      OCI_REGION: ${{ secrets.OCI_CLI_REGION }}
      ORACLE_HOST: 158.180.47.161
      ORACLE_USER: ubuntu
      EXPECTED_FINGERPRINT: SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk
      SSH_KEY_ORACLE: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
      SSH_KEY_OCI: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
      SSH_KEY_VM: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
      SSH_KEY_BRIDGE: ${{ secrets.BRIDGE_SCHOOL_ORACLE_SSH_PRIVATE_KEY }}
      SSH_KEY_ORACLE_ALT: ${{ secrets.ORACLE_SSH_KEY }}
      SSH_KEY_OCI_ALT: ${{ secrets.OCI_SSH_KEY }}
      PAYLOAD: ${{ needs.validate.outputs.encoded_intake }}
      REQUEST_KEY: ${{ needs.validate.outputs.request_key }}
    steps:
      - name: Initialize one end-to-end recovery budget
        shell: bash
        run: |
          set -euo pipefail
          echo "EXECUTION_DEADLINE_EPOCH=$(( $(date +%s) + 21000 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Ensure exact Oracle instance is running
        shell: bash
        run: |
          set -euo pipefail
          budget_max() {
            local cap="$1" now remaining
            now="$(date +%s)"
            remaining=$(( EXECUTION_DEADLINE_EPOCH - now - 300 ))
            (( remaining > 0 )) || return 1
            (( remaining < cap )) && printf '%s\n' "$remaining" || printf '%s\n' "$cap"
          }
          python -m pip install --disable-pip-version-check -q oci-cli
          oci_user="$(printf '%s\n' "$OCI_USER" | sed -nE 's/^[[:space:]]*(user=)?(ocid1\.user\.[A-Za-z0-9._-]+)[[:space:]]*$/\2/p' | head -n1)"
          oci_tenancy="$(printf '%s\n' "$OCI_TENANCY" | sed -nE 's/^[[:space:]]*(tenancy=)?(ocid1\.tenancy\.[A-Za-z0-9._-]+)[[:space:]]*$/\2/p' | head -n1)"
          oci_fingerprint="$(printf '%s\n' "$OCI_FINGERPRINT" | sed -nE 's/^[[:space:]]*(fingerprint=)?([0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2}){15})[[:space:]]*$/\2/p' | head -n1)"
          [[ -n "$oci_user" && -n "$oci_tenancy" && -n "$oci_fingerprint" ]]
          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_KEY" > "$HOME/.oci/key.pem"
          chmod 0600 "$HOME/.oci/key.pem"
          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=$oci_user
          tenancy=$oci_tenancy
          fingerprint=$oci_fingerprint
          region=$OCI_REGION
          key_file=$HOME/.oci/key.pem
          EOF
          chmod 0600 "$HOME/.oci/config"
          state="$(oci compute instance get --instance-id "$INSTANCE_ID" --query 'data."lifecycle-state"' --raw-output)"
          case "$state" in
            RUNNING) ;;
            STARTING)
              oci compute instance get --instance-id "$INSTANCE_ID" --wait-for-state RUNNING --max-wait-seconds "$(budget_max 600)" >/dev/null ;;
            STOPPING)
              oci compute instance get --instance-id "$INSTANCE_ID" --wait-for-state STOPPED --max-wait-seconds "$(budget_max 600)" >/dev/null
              oci compute instance action --instance-id "$INSTANCE_ID" --action START --wait-for-state RUNNING --max-wait-seconds "$(budget_max 600)" >/dev/null ;;
            STOPPED) oci compute instance action --instance-id "$INSTANCE_ID" --action START --wait-for-state RUNNING --max-wait-seconds "$(budget_max 600)" >/dev/null ;;
            *) echo "Oracle instance is not runnable: $state" >&2; exit 1 ;;
          esac
      - name: Resolve pinned SSH transport
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          known="$RUNNER_TEMP/known_hosts"
          budget_max() {
            local cap="$1" now remaining
            now="$(date +%s)"
            remaining=$(( EXECUTION_DEADLINE_EPOCH - now - 300 ))
            (( remaining > 0 )) || return 1
            (( remaining < cap )) && printf '%s\n' "$remaining" || printf '%s\n' "$cap"
          }
          recover_instance_after_scan_loss() {
            local state
            state="$(oci compute instance get --instance-id "$INSTANCE_ID" --query 'data."lifecycle-state"' --raw-output)"
            case "$state" in
              RUNNING) sleep 10 ;;
              STARTING)
                oci compute instance get --instance-id "$INSTANCE_ID" --wait-for-state RUNNING --max-wait-seconds "$(budget_max 600)" >/dev/null ;;
              STOPPING)
                oci compute instance get --instance-id "$INSTANCE_ID" --wait-for-state STOPPED --max-wait-seconds "$(budget_max 600)" >/dev/null
                oci compute instance action --instance-id "$INSTANCE_ID" --action START --wait-for-state RUNNING --max-wait-seconds "$(budget_max 600)" >/dev/null ;;
              STOPPED)
                oci compute instance action --instance-id "$INSTANCE_ID" --action START --wait-for-state RUNNING --max-wait-seconds "$(budget_max 600)" >/dev/null ;;
              *) return 1 ;;
            esac
          }
          scan_rc=3
          for attempt in 1 2 3; do
            rm -f "$known"
            set +e
            ops/oracle_known_hosts_from_scan.sh "$ORACLE_HOST" "$EXPECTED_FINGERPRINT" "$known"
            scan_rc=$?
            set -e
            (( scan_rc == 0 )) && break
            # Only an unavailable host (exit 3) is lifecycle-retryable. A
            # fingerprint or contract failure remains immediately fail-closed.
            (( scan_rc == 3 && attempt < 3 )) || exit "$scan_rc"
            recover_instance_after_scan_loss || exit "$scan_rc"
          done
          (( scan_rc == 0 ))
          selected=''
          for name in SSH_KEY_ORACLE SSH_KEY_OCI SSH_KEY_VM SSH_KEY_BRIDGE SSH_KEY_ORACLE_ALT SSH_KEY_OCI_ALT; do
            if [[ -n "${!name:-}" ]]; then selected="$name"; break; fi
          done
          [[ -n "$selected" ]]
          key="$RUNNER_TEMP/id_oracle"
          printf '%s\n' "${!selected}" > "$key"
          chmod 0600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          echo "known=$known" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Enqueue metadata through bounded Oracle operator
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$PAYLOAD" && ${#PAYLOAD} -le 24000 ]]
          budget_max() {
            local cap="$1" now remaining
            now="$(date +%s)"
            remaining=$(( EXECUTION_DEADLINE_EPOCH - now - 300 ))
            (( remaining > 0 )) || return 1
            (( remaining < cap )) && printf '%s\n' "$remaining" || printf '%s\n' "$cap"
          }
          recover_instance_after_transport_loss() {
            local state
            state="$(oci compute instance get --instance-id "$INSTANCE_ID" --query 'data."lifecycle-state"' --raw-output)"
            case "$state" in
              RUNNING) sleep 10 ;;
              STARTING)
                oci compute instance get --instance-id "$INSTANCE_ID" --wait-for-state RUNNING --max-wait-seconds "$(budget_max 600)" >/dev/null ;;
              STOPPING)
                oci compute instance get --instance-id "$INSTANCE_ID" --wait-for-state STOPPED --max-wait-seconds "$(budget_max 600)" >/dev/null
                oci compute instance action --instance-id "$INSTANCE_ID" --action START --wait-for-state RUNNING --max-wait-seconds "$(budget_max 600)" >/dev/null ;;
              STOPPED)
                oci compute instance action --instance-id "$INSTANCE_ID" --action START --wait-for-state RUNNING --max-wait-seconds "$(budget_max 600)" >/dev/null ;;
              *) return 1 ;;
            esac
          }
          # The resident command queries REQUEST_KEY before Drive discovery and
          # only enqueues when it is still missing. The query and optional
          # enqueue share this outer STOP fence, so a lost SSH response can be
          # retried without rediscovering a changed Drive folder.
          command="sudo -n /usr/bin/flock -x /run/lock/oracle-workload-mutation.lock sudo -u ocarun sudo -n /usr/local/sbin/universal-video resume-batch-base64 '$REQUEST_KEY' '$PAYLOAD'"
          result=''; enqueue_rc=255
          for attempt in 1 2 3; do
            ssh_timeout="$(budget_max 4800)" || { enqueue_rc=124; break; }
            set +e
            result="$(timeout "$ssh_timeout" ssh -i '${{ steps.ssh.outputs.key }}' \
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=15 -o ServerAliveCountMax=2 \
              -o UserKnownHostsFile='${{ steps.ssh.outputs.known }}' -o ConnectTimeout=15 \
              "$ORACLE_USER@$ORACLE_HOST" "$command" 2>/dev/null)"
            enqueue_rc=$?
            set -e
            (( enqueue_rc == 255 && attempt < 3 )) || break
            recover_instance_after_transport_loss || break
          done
          if (( enqueue_rc != 0 )); then
            intake_code="$(sed -n 's/^UV_ERROR_CODE=//p' <<<"$result" | tail -n1)"
            if [[ -z "$intake_code" ]]; then
              intake_code="$(RESULT="$result" python - <<'PY' 2>/dev/null || true
          import json
          import os

          allowed = {"UV_BATCH_INTAKE_INVALID", "UV_BATCH_INTAKE_FAILED"}
          for line in reversed(os.environ["RESULT"].splitlines()):
              try:
                  value = json.loads(line)
              except (TypeError, ValueError):
                  continue
              if isinstance(value, dict) and value.get("error_code") in allowed:
                  print(value["error_code"])
                  break
          PY
              )"
            fi
            case "$intake_code" in
              UV_INTAKE_ROOT_UNSAFE|UV_INTAKE_INBOX_UNSAFE|UV_INTAKE_PERMISSION_DENIED|\
              UV_INTAKE_CROSS_DEVICE|UV_INTAKE_DISK_FULL|UV_INTAKE_READ_ONLY|\
              UV_INTAKE_COLLISION|UV_INTAKE_CLEANUP_FAILED|UV_INTAKE_CONTRACT_INVALID|\
              UV_INTAKE_SOURCE_UNSUPPORTED|UV_INTAKE_USAGE_INVALID|UV_INTAKE_IO_FAILED|\
              UV_INTAKE_EXECUTION_FAILED|UV_INTAKE_REJECTED|UV_BATCH_INTAKE_INVALID|\
              UV_BATCH_INTAKE_FAILED)
                echo "UV_BATCH_ERROR_CODE=$intake_code" >&2 ;;
              *) echo 'UV_BATCH_ERROR_CODE=UV_BATCH_ENQUEUE_FAILED' >&2 ;;
            esac
            exit 1
          fi
          RESULT="$result" REQUEST_KEY="$REQUEST_KEY" python - <<'PY'
          import json, os
          value=json.loads(os.environ['RESULT'].splitlines()[-1])
          assert value['schema'] in {'universal-video-batch-intake-v1','universal-video-batch-status-v1'}
          assert value['request_key']==os.environ['REQUEST_KEY']
          assert value['status'] in {'QUEUED_CANARY','RUNNING','CANARY_BLOCKED','CANARY_REVIEW','REVIEW'}
          assert 1 <= int(value['expected_count']) <= 1000
          assert value['result_mode']=='SHADOW_REVIEW_ONLY'
          assert value['canonical_promotion_allowed'] is False
          assert value['database_persistence_allowed'] is False
          print(json.dumps({
            'batch_id':value['batch_id'],
            'request_key':value['request_key'],
            'status':value['status'],
            'expected_count':value['expected_count'],
            'inventory_sha256':value['inventory_sha256'],
            'enqueue_elapsed_seconds':value.get('enqueue_elapsed_seconds'),
            'reconciled_existing':value['schema']=='universal-video-batch-status-v1',
          },sort_keys=True))
          PY
          echo 'ORACLE_UNIVERSAL_VIDEO_BATCH_INTAKE_PASS'
