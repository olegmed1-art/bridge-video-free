name: Oracle Light scoped Neon credential recovery

on:
  pull_request:
    paths:
      - '.github/workflows/oracle-light-neon-credential-recovery.yml'
      - 'ops/oracle_light_neon_recovery_runner.py'
      - 'ops/oracle_light_credential_recovery.py'
      - 'tests/test_oracle_light_credential_recovery.py'
  workflow_dispatch:
    inputs:
      main_sha:
        description: 'Exact reviewed current main SHA'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: oracle-light-backup-mutation
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: python -m unittest -q tests.test_oracle_light_credential_recovery

  recovery:
    needs: contract
    if: github.repository == 'olegmed1-art/bridge-video-free' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: database-production
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Recover Light password from stopped HOLD and restart in HOLD
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN: ${{ inputs.main_sha }}
        run: |
          set -Eeuo pipefail
          umask 077
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          [[ -n "${SSH_PRIVATE_KEY:-}" && -n "${NEON_API_KEY:-}" ]]
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$work/key"
          unset SSH_PRIVATE_KEY
          ssh-keygen -y -P '' -f "$work/key" > "$work/public" 2>/dev/null
          bash ops/oracle_known_hosts_from_scan.sh 92.5.47.149 SHA256:XBR1x74uJ41BxmDF7Y9P20GjIjNbrYXqieV4c2MC0Go "$work/known_hosts"
          python3 ops/oracle_light_neon_recovery_runner.py "$work/key" "$work/known_hosts"
