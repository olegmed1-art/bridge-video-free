name: Neon Persistence Generation Scope

on:
  pull_request:
    branches: [main]
    paths:
      - 'bridge_neon_persistence.py'
      - 'tests/test_neon_persistence_generation_scope.py'
      - '.github/workflows/neon-persistence-generation-ci.yml'
  push:
    branches: [main]
    paths:
      - 'bridge_neon_persistence.py'
      - 'tests/test_neon_persistence_generation_scope.py'
      - '.github/workflows/neon-persistence-generation-ci.yml'

permissions:
  contents: read

jobs:
  generation-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install persistence import dependency
        run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.3.4'
      - name: Compile
        run: python -m py_compile bridge_neon_persistence.py tests/test_neon_persistence_generation_scope.py
      - name: Generation selection regressions
        run: PYTHONPATH=. python tests/test_neon_persistence_generation_scope.py
