name: Autopilot Universal Video 0056 disposable Neon evidence

on:
  push:
    branches: [codex/oracle-autopilot-lite-shadow]
    paths: ['.github/workflows/autopilot-uv-0056-disposable-neon-evidence.yml']

permissions:
  contents: read

concurrency:
  group: autopilot-uv-0056-exclusive-disposable-neon
  cancel-in-progress: false

jobs:
  evidence:
    if: github.repository == 'olegmed1-art/bridge-video-free'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: database-production
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      PROJECT_ID: misty-poetry-18012774
      AUTOPILOT_TEMP_BRANCH_ID: br-still-tooth-b1ilkfcj
      INTEGRATION_TEST_HEAD: aba9527b2ab4e27a13c61dd6d1d3176595191c04
      EXPECTED_TEST_BLOB: b4573109bab7dc64c8d8f896e737a411c6f159ca
      MEDIA_EXECUTION: DISABLED
      DRIVE_WRITES: NONE
    steps:
      - name: Initialize fail-closed state
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          cat > "$RUNNER_TEMP/uv-0056-state.env" <<'EOF'
          SOURCE_GATE=UNKNOWN
          BRANCH_GATE=NOT_RUN
          APPLY_GATE=NOT_RUN
          STATE_MACHINE_GATE=NOT_RUN
          NONEMPTY_ROLLBACK_GATE=NOT_RUN
          IDEMPOTENCE_GATE=NOT_RUN
          CLEAN_ROLLBACK_GATE=NOT_RUN
          DELETE_GATE=NOT_CREATED
          CHILD_BRANCH_ID=NOT_CREATED
          ENDPOINT_HOST_SHA256=UNAVAILABLE
          MAIN_SHA=UNAVAILABLE
          MIGRATION_BLOB=UNAVAILABLE
          ROLLBACK_BLOB=UNAVAILABLE
          TEST_BLOB=UNAVAILABLE
          EOF

      - name: Checkout coordinator source with exact-history access
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Extract migration from current main and test from integration head
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$MEDIA_EXECUTION" == DISABLED ]]
          [[ "$DRIVE_WRITES" == NONE ]]
          git fetch --no-tags origin main "$INTEGRATION_TEST_HEAD"
          main_sha="$(git rev-parse origin/main)"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          install -d -m 0700 "$RUNNER_TEMP/uv-0056-source"
          git show "$main_sha:database/migrations/0056_universal_video_queue.sql" > "$RUNNER_TEMP/uv-0056-source/migration.sql"
          git show "$main_sha:database/rollbacks/0056_universal_video_queue.sql" > "$RUNNER_TEMP/uv-0056-source/rollback.sql"
          git show "$INTEGRATION_TEST_HEAD:database/tests/uv_ready_one_canary_metadata_only.sql" > "$RUNNER_TEMP/uv-0056-source/metadata-test.sql"
          migration_blob="$(git hash-object "$RUNNER_TEMP/uv-0056-source/migration.sql")"
          rollback_blob="$(git hash-object "$RUNNER_TEMP/uv-0056-source/rollback.sql")"
          test_blob="$(git hash-object "$RUNNER_TEMP/uv-0056-source/metadata-test.sql")"
          [[ "$test_blob" == "$EXPECTED_TEST_BLOB" ]]
          grep -F '0056_universal_video_queue' "$RUNNER_TEMP/uv-0056-source/migration.sql" >/dev/null
          grep -F 'VIDEO_QUEUE_ROLLBACK_REFUSES_NONEMPTY_QUEUE' "$RUNNER_TEMP/uv-0056-source/rollback.sql" >/dev/null
          grep -F "'synthetic_jobs', 2" "$RUNNER_TEMP/uv-0056-source/metadata-test.sql" >/dev/null
          grep -F "'media_execution', 'DISABLED'" "$RUNNER_TEMP/uv-0056-source/metadata-test.sql" >/dev/null
          ! grep -Eiq 'Diana|ASR|OCR|DDS3|BEN|canonical_promotion_allowed[^f]*true' "$RUNNER_TEMP/uv-0056-source/metadata-test.sql"
          sed -i "s/^MAIN_SHA=.*/MAIN_SHA=$main_sha/" "$RUNNER_TEMP/uv-0056-state.env"
          sed -i "s/^MIGRATION_BLOB=.*/MIGRATION_BLOB=$migration_blob/" "$RUNNER_TEMP/uv-0056-state.env"
          sed -i "s/^ROLLBACK_BLOB=.*/ROLLBACK_BLOB=$rollback_blob/" "$RUNNER_TEMP/uv-0056-state.env"
          sed -i "s/^TEST_BLOB=.*/TEST_BLOB=$test_blob/" "$RUNNER_TEMP/uv-0056-state.env"
          sed -i 's/^SOURCE_GATE=.*/SOURCE_GATE=PASS/' "$RUNNER_TEMP/uv-0056-state.env"
          echo "UV_0056_MAIN_SHA=$main_sha"
          echo "UV_0056_MIGRATION_BLOB=$migration_blob"
          echo "UV_0056_ROLLBACK_BLOB=$rollback_blob"
          echo "UV_0056_TEST_BLOB=$test_blob"

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client >/dev/null

      - name: Create an exclusive expiring child of the protected default branch
        id: neon
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "${NEON_API_KEY:-}" ]] || { echo 'UV_0056_NEON_API_KEY_MISSING'; exit 20; }
          api="https://console.neon.tech/api/v2/projects/$PROJECT_ID"
          auth=(-H "Authorization: Bearer $NEON_API_KEY" -H 'Accept: application/json')
          branches_json="$(curl -fsS --retry 2 --retry-all-errors --max-time 20 "${auth[@]}" "$api/branches")"
          parent_id="$(jq -er '[.branches[] | select(.default == true)] | if length == 1 then .[0].id else error("default branch not unique") end' <<<"$branches_json")"
          [[ "$parent_id" =~ ^br-[a-z0-9-]+$ ]]
          [[ "$parent_id" != "$AUTOPILOT_TEMP_BRANCH_ID" ]]
          branch_name="uv-0056-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          expires_at="$(date -u -d '+4 hours' '+%Y-%m-%dT%H:%M:%SZ')"
          request="$RUNNER_TEMP/uv-0056-create.json"
          response="$RUNNER_TEMP/uv-0056-create-response.json"
          jq -n --arg name "$branch_name" --arg parent "$parent_id" --arg expires "$expires_at" \
            '{branch:{name:$name,parent_id:$parent,expires_at:$expires},endpoints:[{type:"read_write"}]}' > "$request"
          code="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            --request POST "$api/branches" "${auth[@]}" -H 'Content-Type: application/json' --data-binary "@$request")"
          rm -f "$request"
          [[ "$code" == 200 || "$code" == 201 ]] || { rm -f "$response"; echo 'UV_0056_BRANCH_CREATE_FAILED'; exit 21; }
          child_id="$(jq -er '.branch.id' "$response")"
          child_parent="$(jq -er '.branch.parent_id' "$response")"
          endpoint_host="$(jq -er '[.endpoints[] | select(.type == "read_write") | .host][0]' "$response")"
          rm -f "$response"
          [[ "$child_id" =~ ^br-[a-z0-9-]+$ ]]
          [[ "$child_id" != "$parent_id" && "$child_id" != "$AUTOPILOT_TEMP_BRANCH_ID" ]]
          [[ "$child_parent" == "$parent_id" ]]
          [[ "$endpoint_host" =~ ^ep-[a-z0-9-]+\..+\.neon\.tech$ ]]
          endpoint_hash="$(printf '%s' "$endpoint_host" | sha256sum | cut -d' ' -f1)"
          printf '%s' "$child_id" > "$RUNNER_TEMP/uv-0056-child-id"
          printf '%s' "$endpoint_host" > "$RUNNER_TEMP/uv-0056-endpoint-host"
          sed -i "s/^CHILD_BRANCH_ID=.*/CHILD_BRANCH_ID=$child_id/" "$RUNNER_TEMP/uv-0056-state.env"
          sed -i "s/^ENDPOINT_HOST_SHA256=.*/ENDPOINT_HOST_SHA256=$endpoint_hash/" "$RUNNER_TEMP/uv-0056-state.env"
          sed -i 's/^BRANCH_GATE=.*/BRANCH_GATE=PASS/' "$RUNNER_TEMP/uv-0056-state.env"
          echo "parent_id=$parent_id" >> "$GITHUB_OUTPUT"
          echo "child_id=$child_id" >> "$GITHUB_OUTPUT"
          echo "endpoint_host=$endpoint_host" >> "$GITHUB_OUTPUT"
          echo 'UV_0056_PRODUCTION_BRANCH_MUTATED=NO'
          echo 'UV_0056_DISPOSABLE_BRANCH_CREATED=PASS'

      - name: Resolve a child-only owner URI
        id: database
        shell: bash
        run: |
          set -Eeuo pipefail
          api="https://console.neon.tech/api/v2/projects/$PROJECT_ID"
          auth=(-H "Authorization: Bearer $NEON_API_KEY" -H 'Accept: application/json')
          child_id="${{ steps.neon.outputs.child_id }}"
          roles_json="$(curl -fsS --retry 2 --retry-all-errors --max-time 20 "${auth[@]}" "$api/branches/$child_id/roles")"
          role="$(jq -er '[.roles[].name | select(. == "neondb_owner")] | if length == 1 then .[0] else error("neondb_owner missing") end' <<<"$roles_json")"
          uri_json="$(curl -fsS --retry 2 --retry-all-errors --max-time 20 "${auth[@]}" \
            "$api/connection_uri?branch_id=$child_id&database_name=neondb&role_name=$role&pooled=false")"
          uri="$(jq -er '.uri' <<<"$uri_json")"
          URI="$uri" CHILD_ID="$child_id" EXPECTED_HOST="${{ steps.neon.outputs.endpoint_host }}" ROLE="$role" python3 - <<'PY'
          import os, urllib.parse
          p=urllib.parse.urlsplit(os.environ['URI'])
          assert p.scheme in {'postgres','postgresql'}
          assert p.username == os.environ['ROLE']
          assert (p.hostname or '').lower() == os.environ['EXPECTED_HOST'].lower()
          assert p.path.lstrip('/') == 'neondb'
          print(f"::add-mask::{os.environ['URI']}")
          PY
          printf '%s' "$uri" > "$RUNNER_TEMP/uv-0056-database-url"
          chmod 0600 "$RUNNER_TEMP/uv-0056-database-url"
          echo 'UV_0056_CHILD_CONNECTION_VERIFIED=PASS'

      - name: Wait for child compute and prove clean prestate
        shell: bash
        run: |
          set -Eeuo pipefail
          database_url="$(cat "$RUNNER_TEMP/uv-0056-database-url")"
          ready=0
          for _ in $(seq 1 40); do
            if psql "$database_url" -X -A -t -v ON_ERROR_STOP=1 -c 'SELECT 1' >/dev/null 2>&1; then ready=1; break; fi
            sleep 3
          done
          [[ "$ready" == 1 ]] || { echo 'UV_0056_CHILD_COMPUTE_NOT_READY'; exit 22; }
          pre="$(psql "$database_url" -X -A -t -F '|' -v ON_ERROR_STOP=1 <<'SQL'
          SELECT current_database(),
                 to_regnamespace('video_queue') IS NULL,
                 NOT EXISTS (SELECT 1 FROM public.schema_migration WHERE migration_key='0056_universal_video_queue');
          SQL
          )"
          [[ "$pre" == 'neondb|t|t' ]] || { echo 'UV_0056_PRESTATE_NOT_CLEAN'; exit 23; }
          echo 'UV_0056_CLEAN_PRESTATE=PASS'

      - name: Apply migration 0056 and verify contract
        shell: bash
        run: |
          set -Eeuo pipefail
          database_url="$(cat "$RUNNER_TEMP/uv-0056-database-url")"
          psql "$database_url" -X -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/uv-0056-source/migration.sql" > "$RUNNER_TEMP/uv-0056-apply.log"
          result="$(psql "$database_url" -X -A -t -F '|' -v ON_ERROR_STOP=1 <<'SQL'
          SELECT
            (SELECT count(*) FROM public.schema_migration WHERE migration_key='0056_universal_video_queue'),
            to_regclass('video_queue.batch') IS NOT NULL,
            to_regclass('video_queue.job') IS NOT NULL,
            to_regclass('video_queue.job_event') IS NOT NULL,
            to_regclass('video_queue.batch_status') IS NOT NULL,
            to_regclass('video_queue.job_status') IS NOT NULL,
            to_regprocedure('video_queue.enqueue_drive_batch(text,text,text,text,text,text,text,text,jsonb)') IS NOT NULL,
            to_regprocedure('video_queue.claim_job(text,integer,text,text)') IS NOT NULL,
            to_regprocedure('video_queue.heartbeat_job(uuid,uuid,text,integer)') IS NOT NULL,
            to_regprocedure('video_queue.retry_job(uuid,uuid,text,text,integer,integer)') IS NOT NULL,
            to_regprocedure('video_queue.finish_job(uuid,uuid,text,text,jsonb,text)') IS NOT NULL,
            NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema='video_queue' AND (data_type='bytea' OR udt_name IN ('bytea','oid'))),
            NOT has_schema_privilege('public','video_queue','USAGE');
          SQL
          )"
          [[ "$result" == '1|t|t|t|t|t|t|t|t|t|t|t|t' ]]
          sed -i 's/^APPLY_GATE=.*/APPLY_GATE=PASS/' "$RUNNER_TEMP/uv-0056-state.env"
          echo 'UV_0056_APPLY_AND_SCHEMA_GATE=PASS'

      - name: Run the two-job metadata-only state machine
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$MEDIA_EXECUTION" == DISABLED && "$DRIVE_WRITES" == NONE ]]
          database_url="$(cat "$RUNNER_TEMP/uv-0056-database-url")"
          psql "$database_url" -X -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/uv-0056-source/metadata-test.sql" | tee "$RUNNER_TEMP/uv-0056-metadata.log"
          grep -F 'UV_QUEUE_METADATA_ONLY' "$RUNNER_TEMP/uv-0056-metadata.log" >/dev/null
          terminal="$(psql "$database_url" -X -A -t -F '|' -v ON_ERROR_STOP=1 <<'SQL'
          SELECT count(*),
                 count(*) FILTER (WHERE status='REVIEW_READY'),
                 count(*) FILTER (WHERE status IN ('PENDING_CANARY','QUEUED','LEASED')),
                 bool_and(output->>'publication_state'='NOT_PUBLISHED'),
                 bool_and(output->'canonical_promotion_allowed'='false'::jsonb),
                 bool_and(output->'database_persistence_allowed'='false'::jsonb)
          FROM video_queue.job;
          SQL
          )"
          [[ "$terminal" == '2|2|0|t|t|t' ]]
          sed -i 's/^STATE_MACHINE_GATE=.*/STATE_MACHINE_GATE=PASS/' "$RUNNER_TEMP/uv-0056-state.env"
          echo 'UV_0056_METADATA_ONLY_STATE_MACHINE=PASS'

      - name: Prove rollback refuses a non-empty queue
        shell: bash
        run: |
          set -Eeuo pipefail
          database_url="$(cat "$RUNNER_TEMP/uv-0056-database-url")"
          set +e
          psql "$database_url" -X -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/uv-0056-source/rollback.sql" > "$RUNNER_TEMP/uv-0056-nonempty-rollback.log" 2>&1
          rc=$?
          set -e
          [[ "$rc" -ne 0 ]]
          grep -F 'VIDEO_QUEUE_ROLLBACK_REFUSES_NONEMPTY_QUEUE' "$RUNNER_TEMP/uv-0056-nonempty-rollback.log" >/dev/null
          [[ "$(psql "$database_url" -X -A -t -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM public.schema_migration WHERE migration_key='0056_universal_video_queue';")" == 1 ]]
          sed -i 's/^NONEMPTY_ROLLBACK_GATE=.*/NONEMPTY_ROLLBACK_GATE=PASS/' "$RUNNER_TEMP/uv-0056-state.env"
          echo 'UV_0056_NONEMPTY_ROLLBACK_REFUSAL=PASS'

      - name: Prove clean rollback and migration idempotence
        shell: bash
        run: |
          set -Eeuo pipefail
          database_url="$(cat "$RUNNER_TEMP/uv-0056-database-url")"
          psql "$database_url" -X -v ON_ERROR_STOP=1 -c 'TRUNCATE video_queue.job_event, video_queue.job, video_queue.batch RESTART IDENTITY CASCADE;' >/dev/null
          psql "$database_url" -X -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/uv-0056-source/rollback.sql" >/dev/null
          absent="$(psql "$database_url" -X -A -t -F '|' -v ON_ERROR_STOP=1 <<'SQL'
          SELECT to_regnamespace('video_queue') IS NULL,
                 NOT EXISTS (SELECT 1 FROM public.schema_migration WHERE migration_key='0056_universal_video_queue');
          SQL
          )"
          [[ "$absent" == 't|t' ]]
          psql "$database_url" -X -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/uv-0056-source/migration.sql" >/dev/null
          psql "$database_url" -X -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/uv-0056-source/migration.sql" >/dev/null
          [[ "$(psql "$database_url" -X -A -t -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM public.schema_migration WHERE migration_key='0056_universal_video_queue';")" == 1 ]]
          sed -i 's/^IDEMPOTENCE_GATE=.*/IDEMPOTENCE_GATE=PASS/' "$RUNNER_TEMP/uv-0056-state.env"
          psql "$database_url" -X -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/uv-0056-source/rollback.sql" >/dev/null
          final="$(psql "$database_url" -X -A -t -F '|' -v ON_ERROR_STOP=1 <<'SQL'
          SELECT to_regnamespace('video_queue') IS NULL,
                 NOT EXISTS (SELECT 1 FROM public.schema_migration WHERE migration_key='0056_universal_video_queue');
          SQL
          )"
          [[ "$final" == 't|t' ]]
          sed -i 's/^CLEAN_ROLLBACK_GATE=.*/CLEAN_ROLLBACK_GATE=PASS/' "$RUNNER_TEMP/uv-0056-state.env"
          echo 'UV_0056_IDEMPOTENCE_AND_CLEAN_ROLLBACK=PASS'

      - name: Delete disposable Neon branch
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! -s "$RUNNER_TEMP/uv-0056-child-id" ]]; then
            exit 0
          fi
          child_id="$(cat "$RUNNER_TEMP/uv-0056-child-id")"
          [[ "$child_id" =~ ^br-[a-z0-9-]+$ ]]
          [[ "$child_id" != "$AUTOPILOT_TEMP_BRANCH_ID" ]]
          api="https://console.neon.tech/api/v2/projects/$PROJECT_ID"
          response="$RUNNER_TEMP/uv-0056-delete.json"
          code="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' --request DELETE \
            "$api/branches/$child_id" -H "Authorization: Bearer $NEON_API_KEY" -H 'Accept: application/json')"
          rm -f "$response" "$RUNNER_TEMP/uv-0056-database-url"
          [[ "$code" == 200 || "$code" == 202 ]]
          sed -i 's/^DELETE_GATE=.*/DELETE_GATE=PASS/' "$RUNNER_TEMP/uv-0056-state.env"
          echo 'UV_0056_DISPOSABLE_BRANCH_DELETE=PASS'

      - name: Build retained secret-free receipt
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$RUNNER_TEMP/uv-0056-state.env"
          result='FAIL'
          [[ "$SOURCE_GATE" == PASS && "$BRANCH_GATE" == PASS && "$APPLY_GATE" == PASS && "$STATE_MACHINE_GATE" == PASS && "$NONEMPTY_ROLLBACK_GATE" == PASS && "$IDEMPOTENCE_GATE" == PASS && "$CLEAN_ROLLBACK_GATE" == PASS && "$DELETE_GATE" == PASS ]] && result='PASS'
          jq -n \
            --arg gate 'UV_0056_DISPOSABLE_NEON_EVIDENCE' \
            --arg result "$result" \
            --arg workflow_head "$GITHUB_SHA" \
            --arg main_sha "$MAIN_SHA" \
            --arg integration_test_head "$INTEGRATION_TEST_HEAD" \
            --arg migration_blob "$MIGRATION_BLOB" \
            --arg rollback_blob "$ROLLBACK_BLOB" \
            --arg test_blob "$TEST_BLOB" \
            --arg child_branch_id "$CHILD_BRANCH_ID" \
            --arg endpoint_host_sha256 "$ENDPOINT_HOST_SHA256" \
            --arg source_gate "$SOURCE_GATE" \
            --arg branch_gate "$BRANCH_GATE" \
            --arg apply_gate "$APPLY_GATE" \
            --arg state_machine_gate "$STATE_MACHINE_GATE" \
            --arg nonempty_rollback_gate "$NONEMPTY_ROLLBACK_GATE" \
            --arg idempotence_gate "$IDEMPOTENCE_GATE" \
            --arg clean_rollback_gate "$CLEAN_ROLLBACK_GATE" \
            --arg delete_gate "$DELETE_GATE" \
            '{gate:$gate,result:$result,workflow_head:$workflow_head,main_sha:$main_sha,integration_test_head:$integration_test_head,migration_blob:$migration_blob,rollback_blob:$rollback_blob,test_blob:$test_blob,disposable_branch_id:$child_branch_id,endpoint_host_sha256:$endpoint_host_sha256,source_gate:$source_gate,branch_gate:$branch_gate,apply_gate:$apply_gate,state_machine_gate:$state_machine_gate,nonempty_rollback_gate:$nonempty_rollback_gate,idempotence_gate:$idempotence_gate,clean_rollback_gate:$clean_rollback_gate,delete_gate:$delete_gate,synthetic_jobs:2,media_execution:"DISABLED",drive_writes:"NONE",production_branch_mutated:false,autopilot_temp_branch_mutated:false,publication_state:"NOT_PUBLISHED",canonical_promotion_allowed:false,database_persistence_allowed:false}' > uv-0056-disposable-neon-receipt.json
          cat uv-0056-disposable-neon-receipt.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload retained receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: uv-0056-disposable-neon-${{ github.run_id }}-${{ github.run_attempt }}
          path: uv-0056-disposable-neon-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce terminal evidence gate
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -e '.result == "PASS" and .synthetic_jobs == 2 and .media_execution == "DISABLED" and .drive_writes == "NONE" and .production_branch_mutated == false and .autopilot_temp_branch_mutated == false and .delete_gate == "PASS" and .canonical_promotion_allowed == false and .database_persistence_allowed == false' uv-0056-disposable-neon-receipt.json >/dev/null
          echo 'UV_0056_DISPOSABLE_NEON_EVIDENCE=PASS'
