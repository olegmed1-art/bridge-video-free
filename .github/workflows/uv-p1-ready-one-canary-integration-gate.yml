name: Universal Video P1 READY_FOR_ONE_CANARY integration gate

on:
  push:
    branches: [autopilot/uv-ready-one-canary-20260901]
    paths:
      - '.github/workflows/uv-p1-ready-one-canary-integration-gate.yml'
      - 'database/migrations/0056_universal_video_queue.sql'
      - 'database/rollbacks/0056_universal_video_queue.sql'
      - 'database/tests/uv_ready_one_canary_metadata_only.sql'
      - 'ops/oracle_idle_state.sh'
      - 'tests/test_oracle_idle_stop_guard.py'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: write
  checks: read

concurrency:
  group: uv-p1-ready-one-canary-integration-gate
  cancel-in-progress: false

jobs:
  integrate:
    if: github.repository == 'olegmed1-art/bridge-video-free'
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    environment: database-production
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: olegmed1-art/bridge-video-free
      PROJECT_ID: misty-poetry-18012774
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_API_TOKEN: ${{ secrets.NEON_API_TOKEN }}
      NEON_TOKEN: ${{ secrets.NEON_TOKEN }}
      NEON_PROJECT_API_KEY: ${{ secrets.NEON_PROJECT_API_KEY }}
    steps:
      - name: Checkout exact integration source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Initialize bounded state
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          printf '%s\n' 'UV_INTEGRATION_STATE=STARTED' > "$RUNNER_TEMP/uv-integration-state"
          printf '%s\n' 'UV_TEMP_BRANCH=NOT_CREATED' > "$RUNNER_TEMP/uv-temp-branch-state"
          printf '%s\n' 'UV_TEMP_BRANCH_DELETE=NOT_CREATED' > "$RUNNER_TEMP/uv-temp-delete-state"

      - name: Resolve current exact heads
        id: refs
        shell: bash
        run: |
          set -Eeuo pipefail
          api="https://api.github.com/repos/$REPOSITORY"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json')
          for spec in runtime:997 intake:1000 integration:1047; do
            lane="${spec%%:*}"; pr="${spec##*:}"
            value="$(curl -fsS --retry 2 --retry-all-errors --max-time 20 "${auth[@]}" "$api/pulls/$pr")"
            jq -e '.state == "open" and .draft == true' <<<"$value" >/dev/null
            sha="$(jq -er '.head.sha' <<<"$value")"
            branch="$(jq -er '.head.ref' <<<"$value")"
            [[ "$sha" =~ ^[0-9a-f]{40}$ && "$branch" =~ ^[A-Za-z0-9._/-]{1,240}$ ]]
            echo "${lane}_sha=$sha" >> "$GITHUB_OUTPUT"
            echo "${lane}_branch=$branch" >> "$GITHUB_OUTPUT"
          done
          [[ "${{ github.sha }}" == "$(jq -er '.head.sha' <<<"$(curl -fsS "${auth[@]}" "$api/pulls/1047")")" ]]
          main_sha="$(curl -fsS --retry 2 --retry-all-errors --max-time 20 "${auth[@]}" "$api/commits/main" | jq -er '.sha')"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo 'UV_INTEGRATION_EXACT_REFS=PASS'

      - name: Wait for exact runtime and intake receipts
        id: receipts
        env:
          RUNTIME_SHA: ${{ steps.refs.outputs.runtime_sha }}
          INTAKE_SHA: ${{ steps.refs.outputs.intake_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          api="https://api.github.com/repos/$REPOSITORY"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json')
          runtime=0; intake=0
          for _ in $(seq 1 75); do
            comments="$(curl -fsS --retry 2 --retry-all-errors --max-time 20 "${auth[@]}" "$api/issues/946/comments?per_page=100")"
            runtime="$(jq --arg sha "$RUNTIME_SHA" '[.[] | .body as $b | select(($b|contains("RUNTIME_READY_FOR_SYNTHETIC")) and ($b|contains($sha)) and ($b|contains("container activation: **NO**")) and ($b|contains("real media execution: **NO**")))] | length' <<<"$comments")"
            intake="$(jq --arg sha "$INTAKE_SHA" '[.[] | .body as $b | select(($b|contains("EVIDENCE_READY_FOR_SYNTHETIC")) and ($b|contains($sha)) and ($b|contains("real Drive contact: **NO**")) and ($b|contains("real media execution")))] | length' <<<"$comments")"
            if (( runtime > 0 && intake > 0 )); then break; fi
            sleep 60
          done
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
          echo "intake=$intake" >> "$GITHUB_OUTPUT"
          if (( runtime == 0 || intake == 0 )); then
            printf '%s\n' 'UV_INTEGRATION_STATE=WAITING_EXACT_RECEIPTS' > "$RUNNER_TEMP/uv-integration-state"
            body=$(cat <<EOF
          ## Universal Video integration — WAITING_EXTERNAL

          - runtime exact head: \`$RUNTIME_SHA\`; exact receipt count: \`$runtime\`
          - intake exact head: \`$INTAKE_SHA\`; exact receipt count: \`$intake\`
          - migration 0056: **NOT APPLIED**
          - disposable Neon branch: **NOT CREATED**
          - media / Drive / production / merge / Oracle lifecycle: **NO**

          Integration remains fail-closed until both exact-head receipts exist. No Director continuation command is required by the task contract.
          EOF
            )
            gh api "repos/$REPOSITORY/issues/946/comments" --method POST -f body="$body" >/dev/null
            exit 78
          fi
          echo 'UV_INTEGRATION_INPUT_RECEIPTS=PASS'

      - name: Verify exact integration CI, review, and idle-guard tests
        id: safety
        shell: bash
        run: |
          set -Eeuo pipefail
          owner="${REPOSITORY%%/*}"; repo="${REPOSITORY##*/}"
          head="${{ steps.refs.outputs.integration_sha }}"
          checks="$(gh api "repos/$REPOSITORY/commits/$head/check-runs?per_page=100")"
          total="$(jq '.total_count' <<<"$checks")"
          pending="$(jq '[.check_runs[] | select(.status != "completed")] | length' <<<"$checks")"
          bad="$(jq '[.check_runs[] | select(.status == "completed" and (.conclusion | IN("success","neutral","skipped") | not))] | length' <<<"$checks")"
          (( total > 0 && pending == 0 && bad == 0 )) || {
            printf '%s\n' 'UV_INTEGRATION_STATE=WAITING_INTEGRATION_CI' > "$RUNNER_TEMP/uv-integration-state"
            exit 79
          }
          graphql=$(cat <<'GRAPHQL'
          query($owner:String!,$repo:String!,$number:Int!){
            repository(owner:$owner,name:$repo){
              pullRequest(number:$number){
                reviewThreads(first:100){nodes{isResolved}}
                reviews(last:50){nodes{state commit{oid} author{login}}}
              }
            }
          }
          GRAPHQL
          )
          reviews="$(gh api graphql -f query="$graphql" -F owner="$owner" -F repo="$repo" -F number=1047)"
          unresolved="$(jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length' <<<"$reviews")"
          exact_reviews="$(jq --arg head "$head" '[.data.repository.pullRequest.reviews.nodes[] | select(.commit.oid == $head and (.author.login != "olegmed1-art") and (.state == "COMMENTED" or .state == "APPROVED"))] | length' <<<"$reviews")"
          (( unresolved == 0 && exact_reviews > 0 )) || {
            printf '%s\n' 'UV_INTEGRATION_STATE=WAITING_INTEGRATION_REVIEW' > "$RUNNER_TEMP/uv-integration-state"
            exit 80
          }
          python -m pip install --disable-pip-version-check -q pytest
          test_files=()
          [[ -f tests/test_oracle_idle_stop_guard.py ]] && test_files+=(tests/test_oracle_idle_stop_guard.py)
          [[ -f tests/test_oracle_idle_state.py ]] && test_files+=(tests/test_oracle_idle_state.py)
          (( ${#test_files[@]} >= 1 ))
          python -m pytest -q "${test_files[@]}" | tee "$RUNNER_TEMP/idle-tests.log"
          bash -n ops/oracle_idle_state.sh
          grep -q 'UNKNOWN' ops/oracle_idle_state.sh
          grep -q 'PENDING_CANARY' ops/oracle_idle_state.sh
          grep -q 'QUEUED' ops/oracle_idle_state.sh
          grep -q 'LEASED' ops/oracle_idle_state.sh
          grep -qi 'spool' ops/oracle_idle_state.sh
          grep -qi 'operator' ops/oracle_idle_state.sh
          grep -Rqs 'UNKNOWN.*STOP\|STOP.*UNKNOWN\|stop_guard' tests/test_oracle_idle_stop_guard.py tests/test_oracle_idle_state.py 2>/dev/null
          echo 'UV_IDLE_GUARD_EXACT_HEAD=PASS'
          echo 'ORACLE_STOP_CALLED=NO'

      - name: Resolve a Neon API credential without exposing it
        id: credential
        shell: bash
        run: |
          set -Eeuo pipefail
          selected=''
          for name in NEON_API_KEY NEON_API_TOKEN NEON_TOKEN NEON_PROJECT_API_KEY; do
            value="${!name:-}"
            [[ -n "$value" ]] || continue
            echo "::add-mask::$value"
            [[ -z "$selected" ]] || { echo 'UV_NEON_MULTIPLE_API_CREDENTIALS'; exit 81; }
            selected="$value"
          done
          if [[ -z "$selected" ]]; then
            printf '%s\n' 'UV_INTEGRATION_STATE=WAITING_NEON_API_CREDENTIAL' > "$RUNNER_TEMP/uv-integration-state"
            echo 'UV_NEON_API_CREDENTIAL=UNAVAILABLE'
            exit 82
          fi
          printf '%s' "$selected" > "$RUNNER_TEMP/neon-api-key"
          chmod 0600 "$RUNNER_TEMP/neon-api-key"
          echo 'UV_NEON_API_CREDENTIAL=AVAILABLE'

      - name: Create one exclusive expiring disposable Neon branch
        id: branch
        shell: bash
        run: |
          set -Eeuo pipefail
          api_key="$(cat "$RUNNER_TEMP/neon-api-key")"
          api="https://console.neon.tech/api/v2/projects/$PROJECT_ID"
          auth=(-H "Authorization: Bearer $api_key" -H 'Accept: application/json')
          project="$(curl -fsS --retry 2 --retry-all-errors --max-time 20 "${auth[@]}" "https://console.neon.tech/api/v2/projects/$PROJECT_ID")"
          default_branch="$(jq -er '.project.default_branch_id' <<<"$project")"
          [[ "$default_branch" =~ ^br-[a-z0-9-]+$ ]]
          name="uv-p1-one-canary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          expires="$(date -u -d '+3 hours' '+%Y-%m-%dT%H:%M:%SZ')"
          request="$RUNNER_TEMP/create-branch.json"
          response="$RUNNER_TEMP/create-branch-response.json"
          jq -n --arg name "$name" --arg parent "$default_branch" --arg expires "$expires" \
            '{branch:{name:$name,parent_id:$parent,expires_at:$expires},endpoints:[{type:"read_write"}]}' > "$request"
          code="$(curl -sS --output "$response" --write-out '%{http_code}' --request POST "$api/branches" \
            "${auth[@]}" -H 'Content-Type: application/json' --data-binary "@$request")"
          rm -f "$request"
          [[ "$code" == 200 || "$code" == 201 ]]
          branch_id="$(jq -er '.branch.id' "$response")"
          parent_id="$(jq -er '.branch.parent_id' "$response")"
          endpoint_id="$(jq -er '[.endpoints[] | select(.type=="read_write") | .id][0]' "$response")"
          [[ "$branch_id" =~ ^br-[a-z0-9-]+$ && "$endpoint_id" =~ ^ep-[a-z0-9-]+$ ]]
          [[ "$branch_id" != "$default_branch" && "$parent_id" == "$default_branch" ]]
          printf '%s' "$branch_id" > "$RUNNER_TEMP/branch-id"
          printf '%s' "$endpoint_id" > "$RUNNER_TEMP/endpoint-id"
          printf 'UV_TEMP_BRANCH=%s\n' "$branch_id" > "$RUNNER_TEMP/uv-temp-branch-state"
          echo "branch_id=$branch_id" >> "$GITHUB_OUTPUT"
          echo "parent_id=$parent_id" >> "$GITHUB_OUTPUT"
          echo "endpoint_id=$endpoint_id" >> "$GITHUB_OUTPUT"
          rm -f "$response"
          echo 'UV_DISPOSABLE_NEON_BRANCH=PASS'
          echo 'PRODUCTION_BRANCH_CONNECTED=NO'

      - name: Resolve a child-only connection URI
        id: uri
        shell: bash
        run: |
          set -Eeuo pipefail
          api_key="$(cat "$RUNNER_TEMP/neon-api-key")"
          branch_id="$(cat "$RUNNER_TEMP/branch-id")"
          api="https://console.neon.tech/api/v2/projects/$PROJECT_ID"
          auth=(-H "Authorization: Bearer $api_key" -H 'Accept: application/json')
          roles="$(curl -fsS --retry 2 --retry-all-errors --max-time 20 "${auth[@]}" "$api/branches/$branch_id/roles")"
          role="$(jq -er '[.roles[].name | select(test("owner$"))][0] // .roles[0].name' <<<"$roles")"
          [[ "$role" =~ ^[A-Za-z0-9_]+$ ]]
          uri_response="$(curl -fsS --retry 2 --retry-all-errors --max-time 20 "${auth[@]}" \
            "$api/connection_uri?branch_id=$branch_id&database_name=neondb&role_name=$role&pooled=false")"
          uri="$(jq -er '.uri' <<<"$uri_response")"
          echo "::add-mask::$uri"
          URI="$uri" ENDPOINT="$(cat "$RUNNER_TEMP/endpoint-id")" python3 - <<'PY'
          import os, urllib.parse
          p=urllib.parse.urlsplit(os.environ['URI'])
          host=(p.hostname or '').lower(); endpoint=os.environ['ENDPOINT']
          assert p.scheme in {'postgres','postgresql'}
          assert host.startswith(endpoint + '.') and host.endswith('.neon.tech')
          assert (p.path.lstrip('/') or 'neondb') == 'neondb'
          PY
          printf '%s' "$uri" > "$RUNNER_TEMP/database-url"
          chmod 0600 "$RUNNER_TEMP/database-url"
          echo 'UV_DISPOSABLE_NEON_URI=PASS'

      - name: Verify clean prestate and exact migration blobs
        shell: bash
        run: |
          set -Eeuo pipefail
          db="$(cat "$RUNNER_TEMP/database-url")"
          migration_blob="$(git hash-object database/migrations/0056_universal_video_queue.sql)"
          rollback_blob="$(git hash-object database/rollbacks/0056_universal_video_queue.sql)"
          test_blob="$(git hash-object database/tests/uv_ready_one_canary_metadata_only.sql)"
          [[ "$migration_blob" == 2093628baa90d091ddc2f0a214800f5204d1fc79 ]]
          [[ "$rollback_blob" == 09ffcb3e1fdd03b164eefb5ff9066ef103acbcfd ]]
          [[ "$test_blob" == b4573109bab7dc64c8d8f896e737a411c6f159ca ]]
          pre="$(psql "$db" -X -A -t -F '|' -v ON_ERROR_STOP=1 <<'SQL'
          SELECT current_database(),
                 to_regnamespace('video_queue') IS NULL,
                 NOT EXISTS(SELECT 1 FROM public.schema_migration WHERE migration_key='0056_universal_video_queue');
          SQL
          )"
          [[ "$pre" == neondb'|'t'|'t ]]
          echo 'UV_DISPOSABLE_NEON_PRESTATE=PASS'

      - name: Apply 0056 and run one metadata-only synthetic state-machine cycle
        shell: bash
        run: |
          set -Eeuo pipefail
          db="$(cat "$RUNNER_TEMP/database-url")"
          psql "$db" -X -v ON_ERROR_STOP=1 -f database/migrations/0056_universal_video_queue.sql > "$RUNNER_TEMP/apply.log" 2>&1
          psql "$db" -X -v ON_ERROR_STOP=1 -f database/tests/uv_ready_one_canary_metadata_only.sql > "$RUNNER_TEMP/cycle.log" 2>&1
          grep -F 'UV_QUEUE_METADATA_ONLY' "$RUNNER_TEMP/cycle.log" >/dev/null
          echo 'UV_MIGRATION_0056_TEMP_ONLY=PASS'
          echo 'UV_METADATA_ONLY_SYNTHETIC_CYCLE=PASS'
          echo 'MEDIA_EXECUTION=DISABLED'
          echo 'DRIVE_WRITE=NONE'
          echo 'CANONICAL_PROMOTION_ALLOWED=FALSE'

      - name: Prove rollback refusal and clean reversible end state
        shell: bash
        run: |
          set -Eeuo pipefail
          db="$(cat "$RUNNER_TEMP/database-url")"
          set +e
          psql "$db" -X -v ON_ERROR_STOP=1 -f database/rollbacks/0056_universal_video_queue.sql > "$RUNNER_TEMP/rollback-nonempty.log" 2>&1
          rc=$?
          set -e
          (( rc != 0 ))
          grep -F 'VIDEO_QUEUE_ROLLBACK_REFUSES_NONEMPTY_QUEUE' "$RUNNER_TEMP/rollback-nonempty.log" >/dev/null
          psql "$db" -X -v ON_ERROR_STOP=1 >/dev/null <<'SQL'
          TRUNCATE video_queue.job_event, video_queue.job, video_queue.batch RESTART IDENTITY CASCADE;
          SQL
          psql "$db" -X -v ON_ERROR_STOP=1 -f database/rollbacks/0056_universal_video_queue.sql >/dev/null
          final="$(psql "$db" -X -A -t -F '|' -v ON_ERROR_STOP=1 <<'SQL'
          SELECT to_regnamespace('video_queue') IS NULL,
                 NOT EXISTS(SELECT 1 FROM public.schema_migration WHERE migration_key='0056_universal_video_queue');
          SQL
          )"
          [[ "$final" == t'|'t ]]
          printf '%s\n' 'UV_INTEGRATION_STATE=PASS' > "$RUNNER_TEMP/uv-integration-state"
          echo 'UV_ROLLBACK_NONEMPTY_REFUSAL=PASS'
          echo 'UV_ROLLBACK_CLEAN=PASS'

      - name: Delete disposable branch
        if: always()
        id: cleanup
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -s "$RUNNER_TEMP/branch-id" && -s "$RUNNER_TEMP/neon-api-key" ]] || exit 0
          branch_id="$(cat "$RUNNER_TEMP/branch-id")"
          api_key="$(cat "$RUNNER_TEMP/neon-api-key")"
          code="$(curl -sS --output "$RUNNER_TEMP/delete.json" --write-out '%{http_code}' --request DELETE \
            "https://console.neon.tech/api/v2/projects/$PROJECT_ID/branches/$branch_id" \
            -H "Authorization: Bearer $api_key" -H 'Accept: application/json')"
          rm -f "$RUNNER_TEMP/delete.json"
          [[ "$code" == 200 || "$code" == 202 ]]
          printf '%s\n' 'UV_TEMP_BRANCH_DELETE=PASS' > "$RUNNER_TEMP/uv-temp-delete-state"
          echo 'UV_DISPOSABLE_NEON_DELETE=PASS'

      - name: Publish unified verdict
        if: always()
        env:
          MAIN_SHA: ${{ steps.refs.outputs.main_sha }}
          RUNTIME_SHA: ${{ steps.refs.outputs.runtime_sha }}
          INTAKE_SHA: ${{ steps.refs.outputs.intake_sha }}
          INTEGRATION_SHA: ${{ steps.refs.outputs.integration_sha }}
          BRANCH_ID: ${{ steps.branch.outputs.branch_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          state="$(cut -d= -f2- "$RUNNER_TEMP/uv-integration-state" 2>/dev/null || echo UNKNOWN)"
          delete_state="$(cut -d= -f2- "$RUNNER_TEMP/uv-temp-delete-state" 2>/dev/null || echo UNKNOWN)"
          verdict=BLOCKED
          [[ "$state" == PASS && "$delete_state" == PASS ]] && verdict=READY_FOR_ONE_CANARY
          body=$(cat <<EOF
          ## Universal Video P1 unified integration receipt

          | gate | result | exact evidence |
          |---|---|---|
          | runtime receipt | $([[ "${{ steps.receipts.outputs.runtime }}" != 0 ]] && echo PASS || echo UNKNOWN) | PR #997 \`$RUNTIME_SHA\` |
          | intake/evidence receipt | $([[ "${{ steps.receipts.outputs.intake }}" != 0 ]] && echo PASS || echo UNKNOWN) | PR #1000 \`$INTAKE_SHA\` |
          | integration exact head | PASS | PR #1047 \`$INTEGRATION_SHA\` |
          | idle BUSY/IDLE/UNKNOWN and UNKNOWN blocks STOP | $([[ "$state" == PASS ]] && echo PASS || echo UNKNOWN) | exact-head tests; real STOP not called |
          | migration 0056 temporary-only | $([[ "$state" == PASS ]] && echo PASS || echo UNKNOWN) | disposable branch \`${BRANCH_ID:-NOT_CREATED}\` |
          | metadata-only queue cycle | $([[ "$state" == PASS ]] && echo PASS || echo UNKNOWN) | two synthetic metadata jobs; media disabled |
          | rollback non-empty refusal and cleanup | $([[ "$state" == PASS ]] && echo PASS || echo UNKNOWN) | rollback evidence; branch delete \`$delete_state\` |
          | production / media / Drive / merge / Oracle lifecycle isolation | PASS | no forbidden action executed |

          - observed main: \`$MAIN_SHA\`
          - bounded state: \`$state\`
          - disposable branch deletion: \`$delete_state\`
          - final verdict: \`$verdict\`

          $([[ "$verdict" == READY_FOR_ONE_CANARY ]] && echo 'Stop here. A separate Director GO is required for exactly one real canary; no batch is released.' || echo 'No real canary is authorized while the verdict is BLOCKED.')
          EOF
          )
          gh api "repos/$REPOSITORY/issues/946/comments" --method POST -f body="$body" >/dev/null || true
          gh api "repos/$REPOSITORY/issues/881/comments" --method POST -f body="$body" >/dev/null || true
          gh api "repos/$REPOSITORY/issues/627/comments" --method POST -f body="$body" >/dev/null || true
          [[ "$verdict" == READY_FOR_ONE_CANARY ]]
