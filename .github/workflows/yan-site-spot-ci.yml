name: Yan Site Spot Integration CI

on:
  push:
    branches: ['codex/yan-site-spot-integration-20261016']
    paths:
      - '.gitattributes'
      - 'site_integration/yan_spot_cycle/**'
      - 'bridge_school_api/school_spot_lesson.py'
      - 'bridge_school_api/school_spot_repository.py'
      - 'bridge_school_api/local_single_user_lesson.py'
      - 'bridge_school_api/diana19_staging.py'
      - 'bridge_school_api/diana19_visible_stages.py'
      - 'bridge_school_api/anonymous_practice_adapter.py'
      - 'bridge_school_api/static/diana19/**'
      - 'tests/test_diana19_staging.py'
      - 'tests/test_diana19_visible_stages.py'
      - 'tests/test_anonymous_practice_adapter.py'
      - 'tests/test_local_single_user_binding.py'
      - 'tests/test_school_spot_lesson.py'
      - '.github/workflows/yan-site-spot-ci.yml'

permissions:
  contents: read

jobs:
  php-site-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install existing backend test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-api.txt 'pytest==9.1.1' 'httpx==0.28.1'
      - name: Check only the application adapter and native-session fixture PHP
        run: |
          php -l site_integration/yan_spot_cycle/site/include/diana19.application.inc.php
          php -l site_integration/yan_spot_cycle/site/include/diana19.application-bindings.inc.php
          php -l site_integration/yan_spot_cycle/site/include/diana19.cms-renderer.inc.php
          php -l site_integration/yan_spot_cycle/site/include/page/diana19.cms-view.inc.php
          php -l site_integration/yan_spot_cycle/site/include/diana19.route.inc.php
          php -l site_integration/yan_spot_cycle/site/page/diana19.fragment.inc.php
          php -l site_integration/yan_spot_cycle/tests/application_bootstrap_fixture.inc.php
          php -l site_integration/yan_spot_cycle/tests/application_unbound_driver.php
          php -l site_integration/yan_spot_cycle/tests/anonymous_session_bootstrap_fixture.inc.php
          php -l site_integration/yan_spot_cycle/tests/native_cms_interface_fixture.inc.php
          php -l site_integration/yan_spot_cycle/tests/native_cms_renderer_driver.php
      - name: Check staged persistence and explicit admission only
        run: >-
          python -m pytest -q -p no:cacheprovider
          site_integration/yan_spot_cycle/tests/test_application_candidate.py
          tests/test_diana19_visible_stages.py
          tests/test_anonymous_practice_adapter.py
      - name: Verify native CMS renderer mapping and admission boundaries
        run: >-
          python -m site_integration.yan_spot_cycle.tests.verify_native_cms_renderer
          --output deliverables/native-cms-renderer-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify native PHP sessions, separate owners and staged answers over HTTP
        run: >-
          timeout --signal=TERM --kill-after=10s 180s
          python -m site_integration.yan_spot_cycle.tests.verify_native_session_http
          --output deliverables/diana19-native-session-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retain neutral native-session HTTP evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diana19-native-session-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            deliverables/diana19-native-session-${{ github.run_id }}-${{ github.run_attempt }}/artifact/
            deliverables/native-cms-renderer-${{ github.run_id }}-${{ github.run_attempt }}/NATIVE_CMS_RENDERER_EVIDENCE.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
