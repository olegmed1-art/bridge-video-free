name: Oracle Universal Video Missing Image Recovery

on:
  pull_request:
    paths:
      - '.github/workflows/oracle-universal-video-container-missing-image-recover.yml'
      - 'ops/oracle_universal_video_container_missing_image_recover.sh'
      - 'ops/oracle-universal-video-container-recovery-requests/*.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/oracle-universal-video-container-missing-image-recover.yml'
      - 'ops/oracle_universal_video_container_missing_image_recover.sh'
      - 'ops/oracle-universal-video-container-recovery-requests/*.json'

permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('uv-container-recovery-pr-{0}', github.event.pull_request.number) || format('uv-container-recovery-request-{0}', github.sha) }}
  cancel-in-progress: false

jobs:
  contract:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {persist-credentials: false}
      - run: |
          set -euo pipefail
          bash -n ops/oracle_universal_video_container_missing_image_recover.sh
          grep -F "flock --exclusive --nonblock 9" ops/oracle_universal_video_container_missing_image_recover.sh
          grep -F "systemctl restart \"\$SERVICE\"" ops/oracle_universal_video_container_missing_image_recover.sh
          ! grep -Eq 'systemctl (stop|start|restart) (assistant-lab|universal-video\.service)' ops/oracle_universal_video_container_missing_image_recover.sh
  recover:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ORACLE_HOST: 158.180.47.161
      ORACLE_USER: ubuntu
      EXPECTED_FINGERPRINT: SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk
      EXACT_RUNTIME_SHA: bba508350cbe63a7a8ec93fa9c007db9ee9eae6c
      SSH_KEY_ORACLE: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Validate exact recovery request
        run: |
          set -euo pipefail
          mapfile -t f < <(git diff-tree -m --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^ops/oracle-universal-video-container-recovery-requests/[^/]+\.json$')
          [[ ${#f[@]} -eq 1 ]]
          REQUEST_FILE="${f[0]}" EXACT_RUNTIME_SHA="$EXACT_RUNTIME_SHA" python - <<'PY'
          import json,os
          x=json.load(open(os.environ['REQUEST_FILE']))
          assert x == {'operation':'recover_missing_image','runtime_sha':os.environ['EXACT_RUNTIME_SHA']}
          PY
      - name: Resolve pinned SSH identity
        id: ssh
        run: |
          set -euo pipefail
          known="$RUNNER_TEMP/known_hosts"
          ops/oracle_known_hosts_from_scan.sh "$ORACLE_HOST" "$EXPECTED_FINGERPRINT" "$known"
          key="$RUNNER_TEMP/id_oracle"; printf '%s\n' "$SSH_KEY_ORACLE" > "$key"; chmod 0600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          echo "known=$known" >> "$GITHUB_OUTPUT"; echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Recover exact image and restart only container service
        run: |
          set -euo pipefail
          ssh -i '${{ steps.ssh.outputs.key }}' -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='${{ steps.ssh.outputs.known }}' -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST" \
            "sudo -n env UNIVERSAL_VIDEO_EXPECTED_SHA='$EXACT_RUNTIME_SHA' /usr/bin/flock -x /run/lock/oracle-workload-mutation.lock /bin/bash -s" < ops/oracle_universal_video_container_missing_image_recover.sh | tee "$RUNNER_TEMP/recovery.txt"
          grep -E '^UV_CONTAINER_RECOVERY_PASS runtime_sha=[0-9a-f]{40} backup=/var/lib/bridge-school/universal-video-container-recovery/[^ ]+ image_digest=sha256:[0-9a-f]{64}$' "$RUNNER_TEMP/recovery.txt"
