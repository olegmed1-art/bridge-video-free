name: L1 canonical runtime v4

on:
  pull_request:
    paths:
      - 'bridge_school_api/l1_canonical_runtime_v4.py'
      - 'tests/test_l1_canonical_runtime_v4.py'
      - 'tools/l1_runtime_coverage_audit.py'
      - 'tests/test_l1_runtime_coverage_audit.py'
      - 'docs/L1_CANONICAL_RUNTIME_V4.md'
      - '.github/workflows/l1-canonical-runtime-v4-ci.yml'
  push:
    branches: [main]
    paths:
      - 'bridge_school_api/l1_canonical_runtime_v4.py'
      - 'tests/test_l1_canonical_runtime_v4.py'
      - 'tools/l1_runtime_coverage_audit.py'
      - 'tests/test_l1_runtime_coverage_audit.py'
      - 'docs/L1_CANONICAL_RUNTIME_V4.md'
      - '.github/workflows/l1-canonical-runtime-v4-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run complete L1 runtime regression chain
        run: |
          python -m pytest -q \
            tests/test_l1_canonical_runtime.py \
            tests/test_l1_canonical_registry.py \
            tests/test_l1_canonical_runtime_v3.py \
            tests/test_l1_canonical_runtime_v4.py \
            tests/test_l1_runtime_coverage_audit.py
      - name: Print final bounded coverage snapshot
        run: python tools/l1_runtime_coverage_audit.py
