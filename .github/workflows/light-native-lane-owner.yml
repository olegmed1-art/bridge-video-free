name: Oracle Light accepted first-lane owner cycle

on:
  pull_request:
    paths:
      - '.github/workflows/light-native-lane-owner.yml'
      - 'ops/light_native_lane_*.py'
      - 'tests/test_light_native_lane_*.py'
      - 'database/light_native_pilot_intake.py'
      - 'tests/test_light_native_lane_owner*.py'
      - 'tests/test_light_native_pilot_run_guard.py'
      - 'tests/test_light_native_pilot_intake.py'
      - 'ops/native_maintenance_driver*.py'
      - 'ops/native_maintenance_owner_host*.py'
      - 'ops/native_maintenance_owner_attest.py'
      - 'ops/oracle_autopilot_source_preflight.py'
      - 'ops/native_driver_requirements.txt'
      - 'ops/native_maintenance_bundle.py'
      - 'tests/test_native_maintenance_owner_host*.py'
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact reviewed main and staged candidate for one accepted owner step
        required: true
        type: string
      accepted_controller_sha256:
        description: Independently accepted controller package SHA256
        required: true
        type: string
      accepted_runtime_sha256:
        description: Independently accepted retained f82 runtime package SHA256
        required: true
        type: string
      accepted_payload_sha256:
        description: Independently accepted one-step canonical payload SHA256
        required: true
        type: string
      payload_base64:
        description: Accepted step data as base64 (no credentials)
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'olegmed1-art/bridge-video-free' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && inputs.expected_main_sha == github.sha && 'oracle-instance-workload-mutation' || format('native-pilot-owner-noop-{0}', github.run_id) }}
  cancel-in-progress: false
  queue: max

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: python -m pip install 'pytest==8.4.2' 'psycopg[binary]==3.3.4'
      - run: python -m pytest -q tests/test_light_native_pilot_intake.py tests/test_light_native_lane_owner.py tests/test_light_native_lane_controller.py tests/test_light_native_lane_execution.py tests/test_light_native_lane_run_guard.py

      - name: Exercise root metadata and recovery boundaries
        shell: bash
        run: |
          runtime_test_site="$(python -c 'from pathlib import Path; import pytest; print(Path(pytest.__file__).resolve().parent.parent)')"
          sudo -n env PYTHONPATH="$PWD:$runtime_test_site" "$(command -v python)" -m pytest -q tests/test_light_native_lane_controller.py tests/test_light_native_lane_execution.py

  step:
    needs: contract
    if: >-
      github.repository == 'olegmed1-art/bridge-video-free' &&
      github.ref == 'refs/heads/main' && github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.event_name == 'workflow_dispatch' && inputs.expected_main_sha == github.sha
    environment: database-production
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    concurrency:
      group: oracle-light-backup-mutation
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Execute one fixed accepted owner step using the pinned Oracle driver
        env:
          NATIVE_OWNER_DATABASE_URL: ${{ secrets.LIGHT_MAINTENANCE_DATABASE_URL }}
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN: ${{ inputs.expected_main_sha }}
          LANE_CONTROLLER_SHA256: ${{ inputs.accepted_controller_sha256 }}
          LANE_RUNTIME_SHA256: ${{ inputs.accepted_runtime_sha256 }}
          LANE_PAYLOAD_SHA256: ${{ inputs.accepted_payload_sha256 }}
          LANE_PAYLOAD_BASE64: ${{ inputs.payload_base64 }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          python -m pip download --disable-pip-version-check --only-binary=:all: \
            --platform manylinux_2_28_aarch64 --platform manylinux_2_27_aarch64 \
            --python-version 312 --implementation cp --abi cp312 --no-deps \
            --require-hashes --index-url https://pypi.org/simple \
            -r ops/native_driver_requirements.txt --dest "$work/wheels"
          git fetch --no-tags origin f82d58efabf21ba62fd242a4fa02a8e7cfda1d23
          [[ -n "${SSH_PRIVATE_KEY:-}" ]]
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$work/key"
          unset SSH_PRIVATE_KEY
          ssh-keygen -y -P '' -f "$work/key" > "$work/public" 2>/dev/null
          bash ops/oracle_known_hosts_from_scan.sh 92.5.47.149 SHA256:XBR1x74uJ41BxmDF7Y9P20GjIjNbrYXqieV4c2MC0Go "$work/known_hosts"
          PYTHONPATH=. python ops/light_native_lane_owner_runner.py "$work/key" "$work/known_hosts" "$work/wheels"
