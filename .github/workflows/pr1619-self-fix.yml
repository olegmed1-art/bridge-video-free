name: PR1619 Provenance Self Fix
on:
  push:
    branches: [feature/oracle-legacy-server-prod]
    paths:
      - '.github/workflows/pr1619-self-fix.yml'
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'olegmed1-art/bridge-video-free'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feature/oracle-legacy-server-prod
          persist-credentials: true
          fetch-depth: 0
      - name: Apply exact provenance fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('ops/issue_881_external_precanary_workflow.sh')
          s=p.read_text()
          a="  '.github/workflows/oracle-universal-video-job.yml'\n"
          assert a in s and "  '.github/workflows/bridge-video-3.1-server.yml'\n" not in s
          s=s.replace(a, a+"  '.github/workflows/bridge-video-3.1-server.yml'\n", 1)
          b="  'ops/oracle_universal_video_run_command.sh'\n"
          assert b in s and "  'ops/run_bridge_video_oracle_legacy_remote.sh'\n" not in s
          s=s.replace(b, b+"  'ops/run_bridge_video_oracle_legacy_remote.sh'\n", 1)
          p.write_text(s)
          p=Path('tests/test_issue_881_precanary_hardening.py')
          s=p.read_text()
          assert 'assert len(shared_workflows) == 69' in s
          assert 'assert len(referenced_payloads) == 55' in s
          s=s.replace('assert len(shared_workflows) == 69','assert len(shared_workflows) == 70',1)
          s=s.replace('assert len(referenced_payloads) == 55','assert len(referenced_payloads) == 56',1)
          p.write_text(s)
          PY
          python -m pip install -q pytest pyyaml
          pytest -q tests/test_issue_881_precanary_hardening.py::test_every_shared_production_fence_workflow_and_payload_is_provenance_protected
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/issue_881_external_precanary_workflow.sh tests/test_issue_881_precanary_hardening.py
          git commit -m 'Protect Oracle server route in pre-canary provenance gate'
          git push origin HEAD:feature/oracle-legacy-server-prod
