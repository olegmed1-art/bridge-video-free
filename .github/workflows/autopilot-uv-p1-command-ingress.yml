name: Autopilot Universal Video P1 bounded command ingress

on:
  push:
    branches: [codex/oracle-autopilot-lite-shadow]
    paths: ['.github/workflows/autopilot-uv-p1-command-ingress.yml']
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  issues: write

concurrency:
  group: autopilot-universal-video-p1-command-ingress
  cancel-in-progress: false

jobs:
  enqueue:
    if: github.repository == 'olegmed1-art/bridge-video-free'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: olegmed1-art/bridge-video-free
    steps:
      - name: Checkout exact Autopilot branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Resolve exact PR heads and prove write-lane separation
        id: refs
        shell: bash
        run: |
          set -Eeuo pipefail
          api="https://api.github.com/repos/$REPOSITORY"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json')
          for pr in 997 1000 1047; do
            curl -fsS --retry 2 --retry-all-errors --max-time 20 "${auth[@]}" "$api/pulls/$pr" > "$RUNNER_TEMP/pr-$pr.json"
            jq -e '.state == "open" and .draft == true' "$RUNNER_TEMP/pr-$pr.json" >/dev/null
            sha="$(jq -er '.head.sha' "$RUNNER_TEMP/pr-$pr.json")"
            branch="$(jq -er '.head.ref' "$RUNNER_TEMP/pr-$pr.json")"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
            [[ "$branch" =~ ^[A-Za-z0-9._/-]{1,240}$ ]]
            echo "pr_${pr}_sha=$sha" >> "$GITHUB_OUTPUT"
            echo "pr_${pr}_branch=$branch" >> "$GITHUB_OUTPUT"
          done
          main_sha="$(curl -fsS --retry 2 --retry-all-errors --max-time 20 "${auth[@]}" "$api/commits/main" | jq -er '.sha')"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"

          fetch_files() {
            local pr="$1" page count
            : > "$RUNNER_TEMP/files-$pr"
            for page in 1 2 3; do
              curl -fsS --retry 2 --retry-all-errors --max-time 20 "${auth[@]}" \
                "$api/pulls/$pr/files?per_page=100&page=$page" > "$RUNNER_TEMP/files-$pr-$page.json"
              jq -r '.[].filename' "$RUNNER_TEMP/files-$pr-$page.json" >> "$RUNNER_TEMP/files-$pr"
              count="$(jq 'length' "$RUNNER_TEMP/files-$pr-$page.json")"
              (( count < 100 )) && break
            done
            sort -u -o "$RUNNER_TEMP/files-$pr" "$RUNNER_TEMP/files-$pr"
          }
          fetch_files 997
          fetch_files 1000
          fetch_files 1047
          comm -12 "$RUNNER_TEMP/files-997" "$RUNNER_TEMP/files-1000" > "$RUNNER_TEMP/conflict-a"
          comm -12 "$RUNNER_TEMP/files-997" "$RUNNER_TEMP/files-1047" > "$RUNNER_TEMP/conflict-b"
          comm -12 "$RUNNER_TEMP/files-1000" "$RUNNER_TEMP/files-1047" > "$RUNNER_TEMP/conflict-c"
          [[ ! -s "$RUNNER_TEMP/conflict-a" && ! -s "$RUNNER_TEMP/conflict-b" && ! -s "$RUNNER_TEMP/conflict-c" ]]
          echo 'UV_P1_WRITER_PATH_CONFLICT=NO'

      - name: Build three bounded commands from the repository's accepted template
        id: commands
        env:
          RUNTIME_SHA: ${{ steps.refs.outputs.pr_997_sha }}
          INTAKE_SHA: ${{ steps.refs.outputs.pr_1000_sha }}
          INTEGRATION_SHA: ${{ steps.refs.outputs.pr_1047_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import copy, json, os, pathlib, re

          root = pathlib.Path('ops/autopilot/commands')
          candidates = []
          for path in sorted(root.glob('*.json')):
              try:
                  obj = json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  continue
              text = json.dumps(obj, sort_keys=True)
              if 'GITHUB_CI_READ_ONLY_V1' in text:
                  candidates.append((path, obj))
          if not candidates:
              raise SystemExit('AUTOPILOT_BOUNDED_TEMPLATE_NOT_FOUND')
          template_path, template = candidates[-1]

          def find_task_container(value):
              if isinstance(value, dict):
                  type_keys = {'task_type', 'work_type', 'type'} & set(value)
                  param_keys = {'parameters', 'params', 'payload'} & set(value)
                  if type_keys and param_keys and 'GITHUB_CI_READ_ONLY_V1' in json.dumps(value):
                      return value
                  for child in value.values():
                      found = find_task_container(child)
                      if found is not None:
                          return found
              elif isinstance(value, list):
                  for child in value:
                      found = find_task_container(child)
                      if found is not None:
                          return found
              return None

          def replace_identity(value, *, request_id, task_key, pr, sha, approval):
              if isinstance(value, dict):
                  for key in list(value):
                      child = value[key]
                      if key in {'request_id', 'command_id', 'ingress_id'}:
                          value[key] = request_id
                      elif key in {'task_key', 'idempotency_key'}:
                          value[key] = task_key
                      elif key == 'requested_by':
                          value[key] = 'DIRECTOR_P1_20260902'
                      elif key in {'approval_ref', 'authorization_ref'}:
                          value[key] = approval
                      else:
                          replace_identity(child, request_id=request_id, task_key=task_key, pr=pr, sha=sha, approval=approval)
              elif isinstance(value, list):
                  for child in value:
                      replace_identity(child, request_id=request_id, task_key=task_key, pr=pr, sha=sha, approval=approval)

          lanes = [
              ('runtime', 997, os.environ['RUNTIME_SHA'], 'UV_RUNTIME_OWNER_PR997'),
              ('intake', 1000, os.environ['INTAKE_SHA'], 'UV_INTAKE_OWNER_PR1000'),
              ('integration', 1047, os.environ['INTEGRATION_SHA'], 'UV_INTEGRATION_OWNER_PR1047'),
          ]
          receipt = {'template': str(template_path), 'commands': []}
          for lane, pr, sha, approval in lanes:
              if not re.fullmatch(r'[0-9a-f]{40}', sha):
                  raise SystemExit('AUTOPILOT_HEAD_SHA_INVALID')
              task_key = f'uv-p1-{lane}-pr{pr}-{sha[:12]}-20260902'
              request_id = f'uv-p1-{lane}-{sha[:12]}-ingress-20260902'
              obj = copy.deepcopy(template)
              replace_identity(obj, request_id=request_id, task_key=task_key, pr=pr, sha=sha, approval=approval)
              task = find_task_container(obj)
              if task is None:
                  raise SystemExit('AUTOPILOT_TASK_CONTAINER_NOT_FOUND')
              type_key = next(k for k in ('task_type','work_type','type') if k in task)
              params_key = next(k for k in ('parameters','params','payload') if k in task)
              task[type_key] = 'GITHUB_CI_READ_ONLY_V1'
              task[params_key] = {
                  'repository': 'olegmed1-art/bridge-video-free',
                  'pr_number': pr,
                  'expected_head_sha': sha,
                  'require_draft': True,
              }
              for key in ('priority',):
                  if key in task:
                      task[key] = 10
              for key in ('max_cost_microusd','max_cost_micro_usd'):
                  if key in task:
                      task[key] = 0
              serialized = json.dumps(obj, sort_keys=True)
              required = [task_key, request_id, 'GITHUB_CI_READ_ONLY_V1', str(pr), sha, 'olegmed1-art/bridge-video-free']
              if not all(token in serialized for token in required):
                  raise SystemExit('AUTOPILOT_COMMAND_VALIDATION_FAILED')
              forbidden = ('merge_pull_request','media_execute','production_migration','oracle_stop','oracle_restart')
              if any(token in serialized.lower() for token in forbidden):
                  raise SystemExit('AUTOPILOT_COMMAND_FORBIDDEN_CAPABILITY')
              path = root / f'uv-p1-{lane}-{sha[:12]}-20260902.json'
              path.write_text(json.dumps(obj, indent=2, sort_keys=True) + '\n', encoding='utf-8')
              receipt['commands'].append({'lane':lane,'request_id':request_id,'task_key':task_key,'pr':pr,'head_sha':sha,'path':str(path)})
          pathlib.Path(os.environ['RUNNER_TEMP'], 'uv-p1-command-receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(f'AUTOPILOT_BOUNDED_TEMPLATE={template_path}')
          print('AUTOPILOT_BOUNDED_COMMAND_COUNT=3')
          PY
          jq -r '.commands[] | "\(.lane)_request_id=\(.request_id)\n\(.lane)_task_key=\(.task_key)\n\(.lane)_path=\(.path)"' \
            "$RUNNER_TEMP/uv-p1-command-receipt.json" >> "$GITHUB_OUTPUT"

      - name: Validate commands with bounded-ingress tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m json.tool "${{ steps.commands.outputs.runtime_path }}" >/dev/null
          python -m json.tool "${{ steps.commands.outputs.intake_path }}" >/dev/null
          python -m json.tool "${{ steps.commands.outputs.integration_path }}" >/dev/null
          mapfile -t tests < <(find tests -maxdepth 1 -type f \( -iname '*autopilot*ingress*.py' -o -iname '*bounded*task*.py' \) -print | sort)
          if (( ${#tests[@]} > 0 )); then
            python -m pytest -q "${tests[@]}"
          fi
          echo 'AUTOPILOT_BOUNDED_COMMAND_VALIDATION=PASS'

      - name: Commit command manifests only
        id: commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'ops/autopilot/commands/uv-p1-'*'-20260902.json'
          git diff --cached --name-only | grep -Ev '^ops/autopilot/commands/uv-p1-[a-z]+-[0-9a-f]{12}-20260902\.json$' && exit 41 || true
          if git diff --cached --quiet; then
            echo 'created=false' >> "$GITHUB_OUTPUT"
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo 'AUTOPILOT_BOUNDED_COMMAND_COMMIT=ALREADY_PRESENT'
          else
            git commit -m 'Autopilot: enqueue Universal Video P1 read-only lanes'
            git push origin HEAD:codex/oracle-autopilot-lite-shadow
            echo 'created=true' >> "$GITHUB_OUTPUT"
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo 'AUTOPILOT_BOUNDED_COMMAND_COMMIT=PASS'
          fi

      - name: Record ingress receipt on issue 946
        env:
          MAIN_SHA: ${{ steps.refs.outputs.main_sha }}
          RUNTIME_SHA: ${{ steps.refs.outputs.pr_997_sha }}
          RUNTIME_BRANCH: ${{ steps.refs.outputs.pr_997_branch }}
          INTAKE_SHA: ${{ steps.refs.outputs.pr_1000_sha }}
          INTAKE_BRANCH: ${{ steps.refs.outputs.pr_1000_branch }}
          INTEGRATION_SHA: ${{ steps.refs.outputs.pr_1047_sha }}
          INTEGRATION_BRANCH: ${{ steps.refs.outputs.pr_1047_branch }}
          INGRESS_COMMIT: ${{ steps.commit.outputs.commit_sha }}
          RUNTIME_REQUEST: ${{ steps.commands.outputs.runtime_request_id }}
          RUNTIME_KEY: ${{ steps.commands.outputs.runtime_task_key }}
          INTAKE_REQUEST: ${{ steps.commands.outputs.intake_request_id }}
          INTAKE_KEY: ${{ steps.commands.outputs.intake_task_key }}
          INTEGRATION_REQUEST: ${{ steps.commands.outputs.integration_request_id }}
          INTEGRATION_KEY: ${{ steps.commands.outputs.integration_task_key }}
        shell: bash
        run: |
          set -Eeuo pipefail
          body=$(cat <<EOF
          ## P1 bounded Autopilot ingress receipt

          Three idempotent read-only commands were committed for the acting Autopilot observer. The task keys are identical to the direct-registration path, so an already registered task is reused rather than duplicated.

          | lane | ingress request | durable task key | exact head | writer owner |
          |---|---|---|---|---|
          | runtime | \`$RUNTIME_REQUEST\` | \`$RUNTIME_KEY\` | PR #997 \`$RUNTIME_SHA\` | \`$RUNTIME_BRANCH\` only |
          | intake/evidence | \`$INTAKE_REQUEST\` | \`$INTAKE_KEY\` | PR #1000 \`$INTAKE_SHA\` | \`$INTAKE_BRANCH\` only |
          | queue/Oracle integration | \`$INTEGRATION_REQUEST\` | \`$INTEGRATION_KEY\` | PR #1047 \`$INTEGRATION_SHA\` | \`$INTEGRATION_BRANCH\` only |

          - observed main: \`$MAIN_SHA\`
          - ingress commit: \`$INGRESS_COMMIT\`
          - changed-path conflicts: **none**
          - current state: \`PENDING_AUTOPILOT_INGESTION\`
          - media execution / Drive write / production mutation / merge / Oracle lifecycle action: **NO**

          Actual durable task UUIDs must be reported only after the observer acknowledges these request IDs; ingress request IDs are not being represented as task UUIDs.
          EOF
          )
          gh api "repos/$REPOSITORY/issues/946/comments" --method POST -f body="$body" >/dev/null
          echo 'ISSUE_946_BOUNDED_INGRESS_RECEIPT=PASS'
