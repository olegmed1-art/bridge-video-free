name: Project state reconciliation

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
  push:
    branches: [main]
    paths:
      - 'dds_training/**'
      - 'ops/**'
      - 'assistant_lab/**'
      - 'tournament/**'
      - '.github/workflows/**'
      - 'AGENTS.md'

permissions:
  contents: read
  issues: read
  pull-requests: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - name: Contract self-test
        run: python ops/project_state_reconcile.py --self-test
      - name: Reconcile live project state from primary GitHub evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python ops/project_state_reconcile.py --out project_state_live.json
      - name: Write concise state summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          state=json.load(open('project_state_live.json', encoding='utf-8'))
          print('# Project state reconciliation')
          print(f"\nmain: `{state['main_sha']}`")
          print('\n| subsystem | state | mutation from index |')
          print('|---|---|---|')
          for name, row in state['subsystems'].items():
              print(f"| {name} | {row['reconciliation_state']} | {row['mutating_action_allowed_from_index']} |")
          print('\nThis artifact is an index only; mutating actions still require a last-second primary-source check.')
          PY
      - name: Upload reconciled state
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4
        with:
          name: project-state-${{ github.run_id }}
          path: project_state_live.json
          retention-days: 14
