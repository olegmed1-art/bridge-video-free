name: Oracle DDS3 Pilot-10k root status

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  root_status:
    if: ${{ github.event.comment.user.login == 'olegmed1-art' && github.event.comment.body == '/dds3-pilot10k root-status' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ORACLE_HOST: 158.180.47.161
      ORACLE_USER: ubuntu
      EXPECTED_FINGERPRINT: SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk
      SSH_KEY_ORACLE: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
      SSH_KEY_OCI: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
      SSH_KEY_VM: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
      SSH_KEY_BRIDGE: ${{ secrets.BRIDGE_SCHOOL_ORACLE_SSH_PRIVATE_KEY }}
      SSH_KEY_ORACLE_ALT: ${{ secrets.ORACLE_SSH_KEY }}
      SSH_KEY_OCI_ALT: ${{ secrets.OCI_SSH_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Resolve verified SSH credential
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/pilot10k-root-status"; mkdir -p "$work"
          known="$work/known_hosts"
          ops/oracle_known_hosts_from_scan.sh "$ORACLE_HOST" "$EXPECTED_FINGERPRINT" "$known"
          selected=''; idx=0
          for name in SSH_KEY_ORACLE SSH_KEY_OCI SSH_KEY_VM SSH_KEY_BRIDGE SSH_KEY_ORACLE_ALT SSH_KEY_OCI_ALT; do
            raw="${!name:-}"; [[ -n "$raw" ]] || continue; idx=$((idx+1)); base="$work/key-$idx"
            printf '%s\n' "$raw" > "$base.raw"
            tr -d '\r' < "$base.raw" > "$base.crlf"
            RAW_KEY="$raw" OUT_KEY="$base.escaped" python - <<'PY'
          import os
          raw=os.environ['RAW_KEY']
          if '\\n' in raw and '\n' not in raw:
              raw=raw.replace('\\r','').replace('\\n','\n')
          with open(os.environ['OUT_KEY'],'w',newline='\n') as f:
              f.write(raw)
              if not raw.endswith('\n'): f.write('\n')
          PY
            for key in "$base.raw" "$base.crlf" "$base.escaped"; do
              chmod 0600 "$key"
              ssh-keygen -y -f "$key" >/dev/null 2>&1 || continue
              if ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" -o ConnectTimeout=10 "$ORACLE_USER@$ORACLE_HOST" true >/dev/null 2>&1; then selected="$key"; break 2; fi
            done
          done
          [[ -n "$selected" ]]
          cp "$selected" "$work/id_oracle"; chmod 0600 "$work/id_oracle"
          echo "key=$work/id_oracle" >> "$GITHUB_OUTPUT"
          echo "known=$known" >> "$GITHUB_OUTPUT"
      - name: Read root status
        id: status
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/status.txt"
          ssh -i '${{ steps.ssh.outputs.key }}' -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='${{ steps.ssh.outputs.known }}' -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST" 'sudo -n bash -s' <<'REMOTE' | tee "$out"
          set -Eeuo pipefail
          state=/opt/bridge-school/dds3-mass-validation
          echo "service=$(systemctl is-active dds3-mass@10000.service 2>/dev/null || true)"
          systemctl show dds3-mass@10000.service -p LoadState -p ActiveState -p SubState -p Result -p ExecMainCode -p ExecMainStatus --no-pager || true
          for p in "$state/requests/10000.json" "$state/evidence/10000.json" "$state/logs/10000.log"; do
            if [[ -e "$p" ]]; then stat -c 'file=%n owner=%U:%G mode=%a bytes=%s' "$p"; else echo "missing=$p"; fi
          done
          if [[ -f "$state/evidence/10000.json" ]]; then
            python3 - "$state/evidence/10000.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          for k in ('target','phase','status','compute_plane','compute_host','engine','fallback_used','corpus_sha256','corpus_deals','expected_train_tasks','returncode','log_sha256'):
              if k in x: print(f'{k}={x[k]}')
          PY
          fi
          echo journal_tail_begin
          journalctl -u dds3-mass@10000.service -n 50 --no-pager 2>&1 | sed -E 's/(token|password|secret|key|dsn)=([^[:space:]]+)/\1=[REDACTED]/Ig'
          echo journal_tail_end
          if [[ -f "$state/logs/10000.log" ]]; then
            echo log_tail_begin
            tail -n 30 "$state/logs/10000.log" | sed -E 's/(token|password|secret|key|dsn)=([^[:space:]]+)/\1=[REDACTED]/Ig'
            echo log_tail_end
          fi
          REMOTE
          { echo 'text<<EOF'; sed -n '1,140p' "$out"; echo EOF; } >> "$GITHUB_OUTPUT"
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TEXT: ${{ steps.status.outputs.text }}
        shell: bash
        run: |
          body="Oracle DDS3 Pilot-10k root status:\n\n\`\`\`text\n${TEXT:-status_failed}\n\`\`\`"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -f body="$body" >/dev/null
