name: Tournament v3 coverage release gate

on:
  pull_request:
    paths:
      - "bridge_school_api/tournament_coverage_release_v3.py"
      - "bridge_school_api/tournament_preanalysis_gate_v3.py"
      - "bridge_school_api/tournament_mp_validation_v3.py"
      - "tests/test_tournament_coverage_release_v3.py"
      - "data/tournaments/tournament_30041_round2_diana_facts_v1.json"
      - ".github/workflows/tournament-v3-coverage-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage-release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile coverage gate
        run: python -m py_compile bridge_school_api/tournament_coverage_release_v3.py
      - name: Run coverage/release contract tests
        run: python -m pytest -q tests/test_tournament_coverage_release_v3.py
