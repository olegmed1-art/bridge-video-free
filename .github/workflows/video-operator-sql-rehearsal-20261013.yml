name: Video Operator Isolated SQL Rehearsal 20261013

on:
  push:
    branches: ['codex/video-operator-sql-rehearsal-20261013']
    paths: ['.github/workflows/video-operator-sql-rehearsal-20261013.yml']

permissions:
  contents: read

concurrency:
  group: video-operator-isolated-sql-rehearsal-20261013
  cancel-in-progress: false

jobs:
  isolated-postgres:
    if: >-
      github.repository == 'olegmed1-art/bridge-video-free' &&
      github.event.repository.private == false &&
      github.event_name == 'push' && github.event.created == true &&
      github.ref == 'refs/heads/codex/video-operator-sql-rehearsal-20261013' &&
      github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: operator_rehearsal
          POSTGRES_USER: rehearsal_owner
          POSTGRES_PASSWORD: synthetic-operator-ci-only
        ports:
          - 127.0.0.1:55434:5432
        options: >-
          --health-cmd "pg_isready -U rehearsal_owner -d operator_rehearsal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: ''
      BRIDGE_WORKER_DATABASE_URL: ''
      BRIDGE_API_DATABASE_URL: ''
      BRIDGE_VIDEO_REAL_FIXTURE_DIR: ''
      GOOGLE_DRIVE_OAUTH_JSON: ''
      BRIDGE_OPERATOR_REHEARSAL: github-ephemeral-pg18-v1
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PGPASSWORD: synthetic-operator-ci-only
    steps:
      - name: Checkout the exact triggering commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Record exact source and disposable service
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse HEAD^)" = '040518f40b1298a3b84dff2b271a11690c52f927'
          test -z "$DATABASE_URL$BRIDGE_WORKER_DATABASE_URL$BRIDGE_API_DATABASE_URL$BRIDGE_VIDEO_REAL_FIXTURE_DIR$GOOGLE_DRIVE_OAUTH_JSON"
          mkdir -p operator-rehearsal-output
          git show -s --format='SOURCE_SHA=%H TREE_SHA=%T PARENT_SHA=%P' HEAD | tee operator-rehearsal-output/source.txt
          git diff --name-status HEAD^ HEAD > operator-rehearsal-output/diff-files.txt
          git diff HEAD^ HEAD > operator-rehearsal-output/exact.patch
          git ls-files -z database/migrations | xargs -0 sha256sum > operator-rehearsal-output/migration-files.sha256
          docker inspect --format '{{.Image}}' "$POSTGRES_CONTAINER" > operator-rehearsal-output/container-image-id.txt
          docker image inspect postgres:18 --format '{{json .RepoDigests}}' > operator-rehearsal-output/container-image-digests.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install bounded test dependencies
        timeout-minutes: 4
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pytest==9.1.1' 'psycopg[binary]==3.3.4' 'PyMuPDF==1.28.2' 'Pillow==12.3.0' 'requests==2.34.2' 'google-auth==2.61.0' 'google-auth-oauthlib==1.5.0' 'opencv-python-headless==5.0.0.93'
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client >/dev/null
          fi
          python --version > operator-rehearsal-output/python-version.txt
          python -m pip freeze > operator-rehearsal-output/python-dependencies.txt
      - name: Apply unchanged migrations to disposable loopback database
        timeout-minutes: 6
        env:
          DATABASE_URL: postgresql://rehearsal_owner@127.0.0.1:55434/operator_rehearsal
        run: |
          set -euo pipefail
          test "$DATABASE_URL" = 'postgresql://rehearsal_owner@127.0.0.1:55434/operator_rehearsal'
          bash database/scripts/migrate.sh 2>&1 | tee operator-rehearsal-output/migrations.log
      - name: Run actual worker-session and transaction rehearsal once
        timeout-minutes: 4
        run: |
          set -euo pipefail
          test -z "$DATABASE_URL$BRIDGE_WORKER_DATABASE_URL$BRIDGE_API_DATABASE_URL$BRIDGE_VIDEO_REAL_FIXTURE_DIR"
          python -m pytest -q tests/test_video_operator_postgres.py --strict-markers --junitxml=operator-rehearsal-output/pytest.xml 2>&1 | tee operator-rehearsal-output/pytest.log
          git diff --exit-code
      - name: Remove this disposable PostgreSQL container and verify cleanup
        if: always()
        timeout-minutes: 1
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          mkdir -p operator-rehearsal-output
          test -n "$POSTGRES_CONTAINER"
          docker logs "$POSTGRES_CONTAINER" > operator-rehearsal-output/postgres.log 2>&1 || true
          docker rm --force --volumes "$POSTGRES_CONTAINER"
          if docker inspect "$POSTGRES_CONTAINER" >/dev/null 2>&1; then
            echo 'Disposable PostgreSQL container still exists' >&2
            exit 1
          fi
          printf 'REMOVED_AND_ABSENT container=%s\n' "$POSTGRES_CONTAINER" | tee operator-rehearsal-output/container-cleanup.txt
      - name: Preserve synthetic evidence with the exact source SHA
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: video-operator-sql-${{ github.sha }}
          path: operator-rehearsal-output/
          retention-days: 7
          if-no-files-found: error
