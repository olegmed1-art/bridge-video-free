name: Tournament Analyzer v3 Teacher Dossier

on:
  pull_request:
    paths:
      - "bridge_school_api/tournament_teacher_review_dossier_v3.py"
      - "tools/tournament_teacher_review_dossier_v3.py"
      - "tests/test_tournament_teacher_review_dossier_v3.py"
      - ".github/workflows/tournament-analyzer-v3-teacher-dossier.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  real-teacher-dossier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile modules
        run: |
          python -m py_compile bridge_school_api/tournament_teacher_review_dossier_v3.py
          python -m py_compile tools/tournament_teacher_review_dossier_v3.py
      - name: Run focused contracts
        run: |
          python -m pytest -q \
            tests/test_tournament_teacher_review_queue_v3.py \
            tests/test_tournament_teacher_decisions_v3.py \
            tests/test_tournament_teacher_review_dossier_v3.py
      - name: Restore exact historical tournament evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/30041 evidence/29912 evidence/29912-source
          for spec in \
            "9463631738:/tmp/30041.zip:evidence/30041" \
            "9471054929:/tmp/29912-dds3.zip:evidence/29912" \
            "9470920077:/tmp/29912-source.zip:evidence/29912-source"; do
            IFS=: read -r aid zip dest <<< "$spec"
            curl -fsSL --retry 3 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${aid}/zip" \
              -o "$zip"
            unzip -q "$zip" -d "$dest"
          done
          DDS30041="$(find evidence/30041 -type f -name 'diana-30041-round2-dds3.json' -print -quit)"
          DDS29912="$(find evidence/29912 -type f -name 'diana-29912-cross-session-dds3.json' -print -quit)"
          FACTS29912="$(find evidence/29912-source -type d -name facts29912 -print -quit)"
          test -n "$DDS30041" && test -n "$DDS29912" && test -n "$FACTS29912"
          echo "DDS30041=$DDS30041" >> "$GITHUB_ENV"
          echo "DDS29912=$DDS29912" >> "$GITHUB_ENV"
          echo "FACTS29912=$FACTS29912" >> "$GITHUB_ENV"
      - name: Rebuild exact real review queue and pending ledger
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python tools/tournament_teacher_review_queue_v3.py \
            --facts-30041 data/tournaments/tournament_30041_round2_diana_facts_v1.json \
            --dds3-30041 "$DDS30041" \
            --dds3-29912 "$DDS29912" \
            --facts-29912-dir "$FACTS29912" \
            --per-event-limit 10 \
            --out-json tournament-teacher-review-queue.json \
            --out-md /tmp/tournament-teacher-review-queue.md
          PYTHONPATH="$PWD" python tools/tournament_teacher_decisions_v3.py \
            --queue tournament-teacher-review-queue.json \
            --out tournament-teacher-decision-ledger.json
      - name: Build evidence-bound teacher dossier
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python tools/tournament_teacher_review_dossier_v3.py \
            --queue tournament-teacher-review-queue.json \
            --ledger tournament-teacher-decision-ledger.json \
            --facts-30041 data/tournaments/tournament_30041_round2_diana_facts_v1.json \
            --dds3-30041 "$DDS30041" \
            --dds3-29912 "$DDS29912" \
            --out-json tournament-teacher-review-dossier.json \
            --out-md tournament-teacher-review-dossier.md
          cat tournament-teacher-review-dossier.md
      - name: Real evidence gate
        run: |
          python - <<'PY'
          import json
          p=json.load(open('tournament-teacher-review-dossier.json', encoding='utf-8'))
          ledger=json.load(open('tournament-teacher-decision-ledger.json', encoding='utf-8'))
          assert p['schema']=='tournament-teacher-review-dossier-v1'
          assert p['queue_sha256']==ledger['queue_sha256']
          assert p['automatic_decisions_allowed'] is False
          assert p['automatic_methodology_mapping_allowed'] is False
          assert p['automatic_student_error_attribution_allowed'] is False
          assert p['cross_event_numeric_ranking_allowed'] is False
          assert len(p['items'])==17
          assert sum(x['event_id']=='30041' for x in p['items'])==7
          assert sum(x['event_id']=='29912' for x in p['items'])==10
          assert len({x['review_id'] for x in p['items']})==17
          for x in p['items']:
              assert x['status']=='PENDING'
              assert x['teacher_decision_required'] is True
              assert x['causal_link']=='NOT_ESTABLISHED'
              assert x['automatic_methodology_mapping_allowed'] is False
              assert x['automatic_student_error_attribution_allowed'] is False
              assert x['methodology_mapping'] is None
              assert x['student_error_attribution'] is None
              hands=x['deal_facts']['hands']
              cards=[card for seat in ('N','E','S','W') for card in hands[seat]]
              assert all(len(hands[seat])==13 for seat in ('N','E','S','W'))
              assert len(cards)==52 and len(set(cards))==52
              assert x['technical_finding']['evidence']
          print('TOURNAMENT_TEACHER_REVIEW_DOSSIER_PASS')
          print('items', len(p['items']))
          print('queue_sha256', p['queue_sha256'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tournament-analyzer-v3-teacher-review-dossier
          path: |
            tournament-teacher-review-dossier.json
            tournament-teacher-review-dossier.md
          if-no-files-found: error
          retention-days: 30
