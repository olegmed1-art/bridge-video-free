name: Autopilot mailbox queue capacity

on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: read

concurrency:
  group: autopilot-mailbox-pre-rotation
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'olegmed1-art/bridge-video-free' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.AUTOPILOT_CALLBACK_DATABASE_URL }}
      SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
    steps:
      - name: Checkout main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false

      - name: Install pinned PostgreSQL client library
        run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.3.4'

      - name: Read working queue capacity
        shell: bash
        run: |
          set -euo pipefail
          row="$(python -m ops.github_autopilot_db_route mailbox)"
          IFS='|' read -r mailbox used capacity readiness <<<"$row"
          printf 'mailbox=%s active=%s capacity=%s readiness=%s\n' "$mailbox" "$used" "$capacity" "$readiness"
          case "$readiness" in
            NORMAL) ;;
            NEAR_CAPACITY) echo '::warning::Autopilot working queue is at least 80% full; terminal records remain archived.' ;;
            CAPACITY_REACHED) echo '::error::Autopilot working queue is full; admission waits without deleting accepted work.'; exit 1 ;;
            PREPARE_ROTATION|ROTATION_REQUIRED) echo '::warning::Legacy lifetime capacity contract remains installed; active/archive migration is pending.' ;;
            *) echo '::error::Unknown mailbox capacity contract'; exit 1 ;;
          esac
          # Transport history is monitored separately by the existing database
          # health monitor. Working pressure never creates another mailbox PR.
