name: A11 Runner CI
on:
  pull_request:
    paths:
      - 'dds_training/a11_mass_dds_runner.py'
      - 'tests/test_a11_mass_dds_runner.py'
      - '.github/workflows/a11-mass-dds.yml'
      - '.github/workflows/a11-runner-ci.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: pytest -q tests/test_a11_mass_dds_runner.py
