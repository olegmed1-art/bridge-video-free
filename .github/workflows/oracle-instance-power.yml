name: Oracle instance power

on:
  workflow_dispatch:
    inputs:
      action:
        description: Exact lifecycle action
        required: true
        type: choice
        options:
          - status
          - start
          - stop

permissions:
  contents: read

concurrency:
  group: oracle-instance-power
  cancel-in-progress: false

jobs:
  power:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OCI_REGION: eu-frankfurt-1
      OCI_INSTANCE_OCID: ocid1.instance.oc1.eu-frankfurt-1.antheljtruoejaica7hj5oubnh2cctnjr7ti7llcgo6ho6wdvgvui6td7saq
    steps:
      - name: Validate credential presence
        shell: bash
        env:
          OCI_CLI_CONFIG: ${{ secrets.OCI_CLI_CONFIG }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
        run: |
          set -euo pipefail
          test -n "${OCI_CLI_CONFIG:-}" || { echo 'missing required secret: OCI_CLI_CONFIG'; exit 1; }
          test -n "${OCI_CLI_KEY_CONTENT:-}" || { echo 'missing required secret: OCI_CLI_KEY_CONTENT'; exit 1; }

      - name: Install OCI CLI
        run: python -m pip install --disable-pip-version-check --quiet oci-cli

      - name: Configure bounded OCI client
        shell: bash
        env:
          OCI_CLI_CONFIG: ${{ secrets.OCI_CLI_CONFIG }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_CLI_KEY_CONTENT" > "$HOME/.oci/oci_api_key.pem"
          printf '%s\n' "$OCI_CLI_CONFIG" > "$HOME/.oci/config"
          python - <<'PY'
          from pathlib import Path
          p = Path.home()/'.oci/config'
          s = p.read_text()
          lines=[]
          found_key=False
          found_region=False
          for line in s.splitlines():
              if line.strip().startswith('key_file='):
                  lines.append(f'key_file={Path.home()}/.oci/oci_api_key.pem')
                  found_key=True
              elif line.strip().startswith('region='):
                  lines.append('region=eu-frankfurt-1')
                  found_region=True
              else:
                  lines.append(line)
          if not found_key:
              lines.append(f'key_file={Path.home()}/.oci/oci_api_key.pem')
          if not found_region:
              lines.append('region=eu-frankfurt-1')
          p.write_text('\n'.join(lines)+'\n')
          PY

      - name: Read current lifecycle state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          state="$(oci compute instance get \
            --instance-id "$OCI_INSTANCE_OCID" \
            --query 'data."lifecycle-state"' \
            --raw-output)"
          case "$state" in
            RUNNING|STOPPED|STARTING|STOPPING) ;;
            *) echo "unexpected lifecycle state: $state" >&2; exit 1 ;;
          esac
          echo "current_state=$state" >> "$GITHUB_OUTPUT"
          echo "current lifecycle state: $state"

      - name: Start exact instance
        if: ${{ inputs.action == 'start' && steps.state.outputs.current_state != 'RUNNING' }}
        shell: bash
        run: |
          set -euo pipefail
          oci compute instance action \
            --instance-id "$OCI_INSTANCE_OCID" \
            --action START >/dev/null
          oci compute instance get \
            --instance-id "$OCI_INSTANCE_OCID" \
            --wait-for-state RUNNING \
            --wait-interval-seconds 10 \
            --max-wait-seconds 600 >/dev/null
          echo "instance reached RUNNING"

      - name: Stop exact instance
        if: ${{ inputs.action == 'stop' && steps.state.outputs.current_state != 'STOPPED' }}
        shell: bash
        run: |
          set -euo pipefail
          oci compute instance action \
            --instance-id "$OCI_INSTANCE_OCID" \
            --action STOP >/dev/null
          oci compute instance get \
            --instance-id "$OCI_INSTANCE_OCID" \
            --wait-for-state STOPPED \
            --wait-interval-seconds 10 \
            --max-wait-seconds 600 >/dev/null
          echo "instance reached STOPPED"

      - name: Report no-op status
        if: ${{ inputs.action == 'status' || (inputs.action == 'start' && steps.state.outputs.current_state == 'RUNNING') || (inputs.action == 'stop' && steps.state.outputs.current_state == 'STOPPED') }}
        run: echo "No lifecycle mutation required."
