name: TEMP DDS3 grid row OCR diagnostic
on:
  pull_request:
    paths:
      - 'tools/dds3_vision/debug_grid_row_ocr.py'
      - '.github/workflows/dds3-grid-row-debug.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install local/free vision runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr
          python -m pip install --disable-pip-version-check -r requirements-dds3-vision.txt
      - name: Probe real EBL row OCR variants
        env:
          PYTHONPATH: .
        run: python tools/dds3_vision/debug_grid_row_ocr.py
