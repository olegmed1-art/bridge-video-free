name: Autopilot Oracle runtime diagnostics (one-shot)

on:
  push:
    branches: [codex/oracle-autopilot-lite-shadow]
    paths: ['.github/workflows/autopilot-oracle-runtime-diagnostics-once.yml']

permissions:
  contents: read

concurrency:
  group: oracle-instance-workload-mutation
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.repository == 'olegmed1-art/bridge-video-free'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      ORACLE_HOST: 158.180.47.161
      ORACLE_USER: ubuntu
      EXPECTED_FINGERPRINT: SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk
      SSH_KEY_ORACLE: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Verify Oracle SSH boundary
        id: ssh
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/autopilot-runtime-diagnostics"
          mkdir -p "$work"
          key="$work/id_oracle"
          printf '%s\n' "$SSH_KEY_ORACLE" | tr -d '\r' > "$key"
          chmod 0600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          known="$work/known_hosts"
          ops/oracle_known_hosts_from_scan.sh "$ORACLE_HOST" "$EXPECTED_FINGERPRINT" "$known"
          ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" \
            -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST" 'sudo -n true'
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "known=$known" >> "$GITHUB_OUTPUT"
          echo 'ORACLE_SSH_PREFLIGHT=PASS'

      - name: Read safe runtime and queue state
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i '${{ steps.ssh.outputs.key }}' -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile='${{ steps.ssh.outputs.known }}' \
            -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST" 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          root=/opt/bridge-school/school-autopilot
          env_file="$root/autopilot-shadow.env"
          [[ -s "$env_file" && "$(stat -c '%U:%G:%a' "$env_file")" == root:root:600 ]]
          set -a
          source "$env_file"
          set +a
          python="$root/.venv/bin/python"
          [[ -x "$python" ]]
          current_revision=missing
          if [[ -L "$root/current" && -s "$root/current/SOURCE_REVISION" ]]; then
            current_revision="$(cat "$root/current/SOURCE_REVISION")"
          fi
          service_active="$(systemctl is-active school-autopilot-shadow.service 2>/dev/null || true)"
          service_enabled="$(systemctl is-enabled school-autopilot-shadow.service 2>/dev/null || true)"
          broker_env_present=NO
          [[ -s "$root/autopilot-broker.env" ]] && broker_env_present=YES
          AUTOPILOT_DATABASE_URL="$AUTOPILOT_DATABASE_URL" "$python" - <<'PY'
          import os
          import psycopg
          dsn=os.environ['AUTOPILOT_DATABASE_URL']
          with psycopg.connect(dsn, connect_timeout=10, application_name='autopilot-safe-diagnostics') as conn:
              with conn.cursor() as cur:
                  cur.execute("""
                    SELECT current_user,
                           EXISTS (SELECT 1 FROM public.schema_migration WHERE migration_key='0303_autopilot_github_draft_repair'),
                           count(*) FILTER (WHERE goal_type='GITHUB_DRAFT_REPAIR_V1'),
                           count(*) FILTER (WHERE goal_type='GITHUB_DRAFT_REPAIR_V1' AND status='READY'),
                           count(*) FILTER (WHERE goal_type='GITHUB_DRAFT_REPAIR_V1' AND status='RUNNING'),
                           count(*) FILTER (WHERE goal_type='GITHUB_DRAFT_REPAIR_V1' AND status='DONE')
                      FROM autopilot.task_status
                  """)
                  user,migration,total,ready,running,done=cur.fetchone()
                  assert user == 'autopilot_runtime_login'
                  assert migration is True
                  print(f'AUTOPILOT_RUNTIME_USER_OK=YES')
                  print(f'AUTOPILOT_MIGRATION_0303_PRESENT=YES')
                  print(f'AUTOPILOT_DRAFT_REPAIR_TOTAL={total}')
                  print(f'AUTOPILOT_DRAFT_REPAIR_READY={ready}')
                  print(f'AUTOPILOT_DRAFT_REPAIR_RUNNING={running}')
                  print(f'AUTOPILOT_DRAFT_REPAIR_DONE={done}')
                  cur.execute("""
                    SELECT task_key,status,coalesce(terminal_reason_code,'')
                      FROM autopilot.task_status
                     WHERE goal_type='GITHUB_DRAFT_REPAIR_V1'
                     ORDER BY created_at DESC
                     LIMIT 10
                  """)
                  for key,status,reason in cur.fetchall():
                      print(f'AUTOPILOT_DRAFT_TASK key={key} status={status} reason={reason or "NONE"}')
          PY
          unset AUTOPILOT_DATABASE_URL
          echo "AUTOPILOT_CURRENT_REVISION=$current_revision"
          echo "AUTOPILOT_SERVICE_ACTIVE=$service_active"
          echo "AUTOPILOT_SERVICE_ENABLED=$service_enabled"
          echo "AUTOPILOT_BROKER_ENV_PRESENT=$broker_env_present"
          echo 'AUTOPILOT_SERVICE_RESTARTED=NO'
          echo 'ORACLE_INSTANCE_STOP_REQUESTED=NO'
          REMOTE
