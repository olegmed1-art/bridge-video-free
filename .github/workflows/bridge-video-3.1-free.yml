name: bridge-video-3.1-free

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Opaque deterministic job id"
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - 'run_requests/*.txt'

permissions:
  contents: read

concurrency:
  group: bridge-video-heavy
  cancel-in-progress: false

jobs:
  free-guard-and-worker:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330

    env:
      BRIDGE_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      BRIDGE_RUNNER_LABEL: ubuntu-24.04
      BRIDGE_LARGER_RUNNER: "false"
      BRIDGE_PAID_CLOUD: "false"
      BRIDGE_BILLING_FALLBACK: "false"
      BRIDGE_REQUESTED_ALGORITHM_REVISION: "3.1-free-r25.5"
      PYTHONUNBUFFERED: "1"
      WHISPER_MODEL: small

    steps:
      - name: Checkout public technical code only
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve opaque job id
        shell: bash
        env:
          INPUT_JOB_ID: ${{ inputs.job_id }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            JOB_ID="$INPUT_JOB_ID"
          else
            REQUEST_FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^run_requests/.*\.txt$' | head -n 1 || true)"
            test -n "$REQUEST_FILE" || { echo "No run request file in triggering commit" >&2; exit 2; }
            JOB_ID="$(sed -n 's/^JOB_ID=//p' "$REQUEST_FILE" | tail -n 1 | tr -d '[:space:]')"
            if [ -z "$JOB_ID" ]; then
              JOB_ID="$(basename "$REQUEST_FILE" .txt)"
            fi
          fi
          test -n "$JOB_ID"
          case "$JOB_ID" in
            *[!0-9a-f]*) echo "invalid opaque job id" >&2; exit 2 ;;
          esac
          test "${#JOB_ID}" -eq 32
          echo "BRIDGE_JOB_ID=$JOB_ID" >> "$GITHUB_ENV"

      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install free open-source runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check -r requirements-worker.txt

      - name: Google Drive OAuth preflight
        shell: bash
        env:
          GOOGLE_DRIVE_OAUTH_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_JSON }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from run_drive_3_1_free_oidc import user_oauth_token
          token = user_oauth_token()
          if not token:
              raise SystemExit('BLOCKED_ACCESS: GOOGLE_DRIVE_OAUTH_JSON secret is not configured')
          print('Google Drive OAuth preflight: PASS')
          PY

      - name: FREE-GUARD
        run: python bridge_worker_3_1_free.py

      - name: Process one opaque Drive job
        shell: bash
        env:
          GOOGLE_DRIVE_OAUTH_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_JSON }}
        run: |
          set -euo pipefail
          python run_drive_3_1_free_oidc.py

      # No Google Cloud auth, no Neon/database dependency, no paid fallback.
      # User media/transcripts are never uploaded as GitHub workflow artifacts.
