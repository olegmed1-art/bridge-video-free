name: UV003 Runtime Pin Repair CI

on:
  pull_request:
    paths:
      - 'ops/repair_universal_video_runtime_pin.sh'
      - 'tests/test_uv003_runtime_pin_repair_contract.py'
      - '.github/workflows/uv003-runtime-pin-repair-ci.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Validate bounded repair and rollback contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q tests/test_uv003_runtime_pin_repair_contract.py
