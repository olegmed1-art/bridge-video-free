name: Bidding Knowledge v0 CI

on:
  pull_request:
    paths:
      - 'db/migrations/0105_bidding_knowledge_v0.sql'
      - 'db/tests/0105_bidding_knowledge_v0_smoke.sql'
      - 'tests/test_bidding_knowledge_v0_contract.py'
      - '.github/workflows/bidding-knowledge-v0-ci.yml'
  push:
    branches: [main]
    paths:
      - 'db/migrations/0105_bidding_knowledge_v0.sql'
      - 'db/tests/0105_bidding_knowledge_v0_smoke.sql'
      - 'tests/test_bidding_knowledge_v0_contract.py'
      - '.github/workflows/bidding-knowledge-v0-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bidding-knowledge-v0:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: bridge_school_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bridge_school_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bridge_school_ci
      DATABASE_URL: postgresql://bridge_ci_owner:bridge_ci_owner@localhost:5432/bridge_school_ci

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Run static contract checks
        run: |
          python -m py_compile tests/test_bidding_knowledge_v0_contract.py
          python tests/test_bidding_knowledge_v0_contract.py

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client >/dev/null

      - name: Bootstrap managed-owner-compatible CI role
        shell: bash
        run: |
          set -euo pipefail
          psql "$ADMIN_DATABASE_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          CREATE EXTENSION IF NOT EXISTS btree_gist;
          CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
          DO $$
          BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='bridge_ci_owner') THEN
                  CREATE ROLE bridge_ci_owner LOGIN PASSWORD 'bridge_ci_owner' CREATEROLE NOSUPERUSER NOCREATEDB NOREPLICATION;
              END IF;
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='neondb_owner') THEN
                  CREATE ROLE neondb_owner NOLOGIN NOSUPERUSER NOCREATEDB NOREPLICATION;
              END IF;
          END $$;
          GRANT neondb_owner TO bridge_ci_owner;
          ALTER DATABASE bridge_school_ci OWNER TO bridge_ci_owner;
          ALTER SCHEMA public OWNER TO bridge_ci_owner;
          SQL

      - name: Apply base database migrations
        shell: bash
        run: |
          chmod +x database/scripts/migrate.sh
          database/scripts/migrate.sh

      - name: Apply bidding knowledge v0 migration
        shell: bash
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f db/migrations/0105_bidding_knowledge_v0.sql

      - name: Run bidding knowledge v0 smoke test
        shell: bash
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f db/tests/0105_bidding_knowledge_v0_smoke.sql
