name: Tournament teacher test-only

on:
  push:
    branches: ['test/tournament-teacher-canon-20261004']
    paths:
      - 'experiments/tournament_teacher/**'
      - 'bridge_school_api/ai_teacher.py'
      - 'bridge_school_api/tournament_teacher.py'
      - 'bridge_school_api/tournament_teacher_test_adapter.py'
      - '.github/workflows/tournament-teacher-test-only.yml'

permissions:
  contents: read

jobs:
  offline-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: tournament_rehearsal
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - '127.0.0.1:55432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d tournament_rehearsal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest==8.4.2 PyYAML==6.0.2 httpx==0.28.1 fastapi==0.141.1 'psycopg[binary]==3.3.4'
      - name: Exact SHA and isolation preflight
        run: |
          git rev-parse HEAD
          python -m experiments.tournament_teacher.preflight
      - name: Formal teacher, existing API and L1 regression
        run: >-
          python -m pytest -q experiments/tournament_teacher/test_formal_teacher.py
          experiments/tournament_teacher/test_api_integration.py
          tests/test_l1_canonical_registry.py tests/test_l1_canonical_runtime.py
          tests/test_knowledge_read_api.py tests/test_ai_api_routes.py
          tests/test_ai_final_decision_contract.py
      - name: Build two-rule first import package
        run: python -m experiments.tournament_teacher.formal_package > tournament-first-import-package.json
      - name: Apply unchanged schema to disposable PostgreSQL 18
        run: python -m experiments.tournament_teacher.postgres_bootstrap '${{ job.services.postgres.id }}'
      - name: First binding through real gated teacher API and rollback
        run: python -m experiments.tournament_teacher.first_init | tee tournament-first-binding-evidence.json
      - name: Preserve first binding evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tournament-teacher-evidence-${{ github.sha }}
          path: |
            tournament-first-import-package.json
            tournament-first-binding-evidence.json
          retention-days: 7
