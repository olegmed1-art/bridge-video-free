name: Issue 881 one-shot root filesystem expansion

on:
  pull_request:
    paths:
      - '.github/workflows/issue-881-root-filesystem-expand.yml'
      - 'ops/oracle_universal_video_root_filesystem_expand.sh'
      - 'ops/issue-881-root-filesystem-expand-request.json'
      - 'tests/test_issue_881_root_filesystem_expand_contract.py'
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('issue-881-root-expand-pr-{0}', github.run_id) || (github.event.issue.number == 881 && github.event.comment.user.login == 'olegmed1-art' && contains(fromJSON('["/oracle-ops issue-881-expand-root-and-recover-bba508","/oracle-ops issue-881-reconcile-run-33893910685"]'), github.event.comment.body)) && 'oracle-instance-workload-mutation' || format('issue-881-root-expand-noop-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  contract:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {persist-credentials: false}
      - run: |
          set -euo pipefail
          ruby -e "require 'yaml'; YAML.parse_file(ARGV.fetch(0))" .github/workflows/issue-881-root-filesystem-expand.yml
          bash -n ops/oracle_universal_video_root_filesystem_expand.sh
          python - <<'PY'
          import runpy
          for path in (
              'tests/test_issue_881_root_filesystem_expand_contract.py',
              'tests/test_issue_881_current_main_recovery_contract.py',
          ):
              namespace = runpy.run_path(path)
              for name, value in namespace.items():
                  if name.startswith('test_') and callable(value):
                      value()
          PY

  expand-and-recover:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 881 &&
      github.event.comment.user.login == 'olegmed1-art' &&
      contains(fromJSON('["/oracle-ops issue-881-expand-root-and-recover-bba508","/oracle-ops issue-881-reconcile-run-33893910685"]'), github.event.comment.body)
    runs-on: ubuntu-24.04
    # The explicit OCI waiters consume at most 240 minutes: 60 minutes each for
    # backup and restore, five minutes each for five network creates, 30 minutes
    # each for launch and termination, and five minutes for each of six
    # dependency-deletion checks, plus five minutes to verify retirement of all
    # superseded operation backups. A command may spend at most another 30
    # minutes reconciling prior attempts and distinct owner-command runs.
    # GitHub's six-hour ceiling therefore leaves at
    # least 90 minutes for setup, bounded rediscovery, SSH acceptance, recovery,
    # and the
    # EXIT cleanup trap instead of cancelling exactly at the waiter ceiling.
    timeout-minutes: 360
    env:
      ORACLE_HOST: 158.180.47.161
      ORACLE_USER: ubuntu
      EXPECTED_HOSTNAME: bridge-school-dds3-frankfurt
      EXPECTED_FINGERPRINT: SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk
      EXACT_RUNTIME_SHA: bba508350cbe63a7a8ec93fa9c007db9ee9eae6c
      SSH_KEY_ORACLE: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
      OCI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_KEY: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      OCI_REGION: ${{ secrets.OCI_CLI_REGION }}
      GH_TOKEN: ${{ github.token }}
      CLEANUP_ONLY_COMMAND: /oracle-ops issue-881-reconcile-run-33893910685
      OWNER_COMMAND: ${{ github.event.comment.body }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Validate immutable one-shot request
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          expected = {
              'operation': 'expand_existing_root_filesystem',
              'host': '158.180.47.161',
              'hostname': 'bridge-school-dds3-frankfurt',
              'expected_volume_gb': 97,
              'runtime_sha': 'bba508350cbe63a7a8ec93fa9c007db9ee9eae6c',
          }
          assert json.load(open('ops/issue-881-root-filesystem-expand-request.json')) == expected
          PY
      - name: Create fresh full backup and prove isolated restored-root boot acceptance
        id: backup
        run: |
          set -euo pipefail
          for value in OCI_USER OCI_TENANCY OCI_FINGERPRINT OCI_KEY OCI_REGION; do
            [[ -n "${!value:-}" ]] || exit 21
          done
          [[ "$OCI_REGION" == eu-frankfurt-1 ]] || exit 22
          python -m pip install --disable-pip-version-check -q 'oci-cli==3.90.3'
          install -d -m 0700 "$HOME/.oci"
          printf '%s' "$OCI_KEY" | python -c 'import sys; raw=sys.stdin.read().replace("\\r","").replace("\\n","\n"); open(sys.argv[1],"w").write(raw if raw.endswith("\n") else raw+"\n")' "$HOME/.oci/key.pem"
          chmod 0600 "$HOME/.oci/key.pem"
          python - <<'PY'
          import os
          from pathlib import Path
          def scalar(env, key):
              lines=[x.strip() for x in os.environ[env].replace('\r','').splitlines() if x.strip()]
              matches=[x.split('=',1)[1].strip() for x in lines if x.startswith(key+'=')]
              if len(matches)==1 and matches[0]: return matches[0]
              if not matches and len(lines)==1 and '=' not in lines[0]: return lines[0]
              raise SystemExit(f'ambiguous {env}')
          values={'user':scalar('OCI_USER','user'),'fingerprint':scalar('OCI_FINGERPRINT','fingerprint'),'tenancy':scalar('OCI_TENANCY','tenancy'),'region':scalar('OCI_REGION','region')}
          text='[DEFAULT]\n'+''.join(f'{k}={v}\n' for k,v in values.items())+f"key_file={Path.home()/'.oci'/'key.pem'}\n"
          (Path.home()/'.oci'/'config').write_text(text)
          PY
          chmod 0600 "$HOME/.oci/config"
          export OCI_CLI_REGION="$OCI_REGION"
          roots="$(oci iam compartment list --include-root --all --output json)"
          tenancy_id="$(printf '%s' "$roots" | python -c 'import json,sys; xs=[x["id"] for x in json.load(sys.stdin)["data"] if x.get("id","").startswith("ocid1.tenancy.")]; assert len(xs)==1; print(xs[0])')"
          instances="$(oci compute instance list --compartment-id "$tenancy_id" --display-name bridge-school-dds3-frankfurt --all --output json)"
          instance_id="$(printf '%s' "$instances" | python -c 'import json,sys; xs=[x for x in json.load(sys.stdin)["data"] if x.get("lifecycle-state") not in {"TERMINATED","TERMINATING"}]; assert len(xs)==1; print(xs[0]["id"])')"
          instance_json="$(oci compute instance get --instance-id "$instance_id" --output json)"
          INSTANCE="$instance_json" python - <<'PY'
          import json,os
          d=json.loads(os.environ['INSTANCE'])['data']
          assert d['display-name']=='bridge-school-dds3-frankfurt'
          assert d['lifecycle-state']=='RUNNING'
          assert d['compartment-id'].startswith('ocid1.tenancy.')
          PY
          ad="$(printf '%s' "$instance_json" | python -c 'import json,sys; print(json.load(sys.stdin)["data"]["availability-domain"])')"
          attachments="$(oci compute boot-volume-attachment list --compartment-id "$tenancy_id" --availability-domain "$ad" --instance-id "$instance_id" --all --output json)"
          boot_id="$(printf '%s' "$attachments" | python -c 'import json,sys; xs=[x for x in json.load(sys.stdin)["data"] if x.get("lifecycle-state")=="ATTACHED"]; assert len(xs)==1; print(xs[0]["boot-volume-id"])')"
          boot_size="$(oci bv boot-volume get --boot-volume-id "$boot_id" --query 'data."size-in-gbs"' --raw-output)"
          [[ "$boot_size" == 97 ]] || exit 30
          source_vnics="$(oci compute vnic-attachment list --compartment-id "$tenancy_id" --instance-id "$instance_id" --all --output json)"
          source_vnic_id="$(printf '%s' "$source_vnics" | python -c 'import json,sys; xs=[x["vnic-id"] for x in json.load(sys.stdin)["data"] if x.get("lifecycle-state")=="ATTACHED"]; assert len(xs)==1; print(xs[0])')"
          source_vnic_json="$(oci network vnic get --vnic-id "$source_vnic_id" --output json)"
          source_public_ip="$(printf '%s' "$source_vnic_json" | python -c 'import json,sys; print(json.load(sys.stdin)["data"].get("public-ip") or "")')"
          [[ "$source_public_ip" == "$ORACLE_HOST" ]] || exit 34
          shape="$(printf '%s' "$instance_json" | python -c 'import json,sys; print(json.load(sys.stdin)["data"]["shape"])')"
          shape_config="$(printf '%s' "$instance_json" | python -c 'import json,sys; d=json.load(sys.stdin)["data"].get("shape-config") or {}; print(json.dumps({"ocpus":d.get("ocpus"),"memoryInGBs":d.get("memory-in-gbs")},separators=(",",":")))')"
          boot_tag="$(printf '%s' "$boot_id" | sha256sum | cut -c1-16)"
          backup_prefix="issue-881-root-recovery-${boot_tag}"
          operation_run_prefix="${backup_prefix}-run-"
          run_prefix="${operation_run_prefix}${GITHUB_RUN_ID}"
          prior_prefix="$operation_run_prefix"
          stamp="${run_prefix}-a${GITHUB_RUN_ATTEMPT}"
          backup_name="${backup_prefix}-${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          cleanup_only=0
          target_prior_stamp=""
          failed_run_backup_name=""
          if [[ "$OWNER_COMMAND" == "$CLEANUP_ONLY_COMMAND" ]]; then
            cleanup_only=1
            target_prior_stamp="${operation_run_prefix}33893910685-a1"
            failed_run_backup_name="${backup_prefix}-33893910685-a1"
          fi
          backup_id="" restored_id="" drill_instance_id="" drill_public_ip="" drill_started=""
          backup_attempted=0 backup_created_by_run=0 backup_accepted=0
          drill_vcn_id="" drill_ig_id="" drill_route_id="" drill_security_id="" drill_subnet_id=""
          restored_attempted=0 drill_vcn_attempted=0 drill_ig_attempted=0
          drill_route_attempted=0 drill_security_attempted=0 drill_subnet_attempted=0
          receipt_state="$RUNNER_TEMP/issue-881-step4-state.json"
          state_set() {
            STATE_PATH="$receipt_state" STATE_KEY="$1" STATE_VALUE="$2" python - <<'PY'
          import json, os
          from pathlib import Path

          path = Path(os.environ['STATE_PATH'])
          data = json.loads(path.read_text()) if path.exists() else {}
          data[os.environ['STATE_KEY']] = os.environ['STATE_VALUE']
          temporary = path.with_suffix('.tmp')
          temporary.write_text(json.dumps(data, sort_keys=True))
          temporary.replace(path)
          PY
          }
          mark_phase() {
            phase="$1"
            state_set phase "$1"
          }
          state_set run_stamp "$stamp"
          state_set backup_name "$backup_name"
          state_set source_instance_id "$instance_id"
          state_set source_boot_id "$boot_id"
          state_set cleanup_only "$cleanup_only"
          state_set target_prior_stamp "${target_prior_stamp:-none}"
          state_set prior_cleanup_status NOT_STARTED
          state_set current_cleanup_status NOT_STARTED
          state_set backup_selection_status NOT_STARTED
          state_set backup_selection_failure_rc none
          state_set backup_candidate_count 0
          state_set backup_candidate_ids none
          state_set backup_ineligible_candidate_ids none
          mark_phase initialized
          discover_named_id() {
            local resource="$1" expected="$2" output id
            local -a command
            for _ in $(seq 1 6); do
              case "$resource" in
                backup) command=(oci bv boot-volume-backup list --compartment-id "$tenancy_id" --boot-volume-id "$boot_id" --all) ;;
                boot-volume) command=(oci bv boot-volume list --compartment-id "$tenancy_id" --availability-domain "$ad" --all) ;;
                instance) command=(oci compute instance list --compartment-id "$tenancy_id" --display-name "$expected" --all) ;;
                vcn) command=(oci network vcn list --compartment-id "$tenancy_id" --all) ;;
                internet-gateway) command=(oci network internet-gateway list --compartment-id "$tenancy_id" --vcn-id "$drill_vcn_id" --all) ;;
                route-table) command=(oci network route-table list --compartment-id "$tenancy_id" --vcn-id "$drill_vcn_id" --all) ;;
                security-list) command=(oci network security-list list --compartment-id "$tenancy_id" --vcn-id "$drill_vcn_id" --all) ;;
                subnet) command=(oci network subnet list --compartment-id "$tenancy_id" --vcn-id "$drill_vcn_id" --all) ;;
                *) return 2 ;;
              esac
              oci_json_request "${command[@]}" || return 1
              output="$OCI_JSON_OUTPUT"
              id="$(EXPECTED_DISPLAY_NAME="$expected" python -c 'import json,os,sys; xs=[x["id"] for x in json.load(sys.stdin).get("data",[]) if x.get("display-name")==os.environ["EXPECTED_DISPLAY_NAME"] and x.get("lifecycle-state") not in {"TERMINATED","TERMINATING"}]; assert len(xs)<=1; print(xs[0] if xs else "")' <<<"$output")" || return 1
              if [[ -n "$id" ]]; then
                printf '%s\n' "$id"
                return 0
              fi
              sleep 5
            done
            return 0
          }
          wait_absent() {
            local resource="$1" id="$2" loops="${3:-60}" output state
            local -a command
            for _ in $(seq 1 "$loops"); do
              case "$resource" in
                boot-volume) command=(oci bv boot-volume get --boot-volume-id "$id") ;;
                backup) command=(oci bv boot-volume-backup get --boot-volume-backup-id "$id") ;;
                subnet) command=(oci network subnet get --subnet-id "$id") ;;
                security-list) command=(oci network security-list get --security-list-id "$id") ;;
                route-table) command=(oci network route-table get --rt-id "$id") ;;
                internet-gateway) command=(oci network internet-gateway get --ig-id "$id") ;;
                vcn) command=(oci network vcn get --vcn-id "$id") ;;
                *) return 2 ;;
              esac
              if oci_json_request "${command[@]}"; then
                output="$OCI_JSON_OUTPUT"
                state="$(printf '%s' "$output" | python -c 'import json,sys; print(json.load(sys.stdin).get("data",{}).get("lifecycle-state", ""))')" || return 1
                if [[ "$state" == TERMINATED ]]; then
                  echo "UV_ROOT_RESOURCE_ABSENCE_PASS resource=$resource id=$id terminal_state=TERMINATED"
                  return 0
                fi
                sleep 5
                continue
              fi
              # Treat only OCI's explicit not-found response as deletion.
              # Authentication, throttling and transport failures remain fatal.
              output="$OCI_JSON_ERROR"
              if grep -Fq 'NotAuthorizedOrNotFound' <<<"$output" \
                  && grep -Eq "['\"]status['\"][[:space:]]*:[[:space:]]*404" <<<"$output"; then
                echo "UV_ROOT_RESOURCE_ABSENCE_PASS resource=$resource id=$id terminal_state=NOT_FOUND"
                return 0
              fi
              return 1
            done
            return 1
          }
          wait_all_absent() {
            local resource="$1" loops="$2" output pending id state
            shift 2
            local -a command ids=("$@")
            (( ${#ids[@]} > 0 )) || return 0
            for _ in $(seq 1 "$loops"); do
              pending=0
              for id in "${ids[@]}"; do
                case "$resource" in
                  boot-volume) command=(oci bv boot-volume get --boot-volume-id "$id") ;;
                  backup) command=(oci bv boot-volume-backup get --boot-volume-backup-id "$id") ;;
                  subnet) command=(oci network subnet get --subnet-id "$id") ;;
                  security-list) command=(oci network security-list get --security-list-id "$id") ;;
                  route-table) command=(oci network route-table get --rt-id "$id") ;;
                  internet-gateway) command=(oci network internet-gateway get --ig-id "$id") ;;
                  vcn) command=(oci network vcn get --vcn-id "$id") ;;
                  *) return 2 ;;
                esac
                if oci_json_request "${command[@]}"; then
                  output="$OCI_JSON_OUTPUT"
                  state="$(printf '%s' "$output" | python -c 'import json,sys; print(json.load(sys.stdin).get("data",{}).get("lifecycle-state", ""))')" || return 1
                  if [[ "$state" == TERMINATED ]]; then
                    echo "UV_ROOT_RESOURCE_ABSENCE_PASS resource=$resource id=$id terminal_state=TERMINATED"
                  else
                    pending=1
                  fi
                else
                  output="$OCI_JSON_ERROR"
                  if ! grep -Fq 'NotAuthorizedOrNotFound' <<<"$output" \
                      || ! grep -Eq "['\"]status['\"][[:space:]]*:[[:space:]]*404" <<<"$output"; then
                    return 1
                  fi
                  echo "UV_ROOT_RESOURCE_ABSENCE_PASS resource=$resource id=$id terminal_state=NOT_FOUND"
                fi
              done
              (( pending == 0 )) && return 0
              sleep 5
            done
            return 1
          }
          wait_instance_terminated() {
            local id="$1" loops="${2:-360}" output state
            for _ in $(seq 1 "$loops"); do
              if oci_json_request oci compute instance get --instance-id "$id"; then
                output="$OCI_JSON_OUTPUT"
                state="$(printf '%s' "$output" | python -c 'import json,sys; print(json.load(sys.stdin)["data"]["lifecycle-state"])')" || return 1
                [[ "$state" == TERMINATED ]] && return 0
                sleep 5
                continue
              fi
              output="$OCI_JSON_ERROR"
              if grep -Fq 'NotAuthorizedOrNotFound' <<<"$output" \
                  && grep -Eq "['\"]status['\"][[:space:]]*:[[:space:]]*404" <<<"$output"; then
                return 0
              fi
              return 1
            done
            return 1
          }
          # OCI CLI may emit harmless API-key/security warnings on stderr even
          # when a request succeeds. Keep JSON stdout isolated so warnings can
          # never corrupt parsing, while retaining stderr exclusively for
          # explicit error/404 classification.
          oci_json_request() {
            local stdout_file="$RUNNER_TEMP/issue-881-oci-json.stdout"
            local stderr_file="$RUNNER_TEMP/issue-881-oci-json.stderr"
            local attempt rc max_attempts="${OCI_JSON_MAX_ATTEMPTS:-6}"
            local retry_delay_seconds="${OCI_JSON_RETRY_DELAY_SECONDS:-5}"
            for attempt in $(seq 1 "$max_attempts"); do
              : >"$stdout_file"
              : >"$stderr_file"
              if "$@" --output json >"$stdout_file" 2>"$stderr_file"; then
                rc=0
              else
                rc=$?
              fi
              OCI_JSON_OUTPUT="$(<"$stdout_file")"
              OCI_JSON_ERROR="$(<"$stderr_file")"
              # A nonzero request is a real OCI error. Preserve its stderr for
              # exact 404 classification; auth/throttle/transport fail closed.
              (( rc == 0 )) || return "$rc"
              # OCI can transiently return rc=0 with empty/malformed stdout.
              # Retry only that condition; never reinterpret it as absence.
              if printf '%s' "$OCI_JSON_OUTPUT" | python -c 'import json,sys; d=json.load(sys.stdin); assert isinstance(d,dict)'; then
                return 0
              fi
              OCI_JSON_ERROR=INVALID_JSON_SUCCESS_RESPONSE
              (( attempt < max_attempts )) && sleep "$retry_delay_seconds"
            done
            return 86
          }
          operation_backup_inventory() {
            local rc
            if oci_json_request oci bv boot-volume-backup list --compartment-id "$tenancy_id" --boot-volume-id "$boot_id" --all; then
              printf '%s\n' "$OCI_JSON_OUTPUT"
              return 0
            else
              rc=$?
            fi
            return "$rc"
          }
          select_fresh_operation_backups() {
            BACKUP_PREFIX="$backup_prefix" BOOT_ID="$boot_id" python -c 'import datetime,json,os,sys; now=datetime.datetime.now(datetime.timezone.utc); candidates=[]; ineligible=[]; invalid=[]; payload=json.load(sys.stdin); data=payload.get("data"); assert isinstance(data,list) and all(isinstance(x,dict) for x in data)
          for x in data:
            if not (x.get("display-name") or "").startswith(os.environ["BACKUP_PREFIX"]+"-") or x.get("boot-volume-id")!=os.environ["BOOT_ID"] or x.get("lifecycle-state")!="AVAILABLE": continue
            try:
              backup_id=x["id"]; created=datetime.datetime.fromisoformat(x["time-created"].replace("Z","+00:00")); age=(now-created).total_seconds(); assert isinstance(backup_id,str) and backup_id and isinstance(x.get("type"),str) and isinstance(x.get("size-in-gbs"),int)
            except (AssertionError,KeyError,TypeError,ValueError): invalid.append(str(x.get("id") or "missing-id"))
            else:
              if age < 0: invalid.append(backup_id)
              else: (candidates if x["type"]=="FULL" and x["size-in-gbs"]==97 and age < 86400 else ineligible).append((created,backup_id))
          candidates.sort(reverse=True); print(json.dumps({"candidate_ids":[x[1] for x in candidates],"ineligible_ids":sorted(x[1] for x in ineligible),"invalid_ids":sorted(invalid),"selected_id":candidates[0][1] if candidates else ""},sort_keys=True,separators=(",",":")))'
          }
          superseded_operation_backups() {
            BACKUP_PREFIX="$backup_prefix" BOOT_ID="$boot_id" RETAINED_ID="$backup_id" python -c 'import json,os,sys; xs=sorted(x["id"] for x in json.load(sys.stdin).get("data",[]) if (x.get("display-name") or "").startswith(os.environ["BACKUP_PREFIX"]+"-") and x.get("boot-volume-id")==os.environ["BOOT_ID"] and x["id"]!=os.environ["RETAINED_ID"] and x.get("lifecycle-state")!="TERMINATED"); print("\n".join(xs))'
          }
          prior_named_ids() {
            local resource="$1" suffix="$2" output
            local -a command
            case "$resource" in
              instance) command=(oci compute instance list --compartment-id "$tenancy_id" --all) ;;
              boot-volume) command=(oci bv boot-volume list --compartment-id "$tenancy_id" --availability-domain "$ad" --all) ;;
              subnet) command=(oci network subnet list --compartment-id "$tenancy_id" --all) ;;
              security-list) command=(oci network security-list list --compartment-id "$tenancy_id" --all) ;;
              route-table) command=(oci network route-table list --compartment-id "$tenancy_id" --all) ;;
              internet-gateway) command=(oci network internet-gateway list --compartment-id "$tenancy_id" --all) ;;
              vcn) command=(oci network vcn list --compartment-id "$tenancy_id" --all) ;;
              *) return 2 ;;
            esac
            oci_json_request "${command[@]}" || return 1
            output="$OCI_JSON_OUTPUT"
            # Keep TERMINATED objects in the evidence set.  Each known ID must
            # still pass a direct GET as TERMINATED or explicit 404 below;
            # silently filtering terminal objects would discard the audit trail.
            PRIOR_PREFIX="$prior_prefix" CURRENT_STAMP="$stamp" TARGET_PRIOR_STAMP="$target_prior_stamp" SUFFIX="-$suffix" python -c 'import json,os,sys; xs=sorted(x["id"] for x in json.load(sys.stdin).get("data",[]) if (x.get("display-name") or "").startswith(os.environ["PRIOR_PREFIX"]) and not (x.get("display-name") or "").startswith(os.environ["CURRENT_STAMP"]+"-") and (not os.environ["TARGET_PRIOR_STAMP"] or (x.get("display-name") or "").startswith(os.environ["TARGET_PRIOR_STAMP"]+"-")) and (x.get("display-name") or "").endswith(os.environ["SUFFIX"])); print("\n".join(xs))' <<<"$output"
          }
          reconcile_prior_attempt_resources() {
            local prior_instances prior_restored prior_subnets prior_security prior_routes prior_igs prior_vcns id prior_ids prior_count
            local -a ids
            state_set prior_cleanup_status IN_PROGRESS
            mark_phase reconcile_prior_attempts
            prior_instances="$(prior_named_ids instance boot-acceptance)"
            prior_restored="$(prior_named_ids boot-volume restore)"
            prior_subnets="$(prior_named_ids subnet subnet)"
            prior_security="$(prior_named_ids security-list ssh-only)"
            prior_routes="$(prior_named_ids route-table route)"
            prior_igs="$(prior_named_ids internet-gateway ig)"
            prior_vcns="$(prior_named_ids vcn vcn)"
