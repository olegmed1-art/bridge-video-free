          oci network subnet get --subnet-id "$drill_subnet_id" --wait-for-state AVAILABLE --max-wait-seconds 300 >/dev/null
          mark_phase launch_isolated_acceptance_instance
          launch="$(oci compute instance launch --availability-domain "$ad" --compartment-id "$tenancy_id" --subnet-id "$drill_subnet_id" --shape "$shape" --shape-config "$shape_config" --display-name "$stamp-boot-acceptance" --source-details "{\"sourceType\":\"bootVolume\",\"bootVolumeId\":\"$restored_id\"}" --assign-public-ip true --output json)"
          drill_instance_id="$(printf '%s' "$launch" | python -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])')"
          state_set temporary_instance_id "$drill_instance_id"
          oci compute instance get --instance-id "$drill_instance_id" --wait-for-state RUNNING --max-wait-seconds 1800 >/dev/null
          drill_started="$(date -u +%s)"
          drill_vnic_id="$(oci compute vnic-attachment list --compartment-id "$tenancy_id" --instance-id "$drill_instance_id" --all --query 'data[?"lifecycle-state"==`ATTACHED`]."vnic-id" | [0]' --raw-output)"
          drill_public_ip="$(oci network vnic get --vnic-id "$drill_vnic_id" --query 'data."public-ip"' --raw-output)"
          [[ "$drill_public_ip" =~ ^[0-9]+(\.[0-9]+){3}$ ]] || exit 31
          known="$RUNNER_TEMP/drill-known-hosts"
          for _ in $(seq 1 60); do
            if ops/oracle_known_hosts_from_scan.sh "$drill_public_ip" "$EXPECTED_FINGERPRINT" "$known" 2>/dev/null; then break; fi
            sleep 5
          done
          [[ -s "$known" ]] || exit 32
          key="$RUNNER_TEMP/id_oracle-drill"
          printf '%s\n' "$SSH_KEY_ORACLE" > "$key"; chmod 0600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          acceptance="$(ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" -o ConnectTimeout=15 "$ORACLE_USER@$drill_public_ip" 'set -e; test -r /etc/os-release; findmnt -n -o SOURCE,FSTYPE /; test "$(findmnt -n -o OPTIONS /)" != ""; test -r /var/lib/bridge-school; echo UV_RESTORED_ROOT_BOOT_ACCEPTANCE_PASS')"
          grep -Fq UV_RESTORED_ROOT_BOOT_ACCEPTANCE_PASS <<<"$acceptance"
          backup_accepted=1
          state_set backup_accepted true
          drill_seconds="$(( $(date -u +%s) - drill_started ))"
          if ! cleanup_temp_resources; then
            # Do not invoke the EXIT trap a second time after a fully bounded
            # explicit cleanup attempt; fail closed with the retained IDs/name
            # stamp available in this run's log for operator reconciliation.
            trap - EXIT
            echo 'UV_ROOT_TEMP_CLEANUP_INCOMPLETE' >&2
            exit 90
          fi
          drill_instance_id=""; restored_id=""; drill_subnet_id=""; drill_security_id=""
          drill_route_id=""; drill_ig_id=""; drill_vcn_id=""
          trap - EXIT
          state_set current_cleanup_status PROVEN_ABSENT
          # Retire older operation-scoped backups only after the retained FULL
          # backup has passed isolated restored-root boot acceptance. This keeps
          # rollback coverage throughout replacement and bounds billable storage
          # to one proven recovery point across separate owner commands.
          backup_inventory="$(operation_backup_inventory)"
          superseded_ids="$(printf '%s' "$backup_inventory" | superseded_operation_backups)"
          if [[ -n "$superseded_ids" ]]; then
            readarray -t ids <<<"$superseded_ids"
            for id in "${ids[@]}"; do
              oci bv boot-volume-backup delete --boot-volume-backup-id "$id" --force >/dev/null 2>&1 || true
            done
            wait_all_absent backup 60 "${ids[@]}"
          fi
          echo 'superseded_backup_count=0' >> "$GITHUB_OUTPUT"
          state_set superseded_backup_count 0
          state_set retained_backup_id "$backup_id"
          mark_phase backup_gate_pass
          # Expose the backup as a retained proven point only after acceptance
          # and bounded retirement have both succeeded.  Failed steps therefore
          # cannot publish a deleted or unaccepted backup as retained evidence.
          echo "backup_id=$backup_id" >> "$GITHUB_OUTPUT"
          echo "source_boot_id=$boot_id" >> "$GITHUB_OUTPUT"
          echo "source_instance_id=$instance_id" >> "$GITHUB_OUTPUT"
          echo "temporary_instance_seconds=$drill_seconds" >> "$GITHUB_OUTPUT"
          echo 'UV_ROOT_BACKUP_GATE_PASS type=FULL size_gb=97 state=AVAILABLE age_lt_24h=true restored_root_boot_acceptance=true isolated_no_egress_network=true source_public_ip_bound=true temporary_instance_deleted=true temporary_volume_deleted=true temporary_network_deleted=true temporary_paid_capacity_authorized=true'
      - name: Resolve pinned SSH identity
        if: ${{ steps.backup.outputs.cleanup_only != 'true' }}
        id: ssh
        run: |
          set -euo pipefail
          known="$RUNNER_TEMP/known_hosts"
          ops/oracle_known_hosts_from_scan.sh "$ORACLE_HOST" "$EXPECTED_FINGERPRINT" "$known"
          key="$RUNNER_TEMP/id_oracle"
          printf '%s\n' "$SSH_KEY_ORACLE" > "$key"
          chmod 0600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          echo "known=$known" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Create and restore-test partition recovery point
        if: ${{ steps.backup.outputs.cleanup_only != 'true' }}
        run: |
          set -euo pipefail
          ssh -i '${{ steps.ssh.outputs.key }}' -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='${{ steps.ssh.outputs.known }}' -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST" \
            "sudo -n env EXPECTED_HOSTNAME='$EXPECTED_HOSTNAME' EXPECTED_MIN_DISK_BYTES=90000000000 EXPECTED_MAX_DISK_BYTES=105000000000 MIN_FREE_KB=5242880 CHECKPOINT_ONLY=1 /bin/bash -s" \
            < ops/oracle_universal_video_root_filesystem_expand.sh | tee "$RUNNER_TEMP/root-checkpoint.txt"
          line="$(grep -E '^UV_ROOT_CHECKPOINT_PASS disk_bytes=[0-9]+ checkpoint=/var/lib/bridge-school/root-partition-recovery/issue-881-before-expand\.sfdisk sha256=[0-9a-f]{64}$' "$RUNNER_TEMP/root-checkpoint.txt")"
          disk_bytes="$(sed -E 's/^.*disk_bytes=([0-9]+).*$/\1/' <<<"$line")"
          expected_sha="$(sed -E 's/^.*sha256=([0-9a-f]{64})$/\1/' <<<"$line")"
          ssh -i '${{ steps.ssh.outputs.key }}' -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='${{ steps.ssh.outputs.known }}' -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST" \
            'sudo -n cat /var/lib/bridge-school/root-partition-recovery/issue-881-before-expand.sfdisk' > "$RUNNER_TEMP/root-before.sfdisk"
          [[ "$(sha256sum "$RUNNER_TEMP/root-before.sfdisk" | awk '{print $1}')" == "$expected_sha" ]]
          truncate -s "$disk_bytes" "$RUNNER_TEMP/restore-test.img"
          sudo sfdisk "$RUNNER_TEMP/restore-test.img" < "$RUNNER_TEMP/root-before.sfdisk"
          sudo sfdisk --verify "$RUNNER_TEMP/restore-test.img"
          rm -f "$RUNNER_TEMP/restore-test.img"
      - name: Retain recovery point
        if: ${{ steps.backup.outputs.cleanup_only != 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-881-root-partition-recovery-${{ github.sha }}
          path: ${{ runner.temp }}/root-before.sfdisk
          if-no-files-found: error
          retention-days: 30
      - name: Reconcile current main immediately before mutation
        if: ${{ steps.backup.outputs.cleanup_only != 'true' }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]]
          export OCI_CLI_REGION="$OCI_REGION"
          instance_id='${{ steps.backup.outputs.source_instance_id }}'
          boot_id='${{ steps.backup.outputs.source_boot_id }}'
          backup_id='${{ steps.backup.outputs.backup_id }}'
          instance_json="$(oci compute instance get --instance-id "$instance_id" --output json)"
          INSTANCE="$instance_json" python - <<'PY'
          import json,os
          d=json.loads(os.environ['INSTANCE'])['data']
          assert d['display-name']=='bridge-school-dds3-frankfurt'
          assert d['lifecycle-state']=='RUNNING'
          PY
          ad="$(printf '%s' "$instance_json" | python -c 'import json,sys; print(json.load(sys.stdin)["data"]["availability-domain"])')"
          tenancy_id="$(printf '%s' "$instance_json" | python -c 'import json,sys; print(json.load(sys.stdin)["data"]["compartment-id"])')"
          source_vnics="$(oci compute vnic-attachment list --compartment-id "$tenancy_id" --instance-id "$instance_id" --all --output json)"
          source_vnic_id="$(printf '%s' "$source_vnics" | python -c 'import json,sys; xs=[x["vnic-id"] for x in json.load(sys.stdin)["data"] if x.get("lifecycle-state")=="ATTACHED"]; assert len(xs)==1; print(xs[0])')"
          source_public_ip="$(oci network vnic get --vnic-id "$source_vnic_id" --query 'data."public-ip"' --raw-output)"
          [[ "$source_public_ip" == "$ORACLE_HOST" ]]
          attachments="$(oci compute boot-volume-attachment list --compartment-id "$tenancy_id" --availability-domain "$ad" --instance-id "$instance_id" --all --output json)"
          ATTACHMENTS="$attachments" BOOT_ID="$boot_id" python - <<'PY'
          import json,os
          xs=[x for x in json.loads(os.environ['ATTACHMENTS'])['data'] if x.get('lifecycle-state')=='ATTACHED' and x.get('boot-volume-id')==os.environ['BOOT_ID']]
          assert len(xs)==1
          PY
          boot_size="$(oci bv boot-volume get --boot-volume-id "$boot_id" --query 'data."size-in-gbs"' --raw-output)"
          [[ "$boot_size" == 97 ]]
          backup="$(oci bv boot-volume-backup get --boot-volume-backup-id "$backup_id" --output json)"
          BACKUP="$backup" BOOT_ID="$boot_id" python - <<'PY'
          import datetime,json,os
          d=json.loads(os.environ['BACKUP'])['data']
          assert d['boot-volume-id']==os.environ['BOOT_ID'] and d['lifecycle-state']=='AVAILABLE' and d['type']=='FULL' and d['size-in-gbs']==97
          created=datetime.datetime.fromisoformat(d['time-created'].replace('Z','+00:00'))
          assert (datetime.datetime.now(datetime.timezone.utc)-created).total_seconds() < 86400
          PY
          echo 'UV_ROOT_LAST_SECOND_REVALIDATION_PASS attachment=true source_public_ip_bound=true backup_available=true backup_age_lt_24h=true restored_root_boot_acceptance=true'
      - name: Expand root and recover exact image under shared host lock
        if: ${{ steps.backup.outputs.cleanup_only != 'true' }}
        id: mutation
        run: |
          set -euo pipefail
          mutation="$RUNNER_TEMP/issue-881-locked-mutation.sh"
          {
            cat ops/oracle_universal_video_root_filesystem_expand.sh
            printf '\n'
            cat ops/oracle_universal_video_container_missing_image_recover.sh
          } > "$mutation"
          ssh -i '${{ steps.ssh.outputs.key }}' -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='${{ steps.ssh.outputs.known }}' -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST" \
            "sudo -n env EXPECTED_HOSTNAME='$EXPECTED_HOSTNAME' EXPECTED_MIN_DISK_BYTES=90000000000 EXPECTED_MAX_DISK_BYTES=105000000000 MIN_FREE_KB=5242880 UNIVERSAL_VIDEO_EXPECTED_SHA='$EXACT_RUNTIME_SHA' /usr/bin/flock -x /run/lock/oracle-workload-mutation.lock /bin/bash -s" \
            < "$mutation" | tee "$RUNNER_TEMP/locked-mutation.txt"
          grep -E '^UV_ROOT_EXPAND_PASS .*disk_bytes=[0-9]+ .*free_kb_after=[0-9]+$' "$RUNNER_TEMP/locked-mutation.txt"
          grep -E '^UV_CONTAINER_RECOVERY_PASS runtime_sha=[0-9a-f]{40} backup=/var/lib/bridge-school/universal-video-container-recovery/[^ ]+ image_digest=sha256:[0-9a-f]{64}$' "$RUNNER_TEMP/locked-mutation.txt"
      - name: Publish bounded operational receipt
        if: ${{ always() }}
        env:
          BACKUP_OUTCOME: ${{ steps.backup.outcome }}
          BACKUP_ID: ${{ steps.backup.outputs.backup_id }}
          SUPERSEDED_BACKUP_COUNT: ${{ steps.backup.outputs.superseded_backup_count }}
          TEMP_INSTANCE_SECONDS: ${{ steps.backup.outputs.temporary_instance_seconds }}
          JOB_STATUS: ${{ job.status }}
          MUTATION_OUTCOME: ${{ steps.mutation.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/issue-881-root-expand-receipt.md"
          STATE_PATH="$RUNNER_TEMP/issue-881-step4-state.json" BODY_PATH="$body" python - <<'PY'
          import json, os
          from pathlib import Path

          state_path = Path(os.environ['STATE_PATH'])
          state = json.loads(state_path.read_text()) if state_path.exists() else {}
          def value(key, fallback='unknown'):
              return str(state.get(key) or fallback)
          def code(text):
              return '`' + str(text).replace('`', "'") + '`'

          backup_id = os.environ.get('BACKUP_ID') or state.get('retained_backup_id')
          lines = [
              '## Issue #881 guarded root expansion and exact-image recovery',
              '',
              '- operation: ' + code('FAILED_RUN_RECONCILIATION_ONLY' if value('cleanup_only', '0') == '1' else 'EXPAND_AND_RECOVER'),
              '- workflow outcome: ' + code(os.environ['JOB_STATUS']),
              '- fresh 97 GB FULL backup gate: ' + code('NOT_APPLICABLE' if value('cleanup_only', '0') == '1' else os.environ['BACKUP_OUTCOME']),
              '- last recorded phase: ' + code(value('phase')),
              '- failing phase before cleanup: ' + code(value('failure_phase', 'none')),
              '- failure rc: ' + code(value('failure_rc', 'none')),
              '- prior-run reconciliation: ' + code(value('prior_cleanup_status', 'NOT_RECORDED')),
              '- prior-run exact resource count: ' + code(value('prior_resource_count', 'unknown')),
              '- prior-run exact resource IDs: ' + code(value('prior_resource_ids', 'none')),
              '- prior-run exact typed resources: ' + code(value('prior_resource_summary', 'none')),
              '- failed-run backup cleanup: ' + code(value('failed_run_backup_cleanup_status', 'NOT_APPLICABLE')),
              '- failed-run backup IDs: ' + code(value('failed_run_backup_ids', 'none')),
              '- failed-run backup direct-GET states: ' + code(value('failed_run_backup_direct_get_states', 'not_listed')),
              '- backup selection status: ' + code(value('backup_selection_status', 'NOT_RECORDED')),
              '- backup selection failure rc: ' + code(value('backup_selection_failure_rc', 'none')),
              '- reusable backup candidate count: ' + code(value('backup_candidate_count', '0')),
              '- reusable backup candidate IDs: ' + code(value('backup_candidate_ids', 'none')),
              '- ineligible backup candidate IDs: ' + code(value('backup_ineligible_candidate_ids', 'none')),
              '- invalid backup metadata IDs: ' + code(value('backup_invalid_candidate_ids', 'none')),
              '- current-run temporary cleanup: ' + code(value('current_cleanup_status', 'NOT_RECORDED')),
              '- current-run stamp: ' + code(value('run_stamp')),
              '- temporary instance ID: ' + code(value('temporary_instance_id', 'none')),
              '- temporary restored-volume ID: ' + code(value('temporary_restored_volume_id', 'none')),
              '- temporary VCN ID: ' + code(value('temporary_vcn_id', 'none')),
              '- temporary internet-gateway ID: ' + code(value('temporary_internet_gateway_id', 'none')),
              '- temporary route-table ID: ' + code(value('temporary_route_table_id', 'none')),
              '- temporary security-list ID: ' + code(value('temporary_security_list_id', 'none')),
              '- temporary subnet ID: ' + code(value('temporary_subnet_id', 'none')),
              '- post-cleanup allocation summary: ' + code(value('allocation_summary', 'not_collected')),
          ]
          if backup_id and value('cleanup_only', '0') == '1':
              lines.append('- backup candidate retained: ' + code('AVAILABLE_FULL_97GB_REQUIRES_NEW_ISOLATED_BOOT_ACCEPTANCE') + '; candidate ID: ' + code(backup_id) + ' (billable backup storage may apply)')
          elif backup_id:
              lines.append('- fresh backup retained: ' + code('true') + '; accepted backup ID: ' + code(backup_id) + ' (billable backup storage may apply)')
          else:
              lines.append('- fresh backup retained: ' + code('false_or_unproven') + '; no accepted backup ID was emitted')
          lines += [
              '- superseded operation backups remaining: ' + code(os.environ.get('SUPERSEDED_BACKUP_COUNT') or value('superseded_backup_count')),
              '- temporary instance runtime seconds: ' + code(os.environ.get('TEMP_INSTANCE_SECONDS') or 'unknown'),
              '- locked host mutation outcome: ' + code(os.environ.get('MUTATION_OUTCOME') or 'skipped'),
              '- shared host fence: ' + code('/run/lock/oracle-workload-mutation.lock'),
              '- exact monetary charge: ' + code('PENDING_OCI_BILLING_EXPORT'),
              '- media canary: ' + code('false'),
              '- supersedes malformed failure receipt: https://github.com/olegmed1-art/bridge-video-free/issues/881#issuecomment-5543399377',
              '- run: ' + os.environ['RUN_URL'],
          ]
          Path(os.environ['BODY_PATH']).write_text('\n'.join(lines) + '\n')
          PY
          gh issue comment 881 --repo "$GITHUB_REPOSITORY" --body-file "$body"
