name: Oracle Light PostgreSQL certificate health

on:
  schedule:
    - cron: '19 5 * * *'
  push:
    branches: [main]
    paths: ['ops/test_oracle_light_tls.py', '.github/workflows/oracle-light-pg-certificate-health.yml', 'ops/oracle_light_pg_certificate_check.py']
  workflow_dispatch:
  pull_request:
    paths: ['ops/test_oracle_light_tls.py', '.github/workflows/oracle-light-pg-certificate-health.yml', 'ops/oracle_light_pg_certificate_check.py']

permissions:
  contents: read

concurrency:
  group: oracle-light-pg-certificate-health
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: python -m py_compile ops/oracle_light_pg_certificate_check.py
      - run: python ops/test_oracle_light_tls.py
      - name: Validate shell syntax
        run: |
          ruby -ryaml -e 'd=YAML.load_file(ARGV[0]); d.fetch("jobs").each_value { |j| j.fetch("steps").each { |s| next unless s["run"]; IO.popen(["bash", "-n"], "w") { |p| p.write(s["run"]) }; abort "invalid shell" unless $?.success? } }' .github/workflows/oracle-light-pg-certificate-health.yml

  check:
    needs: contract
    if: github.repository == 'olegmed1-art/bridge-video-free' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Read certificate expiry on Light
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          if [[ -z "${SSH_PRIVATE_KEY:-}" ]]; then
            echo 'LIGHT_SSH_KEY=ABSENT'
            exit 1
          fi
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$work/key"
          unset SSH_PRIVATE_KEY
          if ! ssh-keygen -y -P '' -f "$work/key" > "$work/public" 2>/dev/null; then
            echo 'LIGHT_SSH_KEY=INVALID_OR_ENCRYPTED'
            exit 1
          fi
          bash ops/oracle_known_hosts_from_scan.sh 92.5.47.149 SHA256:XBR1x74uJ41BxmDF7Y9P20GjIjNbrYXqieV4c2MC0Go "$work/known_hosts"
          ssh -F /dev/null -i "$work/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$work/known_hosts" -o ConnectTimeout=15 -o ConnectionAttempts=1 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 ubuntu@92.5.47.149 'sudo -n /usr/bin/python3 -' < ops/oracle_light_pg_certificate_check.py
