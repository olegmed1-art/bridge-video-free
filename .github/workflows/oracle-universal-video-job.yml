name: Oracle Universal Video Job

on:
  pull_request:
    paths:
      - '.github/workflows/oracle-universal-video-job.yml'
  push:
    branches: [main]
    paths:
      - 'ops/oracle-universal-video-job-requests/*.json'
  # Commits made by an integration token may not emit a push event that starts
  # Actions.  Polling the explicit request queue keeps those jobs durable.
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: oracle-instance-workload-mutation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      request_id: ${{ steps.request.outputs.request_id }}
      issue: ${{ steps.request.outputs.issue }}
      job_id: ${{ steps.request.outputs.job_id }}
      profile: ${{ steps.request.outputs.profile }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate generic explicit Drive request
        id: request
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
            mapfile -t files < <(git diff-tree -m --no-commit-id --name-only -r "$GITHUB_SHA" \
              | grep -E '^ops/oracle-universal-video-job-requests/[^/]+\.json$' | sort -u)
          else
            mapfile -t files < <(for f in ops/oracle-universal-video-job-requests/*.json; do
              [[ -f "$f" ]] || continue
              printf '%s %s\n' "$(git log -1 --format=%ct -- "$f")" "$f"
            done | sort -nr | head -n1 | cut -d' ' -f2-)
          fi
          [[ ${#files[@]} -eq 1 ]] || { echo "expected exactly one job request" >&2; exit 1; }
          REQUEST_FILE="${files[0]}" python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          x=json.load(open(os.environ['REQUEST_FILE'], encoding='utf-8'))
          assert set(x)=={'request_id','issue','job'}, x
          assert re.fullmatch(r'[A-Za-z0-9._-]{1,80}', str(x['request_id']))
          assert isinstance(x['issue'], int) and x['issue'] > 0
          job=x['job']
          jid=job.get('job_id')
          profile=job.get('profile')
          from universal_video.contract import validate_job
          validated=validate_job(job)
          assert validated.source['kind']=='google_drive'
          print('request_id='+x['request_id'])
          print('issue='+str(x['issue']))
          print('job_id='+jid)
          print('profile='+profile)
          PY
      - name: Contract-only PR validation
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          python - <<'PY'
          import yaml
          yaml.safe_load(open('.github/workflows/oracle-universal-video-job.yml', encoding='utf-8'))
          print('ORACLE_UNIVERSAL_VIDEO_JOB_CONTRACT_PASS')
          PY

  execute:
    if: ${{ github.event_name != 'pull_request' }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      INSTANCE_ID: ocid1.instance.oc1.eu-frankfurt-1.antheljtruoejaica7hj5oubnh2cctnjr7ti7llcgo6ho6wdvgvui6td7saq
      OCI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_KEY: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      OCI_REGION: ${{ secrets.OCI_CLI_REGION }}
      ISSUE_NUMBER: ${{ needs.validate.outputs.issue }}
      JOB_ID: ${{ needs.validate.outputs.job_id }}
      PROFILE: ${{ needs.validate.outputs.profile }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Configure OCI CLI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q oci-cli
          # Accept either the intended one-line OCID or the matching line from
          # an accidentally pasted Oracle configuration preview.  Never echo it.
          oci_user="$(printf '%s\n' "$OCI_USER" | sed -nE 's/^[[:space:]]*(user=)?(ocid1\.user\.[A-Za-z0-9._-]+)[[:space:]]*$/\2/p' | head -n1)"
          oci_fingerprint="$(printf '%s\n' "$OCI_FINGERPRINT" | sed -nE 's/^[[:space:]]*(fingerprint=)?([0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2}){15})[[:space:]]*$/\2/p' | head -n1)"
          oci_tenancy="$(printf '%s\n' "$OCI_TENANCY" | sed -nE 's/^[[:space:]]*(tenancy=)?(ocid1\.tenancy\.[A-Za-z0-9._-]+)[[:space:]]*$/\2/p' | head -n1)"
          [[ -n "$oci_user" ]] || { echo 'OCI_CLI_USER is not a valid user OCID' >&2; exit 1; }
          [[ -n "$oci_fingerprint" ]] || { echo 'OCI_CLI_FINGERPRINT is not a valid fingerprint' >&2; exit 1; }
          [[ -n "$oci_tenancy" ]] || { echo 'OCI_CLI_TENANCY is not a valid tenancy OCID' >&2; exit 1; }
          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_KEY" > "$HOME/.oci/key.pem"
          chmod 600 "$HOME/.oci/key.pem"
          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=$oci_user
          fingerprint=$oci_fingerprint
          tenancy=$oci_tenancy
          region=$OCI_REGION
          key_file=$HOME/.oci/key.pem
          EOF
          chmod 600 "$HOME/.oci/config"
          oci iam region list --output json >/dev/null
          state="$(oci compute instance get --instance-id "$INSTANCE_ID" --query 'data."lifecycle-state"' --raw-output)"
          case "$state" in
            RUNNING) ;;
            STOPPED)
              oci compute instance action --instance-id "$INSTANCE_ID" --action START --wait-for-state RUNNING --max-wait-seconds 600 >/dev/null
              ;;
            *) echo "Oracle instance is not runnable: $state" >&2; exit 1 ;;
          esac
          echo ORACLE_UNIVERSAL_VIDEO_JOB_OCI_PASS

      - name: Submit and monitor generic resident job
        shell: bash
        run: |
          set -euo pipefail
          compartment="$(oci compute instance get --instance-id "$INSTANCE_ID" --query 'data."compartment-id"' --raw-output)"
          run_remote() {
            local display="$1" command="$2" timeout="${3:-180}"
            local content target cid execution lifecycle
            content="$(SCRIPT_TEXT="$command" python -c 'import json,os; print(json.dumps({"source":{"sourceType":"TEXT","text":"set -Eeuo pipefail\n"+os.environ["SCRIPT_TEXT"]+"\n"},"output":{"outputType":"TEXT"}},separators=(",",":")))')"
            target="$(python -c 'import json,os; print(json.dumps({"instanceId":os.environ["INSTANCE_ID"]},separators=(",",":")))')"
            cid="$(oci instance-agent command create --compartment-id "$compartment" --content "$content" --target "$target" --execution-user root --timeout-in-seconds "$timeout" --display-name "$display" --query data.id --raw-output)"
            execution=''; lifecycle=''
            for _ in $(seq 1 90); do
              execution="$(oci instance-agent command-execution get --command-id "$cid" --instance-id "$INSTANCE_ID" --output json 2>/dev/null || true)"
              [[ -n "$execution" ]] || { sleep 2; continue; }
              # OCI can expose an empty or incomplete execution document while
              # propagating a new command.  Treat it as pending and retry.
              if ! lifecycle="$(printf '%s' "$execution" | python -c 'import json,sys; print(json.load(sys.stdin).get("data",{}).get("lifecycle-state",""))' 2>/dev/null)"; then
                sleep 2
                continue
              fi
              case "$lifecycle" in SUCCEEDED|FAILED|CANCELED|TIMED_OUT) break;; esac
              sleep 2
            done
            if [[ "$lifecycle" != SUCCEEDED ]]; then
              echo "instance-agent command failed: $lifecycle" >&2
              printf '%s' "$execution" | python -c 'import json,sys; d=json.load(sys.stdin).get("data",{}); print(((d.get("content") or {}).get("text","") or "")[:2000])' >&2
              return 1
            fi
            printf '%s' "$execution" | python -c 'import json,sys; d=json.load(sys.stdin).get("data",{}); print((d.get("content") or {}).get("text","") or "")'
          }

          # OCI agent executes this fixed repair only; it restores service-owned
          # spool leaves and proves that the service identity can write there.
          repair_cmd='for d in inbox running done failed results; do /usr/bin/install -d -o universal-video -g universal-video -m 0750 /opt/bridge-school/universal-video/spool/$d; /usr/bin/chown universal-video:universal-video /opt/bridge-school/universal-video/spool/$d; /usr/bin/chmod 0750 /opt/bridge-school/universal-video/spool/$d; done; /usr/sbin/runuser -u universal-video -- /bin/sh -ceu "for d in inbox running done failed results; do p=/opt/bridge-school/universal-video/spool/\$d/.operator-write-check-\$\$; : > \$p; rm -f \$p; done; echo UNIVERSAL_VIDEO_SPOOL_RUNTIME_REPAIR_PASS"'
          repair_out="$(run_remote "universal-video-spool-repair-${GITHUB_RUN_ID}" "$repair_cmd")"
          grep -qx 'UNIVERSAL_VIDEO_SPOOL_RUNTIME_REPAIR_PASS' <<<"$repair_out"

          if [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
            request_file="$(git diff-tree -m --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^ops/oracle-universal-video-job-requests/[^/]+\.json$' | head -n1)"
          else
            request_file="$(find ops/oracle-universal-video-job-requests -maxdepth 1 -type f -name '*.json' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          fi
          payload="$(REQUEST_FILE="$request_file" python - <<'PY'
          import base64,json,os
          x=json.load(open(os.environ['REQUEST_FILE'],encoding='utf-8'))
          print(base64.b64encode(json.dumps(x['job'],ensure_ascii=False,separators=(',',':')).encode()).decode())
          PY
          )"
          submit_cmd="sudo -n /usr/local/sbin/universal-video submit-base64 '$payload'"
          status_cmd="sudo -n /usr/local/sbin/universal-video status '$JOB_ID'"
          label="Universal Video / $PROFILE / $JOB_ID"

          initial="$(run_remote "universal-video-submit-${GITHUB_RUN_ID}" "$submit_cmd")"
          state="$(printf '%s\n' "$initial" | sed -n 's/^UV_STATE=//p' | tail -n1)"
          [[ "$state" =~ ^(QUEUED|RUNNING|TECHNICAL_CONFORMANT|REVIEW|NONCONFORMANT|CONFLICT|FAILED)$ ]] || { echo "unsafe submit state: $state" >&2; exit 1; }
          initial_safe="$(printf '%s\n' "$initial" | grep -E '^UV_(STATE|RESULT_STATUS|RESULT_DIR|CONFORMANCE_STATE|ATTESTATION_MODE|ARTIFACT_SET_SHA256|MANIFEST_SHA256|ARTIFACT_COUNT|TOTAL_BYTES|DOMAIN_ANALYSIS_STATUS|TECHNICAL_BUNDLE_READY|BRIDGE_PRODUCTION_READY|PEDAGOGICAL_STATUS|PUBLICATION_STATE|ERROR_TYPE|ERROR)=' | head -n 20 || true)"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Статус **$label**: **SUBMITTED → $state**.\n\n\`\`\`text\n$initial_safe\n\`\`\`\nТехническая готовность не означает предметную или педагогическую готовность. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          last="$state"

          for _ in $(seq 1 300); do
            case "$last" in
              TECHNICAL_CONFORMANT) echo ORACLE_UNIVERSAL_VIDEO_JOB_TECHNICAL_CONFORMANCE_PASS; exit 0;;
              REVIEW|NONCONFORMANT|CONFLICT|FAILED) exit 1;;
            esac
            sleep 60
            out="$(run_remote "universal-video-status-${GITHUB_RUN_ID}" "$status_cmd")"
            state="$(printf '%s\n' "$out" | sed -n 's/^UV_STATE=//p' | tail -n1)"
            [[ "$state" =~ ^(QUEUED|RUNNING|TECHNICAL_CONFORMANT|REVIEW|NONCONFORMANT|CONFLICT|FAILED)$ ]] || { echo "unsafe status: $state" >&2; exit 1; }
            if [[ "$state" != "$last" ]]; then
              safe="$(printf '%s\n' "$out" | grep -E '^UV_(STATE|RESULT_STATUS|RESULT_DIR|CONFORMANCE_STATE|ATTESTATION_MODE|ARTIFACT_SET_SHA256|MANIFEST_SHA256|ARTIFACT_COUNT|TOTAL_BYTES|DOMAIN_ANALYSIS_STATUS|TECHNICAL_BUNDLE_READY|BRIDGE_PRODUCTION_READY|PEDAGOGICAL_STATUS|PUBLICATION_STATE|ERROR_TYPE|ERROR)=' | head -n 20)"
              gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Статус **$label**: **$last → $state**.\n\n\`\`\`text\n$safe\n\`\`\`\nRun: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              last="$state"
            fi
          done
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "**$label** остаётся **$last** после 5-часового окна наблюдения; resident job не остановлен."
          exit 2

      - name: Report failure
        if: ${{ failure() }}
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Оператор **Universal Video / $PROFILE / $JOB_ID** завершился fail-closed до подтверждённого COMPLETED. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Signal external idle candidate
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run oracle-instance-idle-candidate.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f source_run_id="$GITHUB_RUN_ID"
          echo "external idle candidate dispatched; OCI privilege remains in the bounded power workflow"
