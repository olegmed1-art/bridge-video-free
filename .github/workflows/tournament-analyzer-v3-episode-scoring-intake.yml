name: Tournament Analyzer v3 Episode Scoring Intake

on:
  pull_request:
    paths:
      - "bridge_school_api/tournament_episode_scoring_intake_v3.py"
      - "tests/test_tournament_episode_scoring_intake_v3.py"
      - ".github/workflows/tournament-analyzer-v3-episode-scoring-intake.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  real-scoring-intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile and test
        run: |
          python -m py_compile bridge_school_api/tournament_episode_scoring_intake_v3.py
          python -m pytest -q tests/test_tournament_episode_inventory_v3.py tests/test_tournament_episode_scoring_intake_v3.py
      - name: Restore exact historical tournament evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/30041 evidence/29912 evidence/29912-source
          for spec in \
            "9463631738:/tmp/30041.zip:evidence/30041" \
            "9471054929:/tmp/29912-dds3.zip:evidence/29912" \
            "9470920077:/tmp/29912-source.zip:evidence/29912-source"; do
            IFS=: read -r aid zip dest <<< "$spec"
            curl -fsSL --retry 3 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${aid}/zip" \
              -o "$zip"
            unzip -q "$zip" -d "$dest"
          done
          DDS30041="$(find evidence/30041 -type f -name 'diana-30041-round2-dds3.json' -print -quit)"
          DDS29912="$(find evidence/29912 -type f -name 'diana-29912-cross-session-dds3.json' -print -quit)"
          FACTS29912="$(find evidence/29912-source -type d -name facts29912 -print -quit)"
          test -n "$DDS30041" && test -n "$DDS29912" && test -n "$FACTS29912"
          echo "DDS30041=$DDS30041" >> "$GITHUB_ENV"
          echo "DDS29912=$DDS29912" >> "$GITHUB_ENV"
          echo "FACTS29912=$FACTS29912" >> "$GITHUB_ENV"
      - name: Rebuild dossier and 30041 candidate inventory
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python tools/tournament_teacher_review_queue_v3.py \
            --facts-30041 data/tournaments/tournament_30041_round2_diana_facts_v1.json \
            --dds3-30041 "$DDS30041" --dds3-29912 "$DDS29912" --facts-29912-dir "$FACTS29912" \
            --per-event-limit 10 --out-json queue.json --out-md /tmp/queue.md
          PYTHONPATH="$PWD" python tools/tournament_teacher_decisions_v3.py --queue queue.json --out ledger.json
          PYTHONPATH="$PWD" python tools/tournament_teacher_review_dossier_v3.py \
            --queue queue.json --ledger ledger.json \
            --facts-30041 data/tournaments/tournament_30041_round2_diana_facts_v1.json \
            --dds3-30041 "$DDS30041" --dds3-29912 "$DDS29912" \
            --out-json dossier.json --out-md /tmp/dossier.md
          PYTHONPATH="$PWD" python tools/tournament_episode_inventory_v3.py \
            --facts data/tournaments/tournament_30041_round2_diana_facts_v1.json \
            --dossier dossier.json --event-id 30041 \
            --out-json inventory.json --out-md /tmp/inventory.md
      - name: Build inert real scoring template and prove zero automatic episode scores
        run: |
          PYTHONPATH="$PWD" python - <<'PY'
          import json
          from bridge_school_api.tournament_episode_scoring_intake_v3 import build_episode_scoring_template, validate_episode_scoring_intake
          inventory=json.load(open('inventory.json', encoding='utf-8'))
          template=build_episode_scoring_template(inventory)
          result=validate_episode_scoring_intake(inventory, template)
          json.dump(template, open('tournament-30041-episode-scoring-intake.json','w',encoding='utf-8'), ensure_ascii=False, indent=2, sort_keys=True)
          json.dump(result, open('tournament-30041-episode-scoring-validation.json','w',encoding='utf-8'), ensure_ascii=False, indent=2, sort_keys=True)
          assert len(template['rows'])==7
          assert all(r['explicit_episode_adjudication'] is False for r in template['rows'])
          assert all(r['impact_score'] is None and r['transferability_score'] is None and r['reliability_score'] is None for r in template['rows'])
          assert result['candidate_count']==7
          assert result['explicitly_scored_count']==0
          assert result['pending_scoring_count']==7
          assert result['episode_scoring_complete'] is False
          assert result['coverage_episode_inputs']==[]
          assert result['automatic_scoring_used'] is False
          assert result['methodology_mapping_created'] is False
          assert result['student_error_attribution_created'] is False
          print('TOURNAMENT_30041_EPISODE_SCORING_INTAKE_PASS')
          print('candidate_count', result['candidate_count'])
          print('pending_scoring_count', result['pending_scoring_count'])
          print('explicitly_scored_count', result['explicitly_scored_count'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tournament-analyzer-v3-30041-episode-scoring-intake
          path: |
            tournament-30041-episode-scoring-intake.json
            tournament-30041-episode-scoring-validation.json
          if-no-files-found: error
          retention-days: 30
