name: Autopilot Codex bounded terminal sweep

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: autopilot-codex-terminal-sweep
  cancel-in-progress: false

jobs:
  recover-active:
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.AUTOPILOT_CODEX_READBACK_ENABLED == 'true' &&
      github.event.repository.id == 1330085090 &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && github.actor == 'olegmed1-art'))
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout immutable default-branch receiver
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned callback dependency
        run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.3.4'
      - name: Bounded pre-deadline original terminal readback
        env:
          AUTOPILOT_CALLBACK_DATABASE_URL: ${{ secrets.AUTOPILOT_CALLBACK_DATABASE_URL }}
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "${AUTOPILOT_CALLBACK_DATABASE_URL:-}"
          test -n "${GITHUB_TOKEN:-}"
          python -m ops.github_autopilot_db_route codex-terminal-sweep
