name: DDS test contract (fast)

on:
  pull_request:
    paths:
      - 'dds_training/**'
      - '.github/workflows/dds-training-v23-smoke.yml'
      - '.github/workflows/dds-training-local-smoke.yml'
  push:
    branches: [main, dds-integration-v2.3-hardening]
    paths:
      - 'dds_training/**'
      - '.github/workflows/dds-training-v23-smoke.yml'
      - '.github/workflows/dds-training-local-smoke.yml'
  workflow_dispatch:

concurrency:
  group: dds-test-fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'

      - name: Compile DDS Python modules
        working-directory: dds_training
        run: python -m compileall -q .

      - name: Validate canonical test inventory and coverage contract
        working-directory: dds_training
        run: python test_runner.py --manifest test_matrix.json --check-only

      - name: Run isolated fast DDS test suite
        working-directory: dds_training
        run: >-
          python test_runner.py
          --manifest test_matrix.json
          --suite fast
          --report /tmp/dds-test-report-fast.json

      - name: Audit tracked, untracked and ignored source residue
        working-directory: dds_training
        run: >-
          python source_integrity.py
          --repo ..
          --out /tmp/dds-source-integrity-fast.json

      - name: Require an empty visible Git working tree
        run: |
          set -euo pipefail
          status="$(git status --porcelain=v1 --untracked-files=all)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status" >&2
            exit 1
          fi

      - name: Upload machine-readable fast test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dds-test-report-fast-${{ github.run_id }}
          path: |
            /tmp/dds-test-report-fast.json
            /tmp/dds-source-integrity-fast.json
          if-no-files-found: warn
          retention-days: 14
