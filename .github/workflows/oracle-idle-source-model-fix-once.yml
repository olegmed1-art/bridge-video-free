name: Oracle idle source model fix once

on:
  push:
    branches: [autopilot/oracle-idle-stop-guard-627-v2]
    paths: ['.github/workflows/oracle-idle-source-model-fix-once.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: autopilot/oracle-idle-stop-guard-627-v2
          fetch-depth: 0
      - name: Apply exact source-model correction
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('ops/oracle_idle_state.sh')
          s = p.read_text(encoding='utf-8')

          def one(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one literal match, got {count}')
              s = s.replace(old, new, 1)

          one(
              'QUEUE_DSN_FILE="${BRIDGE_VIDEO_QUEUE_DSN_FILE:-/opt/bridge-school/universal-video/secrets/video-queue-dsn}"',
              'UV_SECRETS_ENV="${UNIVERSAL_VIDEO_SECRETS_ENV_FILE:-$VIDEO_DIR/universal-video-secrets.env}"\nQUEUE_DSN_FILE="${BRIDGE_VIDEO_QUEUE_DSN_FILE:-}"',
              'queue dsn declaration',
          )
          one(
              'REQUIRED_LOCAL_SPOOLS="${ORACLE_IDLE_REQUIRED_LOCAL_SPOOLS:-$LAB_DIR/spool:$LAB_DIR/feedback-spool:$VIDEO_DIR/spool/inbox:$VIDEO_DIR/spool/running:$OBSERVER_DIR/jobs/pending:$OBSERVER_DIR/jobs/running}"',
              'REQUIRED_LOCAL_SPOOLS="${ORACLE_IDLE_REQUIRED_LOCAL_SPOOLS:-$VIDEO_DIR/spool/inbox:$VIDEO_DIR/spool/running:$OBSERVER_DIR/jobs/pending:$OBSERVER_DIR/jobs/running}"',
              'required spool declaration',
          )

          start = s.find('read_single_assignment() {')
          end_marker = '\n}\n\nassistant_dsn=""'
          end = s.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('env parser function boundaries not found')
          end += 2
          new_function = r'''read_single_assignment() {
            local path="$1"
            local key="$2"
            local source="$3"
            local destination="$4"
            local matches_text=""
            local grep_rc=0
            local value=""
            local first=""
            local last=""
            local -a matches=()

            printf -v "$destination" '%s' ''
            if [[ ! -f "$path" || -L "$path" || ! -r "$path" ]]; then
              mark_unknown "${source}_env_unavailable"
              return 1
            fi

            set +e
            matches_text="$(grep -E "^${key}=" "$path" 2>/dev/null)"
            grep_rc=$?
            set -e
            if (( grep_rc == 1 )); then
              mark_unknown "${source}_dsn_missing"
              return 1
            elif (( grep_rc != 0 )); then
              mark_unknown "${source}_env_unreadable"
              return 1
            fi

            mapfile -t matches <<< "$matches_text"
            if (( ${#matches[@]} != 1 )); then
              mark_unknown "${source}_dsn_ambiguous"
              return 1
            fi
            value="${matches[0]#${key}=}"
            first="${value:0:1}"
            last="${value: -1}"
            if [[ "$first" == \" || "$first" == \' || "$last" == \" || "$last" == \' ]]; then
              if [[ "$first" == "$last" ]] && { [[ "$first" == \" ]] || [[ "$first" == \' ]]; } && (( ${#value} >= 2 )); then
                value="${value:1:${#value}-2}"
              else
                mark_unknown "${source}_dsn_quote_invalid"
                return 1
              fi
            fi
            if [[ -z "$value" || "$value" == *$'\r'* || "$value" == *$'\n'* ]]; then
              mark_unknown "${source}_dsn_empty_or_invalid"
              return 1
            fi
            printf -v "$destination" '%s' "$value"
            return 0
          }'''
          # Dedent the YAML block's incidental indentation without changing shell content.
          new_function = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_function.splitlines())
          s = s[:start] + new_function + s[end:]

          anchor = '''read_single_assignment "$AUTOPILOT_ENV" 'AUTOPILOT_DATABASE_URL' 'autopilot' autopilot_dsn || true

          if [[ ! -f "$QUEUE_DSN_FILE" || -L "$QUEUE_DSN_FILE" || ! -r "$QUEUE_DSN_FILE" ]]; then'''
          insert = '''read_single_assignment "$AUTOPILOT_ENV" 'AUTOPILOT_DATABASE_URL' 'autopilot' autopilot_dsn || true

          if [[ -z "$QUEUE_DSN_FILE" ]]; then
            read_single_assignment "$UV_SECRETS_ENV" 'BRIDGE_VIDEO_QUEUE_DATABASE_URL_FILE' 'video_queue_file' QUEUE_DSN_FILE || true
          fi
          if [[ -z "$QUEUE_DSN_FILE" || "$QUEUE_DSN_FILE" != /* || "$QUEUE_DSN_FILE" == *'..'* ]]; then
            mark_unknown "video_queue_dsn_path_invalid"
          elif [[ ! -f "$QUEUE_DSN_FILE" || -L "$QUEUE_DSN_FILE" || ! -r "$QUEUE_DSN_FILE" ]]; then'''
          anchor = '\n'.join(line[10:] if line.startswith('          ') else line for line in anchor.splitlines())
          insert = '\n'.join(line[10:] if line.startswith('          ') else line for line in insert.splitlines())
          one(anchor, insert, 'video file resolver')

          p.write_text(s, encoding='utf-8')
          PY

          bash -n ops/oracle_idle_state.sh
          grep -F 'ORACLE_IDLE_REQUIRED_LOCAL_SPOOLS:-$VIDEO_DIR/spool/inbox:$VIDEO_DIR/spool/running:$OBSERVER_DIR/jobs/pending:$OBSERVER_DIR/jobs/running' ops/oracle_idle_state.sh >/dev/null
          grep -F "BRIDGE_VIDEO_QUEUE_DATABASE_URL_FILE" ops/oracle_idle_state.sh >/dev/null
          grep -F 'video_queue_dsn_path_invalid' ops/oracle_idle_state.sh >/dev/null
          grep -F 'dsn_quote_invalid' ops/oracle_idle_state.sh >/dev/null
          ! grep -F '$LAB_DIR/spool:$LAB_DIR/feedback-spool' ops/oracle_idle_state.sh >/dev/null

          git rm .github/workflows/oracle-idle-source-model-fix-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/oracle_idle_state.sh
          git commit -m 'fix(oracle): align idle guard with deployed telemetry sources'
          git push origin HEAD:autopilot/oracle-idle-stop-guard-627-v2
