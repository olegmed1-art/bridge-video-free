name: OCI FinOps read-only audit

on:
  pull_request:
    paths:
      - '.github/workflows/oci-finops-readonly-audit.yml'
  push:
    branches: [main]
    paths:
      - 'ops/oci-finops-audit-requests/*.json'

permissions:
  contents: read
  issues: write

concurrency:
  group: oci-finops-readonly-audit
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Enforce read-only OCI surface
        shell: bash
        run: |
          set -euo pipefail
          f=.github/workflows/oci-finops-readonly-audit.yml
          ! grep -nE 'oci .* (create|update|delete|terminate|action|assign|remove|attach|detach) ' "$f"
          grep -q 'oci compute instance get' "$f"
          grep -q 'oci bv boot-volume get' "$f"
          grep -q 'oci budgets budget budget list' "$f"
          grep -q 'oci budgets budget alert-rule list' "$f"

  audit:
    if: ${{ github.event_name == 'push' }}
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ISSUE_NUMBER: '265'
      INSTANCE_ID: ocid1.instance.oc1.eu-frankfurt-1.antheljtruoejaica7hj5oubnh2cctnjr7ti7llcgo6ho6wdvgvui6td7saq
      OCI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_KEY: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      OCI_REGION: ${{ secrets.OCI_CLI_REGION }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Validate one exact audit request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff-tree -m --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^ops/oci-finops-audit-requests/[^/]+\.json$' | sort -u)
          [[ ${#files[@]} -eq 1 ]] || { echo 'expected exactly one OCI FinOps audit request' >&2; exit 1; }
          REQUEST_FILE="${files[0]}" python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          x=json.load(open(os.environ['REQUEST_FILE'], encoding='utf-8'))
          assert set(x)=={'request_id','instance_id'}
          assert re.fullmatch(r'[A-Za-z0-9._-]{1,80}', str(x['request_id']))
          assert x['instance_id']==os.environ['INSTANCE_ID']
          print('request_id='+x['request_id'])
          PY

      - name: Configure OCI CLI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q oci-cli
          install -d -m 0700 "$HOME/.oci"
          printf '%s' "$OCI_KEY" | python -c 'import sys; raw=sys.stdin.read().replace("\\r","").replace("\\n","\n"); open(sys.argv[1],"w").write(raw if raw.endswith("\n") else raw+"\n")' "$HOME/.oci/key.pem"
          chmod 0600 "$HOME/.oci/key.pem"
          python - <<'PY'
          import os
          from pathlib import Path

          def scalar(env, key):
              lines = [x.strip() for x in os.environ[env].replace('\r', '').splitlines() if x.strip()]
              matches = [x.split('=', 1)[1].strip() for x in lines if x.startswith(key + '=')]
              if len(matches) == 1 and matches[0]:
                  return matches[0]
              if not matches and len(lines) == 1 and '=' not in lines[0]:
                  return lines[0]
              raise SystemExit(f'ambiguous {env}')

          values = {
              'user': scalar('OCI_USER', 'user'),
              'fingerprint': scalar('OCI_FINGERPRINT', 'fingerprint'),
              'tenancy': scalar('OCI_TENANCY', 'tenancy'),
              'region': scalar('OCI_REGION', 'region'),
          }
          if values['region'] != 'eu-frankfurt-1':
              raise SystemExit('unexpected region')
          target = Path.home() / '.oci' / 'config'
          target.write_text(
              '[DEFAULT]\n'
              + ''.join(f'{key}={value}\n' for key, value in values.items())
              + f"key_file={Path.home() / '.oci' / 'key.pem'}\n",
              encoding='utf-8',
          )
          PY
          chmod 0600 "$HOME/.oci/config"
          export OCI_CLI_REGION=eu-frankfurt-1
          timeout --signal=KILL 30s oci iam region list --output json >/dev/null

      - name: Collect sanitized capacity and guard evidence
        shell: bash
        run: |
          set -euo pipefail
          instances="$(oci compute instance list -c "$OCI_TENANCY" --all --output json)"
          INSTANCES_JSON="$instances" python - <<'PY' > "$RUNNER_TEMP/capacity.txt"
          import json, os
          xs=json.loads(os.environ['INSTANCES_JSON']).get('data') or []
          matches=[
              x for x in xs
              if x.get('display-name')=='bridge-school-autopilot-lite'
              and x.get('shape')=='VM.Standard.A1.Flex'
              and x.get('lifecycle-state') not in {'TERMINATED','TERMINATING'}
          ]
          print('light_instance_active='+('yes' if len(matches)==1 else 'no'))
          if len(matches)==1:
              d=matches[0]; cfg=d.get('shape-config') or {}
              print('light_instance_id='+str(d.get('id') or 'unknown'))
              print('shape='+str(d.get('shape') or 'unknown'))
              print('ocpus='+str(cfg.get('ocpus') or 'unknown'))
              print('memory_gb='+str(cfg.get('memory-in-gbs') or 'unknown'))
              print('lifecycle_state='+str(d.get('lifecycle-state') or 'unknown'))
              print('availability_domain='+str(d.get('availability-domain') or 'unknown'))
          elif matches:
              raise SystemExit('multiple active light instances')
          PY
          light_id="$(grep '^light_instance_id=' "$RUNNER_TEMP/capacity.txt" | cut -d= -f2- || true)"
          boot_id=''
          if [[ -n "$light_id" && "$light_id" != unknown ]]; then
            ad="$(grep '^availability_domain=' "$RUNNER_TEMP/capacity.txt" | cut -d= -f2-)"
            attachment="$(oci compute boot-volume-attachment list -c "$OCI_TENANCY" --availability-domain "$ad" --instance-id "$light_id" --all --output json)"
            boot_id="$(printf '%s' "$attachment" | python -c 'import json,sys; xs=[x for x in json.load(sys.stdin).get("data",[]) if x.get("lifecycle-state") in {"ATTACHED","ATTACHING"}]; print(xs[0].get("boot-volume-id","") if len(xs)==1 else "")')"
          fi
          boots="$(oci bv boot-volume list -c "$OCI_TENANCY" --all --output json)"
          if [[ -z "$boot_id" ]]; then
            boot_id="$(BOOTS_JSON="$boots" python - <<'PY'
          import json, os
          xs=json.loads(os.environ['BOOTS_JSON']).get('data') or []
          xs=[x for x in xs if x.get('display-name')=='bridge-school-autopilot-lite (Boot Volume)' and x.get('lifecycle-state') not in {'TERMINATED','TERMINATING'}]
          print(xs[0].get('id','') if len(xs)==1 else '')
          PY
            )"
          fi
          [[ -n "$boot_id" ]]
          boot="$(oci bv boot-volume get --boot-volume-id "$boot_id" --output json)"
          BOOT_JSON="$boot" python - <<'PY' >> "$RUNNER_TEMP/capacity.txt"
          import json, os
          d=json.loads(os.environ['BOOT_JSON'])['data']
          print('boot_volume_gb='+str(d.get('size-in-gbs','unknown')))
          print('boot_volume_state='+str(d.get('lifecycle-state','unknown')))
          PY
          assignment="$(oci bv volume-backup-policy-assignment get-volume-backup-policy-asset-assignment --asset-id "$boot_id" --output json || true)"
          ASSIGNMENT_JSON="$assignment" python - <<'PY' >> "$RUNNER_TEMP/capacity.txt"
          import json, os
          try: d=json.loads(os.environ.get('ASSIGNMENT_JSON') or '{}').get('data') or []
          except Exception: d=[]
          print('backup_policy_assigned='+('yes' if d else 'no'))
          PY
          backups="$(oci bv boot-volume-backup list -c "$OCI_TENANCY" --boot-volume-id "$boot_id" --all --output json)"
          BACKUPS_JSON="$backups" python - <<'PY' >> "$RUNNER_TEMP/capacity.txt"
          import json, os
          xs=json.loads(os.environ['BACKUPS_JSON']).get('data') or []
          print('available_boot_backups='+str(sum(x.get('lifecycle-state')=='AVAILABLE' for x in xs)))
          PY
          volumes="$(oci bv volume list -c "$OCI_TENANCY" --all --output json)"
          BOOTS_JSON="$boots" VOLUMES_JSON="$volumes" python - <<'PY' >> "$RUNNER_TEMP/capacity.txt"
          import json, os
          terminal={'TERMINATED','TERMINATING'}
          boots=json.loads(os.environ['BOOTS_JSON']).get('data') or []
          vols=json.loads(os.environ['VOLUMES_JSON']).get('data') or []
          active_boot=[x for x in boots if x.get('lifecycle-state') not in terminal]
          active_vol=[x for x in vols if x.get('lifecycle-state') not in terminal]
          total=sum(int(x.get('size-in-gbs') or 0) for x in active_boot+active_vol)
          print('active_boot_volumes='+str(len(active_boot)))
          print('active_block_volumes='+str(len(active_vol)))
          print('active_block_storage_gb='+str(total))
          print('always_free_remaining_estimate_gb='+str(max(0,200-total)))
          PY
          budgets="$(oci budgets budget budget list -c "$OCI_TENANCY" --display-name bridge-school-dds3-trial-guard --all --output json || true)"
          BUDGETS_JSON="$budgets" python - <<'PY' >> "$RUNNER_TEMP/capacity.txt"
          import json, os
          try:
              xs=json.loads(os.environ.get('BUDGETS_JSON') or '{}').get('data') or []
          except Exception:
              xs=[]
          active=[x for x in xs if x.get('lifecycle-state')=='ACTIVE']
          print('budget_guard_active='+('yes' if active else 'no'))
          if active:
              x=active[0]
              print('budget_amount_usd='+str(x.get('amount','unknown')))
              print('budget_reset_period='+str(x.get('reset-period','unknown')))
          PY
          budget_id="$(printf '%s' "$budgets" | python -c 'import json,sys; xs=json.load(sys.stdin).get("data") or []; active=[x for x in xs if x.get("lifecycle-state")=="ACTIVE"]; print(active[0].get("id","") if active else "")' 2>/dev/null || true)"
          if [[ -n "$budget_id" ]]; then
            alerts="$(oci budgets budget alert-rule list --budget-id "$budget_id" --all --output json || true)"
            ALERTS_JSON="$alerts" python - <<'PY' >> "$RUNNER_TEMP/capacity.txt"
          import json, os
          try:
              xs=json.loads(os.environ.get('ALERTS_JSON') or '{}').get('data') or []
          except Exception:
              xs=[]
          active=[x for x in xs if x.get('lifecycle-state')=='ACTIVE']
          thresholds=sorted({str(x.get('threshold')) for x in active if x.get('threshold') is not None})
          print('budget_alert_thresholds='+(','.join(thresholds) if thresholds else 'none'))
          PY
          else
            echo 'budget_alert_thresholds=none' >> "$RUNNER_TEMP/capacity.txt"
          fi
          cat "$RUNNER_TEMP/capacity.txt"

      - name: Publish sanitized audit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo 'OCI FinOps read-only audit: **PASS**'
            echo "Request: \`$REQUEST_ID\`."
            echo
            echo '```text'
            cat "$RUNNER_TEMP/capacity.txt"
            echo '```'
            echo
            echo "Read-only audit only; no OCI resource was created, updated, deleted or rebooted. Run: $RUN_URL"
          } > "$RUNNER_TEMP/body.md"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/body.md"
