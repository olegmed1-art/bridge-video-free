name: Oracle manual hold

on:
  issue_comment:
    types: [created]
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
    inputs:
      hours:
        description: Hold duration in whole hours (1-12), or 0 to release
        required: true
        type: number

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: oracle-manual-hold
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.actor == github.repository_owner &&
       startsWith(github.event.comment.body, '/oracle-hold '))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Resolve requested hold
        id: hold
        env:
          DISPATCH_HOURS: ${{ inputs.hours }}
          COMMENT_COMMAND: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            hours="$DISPATCH_HOURS"
          else
            hours="${COMMENT_COMMAND#/oracle-hold }"
            [[ "$hours" != "off" ]] || hours=0
          fi
          [[ "$hours" =~ ^[0-9]+$ ]] || { echo 'hours must be a whole number' >&2; exit 2; }
          (( hours >= 0 && hours <= 12 )) || { echo 'hours must be between 0 and 12' >&2; exit 2; }
          now="$(date -u +%s)"
          if (( hours == 0 )); then
            until=0
          else
            until=$((now + hours * 3600))
          fi
          echo "hours=$hours" >> "$GITHUB_OUTPUT"
          echo "until=$until" >> "$GITHUB_OUTPUT"

      - name: Publish durable hold state
        env:
          GH_TOKEN: ${{ github.token }}
          HOURS: ${{ steps.hold.outputs.hours }}
          UNTIL: ${{ steps.hold.outputs.until }}
        shell: bash
        run: |
          set -euo pipefail
          if (( HOURS == 0 )); then
            body="[oracle-hold state] until_epoch=0 status=RELEASED"
          else
            iso="$(date -u -d "@$UNTIL" +%Y-%m-%dT%H:%M:%SZ)"
            body="[oracle-hold state] until_epoch=$UNTIL until_utc=$iso status=ACTIVE requested_hours=$HOURS"
          fi
          gh issue comment 751 --repo "$GITHUB_REPOSITORY" --body "$body"

      - name: Ensure exact Oracle instance is running
        if: ${{ steps.hold.outputs.hours != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run oracle-instance-power.yml --repo "$GITHUB_REPOSITORY" --ref main -f action=start
          echo 'bounded start dispatched for active manual hold'

  reconcile:
    # Temporary operator pause (2026-08-28): disable scheduled power-state
    # reconciliation. Explicit hold/release commands remain available.
    if: ${{ github.event_name == 'schedule' && false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - name: Read latest durable hold state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          latest="$(gh api --paginate --slurp "/repos/$GITHUB_REPOSITORY/issues/751/comments?per_page=100" \
            | python -c 'import json,re,sys; xs=[x for page in json.load(sys.stdin) for x in page]; vals=[]; pat=re.compile(r"^\[oracle-hold state\] until_epoch=(\d+)"); [(vals.append((int(m.group(1)),x.get("created_at","")))) for x in xs if (m:=pat.match(x.get("body","") or ""))]; print(vals[-1][0] if vals else 0)')"
          [[ "$latest" =~ ^[0-9]+$ ]]
          now="$(date -u +%s)"
          if (( latest > now )); then
            echo 'expired=false' >> "$GITHUB_OUTPUT"
            echo "hold remains active until epoch $latest"
          else
            echo 'expired=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Prove no external work before release stop
        id: idle
        if: ${{ steps.state.outputs.expired == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}"
          python -m pip install --disable-pip-version-check --quiet 'psycopg[binary]==3.2.10'
          snapshot="$(python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ['DATABASE_URL'], connect_timeout=8, application_name='oracle-hold-reconciler') as conn, conn.cursor() as cur:
              cur.execute('SELECT active_jobs, active_research_jobs, active_control_commands FROM assistant_lab.oracle_idle_snapshot()')
              row=cur.fetchone()
              if row is None or len(row)!=3: raise RuntimeError('idle snapshot unavailable')
              vals=tuple(map(int,row))
              if min(vals)<0: raise RuntimeError('invalid idle snapshot')
              print(','.join(map(str,vals)))
          PY
          )"
          IFS=, read -r jobs research control <<< "$snapshot"
          uv_active="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/oracle-universal-video-job.yml/runs?per_page=100" \
            | python -c 'import json,sys; active={"queued","in_progress","waiting","requested","pending"}; print(sum(1 for r in json.load(sys.stdin).get("workflow_runs",[]) if r.get("status") in active))')"
          [[ "$uv_active" =~ ^[0-9]+$ ]]
          if (( jobs + research + control == 0 && uv_active == 0 )); then
            echo 'stop_allowed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'stop_allowed=false' >> "$GITHUB_OUTPUT"
            printf 'hold expired but work remains: jobs=%s research=%s control=%s uv=%s\n' "$jobs" "$research" "$control" "$uv_active"
          fi

      - name: Apply standard ten-minute post-hold grace
        if: ${{ steps.idle.outputs.stop_allowed == 'true' }}
        run: sleep 600

      - name: Recheck hold was not extended during grace
        id: recheck
        if: ${{ steps.idle.outputs.stop_allowed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          latest="$(gh api --paginate --slurp "/repos/$GITHUB_REPOSITORY/issues/751/comments?per_page=100" \
            | python -c 'import json,re,sys; xs=[x for page in json.load(sys.stdin) for x in page]; vals=[]; pat=re.compile(r"^\[oracle-hold state\] until_epoch=(\d+)"); [(vals.append(int(m.group(1)))) for x in xs if (m:=pat.match(x.get("body","") or ""))]; print(vals[-1] if vals else 0)')"
          now="$(date -u +%s)"
          if (( latest > now )); then echo 'release_ok=false' >> "$GITHUB_OUTPUT"; else echo 'release_ok=true' >> "$GITHUB_OUTPUT"; fi

      - name: Dispatch bounded stop after expired hold
        if: ${{ steps.recheck.outputs.release_ok == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run oracle-instance-power.yml --repo "$GITHUB_REPOSITORY" --ref main -f action=stop
          echo 'expired manual hold dispatched bounded stop after ten-minute grace'
