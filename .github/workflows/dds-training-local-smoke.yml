name: DDS local training smoke

on:
  push:
    branches: [dds-training-local]
    paths:
      - 'dds_training/**'
      - '.github/workflows/dds-training-local-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Test immutable experience memory and learning planner
        working-directory: dds_training
        run: python experience_selftest.py

      - name: Restore DDS3 Bazel disk cache
        id: dds-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/bazel-dds3
          key: dds3-v3.0.0-bazel7.6.1-py314-${{ runner.os }}

      - name: Bootstrap local DDS3 and run technical preflight
        run: bash dds_training/bootstrap_linux.sh

      - name: Verify launch guard blocks accidental training
        working-directory: dds_training
        run: |
          set -euo pipefail
          python run_stage.py prepare --stage pilot --out /tmp/dds-pilot-prepared
          if python run_stage.py evaluate --stage pilot --work /tmp/dds-pilot-prepared --predictions /tmp/does-not-exist.jsonl 2>/tmp/guard.err; then
            echo "ERROR: evaluate unexpectedly ran without --start" >&2
            exit 1
          fi
          grep -q -- "--start was not supplied" /tmp/guard.err

      - name: Check deterministic pilot preparation and manifest audit
        working-directory: dds_training
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('/tmp/dds-pilot-prepared/corpus_summary.json').read_text())
          state=json.loads(Path('/tmp/dds-pilot-prepared/state.json').read_text())
          assert s['count']==10000, s
          assert s['splits']=={'train':7000,'validation':1500,'sealed_test':1500}, s['splits']
          assert state['manifest_audit']['status']=='ok', state['manifest_audit']
          tasks=sum(1 for _ in Path('/tmp/dds-pilot-prepared/blind_tasks.jsonl').open())
          assert tasks==20000, tasks
          print({'pilot_deals':s['count'],'splits':s['splits'],'blind_tasks':tasks,'manifest_audit':'ok','dds_training_started':False})
          PY

      - name: Audit empty prepared database without starting training
        working-directory: dds_training
        run: |
          set -euo pipefail
          python run_stage.py audit --work /tmp/dds-pilot-prepared --fail-on-error

      - name: Save DDS3 Bazel disk cache
        if: always() && steps.dds-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/bazel-dds3
          key: dds3-v3.0.0-bazel7.6.1-py314-${{ runner.os }}
