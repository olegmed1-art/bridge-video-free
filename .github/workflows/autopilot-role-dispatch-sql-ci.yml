permissions:
  contents: read

jobs:
  live-0302-fails-closed:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: autopilot_role_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d autopilot_role_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/autopilot_role_ci
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install PostgreSQL client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client >/dev/null

      - name: Prove exact live baseline rejects out-of-order bridge
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          CREATE TABLE public.schema_migration (
            migration_key text PRIMARY KEY,
            applied_at timestamptz NOT NULL DEFAULT now(),
            checksum text
          );
          SQL
          for migration in \
            database/migrations/0300_autopilot_oracle_shadow.sql \
            database/migrations/0301_autopilot_github_pr_read_only.sql \
            database/migrations/0302_autopilot_github_ci_read_only.sql; do
            psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f "$migration"
          done
          if psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
              -f database/migrations/0322_autopilot_chatgpt_role_dispatch.sql \
              >"$RUNNER_TEMP/0322.out" 2>&1; then
            echo '0322 unexpectedly accepted the incomplete 0302 baseline' >&2
            exit 1
          fi
          grep -F 'AUTOPILOT_ROLE_DISPATCH_REQUIRES_0321' "$RUNNER_TEMP/0322.out"
          test "$(psql "$DATABASE_URL" -XAtv ON_ERROR_STOP=1 -c \
            "SELECT to_regclass('autopilot.role_dispatch_outbox') IS NULL;")" = t
          test "$(psql "$DATABASE_URL" -XAtv ON_ERROR_STOP=1 -c \
            "SELECT count(*) FROM schema_migration WHERE migration_key='0322_autopilot_chatgpt_role_dispatch';")" = 0

  current-main-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: autopilot_main_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d autopilot_main_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/autopilot_main_ci
      DATABASE_URL: postgresql://bridge_ci_owner:bridge_ci_owner@localhost:5432/autopilot_main_ci
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install PostgreSQL client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client >/dev/null

      - name: Bootstrap managed-owner-compatible database
        run: |
          set -euo pipefail
          psql "$ADMIN_DATABASE_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          CREATE EXTENSION IF NOT EXISTS btree_gist;
          CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
          CREATE ROLE bridge_ci_owner LOGIN PASSWORD 'bridge_ci_owner' CREATEROLE NOSUPERUSER NOCREATEDB NOREPLICATION;
          ALTER DATABASE autopilot_main_ci OWNER TO bridge_ci_owner;
          ALTER SCHEMA public OWNER TO bridge_ci_owner;
          SQL

      - name: Apply current main migration chain, role test, and clean rollback
        run: |
          set -euo pipefail
          chmod +x database/scripts/migrate.sh
          database/scripts/migrate.sh
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f database/tests/322_autopilot_chatgpt_role_dispatch.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f database/tests/323_autopilot_failure_continuation.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f database/tests/324_autopilot_project_planner.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f database/tests/324a_autopilot_dynamic_role_registry.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f database/tests/325_autopilot_durable_dependency_wakeup.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f database/tests/327_autopilot_delivery_proof.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f database/tests/328_autopilot_chat_target_gate.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f database/tests/331_autopilot_six_worker_capacity.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f database/tests/332_autopilot_codex_event_cycle.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f database/tests/333_autopilot_dispatch_assignment_coherence.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f database/tests/334_autopilot_github_probe_retry.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f database/tests/335_autopilot_codex_delivery_window.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f database/tests/336_autopilot_codex_terminal_implicit_delivery.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f database/tests/337_autopilot_role_repair_admission.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f database/tests/337a_autopilot_role_repair_callback.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f database/tests/343_autopilot_provider_failure_no_repair.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f database/tests/344_autopilot_mailbox_v2_rotation.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f database/tests/345_autopilot_mailbox_v2_codex_inbound.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f database/tests/346_autopilot_canary_acceptance_guard.sql

      - name: Prove concurrent six-worker admission
        run: |
          set -euo pipefail
          capacity_database_url='postgresql://bridge_ci_owner:bridge_ci_owner@localhost:5432/autopilot_capacity_ci'
          cleanup() {
            psql "$ADMIN_DATABASE_URL" -X -v ON_ERROR_STOP=1 -c \
              'DROP DATABASE IF EXISTS autopilot_capacity_ci WITH (FORCE);'
          }
          trap cleanup EXIT
          psql "$ADMIN_DATABASE_URL" -X -v ON_ERROR_STOP=1 -c \
            'CREATE DATABASE autopilot_capacity_ci WITH TEMPLATE autopilot_main_ci OWNER bridge_ci_owner;'
          chmod +x database/tests/331_autopilot_six_worker_capacity_concurrency.sh
          database/tests/331_autopilot_six_worker_capacity_concurrency.sh \
            "$capacity_database_url"
          # A higher migration may legitimately depend on the role-dispatch tables.
          # If the publication chain is present, roll it back first so this lower-chain
          # roundtrip never bypasses its evidence-preserving rollback guards.
          upper_publication_chain_count="$(psql "$DATABASE_URL" -XAtv ON_ERROR_STOP=1 -c \
            "SELECT count(*) FROM public.schema_migration WHERE migration_key IN ('0338_autopilot_bounded_publication_permit','0339_autopilot_native_cli_receipts','0340_autopilot_publication_permit_issuer','0343_autopilot_provider_failure_no_repair','0344_autopilot_mailbox_v2_rotation','0345_autopilot_mailbox_v2_codex_inbound','0346_autopilot_canary_acceptance_guard');")"
          had_mailbox_v3="$(psql "$DATABASE_URL" -XAtv ON_ERROR_STOP=1 -c \
            "SELECT count(*) FROM public.schema_migration WHERE migration_key='0350_autopilot_mailbox_v3_rotation';")"
          had_paused_reconcile="$(psql "$DATABASE_URL" -XAtv ON_ERROR_STOP=1 -c \
            "SELECT count(*) FROM public.schema_migration WHERE migration_key='0351_autopilot_paused_evidence_reconcile';")"
          had_operational_safety="$(psql "$DATABASE_URL" -XAtv ON_ERROR_STOP=1 -c \
            "SELECT count(*) FROM public.schema_migration WHERE migration_key='0352_autopilot_operational_safety_signals';")"
          had_paused_runner="$(psql "$DATABASE_URL" -XAtv ON_ERROR_STOP=1 -c \
            "SELECT count(*) FROM public.schema_migration WHERE migration_key='0353_autopilot_paused_reconcile_runner';")"
          had_mailbox_v4="$(psql "$DATABASE_URL" -XAtv ON_ERROR_STOP=1 -c \
            "SELECT count(*) FROM public.schema_migration WHERE migration_key='0357_autopilot_mailbox_v4_rotation';")"
          had_health_repair="$(psql "$DATABASE_URL" -XAtv ON_ERROR_STOP=1 -c \
            "SELECT count(*) FROM public.schema_migration WHERE migration_key='0358_autopilot_health_repair_progression';")"
          if [ "$had_health_repair" -eq 1 ]; then
            psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f database/rollbacks/0358_autopilot_health_repair_progression.sql
          fi
          if [ "$had_mailbox_v4" -eq 1 ]; then
            psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f database/rollbacks/0357_autopilot_mailbox_v4_rotation.sql
          fi
          if [ "$had_paused_runner" -eq 1 ]; then
            psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f database/rollbacks/0353_autopilot_paused_reconcile_runner.sql
          fi
          if [ "$had_operational_safety" -eq 1 ]; then
            psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f database/rollbacks/0352_autopilot_operational_safety_signals.sql
          fi
          if [ "$had_paused_reconcile" -eq 1 ]; then
            psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f database/rollbacks/0351_autopilot_paused_evidence_reconcile.sql
          fi
          if [ "$had_mailbox_v3" -eq 1 ]; then
            psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f database/rollbacks/0350_autopilot_mailbox_v3_rotation.sql
          fi
          if [ "$upper_publication_chain_count" -eq 7 ]; then
            psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c \
              "UPDATE autopilot.project_planner_state SET enabled=false,last_decision_code='SQL_ROUNDTRIP_PAUSED',last_decision_at=clock_timestamp() WHERE singleton;"
            psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f database/rollbacks/0346_autopilot_canary_acceptance_guard.sql
            psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f database/rollbacks/0345_autopilot_mailbox_v2_codex_inbound.sql
            psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f database/rollbacks/0344_autopilot_mailbox_v2_rotation.sql
            psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f database/rollbacks/0343_autopilot_provider_failure_no_repair.sql
            psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f database/rollbacks/0340_autopilot_publication_permit_issuer.sql
            psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f database/rollbacks/0339_autopilot_native_cli_receipts.sql
            psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f database/rollbacks/0338_autopilot_bounded_publication_permit.sql
          elif [ "$upper_publication_chain_count" -ne 0 ]; then
            echo "partial publication migration chain: $upper_publication_chain_count/7" >&2
            exit 1
          fi

          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f database/rollbacks/0337_autopilot_role_repair_admission.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f database/rollbacks/0336_autopilot_codex_terminal_implicit_delivery.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f database/rollbacks/0335_autopilot_codex_delivery_window.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f database/rollbacks/0334_autopilot_github_probe_retry.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f database/rollbacks/0333_autopilot_dispatch_assignment_coherence.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f database/rollbacks/0332_autopilot_codex_event_cycle.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f database/rollbacks/0331_autopilot_six_worker_capacity.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f database/rollbacks/0328_autopilot_chat_target_gate.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f database/rollbacks/0327_autopilot_delivery_proof.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f database/rollbacks/0325_autopilot_durable_dependency_wakeup.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f database/rollbacks/0324a_autopilot_dynamic_role_registry.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f database/rollbacks/0324_autopilot_project_planner.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f database/rollbacks/0323_autopilot_failure_continuation.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f database/rollbacks/0322_autopilot_chatgpt_role_dispatch.sql
          test "$(psql "$DATABASE_URL" -XAtv ON_ERROR_STOP=1 -c \
            "SELECT to_regclass('autopilot.role_dispatch_outbox') IS NULL;")" = t
          test "$(psql "$DATABASE_URL" -XAtv ON_ERROR_STOP=1 -c \
            "SELECT count(*) FROM schema_migration WHERE migration_key='0322_autopilot_chatgpt_role_dispatch';")" = 0
          test "$(psql "$DATABASE_URL" -XAtv ON_ERROR_STOP=1 -c \
            "SELECT count(*) FROM schema_migration WHERE migration_key='0323_autopilot_failure_continuation';")" = 0
          test "$(psql "$DATABASE_URL" -XAtv ON_ERROR_STOP=1 -c \
            "SELECT count(*) FROM schema_migration WHERE migration_key='0324_autopilot_project_planner';")" = 0
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f database/migrations/0322_autopilot_chatgpt_role_dispatch.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
