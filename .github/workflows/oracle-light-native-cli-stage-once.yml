name: Oracle Light native CLI stage once

on:
  pull_request:
    paths:
      - '.github/workflows/oracle-light-native-cli-stage-once.yml'
      - 'ops/oracle_light_native_cli_stage_once.py'
      - 'tests/test_oracle_light_native_cli_stage_once.py'
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact reviewed current main SHA for a one-time ubuntu CLI install
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: oracle-light-backup-mutation
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: |
          python -m unittest -q tests.test_oracle_light_native_cli_stage_once
          ruby -e 'require "yaml"; YAML.parse_file(ARGV.fetch(0))' .github/workflows/oracle-light-native-cli-stage-once.yml

  stage:
    needs: contract
    if: >-
      github.repository == 'olegmed1-art/bridge-video-free' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.actor == github.repository_owner &&
      inputs.expected_main_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install pinned CLI only under ubuntu on exact HOLD host
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          umask 077
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          [[ "$(gh api repos/olegmed1-art/bridge-video-free/git/ref/heads/main --jq .object.sha)" == "$GITHUB_SHA" ]]
          unset GH_TOKEN
          [[ -n "${SSH_PRIVATE_KEY:-}" ]]
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$work/key"
          unset SSH_PRIVATE_KEY
          ssh-keygen -y -P '' -f "$work/key" > "$work/public" 2>/dev/null
          bash ops/oracle_known_hosts_from_scan.sh 92.5.47.149 SHA256:XBR1x74uJ41BxmDF7Y9P20GjIjNbrYXqieV4c2MC0Go "$work/known_hosts"
          ssh -F /dev/null -i "$work/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$work/known_hosts" -o ConnectTimeout=15 -o ConnectionAttempts=1 ubuntu@92.5.47.149 'sudo -n /usr/bin/python3 -' < ops/oracle_light_active_hold_attest.py > "$work/attestation"
          python3 - "$work/attestation" <<'PY'
          import json,sys
          from pathlib import Path
          path=Path(sys.argv[1])
          if path.stat().st_size>4096:
              raise SystemExit('LIVE_HOLD_ATTESTATION_INVALID')
          result=json.loads(path.read_text())
          if (result.get('audit')!='ACTIVE_HOLD_PASS' or
                  result.get('admission')!='HOLD' or
                  result.get('queue_nonterminal')!=0 or
                  result.get('same_invocation') is not True or
                  result.get('database_login')!='READ_ONLY_PASS'):
              raise SystemExit('LIVE_HOLD_ATTESTATION_INVALID')
          print('LIVE_HOLD_QUEUE_ZERO_PASS')
          PY
          ssh -F /dev/null -i "$work/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$work/known_hosts" -o ConnectTimeout=15 -o ConnectionAttempts=1 ubuntu@92.5.47.149 'python3 -' < ops/oracle_light_native_cli_stage_once.py
