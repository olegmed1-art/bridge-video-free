name: Workflow credential boundary synthetic CI

# create validates the exact draft head while [skip ci] suppresses unrelated
# push/PR workflows and their credential-bearing workflow_run followers.
on:
  create:
  pull_request:
    paths:
      - '.github/workflows/oracle-light-native-cli-install-preflight.yml'
      - '.github/workflows/diana-longitudinal-v42-regression.yml'
      - '.github/workflows/bridge-ai-pilot100.yml'
      - '.github/workflows/oracle-universal-video-oci-auth-probe.yml'
      - '.github/workflows/oci-object-storage-readonly-inventory.yml'
      - '.github/workflows/ibm-vpc-power-probe.yml'
      - '.github/workflows/workflow-credential-boundary-contract.yml'
      - 'tests/test_workflow_credential_boundary.py'

permissions:
  contents: read

jobs:
  contract:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'create' &&
       github.event.ref_type == 'branch' &&
       startsWith(github.event.ref, 'security/critical-workflow-quarantine-'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Record exact checked-out source
        run: |
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
          git diff --check HEAD^ HEAD
      - name: Install YAML parser without runtime dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Check workflow syntax with verified actionlint
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --location --retry 2 --max-time 120 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/security-actionlint"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/security-actionlint" actionlint
          "$RUNNER_TEMP/security-actionlint/actionlint" -shellcheck= -pyflakes= \
            .github/workflows/oracle-light-native-cli-install-preflight.yml \
            .github/workflows/diana-longitudinal-v42-regression.yml \
            .github/workflows/bridge-ai-pilot100.yml \
            .github/workflows/oracle-universal-video-oci-auth-probe.yml \
            .github/workflows/oci-object-storage-readonly-inventory.yml \
            .github/workflows/ibm-vpc-power-probe.yml \
            .github/workflows/workflow-credential-boundary-contract.yml
      - name: Run synthetic regressions with empty credential environment and blocked sockets
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import runpy
          import socket
          import unittest

          path = os.environ.get("PATH", "/usr/bin:/bin")
          os.environ.clear()
          os.environ["PATH"] = path

          def blocked(*args, **kwargs):
              raise AssertionError("Network forbidden in synthetic regression suite")
          socket.create_connection = blocked
          socket.socket.connect = blocked
          socket.socket.connect_ex = blocked

          suite = unittest.defaultTestLoader.loadTestsFromNames([
              "tests.test_workflow_credential_boundary",
              "tests.test_oracle_light_native_cli_install_preflight",
              "tests.test_ibm_vpc_power",
              "tests.test_ibm_vpc_oracle_probe",
          ])
          namespace = runpy.run_path("tests/test_oracle_universal_video_oci_auth_probe_contract.py")
          for name, value in sorted(namespace.items()):
              if name.startswith("test_") and callable(value):
                  suite.addTest(unittest.FunctionTestCase(value))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(not result.wasSuccessful())
          PY
      - name: Prove the original reviewed baseline fails the new boundary contract
        if: github.event_name == 'create'
        run: |
          python - <<'PY'
          import subprocess
          from tests.test_workflow_credential_boundary import ROOT, PRIVILEGED, parse, validate
          base = "f513afc4a1a4cae325b7baeeef5f4848dd29a7a5"
          for name in PRIVILEGED:
              source = subprocess.check_output([
                  "git", "show", base + ":.github/workflows/" + name
              ], text=True)
              errors = validate(name, parse(source))
              assert errors, name
              print(name, "BASELINE_REJECTED", len(errors))
              before = parse(source)
              after = parse((ROOT / ".github/workflows" / name).read_text())
              for job_id in PRIVILEGED[name]:
                  old_steps = {s.get("name", str(i)): s["run"] for i, s in
                               enumerate(before["jobs"][job_id]["steps"]) if "run" in s}
                  new_steps = {s.get("name", str(i)): s["run"] for i, s in
                               enumerate(after["jobs"][job_id]["steps"]) if "run" in s}
                  for label, old_script in old_steps.items():
                      new_label = label.replace("without reading values", "without disclosing values")
                      expected = old_script
                      if name == "oci-object-storage-readonly-inventory.yml" and label == "Configure OCI CLI":
                          expected = expected.replace(
                              "python -m pip install --disable-pip-version-check -q 'oci-cli==3.90.3'\n", "")
                      assert new_steps[new_label] == expected, (name, job_id, label)
              print(name, "PRIVILEGED_SCRIPTS_PRESERVED")
          print("BASELINE_BOUNDARY_WITNESSES_PASS")
          PY
