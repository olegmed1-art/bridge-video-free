name: Tournament Analyzer v3 Scoring Context

on:
  pull_request:
    paths:
      - "bridge_school_api/tournament_scoring_context_v3.py"
      - "tools/tournament_real_longitudinal_v3.py"
      - "tests/test_tournament_scoring_context_v3.py"
      - "data/tournaments/tournament_30041_round2_diana_facts_v1.json"
      - ".github/workflows/tournament-analyzer-v3-scoring-context.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  scoring-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile scoring/report modules
        run: |
          python -m py_compile bridge_school_api/tournament_scoring_context_v3.py
          python -m py_compile tools/tournament_real_longitudinal_v3.py
      - name: Run scoring context contracts
        run: |
          python -m pytest -q \
            tests/test_tournament_analyzer_v3.py \
            tests/test_tournament_analyzer_v3_stage2.py \
            tests/test_tournament_real_sources_v3.py \
            tests/test_tournament_scoring_context_v3.py
      - name: Restore exact historical DDS3 evidence artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/30041 evidence/29912
          curl -fsSL --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9463631738/zip" \
            -o /tmp/30041.zip
          curl -fsSL --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9471054929/zip" \
            -o /tmp/29912.zip
          unzip -q /tmp/30041.zip -d evidence/30041
          unzip -q /tmp/29912.zip -d evidence/29912
      - name: Build longitudinal report with MP context
        run: |
          set -euo pipefail
          DDS30041="$(find evidence/30041 -type f -name 'diana-30041-round2-dds3.json' -print -quit)"
          DDS29912="$(find evidence/29912 -type f -name 'diana-29912-cross-session-dds3.json' -print -quit)"
          test -n "$DDS30041"
          test -n "$DDS29912"
          PYTHONPATH="$PWD" python tools/tournament_real_longitudinal_v3.py \
            --facts-30041 data/tournaments/tournament_30041_round2_diana_facts_v1.json \
            --dds3-30041 "$DDS30041" \
            --dds3-29912 "$DDS29912" \
            --out-json tournament-longitudinal-scoring-context.json \
            --out-md tournament-longitudinal-scoring-context.md
      - name: Evidence-only scoring gate
        run: |
          python - <<'PY'
          import json
          p=json.load(open('tournament-longitudinal-scoring-context.json', encoding='utf-8'))
          mp=p['scoring_context']['30041']
          assert mp['schema']=='tournament-mp-outcome-context-v1'
          assert mp['event_id']=='30041' and mp['session_id']=='round-2'
          assert mp['final_percentage']==54.57
          assert mp['rank']==8 and mp['field_size']==23 and mp['counted_results']==22
          assert len(mp['outcomes'])==22
          assert abs(mp['total_below_neutral_mass']-247.5)<1e-9
          assert abs(mp['counterfactual_final_percentage_if_all_below_neutral_were_neutral']-65.82)<1e-9
          assert mp['dd_to_mp_conversion_available'] is False
          assert mp['causal_error_attribution_allowed'] is False
          assert mp['pedagogically_recoverable_result_estimated'] is False
          assert len(mp['technical_finding_context'])==p['events']['30041']['finding_count']
          assert all(x['causal_link']=='NOT_ESTABLISHED' for x in mp['technical_finding_context'])
          assert all(x['dd_to_mp_conversion_available'] is False for x in mp['technical_finding_context'])
          assert p['scoring_context']['29912']['status']=='UNAVAILABLE_IN_CURRENT_EVIDENCE'
          print('TOURNAMENT_MP_SCORING_CONTEXT_PASS', len(mp['technical_finding_context']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tournament-analyzer-v3-scoring-context
          path: |
            tournament-longitudinal-scoring-context.json
            tournament-longitudinal-scoring-context.md
          if-no-files-found: error
          retention-days: 30
