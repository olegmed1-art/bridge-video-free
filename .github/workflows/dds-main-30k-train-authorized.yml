name: DDS main 30k — legacy GitHub compute blocked

on:
  workflow_dispatch:
    inputs:
      approve_stage2:
        description: Confirm explicit start of Stage-2 main TRAIN on the selected main commit
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: dds-main-30k-authorized-train
  cancel-in-progress: false

env:
  PREPARED_DRIVE_LOCATOR: dds_training/artifact_locations/dds-main-30k-prepared-32052220151.json
  PREPARED_ZIP_SHA256: f29a20457b1ac9e302dae3165fd6048b19b5005d4bda2a7c4bbefc38f5f3cf7c
  PREPARED_TGZ_SHA256: 2ca5015493b263a768611a97fc004aed16bd40926cf4ae0f2bb6202349d7bd74
  GH_TOKEN: ${{ github.token }}

jobs:
  train:
    # Canonical mass DDS compute runs only on the existing Oracle host.
    # Keep this historical workflow fail-closed so workflow_dispatch cannot
    # consume GitHub-hosted compute or bypass the Oracle cost/evidence gate.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Enforce explicit owner authorization boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF_NAME" = main
          test "$GITHUB_ACTOR" = olegmed1-art
          test "$GITHUB_TRIGGERING_ACTOR" = olegmed1-art
          test "${{ inputs.approve_stage2 }}" = "true"
          test "${#GITHUB_SHA}" -eq 40
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout authorized main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Validate Drive restore contract before credentials
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'requests==2.32.5' 'google-auth==2.40.3'
          PYTHONPATH=. python tests/test_restore_drive_split_artifact.py
          PYTHONPATH=. python tools/restore_drive_split_artifact.py \
            --locator "$PREPARED_DRIVE_LOCATOR" \
            --output /tmp/unused-dds-main-prepared.zip \
            --validate-only

      - name: Restore prior failed-attempt progress for restart/resume
        if: ${{ github.run_attempt > 1 }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/dds-restore dds_training/work/pilot
          mkdir -p /tmp/dds-restore dds_training/work
          previous_attempt=$((GITHUB_RUN_ATTEMPT - 1))
          artifact="dds-main-train-progress-${GITHUB_RUN_ID}-a${previous_attempt}"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir /tmp/dds-restore
          archive="$(find /tmp/dds-restore -name 'dds-main-train-progress-state.tgz' -print -quit)"
          checksum="$(find /tmp/dds-restore -name 'dds-main-train-progress-state.sha256' -print -quit)"
          test -n "$archive" && test -n "$checksum"
          test "$(sha256sum "$archive" | awk '{print $1}')" = "$(awk '{print $1}' "$checksum")"
          tar -xzf "$archive" -C dds_training/work

      - name: Restore prepared base state from verified Google Drive copy
        if: ${{ github.run_attempt == 1 }}
        shell: bash
        env:
          GOOGLE_DRIVE_OAUTH_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_JSON }}
        run: |
          set -euo pipefail
          rm -rf /tmp/dds-restore dds_training/work/pilot
          mkdir -p /tmp/dds-restore dds_training/work
          PYTHONPATH=. python tools/restore_drive_split_artifact.py \
            --locator "$PREPARED_DRIVE_LOCATOR" \
            --output /tmp/dds-restore/prepared-artifact.zip \
            --work-dir /tmp/dds-restore/parts
          echo "$PREPARED_ZIP_SHA256  /tmp/dds-restore/prepared-artifact.zip" | sha256sum -c -
          unzip -q /tmp/dds-restore/prepared-artifact.zip -d /tmp/dds-restore/extracted
          archive="$(find /tmp/dds-restore/extracted -name 'dds-main-30k-prepared-state.tgz' -print -quit)"
          checksum="$(find /tmp/dds-restore/extracted -name 'dds-main-30k-prepared-state.sha256' -print -quit)"
          test -n "$archive" && test -n "$checksum"
          echo "$PREPARED_TGZ_SHA256  $archive" | sha256sum -c -
          test "$(sha256sum "$archive" | awk '{print $1}')" = "$(awk '{print $1}' "$checksum")"
          tar -xzf "$archive" -C dds_training/work

      - name: Restore verified DDS3 wheel and Bazel state
        id: dds-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            dds_training/.wheel-cache/dds3
            ~/.cache/bazel-dds3
          key: dds3-wheel-v5-${{ runner.os }}-py314-${{ hashFiles('dds_training/bootstrap_linux.sh') }}
          restore-keys: dds3-wheel-v5-${{ runner.os }}-py314-

      - name: Bootstrap pinned local DDS3 without extra preflight
        run: DDS_RUN_PREFLIGHT=0 bash dds_training/bootstrap_linux.sh

      - name: Save verified DDS3 cache under exact key
        if: ${{ steps.dds-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            dds_training/.wheel-cache/dds3
            ~/.cache/bazel-dds3
          key: dds3-wheel-v5-${{ runner.os }}-py314-${{ hashFiles('dds_training/bootstrap_linux.sh') }}

      - name: Execute restartable owner-authorized base TRAIN stage
        working-directory: dds_training
        env:
          DDS_MAIN_EXPECTED_COMMIT: ${{ github.sha }}
          DDS_MAIN_APPROVAL_PHRASE: ЭТАП-2-СТАРТ-ПОДТВЕРЖДАЮ
          DDS_MAIN_EVIDENCE_DIR: /tmp/dds-main-shard-evidence
        run: bash run_main_train_authorized.sh

      - name: Package progress state and per-shard evidence
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dds-main-train-progress
          if [ -d dds_training/work/pilot ]; then
            tar -czf /tmp/dds-main-train-progress/dds-main-train-progress-state.tgz -C dds_training/work pilot
            (cd /tmp/dds-main-train-progress && sha256sum dds-main-train-progress-state.tgz > dds-main-train-progress-state.sha256)
          fi
          if [ -d /tmp/dds-main-shard-evidence ]; then
            tar -czf /tmp/dds-main-train-progress/dds-main-train-shard-evidence.tgz -C /tmp dds-main-shard-evidence
            (cd /tmp/dds-main-train-progress && sha256sum dds-main-train-shard-evidence.tgz > dds-main-train-shard-evidence.sha256)
          fi

      - name: Upload restartable progress state
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dds-main-train-progress-${{ github.run_id }}-a${{ github.run_attempt }}
          path: /tmp/dds-main-train-progress/
          if-no-files-found: warn
          retention-days: 90
