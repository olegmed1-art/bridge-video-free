name: Tournament Analyzer v3 Teacher Decision Intake

on:
  pull_request:
    paths:
      - "bridge_school_api/tournament_teacher_decision_intake_v3.py"
      - "tools/tournament_teacher_decision_intake_v3.py"
      - "tests/test_tournament_teacher_decision_intake_v3.py"
      - ".github/workflows/tournament-analyzer-v3-teacher-decision-intake.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  real-decision-intake-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile modules
        run: |
          python -m py_compile bridge_school_api/tournament_teacher_decision_intake_v3.py
          python -m py_compile tools/tournament_teacher_decision_intake_v3.py
      - name: Run focused contracts
        run: |
          python -m pytest -q \
            tests/test_tournament_teacher_review_bundle_v3.py \
            tests/test_tournament_teacher_confirmed_longitudinal_v3.py \
            tests/test_tournament_teacher_decision_intake_v3.py
      - name: Restore exact portable real-evidence bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9558677983/zip" \
            -o /tmp/teacher-bundle.zip
          echo "6c0fd70f8b8f12a6f27f709dcb637ce198f66fbffb28798dc0dcf0773b625b66  /tmp/teacher-bundle.zip" | sha256sum -c -
          mkdir -p evidence/bundle
          unzip -q /tmp/teacher-bundle.zip -d evidence/bundle
          BUNDLE="$(find evidence/bundle -type f -name 'tournament-teacher-review-bundle.json' -print -quit)"
          test -n "$BUNDLE"
          echo "BUNDLE=$BUNDLE" >> "$GITHUB_ENV"
      - name: Build inert explicit-teacher decision template
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python tools/tournament_teacher_decision_intake_v3.py template \
            --bundle "$BUNDLE" \
            --out tournament-teacher-decision-intake.json
      - name: Apply unchanged template and prove zero automatic decisions
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python tools/tournament_teacher_decision_intake_v3.py apply \
            --bundle "$BUNDLE" \
            --intake tournament-teacher-decision-intake.json \
            --out tournament-teacher-decision-intake-result.json
          python - <<'PY'
          import json
          t=json.load(open('tournament-teacher-decision-intake.json', encoding='utf-8'))
          r=json.load(open('tournament-teacher-decision-intake-result.json', encoding='utf-8'))
          assert t['schema']=='tournament-teacher-decision-intake-v1'
          assert t['bundle_id']=='9bbb8f44afe9e8beff93627f1ec1e03d5ae9c97aa761ab2d8ceae6d82ee59033'
          assert len(t['decisions'])==17
          assert all(x['status'] is None for x in t['decisions'])
          assert all(x['decision_actor'] is None for x in t['decisions'])
          assert all(x['explicit_teacher_decision'] is False for x in t['decisions'])
          assert r['decided_count']==0
          assert r['pending_count']==17
          assert all(x['status']=='PENDING' for x in r['ledger']['decisions'])
          assert r['automatic_decisions_allowed'] is False
          assert r['automatic_methodology_mapping_allowed'] is False
          assert r['automatic_student_error_attribution_allowed'] is False
          print('TOURNAMENT_TEACHER_DECISION_INTAKE_ZERO_AUTO_DECISIONS_PASS')
          PY
      - name: Prove unchanged intake still yields zero confirmed longitudinal items
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('tournament-teacher-decision-intake-result.json', encoding='utf-8'))
          json.dump(r['ledger'], open('/tmp/decision-ledger.json','w',encoding='utf-8'), ensure_ascii=False, indent=2)
          PY
          PYTHONPATH="$PWD" python tools/tournament_teacher_confirmed_longitudinal_v3.py \
            --bundle "$BUNDLE" \
            --ledger /tmp/decision-ledger.json \
            --out-json /tmp/confirmed.json \
            --out-md /tmp/confirmed.md
          python - <<'PY'
          import json
          p=json.load(open('/tmp/confirmed.json', encoding='utf-8'))
          assert p['status_counts']['PENDING']==17
          assert p['confirmed_items']==[]
          assert p['persistent_clusters']==[]
          print('TOURNAMENT_TEACHER_DECISION_INTAKE_LONGITUDINAL_GATE_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tournament-analyzer-v3-teacher-decision-intake-template
          path: |
            tournament-teacher-decision-intake.json
            tournament-teacher-decision-intake-result.json
          if-no-files-found: error
          retention-days: 30
