name: Tournament Analyzer v3 Teacher Review Portfolio

on:
  pull_request:
    paths:
      - "bridge_school_api/tournament_teacher_review_portfolio_v3.py"
      - "tools/tournament_teacher_review_portfolio_v3.py"
      - "tests/test_tournament_teacher_review_portfolio_v3.py"
      - ".github/workflows/tournament-analyzer-v3-teacher-review-portfolio.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  real-review-portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests and compile
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m py_compile bridge_school_api/tournament_teacher_review_portfolio_v3.py tools/tournament_teacher_review_portfolio_v3.py
          python -m pytest -q tests/test_tournament_teacher_review_portfolio_v3.py
      - name: Restore exact pending review batches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/historical evidence/opening-lead
          for spec in \
            "9558677983:/tmp/historical.zip:evidence/historical" \
            "9569379785:/tmp/opening-lead.zip:evidence/opening-lead"; do
            IFS=: read -r aid zip dest <<< "$spec"
            curl -fsSL --retry 3 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${aid}/zip" \
              -o "$zip"
            unzip -q "$zip" -d "$dest"
          done
          HISTORICAL_BUNDLE="$(find evidence/historical -type f -name 'tournament-teacher-review-bundle.json' -print -quit)"
          OPENING_HANDOFF="$(find evidence/opening-lead -type f -name 'tournament-30041-opening-lead-review-handoff.json' -print -quit)"
          test -n "$HISTORICAL_BUNDLE" && test -n "$OPENING_HANDOFF"
          echo "HISTORICAL_BUNDLE=$HISTORICAL_BUNDLE" >> "$GITHUB_ENV"
          echo "OPENING_HANDOFF=$OPENING_HANDOFF" >> "$GITHUB_ENV"
      - name: Convert opening-lead handoff to portable bundle
        run: |
          PYTHONPATH="$PWD" python - <<'PY'
          import json
          from bridge_school_api.tournament_teacher_review_bundle_v3 import build_teacher_review_bundle, verify_teacher_review_bundle
          h=json.load(open('${{ env.OPENING_HANDOFF }}', encoding='utf-8'))
          b=build_teacher_review_bundle(h['queue'], h['decision_ledger'], h['dossier'])
          verify_teacher_review_bundle(b)
          assert b['item_count']==4
          assert b['event_counts']=={'30041': 4}
          json.dump(b, open('opening-lead-portable-bundle.json','w',encoding='utf-8'), ensure_ascii=False, indent=2)
          print('OPENING_LEAD_PORTABLE_BUNDLE_PASS', b['bundle_id'])
          PY
      - name: Build unified pending review portfolio
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python tools/tournament_teacher_review_portfolio_v3.py \
            --bundle "$HISTORICAL_BUNDLE" \
            --bundle opening-lead-portable-bundle.json \
            --out-json tournament-teacher-review-portfolio.json \
            --out-md tournament-teacher-review-portfolio.md
          cat tournament-teacher-review-portfolio.md
      - name: Real portfolio evidence gate
        run: |
          PYTHONPATH="$PWD" python - <<'PY'
          import json
          from bridge_school_api.tournament_teacher_review_portfolio_v3 import verify_teacher_review_portfolio
          historical=json.load(open('${{ env.HISTORICAL_BUNDLE }}', encoding='utf-8'))
          opening=json.load(open('opening-lead-portable-bundle.json', encoding='utf-8'))
          p=json.load(open('tournament-teacher-review-portfolio.json', encoding='utf-8'))
          verify_teacher_review_portfolio(p, [historical, opening])
          assert historical['item_count']==17
          assert opening['item_count']==4
          assert p['schema']=='tournament-teacher-review-portfolio-v1'
          assert p['source_bundle_count']==2
          assert p['item_count']==21
          assert p['pending_decision_count']==21
          assert p['event_counts']=={'29912':10,'30041':11}
          assert p['category_counts']['opening_lead_dds3']==4
          assert p['review_state']=='BLOCKED_PENDING_TEACHER_DECISIONS'
          assert p['automatic_decisions_allowed'] is False
          assert p['automatic_methodology_mapping_allowed'] is False
          assert p['automatic_student_error_attribution_allowed'] is False
          assert p['cross_batch_numeric_ranking_allowed'] is False
          assert p['cross_category_causal_collapse_allowed'] is False
          assert p['historical_bundle_mutation_allowed'] is False
          opening_ids={x['review_id'] for x in opening['components']['ledger']['decisions']}
          portfolio_ids={x['review_id'] for x in p['items']}
          assert opening_ids <= portfolio_ids
          assert len(portfolio_ids)==21
          print('TOURNAMENT_TEACHER_REVIEW_PORTFOLIO_REAL_PASS')
          print('portfolio_id', p['portfolio_id'])
          print('event_counts', p['event_counts'])
          print('category_counts', p['category_counts'])
          print('multi_signal_deals', [(x['deal_id'],x['categories']) for x in p['multi_signal_deals']])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tournament-analyzer-v3-teacher-review-portfolio
          path: |
            opening-lead-portable-bundle.json
            tournament-teacher-review-portfolio.json
            tournament-teacher-review-portfolio.md
          if-no-files-found: error
          retention-days: 30
