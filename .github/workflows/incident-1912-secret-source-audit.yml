name: Incident 1912 GitHub secret URI authority audit

on:
  workflow_dispatch:
    inputs:
      exact_sha:
        description: Exact current main commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: incident-1912-secret-source-audit
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ github.repository == 'olegmed1-art/bridge-video-free' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify exact main revision
        env:
          EXACT_SHA: ${{ inputs.exact_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$EXACT_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXACT_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_SHA"
      # Current endpoint mapping must be checked in Neon before interpreting
      # the fixed output categories. This does not test passwords or Vercel.
      - name: Classify saved URI authorities without a database connection
        env:
          BRIDGE_APP_DATABASE_URL: ${{ secrets.BRIDGE_APP_DATABASE_URL }}
          BRIDGE_WORKER_DATABASE_URL: ${{ secrets.BRIDGE_WORKER_DATABASE_URL }}
          BRIDGE_HEALTH_DATABASE_URL: ${{ secrets.BRIDGE_HEALTH_DATABASE_URL }}
        run: python ops/incident_1912_secret_source_audit.py
