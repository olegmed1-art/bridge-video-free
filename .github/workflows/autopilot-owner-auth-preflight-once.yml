name: Autopilot Oracle Cursor agent boundary diagnostic (one-shot)

on:
  push:
    branches: [codex/oracle-autopilot-lite-shadow]
    paths: ['.github/workflows/autopilot-owner-auth-preflight-once.yml']

permissions:
  contents: read

concurrency:
  group: oracle-instance-workload-mutation
  cancel-in-progress: false

jobs:
  diagnostic:
    if: github.repository == 'olegmed1-art/bridge-video-free'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      ORACLE_HOST: 158.180.47.161
      ORACLE_USER: ubuntu
      EXPECTED_FINGERPRINT: SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk
      SSH_KEY_ORACLE: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Resolve verified Oracle SSH key
        id: ssh
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/oracle-cursor-diagnostic"
          mkdir -p "$work"
          key="$work/id_oracle"
          printf '%s\n' "$SSH_KEY_ORACLE" | tr -d '\r' > "$key"
          chmod 0600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          known="$work/known_hosts"
          ops/oracle_known_hosts_from_scan.sh "$ORACLE_HOST" "$EXPECTED_FINGERPRINT" "$known"
          ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" \
            -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST" 'sudo -n true'
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "known=$known" >> "$GITHUB_OUTPUT"
          echo 'AUTOPILOT_ORACLE_SSH_PREFLIGHT=PASS'

      - name: Inspect Cursor agent service and wrapper without credential values
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i '${{ steps.ssh.outputs.key }}' \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile='${{ steps.ssh.outputs.known }}' -o ConnectTimeout=15 \
            "$ORACLE_USER@$ORACLE_HOST" 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          echo "CURSOR_AGENT_ACTIVE=$(systemctl is-active cursor-agent.service 2>/dev/null || true)"
          echo "CURSOR_AGENT_ENABLED=$(systemctl is-enabled cursor-agent.service 2>/dev/null || true)"
          systemctl show cursor-agent.service --no-pager \
            -p LoadState -p ActiveState -p SubState -p ExecMainStatus \
            -p Result -p User -p Group -p FragmentPath \
            | sed -E 's#(^FragmentPath=).*#\1<redacted-path>#'

          wrapper=/opt/bridge-school/bin/cursor-agent.sh
          if [[ -f "$wrapper" && ! -L "$wrapper" ]]; then
            echo 'CURSOR_AGENT_WRAPPER_PRESENT=YES'
            stat -c 'CURSOR_AGENT_WRAPPER_METADATA=%U:%G:%a:%s' "$wrapper"
            echo "CURSOR_AGENT_WRAPPER_EXECUTABLE=$([[ -x "$wrapper" ]] && echo YES || echo NO)"
            sha256sum "$wrapper" | awk '{print "CURSOR_AGENT_WRAPPER_SHA256=" $1}'
          else
            echo 'CURSOR_AGENT_WRAPPER_PRESENT=NO'
          fi

          final=/opt/bridge-school/school-autopilot/autopilot-broker.env
          if [[ -f "$final" && ! -L "$final" ]]; then
            echo 'AUTOPILOT_BROKER_ENV_PRESENT=YES'
            stat -c 'AUTOPILOT_BROKER_ENV_METADATA=%U:%G:%a:%s' "$final"
          else
            echo 'AUTOPILOT_BROKER_ENV_PRESENT=NO'
          fi

          echo 'CURSOR_AGENT_HOME_METADATA_BEGIN'
          python3 - <<'PY'
          from pathlib import Path
          roots = [Path('/opt/bridge-school/autopilot'), Path('/home/bridge-school-autopilot')]
          allow = {'config.json', 'auth.json', 'credentials.json', 'settings.json', '.env'}
          count = 0
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  try:
                      if not path.is_file() or path.is_symlink():
                          continue
                      if path.name not in allow and not any(part in {'.cursor', '.config'} for part in path.parts):
                          continue
                      stat = path.stat()
                      rel = path.relative_to(root)
                      print(f'CURSOR_AGENT_HOME_FILE={root.name}/{rel}|mode={stat.st_mode & 0o777:o}|size={stat.st_size}')
                      count += 1
                      if count >= 40:
                          break
                  except OSError:
                      continue
              if count >= 40:
                  break
          print(f'CURSOR_AGENT_HOME_FILE_COUNT_SHOWN={count}')
          PY
          echo 'CURSOR_AGENT_HOME_METADATA_END'

          echo 'CURSOR_AGENT_RECENT_DIAGNOSTIC_BEGIN'
          journalctl -u cursor-agent.service --no-pager -n 120 -o cat 2>/dev/null \
            | python3 -c '
          import re, sys
          keep = re.compile(r"error|fail|denied|auth|login|token|timeout|rate|limit|permission|credential|session", re.I)
          shown = 0
          for raw in sys.stdin:
              if not keep.search(raw):
                  continue
              line = raw.rstrip("\n")
              line = re.sub(r"(?:postgres(?:ql)?|https?|ssh)://\S+", "<redacted-url>", line, flags=re.I)
              line = re.sub(r"(?i)(authorization|bearer|token|secret|password|key)(\s*[:=]\s*)\S+", r"\1\2<redacted>", line)
              line = re.sub(r"[A-Za-z0-9_./+=-]{32,}", "<redacted-long-value>", line)
              print(line[:600])
              shown += 1
              if shown >= 40:
                  break
          print(f"CURSOR_AGENT_RECENT_DIAGNOSTIC_LINES={shown}")
          '
          echo 'CURSOR_AGENT_RECENT_DIAGNOSTIC_END'
          echo 'CURSOR_AGENT_CREDENTIAL_VALUES_EXPOSED=NO'
          echo 'AUTOPILOT_SERVICE_RESTARTED=NO'
          echo 'ORACLE_INSTANCE_STOP_REQUESTED=NO'
          REMOTE
