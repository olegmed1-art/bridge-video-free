name: Oracle Autopilot Lite shadow CI

on:
  pull_request:
    paths:
      - 'oracle_autopilot/**'
      - 'deploy/oracle-autopilot/**'
      - 'ops/oracle_autopilot_shadow_install.sh'
      - 'tests/test_oracle_autopilot_*.py'
      - 'database/migrations/0300_autopilot_oracle_shadow.sql'
      - 'database/tests/300_autopilot_oracle_shadow.sql'
      - '.github/workflows/oracle-autopilot-shadow-ci.yml'
      - 'docs/architecture/SCHOOL_AUTOPILOT_CONTROLLER_V1.md'
      - 'ops/autopilot/project-state.json'
  push:
    branches: [main]
    paths:
      - 'oracle_autopilot/**'
      - 'deploy/oracle-autopilot/**'
      - 'ops/oracle_autopilot_shadow_install.sh'
      - 'tests/test_oracle_autopilot_*.py'
      - 'database/migrations/0300_autopilot_oracle_shadow.sql'
      - 'database/tests/300_autopilot_oracle_shadow.sql'
      - '.github/workflows/oracle-autopilot-shadow-ci.yml'

permissions:
  contents: read

jobs:
  oracle-host-encryption-key:
    if: \${{ github.event_name == 'pull_request' && github.event.pull_request.number == 991 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout pinned host-key verifier
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Emit verified public RSA host key
        shell: bash
        env:
          ORACLE_HOST: 158.180.47.161
        run: |
          set -euo pipefail
          known="$RUNNER_TEMP/oracle-autopilot-known-hosts"
          : > "$known"
          index=0
          for expected in \
            'SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk' \
            'SHA256:UGJo5yPdnk/wf8DVrzvXt2xJkE9GJ8+3IIcQ2vA+mkc' \
            'SHA256:eRCJ8c4V7HCBlIoNVSlpPSWZE5xPUMjBD6f0PvHDj64'; do
            part="$RUNNER_TEMP/oracle-autopilot-known-hosts.$index"
            ops/oracle_known_hosts_from_scan.sh "$ORACLE_HOST" "$expected" "$part"
            cat "$part" >> "$known"
            index=$((index + 1))
          done
          sort -u -o "$known" "$known"
          rsa_line="$(awk '$2 == "ssh-rsa" {print; exit}' "$known")"
          test -n "$rsa_line"
          public_key="$RUNNER_TEMP/oracle-autopilot-rsa.pub"
          printf '%s\n' "$rsa_line" | awk '{print $2, $3}' > "$public_key"
          fingerprint="$(ssh-keygen -lf "$public_key" | awk '{print $2}')"
          case "$fingerprint" in
            'SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk'|\
            'SHA256:UGJo5yPdnk/wf8DVrzvXt2xJkE9GJ8+3IIcQ2vA+mkc'|\
            'SHA256:eRCJ8c4V7HCBlIoNVSlpPSWZE5xPUMjBD6f0PvHDj64') ;;
            *) echo 'Oracle RSA host key is not in the pinned key set' >&2; exit 1 ;;
          esac
          printf 'AUTOPILOT_ORACLE_RSA_FINGERPRINT=%s\n' "$fingerprint"
          printf 'AUTOPILOT_ORACLE_RSA_HOST_KEY=%s\n' "$(cat "$public_key")"

  oracle-shadow-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install bounded test dependencies
        run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.3.4' 'pytest==8.4.2'

      - name: Compile and run Oracle shadow contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile oracle_autopilot/*.py tests/test_oracle_autopilot_*.py
          python -m pytest -q tests/test_oracle_autopilot_*.py

      - name: Verify staged install and systemd hardening
        shell: bash
        run: |
          set -euo pipefail
          bash -n ops/oracle_autopilot_shadow_install.sh
          verify_output="$(systemd-analyze verify \
            deploy/oracle-autopilot/school-autopilot-shadow.service 2>&1 || true)"
          unexpected_output="$(printf '%s\n' "$verify_output" | grep -vF \
            'Command /opt/bridge-school/school-autopilot/.venv/bin/python is not executable: No such file or directory' \
            | sed '/^[[:space:]]*$/d' || true)"
          test -z "$unexpected_output" || {
            printf '%s\n' "$unexpected_output" >&2
            exit 1
          }
          grep -F 'AUTOPILOT_ACTIVATE:-0' ops/oracle_autopilot_shadow_install.sh >/dev/null
          grep -F 'AUTOPILOT_ACTIVATION_SCOPE=SHADOW_ONLY' ops/oracle_autopilot_shadow_install.sh >/dev/null
          grep -F 'Environment=AUTOPILOT_RUNTIME_MODE=SHADOW' deploy/oracle-autopilot/school-autopilot-shadow.service >/dev/null
          grep -F 'Restart=always' deploy/oracle-autopilot/school-autopilot-shadow.service >/dev/null

      - name: Reject arbitrary execution and production enablement
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R --line-number -E 'subprocess|os\.system|shell=True|OPENAI_API_KEY|GITHUB_APP_PRIVATE_KEY|OCI_CLI_' \
            oracle_autopilot deploy/oracle-autopilot ops/oracle_autopilot_shadow_install.sh
          ! grep -R --line-number -E 'AUTOPILOT_RUNTIME_MODE=(PRODUCTION|ACTIVE)|production_mutations_enabled.*[Tt]rue' \
            oracle_autopilot deploy/oracle-autopilot ops/oracle_autopilot_shadow_install.sh
