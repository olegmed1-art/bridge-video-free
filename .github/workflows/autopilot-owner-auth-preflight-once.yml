name: Autopilot Oracle transient GitHub token boundary (one-shot)

on:
  push:
    branches: [codex/oracle-autopilot-lite-shadow]
    paths: ['.github/workflows/autopilot-owner-auth-preflight-once.yml']

permissions:
  contents: write

concurrency:
  group: oracle-instance-workload-mutation
  cancel-in-progress: false

jobs:
  probe:
    if: github.repository == 'olegmed1-art/bridge-video-free'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      ORACLE_HOST: 158.180.47.161
      ORACLE_USER: ubuntu
      EXPECTED_FINGERPRINT: SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk
      SSH_KEY_ORACLE: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Resolve verified Oracle SSH key
        id: ssh
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/oracle-github-transient-boundary"
          mkdir -p "$work"
          key="$work/id_oracle"
          printf '%s\n' "$SSH_KEY_ORACLE" | tr -d '\r' > "$key"
          chmod 0600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          known="$work/known_hosts"
          ops/oracle_known_hosts_from_scan.sh "$ORACLE_HOST" "$EXPECTED_FINGERPRINT" "$known"
          ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" \
            -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST" 'true'
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "known=$known" >> "$GITHUB_OUTPUT"
          echo 'AUTOPILOT_ORACLE_SSH_PREFLIGHT=PASS'

      - name: Create and delete one synthetic SHADOW ref from Oracle
        env:
          GH_TRANSIENT_TOKEN: ${{ github.token }}
          PROBE_REPO: ${{ github.repository }}
          PROBE_SHA: ${{ github.sha }}
          PROBE_REF: refs/heads/autopilot/shadow-token-boundary-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY' | ssh -i '${{ steps.ssh.outputs.key }}' \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile='${{ steps.ssh.outputs.known }}' -o ConnectTimeout=15 \
            "$ORACLE_USER@$ORACLE_HOST" 'python3 -'
          import json
          import os

          cfg = {
              "token": os.environ["GH_TRANSIENT_TOKEN"],
              "repo": os.environ["PROBE_REPO"],
              "sha": os.environ["PROBE_SHA"],
              "ref": os.environ["PROBE_REF"],
          }
          source = r"""
          import json
          import urllib.error
          import urllib.parse
          import urllib.request

          cfg = json.loads(__CONFIG__)
          token = cfg.pop("token")
          repo = cfg["repo"]
          sha = cfg["sha"]
          ref = cfg["ref"]

          if repo != "olegmed1-art/bridge-video-free":
              raise SystemExit("unexpected repository")
          if not ref.startswith("refs/heads/autopilot/shadow-token-boundary-"):
              raise SystemExit("unsafe probe ref")
          if len(sha) != 40 or any(ch not in "0123456789abcdef" for ch in sha):
              raise SystemExit("invalid sha")

          api = f"https://api.github.com/repos/{repo}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "bridge-school-autopilot-shadow-boundary",
          }
          ref_path = urllib.parse.quote(ref.removeprefix("refs/"), safe="/")
          created = False
          deleted = False

          def request(url, method="GET", payload=None, expected=()):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      status = response.status
                      body = response.read()
              except urllib.error.HTTPError as exc:
                  status = exc.code
                  body = b""
              if status not in expected:
                  raise RuntimeError(f"unexpected GitHub status {status} for {method}")
              return status, body

          try:
              _, body = request(
                  f"{api}/git/refs",
                  method="POST",
                  payload={"ref": ref, "sha": sha},
                  expected=(201,),
              )
              created = True
              _, body = request(f"{api}/git/ref/{ref_path}", expected=(200,))
              observed = json.loads(body.decode("utf-8"))["object"]["sha"]
              if observed != sha:
                  raise RuntimeError("created probe ref points to unexpected SHA")
          finally:
              if created:
                  request(f"{api}/git/refs/{ref_path}", method="DELETE", expected=(204,))
                  deleted = True

          status, _ = request(f"{api}/git/ref/{ref_path}", expected=(404,))
          if status != 404 or not created or not deleted:
              raise RuntimeError("probe cleanup verification failed")

          token = None
          print("AUTOPILOT_ORACLE_GITHUB_TRANSIENT_WRITE=PASS")
          print("AUTOPILOT_ORACLE_GITHUB_PROBE_REF_CREATED=YES")
          print("AUTOPILOT_ORACLE_GITHUB_PROBE_REF_DELETED=YES")
          print("AUTOPILOT_GITHUB_TOKEN_PERSISTED=NO")
          print("AUTOPILOT_GITHUB_TOKEN_EXPOSED=NO")
          print("AUTOPILOT_SERVICE_RESTARTED=NO")
          print("ORACLE_INSTANCE_STOP_REQUESTED=NO")
          """
          print(source.replace("__CONFIG__", repr(json.dumps(cfg))))
          PY

