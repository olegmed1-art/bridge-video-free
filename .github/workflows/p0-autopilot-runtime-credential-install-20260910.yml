name: P0 Autopilot runtime credential install 20260910

on:
  push:
    branches: [codex/oracle-autopilot-lite-shadow]
    paths: ['.github/workflows/p0-autopilot-runtime-credential-install-20260910.yml']

permissions:
  contents: read

concurrency:
  group: oracle-autopilot-runtime-mutation
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      ORACLE_HOST: 158.180.47.161
      ORACLE_USER: ubuntu
      EXPECTED_FINGERPRINT: SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk
      EXPECTED_RECIPIENT_SHA256: 5149590b81e3a5e6dd3efb1ccbaccc72f5a27d404654ad37cf08bf9f52d4d079
      EXPECTED_DB_HOST: ep-noisy-pine-b1pe30sf-pooler.c-5.eu-central-1.aws.neon.tech
      CIPHERTEXT_SHA256: fef4349b0f500b2ba8ad3463031964ea5e0529d3a7cc25e98334ef4dce398b4c
      CIPHERTEXT_B64: 
      SSH_KEY_ORACLE: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install encrypted production DSN and start resident Autopilot
        shell: bash
        run: |
          set -Eeuo pipefail
          key="$RUNNER_TEMP/id_oracle"
          known="$RUNNER_TEMP/known_hosts"
          cipher="$RUNNER_TEMP/runtime-dsn.oaep"
          printf '%s\n' "$SSH_KEY_ORACLE" | tr -d '\r' > "$key"
          chmod 0600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          ops/oracle_known_hosts_from_scan.sh "$ORACLE_HOST" "$EXPECTED_FINGERPRINT" "$known"
          printf '%s' "$CIPHERTEXT_B64" | base64 --decode > "$cipher"
          test "$(wc -c < "$cipher")" = 384
          test "$(sha256sum "$cipher" | awk '{print $1}')" = "$CIPHERTEXT_SHA256"
          remote_cipher="/tmp/autopilot-runtime-${GITHUB_RUN_ID}.oaep"
          scp -q -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" \
            -o ConnectTimeout=15 "$cipher" "$ORACLE_USER@$ORACLE_HOST:$remote_cipher"
          ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" \
            -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST" \
            "sudo -n env AUTOPILOT_REMOTE_CIPHER='$remote_cipher' EXPECTED_RECIPIENT_SHA256='$EXPECTED_RECIPIENT_SHA256' EXPECTED_DB_HOST='$EXPECTED_DB_HOST' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          root=/opt/bridge-school/school-autopilot
          envfile="$root/autopilot-shadow.env"
          private="$root/bootstrap/oracle-bootstrap-rsa.pem"
          service=school-autopilot-shadow.service
          work="$(mktemp -d /var/tmp/autopilot-runtime-credential.XXXXXXXX)"
          backup="$work/autopilot-shadow.env.before"
          cleanup() {
            rm -f -- "$AUTOPILOT_REMOTE_CIPHER"
            if [[ "$work" == /var/tmp/autopilot-runtime-credential.* && -d "$work" ]]; then
              find "$work" -depth -delete
            fi
          }
          trap cleanup EXIT HUP INT TERM
          test -s "$envfile"
          test -s "$private"
          test "$(stat -c '%U:%G:%a' "$private")" = root:root:600
          actual="$(openssl pkey -in "$private" -pubout -outform DER | sha256sum | awk '{print $1}')"
          test "$actual" = "$EXPECTED_RECIPIENT_SHA256"
          openssl pkeyutl -decrypt -inkey "$private" \
            -in "$AUTOPILOT_REMOTE_CIPHER" -out "$work/dsn" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256
          chmod 0600 "$work/dsn"
          DSN_FILE="$work/dsn" EXPECTED_DB_HOST="$EXPECTED_DB_HOST" python3 - <<'PY'
          import os, urllib.parse
          from pathlib import Path
          raw=Path(os.environ['DSN_FILE']).read_text().strip()
          u=urllib.parse.urlsplit(raw)
          q=urllib.parse.parse_qs(u.query, strict_parsing=True)
          assert u.scheme in {'postgres','postgresql'}
          assert u.hostname == os.environ['EXPECTED_DB_HOST']
          assert u.username == 'autopilot_runtime_login'
          assert u.password and len(u.password) >= 12
          assert u.path == '/neondb'
          assert q.get('sslmode') == ['require']
          assert q.get('channel_binding') == ['require']
          print('RUNTIME_DSN_VALIDATION=PASS')
          PY
          cp -a "$envfile" "$backup"
          owner="$(stat -c '%u:%g' "$envfile")"
          mode="$(stat -c '%a' "$envfile")"
          ENVFILE="$envfile" DSN_FILE="$work/dsn" python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['ENVFILE'])
          dsn=Path(os.environ['DSN_FILE']).read_text().strip()
          lines=p.read_text().splitlines()
          out=[]; replaced=False
          for line in lines:
              if line.startswith('AUTOPILOT_DATABASE_URL='):
                  out.append('AUTOPILOT_DATABASE_URL=' + dsn)
                  replaced=True
              else:
                  out.append(line)
          if not replaced:
              out.append('AUTOPILOT_DATABASE_URL=' + dsn)
          tmp=p.with_suffix('.env.new')
          tmp.write_text('\n'.join(out)+'\n')
          os.replace(tmp,p)
          PY
          chown "$owner" "$envfile"
          chmod "$mode" "$envfile"
          systemctl daemon-reload
          systemctl enable --now "$service"
          sleep 10
          if ! systemctl is-active --quiet "$service"; then
            cp -a "$backup" "$envfile"
            systemctl disable --now "$service" || true
            echo 'AUTOPILOT_RUNTIME_ACTIVATION=FAIL_INACTIVE'
            exit 1
          fi
          # The previous concrete failure produced repeated listener_reconnect immediately.
          recent="$(journalctl -u "$service" --since '-15 seconds' --no-pager -o cat || true)"
          reconnects="$(printf '%s\n' "$recent" | grep -c 'listener_reconnect' || true)"
          if [[ "$reconnects" -ge 2 ]]; then
            cp -a "$backup" "$envfile"
            systemctl disable --now "$service" || true
            echo "AUTOPILOT_RUNTIME_ACTIVATION=FAIL_RECONNECT reconnects=$reconnects"
            exit 1
          fi
          echo 'AUTOPILOT_RUNTIME_CREDENTIAL_INSTALLED=YES'
          echo 'AUTOPILOT_SERVICE_ACTIVE=YES'
          echo 'AUTOPILOT_SERVICE_ENABLED=YES'
          echo "AUTOPILOT_LISTENER_RECONNECTS_15S=$reconnects"
          echo "RUNTIME_DB_HOST=$EXPECTED_DB_HOST"
          REMOTE
