name: Bridge Video r25.13 checkpoint contract

on:
  workflow_dispatch:
    inputs:
      production_baseline_sha:
        description: "Full reviewed baseline commit SHA; protected production files must be unchanged"
        required: true
        type: string
  pull_request:
    branches: [main]
    paths:
      - 'bridge_runtime_hardening_r25_13_checkpoint.py'
      - 'diagnose_asr_block_r25_13.py'
      - 'tests/test_asr_checkpoint_r25_13.py'
      - 'tests/test_video_checkpoint_baseline.py'
      - 'tools/verify_video_checkpoint_baseline.py'
      - '.github/workflows/video-r25-13-checkpoint.yml'
      - '.github/workflows/video-r25-13-block11-diagnostic.yml'
      - '.github/workflows/video-r25-13-production-candidate.yml'
      - 'candidate_requests/2026-08-18-logic-bridge-r25-13-full.txt'
      - 'database/video_result_persistence.py'

permissions:
  contents: read

jobs:
  checkpoint-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install regression runtime
        run: python -m pip install --disable-pip-version-check -r requirements-worker.txt
      - name: Verify fail-closed checkpoint and inherited gates
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/test_asr_checkpoint_r25_13.py
          PYTHONPATH=. python tests/test_meta_asr_gate_r25_12.py
          PYTHONPATH=. python tests/test_asr_policy_r25_6.py
          PYTHONPATH=. python tests/test_unreliable_asr_isolation_r25_4.py
          python -m py_compile bridge_runtime_hardening_r25_13_checkpoint.py diagnose_asr_block_r25_13.py
      - name: Verify baseline guard rejects production changes
        run: python -m unittest discover -s tests -p test_video_checkpoint_baseline.py -v
      - name: Verify production baseline is unchanged
        env:
          BASELINE_SHA: ${{ github.event.pull_request.base.sha || inputs.production_baseline_sha }}
          EXPECTED_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE_SHA"
          [[ "$BASELINE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "BLOCKED: exact baseline SHA required"; exit 1; }
          git fetch --no-tags --depth=1 origin "$BASELINE_SHA"
          python tools/verify_video_checkpoint_baseline.py --baseline-sha "$BASELINE_SHA"
