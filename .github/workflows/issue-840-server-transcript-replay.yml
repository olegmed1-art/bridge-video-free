name: ISSUE 840 read-only server transcript replay

on:
  push:
    branches: [ops/840-server-transcript-replay]

permissions:
  contents: read

concurrency:
  group: issue-840-server-transcript-replay
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ORACLE_HOST: 158.180.47.161
      ORACLE_USER: ubuntu
      EXPECTED_FINGERPRINT: SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk
      SSH_KEY_ORACLE: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
      SSH_KEY_OCI: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
      SSH_KEY_VM: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
      SSH_KEY_BRIDGE: ${{ secrets.BRIDGE_SCHOOL_ORACLE_SSH_PRIVATE_KEY }}
      SSH_KEY_ORACLE_ALT: ${{ secrets.ORACLE_SSH_KEY }}
      SSH_KEY_OCI_ALT: ${{ secrets.OCI_SSH_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Verify pinned host and select existing SSH credential
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/issue840-replay"
          mkdir -p "$work"
          known="$work/known_hosts"
          ops/oracle_known_hosts_from_scan.sh "$ORACLE_HOST" "$EXPECTED_FINGERPRINT" "$known"
          selected=''
          for name in SSH_KEY_ORACLE SSH_KEY_OCI SSH_KEY_VM SSH_KEY_BRIDGE SSH_KEY_ORACLE_ALT SSH_KEY_OCI_ALT; do
            if [[ -n "${!name:-}" ]]; then selected="$name"; break; fi
          done
          [[ -n "$selected" ]] || { echo 'Oracle SSH credential unavailable' >&2; exit 1; }
          key="$work/id_oracle"
          printf '%s\n' "${!selected}" > "$key"
          chmod 0600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "known=$known" >> "$GITHUB_OUTPUT"

      - name: Find and replay completed transcript artifacts read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh -i '${{ steps.ssh.outputs.key }}' -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile='${{ steps.ssh.outputs.known }}' \
            -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST" \
            'sudo -n bash -s' <<'REMOTE' > "$RUNNER_TEMP/raw.txt"
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from collections import Counter, defaultdict
          from pathlib import Path

          root=Path('/opt/bridge-school/universal-video/spool/results')
          assert root.is_dir() and not root.is_symlink(), root
          output=[]
          jobs=(
              sorted(root.iterdir(), key=lambda path: path.stat().st_mtime, reverse=True)[:50]
              if root.is_dir() else []
          )
          for job in jobs:
              transcript=job/'transcript.jsonl'
              speaker=job/'speaker_diarization.json'
              if not transcript.is_file():
                  continue
              try:
                  rows=[json.loads(line) for line in transcript.read_text(encoding='utf-8').splitlines() if line.strip()]
                  report=json.loads(speaker.read_text(encoding='utf-8')) if speaker.is_file() else {}
              except Exception:
                  output.append({'job_id':job.name,'state':'INCONCLUSIVE','reason':'INVALID_RESULT_ARTIFACT'})
                  continue
              counts=Counter(str(row.get('speaker') or '') for row in rows if row.get('speaker'))
              total_duration=labeled_duration=0.0
              for row in rows:
                  try: duration=max(0.0,float(row.get('end'))-float(row.get('start')))
                  except Exception: duration=0.0
                  total_duration+=duration
                  if row.get('speaker'): labeled_duration+=duration
              seg_cov=sum(counts.values())/len(rows) if rows else 0.0
              dur_cov=labeled_duration/total_duration if total_duration else 0.0
              evidence=report.get('speaker_count_evidence')
              open_set=bool(isinstance(evidence,dict) and evidence.get('mode')=='OPEN_SET')
              output.append({
                  'job_id':job.name,
                  'state':'PASS' if open_set and seg_cov>=0.8 and dur_cov>=0.8 else 'INCONCLUSIVE',
                  'segments_total':len(rows),
                  'segments_labeled':sum(counts.values()),
                  'coverage_by_segments':round(seg_cov,4),
                  'coverage_by_duration':round(dur_cov,4),
                  'observed_clusters':len(counts),
                  'speaker_status':report.get('status','UNAVAILABLE'),
                  'open_set_count_proved':open_set,
                  'role_mapping_supported':report.get('role_mapping_supported') is True,
                  'teacher_student_attribution':report.get('teacher_student_attribution','UNAVAILABLE'),
                  'reason':report.get('reason'),
              })
          print('UV840_REPLAY_BEGIN')
          print(json.dumps({'schema':'uv840-server-transcript-replay-v1','result_scope':'SHADOW_ONLY','jobs':output},separators=(',',':')))
          print('UV840_REPLAY_END')
          PY
          REMOTE
          python - <<'PY'
          import json, os
          from pathlib import Path
          raw=Path(os.environ['RUNNER_TEMP'],'raw.txt').read_text(encoding='utf-8')
          lines=[line.strip() for line in raw.splitlines()]
          a=lines.index('UV840_REPLAY_BEGIN'); b=lines.index('UV840_REPLAY_END')
          assert b==a+2
          data=json.loads(lines[a+1])
          assert data['schema']=='uv840-server-transcript-replay-v1'
          Path('server-transcript-replay.json').write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('SERVER_TRANSCRIPT_REPLAY_PASS jobs='+str(len(data['jobs'])))
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue-840-server-transcript-replay
          path: server-transcript-replay.json
          if-no-files-found: error
          retention-days: 14
