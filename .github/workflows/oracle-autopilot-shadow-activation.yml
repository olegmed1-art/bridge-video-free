name: Oracle Autopilot shadow activation

on:
  pull_request:
    paths:
      - '.github/workflows/oracle-autopilot-shadow-activation.yml'
      - '.github/workflows/oracle-instance-power.yml'
      - 'deploy/oracle-autopilot/**'
      - 'ops/oracle_autopilot_shadow_install.sh'
      - 'tests/test_oracle_autopilot_shadow.py'
  push:
    branches: [codex/oracle-autopilot-lite-shadow]
    paths:
      - 'ops/oracle-autopilot-activation-requests/*.json'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Validate fail-closed shadow boundary
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/oracle-autopilot-shadow-activation.yml'
          grep -F "request['activation_scope'] == 'SHADOW_ONLY'" "$workflow" >/dev/null
          grep -F "request['no_instance_stop'] is True" "$workflow" >/dev/null
          grep -F "EXPECTED_STAGED_REVISION='5b2e91846d1f94c40c1ba5e919253e47afa372db'" "$workflow" >/dev/null
          grep -F 'EXPECTED_UNIT_SHA256: 1adc86b3268e2ab65e5e10ac165d2d3a9ecd26bee8d08c75536106c2fd40c40d' "$workflow" >/dev/null
          grep -F 'Environment=AUTOPILOT_RUNTIME_MODE=SHADOW' \
            deploy/oracle-autopilot/school-autopilot-shadow.service >/dev/null
          grep -F 'AUTOPILOT_ACTIVATION_SCOPE=SHADOW_ONLY' \
            ops/oracle_autopilot_shadow_install.sh >/dev/null
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/oracle-autopilot-shadow-activation.yml').read_text()
          unit_sha256 = __import__('hashlib').sha256(
              Path('deploy/oracle-autopilot/school-autopilot-shadow.service').read_bytes()
          ).hexdigest()
          assert f'EXPECTED_UNIT_SHA256: {unit_sha256}' in workflow
          for forbidden in (
              '--action ' + 'STOP',
              'systemctl ' + 'stop',
              'oci compute instance ' + 'action',
          ):
              assert forbidden not in workflow
          power = Path('.github/workflows/oracle-instance-power.yml').read_text()
          assert '\n  schedule:' not in power
          assert '\n  push:' not in power
          PY

  activate:
    if: ${{ github.event_name == 'push' }}
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: oracle-instance-workload-mutation
      cancel-in-progress: false
    env:
      ORACLE_HOST: 158.180.47.161
      ORACLE_USER: ubuntu
      EXPECTED_STAGED_REVISION: 5b2e91846d1f94c40c1ba5e919253e47afa372db
      EXPECTED_UNIT_SHA256: 1adc86b3268e2ab65e5e10ac165d2d3a9ecd26bee8d08c75536106c2fd40c40d
      SSH_KEY_ORACLE: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
      SSH_KEY_OCI: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
      SSH_KEY_VM: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
      SSH_KEY_BRIDGE: ${{ secrets.BRIDGE_SCHOOL_ORACLE_SSH_PRIVATE_KEY }}
      SSH_KEY_ORACLE_ALT: ${{ secrets.ORACLE_SSH_KEY }}
      SSH_KEY_OCI_ALT: ${{ secrets.OCI_SSH_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Validate exact activation request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff-tree -m --no-commit-id --name-only -r "$GITHUB_SHA" \
            | grep -E '^ops/oracle-autopilot-activation-requests/[^/]+\.json$' | sort -u)
          [[ ${#files[@]} -eq 1 ]] || { echo 'expected exactly one activation request' >&2; exit 1; }
          REQUEST_FILE="${files[0]}" python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import hashlib
          import os
          import re

          request = json.load(open(os.environ['REQUEST_FILE'], encoding='utf-8'))
          assert set(request) == {
              'request_id', 'action', 'target_host', 'source_revision',
              'activation_scope', 'expected_db_user', 'no_instance_stop',
              'neon_min_cu', 'neon_max_cu', 'runtime_connection_limit',
              'broker_url', 'broker_source_sha', 'broker_artifact_sha256',
              'broker_policy_sha256', 'broker_provenance_sha256',
          }
          assert re.fullmatch(r'[A-Za-z0-9._-]{1,80}', request['request_id'])
          assert request['action'] == 'activate_shadow'
          assert request['target_host'] == '158.180.47.161'
          assert request['source_revision'] == os.environ['EXPECTED_STAGED_REVISION']
          assert request['activation_scope'] == 'SHADOW_ONLY'
          assert request['expected_db_user'] == 'autopilot_runtime_login'
          assert request['no_instance_stop'] is True
          assert request['neon_min_cu'] == 0.25
          assert request['neon_max_cu'] == 8
          assert request['runtime_connection_limit'] == 4
          assert re.fullmatch(
              r'https://bridge-school-autopilot-[a-z0-9]+-olegmed1-4368s-projects'
              r'\.vercel\.app/v1/github/draft-repair', request['broker_url']
          )
          assert re.fullmatch(r'[0-9a-f]{40}', request['broker_source_sha'])
          for key in (
              'broker_artifact_sha256', 'broker_policy_sha256',
              'broker_provenance_sha256',
          ):
              assert re.fullmatch(r'[0-9a-f]{64}', request[key])
          statement = {
              'artifact_sha256': request['broker_artifact_sha256'],
              'policy_sha256': request['broker_policy_sha256'],
              'policy_version': 'physical-no-merge-v1',
              'source_sha': request['broker_source_sha'],
          }
          assert request['broker_provenance_sha256'] == hashlib.sha256(
              json.dumps(statement, sort_keys=True, separators=(',', ':')).encode()
          ).hexdigest()
          print(f"request_id={request['request_id']}")
          print(f"source_revision={request['source_revision']}")
          print(f"broker_url={request['broker_url']}")
          print(f"broker_source_sha={request['broker_source_sha']}")
          print(f"broker_artifact_sha256={request['broker_artifact_sha256']}")
          print(f"broker_policy_sha256={request['broker_policy_sha256']}")
          print(f"broker_provenance_sha256={request['broker_provenance_sha256']}")
          PY

      - name: Verify pinned Oracle identity and SSH access
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          known="$RUNNER_TEMP/oracle-autopilot-activation-known-hosts"
          : > "$known"
          index=0
          for expected in \
            'SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk' \
            'SHA256:UGJo5yPdnk/wf8DVrzvXt2xJkE9GJ8+3IIcQ2vA+mkc' \
            'SHA256:eRCJ8c4V7HCBlIoNVSlpPSWZE5xPUMjBD6f0PvHDj64'; do
            part="$RUNNER_TEMP/oracle-autopilot-activation-known-hosts.$index"
            ops/oracle_known_hosts_from_scan.sh "$ORACLE_HOST" "$expected" "$part"
            cat "$part" >> "$known"
            index=$((index + 1))
          done
          sort -u -o "$known" "$known"
          selected=''
          for name in SSH_KEY_ORACLE SSH_KEY_OCI SSH_KEY_VM SSH_KEY_BRIDGE SSH_KEY_ORACLE_ALT SSH_KEY_OCI_ALT; do
            if [[ -n "${!name:-}" ]]; then selected="$name"; break; fi
          done
          [[ -n "$selected" ]] || { echo 'Oracle SSH credential unavailable' >&2; exit 1; }
          key="$RUNNER_TEMP/id_oracle"
          printf '%s\n' "${!selected}" > "$key"
          chmod 0600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" \
            -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST" 'sudo -n true'
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "known=$known" >> "$GITHUB_OUTPUT"

      - name: Activate exact staged shadow service
        id: activation
        shell: bash
        env:
          SOURCE_REVISION: ${{ steps.request.outputs.source_revision }}
          BROKER_URL: ${{ steps.request.outputs.broker_url }}
          BROKER_SOURCE_SHA: ${{ steps.request.outputs.broker_source_sha }}
          BROKER_ARTIFACT_SHA256: ${{ steps.request.outputs.broker_artifact_sha256 }}
          BROKER_POLICY_SHA256: ${{ steps.request.outputs.broker_policy_sha256 }}
          BROKER_PROVENANCE_SHA256: ${{ steps.request.outputs.broker_provenance_sha256 }}
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/oracle-autopilot-activation-proof.log"
          ssh -i '${{ steps.ssh.outputs.key }}' -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile='${{ steps.ssh.outputs.known }}' \
            -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST" \
            "sudo -n env EXPECTED_REVISION='$SOURCE_REVISION' EXPECTED_UNIT_SHA256='$EXPECTED_UNIT_SHA256' EXPECTED_BROKER_URL='$BROKER_URL' EXPECTED_BROKER_SOURCE_SHA='$BROKER_SOURCE_SHA' EXPECTED_BROKER_ARTIFACT_SHA256='$BROKER_ARTIFACT_SHA256' EXPECTED_BROKER_POLICY_SHA256='$BROKER_POLICY_SHA256' EXPECTED_BROKER_PROVENANCE_SHA256='$BROKER_PROVENANCE_SHA256' bash -s" \
            <<'REMOTE' | tee "$proof"
          set -Eeuo pipefail
          service=school-autopilot-shadow.service
          observer_service=school-autopilot-online-observer.service
          root=/opt/bridge-school/school-autopilot
          observer_restore_marker="$root/runtime/restore-online-observer-after-staging"
          release="$root/releases/$EXPECTED_REVISION"
          unit=/etc/systemd/system/$service

          [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_UNIT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$(readlink -f "$root/current")" == "$release" ]]
          [[ "$(cat "$root/current/SOURCE_REVISION")" == "$EXPECTED_REVISION" ]]
          [[ "$(stat -c '%U:%G:%a' "$root/autopilot-shadow.env")" == root:root:600 ]]
          [[ "$(stat -c '%U:%G:%a' "$root/autopilot-broker.env")" == root:root:600 ]]
          AUTOPILOT_ROOT="$root" "$root/.venv/bin/python" - <<'PY'
          import json, os, re, shlex, urllib.request
          import psycopg

          class RejectRedirects(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise RuntimeError('TOKEN_BROKER_REDIRECT_REJECTED')

          def parse_environment_file(path):
              values = {}
              for raw in open(path, encoding='utf-8'):
                  line = raw.strip()
                  if not line or line.startswith('#'):
                      continue
                  key, separator, encoded = line.partition('=')
                  assert separator and re.fullmatch(r'[A-Z][A-Z0-9_]*', key)
                  assert key not in values
                  decoded = shlex.split(encoded, comments=False, posix=True)
                  assert len(decoded) == 1
                  values[key] = decoded[0]
              return values

          root = os.environ['AUTOPILOT_ROOT']
          values = parse_environment_file(f'{root}/autopilot-shadow.env')
          broker_values = parse_environment_file(f'{root}/autopilot-broker.env')
          assert values.keys().isdisjoint(broker_values)
          values.update(broker_values)
          pins = {
              'AUTOPILOT_TOKEN_BROKER_URL': os.environ['EXPECTED_BROKER_URL'],
              'AUTOPILOT_TOKEN_BROKER_EXPECTED_SOURCE_SHA': os.environ['EXPECTED_BROKER_SOURCE_SHA'],
              'AUTOPILOT_TOKEN_BROKER_EXPECTED_ARTIFACT_SHA256': os.environ['EXPECTED_BROKER_ARTIFACT_SHA256'],
              'AUTOPILOT_TOKEN_BROKER_EXPECTED_POLICY_SHA256': os.environ['EXPECTED_BROKER_POLICY_SHA256'],
              'AUTOPILOT_TOKEN_BROKER_EXPECTED_PROVENANCE_SHA256': os.environ['EXPECTED_BROKER_PROVENANCE_SHA256'],
          }
          assert all(values.get(key) == value for key, value in pins.items())
          health_url = values['AUTOPILOT_TOKEN_BROKER_URL'].replace(
              '/v1/github/draft-repair', '/healthz'
          )
          request = urllib.request.Request(health_url, headers={
              'X-Vercel-Protection-Bypass': values['AUTOPILOT_VERCEL_BYPASS_SECRET'],
          })
          opener = urllib.request.build_opener(RejectRedirects())
          with opener.open(request, timeout=30) as response:
              assert response.status == 200 and response.geturl() == health_url
              raw_health = response.read(32_769)
          assert len(raw_health) <= 32_768
          payload = json.loads(raw_health)
          expected = {
              'source_revision': os.environ['EXPECTED_BROKER_SOURCE_SHA'],
              'artifact_sha256': os.environ['EXPECTED_BROKER_ARTIFACT_SHA256'],
              'policy_sha256': os.environ['EXPECTED_BROKER_POLICY_SHA256'],
              'provenance_sha256': os.environ['EXPECTED_BROKER_PROVENANCE_SHA256'],
              'broker_policy_version': 'physical-no-merge-v1',
              'source_attested': True,
              'artifact_attested': True,
              'preview_only': True,
              'production_mutations_enabled': False,
              'github_token_broker_enabled': True,
          }
          assert all(payload.get(key) == value for key, value in expected.items())
          with psycopg.connect(values['AUTOPILOT_DATABASE_URL']) as connection:
              with connection.cursor() as cursor:
                  cursor.execute("SELECT autopilot.verify_broker_schema_v0321()")
                  row = cursor.fetchone()
          assert row == (True,)
          PY
          [[ -f "$unit" ]]
          [[ "$(sha256sum "$unit" | awk '{print $1}')" == "$EXPECTED_UNIT_SHA256" ]]
          grep -Fx 'User=school-autopilot' "$unit" >/dev/null
          grep -Fx 'Environment=AUTOPILOT_RUNTIME_MODE=SHADOW' "$unit" >/dev/null
          grep -Fx 'NoNewPrivileges=true' "$unit" >/dev/null
          ! grep -Eq 'AUTOPILOT_RUNTIME_MODE=(ACTIVE|PRODUCTION)|production_mutations_enabled' "$unit"

          restore_observer=0
          if [[ -e "$observer_restore_marker" ]]; then
            [[ "$(stat -c '%U:%G:%a' "$observer_restore_marker")" == root:root:600 ]]
            [[ "$(systemctl is-active "$observer_service" 2>/dev/null || true)" == inactive ]]
            [[ "$(systemctl is-enabled "$observer_service" 2>/dev/null || true)" == disabled ]]
            restore_observer=1
          fi

          active="$(systemctl is-active "$service" 2>/dev/null || true)"
          enabled="$(systemctl is-enabled "$service" 2>/dev/null || true)"
          case "$active:$enabled" in
            inactive:disabled) ;;
            active:enabled) ;;
            *) echo "refusing mixed pre-activation state: $active/$enabled" >&2; exit 1 ;;
          esac

          activated_here=0
          existing_restarted=0
          previous_broker_env=''
          previous_release=''
          if [[ "$active:$enabled" == active:enabled ]]; then
            previous_pid="$(systemctl show -p MainPID --value "$service")"
            [[ "$previous_pid" =~ ^[1-9][0-9]*$ ]]
            previous_release="$(readlink -f "/proc/$previous_pid/cwd")"
            [[ "$previous_release" =~ ^$root/releases/[0-9a-f]{40}$ ]]
            previous_broker_env="$(mktemp "$root/runtime/activation-rollback-env.XXXXXXXX")"
            PROCESS_ENVIRON="/proc/$previous_pid/environ" \
              TARGET_ENV="$previous_broker_env" python3 - <<'PY'
          import os, shlex
          entries = open(os.environ['PROCESS_ENVIRON'], 'rb').read().split(b'\0')
          values = {}
          for item in entries:
              if b'=' in item:
                  key, value = item.split(b'=', 1)
                  key = key.decode()
                  if key.startswith('AUTOPILOT_TOKEN_BROKER_') or key == 'AUTOPILOT_VERCEL_BYPASS_SECRET':
                      values[key] = value.decode()
          required = {
              'AUTOPILOT_TOKEN_BROKER_URL', 'AUTOPILOT_TOKEN_BROKER_SECRET',
              'AUTOPILOT_VERCEL_BYPASS_SECRET',
          }
          assert required <= values.keys()
          with open(os.environ['TARGET_ENV'], 'w', encoding='utf-8') as output:
              for key in sorted(values):
                  output.write(f'{key}={shlex.quote(values[key])}\n')
          os.chmod(os.environ['TARGET_ENV'], 0o600)
          PY
          fi
          observer_activated_here=0
          rollback_new_activation() {
            rc=$?
            trap - EXIT
            rollback_failed=0
            if [[ $rc -ne 0 && "$observer_activated_here" == 1 ]]; then
              systemctl disable --now "$observer_service" >/dev/null 2>&1 || true
              echo 'AUTOPILOT_OBSERVER_ACTIVATION_ROLLED_BACK' >&2
            fi
            if [[ $rc -ne 0 && "$activated_here" == 1 ]]; then
              systemctl disable --now "$service" >/dev/null 2>&1 || true
              echo 'AUTOPILOT_SHADOW_ACTIVATION_ROLLED_BACK' >&2
            fi
            if [[ $rc -ne 0 && "$existing_restarted" == 1 ]]; then
              install -m 0600 -o root -g root "$previous_broker_env" \
                "$root/autopilot-broker.env" || rollback_failed=1
              ln -sfn "$previous_release" "$root/current" || rollback_failed=1
              systemctl restart "$service" >/dev/null 2>&1 || rollback_failed=1
              restored_pid="$(systemctl show -p MainPID --value "$service")"
              [[ "$(systemctl is-active "$service" 2>/dev/null || true)" == active ]] \
                || rollback_failed=1
              [[ "$restored_pid" =~ ^[1-9][0-9]*$ ]] || rollback_failed=1
              [[ "$(readlink -f "/proc/$restored_pid/cwd" 2>/dev/null || true)" == \
                 "$previous_release" ]] || rollback_failed=1
              if [[ "$rollback_failed" == 0 ]]; then
                PROCESS_ENVIRON="/proc/$restored_pid/environ" \
                  EXPECTED_ENV="$previous_broker_env" python3 - <<'PY' || rollback_failed=1
          import os, shlex
          expected = {}
          for line in open(os.environ['EXPECTED_ENV'], encoding='utf-8'):
              key, value = line.rstrip('\n').split('=', 1)
              expected[key] = shlex.split(value)[0]
          observed = {}
          for item in open(os.environ['PROCESS_ENVIRON'], 'rb').read().split(b'\0'):
              if b'=' in item:
                  key, value = item.split(b'=', 1)
                  observed[key.decode()] = value.decode()
          assert all(observed.get(key) == value for key, value in expected.items())
          PY
              fi
              if [[ "$rollback_failed" == 0 ]]; then
                echo 'AUTOPILOT_SHADOW_EXISTING_STATE_RESTORED' >&2
              else
                echo 'AUTOPILOT_SHADOW_EXISTING_STATE_ROLLBACK_FAILED_SNAPSHOT_RETAINED' >&2
              fi
            fi
            if [[ "$rollback_failed" == 0 && -n "$previous_broker_env" ]]; then
              rm -f -- "$previous_broker_env"
            fi
            exit "$rc"
          }
          trap rollback_new_activation EXIT

          systemctl daemon-reload
          if [[ "$active:$enabled" == inactive:disabled ]]; then
            activated_here=1
            systemctl enable --now "$service"
          else
            existing_restarted=1
            systemctl restart "$service"
          fi
          sleep 12

          diag_active="$(systemctl is-active "$service" 2>/dev/null || true)"
          diag_enabled="$(systemctl is-enabled "$service" 2>/dev/null || true)"
          diag_restarts="$(systemctl show -p NRestarts --value "$service")"
          pid="$(systemctl show -p MainPID --value "$service")"
          expected_uid="$(id -u school-autopilot)"
          actual_uid='unavailable'
          if [[ "$pid" =~ ^[1-9][0-9]*$ && -r "/proc/$pid/status" ]]; then
            actual_uid="$(awk '/^Uid:/{print $2}' "/proc/$pid/status")"
          fi
          printf 'AUTOPILOT_DIAG_ACTIVE=%s\n' "$diag_active"
          printf 'AUTOPILOT_DIAG_ENABLED=%s\n' "$diag_enabled"
          printf 'AUTOPILOT_DIAG_NRESTARTS=%s\n' "$diag_restarts"
          printf 'AUTOPILOT_DIAG_MAINPID_VALID=%s\n' "$([[ "$pid" =~ ^[1-9][0-9]*$ ]] && echo yes || echo no)"
          printf 'AUTOPILOT_DIAG_RUNTIME_UID_MATCH=%s\n' "$([[ "$actual_uid" == "$expected_uid" ]] && echo yes || echo no)"

          [[ "$diag_active" == active ]]
          [[ "$diag_enabled" == enabled ]]
          [[ "$diag_restarts" == 0 ]]
          [[ "$pid" =~ ^[1-9][0-9]*$ ]]
          [[ "$actual_uid" == "$expected_uid" ]]
          PROCESS_ENVIRON="/proc/$pid/environ" python3 - <<'PY'
          import os

          raw = open(os.environ['PROCESS_ENVIRON'], 'rb').read().split(b'\0')
          effective = {}
          for item in raw:
              if b'=' in item:
                  key, value = item.split(b'=', 1)
                  effective[key.decode()] = value.decode()
          expected = {
              'AUTOPILOT_TOKEN_BROKER_URL': os.environ['EXPECTED_BROKER_URL'],
              'AUTOPILOT_TOKEN_BROKER_EXPECTED_SOURCE_SHA': os.environ['EXPECTED_BROKER_SOURCE_SHA'],
              'AUTOPILOT_TOKEN_BROKER_EXPECTED_ARTIFACT_SHA256': os.environ['EXPECTED_BROKER_ARTIFACT_SHA256'],
              'AUTOPILOT_TOKEN_BROKER_EXPECTED_POLICY_SHA256': os.environ['EXPECTED_BROKER_POLICY_SHA256'],
              'AUTOPILOT_TOKEN_BROKER_EXPECTED_PROVENANCE_SHA256': os.environ['EXPECTED_BROKER_PROVENANCE_SHA256'],
          }
          assert all(effective.get(key) == value for key, value in expected.items())
          PY
          if [[ "$activated_here" == 1 ]]; then
            active_since="$(systemctl show -p ActiveEnterTimestamp --value "$service")"
            test -n "$active_since"
            journal="$(journalctl -u "$service" --since "$active_since" --no-pager -n 100)"
            worker_started_count="$(grep -Fc 'worker_started' <<<"$journal" || true)"
            unsafe_journal_count="$(grep -Ec 'listener_reconnect|Traceback|RuntimeError' <<<"$journal" || true)"
            printf 'AUTOPILOT_DIAG_WORKER_STARTED_COUNT=%s\n' "$worker_started_count"
            printf 'AUTOPILOT_DIAG_UNSAFE_JOURNAL_COUNT=%s\n' "$unsafe_journal_count"
            [[ "$worker_started_count" -ge 1 ]]
            [[ "$unsafe_journal_count" == 0 ]]
          fi

          if [[ "$restore_observer" == 1 ]]; then
            observer_activated_here=1
            systemctl enable --now "$observer_service"
            sleep 2
            [[ "$(systemctl is-active "$observer_service" 2>/dev/null || true)" == active ]]
            [[ "$(systemctl is-enabled "$observer_service" 2>/dev/null || true)" == enabled ]]
            rm -f -- "$observer_restore_marker"
            echo 'AUTOPILOT_DIAG_OBSERVER_RESTORED=yes'
          else
            echo 'AUTOPILOT_DIAG_OBSERVER_RESTORED=not-required'
          fi
          [[ -z "$previous_broker_env" ]] || rm -f -- "$previous_broker_env"
          previous_broker_env=''
          trap - EXIT
          echo 'AUTOPILOT_SHADOW_ACTIVATION_PASS'
          echo 'AUTOPILOT_RUNTIME_MODE=SHADOW'
          echo 'AUTOPILOT_PRODUCTION_MUTATIONS=NO'
          echo 'ORACLE_INSTANCE_STOP_REQUESTED=NO'
          REMOTE
          grep -Fx 'AUTOPILOT_SHADOW_ACTIVATION_PASS' "$proof" >/dev/null
          grep -Fx 'AUTOPILOT_RUNTIME_MODE=SHADOW' "$proof" >/dev/null
          grep -Fx 'AUTOPILOT_PRODUCTION_MUTATIONS=NO' "$proof" >/dev/null
          grep -E '^AUTOPILOT_DIAG_OBSERVER_RESTORED=(yes|not-required)$' "$proof" >/dev/null
          grep -Fx 'ORACLE_INSTANCE_STOP_REQUESTED=NO' "$proof" >/dev/null

      - name: Verify DDS3 non-regression
        shell: bash
        run: |
          set -euo pipefail
          READY_JSON="$(curl -fsS --retry 3 --retry-delay 3 --max-time 20 "https://$ORACLE_HOST/readyz")" \
            python - <<'PY'
          import json
          import os

          payload = json.loads(os.environ['READY_JSON'])
          assert payload.get('status') == 'ready', payload
          assert payload.get('engine') == 'DDS3', payload
          assert payload.get('fallback_used') is False, payload
          print('AUTOPILOT_ACTIVATION_DDS3_NONREGRESSION_PASS')
          PY

      - name: Publish safe activation summary
        if: ${{ always() }}
        shell: bash
        env:
          ACTIVATION_OUTCOME: ${{ steps.activation.outcome }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
        run: |
          {
            echo '### Oracle Autopilot shadow activation'
            echo "- request: ${REQUEST_ID:-unresolved}"
            echo "- activation: ${ACTIVATION_OUTCOME:-not-run}"
            echo '- runtime scope: `SHADOW_ONLY`'
            echo '- production mutations: `NO`'
            echo '- Oracle stop requested: `NO`'
            echo '- Neon compute: `0.25 CU` minimum, configured `8 CU` ceiling'
            echo '- runtime database connection limit: `4`'
            echo '- secrets in repository/logs: `NO`'
          } >> "$GITHUB_STEP_SUMMARY"
