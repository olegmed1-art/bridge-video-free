name: Backfill completed Bridge Video results to Neon

on:
  push:
    branches: [main]
    paths:
      - 'database/backfill_requests/*.txt'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum AI_DONE jobs to import; 0 means all'
        required: false
        default: '0'

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            'psycopg[binary]==3.3.4' 'google-auth==2.56.3' \
            'requests==2.34.2' 'pymupdf==1.28.2'

      - name: Verify runtime secrets
        shell: bash
        env:
          BRIDGE_WORKER_DATABASE_URL: ${{ secrets.BRIDGE_WORKER_DATABASE_URL }}
          GOOGLE_DRIVE_OAUTH_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_JSON }}
        run: |
          set -euo pipefail
          test -n "${BRIDGE_WORKER_DATABASE_URL:-}" || { echo 'BRIDGE_WORKER_DATABASE_URL is not configured'; exit 1; }
          test -n "${GOOGLE_DRIVE_OAUTH_JSON:-}" || { echo 'GOOGLE_DRIVE_OAUTH_JSON is not configured'; exit 1; }

      - name: Verify worker least-privilege access
        env:
          BRIDGE_WORKER_DATABASE_URL: ${{ secrets.BRIDGE_WORKER_DATABASE_URL }}
        run: python database/runtime_worker_preflight.py

      - name: Resolve backfill limit
        id: request
        shell: bash
        env:
          INPUT_LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            LIMIT="$INPUT_LIMIT"
          else
            REQUEST_FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^database/backfill_requests/[^/]+\.txt$' | head -n 1 || true)"
            test -n "$REQUEST_FILE" || { echo 'No backfill request file in triggering commit' >&2; exit 2; }
            LIMIT="$(sed -n 's/^limit=//p' "$REQUEST_FILE" | tail -n 1 | tr -d '[:space:]')"
            LIMIT="${LIMIT:-0}"
          fi
          case "$LIMIT" in
            ''|*[!0-9]*) echo 'Backfill limit must be a non-negative integer' >&2; exit 2 ;;
          esac
          echo "limit=$LIMIT" >> "$GITHUB_OUTPUT"

      - name: Backfill completed AI_DONE jobs
        env:
          BRIDGE_WORKER_DATABASE_URL: ${{ secrets.BRIDGE_WORKER_DATABASE_URL }}
          GOOGLE_DRIVE_OAUTH_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_JSON }}
          BACKFILL_LIMIT: ${{ steps.request.outputs.limit }}
        run: python -m database.backfill_video_results --limit "$BACKFILL_LIMIT"
