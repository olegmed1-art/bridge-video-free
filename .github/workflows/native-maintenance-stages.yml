name: Light fixed AFTER incident restoration

on:
  pull_request:
    paths:
      - '.github/workflows/native-maintenance-stages.yml'
      - 'ops/incident/light_restore*_20260928.py'
      - 'tests/test_light_restore*_20260928.py'
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: 'Exact reviewed INCIDENT execution commit (main must remain historical 8bbc1d6)'
        required: true
        type: string
      accepted_request_digest:
        description: 'Canonical incident authorization JSON, independently reviewed; historical request is not reused'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'olegmed1-art/bridge-video-free' && github.ref == 'refs/heads/recovery/light-after-incident-20260928' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && inputs.expected_main_sha == github.sha && 'oracle-instance-workload-mutation' || format('incident-restore-noop-{0}', github.run_id) }}
  cancel-in-progress: false
  queue: max

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python -m pip install --disable-pip-version-check -q 'psycopg[binary]==3.3.4'
      - run: python -m unittest discover -s tests -p 'test_light_restore*_20260928.py' -v

  restore:
    needs: contract
    if: >-
      github.repository == 'olegmed1-art/bridge-video-free' &&
      github.ref == 'refs/heads/recovery/light-after-incident-20260928' &&
      github.actor == github.repository_owner && github.triggering_actor == github.repository_owner &&
      github.event_name == 'workflow_dispatch' && inputs.expected_main_sha == github.sha
    permissions:
      contents: read
      actions: write
    environment: database-production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: oracle-light-backup-mutation
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python -m pip install --disable-pip-version-check -q oci==2.186.0 'psycopg[binary]==3.3.4'
      - name: Complete one retained AFTER restore under HOLD
        env:
          OCI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_KEY: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_REGION: ${{ secrets.OCI_CLI_REGION }}
          INCIDENT_AUTHORIZATION: ${{ inputs.accepted_request_digest }}
          NATIVE_OWNER_DATABASE_URL: ${{ secrets.LIGHT_MAINTENANCE_DATABASE_URL }}
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
          ACCEPTED_EXECUTION_SHA: ${{ inputs.expected_main_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          python -m pip download --disable-pip-version-check --only-binary=:all: \
            --platform manylinux_2_28_aarch64 --platform manylinux_2_27_aarch64 \
            --python-version 312 --implementation cp --abi cp312 --no-deps \
            --require-hashes --index-url https://pypi.org/simple \
            -r ops/native_driver_requirements.txt --dest "$work/wheels"
          [[ -n "${SSH_PRIVATE_KEY:-}" ]]
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$work/key"
          unset SSH_PRIVATE_KEY
          ssh-keygen -y -P '' -f "$work/key" > "$work/public" 2>/dev/null
          bash ops/oracle_known_hosts_from_scan.sh 92.5.47.149 SHA256:XBR1x74uJ41BxmDF7Y9P20GjIjNbrYXqieV4c2MC0Go "$work/known_hosts"
          PYTHONPATH="$PWD:$PWD/ops" python ops/incident/light_restore_runner_20260928.py "$work/key" "$work/known_hosts" "$work/wheels"
