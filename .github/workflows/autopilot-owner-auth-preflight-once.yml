name: Autopilot Oracle branch-local DSN capability audit (one-shot)

on:
  push:
    branches: [codex/oracle-autopilot-lite-shadow]
    paths: ['.github/workflows/autopilot-owner-auth-preflight-once.yml']

permissions:
  contents: read

concurrency:
  group: oracle-instance-workload-mutation
  cancel-in-progress: false

jobs:
  audit:
    if: github.repository == 'olegmed1-art/bridge-video-free'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      ORACLE_HOST: 158.180.47.161
      ORACLE_USER: ubuntu
      EXPECTED_FINGERPRINT: SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk
      SSH_KEY_ORACLE: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Resolve verified Oracle SSH key
        id: ssh
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/oracle-dsn-audit"
          mkdir -p "$work"
          key="$work/id_oracle"
          printf '%s\n' "$SSH_KEY_ORACLE" | tr -d '\r' > "$key"
          chmod 0600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          known="$work/known_hosts"
          ops/oracle_known_hosts_from_scan.sh "$ORACLE_HOST" "$EXPECTED_FINGERPRINT" "$known"
          ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" \
            -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST" \
            'sudo -n systemctl is-active school-autopilot-shadow.service' >/dev/null
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "known=$known" >> "$GITHUB_OUTPUT"
          echo 'AUTOPILOT_ORACLE_SSH_PREFLIGHT=PASS'

      - name: Test protected Oracle DSN candidates against exact temporary endpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i '${{ steps.ssh.outputs.key }}' \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile='${{ steps.ssh.outputs.known }}' -o ConnectTimeout=15 \
            "$ORACLE_USER@$ORACLE_HOST" 'sudo -n /opt/bridge-school/school-autopilot/.venv/bin/python -' <<'PY'
          import os
          import re
          from pathlib import Path
          from urllib.parse import urlparse, urlunparse
          import psycopg

          root = Path('/opt/bridge-school')
          target_host = 'ep-floral-field-b1pjs2of.c-5.eu-central-1.aws.neon.tech'
          target_pattern = r'ep-floral-field-b1pjs2of(?:-pooler)?(?:\.[a-z0-9-]+)+\.aws\.neon\.tech'
          assert re.fullmatch(target_pattern, target_host)

          candidates = []
          seen = set()
          for path in sorted(root.rglob('*')):
              try:
                  if not path.is_file() or path.is_symlink():
                      continue
                  if path.stat().st_size > 1024 * 1024:
                      continue
              except OSError:
                  continue
              name = path.name.lower()
              if not (name.endswith('.env') or name == '.env' or 'environment' in name):
                  continue
              try:
                  lines = path.read_text(encoding='utf-8', errors='strict').splitlines()
              except (OSError, UnicodeError):
                  continue
              for raw in lines:
                  line = raw.strip()
                  if not line or line.startswith('#') or '=' not in line:
                      continue
                  key, value = line.split('=', 1)
                  key = key.strip()
                  value = value.strip().strip('"').strip("'")
                  if not re.search(r'(?:DATABASE_URL|DATABASE_DSN|POSTGRES_URL|PG_DSN)$', key):
                      continue
                  if not value.startswith(('postgres://', 'postgresql://')):
                      continue
                  parsed = urlparse(value)
                  if not parsed.username or not parsed.hostname or '@' not in parsed.netloc:
                      continue
                  fingerprint = (parsed.username, parsed.password or '', parsed.path, parsed.query)
                  if fingerprint in seen:
                      continue
                  seen.add(fingerprint)
                  candidates.append((str(path), key, value))

          print(f'AUTOPILOT_ORACLE_DSN_CANDIDATES={len(candidates)}')
          connected = []
          for index, (path, key, dsn) in enumerate(candidates, 1):
              parsed = urlparse(dsn)
              userinfo = parsed.netloc.rsplit('@', 1)[0]
              port = parsed.port or 5432
              target = urlunparse((
                  parsed.scheme,
                  f'{userinfo}@{target_host}:{port}',
                  parsed.path or '/neondb',
                  parsed.params,
                  parsed.query,
                  parsed.fragment,
              ))
              safe_user = re.sub(r'[^A-Za-z0-9_.-]', '_', parsed.username)[:63]
              try:
                  with psycopg.connect(
                      target,
                      connect_timeout=8,
                      application_name='autopilot-protected-dsn-audit',
                  ) as conn:
                      with conn.cursor() as cur:
                          cur.execute("""
                              SELECT current_user,
                                     has_function_privilege(
                                         current_user,
                                         'autopilot.create_shadow_task(text,text,jsonb,integer,bigint,text,text)',
                                         'EXECUTE'
                                     ),
                                     has_table_privilege(current_user, 'autopilot.task', 'INSERT'),
                                     EXISTS (
                                         SELECT 1 FROM public.schema_migration
                                          WHERE migration_key='0303_autopilot_github_draft_repair'
                                     )
                          """)
                          actual_user, can_create, can_insert, migration_present = cur.fetchone()
                  connected.append((safe_user, bool(can_create), bool(can_insert), bool(migration_present)))
                  print(
                      f'AUTOPILOT_DSN_{index}={safe_user}|CONNECT=YES|'
                      f'CREATE_TASK={"YES" if can_create else "NO"}|'
                      f'DIRECT_INSERT={"YES" if can_insert else "NO"}|'
                      f'M0303={"YES" if migration_present else "NO"}'
                  )
              except Exception as exc:
                  category = type(exc).__name__
                  print(f'AUTOPILOT_DSN_{index}={safe_user}|CONNECT=NO|ERROR={category}')

          print(f'AUTOPILOT_ORACLE_DSN_CONNECTED={len(connected)}')
          print(f'AUTOPILOT_ORACLE_DSN_CAN_CREATE_TASK={sum(1 for _, create, _, _ in connected if create)}')
          print('AUTOPILOT_DSN_VALUES_EXPOSED=NO')
          print('AUTOPILOT_DATABASE_MUTATED=NO')
          print('ORACLE_INSTANCE_STOP_REQUESTED=NO')
          PY
