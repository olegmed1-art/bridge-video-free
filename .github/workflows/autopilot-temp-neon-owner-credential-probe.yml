name: Autopilot temporary Neon owner credential probe

on:
  push:
    branches: [codex/oracle-autopilot-lite-shadow]
    paths: ['.github/workflows/autopilot-temp-neon-owner-credential-probe.yml']

permissions:
  contents: read

concurrency:
  group: oracle-instance-workload-mutation
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      ORACLE_HOST: 158.180.47.161
      ORACLE_USER: ubuntu
      EXPECTED_FINGERPRINT: SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk
      SSH_KEY_ORACLE: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
      TEMP_ENDPOINT_ID: ep-floral-field-b1pjs2of
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify Oracle and probe stored DSNs only against the temporary endpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          key="$RUNNER_TEMP/id_oracle"; known="$RUNNER_TEMP/known_hosts"
          printf '%s\n' "$SSH_KEY_ORACLE" | tr -d '\r' > "$key"; chmod 0600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          ops/oracle_known_hosts_from_scan.sh "$ORACLE_HOST" "$EXPECTED_FINGERPRINT" "$known"
          ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known" -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST" \
            "sudo -n env TEMP_ENDPOINT_ID='$TEMP_ENDPOINT_ID' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          /opt/bridge-school/school-autopilot/.venv/bin/python - <<'PY'
          import os,re,shlex,urllib.parse
          from pathlib import Path
          import psycopg
          endpoint=os.environ['TEMP_ENDPOINT_ID']
          assert re.fullmatch(r'ep-[a-z0-9-]+',endpoint)
          roots=[Path('/opt/bridge-school'),Path('/etc/systemd/system'),Path('/etc/default')]
          pat=re.compile(r'^(?:export\s+)?([A-Z0-9_]*(?:DATABASE_URL|POSTGRES_URL|DIRECT_URL|NEON_DSN|DATABASE_DSN)[A-Z0-9_]*)=(.*)$')
          candidates=[]; seen=set()
          def val(raw):
              raw=raw.strip()
              if len(raw)>=2 and raw[0]==raw[-1] and raw[0] in {'"',"'"}:
                  try: parts=shlex.split(raw)
                  except ValueError: return ''
                  return parts[0] if len(parts)==1 else ''
              return raw
          for root in roots:
              if not root.exists(): continue
              for p in root.rglob('*'):
                  try: st=p.stat()
                  except Exception: continue
                  if not p.is_file() or st.st_size>131072: continue
                  if p.suffix.lower() not in {'.env','.service','.conf','.config','.ini'} and '.env' not in p.name.lower(): continue
                  inode=(st.st_dev,st.st_ino)
                  if inode in seen: continue
                  seen.add(inode)
                  try: lines=p.read_text(encoding='utf-8',errors='strict').splitlines()
                  except Exception: continue
                  for raw in lines:
                      line=raw.strip()
                      if not line or line.startswith('#'): continue
                      m=pat.fullmatch(line)
                      if m and val(m.group(2)): candidates.append((str(p),m.group(1),val(m.group(2))))
          tested=set(); ok=[]; auth=0
          for source,key,dsn in candidates[:64]:
              try: u=urllib.parse.urlsplit(dsn)
              except ValueError: continue
              host=(u.hostname or '').lower()
              if u.scheme not in {'postgres','postgresql'} or not host.endswith('.neon.tech') or not u.username or u.password is None: continue
              first,sep,suffix=host.partition('.')
              if not sep or not first.startswith('ep-'): continue
              temp_host=endpoint+('-pooler' if first.endswith('-pooler') else '')+'.'+suffix
              ident=(u.username,u.password,u.path,temp_host)
              if ident in tested: continue
              tested.add(ident)
              user=urllib.parse.quote(u.username,safe=''); pw=urllib.parse.quote(u.password,safe=''); port=f':{u.port}' if u.port else ''
              q=[(k,v) for k,v in urllib.parse.parse_qsl(u.query,keep_blank_values=True) if k.lower()!='channel_binding']
              if not any(k.lower()=='sslmode' for k,_ in q): q.append(('sslmode','require'))
              td=urllib.parse.urlunsplit((u.scheme,f'{user}:{pw}@{temp_host}{port}',u.path or '/neondb',urllib.parse.urlencode(q),''))
              try:
                  with psycopg.connect(td,connect_timeout=5,application_name='autopilot-temp-owner-probe') as c:
                      with c.cursor() as cur:
                          cur.execute("SELECT current_user,current_database(),has_database_privilege(current_user,current_database(),'CREATE'),(SELECT rolcreaterole FROM pg_roles WHERE rolname=current_user)")
                          row=cur.fetchone()
                  ok.append(row)
                  print(f'AUTOPILOT_TEMP_CREDENTIAL user={row[0]} database={row[1]} can_create={str(row[2]).lower()} can_create_role={str(row[3]).lower()}')
              except psycopg.OperationalError:
                  auth+=1
          print(f'AUTOPILOT_TEMP_CREDENTIAL_TESTED={len(tested)}')
          print(f'AUTOPILOT_TEMP_CREDENTIAL_CONNECTIONS={len(ok)}')
          print(f'AUTOPILOT_TEMP_OWNER_CAPABLE={sum(1 for r in ok if r[2] and not r[3])}')
          print(f'AUTOPILOT_TEMP_CREDENTIAL_AUTH_FAILURES={auth}')
          print('TEMP_ENDPOINT_ONLY=YES')
          print('DATABASE_MUTATED=NO')
          print('PRODUCTION_DATABASE_CONTACTED=NO')
          PY
          REMOTE
