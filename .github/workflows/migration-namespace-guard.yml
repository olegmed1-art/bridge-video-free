name: Migration Namespace Guard

on:
  pull_request:
    paths:
      - 'database/migrations/**'
      - 'database/tests/**'
      - 'database/MIGRATION_NAMESPACES.md'
      - '.github/workflows/migration-namespace-guard.yml'
  push:
    branches: [main]
    paths:
      - 'database/migrations/**'
      - 'database/tests/**'
      - 'database/MIGRATION_NAMESPACES.md'
      - '.github/workflows/migration-namespace-guard.yml'

permissions:
  contents: read

jobs:
  namespace-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Enforce reserved migration and SQL-test ranges
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          for path in database/migrations/01??_*.sql; do
            base="$(basename "$path" .sql)"
            suffix="${base#*_}"
            case "$suffix" in
              identity_*|club_*|member_*|auth_*) ;;
              *)
                echo "Reserved migration range 0100-0199 is Club/Member/Identity/Auth only: $path" >&2
                exit 1
                ;;
            esac
          done

          for path in database/migrations/03??_*.sql; do
            base="$(basename "$path" .sql)"
            suffix="${base#*_}"
            case "$suffix" in
              autopilot_*|workflow_*) ;;
              *)
                echo "Reserved migration range 0300-0399 is School Autopilot/Workflow only: $path" >&2
                exit 1
                ;;
            esac
          done

          for path in database/migrations/04??_*.sql; do
            base="$(basename "$path" .sql)"
            suffix="${base#*_}"
            case "$suffix" in
              video_*) ;;
              autopilot_codex_ack_fingerprint_not_null)
                # Immutable historical identity; never expand this exception by pattern.
                test "$base" = '0401_autopilot_codex_ack_fingerprint_not_null'
                echo "bea4b407a63256f83f5eecbd8b220406070046edb34d87f849d645b39134dcc7  $path" | sha256sum -c -
                ;;
              *)
                echo "Reserved migration range 0400-0499 is Video only: $path" >&2
                exit 1
                ;;
            esac
          done

          for path in database/tests/09?_*.sql; do
            base="$(basename "$path" .sql)"
            suffix="${base#*_}"
            case "$suffix" in
              identity_*|club_*|member_*|auth_*) ;;
              *)
                echo "Reserved SQL-test range 090-099 is Club/Member/Identity/Auth only: $path" >&2
                exit 1
                ;;
            esac
          done

          for path in database/tests/3??_*.sql; do
            base="$(basename "$path" .sql)"
            suffix="${base#*_}"
            case "$suffix" in
              autopilot_*|workflow_*|canon_source_domain_policy) ;;
              *)
                echo "Reserved SQL-test range 300-399 is School Autopilot/Workflow only: $path" >&2
                exit 1
                ;;
            esac
          done

          for path in database/tests/4??_*.sql; do
            base="$(basename "$path" .sql)"
            suffix="${base#*_}"
            case "$suffix" in
              video_*) ;;
              *)
                echo "Reserved SQL-test range 400-499 is Video only: $path" >&2
                exit 1
                ;;
            esac
          done

          echo 'Reserved migration/test namespaces verified.'
