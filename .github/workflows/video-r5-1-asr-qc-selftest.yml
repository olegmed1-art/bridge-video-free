name: Bridge Video r5.1 ASR QC Selftest

on:
  push:
    branches:
      - algorithm/3.1-free-r5.1-asr-zero-fail
    paths:
      - 'bridge_runtime_hardening_r5_1.py'
      - 'run_drive_3_1_free_generic.py'
      - 'tests/test_asr_qc_r5_1.py'
      - '.github/workflows/video-r5-1-asr-qc-selftest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asr-qc-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install lightweight import dependencies
        run: python -m pip install --disable-pip-version-check requests google-auth
      - name: Run r5.1 ASR QC regression tests
        run: python -m unittest tests.test_asr_qc_r5_1 -v
