name: Oracle DDS3 Pilot-10k full gate finalizer

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: oracle-dds3-pilot10k-finalize
  cancel-in-progress: false

env:
  ORACLE_HOST: 158.180.47.161
  ORACLE_USER: ubuntu
  EXPECTED_FINGERPRINT: SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk
  PILOT_DRIVE_LOCATOR: dds_training/artifact_locations/dds-pilot-10k-complete-31909124383.json
  PILOT_ZIP_SHA256: ef126c6842dda691b08325392b9d7fe5319acdba34b2db6b8981f03d56f8e130
  PILOT_TGZ_SHA256: f472b1361c879e890ffeab0e9184736a7dcd39cbc3a4c33541eb7156df9176d6
  PILOT_RAW_SHA256: 8a21cf06ab7ac424ee0f245ccf274e6d6f4f7135fa9b8c4c0e52c595c0da5996
  PILOT_DB_SHA256: c01cbe9e143198a083df8ab51ea2113ec71688b2f23d93dcfb4b1de9c29f2127
  PILOT_MODEL_SHA256: d8a02835777449c31f2b29f51121c9698f19ae2f41560ff8b43962b3c69ea269
  PILOT_TASKS_SHA256: dda1b6ad3b2f4221347caeb2d9d15f7a438f815a619c614971e3dd1f90672c5e

jobs:
  finalize:
    if: >-
      github.event.comment.user.login == 'olegmed1-art' &&
      github.event.comment.body == '/dds3-pilot10k finalize'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SSH_KEY_ORACLE: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
      SSH_KEY_OCI: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
      SSH_KEY_VM: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
      SSH_KEY_BRIDGE: ${{ secrets.BRIDGE_SCHOOL_ORACLE_SSH_PRIVATE_KEY }}
      SSH_KEY_ORACLE_ALT: ${{ secrets.ORACLE_SSH_KEY }}
      SSH_KEY_OCI_ALT: ${{ secrets.OCI_SSH_KEY }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1

      - name: Restore exact immutable completed Pilot-10k
        env:
          GOOGLE_DRIVE_OAUTH_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'requests==2.32.5' 'google-auth==2.40.3'
          rm -rf /tmp/pilot10k-drive /tmp/pilot10k-zip /tmp/pilot10k-full
          mkdir -p /tmp/pilot10k-zip /tmp/pilot10k-full
          PYTHONPATH=. python tools/restore_drive_split_artifact.py \
            --locator "$PILOT_DRIVE_LOCATOR" \
            --output /tmp/pilot10k.zip \
            --work-dir /tmp/pilot10k-drive
          echo "$PILOT_ZIP_SHA256  /tmp/pilot10k.zip" | sha256sum -c -
          unzip -q /tmp/pilot10k.zip -d /tmp/pilot10k-zip
          archive="$(find /tmp/pilot10k-zip -name 'dds-pilot-10k-complete-state.tgz' -print -quit)"
          test -n "$archive"
          echo "$PILOT_TGZ_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C /tmp/pilot10k-full

      - name: Verify historical full closure without reopening sealed evidence
        id: historical
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/pilot10k-full/pilot
          test -f "$root/pilot_final_summary.json"
          test -f "$root/training.sqlite3"
          test -f "$root/raw.pbn"
          test -f "$root/blind_tasks.jsonl"
          test -f "$root/adaptive_model_v0.2.json"
          echo "$PILOT_RAW_SHA256  $root/raw.pbn" | sha256sum -c -
          echo "$PILOT_DB_SHA256  $root/training.sqlite3" | sha256sum -c -
          echo "$PILOT_MODEL_SHA256  $root/adaptive_model_v0.2.json" | sha256sum -c -
          echo "$PILOT_TASKS_SHA256  $root/blind_tasks.jsonl" | sha256sum -c -
          ROOT="$root" python - <<'PY' | tee /tmp/historical-gate.txt
          import json, os, sqlite3
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          final=json.loads((root/'pilot_final_summary.json').read_text(encoding='utf-8'))
          corpus=json.loads((root/'corpus_summary.json').read_text(encoding='utf-8'))
          assert final['stage']=='pilot'
          assert final['deals']==10000
          assert final['audit']['status']=='ok'
          assert final['stage_gate']['ready_for_next_stage'] is True
          assert final['stage_gate']['open_mandatory_investigations']==0
          assert corpus['count']==10000
          assert corpus['seed']==20260815
          assert corpus['raw_sha256']==os.environ['PILOT_RAW_SHA256']
          db=sqlite3.connect(root/'training.sqlite3')
          total=db.execute('select count(*) from dds_results').fetchone()[0]
          train=db.execute("select count(*) from dds_results where split='train'").fetchone()[0]
          validation=db.execute("select count(*) from dds_results where split='validation'").fetchone()[0]
          sealed=db.execute("select count(*) from dds_results where split='sealed_test'").fetchone()[0]
          opened=db.execute("select count(*) from investigation_events where event_type='opened'").fetchone()[0]
          resolved=db.execute("select count(*) from investigation_events where event_type='resolved'").fetchone()[0]
          assert total==22497, total
          assert train==14000, train
          assert validation==3000, validation
          assert sealed==3000, sealed
          assert opened==resolved==3226, (opened,resolved)
          print('historical_full_closure=PASS')
          print(f'historical_dds_results={total}')
          print(f'historical_train={train}')
          print(f'historical_validation={validation}')
          print(f'historical_sealed_test={sealed}')
          print(f'investigations_opened={opened}')
          print(f'investigations_resolved={resolved}')
          print('open_mandatory_investigations=0')
          print('historical_ready_for_next_stage=true')
          print('sealed_test_reopened=false')
          PY

      - name: Resolve verified Oracle SSH credential
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/oracle-pilot10k-finalize"; mkdir -p "$work"
          known="$work/known_hosts"
          ops/oracle_known_hosts_from_scan.sh "$ORACLE_HOST" "$EXPECTED_FINGERPRINT" "$known"
          selected=''; idx=0
          for name in SSH_KEY_ORACLE SSH_KEY_OCI SSH_KEY_VM SSH_KEY_BRIDGE SSH_KEY_ORACLE_ALT SSH_KEY_OCI_ALT; do
            raw="${!name:-}"; [[ -n "$raw" ]] || continue
            idx=$((idx+1)); base="$work/key-$idx"
            printf '%s\n' "$raw" > "$base.raw"
            tr -d '\r' < "$base.raw" > "$base.crlf"
            RAW_KEY="$raw" OUT_KEY="$base.escaped" python - <<'PY'
          import os
          raw=os.environ['RAW_KEY']
          if '\\n' in raw and '\n' not in raw:
              raw=raw.replace('\\r','').replace('\\n','\n')
          with open(os.environ['OUT_KEY'],'w',newline='\n') as f:
              f.write(raw)
              if not raw.endswith('\n'): f.write('\n')
          PY
            for key in "$base.raw" "$base.crlf" "$base.escaped"; do
              chmod 0600 "$key"
              ssh-keygen -y -f "$key" >/dev/null 2>&1 || continue
              if ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
                   -o UserKnownHostsFile="$known" -o ConnectTimeout=10 "$ORACLE_USER@$ORACLE_HOST" true >/dev/null 2>&1; then
                selected="$key"; break 2
              fi
            done
          done
          [[ -n "$selected" ]]
          cp "$selected" "$work/id_oracle"; chmod 0600 "$work/id_oracle"
          echo "key=$work/id_oracle" >> "$GITHUB_OUTPUT"
          echo "known=$known" >> "$GITHUB_OUTPUT"

      - name: Verify fresh Oracle TRAIN replay evidence
        id: oracle
        shell: bash
        run: |
          set -euo pipefail
          key='${{ steps.ssh.outputs.key }}'; known='${{ steps.ssh.outputs.known }}'
          ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$known" -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST" \
            'sudo -n cat /opt/bridge-school/dds3-mass-validation/evidence/10000.json' > /tmp/oracle-evidence.json
          python - <<'PY' | tee /tmp/oracle-gate.txt
          import json
          x=json.load(open('/tmp/oracle-evidence.json', encoding='utf-8'))
          assert x.get('target')==10000
          assert x.get('status')=='train_passed'
          assert x.get('returncode')==0
          assert x.get('authority')=='ONE_TIME_AUTHORIZED_WRAPPER'
          assert x.get('compute_plane')=='oracle'
          assert x.get('compute_host')=='bridge-school-dds3-frankfurt'
          assert x.get('engine')=='DDS3'
          assert x.get('fallback_used') is False
          assert x.get('corpus_sha256')=='8a21cf06ab7ac424ee0f245ccf274e6d6f4f7135fa9b8c4c0e52c595c0da5996'
          assert x.get('corpus_deals')==10000
          assert x.get('expected_train_tasks')==14000
          print('oracle_train_replay=PASS')
          print('oracle_status=train_passed')
          print('oracle_returncode=0')
          print('oracle_engine=DDS3')
          print('oracle_fallback_used=false')
          print('oracle_corpus_deals=10000')
          print('oracle_expected_train_tasks=14000')
          print('oracle_corpus_sha256='+str(x.get('corpus_sha256')))
          print('oracle_log_sha256='+str(x.get('log_sha256','')))
          PY

      - name: Publish composite full gate
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/pilot10k-full-gate.md"
          {
            echo 'PILOT10K_FULL_GATE_PASS'
            echo
            echo '```text'
            cat /tmp/oracle-gate.txt
            cat /tmp/historical-gate.txt
            echo 'ready_for_30k_prepare=true'
            echo 'validation_or_sealed_recomputed=false'
            echo '```'
            echo
            echo 'Fresh Oracle TRAIN replay and the immutable historical completed Pilot-10k refer to the same pinned 10k corpus. Historical validation/sealed evidence was verified read-only and was not reopened.'
          } > "$body"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -f body="$(cat "$body")" >/dev/null
