name: Diana 23 8375477d final PDF evidence export one-shot

on:
  push:
    branches: [codex/diana-autonomous-finalize-20260911]
    paths: ['.github/workflows/diana23-8375477d-final-pdf-evidence-once.yml']

permissions:
  contents: read

concurrency:
  group: diana23-8375477d-final-pdf-evidence
  cancel-in-progress: false

jobs:
  export:
    if: github.repository == 'olegmed1-art/bridge-video-free'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ORACLE_HOST: 158.180.47.161
      ORACLE_USER: ubuntu
      EXPECTED_FINGERPRINT: SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk
      ALGORITHM_SHA: 8375477d06d536d25b17ecfc9ba80b6e15ab4d93
      SSH_KEY_ORACLE: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
      SSH_KEY_OCI: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
      SSH_KEY_VM: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
      SSH_KEY_BRIDGE: ${{ secrets.BRIDGE_SCHOOL_ORACLE_SSH_PRIVATE_KEY }}
      SSH_KEY_ORACLE_ALT: ${{ secrets.ORACLE_SSH_KEY }}
      SSH_KEY_OCI_ALT: ${{ secrets.OCI_SSH_KEY }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Select verified Oracle credential
        id: ssh
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/diana23-final-pdf-evidence"
          mkdir -p "$work"
          known="$work/known_hosts"
          ops/oracle_known_hosts_from_scan.sh "$ORACLE_HOST" "$EXPECTED_FINGERPRINT" "$known"
          selected=''
          for name in SSH_KEY_ORACLE SSH_KEY_OCI SSH_KEY_VM SSH_KEY_BRIDGE SSH_KEY_ORACLE_ALT SSH_KEY_OCI_ALT; do
            if [[ -n "${!name:-}" ]]; then selected="$name"; break; fi
          done
          [[ -n "$selected" ]]
          key="$work/id_oracle"
          printf '%s\n' "${!selected}" | tr -d '\r' > "$key"
          chmod 0600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" \
            -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST" true
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "known=$known" >> "$GITHUB_OUTPUT"

      - name: Wait for and export exact-head Diana 23 evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_root=/home/ubuntu/bridge-school-private-media/diana-23-26
          remote_out=/tmp/diana23-8375477d-final-evidence-${GITHUB_RUN_ID}
          ssh_base=(ssh -i '${{ steps.ssh.outputs.key }}' -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile='${{ steps.ssh.outputs.known }}' \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=240 \
            "$ORACLE_USER@$ORACLE_HOST")
          "${ssh_base[@]}" "ROOT='$remote_root' OUT='$remote_out' ALGORITHM_SHA='$ALGORITHM_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          receipt="$ROOT/autonomous-results-8375477d/diana-23.json"
          video="$ROOT/diana-23.mp4"
          code="$ROOT/autonomous-code-8375477d"
          for attempt in $(seq 1 240); do
            if [[ -s "$receipt" ]]; then break; fi
            sleep 15
          done
          test -s "$receipt"
          test -f "$video"
          test "$(stat -c %s "$video")" = 652603861
          test -d "$code"
          test "$(git -C "$code" rev-parse HEAD)" = "$ALGORITHM_SHA"
          test -z "$(git -C "$code" status --porcelain)"
          rm -rf "$OUT"
          mkdir -p "$OUT/frames"
          RECEIPT="$receipt" OUT="$OUT" ALGORITHM_SHA="$ALGORITHM_SHA" python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          receipt_path = Path(os.environ["RECEIPT"])
          out = Path(os.environ["OUT"])
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          claimed = receipt["receipt_sha256"]
          material = dict(receipt)
          material.pop("receipt_sha256")
          actual = hashlib.sha256(
              json.dumps(material, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode()
          ).hexdigest()
          assert actual == claimed
          assert receipt["source"]["filename"] == "diana-23.mp4"
          assert receipt["uses_language_model"] is False
          assert receipt["requires_screenshot_review"] is False
          assert receipt["canonical_promotion_allowed"] is False
          deals = receipt["reconstruction"]["deals"]
          assert deals
          manifest = {
              "algorithm_sha": os.environ["ALGORITHM_SHA"],
              "receipt_sha256": claimed,
              "deals": [],
          }
          for index, deal in enumerate(deals, 1):
              first_ms = int(deal["first_timestamp_ms"])
              last_ms = int(deal["last_timestamp_ms"])
              accepted_times = []
              for item in deal.get("accepted", []):
                  accepted_times.extend(
                      [int(item["first_timestamp_ms"]), int(item["last_timestamp_ms"])]
                  )
              representative_ms = (
                  sorted(accepted_times)[len(accepted_times) // 2]
                  if accepted_times else (first_ms + last_ms) // 2
              )
              representative_ms = max(first_ms, min(last_ms, representative_ms))
              manifest["deals"].append(
                  {
                      "index": index,
                      "first_timestamp_ms": first_ms,
                      "last_timestamp_ms": last_ms,
                      "representative_timestamp_ms": representative_ms,
                      "status": deal["status"],
                      "observed_card_count": deal["observed_card_count"],
                      "deal_identity": deal["deal_identity"],
                  }
              )
          (out / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          (out / "diana-23.json").write_bytes(receipt_path.read_bytes())
          PY
          OUT="$OUT" VIDEO="$video" python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          out = Path(os.environ["OUT"])
          video = os.environ["VIDEO"]
          manifest = json.loads((out / "manifest.json").read_text(encoding="utf-8"))
          for item in manifest["deals"]:
              stamp = item["representative_timestamp_ms"] / 1000
              target = out / "frames" / f"deal-{item['index']:03d}.jpg"
              subprocess.run(
                  [
                      "ffmpeg", "-hide_banner", "-loglevel", "error", "-nostdin",
                      "-ss", f"{stamp:.3f}", "-i", video, "-frames:v", "1",
                      "-q:v", "2", "-y", str(target),
                  ],
                  check=True,
              )
              assert target.stat().st_size > 10_000
          PY
          chmod -R go-rwx "$OUT"
          REMOTE
          out="$RUNNER_TEMP/diana23-8375477d-final-evidence"
          mkdir -p "$out"
          scp -q -r -i '${{ steps.ssh.outputs.key }}' -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile='${{ steps.ssh.outputs.known }}' \
            -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST:$remote_out/." "$out/"
          ssh -i '${{ steps.ssh.outputs.key }}' -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile='${{ steps.ssh.outputs.known }}' \
            -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST" "rm -rf '$remote_out'"
          BUNDLE="$out" EXPECTED_SHA="$ALGORITHM_SHA" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["BUNDLE"])
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          assert manifest["algorithm_sha"] == os.environ["EXPECTED_SHA"]
          assert len(list((root / "frames").glob("deal-*.jpg"))) == len(manifest["deals"])
          assert len(manifest["deals"]) > 0
          PY
          echo "artifact_path=$out" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diana23-8375477d-final-evidence-${{ github.run_id }}
          path: ${{ env.artifact_path }}
          if-no-files-found: error
          retention-days: 3
