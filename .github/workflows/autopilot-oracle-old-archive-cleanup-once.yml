name: Autopilot old archive cleanup once

on:
  push:
    branches:
      - codex/oracle-ssh-recovery-20260903
    paths:
      - .github/workflows/autopilot-oracle-old-archive-cleanup-once.yml

permissions:
  contents: read

concurrency:
  group: autopilot-oracle-old-archive-cleanup-once
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Remove transfer archive and verify old runtime stopped
        env:
          OLD_HOST: 158.180.47.161
          OLD_HOST_FINGERPRINT: SHA256:UGJo5yPdnK/wf8DVrzvXt2xJkE9GJ8+3IIcQ2vA+mKc
        run: |
          set -Eeuo pipefail
          umask 077

          key="$RUNNER_TEMP/oracle-old-key"
          known_hosts="$RUNNER_TEMP/oracle-known-hosts"

          printf '%s\n' "${{ secrets.ORACLE_SSH_PRIVATE_KEY }}" >"$key"
          chmod 600 "$key"

          ssh-keyscan -T 10 -t ed25519 "$OLD_HOST" >"$known_hosts" 2>/dev/null
          actual_fingerprint="$(ssh-keygen -lf "$known_hosts" | awk 'NR==1 {print $2}')"
          test "$actual_fingerprint" = "$OLD_HOST_FINGERPRINT"

          ssh \
            -i "$key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" \
            -o ConnectTimeout=10 \
            "ubuntu@$OLD_HOST" 'set -eu
              rm -f /home/ubuntu/autopilot-migration-20260903.tgz
              test ! -e /home/ubuntu/autopilot-migration-20260903.tgz

              shadow_active="$(systemctl is-active school-autopilot-shadow.service 2>/dev/null || true)"
              observer_active="$(systemctl is-active school-autopilot-online-observer.service 2>/dev/null || true)"
              shadow_enabled="$(systemctl is-enabled school-autopilot-shadow.service 2>/dev/null || true)"
              observer_enabled="$(systemctl is-enabled school-autopilot-online-observer.service 2>/dev/null || true)"

              test "$shadow_active" != active
              test "$observer_active" != active
              test "$shadow_enabled" != enabled
              test "$observer_enabled" != enabled

              echo "OLD_TRANSFER_ARCHIVE_REMOVED=YES"
              echo "OLD_SHADOW_ACTIVE=$shadow_active"
              echo "OLD_OBSERVER_ACTIVE=$observer_active"
              echo "OLD_SHADOW_ENABLED=$shadow_enabled"
              echo "OLD_OBSERVER_ENABLED=$observer_enabled"
              echo "OLD_SERVER_REBUILT=NO"
              echo "OTHER_SERVICES_TOUCHED=NO"
            '
