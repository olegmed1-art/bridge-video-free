name: Incident 1911 native one call
on: create
permissions: {}

jobs:
  preflight:
    name: Offline preflight
    if: >-
      github.repository == 'olegmed1-art/bridge-video-free' &&
      github.event.repository.full_name == 'olegmed1-art/bridge-video-free' &&
      github.event_name == 'create' && github.event.ref_type == 'branch' &&
      github.event.ref == 'codex-incident-1911-psycopg-preflight-20261012' &&
      github.ref_name == 'codex-incident-1911-psycopg-preflight-20261012' &&
      github.ref == 'refs/heads/codex-incident-1911-psycopg-preflight-20261012' &&
      github.workflow_sha == github.sha &&
      github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Bootstrap pinned public artifacts
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          timeout --kill-after=5s 35s python3 -I -S - <<'PY'
          import hashlib, json, os, re, sys, urllib.request
          from pathlib import Path
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  raise ValueError("redirect")
          try:
              sha = os.environ.get("GITHUB_SHA", "")
              if not re.fullmatch("[0-9a-f]{40}", sha) or os.environ.get("GITHUB_WORKFLOW_SHA") != sha or os.environ.get("BRIDGE_APP_DATABASE_URL"):
                  raise ValueError("loader_context")
              root = Path.cwd() / ".incident1911"
              root.mkdir()
              pins = {'bootstrap.py': {'sha256': '752a8f491711fcce8fe08ccbcd2d824263068d6c0662c76ad59046f3156fa56f', 'bytes': 4550}, 'package-lock.json': {'sha256': 'a4055d69a279ace336cb981895c584b00ab8cb9d68ed99ece648e106f7e4a19d', 'bytes': 2151}}
              for name, info in pins.items():
                  url = "https://raw.githubusercontent.com/olegmed1-art/bridge-video-free/" + sha + "/scripts/diagnostics/psycopg_once/" + name
                  with urllib.request.build_opener(NoRedirect()).open(url, timeout=5) as response:
                      if response.status != 200 or response.geturl() != url:
                          raise ValueError("response")
                      data = response.read(info["bytes"] + 1)
                  if len(data) != info["bytes"] or hashlib.sha256(data).hexdigest() != info["sha256"]:
                      raise ValueError("integrity")
                  (root / name).write_bytes(data)
              os.execv(sys.executable, [sys.executable, "-I", "-S", str(root / "bootstrap.py")])
          except BaseException:
              print('{"status":"public_bootstrap_failed"}')
              raise SystemExit(1)
          PY
      - name: Offline compatibility without network
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=5s 20s sudo -n unshare --net \
            /usr/bin/setpriv --reuid="$(id -u)" --regid="$(id -g)" \
            --clear-groups --no-new-privs \
            /usr/bin/env -i LC_ALL=C.UTF-8 "$(command -v python3)" -I -S \
            "$PWD/.incident1911/ci.py" offline "$(readlink /proc/self/ns/net)" "$(id -u)" "${GITHUB_SHA}"
  live:
    name: Live once
    if: >-
      github.repository == 'olegmed1-art/bridge-video-free' &&
      github.event.repository.full_name == 'olegmed1-art/bridge-video-free' &&
      github.event_name == 'create' && github.event.ref_type == 'branch' &&
      github.event.ref == 'codex-incident-1911-psycopg-live-20261012' &&
      github.ref_name == 'codex-incident-1911-psycopg-live-20261012' &&
      github.ref == 'refs/heads/codex-incident-1911-psycopg-live-20261012' &&
      github.workflow_sha == github.sha &&
      github.run_number == 2 && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Bootstrap pinned public artifacts
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          timeout --kill-after=5s 35s python3 -I -S - <<'PY'
          import hashlib, json, os, re, sys, urllib.request
          from pathlib import Path
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  raise ValueError("redirect")
          try:
              sha = os.environ.get("GITHUB_SHA", "")
              if not re.fullmatch("[0-9a-f]{40}", sha) or os.environ.get("GITHUB_WORKFLOW_SHA") != sha or os.environ.get("BRIDGE_APP_DATABASE_URL"):
                  raise ValueError("loader_context")
              root = Path.cwd() / ".incident1911"
              root.mkdir()
              pins = {'bootstrap.py': {'sha256': '752a8f491711fcce8fe08ccbcd2d824263068d6c0662c76ad59046f3156fa56f', 'bytes': 4550}, 'package-lock.json': {'sha256': 'a4055d69a279ace336cb981895c584b00ab8cb9d68ed99ece648e106f7e4a19d', 'bytes': 2151}}
              for name, info in pins.items():
                  url = "https://raw.githubusercontent.com/olegmed1-art/bridge-video-free/" + sha + "/scripts/diagnostics/psycopg_once/" + name
                  with urllib.request.build_opener(NoRedirect()).open(url, timeout=5) as response:
                      if response.status != 200 or response.geturl() != url:
                          raise ValueError("response")
                      data = response.read(info["bytes"] + 1)
                  if len(data) != info["bytes"] or hashlib.sha256(data).hexdigest() != info["sha256"]:
                      raise ValueError("integrity")
                  (root / name).write_bytes(data)
              os.execv(sys.executable, [sys.executable, "-I", "-S", str(root / "bootstrap.py")])
          except BaseException:
              print('{"status":"public_bootstrap_failed"}')
              raise SystemExit(1)
          PY
      - name: Offline compatibility without network
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=5s 20s sudo -n unshare --net \
            /usr/bin/setpriv --reuid="$(id -u)" --regid="$(id -g)" \
            --clear-groups --no-new-privs \
            /usr/bin/env -i LC_ALL=C.UTF-8 "$(command -v python3)" -I -S \
            "$PWD/.incident1911/ci.py" offline "$(readlink /proc/self/ns/net)" "$(id -u)" "${GITHUB_SHA}"
      - name: Verify successful first stage
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=5s 15s python3 -I -S .incident1911/ci.py gate
      - name: One native connection call
        shell: bash
        env:
          BRIDGE_APP_DATABASE_URL: ${{ secrets.BRIDGE_APP_DATABASE_URL }}
          VERCEL_ENV: production
        run: |
          set -euo pipefail
          ulimit -c 0
          python3 -I -S .incident1911/probe.py live
