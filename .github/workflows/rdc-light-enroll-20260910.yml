name: Light Oracle authorized console recovery

on:
  push:
    branches: [ops/rdc-light-enroll-20260910]
    paths: ['.github/workflows/rdc-light-enroll-20260910.yml']

permissions:
  contents: read

concurrency:
  group: oracle-light-rdc-enrollment
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      OCI_CLI_CONFIG: ${{ secrets.OCI_CLI_CONFIG }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
    steps:
      - name: Install OCI CLI
        run: python -m pip install --disable-pip-version-check --quiet 'oci-cli==3.90.3' 'pexpect==4.9.0' 'pyte==0.8.2'

      - name: Configure existing principals
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${OCI_CLI_CONFIG:-}"
          test -n "${OCI_CLI_KEY_CONTENT:-}"
          test -n "${ORACLE_SSH_PRIVATE_KEY:-}"
          umask 077
          mkdir -p "$HOME/.oci"
          if [[ "$OCI_CLI_KEY_CONTENT" == base64:* ]]; then
            printf '%s' "${OCI_CLI_KEY_CONTENT#base64:}" | base64 --decode > "$HOME/.oci/key.pem"
          else
            printf '%s\n' "$OCI_CLI_KEY_CONTENT" > "$HOME/.oci/key.pem"
          fi
          printf '%s\n' "$OCI_CLI_CONFIG" > "$HOME/.oci/config"
          openssl pkey -in "$HOME/.oci/key.pem" -traditional -out "$HOME/.oci/key-pkcs1.pem"
          mv "$HOME/.oci/key-pkcs1.pem" "$HOME/.oci/key.pem"
          fingerprint="$(openssl pkey -in "$HOME/.oci/key.pem" -pubout -outform DER | openssl md5 -r | awk '{print $1}' | sed 's/../&:/g;s/:$//')"
          export OCI_DERIVED_FINGERPRINT="$fingerprint"
          python - <<'PY'
          import os
          from pathlib import Path
          p=Path.home()/'.oci/config'
          lines=[]; key=region=fp=False
          for line in p.read_text().splitlines():
              s=line.strip()
              if s.startswith('key_file='):
                  lines.append(f'key_file={Path.home()}/.oci/key.pem'); key=True
              elif s.startswith('region='):
                  lines.append('region=eu-frankfurt-1'); region=True
              elif s.startswith('fingerprint='):
                  lines.append(f'fingerprint={os.environ["OCI_DERIVED_FINGERPRINT"]}'); fp=True
              else: lines.append(line)
          if not key: lines.append(f'key_file={Path.home()}/.oci/key.pem')
          if not region: lines.append('region=eu-frankfurt-1')
          if not fp: lines.append(f'fingerprint={os.environ["OCI_DERIVED_FINGERPRINT"]}')
          p.write_text(chr(10).join(lines)+chr(10))
          PY
          printf '%s\n' "$ORACLE_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/oracle_ssh_key"
          chmod 600 "$RUNNER_TEMP/oracle_ssh_key"
          ssh-keygen -y -f "$RUNNER_TEMP/oracle_ssh_key" > "$RUNNER_TEMP/oracle_ssh_key.pub"
          permanent_key_type="$(awk '{print $1}' "$RUNNER_TEMP/oracle_ssh_key.pub")"
          echo "PERMANENT_KEY_TYPE=$permanent_key_type"
          ssh-keygen -q -t rsa -b 2048 -N '' -f "$RUNNER_TEMP/console_key"
          echo 'CONSOLE_KEY_TYPE=ssh-rsa'
          oci iam region list --output json >/dev/null
          echo 'CONTROL_PRINCIPALS=PASS'

      - name: Resolve exact Light and create console connection
        shell: bash
        run: |
          set -Eeuo pipefail
          tenancy="$(python -c 'import configparser,pathlib; p=configparser.ConfigParser(); p.read(pathlib.Path.home()/".oci"/"config"); print(p["DEFAULT"]["tenancy"])')"
          oci iam compartment list --compartment-id "$tenancy" --include-root --compartment-id-in-subtree true --access-level ACCESSIBLE --all > "$RUNNER_TEMP/compartments.json"
          python - "$RUNNER_TEMP/compartments.json" > "$RUNNER_TEMP/compartments" <<'PY'
          import json,sys
          for x in json.load(open(sys.argv[1]))['data']:
              if x.get('lifecycle-state')=='ACTIVE' and isinstance(x.get('id'),str): print(x['id'])
          PY
          : > "$RUNNER_TEMP/instances.jsonl"
          while IFS= read -r compartment; do
            oci compute instance list --compartment-id "$compartment" --all |
              python -c 'import json,sys; [print(json.dumps(x,separators=(",",":"))) for x in json.load(sys.stdin)["data"]]' >> "$RUNNER_TEMP/instances.jsonl"
          done < "$RUNNER_TEMP/compartments"
          python - "$RUNNER_TEMP/instances.jsonl" > "$RUNNER_TEMP/target.env" <<'PY'
          import json,sys
          rows=[json.loads(x) for x in open(sys.argv[1]) if x.strip()]
          rows=[x for x in rows if x.get('display-name')=='bridge-school-autopilot-lite' and x.get('lifecycle-state') not in {'TERMINATED','TERMINATING'}]
          assert len(rows)==1
          x=rows[0]
          assert x['lifecycle-state']=='RUNNING'
          assert x['shape']=='VM.Standard.A1.Flex'
          print('INSTANCE_ID='+x['id'])
          print('COMPARTMENT_ID='+x['compartment-id'])
          PY
          source "$RUNNER_TEMP/target.env"
          active_count="$(python - "$INSTANCE_ID" <<'PY'
          import oci,sys
          cfg=oci.config.from_file()
          client=oci.core.ComputeClient(cfg)
          rows=oci.pagination.list_call_get_all_results(
              client.list_instance_console_connections,
              compartment_id=cfg['tenancy'],
              instance_id=sys.argv[1],
          ).data
          print(sum(1 for x in rows if x.lifecycle_state in {'ACTIVE','CREATING'}))
          PY
          )"
          echo "EXISTING_ACTIVE_CONSOLE_COUNT=$active_count"
          [[ "$active_count" == 0 ]]
          oci compute instance-console-connection create --instance-id "$INSTANCE_ID" --ssh-public-key-file "$RUNNER_TEMP/console_key.pub" --wait-for-state ACTIVE --wait-interval-seconds 5 --max-wait-seconds 180 > "$RUNNER_TEMP/console.json"
          connection_id="$(python - "$RUNNER_TEMP/console.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))['data']
          assert d['lifecycle-state']=='ACTIVE'
          print(d['id'])
          PY
          )"
          oci compute instance-console-connection get --instance-console-connection-id "$connection_id" > "$RUNNER_TEMP/console-get.json"
          python - "$RUNNER_TEMP/console-get.json" > "$RUNNER_TEMP/connection-string" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))['data']
          assert d['lifecycle-state']=='ACTIVE'
          print(d['connection-string'])
          PY
          oci compute instance list-vnics --instance-id "$INSTANCE_ID" --all > "$RUNNER_TEMP/vnics.json"
          public_ip="$(python - "$RUNNER_TEMP/vnics.json" <<'PY'
          import json,sys
          rows=[x for x in json.load(open(sys.argv[1]))['data'] if x.get('is-primary')]
          assert len(rows)==1 and rows[0].get('public-ip')
          print(rows[0]['public-ip'])
          PY
          )"
          echo "CONNECTION_ID=$connection_id" >> "$GITHUB_ENV"
          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"
          echo "PUBLIC_IP=$public_ip" >> "$GITHUB_ENV"
          echo 'LIGHT_CONSOLE_CONNECTION=ACTIVE'

      - name: Recover approved SSH key through Ubuntu GRUB
        shell: bash
        run: |
          set -Eeuo pipefail
          python - "$INSTANCE_ID" "$RUNNER_TEMP/connection-string" "$RUNNER_TEMP/console_key" "$RUNNER_TEMP/oracle_ssh_key.pub" <<'PY'
          import os,pexpect,pyte,shlex,subprocess,sys,time

          instance_id, conn_file, console_key, pub_file = sys.argv[1:]
          conn=open(conn_file).read().strip().replace('<privateKey>', console_key)
          argv=shlex.split(conn)
          child=pexpect.spawn(argv[0], argv[1:], encoding='utf-8', codec_errors='ignore',
                              timeout=0.5, dimensions=(45,180))
          screen=pyte.Screen(180,45)
          stream=pyte.Stream(screen)
          transcript=[]

          def drain(seconds):
              deadline=time.time()+seconds
              while time.time()<deadline:
                  try:
                      child.expect([pexpect.TIMEOUT,pexpect.EOF], timeout=min(0.5,max(0.05,deadline-time.time())))
                  except pexpect.ExceptionPexpect:
                      pass
                  data=child.before or ''
                  if data:
                      transcript.append(data)
                      stream.feed(data)
                  child.before=''
                  if not child.isalive():
                      break

          def view():
              return '\n'.join(screen.display)

          drain(8)
          if not child.isalive():
              raise RuntimeError('serial console exited before recovery')
          child.send('\r')
          drain(3)
          print('LIGHT_SERIAL_ATTACH=PASS', flush=True)

          subprocess.run([
              'oci','compute','instance','action','--instance-id',instance_id,
              '--action','SOFTRESET'
          ], check=True, stdout=subprocess.DEVNULL)
          print('LIGHT_CONSOLE_SOFTRESET=ISSUED', flush=True)

          menu=False
          deadline=time.time()+55
          while time.time()<deadline:
              child.send('\x1b')
              drain(0.35)
              v=view()
              if 'GNU GRUB' in v and ('Ubuntu' in v or 'Advanced options' in v):
                  menu=True
                  break
          if not menu:
              raise RuntimeError('GRUB menu not captured; no guest changes made')

          child.send('e')
          drain(3)
          linux_row=None
          for i,line in enumerate(screen.display):
              s=line.lstrip()
              if (s.startswith('linux ') or s.startswith('linuxefi ')) and ('vmlinuz' in s):
                  linux_row=i
                  break
          if linux_row is None:
              raise RuntimeError('GRUB linux command line not found; no guest changes made')

          delta=linux_row-screen.cursor.y
          child.send(('\x1b[B'*delta) if delta>0 else ('\x1b[A'*(-delta)))
          child.send('\x05')
          child.send(' rw init=/bin/bash')
          child.send('\x18')
          drain(35)
          v=view()
          if 'initramfs' in v.lower():
              raise RuntimeError('unexpected initramfs prompt')
          child.send('\r')
          drain(2)

          key=open(pub_file).read().strip()
          q=shlex.quote(key)
          commands=[
              "mount -o remount,rw / && echo LIGHT_ROOT_RW_PASS",
              "install -d -m 700 -o ubuntu -g ubuntu /home/ubuntu/.ssh",
              "touch /home/ubuntu/.ssh/authorized_keys",
              f"grep -qxF -- {q} /home/ubuntu/.ssh/authorized_keys || printf '%s\\n' {q} >> /home/ubuntu/.ssh/authorized_keys",
              "chown -R ubuntu:ubuntu /home/ubuntu/.ssh && chmod 700 /home/ubuntu/.ssh && chmod 600 /home/ubuntu/.ssh/authorized_keys",
              f"grep -qxF -- {q} /home/ubuntu/.ssh/authorized_keys && echo LIGHT_KEY_INSTALLED_PASS",
              "sync"
          ]
          for cmd in commands:
              child.sendline(cmd)
              drain(1.5)
          if 'LIGHT_KEY_INSTALLED_PASS' not in ''.join(transcript):
              raise RuntimeError('authorized_keys verification failed')
          print('LIGHT_KEY_INSTALLED=PASS', flush=True)
          child.sendline('exec /sbin/reboot -f')
          drain(8)
          print('LIGHT_GUEST_REBOOT=ISSUED', flush=True)
          child.close(force=True)
          PY

      - name: Verify recovered SSH and read-only host state
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_ok=0
          for attempt in $(seq 1 30); do
            if ssh -i "$RUNNER_TEMP/oracle_ssh_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=8 "ubuntu@$PUBLIC_IP" 'true' >/dev/null 2>&1; then
              ssh_ok=1
              break
            fi
            sleep 10
          done
          [[ "$ssh_ok" == 1 ]]
          echo 'LIGHT_SSH=PASS'
          ssh -i "$RUNNER_TEMP/oracle_ssh_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "ubuntu@$PUBLIC_IP" '
            set -u
            echo "HOSTNAME=$(hostname)"
            echo "UPTIME_SECONDS=$(cut -d. -f1 /proc/uptime)"
            echo "FAILED_UNITS_BEGIN"
            systemctl --failed --no-pager --no-legend 2>/dev/null || true
            echo "FAILED_UNITS_END"
            echo "AUTOPILOT_UNITS_BEGIN"
            systemctl list-units --type=service --all --no-pager --no-legend 2>/dev/null | grep -Ei "autopilot|bridge|worker|queue" || true
            echo "AUTOPILOT_UNITS_END"
            echo "CONTAINERS_BEGIN"
            if command -v docker >/dev/null 2>&1; then sudo -n docker ps --format "{{.Names}}|{{.Status}}|{{.Image}}" 2>/dev/null || true; fi
            if command -v podman >/dev/null 2>&1; then podman ps --format "{{.Names}}|{{.Status}}|{{.Image}}" 2>/dev/null || true; fi
            echo "CONTAINERS_END"
            echo "RDC_PROCESSES_BEGIN"
            pgrep -af "desktop-commander.*remote" || true
            echo "RDC_PROCESSES_END"
          '
          echo 'LIGHT_READONLY_HOST_PROBE=PASS'

      - name: Remove temporary console connection
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${CONNECTION_ID:-}" ]]; then
            oci compute instance-console-connection delete --instance-console-connection-id "$CONNECTION_ID" --force
            echo 'TEMP_CONSOLE_CONNECTION_REMOVED=PASS'
          fi
