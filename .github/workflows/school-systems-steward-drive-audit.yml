name: School Systems Steward - Drive read-only audit

on:
  pull_request:
    paths:
      - "steward/**"
      - "tests/test_school_systems_drive_*.py"
      - ".github/workflows/school-systems-steward-drive-audit.yml"
      - "universal_video/drive_adapter.py"
  push:
    branches:
      - main
    paths:
      - "steward/**"
      - ".github/workflows/school-systems-steward-drive-audit.yml"
      - "universal_video/drive_adapter.py"
  schedule:
    - cron: "23 2 * * 1"
  workflow_dispatch:
    inputs:
      root_folder_id:
        description: "Google Drive folder ID to inventory recursively"
        required: true
        default: "1uzpcT49YcV34gcv_Jo2U86a9qHUuqPpj"
        type: string
      root_name:
        description: "Human-readable root name for manifest paths"
        required: true
        default: "Школа спортивного бриджа"
        type: string

permissions:
  contents: read

concurrency:
  group: school-systems-steward-drive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bounded dependencies
        run: python -m pip install -q pytest requests==2.32.5 google-auth==2.48.0

      - name: Run Steward contract tests
        run: python -m pytest -q tests/test_school_systems_drive_*.py

      - name: Compile collector
        run: >-
          python -m py_compile
          steward/__init__.py
          steward/drive_inventory.py
          steward/drive_inventory_runner.py

  drive-audit:
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOOGLE_DRIVE_OAUTH_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_JSON }}
      INPUT_ROOT_FOLDER_ID: ${{ inputs.root_folder_id }}
      INPUT_ROOT_NAME: ${{ inputs.root_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bounded dependencies
        run: python -m pip install -q requests==2.32.5 google-auth==2.48.0

      - name: Validate credential presence without printing it
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GOOGLE_DRIVE_OAUTH_JSON:-}" ]]; then
            echo "SCHOOL_STEWARD_DRIVE_AUDIT_FAIL code=DRIVE_SECRET_MISSING" >&2
            exit 1
          fi

      - name: Run complete read-only Drive traversal
        id: inventory
        shell: bash
        run: |
          set -euo pipefail
          root_id="${INPUT_ROOT_FOLDER_ID:-1uzpcT49YcV34gcv_Jo2U86a9qHUuqPpj}"
          root_name="${INPUT_ROOT_NAME:-Школа спортивного бриджа}"
          if [[ "$root_id" == *$'\n'* || "$root_name" == *$'\n'* ]]; then
            echo "SCHOOL_STEWARD_DRIVE_AUDIT_FAIL code=INPUT_NEWLINE_FORBIDDEN" >&2
            exit 1
          fi
          out="$RUNNER_TEMP/school-steward-drive-${GITHUB_RUN_ID}"
          mkdir -p "$out"
          python -m steward.drive_inventory_runner \
            --root-folder-id "$root_id" \
            --root-name "$root_name" \
            --output-dir "$out"
          echo "output_dir=$out" >> "$GITHUB_OUTPUT"
          echo "root_folder_id=$root_id" >> "$GITHUB_OUTPUT"

      - name: Validate complete manifest boundary
        shell: bash
        run: |
          set -euo pipefail
          manifest="${{ steps.inventory.outputs.output_dir }}/drive-inventory.json"
          python - "$manifest" "${{ steps.inventory.outputs.root_folder_id }}" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          expected_root = sys.argv[2]
          if not path.is_file() or path.stat().st_size == 0:
              raise SystemExit("SCHOOL_STEWARD_DRIVE_AUDIT_FAIL code=MANIFEST_MISSING")
          payload = json.loads(path.read_text(encoding="utf-8"))
          if payload.get("status") != "COMPLETE":
              raise SystemExit("SCHOOL_STEWARD_DRIVE_AUDIT_FAIL code=MANIFEST_NOT_COMPLETE")
          if (payload.get("root") or {}).get("folder_id") != expected_root:
              raise SystemExit("SCHOOL_STEWARD_DRIVE_AUDIT_FAIL code=ROOT_MISMATCH")
          digest = str(payload.get("inventory_sha256") or "")
          if not re.fullmatch(r"[0-9a-f]{64}", digest):
              raise SystemExit("SCHOOL_STEWARD_DRIVE_AUDIT_FAIL code=CHECKSUM_INVALID")
          counts = payload.get("counts")
          keys = ("folders", "files", "videos")
          if not isinstance(counts, dict) or not all(
              isinstance(counts.get(key), int) for key in keys
          ):
              raise SystemExit("SCHOOL_STEWARD_DRIVE_AUDIT_FAIL code=COUNTS_INVALID")
          print(
              "SCHOOL_STEWARD_DRIVE_MANIFEST_PASS "
              f"folders={counts['folders']} files={counts['files']} "
              f"videos={counts['videos']} sha256={digest}"
          )
          PY

      - name: Print bounded non-sensitive summary
        run: cat "${{ steps.inventory.outputs.output_dir }}/drive-inventory-summary.txt"

      - name: Keep detailed inventory runner-local only
        shell: bash
        run: |
          set -euo pipefail
          test -s "${{ steps.inventory.outputs.output_dir }}/drive-inventory.json"
          test -s "${{ steps.inventory.outputs.output_dir }}/drive-videos.csv"
          echo "SCHOOL_STEWARD_PRIVATE_EVIDENCE_PASS detailed_artifact_uploaded=0"

  purge-legacy-detailed-artifacts:
    if: ${{ always() && github.event_name == 'push' }}
    needs: drive-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Delete only legacy Steward detailed artifacts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          prefix = "school-systems-steward-drive-"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "school-systems-steward",
          }
          deleted = 0
          page = 1
          while True:
              list_url = (
                  f"https://api.github.com/repos/{repository}/actions/artifacts"
                  f"?per_page=100&page={page}"
              )
              with urllib.request.urlopen(
                  urllib.request.Request(list_url, headers=headers), timeout=30
              ) as response:
                  payload = json.load(response)
              artifacts = payload.get("artifacts")
              if not isinstance(artifacts, list):
                  raise SystemExit(
                      "SCHOOL_STEWARD_ARTIFACT_PURGE_FAIL code=INVALID_LIST"
                  )
              for artifact in artifacts:
                  name = str(artifact.get("name") or "")
                  artifact_id = artifact.get("id")
                  if not name.startswith(prefix):
                      continue
                  if not isinstance(artifact_id, int):
                      raise SystemExit(
                          "SCHOOL_STEWARD_ARTIFACT_PURGE_FAIL code=INVALID_ID"
                      )
                  delete_url = (
                      f"https://api.github.com/repos/{repository}/actions/"
                      f"artifacts/{artifact_id}"
                  )
                  request = urllib.request.Request(
                      delete_url, headers=headers, method="DELETE"
                  )
                  with urllib.request.urlopen(request, timeout=30) as response:
                      if response.status != 204:
                          raise SystemExit(
                              "SCHOOL_STEWARD_ARTIFACT_PURGE_FAIL "
                              f"code=HTTP_{response.status}"
                          )
                  deleted += 1
              if len(artifacts) < 100:
                  break
              page += 1
          print(f"SCHOOL_STEWARD_ARTIFACT_PURGE_PASS deleted={deleted}")
          PY
