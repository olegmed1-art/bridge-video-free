name: Yan Site Spot Integration CI

on:
  push:
    branches: ['codex/yan-site-spot-integration-20261016']
    paths:
      - '.gitattributes'
      - 'site_integration/yan_spot_cycle/**'
      - '.github/workflows/yan-site-spot-ci.yml'

permissions:
  contents: read

jobs:
  php-site-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install existing backend test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-api.txt 'pytest==9.1.1' 'httpx==0.28.1'
      - name: Check new PHP code
        run: |
          php --version
          find site_integration/yan_spot_cycle -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Check new site bootstrap and authored public projection
        run: node --test site_integration/yan_spot_cycle/tests/test_site_host.cjs
      - name: Check only the new PHP and backend chain
        run: >-
          timeout --signal=TERM --kill-after=10s 240s
          python -m pytest -q -p no:cacheprovider
          site_integration/yan_spot_cycle/tests/test_php_chain.py
