name: Issue 881 one-shot root filesystem expansion

on:
  pull_request:
    paths:
      - '.github/workflows/issue-881-root-filesystem-expand.yml'
      - 'ops/oracle_universal_video_root_filesystem_expand.sh'
      - 'ops/issue-881-root-filesystem-expand-request.json'
      - 'tests/test_issue_881_root_filesystem_expand_contract.py'
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('issue-881-root-expand-pr-{0}', github.run_id) || (github.event.issue.number == 881 && github.event.comment.user.login == 'olegmed1-art' && contains(fromJSON('["/oracle-ops issue-881-expand-root-and-recover-bba508","/oracle-ops issue-881-reconcile-run-33914733788"]'), github.event.comment.body)) && 'oracle-instance-workload-mutation' || format('issue-881-root-expand-noop-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  contract:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {persist-credentials: false}
      - run: |
          set -euo pipefail
          ruby -e "require 'yaml'; YAML.parse_file(ARGV.fetch(0))" .github/workflows/issue-881-root-filesystem-expand.yml
          bash -n ops/oracle_universal_video_root_filesystem_expand.sh
          python - <<'PY'
          import runpy
          for path in (
              'tests/test_issue_881_root_filesystem_expand_contract.py',
              'tests/test_issue_881_current_main_recovery_contract.py',
          ):
              namespace = runpy.run_path(path)
              for name, value in namespace.items():
                  if name.startswith('test_') and callable(value):
                      value()
          PY

  expand-and-recover:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 881 &&
      github.event.comment.user.login == 'olegmed1-art' &&
      contains(fromJSON('["/oracle-ops issue-881-expand-root-and-recover-bba508","/oracle-ops issue-881-reconcile-run-33914733788"]'), github.event.comment.body)
    runs-on: ubuntu-24.04
    # The executable monotonic primary deadline caps every OCI request, waiter,
    # rediscovery, and isolated SSH acceptance at 240 minutes total. Restore
    # AVAILABLE and hydration additionally share one 60-minute subdeadline.
    # The current-attempt cleanup worst case is 1,840 seconds: eight 30-second
    # rediscoveries, eight 20-second delete requests, one 600-second instance
    # wait, and seven 120-second dependency/backup waits. At most 20 superseded
    # backups add 400 seconds of DELETE attempts plus one 120-second aggregate
    # absence wait, for a conservative 2,360-second configured bound inside the
    # 2,400-second cleanup reserve. Another 40 minutes is
    # reserved for the host-lock mutation, 25 minutes for the always() receipt,
    # and 15 minutes for runner setup/cancellation slack under GitHub's 360m cap.
    timeout-minutes: 360
    env:
      ORACLE_HOST: 158.180.47.161
      ORACLE_USER: ubuntu
      EXPECTED_HOSTNAME: bridge-school-dds3-frankfurt
      EXPECTED_FINGERPRINT: SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk
      EXACT_RUNTIME_SHA: bba508350cbe63a7a8ec93fa9c007db9ee9eae6c
      SSH_KEY_ORACLE: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
      OCI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_KEY: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      OCI_REGION: ${{ secrets.OCI_CLI_REGION }}
      GH_TOKEN: ${{ github.token }}
      CLEANUP_ONLY_COMMAND: /oracle-ops issue-881-reconcile-run-33914733788
      OWNER_COMMAND: ${{ github.event.comment.body }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Validate immutable one-shot request
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          expected = {
              'operation': 'expand_existing_root_filesystem',
              'host': '158.180.47.161',
              'hostname': 'bridge-school-dds3-frankfurt',
              'expected_volume_gb': 97,
              'runtime_sha': 'bba508350cbe63a7a8ec93fa9c007db9ee9eae6c',
          }
          assert json.load(open('ops/issue-881-root-filesystem-expand-request.json')) == expected
          PY
      - name: Establish monotonic operation and cleanup budgets
        id: budget
        run: |
          set -euo pipefail
          monotonic_now="$(awk '{print int($1)}' /proc/uptime)"
          [[ "$monotonic_now" =~ ^[0-9]+$ ]]
          # 240m primary + 40m reserved cleanup + 40m mutation + 25m receipt
          # = 345m. The job-level 360m timeout retains 15m runner slack.
          echo "primary_deadline=$((monotonic_now + 14400))" >> "$GITHUB_OUTPUT"
          echo "cleanup_deadline=$((monotonic_now + 16800))" >> "$GITHUB_OUTPUT"
          echo "mutation_deadline=$((monotonic_now + 19200))" >> "$GITHUB_OUTPUT"
          echo "receipt_deadline=$((monotonic_now + 20700))" >> "$GITHUB_OUTPUT"
      - name: Create fresh full backup and prove isolated restored-root boot acceptance
        id: backup
        env:
          PRIMARY_DEADLINE: ${{ steps.budget.outputs.primary_deadline }}
          CLEANUP_DEADLINE: ${{ steps.budget.outputs.cleanup_deadline }}
        run: |
          set -euo pipefail
          primary_deadline="$PRIMARY_DEADLINE"
          cleanup_deadline="$CLEANUP_DEADLINE"
          [[ "$primary_deadline" =~ ^[0-9]+$ && "$cleanup_deadline" =~ ^[0-9]+$ ]]
          (( cleanup_deadline > primary_deadline ))
          monotonic_now() { awk '{print int($1)}' /proc/uptime; }
          bounded_wait_seconds() {
            local requested="$1" absolute_deadline="$2" now remaining
            now="$(monotonic_now)"
            remaining=$((absolute_deadline - now))
            (( remaining > 0 )) || return 42
            (( requested < remaining )) && printf '%s\n' "$requested" || printf '%s\n' "$remaining"
          }
          for value in OCI_USER OCI_TENANCY OCI_FINGERPRINT OCI_KEY OCI_REGION; do
            [[ -n "${!value:-}" ]] || exit 21
          done
          [[ "$OCI_REGION" == eu-frankfurt-1 ]] || exit 22
          python -m pip install --disable-pip-version-check -q 'oci-cli==3.90.3'
          install -d -m 0700 "$HOME/.oci"
          printf '%s' "$OCI_KEY" | python -c 'import sys; raw=sys.stdin.read().replace("\\r","").replace("\\n","\n"); open(sys.argv[1],"w").write(raw if raw.endswith("\n") else raw+"\n")' "$HOME/.oci/key.pem"
          chmod 0600 "$HOME/.oci/key.pem"
          python - <<'PY'
          import os
          from pathlib import Path
          def scalar(env, key):
              lines=[x.strip() for x in os.environ[env].replace('\r','').splitlines() if x.strip()]
              matches=[x.split('=',1)[1].strip() for x in lines if x.startswith(key+'=')]
              if len(matches)==1 and matches[0]: return matches[0]
              if not matches and len(lines)==1 and '=' not in lines[0]: return lines[0]
              raise SystemExit(f'ambiguous {env}')
          values={'user':scalar('OCI_USER','user'),'fingerprint':scalar('OCI_FINGERPRINT','fingerprint'),'tenancy':scalar('OCI_TENANCY','tenancy'),'region':scalar('OCI_REGION','region')}
          text='[DEFAULT]\n'+''.join(f'{k}={v}\n' for k,v in values.items())+f"key_file={Path.home()/'.oci'/'key.pem'}\n"
          (Path.home()/'.oci'/'config').write_text(text)
          PY
          chmod 0600 "$HOME/.oci/config"
          export OCI_CLI_REGION="$OCI_REGION"
          # Every OCI read in this step is bounded and keeps JSON stdout apart
          # from warnings/errors on stderr.  A nonzero CLI result, malformed
          # JSON, or unexpected schema is never interpreted as an empty list.
          oci_json_request() {
            local stdout_file="$RUNNER_TEMP/issue-881-oci-json.stdout"
            local stderr_file="$RUNNER_TEMP/issue-881-oci-json.stderr"
            local attempt rc max_attempts="${OCI_JSON_MAX_ATTEMPTS:-6}"
            local retry_delay_seconds="${OCI_JSON_RETRY_DELAY_SECONDS:-5}"
            local request_timeout_seconds="${OCI_JSON_REQUEST_TIMEOUT_SECONDS:-30}"
            local absolute_deadline="${OCI_JSON_ABSOLUTE_DEADLINE:-$primary_deadline}" bounded_request_seconds bounded_retry_seconds
            for attempt in $(seq 1 "$max_attempts"); do
              : >"$stdout_file"; : >"$stderr_file"
              bounded_request_seconds="$(bounded_wait_seconds "$request_timeout_seconds" "$absolute_deadline")" || return 42
              if timeout --signal=KILL "${bounded_request_seconds}s" \
                  "$@" --output json >"$stdout_file" 2>"$stderr_file"; then rc=0; else rc=$?; fi
              OCI_JSON_OUTPUT="$(<"$stdout_file")"
              OCI_JSON_ERROR="$(<"$stderr_file")"
              (( rc == 0 )) || return "$rc"
              if printf '%s' "$OCI_JSON_OUTPUT" | python -c 'import json,sys; d=json.load(sys.stdin); assert isinstance(d,dict)'; then
                return 0
              fi
              OCI_JSON_ERROR=INVALID_JSON_SUCCESS_RESPONSE
              if (( attempt < max_attempts )); then
                bounded_retry_seconds="$(bounded_wait_seconds "$retry_delay_seconds" "$absolute_deadline")" || return 42
                sleep "$bounded_retry_seconds"
              fi
            done
            return 86
          }
          # END OCI_JSON_REQUEST_HELPER
          oci_json_request oci iam compartment list --include-root --all
          roots="$OCI_JSON_OUTPUT"
          tenancy_id="$(printf '%s' "$roots" | python -c 'import json,sys; data=json.load(sys.stdin).get("data"); assert isinstance(data,list) and all(isinstance(x,dict) for x in data); xs=[x.get("id") for x in data if isinstance(x.get("id"),str) and x["id"].startswith("ocid1.tenancy.")]; assert len(xs)==1; print(xs[0])')"
          oci_json_request oci compute instance list --compartment-id "$tenancy_id" --display-name bridge-school-dds3-frankfurt --all
          instances="$OCI_JSON_OUTPUT"
          instance_id="$(printf '%s' "$instances" | python -c 'import json,sys; data=json.load(sys.stdin).get("data"); assert isinstance(data,list) and all(isinstance(x,dict) for x in data); allowed={"PROVISIONING","STARTING","RUNNING","STOPPING","STOPPED","TERMINATING","TERMINATED"}; assert all(isinstance(x.get("lifecycle-state"),str) and x["lifecycle-state"] in allowed for x in data); xs=[x for x in data if x.get("display-name")=="bridge-school-dds3-frankfurt" and x["lifecycle-state"] not in {"TERMINATED","TERMINATING"}]; assert len(xs)==1 and isinstance(xs[0].get("id"),str) and xs[0]["id"]; print(xs[0]["id"])')"
          oci_json_request oci compute instance get --instance-id "$instance_id"
          instance_json="$OCI_JSON_OUTPUT"
          INSTANCE="$instance_json" EXPECTED_INSTANCE_ID="$instance_id" python - <<'PY'
          import json,os
          p=json.loads(os.environ['INSTANCE']); d=p.get('data')
          assert isinstance(d,dict) and d.get('id')==os.environ['EXPECTED_INSTANCE_ID']
          assert d['display-name']=='bridge-school-dds3-frankfurt'
          assert d['lifecycle-state']=='RUNNING'
          assert d['compartment-id'].startswith('ocid1.tenancy.')
          PY
          ad="$(printf '%s' "$instance_json" | python -c 'import json,sys; print(json.load(sys.stdin)["data"]["availability-domain"])')"
          oci_json_request oci compute boot-volume-attachment list --compartment-id "$tenancy_id" --availability-domain "$ad" --instance-id "$instance_id" --all
          attachments="$OCI_JSON_OUTPUT"
          boot_id="$(printf '%s' "$attachments" | EXPECTED_INSTANCE_ID="$instance_id" python -c 'import json,os,sys; data=json.load(sys.stdin).get("data"); assert isinstance(data,list) and all(isinstance(x,dict) for x in data); allowed={"ATTACHING","ATTACHED","DETACHING","DETACHED"}; assert all(x.get("instance-id")==os.environ["EXPECTED_INSTANCE_ID"] and isinstance(x.get("lifecycle-state"),str) and x["lifecycle-state"] in allowed for x in data); xs=[x for x in data if x["lifecycle-state"]=="ATTACHED"]; assert len(xs)==1 and isinstance(xs[0].get("boot-volume-id"),str) and xs[0]["boot-volume-id"]; print(xs[0]["boot-volume-id"])')"
          oci_json_request oci bv boot-volume get --boot-volume-id "$boot_id"
          boot_size="$(printf '%s' "$OCI_JSON_OUTPUT" | EXPECTED_BOOT_ID="$boot_id" python -c 'import json,os,sys; d=json.load(sys.stdin).get("data"); assert isinstance(d,dict) and d.get("id")==os.environ["EXPECTED_BOOT_ID"] and isinstance(d.get("size-in-gbs"),int); print(d["size-in-gbs"])')"
          [[ "$boot_size" == 97 ]] || exit 30
          oci_json_request oci compute vnic-attachment list --compartment-id "$tenancy_id" --instance-id "$instance_id" --all
          source_vnics="$OCI_JSON_OUTPUT"
          source_vnic_id="$(printf '%s' "$source_vnics" | EXPECTED_INSTANCE_ID="$instance_id" python -c 'import json,os,sys; data=json.load(sys.stdin).get("data"); assert isinstance(data,list) and all(isinstance(x,dict) for x in data); allowed={"ATTACHING","ATTACHED","DETACHING","DETACHED"}; assert all(x.get("instance-id")==os.environ["EXPECTED_INSTANCE_ID"] and isinstance(x.get("lifecycle-state"),str) and x["lifecycle-state"] in allowed for x in data); xs=[x.get("vnic-id") for x in data if x["lifecycle-state"]=="ATTACHED"]; assert len(xs)==1 and isinstance(xs[0],str) and xs[0]; print(xs[0])')"
          oci_json_request oci network vnic get --vnic-id "$source_vnic_id"
          source_vnic_json="$OCI_JSON_OUTPUT"
          source_public_ip="$(printf '%s' "$source_vnic_json" | EXPECTED_VNIC_ID="$source_vnic_id" python -c 'import ipaddress,json,os,sys; d=json.load(sys.stdin).get("data"); assert isinstance(d,dict) and d.get("id")==os.environ["EXPECTED_VNIC_ID"]; ip=d.get("public-ip"); assert isinstance(ip,str) and ipaddress.ip_address(ip).version==4; print(ip)')"
          [[ "$source_public_ip" == "$ORACLE_HOST" ]] || exit 34
          shape="$(printf '%s' "$instance_json" | python -c 'import json,sys; print(json.load(sys.stdin)["data"]["shape"])')"
          shape_config="$(printf '%s' "$instance_json" | python -c 'import json,sys; d=json.load(sys.stdin)["data"].get("shape-config") or {}; print(json.dumps({"ocpus":d.get("ocpus"),"memoryInGBs":d.get("memory-in-gbs")},separators=(",",":")))')"
          boot_tag="$(printf '%s' "$boot_id" | sha256sum | cut -c1-16)"
          backup_prefix="issue-881-root-recovery-${boot_tag}"
          operation_run_prefix="${backup_prefix}-run-"
          run_prefix="${operation_run_prefix}${GITHUB_RUN_ID}"
          prior_prefix="$operation_run_prefix"
          stamp="${run_prefix}-a${GITHUB_RUN_ATTEMPT}"
          backup_name="${backup_prefix}-${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          cleanup_only=0
          target_prior_stamp=""
          failed_run_backup_name=""
          if [[ "$OWNER_COMMAND" == "$CLEANUP_ONLY_COMMAND" ]]; then
            cleanup_only=1
            target_prior_stamp="${operation_run_prefix}33914733788-a1"
            failed_run_backup_name="${backup_prefix}-33914733788-a1"
          fi
          backup_id="" restored_id="" drill_instance_id="" drill_public_ip="" drill_started=""
          backup_attempted=0 backup_created_by_run=0 backup_accepted=0
          drill_vcn_id="" drill_ig_id="" drill_route_id="" drill_security_id="" drill_subnet_id=""
          restored_attempted=0 drill_instance_attempted=0 drill_vcn_attempted=0 drill_ig_attempted=0
          drill_route_attempted=0 drill_security_attempted=0 drill_subnet_attempted=0
          receipt_state="$RUNNER_TEMP/issue-881-step4-state.json"
          state_set() {
            STATE_PATH="$receipt_state" STATE_KEY="$1" STATE_VALUE="$2" python - <<'PY'
          import json, os
          from pathlib import Path

          path = Path(os.environ['STATE_PATH'])
          data = json.loads(path.read_text()) if path.exists() else {}
          data[os.environ['STATE_KEY']] = os.environ['STATE_VALUE']
          temporary = path.with_suffix('.tmp')
          temporary.write_text(json.dumps(data, sort_keys=True))
          temporary.replace(path)
          PY
          }
          mark_phase() {
            phase="$1"
            state_set phase "$1"
          }
          state_set run_stamp "$stamp"
          state_set backup_name "$backup_name"
          state_set source_instance_id "$instance_id"
          state_set source_boot_id "$boot_id"
          state_set cleanup_only "$cleanup_only"
          state_set target_prior_stamp "${target_prior_stamp:-none}"
          state_set prior_cleanup_status NOT_STARTED
          state_set current_cleanup_status NOT_STARTED
          state_set backup_selection_status NOT_STARTED
          state_set backup_selection_failure_rc none
          state_set backup_candidate_count 0
          state_set backup_candidate_ids none
          state_set backup_ineligible_candidate_ids none
          state_set backup_blocking_candidate_ids none
          state_set backup_wait_status NOT_STARTED
          state_set backup_wait_failure_rc none
          mark_phase initialized
          discover_named_id() {
            local resource="$1" expected="$2" max_seconds="${3:-90}" budget_deadline="${4:-$primary_deadline}" output id deadline remaining request_timeout sleep_seconds rc discovery_key saw_timeout=0
            local -a command
            discovery_key="${resource//-/_}"
            max_seconds="$(bounded_wait_seconds "$max_seconds" "$budget_deadline")" || return 42
            deadline=$((SECONDS + max_seconds))
            while (( SECONDS < deadline )); do
              case "$resource" in
                backup) command=(oci bv boot-volume-backup list --compartment-id "$tenancy_id" --boot-volume-id "$boot_id" --all) ;;
                boot-volume) command=(oci bv boot-volume list --compartment-id "$tenancy_id" --availability-domain "$ad" --all) ;;
                instance) command=(oci compute instance list --compartment-id "$tenancy_id" --display-name "$expected" --all) ;;
                vcn) command=(oci network vcn list --compartment-id "$tenancy_id" --all) ;;
                internet-gateway) command=(oci network internet-gateway list --compartment-id "$tenancy_id" --vcn-id "$drill_vcn_id" --all) ;;
                route-table) command=(oci network route-table list --compartment-id "$tenancy_id" --vcn-id "$drill_vcn_id" --all) ;;
                security-list) command=(oci network security-list list --compartment-id "$tenancy_id" --vcn-id "$drill_vcn_id" --all) ;;
                subnet) command=(oci network subnet list --compartment-id "$tenancy_id" --vcn-id "$drill_vcn_id" --all) ;;
                *) return 2 ;;
              esac
              remaining=$((deadline - SECONDS))
              request_timeout=$((remaining < 20 ? remaining : 20))
              (( request_timeout > 0 )) || break
              if OCI_JSON_ABSOLUTE_DEADLINE="$budget_deadline" OCI_JSON_MAX_ATTEMPTS=1 OCI_JSON_REQUEST_TIMEOUT_SECONDS="$request_timeout" \
                  oci_json_request "${command[@]}"; then
                :
              else
                rc=$?
                state_set last_discovery_resource "$discovery_key"
                state_set last_discovery_failure_rc "$rc"
                if [[ "$rc" == 124 || "$rc" == 137 ]]; then
                  saw_timeout=1
                  state_set last_discovery_status REQUEST_TIMEOUT_RETRY
                  remaining=$((deadline - SECONDS))
                  (( remaining > 0 )) || break
                  sleep_seconds=$((remaining < 1 ? remaining : 1))
                  (( sleep_seconds > 0 )) && sleep "$sleep_seconds"
                  continue
                fi
                state_set last_discovery_status REQUEST_FAILED
                return "$rc"
              fi
              output="$OCI_JSON_OUTPUT"
              if id="$(RESOURCE_KIND="$resource" EXPECTED_DISPLAY_NAME="$expected" python -c 'import json,os,sys; payload=json.load(sys.stdin); data=payload.get("data"); assert isinstance(data,list) and all(isinstance(x,dict) for x in data); allowed={"backup":{"REQUEST_RECEIVED","CREATING","AVAILABLE","TERMINATING","TERMINATED","FAULTY"},"boot-volume":{"PROVISIONING","RESTORING","AVAILABLE","TERMINATING","TERMINATED","FAULTY"},"instance":{"PROVISIONING","STARTING","RUNNING","STOPPING","STOPPED","TERMINATING","TERMINATED"},"vcn":{"PROVISIONING","AVAILABLE","TERMINATING","TERMINATED"},"internet-gateway":{"PROVISIONING","AVAILABLE","TERMINATING","TERMINATED"},"route-table":{"PROVISIONING","AVAILABLE","TERMINATING","TERMINATED"},"security-list":{"PROVISIONING","AVAILABLE","TERMINATING","TERMINATED"},"subnet":{"PROVISIONING","AVAILABLE","TERMINATING","TERMINATED"}}[os.environ["RESOURCE_KIND"]]; matches=[x for x in data if x.get("display-name")==os.environ["EXPECTED_DISPLAY_NAME"]]; assert all(isinstance(x.get("id"),str) and x["id"] and isinstance(x.get("lifecycle-state"),str) and x["lifecycle-state"] in allowed for x in matches); xs=[x["id"] for x in matches if x["lifecycle-state"]!="TERMINATED"]; assert len(xs)<=1; print(xs[0] if xs else "")' <<<"$output")"; then
                :
              else
                state_set last_discovery_resource "$discovery_key"
                state_set last_discovery_status INVALID_RESPONSE
                state_set last_discovery_failure_rc 45
                return 45
              fi
              if [[ -n "$id" ]]; then
                state_set last_discovery_resource "$discovery_key"
                state_set last_discovery_status FOUND_EXACT_ONE
                state_set last_discovery_failure_rc none
                printf '%s\n' "$id"
                return 0
              fi
              remaining=$((deadline - SECONDS))
              (( remaining > 0 )) || break
              sleep_seconds=$((remaining < 5 ? remaining : 5))
              sleep "$sleep_seconds"
            done
            # Empty exact-name inventory after the full consistency window is
            # not proof that an uncertain create did not commit remotely.
            state_set last_discovery_resource "$discovery_key"
            if (( saw_timeout == 1 )); then
              state_set last_discovery_status REQUEST_TIMEOUT_EXHAUSTED
              state_set last_discovery_failure_rc 42
              return 42
            fi
            state_set last_discovery_status NOT_FOUND_UNPROVEN
            state_set last_discovery_failure_rc 3
            return 3
          }
          wait_absent() {
            local resource="$1" id="$2" max_seconds="${3:-300}" budget_deadline="${4:-$cleanup_deadline}" output state rc deadline remaining request_timeout sleep_seconds
            local -a command
            max_seconds="$(bounded_wait_seconds "$max_seconds" "$budget_deadline")" || return 42
            deadline=$((SECONDS + max_seconds))
            while (( SECONDS < deadline )); do
              case "$resource" in
                instance) command=(oci compute instance get --instance-id "$id") ;;
                boot-volume) command=(oci bv boot-volume get --boot-volume-id "$id") ;;
                backup) command=(oci bv boot-volume-backup get --boot-volume-backup-id "$id") ;;
                subnet) command=(oci network subnet get --subnet-id "$id") ;;
                security-list) command=(oci network security-list get --security-list-id "$id") ;;
                route-table) command=(oci network route-table get --rt-id "$id") ;;
                internet-gateway) command=(oci network internet-gateway get --ig-id "$id") ;;
                vcn) command=(oci network vcn get --vcn-id "$id") ;;
                *) return 2 ;;
              esac
              remaining=$((deadline - SECONDS))
              request_timeout=$((remaining < 20 ? remaining : 20))
              (( request_timeout > 0 )) || break
              if OCI_JSON_ABSOLUTE_DEADLINE="$budget_deadline" OCI_JSON_MAX_ATTEMPTS=1 OCI_JSON_REQUEST_TIMEOUT_SECONDS="$request_timeout" \
