name: Bridge Video r25.13 full production-data candidate

on:
  push:
    branches: [main]
    paths:
      - 'candidate_requests/2026-08-18-logic-bridge-r25-13-full-retry2.txt'

permissions:
  contents: read

concurrency:
  group: bridge-video-heavy
  cancel-in-progress: true

jobs:
  full-candidate:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      PYTHONUNBUFFERED: "1"
      WHISPER_MODEL: medium
      BRIDGE_REQUESTED_ALGORITHM_REVISION: "3.1-free-r25.13-checkpoint"
      BRIDGE_JOB_ID: "86e814014cabee88785a53340ab85666"
      BRIDGE_SOURCE_DRIVE_ID: "1rGX92YskXRtXHc53lyj9JMU3g24H5vCI"
      BRIDGE_ASR_DIAGNOSTIC_RECEIPT_ID: "1aw5OSpDP48DsNX--WuOdDl8uhf893Taa"
      BRIDGE_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      BRIDGE_RUNNER_LABEL: "ubuntu-24.04"
      BRIDGE_LARGER_RUNNER: "false"
      BRIDGE_PAID_CLOUD: "false"
      BRIDGE_BILLING_FALLBACK: "false"
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Verify immutable request
        run: |
          set -euo pipefail
          grep -Fx 'JOB_ID=86e814014cabee88785a53340ab85666' candidate_requests/2026-08-18-logic-bridge-r25-13-full-retry2.txt
          grep -Fx 'REVISION=3.1-free-r25.13-checkpoint' candidate_requests/2026-08-18-logic-bridge-r25-13-full-retry2.txt
          grep -Fx 'SOURCE_DRIVE_ID=1rGX92YskXRtXHc53lyj9JMU3g24H5vCI' candidate_requests/2026-08-18-logic-bridge-r25-13-full-retry2.txt
          grep -Fx 'ASR_DIAGNOSTIC_RECEIPT_ID=1aw5OSpDP48DsNX--WuOdDl8uhf893Taa' candidate_requests/2026-08-18-logic-bridge-r25-13-full-retry2.txt
      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install free candidate runtime
        timeout-minutes: 20
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sudo env DEBIAN_FRONTEND=noninteractive timeout 180s apt-get update -qq \
              && sudo env DEBIAN_FRONTEND=noninteractive timeout 180s apt-get install -y -qq ffmpeg fonts-dejavu-core; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "APT_RUNTIME_INSTALL_FAILED_AFTER_RETRIES" >&2
              exit 1
            fi
            sleep "$((attempt * 10))"
          done
          python -m pip install --disable-pip-version-check --timeout 60 --retries 8 -r requirements-worker.txt
          python -m pip install --disable-pip-version-check --timeout 60 --retries 8 'requests==2.34.2' 'google-auth==2.56.3' 'pymupdf==1.28.2' 'psycopg[binary]==3.3.4' 'numpy==2.2.6'
      - name: Access, database, and independent gate preflight
        env:
          GOOGLE_DRIVE_OAUTH_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_JSON }}
          BRIDGE_WORKER_DATABASE_URL: ${{ secrets.BRIDGE_WORKER_DATABASE_URL }}
        run: |
          set -euo pipefail
          python database/runtime_worker_preflight.py
          python - <<'PY'
          import bridge_runtime_hardening_r25_13_checkpoint as candidate
          from run_drive_3_1_free_oidc import drive_token
          assert drive_token()
          approved = candidate.independently_approved_no_speech_blocks(
              "86e814014cabee88785a53340ab85666",
              "1rGX92YskXRtXHc53lyj9JMU3g24H5vCI",
          )
          assert approved == {11}, approved
          print("INDEPENDENT_BLOCK_11_GATE: PASS")
          PY
      - name: FREE-GUARD
        run: python bridge_worker_3_1_free.py
      - name: Process r25.13 full candidate with block 11 checkpoint
        env:
          GOOGLE_DRIVE_OAUTH_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_JSON }}
          BRIDGE_WORKER_DATABASE_URL: ${{ secrets.BRIDGE_WORKER_DATABASE_URL }}
        run: |
          python - <<'PY'
          from run_drive_3_1_free_oidc import drive_token
          import bridge_runtime_hardening_r25_13_checkpoint as candidate
          candidate.run(drive_token)
          PY
      - name: Persist candidate to staging
        env:
          GOOGLE_DRIVE_OAUTH_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_JSON }}
          BRIDGE_WORKER_DATABASE_URL: ${{ secrets.BRIDGE_WORKER_DATABASE_URL }}
        run: |
          python - <<'PY'
          import json
          from run_drive_3_1_free_oidc import user_oauth_token
          from bridge_neon_persistence import persist_completed_drive_job
          result = persist_completed_drive_job(user_oauth_token())
          if not result or not result.get("persisted"):
              raise SystemExit("R25_13_CANDIDATE_PERSISTENCE_FAILED")
          print(json.dumps(result, sort_keys=True))
          PY
      - name: Verify staging remains blocked
        env:
          BRIDGE_WORKER_DATABASE_URL: ${{ secrets.BRIDGE_WORKER_DATABASE_URL }}
        run: |
          python - <<'PY'
          import os, psycopg
          from database.runtime_worker_preflight import normalize_dsn
          sql = """
          SELECT run_status,technical_record_status,quality_confirmation_status,
                 publication_authorization_status,checkpoint->>'report_drive_id'
            FROM analysis_run
           WHERE algorithm_version='3.1-free-r25.13-checkpoint'
             AND parameters_snapshot->>'job_id'='86e814014cabee88785a53340ab85666'
             AND checkpoint->>'report_drive_id' IS NOT NULL
           ORDER BY started_at DESC LIMIT 1
          """
          with psycopg.connect(normalize_dsn(os.environ['BRIDGE_WORKER_DATABASE_URL'])) as connection:
              with connection.cursor() as cursor:
                  cursor.execute(sql)
                  row = cursor.fetchone()
          assert row and row[:4] == ('running','recorded','pending','blocked'), row
          assert row[4]
          print("R25_13_STAGING_BLOCKED: PASS")
          PY

