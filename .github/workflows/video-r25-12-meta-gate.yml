name: Bridge Video r25.12 META Evidence Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'bridge_runtime_hardening_r25_12_meta.py'
      - 'database/**'
      - 'tests/fixtures/asr_block_11_r25_11.json'
      - 'tests/test_meta_asr_gate_r25_12.py'
      - '.github/workflows/video-r25-12-meta-gate.yml'
  push:
    branches:
      - agent/video-meta-evidence-r25-12

permissions:
  contents: read

jobs:
  candidate-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install regression runtime
        run: python -m pip install --disable-pip-version-check -r requirements-worker.txt
      - name: Verify candidate and inherited evidence contracts
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/test_meta_asr_gate_r25_12.py
          PYTHONPATH=. python tests/test_asr_policy_r25_6.py
          PYTHONPATH=. python tests/test_unreliable_asr_isolation_r25_4.py
          PYTHONPATH=. python tests/test_pdf_presentation_r25_6.py
          PYTHONPATH=. python tests/test_content_persistence_r25_10.py
          PYTHONPATH=. python -m unittest tests.test_diana_longitudinal_postprocess tests.test_diana_longitudinal_quality_v2 -v
          python -m py_compile \
            bridge_runtime_hardening_r25_12_meta.py \
            database/video_result_persistence.py
      - name: Verify candidate preserves the live production baseline
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED_FILES="$(git diff --name-only HEAD^1 HEAD)"
            META_CANDIDATE_CHANGED=false
            if printf '%s\n' "$CHANGED_FILES" | grep -Eq \
              '^(bridge_runtime_hardening_r25_12_meta\.py|tests/fixtures/asr_block_11_r25_11\.json|tests/test_meta_asr_gate_r25_12\.py)$'; then
              META_CANDIDATE_CHANGED=true
            fi
            if [ "$META_CANDIDATE_CHANGED" = "true" ] && \
               printf '%s\n' "$CHANGED_FILES" | grep -Eq \
                 '^(\.github/workflows/bridge-video-3\.1-free\.yml|run_drive_3_1_free_generic\.py)$'; then
              echo 'META implementation/test candidate must not modify the production workflow/runtime adapter.' >&2
              exit 1
            fi
          fi
          python - <<'PY'
          import hashlib
          from pathlib import Path
          import re

          workflow = Path('.github/workflows/bridge-video-3.1-free.yml').read_text(encoding='utf-8')

          match = re.search(
              r'BRIDGE_REQUESTED_ALGORITHM_REVISION:\s*["\']3\.1-free-r([0-9]+(?:\.[0-9]+)*)["\']',
              workflow,
          )
          if not match:
              raise SystemExit('production algorithm revision is missing or malformed')
          requested_revision = f"3.1-free-r{match.group(1)}"

          contracts = {
              '3.1-free-r26.1': {
                  'runtime_module': 'bridge_runtime_hardening_r26',
                  'adapter_sha256': 'c105673f51596db3a7c77fbd0e6e6cc7ab595ffa8b468bfa05a33c7895ce74cf',
                  'runtime_sha256': 'ae5b8750efd7029d0d926bdcc0121b7a0ba051baca40b2ecf59ac445db9afe9c',
              },
          }
          contract = contracts.get(requested_revision)
          if contract is None:
              raise SystemExit(f'production revision lacks an exact evidence contract: {requested_revision}')

          adapter_path = Path('run_drive_3_1_free_generic.py')
          adapter_bytes = adapter_path.read_bytes()
          adapter_sha256 = hashlib.sha256(adapter_bytes).hexdigest()
          if adapter_sha256 != contract['adapter_sha256']:
              raise SystemExit(f'production adapter drift: {adapter_sha256}')
          adapter = adapter_bytes.decode('utf-8')
          runtime_module = contract['runtime_module']
          if adapter.count(f'import {runtime_module} as hardening') != 1:
              raise SystemExit('production adapter runtime import does not match the exact contract')

          runtime_path = Path(f'{runtime_module}.py')
          if not runtime_path.is_file():
              raise SystemExit(f'production runtime module is missing: {runtime_module}')
          runtime_bytes = runtime_path.read_bytes()
          runtime_sha256 = hashlib.sha256(runtime_bytes).hexdigest()
          if runtime_sha256 != contract['runtime_sha256']:
              raise SystemExit(f'production runtime drift: {runtime_sha256}')
          runtime = runtime_bytes.decode('utf-8')
          if runtime.count(f'REVISION = "{requested_revision}"') != 1:
              raise SystemExit('production runtime revision does not match the exact contract')
          print(
              'Production baseline preserved and internally consistent: '
              f'{requested_revision} via {runtime_module}'
          )
          PY
