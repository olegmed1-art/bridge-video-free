name: Start one-time RDC authorization on Light only

on:
  push:
    branches: [ops/rdc-light-enroll-20260910]
    paths: ['.github/workflows/rdc-light-enroll-20260910.yml']

permissions:
  contents: read

concurrency:
  group: oracle-light-rdc-enrollment
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OCI_CLI_CONFIG: ${{ secrets.OCI_CLI_CONFIG }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      LIGHT_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_LIGHT_SSH_PRIVATE_KEY }}
      LIGHT_INSTANCE_ID: ocid1.instance.oc1.eu-frankfurt-1.antheljtruoejaicnbolm4whz6iex5lduf4gvk42jaj5maselesau66vvxpq
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Configure bounded clients
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${LIGHT_SSH_PRIVATE_KEY:-}"
          python -m pip install --disable-pip-version-check --quiet 'oci-cli==3.90.3'
          umask 077
          mkdir -p "$HOME/.oci"
          if [[ "$OCI_CLI_KEY_CONTENT" == base64:* ]]; then
            printf '%s' "${OCI_CLI_KEY_CONTENT#base64:}" | base64 --decode > "$HOME/.oci/key.pem"
          else
            printf '%s\n' "$OCI_CLI_KEY_CONTENT" > "$HOME/.oci/key.pem"
          fi
          printf '%s\n' "$OCI_CLI_CONFIG" > "$HOME/.oci/config"
          openssl pkey -in "$HOME/.oci/key.pem" -traditional -out "$HOME/.oci/key-pkcs1.pem"
          mv "$HOME/.oci/key-pkcs1.pem" "$HOME/.oci/key.pem"
          fingerprint="$(openssl pkey -in "$HOME/.oci/key.pem" -pubout -outform DER | openssl md5 -r | awk '{print $1}' | sed 's/../&:/g;s/:$//')"
          export OCI_DERIVED_FINGERPRINT="$fingerprint"
          python - <<'PY'
          import os
          from pathlib import Path
          p=Path.home()/'.oci/config'; lines=[]; key=region=fp=False
          for line in p.read_text().splitlines():
              s=line.strip()
              if s.startswith('key_file='): lines.append('key_file='+str(Path.home()/'.oci'/'key.pem')); key=True
              elif s.startswith('region='): lines.append('region=eu-frankfurt-1'); region=True
              elif s.startswith('fingerprint='): lines.append(f'fingerprint={os.environ["OCI_DERIVED_FINGERPRINT"]}'); fp=True
              else: lines.append(line)
          if not key: lines.append('key_file='+str(Path.home()/'.oci'/'key.pem'))
          if not region: lines.append('region=eu-frankfurt-1')
          if not fp: lines.append(f'fingerprint={os.environ["OCI_DERIVED_FINGERPRINT"]}')
          p.write_text('\n'.join(lines)+'\n')
          PY
          printf '%s\n' "$LIGHT_SSH_PRIVATE_KEY" | tr -d '\r' > "$RUNNER_TEMP/light_key"
          chmod 600 "$RUNNER_TEMP/light_key"
          ssh-keygen -y -f "$RUNNER_TEMP/light_key" > "$RUNNER_TEMP/light_key.pub"
          echo 'LIGHT_PRIVATE_KEY_PARSE=PASS'

      - name: Match key to exact Light metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          oci compute instance get --instance-id "$LIGHT_INSTANCE_ID" > "$RUNNER_TEMP/light.json"
          oci compute instance list-vnics --instance-id "$LIGHT_INSTANCE_ID" --all > "$RUNNER_TEMP/light-vnics.json"
          python - "$RUNNER_TEMP/light.json" "$RUNNER_TEMP/light_key.pub" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))['data']
          assert x['display-name']=='bridge-school-autopilot-lite'
          assert x['shape']=='VM.Standard.A1.Flex'
          assert x['lifecycle-state']=='RUNNING'
          supplied=open(sys.argv[2]).read().split()[1]
          configured=x.get('metadata',{}).get('ssh_authorized_keys','').split()
          configured_blobs={configured[i+1] for i,v in enumerate(configured[:-1]) if v.startswith('ssh-')}
          assert supplied in configured_blobs, 'SUPPLIED_KEY_DOES_NOT_MATCH_LIGHT_METADATA'
          print('LIGHT_KEY_METADATA_MATCH=PASS')
          PY
          light_ip="$(python - "$RUNNER_TEMP/light-vnics.json" <<'PY'
          import json,sys
          rows=[x for x in json.load(open(sys.argv[1]))['data'] if x.get('is-primary')]
          assert len(rows)==1 and rows[0].get('public-ip')
          print(rows[0]['public-ip'])
          PY
          )"
          echo "LIGHT_IP=$light_ip" >> "$GITHUB_ENV"

      - name: Start existing Light RDC and return encrypted user code
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          printf '%s\n' '-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAsYRx9fjmsdhE/Refml8i\n64FZxT5LzoAFz9exnBiLQ+juze6qD5ZopzZYHYGVt2gvhepJOFedF5KX7ywW1ChH\nvLQHix4g+kIBSToENb8AzrMLg03K0STLrW49/zoG7kDJHM55vYS7Hq5cOfs45r0f\nNT9ANL73K+bhwkSOVd0agFoi//iQR5R1UQmMISlkYMji23YHwOmqk4q9T203k5J3\nTClnvuu9R7mddhXFOR9NZZvq4LjfmAlec5TzEgg04/yGZVaeVilFC4+t34QmbD5c\nMVVzrYDbnQvBtRCrBBH+TImVpE2/lC4CbWGzAqShk2PnNkQWtgPWVZipl1QTmH4z\ngQIDAQAB\n-----END PUBLIC KEY-----' | sed 's/\\n/\n/g' > "$RUNNER_TEMP/response.pub"
          printf '%s %s\n' "$LIGHT_IP" 'ssh-rsa ' > "$RUNNER_TEMP/light-known-hosts"
          opts=(-i "$RUNNER_TEMP/light_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/light-known-hosts" -o ConnectTimeout=15)
          ssh "${opts[@]}" "ubuntu@$LIGHT_IP" 'sudo -n bash -s' > "$RUNNER_TEMP/response.txt" <<'REMOTE'
          set -Eeuo pipefail
          test "$(hostname)" = autopilot-lite-vnic || test "$(hostname)" = bridge-school-autopilot-lite
          since="$(date -u '+%Y-%m-%d %H:%M:%S')"
          systemctl start remote-desktop-commander.service
          for attempt in $(seq 1 12); do
            logs="$(journalctl -u remote-desktop-commander.service --since "$since" --no-pager -o cat)"
            code="$(printf '%s\n' "$logs" | grep -Eo '\b[A-Z0-9]{4}-[A-Z0-9]{4}\b' | tail -n 1 || true)"
            if test -n "$code"; then
              printf 'USER_CODE=%s\nISSUED_AT=%s UTC\n' "$code" "$since"
              exit 0
            fi
            if printf '%s\n' "$logs" | grep -q 'Device ready:'; then
              echo 'RDC_ALREADY_AUTHORIZED=YES'
              exit 0
            fi
            sleep 5
          done
          echo 'RDC_AUTH_CODE_NOT_FOUND'
          exit 1
          REMOTE
          openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/response.pub" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in "$RUNNER_TEMP/response.txt" -out "$RUNNER_TEMP/response.enc"
          printf 'RDC_RESPONSE_ENCRYPTED='
          base64 -w0 "$RUNNER_TEMP/response.enc"
          printf '\nLIGHT_RDC_START=PASS\n'
