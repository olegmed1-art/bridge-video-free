name: Issue 881 Current-Main Authoritative CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  EXACT_RUNTIME_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  current-main-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.EXACT_RUNTIME_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact head descends from live current main
        run: |
          set -euo pipefail
          [[ "$EXACT_RUNTIME_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXACT_RUNTIME_SHA"
          git fetch --no-tags origin main:refs/remotes/origin/main
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          merge_base="$(git merge-base HEAD refs/remotes/origin/main)"
          test "$merge_base" = "$main_sha"
          git merge-base --is-ancestor cfe1ed898df41dd436f7e09bafa962682730c2e1 HEAD
          git merge-base --is-ancestor 774010759f3ea1d1cae7c19fdbef6248bd89a555 HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pytest requests google-auth psycopg[binary]
      - name: Prove no-media runtime and terminal-v2 contracts
        run: |
          set -euo pipefail
          grep -Eq '^FROM python@sha256:[0-9a-f]{64}$' deploy/oracle-universal-video/Dockerfile
          python -m universal_video.precanary imports
          python -m universal_video.precanary synthetic-result-contract
          python -m pytest -q \
            tests/test_universal_video_issue_881_readiness.py \
            tests/test_universal_video_neon_queue.py \
            tests/test_universal_video_terminal_evidence_v2.py \
            tests/test_universal_video_drive_adapter.py \
            tests/test_universal_video_container_runtime.py \
            tests/test_issue_881_current_main_recovery_contract.py \
            tests/test_issue_881_entrypoint_self_test.py
          python -m compileall -q universal_video
      - name: Build and preflight exact immutable image without activation
        run: |
          set -euo pipefail
          docker build \
            --build-arg "UNIVERSAL_VIDEO_SOURCE_COMMIT=$EXACT_RUNTIME_SHA" \
            -t "issue881:$EXACT_RUNTIME_SHA" \
            -f deploy/oracle-universal-video/Dockerfile .
          image_id="$(docker image inspect --format '{{.Id}}' "issue881:$EXACT_RUNTIME_SHA")"
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "issue881:$EXACT_RUNTIME_SHA")"
          image_entrypoint="$(docker image inspect --format '{{json .Config.Entrypoint}}' "$image_id")"
          image_cmd="$(docker image inspect --format '{{json .Config.Cmd}}' "$image_id")"
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$revision" = "$EXACT_RUNTIME_SHA"
          test "$image_entrypoint" = '["/usr/bin/tini","--","/usr/local/bin/universal-video-container-entrypoint"]'
          test "$image_cmd" = '["python","-m","universal_video.spool_worker"]'

          startup_cid=""
          cleanup_startup() {
            if [[ -n "$startup_cid" ]]; then
              docker rm -f "$startup_cid" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_startup EXIT
          startup_cid="$(docker run -d \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --tmpfs /run/bridge-school:rw,noexec,nosuid,size=4m \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e "UNIVERSAL_VIDEO_SOURCE_COMMIT=$EXACT_RUNTIME_SHA" \
            -e UNIVERSAL_VIDEO_PRECANARY_STARTUP_PROBE=1 \
            -e UNIVERSAL_VIDEO_RESIDENT_ID=container \
            -e UNIVERSAL_VIDEO_SPOOL_ROOT=/tmp/issue881/spool \
            -e UNIVERSAL_VIDEO_STATUS_PATH=/run/bridge-school/precanary-startup-status.json \
            "$image_id")"
          for attempt in $(seq 1 10); do
            if [[ "$(docker inspect --format '{{.State.Running}}' "$startup_cid")" == "true" ]] \
              && docker exec "$startup_cid" test -s /run/bridge-school/precanary-startup-status.json; then
              break
            fi
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Running}}' "$startup_cid")" = "true"
          docker exec "$startup_cid" python -c 'import json, os; from pathlib import Path; data=json.loads(Path("/run/bridge-school/precanary-startup-status.json").read_text()); assert data["schema"] == "universal-video-resident-status-v2"; assert data["instance_state"] == "RUNNING"; assert data["resident_id"] == "container"; assert data["installed_runtime_commit"] == os.environ["UNIVERSAL_VIDEO_SOURCE_COMMIT"]; assert data["active_jobs"] == []'
          docker rm -f "$startup_cid" >/dev/null
          startup_cid=""
          trap - EXIT

          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --entrypoint /bin/sh "$image_id" \
            -n /usr/local/bin/universal-video-container-entrypoint
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            -e PYTHONDONTWRITEBYTECODE=1 \
            "$image_id" entrypoint-self-test | tee "$RUNNER_TEMP/issue881-entrypoint.txt"
          grep -F '"schema": "universal-video-entrypoint-self-test-v1"' "$RUNNER_TEMP/issue881-entrypoint.txt"
          grep -F '"status": "PASS"' "$RUNNER_TEMP/issue881-entrypoint.txt"
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            -e PYTHONDONTWRITEBYTECODE=1 \
            --entrypoint python "$image_id" \
            -c 'import universal_video.spool_worker'
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            -e PYTHONDONTWRITEBYTECODE=1 \
            --entrypoint python "$image_id" \
            -m universal_video.precanary imports
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            -e PYTHONDONTWRITEBYTECODE=1 \
            --entrypoint python "$image_id" \
            -m universal_video.precanary synthetic-result-contract
          printf 'runtime_sha=%s\nimmutable_image_id=%s\ndefault_entrypoint=%s\ndefault_cmd=%s\ndefault_startup_path=PASS\ncanonical_promotion_allowed=false\npublication_state=NOT_PUBLISHED\nreal_media_canary_run=false\n' \
            "$EXACT_RUNTIME_SHA" "$image_id" "$image_entrypoint" "$image_cmd" | tee "$RUNNER_TEMP/issue881-image.txt"
      - name: Recheck live current main before publishing candidate evidence
        run: |
          set -euo pipefail
          git fetch --no-tags --force origin main:refs/remotes/origin/main
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          merge_base="$(git merge-base HEAD refs/remotes/origin/main)"
          test "$merge_base" = "$main_sha"
          test "$(git rev-parse HEAD)" = "$EXACT_RUNTIME_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: issue-881-current-main-image-candidate-${{ env.EXACT_RUNTIME_SHA }}
          path: ${{ runner.temp }}/issue881-image.txt
          retention-days: 14

  database-contract:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.4-bookworm
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: issue881
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d issue881"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: issue881
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.EXACT_RUNTIME_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$EXACT_RUNTIME_SHA"
      - name: Install exact queue contract
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE bridge_school_reader NOLOGIN;
          CREATE ROLE bridge_school_app NOLOGIN;
          CREATE ROLE bridge_school_worker NOLOGIN;
          CREATE EXTENSION IF NOT EXISTS pgcrypto WITH SCHEMA public;
          CREATE TABLE schema_migration (migration_key text PRIMARY KEY);
          SQL
          psql -v ON_ERROR_STOP=1 -f database/migrations/0056_universal_video_queue.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/0057_universal_video_canary_review_gate.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/0058_universal_video_terminal_v2_gate.sql
      - name: Prove fail-closed result and zero batch release
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f database/tests/041_universal_video_queue.sql
          psql -v ON_ERROR_STOP=1 -f database/tests/042_issue_881_canary_gate.sql
          grep -F "RETURN QUERY SELECT p_outcome, v_batch_status, 0;" \
            database/migrations/0058_universal_video_terminal_v2_gate/001_apply_terminal_v2.sql
          grep -F "'released_jobs', 0" \
            database/migrations/0058_universal_video_terminal_v2_gate/001_apply_terminal_v2.sql
      - name: Prove coherent rollback and forward recovery
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f database/rollbacks/0058_universal_video_terminal_v2_gate.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/0058_universal_video_terminal_v2_gate.sql
          psql -v ON_ERROR_STOP=1 -f database/tests/042_issue_881_canary_gate.sql

  authoritative-final-pass:
    needs:
      - current-main-contract
      - database-contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.EXACT_RUNTIME_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: issue-881-current-main-image-candidate-${{ env.EXACT_RUNTIME_SHA }}
          path: ${{ runner.temp }}/candidate
      - name: Validate candidate evidence and live current main after both contracts
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/candidate/issue881-image.txt"
          grep -Fx "runtime_sha=$EXACT_RUNTIME_SHA" "$evidence"
          grep -Eq '^immutable_image_id=sha256:[0-9a-f]{64}$' "$evidence"
          grep -Fx 'default_entrypoint=["/usr/bin/tini","--","/usr/local/bin/universal-video-container-entrypoint"]' "$evidence"
          grep -Fx 'default_cmd=["python","-m","universal_video.spool_worker"]' "$evidence"
          grep -Fx 'default_startup_path=PASS' "$evidence"
          grep -Fx 'canonical_promotion_allowed=false' "$evidence"
          grep -Fx 'publication_state=NOT_PUBLISHED' "$evidence"
          grep -Fx 'real_media_canary_run=false' "$evidence"
          git fetch --no-tags --force origin main:refs/remotes/origin/main
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          merge_base="$(git merge-base HEAD refs/remotes/origin/main)"
          test "$merge_base" = "$main_sha"
          test "$(git rev-parse HEAD)" = "$EXACT_RUNTIME_SHA"
          printf 'authoritative_gate=PASS\ncurrent_main_sha=%s\n' "$main_sha" >> "$evidence"
      - uses: actions/upload-artifact@v4
        with:
          name: issue-881-current-main-authoritative-${{ env.EXACT_RUNTIME_SHA }}
          path: ${{ runner.temp }}/candidate/issue881-image.txt
          retention-days: 14
      - name: Recheck live current main after final evidence publication
        run: |
          set -euo pipefail
          git fetch --no-tags --force origin main:refs/remotes/origin/main
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          merge_base="$(git merge-base HEAD refs/remotes/origin/main)"
          test "$merge_base" = "$main_sha"
          test "$(git rev-parse HEAD)" = "$EXACT_RUNTIME_SHA"
