name: Diana Regression Status

on:
  push:
    branches: [main]
    paths:
      - 'monitor_requests/diana-regression-*.txt'

permissions:
  contents: read
  actions: read

jobs:
  status:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Resolve work folder
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_FILE="$(git show --pretty='' --name-only "$GITHUB_SHA" | grep -E '^monitor_requests/diana-regression-.*\.txt$' | head -n 1)"
          WORK_FOLDER_ID="$(sed -n 's/^WORK_FOLDER_ID=//p' "$REQUEST_FILE" | tail -n 1 | tr -d '[:space:]')"
          case "$WORK_FOLDER_ID" in *[!0-9A-Za-z_-]*) exit 2 ;; esac
          echo "WORK_FOLDER_ID=$WORK_FOLDER_ID" >> "$GITHUB_ENV"
      - run: |
          python -m pip install --disable-pip-version-check \
            'requests==2.34.2' 'google-auth==2.56.3' 'psycopg[binary]==3.3.4'
      - name: Read latest regression run and publish status
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_DRIVE_OAUTH_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_JSON }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import json, os, tempfile
          from pathlib import Path
          import requests
          import run_drive_3_1_free as io
          from run_drive_3_1_free_oidc import user_oauth_token

          base = f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}"
          headers = {
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          response = requests.get(
              base + '/actions/workflows/diana-longitudinal-regression.yml/runs',
              headers=headers,
              params={'branch': 'main', 'per_page': 10},
              timeout=60,
          )
          response.raise_for_status()
          runs = response.json().get('workflow_runs', [])
          if not runs:
              raise SystemExit('NO_DIANA_REGRESSION_RUNS')
          latest = runs[0]
          jobs_response = requests.get(
              base + f"/actions/runs/{latest['id']}/jobs",
              headers=headers,
              timeout=60,
          )
          jobs_response.raise_for_status()
          payload = {
              'status': 'DIANA_REGRESSION_STATUS',
              'observed_at': datetime.now(timezone.utc).isoformat(),
              'latest_run': {
                  'run_id': latest['id'],
                  'run_number': latest.get('run_number'),
                  'attempt': latest.get('run_attempt'),
                  'status': latest.get('status'),
                  'conclusion': latest.get('conclusion'),
                  'head_sha': latest.get('head_sha'),
                  'created_at': latest.get('created_at'),
                  'updated_at': latest.get('updated_at'),
                  'html_url': latest.get('html_url'),
              },
              'jobs': [
                  {
                      'job_id': job.get('id'),
                      'name': job.get('name'),
                      'status': job.get('status'),
                      'conclusion': job.get('conclusion'),
                      'steps': [
                          {
                              'name': step.get('name'),
                              'status': step.get('status'),
                              'conclusion': step.get('conclusion'),
                          }
                          for step in job.get('steps', [])
                      ],
                  }
                  for job in jobs_response.json().get('jobs', [])
              ],
          }
          token = user_oauth_token()
          if not token:
              raise SystemExit('Drive OAuth unavailable')
          stamp = datetime.now(timezone.utc).strftime('%Y%m%dT%H%M%SZ')
          with tempfile.TemporaryDirectory(prefix='diana-regression-status-') as td:
              path = Path(td) / f'DIANA_REGRESSION_STATUS_{stamp}.json'
              path.write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8')
              uploaded = io.upload_file(token, os.environ['WORK_FOLDER_ID'], path, 'application/json')
          print(json.dumps({'drive_id': uploaded['id'], **payload}, ensure_ascii=False))
          PY
