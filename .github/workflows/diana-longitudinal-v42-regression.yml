name: diana-longitudinal-v42-regression

on:
  pull_request:
    paths:
      - 'bridge_report_board_reconstruction.py'
      - 'diana_longitudinal_quality_v4_2.py'
      - 'diana_longitudinal_postprocess_v4_2.py'
      - 'diana_longitudinal_postprocess_v3.py'
      - 'tests/test_bridge_report_board_reconstruction.py'
      - 'tests/test_diana_longitudinal_quality_v4_2.py'
      - 'tests/test_diana_longitudinal_postprocess_v4_2.py'
      - '.github/workflows/diana-longitudinal-v42-regression.yml'

permissions:
  contents: read

jobs:
  v42-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout public technical code only
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install deterministic v4.2 dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          PyMuPDF requests google-auth google-auth-oauthlib numpy Pillow
          opencv-python-headless
      - name: Compile current semantic and board layers
        run: |
          python -m py_compile \
            bridge_report_board_reconstruction.py \
            diana_longitudinal_quality_v4.py \
            diana_longitudinal_quality_v4_1.py \
            diana_longitudinal_quality_v4_2.py \
            diana_longitudinal_postprocess_v4_2.py \
            diana_longitudinal_postprocess_v3.py
      - name: Run v4.2 regressions
        run: |
          python -m unittest \
            tests.test_bridge_report_board_reconstruction \
            tests.test_diana_longitudinal_quality_v4_1 \
            tests.test_diana_longitudinal_quality_v4_2 \
            tests.test_diana_longitudinal_postprocess_v4_1 \
            tests.test_diana_longitudinal_postprocess_v4_2 -v
      - name: Fail closed on authority and full-board inference
        run: |
          python - <<'PY'
          from diana_longitudinal_quality_v4_2 import build_quality_layer
          master={
            'job_id':'0'*32,
            'content_quality':{'semantic_qc_status':'PASS','semantic_critical_unresolved':0},
            'technical_qc':{'visual':{
              'pass1':{'status':'VISUAL_PASS_1_COMPLETE'},
              'pass2':{'status':'VISUAL_PASS_2_COMPLETE'},
            }},
            'transcript':[], 'episodes':[], 'learning_interactions':[],
            'canon_links':[], 'deals':[],
            'report_visual_board_deals':[{
              'deal_id':'visualdeal_guard',
              'board_fingerprint':'report-visual:guard',
              'hands':{'N':['AH','KH','QH','JH','TH','9H'],'E':None,'S':['AS','KS','QS','JS','TS','9S'],'W':None},
              'evidence':['frame_a'],
            }],
            'report_visual_board_reconstruction':{'method_version':'report-visual-board-v1','parser_scope':'N/S-only','qc':{'report_visual_observation_count':1,'board_cluster_count':1,'recognized_card_union_total':12}},
          }
          q=build_quality_layer(master, {'lesson_id':'test','lesson_number':0})
          assert q['method_version']=='diana-quality-v4.2'
          assert q['counts']['verified_full_boards']==0
          assert q['counts']['report_visual_partial_boards_v4_2']==1
          assert q['board_reconstruction_v4_2']['hidden_hand_complement_inference_allowed'] is False
          assert q['board_reconstruction_v4_2']['time_topic_board_number_identity_allowed'] is False
          assert q['authority']['canon_activation']=='DENY'
          assert q['authority']['curriculum_activation']=='DENY'
          assert q['authority']['student_profile_production_write']=='DENY'
          assert q['authority']['database_destination']=='STAGING_ONLY'
          assert q['incremental_processing']['heavy_video_reprocessing_required'] is False
          assert q['incremental_processing']['raw_asr_mutated'] is False
          assert q['cost_gate']['paid_ai_api_required'] is False
          assert q['cost_gate']['paid_cloud_required'] is False
          print('V42_AUTHORITY_BOARD_GUARD_PASS')
          PY

  v42-field-evidence:
    needs: v42-regression
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      BRIDGE_JOB_ID: 005ebee4db6f76823cd9058fa66d01ba
    steps:
      - name: Checkout candidate technical code only
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install semantic-only report dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          requests PyMuPDF google-auth google-auth-oauthlib numpy Pillow
          opencv-python-headless
      - name: Existing-master v4.2 Evidence Gate
        env:
          GOOGLE_DRIVE_OAUTH_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_JSON }}
        run: |
          python - <<'PY'
          import json
          import os
          from copy import deepcopy
          from pathlib import Path
          import tempfile

          import diana_longitudinal_postprocess as post
          from bridge_report_board_reconstruction import reconstruct_report_visual_deals
          from diana_longitudinal_quality_v4_2 import build_quality_layer
          from run_drive_3_1_free_oidc import user_oauth_token

          job_id=os.environ['BRIDGE_JOB_ID']
          token=user_oauth_token()
          if not token:
              raise RuntimeError('BLOCKED_ACCESS: Drive OAuth unavailable')
          _,done=post._latest_done(token,job_id)
          master,master_pdf=post._load_master(token,done)
          source_id=str((master.get('source') or {}).get('driveId') or '')
          source_before=post._drive_metadata(token,source_id)
          with tempfile.TemporaryDirectory(prefix='v42-field-') as td:
              pdf=Path(td)/'master.pdf'
              post.io.download(token,master_pdf['drive_id'],pdf)
              assert post.io.sha(pdf).lower()==master_pdf['pdf_sha256'].lower()
              reconstruction=reconstruct_report_visual_deals(pdf,master)
          working=deepcopy(master)
          working['report_visual_board_deals']=reconstruction['deals']
          working['report_visual_board_reconstruction']={
              'method_version':reconstruction['method_version'],
              'parser_scope':reconstruction['parser_scope'],
              'qc':reconstruction['qc'],
          }
          q=build_quality_layer(working,{'lesson_id':f'field-{job_id}','lesson_number':3})
          counts=q.get('counts') or {}
          assert q.get('method_version')=='diana-quality-v4.2'
          assert counts.get('report_visual_board_observations_v4_2',0)>=10
          assert counts.get('report_visual_partial_boards_v4_2',0)>=2
          assert counts.get('verified_full_boards',0)==0
          assert counts.get('partial_boards',0)>=2
          assert (q.get('board_reconstruction_v4_2') or {}).get('hidden_hand_complement_inference_allowed') is False
          assert (q.get('board_reconstruction_v4_2') or {}).get('time_topic_board_number_identity_allowed') is False
          assert counts.get('transcript_decision_window_complete_interactions_v4_1',0)>=1
          authority=q.get('authority') or {}
          assert authority.get('canon_activation')=='DENY'
          assert authority.get('curriculum_activation')=='DENY'
          assert authority.get('student_profile_production_write')=='DENY'
          assert authority.get('database_destination')=='STAGING_ONLY'
          source_after=post._drive_metadata(token,source_id)
          assert all(source_before.get(k)==source_after.get(k) for k in ('id','size','modifiedTime','parents'))
          print(json.dumps({
              'status':'V42_FIELD_VALIDATION_PASS',
              'job_id':job_id,
              'method_version':q.get('method_version'),
              'report_visual_observations':counts.get('report_visual_board_observations_v4_2'),
              'report_visual_partial_boards':counts.get('report_visual_partial_boards_v4_2'),
              'verified_full_boards':counts.get('verified_full_boards'),
              'v41_complete_interactions':counts.get('transcript_decision_window_complete_interactions_v4_1'),
              'source_untouched':True,
              'heavy_video_reprocessed':False,
              'asr_reprocessed':False,
              'paid_ai_api':0,
              'paid_cloud':0,
          },sort_keys=True))
          PY
