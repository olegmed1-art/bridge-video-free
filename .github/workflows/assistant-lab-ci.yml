name: Assistant Lab v1 CI

on:
  pull_request:
    paths:
      - 'assistant_lab/**'
      - 'bridge_school_api/assistant_lab_bootstrap.py'
      - 'app.py'
      - 'tests/test_assistant_lab_*.py'
      - '.github/workflows/assistant-lab-ci.yml'
      - 'deploy/oracle-assistant-lab/**'
      - 'ops/oracle_assistant_lab_preflight.sh'
      - 'ops/oracle_assistant_lab_install.sh'
      - 'ops/oracle_assistant_lab_observer_install.sh'
      - 'ops/oracle_assistant_lab_control_bridge_install.sh'
      - 'ops/cloud_shell_activate_assistant_lab_observer.sh'
      - 'ops/cloud_shell_activate_assistant_lab_control_bridge.sh'
      - 'ops/oracle_dds3_host_repair.sh'
      - 'ops/oracle_dds3_operational_gate.sh'
      - 'ops/dds3_local_concurrency_probe.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assistant-lab-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded test dependencies
        run: python -m pip install --disable-pip-version-check 'pytest>=8,<9' 'psycopg[binary]>=3.2,<3.3' 'psutil>=7,<8' 'fastapi>=0.116,<0.117'
      - name: Compile Assistant Lab
        run: python -m compileall -q assistant_lab
      - name: Validate Oracle scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n ops/oracle_assistant_lab_preflight.sh
          bash -n ops/oracle_assistant_lab_install.sh
          bash -n ops/oracle_assistant_lab_observer_install.sh
          bash -n ops/oracle_assistant_lab_control_bridge_install.sh
          bash -n ops/cloud_shell_activate_assistant_lab_observer.sh
          bash -n ops/cloud_shell_activate_assistant_lab_control_bridge.sh
          bash -n ops/oracle_dds3_host_repair.sh
          bash -n ops/oracle_dds3_operational_gate.sh
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("ops/oracle_dds3_operational_gate.sh")
          text = path.read_text()
          bad = [number for number, line in enumerate(text.splitlines(), 1) if line.endswith("\\\\")]
          assert not bad, f"double backslash line continuations at lines: {bad}"
          assert "--query 'data.\"lifecycle-state\"'" in text
          assert 'x.get("lifecycle-state") == "ACTIVE"' in text
          assert "--retry-all-errors" not in text
          assert "curl_json_retry" in text

          activation = Path("ops/cloud_shell_activate_assistant_lab_observer.sh").read_text()
          assert "bridge-school-dds3-frankfurt" in activation
          assert "eu-frankfurt-1" in activation
          assert "oci instance-agent command create" in activation
          assert "ASSISTANT_LAB_OBSERVER_HOST_ACTIVATION_PASS" in activation
          assert "arbitrary_shell" in activation
          assert "video_analyzer_result_access" in activation
          assert "other_oracle_result_access" in activation
          assert not re.search(r"(?m)^\s*ssh\b", activation)

          bridge = Path("ops/cloud_shell_activate_assistant_lab_control_bridge.sh").read_text()
          assert "bridge-school-dds3-frankfurt" in bridge
          assert "eu-frankfurt-1" in bridge
          assert "3fe5874699d5d5cbc2bffb324dee458bdc5b0fce" in bridge
          assert "oci instance-agent command create" in bridge
          assert "ASSISTANT_LAB_DIRECT_CONTROL_ACTIVATION_PASS" in bridge
          assert "assistant-lab-control-bridge.service" in bridge
          assert not re.search(r"(?m)^\s*ssh\b", bridge)
          PY
      - name: Run Assistant Lab contract tests
        run: python -m pytest -q tests/test_assistant_lab_contract.py tests/test_assistant_lab_bootstrap.py tests/test_assistant_lab_observer.py tests/test_assistant_lab_control_api.py tests/test_assistant_lab_control_schema.py
      - name: Guard direct Neon to DDS3 resident path
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'FROM assistant_lab.job' assistant_lab/worker.py
          grep -q '_post_json(' assistant_lab/worker.py
          grep -q 'config.dds3_url' assistant_lab/worker.py
          grep -q '127.0.0.1:8080/v1/compute' assistant_lab/worker.py
          ! grep -qE 'control_api|control_bridge' assistant_lab/worker.py
          grep -q -- '-m assistant_lab.worker' deploy/oracle-assistant-lab/assistant-lab.service
          grep -q 'Neon assistant_lab.job -> Oracle assistant-lab.service -> hot localhost DDS3' assistant_lab/DDS3_DIRECT_PATH.md
          grep -q 'DDS3 jobs MUST NOT be routed through the Assistant Lab Control API or Observer' assistant_lab/DDS3_DIRECT_PATH.md
      - name: Validate bounded DDS3 concurrency probe
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile ops/dds3_local_concurrency_probe.py
          python - <<'PY'
          from pathlib import Path
          import importlib.util
          import sys

          path = Path('ops/dds3_local_concurrency_probe.py')
          spec = importlib.util.spec_from_file_location('dds3_probe', path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          assert module.validate_url('http://127.0.0.1:8080/v1/compute').startswith('http://127.0.0.1:8080')
          try:
              module.validate_url('https://example.com/v1/compute')
          except ValueError:
              pass
          else:
              raise AssertionError('remote DDS3 probe endpoint must be rejected')
          assert module.parse_levels('1,2,4') == [1, 2, 4]
          try:
              module.parse_levels('16')
          except ValueError:
              pass
          else:
              raise AssertionError('unbounded concurrency must be rejected')
          assert module.MAX_CONCURRENCY == 8
          assert module.MAX_REQUESTS == 200
          PY
      - name: Verify bootstrap schema boundaries
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RniE 'public\.skill|ai\.system_rule|student_profile' assistant_lab/schema.sql assistant_lab/bootstrap_schema.sql assistant_lab/control_schema.sql
          ! grep -RniE 'GRANT[[:space:]]+(INSERT|DELETE).*bootstrap_ticket' assistant_lab/bootstrap_schema.sql
          ! grep -RniE 'GRANT[[:space:]]+INSERT.*control_command.*assistant_lab_worker' assistant_lab/control_schema.sql
      - name: Verify observer/control isolation contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'video_analyzer_result_consumed.*False' assistant_lab/observer.py
          grep -q 'other_oracle_tool_results_consumed.*False' assistant_lab/observer.py
          grep -q 'arbitrary_shell.*False' assistant_lab/control_api.py
          grep -q 'video_analyzer_result_access.*False' assistant_lab/control_api.py
          grep -q 'other_oracle_result_access.*False' assistant_lab/control_api.py
          grep -q 'User=assistant-lab-observer' deploy/oracle-assistant-lab/assistant-lab-observer.service
          grep -q 'User=assistant-lab-observer' deploy/oracle-assistant-lab/assistant-lab-control.service
          grep -q 'User=assistant-lab-observer' deploy/oracle-assistant-lab/assistant-lab-control-bridge.service
          grep -q -- '--host 127.0.0.1 --port 8765' deploy/oracle-assistant-lab/assistant-lab-control.service
          grep -q 'ASSISTANT_LAB_CONTROL_URL=http://127.0.0.1:8765' deploy/oracle-assistant-lab/assistant-lab-control-bridge.service
          grep -q 'NoNewPrivileges=true' deploy/oracle-assistant-lab/assistant-lab-control-bridge.service
          ! grep -q -- '--host 0.0.0.0' deploy/oracle-assistant-lab/assistant-lab-control.service
      - name: Record schema checksums
        shell: bash
        run: |
          sha256sum assistant_lab/schema.sql
          sha256sum assistant_lab/bootstrap_schema.sql
          sha256sum assistant_lab/control_schema.sql
