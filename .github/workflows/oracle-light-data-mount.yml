name: Oracle Light data disk initialization

on:
  pull_request:
    paths: ['.github/workflows/oracle-light-data-mount.yml', 'ops/oracle_light_data_mount.py']
  push:
    branches: [main]
    paths: ['.github/workflows/oracle-light-data-mount.yml', 'ops/oracle_light_data_mount.py']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-light-backup-mutation
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: python -m py_compile ops/oracle_light_data_mount.py
      - run: python ops/test_oracle_light_data_mount.py
      - name: Validate shell syntax
        run: |
          ruby -ryaml -e 'd=YAML.load_file(ARGV[0]); d.fetch("jobs").each_value { |j| j.fetch("steps").each { |s| next unless s["run"]; IO.popen(["bash", "-n"], "w") { |p| p.write(s["run"]) }; abort "invalid shell" unless $?.success? } }' .github/workflows/oracle-light-data-mount.yml

  initialize:
    needs: contract
    if: github.repository == 'olegmed1-art/bridge-video-free' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: python -m pip install --disable-pip-version-check -q oci==2.186.0
      - name: Reverify exact API attachment before disk initialization
        env:
          OCI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_KEY: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_REGION: ${{ secrets.OCI_CLI_REGION }}
        run: python ops/oci_light_data_volume_attach.py
      - name: Initialize and persistently mount the verified new data disk
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          if [[ -z "${SSH_PRIVATE_KEY:-}" ]]; then
            echo 'LIGHT_SSH_KEY=ABSENT'
            exit 1
          fi
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$work/key"
          unset SSH_PRIVATE_KEY
          if ! ssh-keygen -y -P '' -f "$work/key" > "$work/public" 2>/dev/null; then
            echo 'LIGHT_SSH_KEY=INVALID_OR_ENCRYPTED'
            exit 1
          fi
          echo 'LIGHT_SSH_KEY=VALID'
          bash ops/oracle_known_hosts_from_scan.sh 92.5.47.149 SHA256:XBR1x74uJ41BxmDF7Y9P20GjIjNbrYXqieV4c2MC0Go "$work/known_hosts"
          echo 'LIGHT_SSH_HOST=VERIFIED_AGAINST_OWNER_ACCEPTED_FINGERPRINT'
          if ! ssh -F /dev/null -i "$work/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$work/known_hosts" -o ConnectTimeout=15 -o ConnectionAttempts=1 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 ubuntu@92.5.47.149 'sudo -n /usr/bin/python3 -' < ops/oracle_light_data_mount.py > "$work/result" 2> "$work/error"; then
            cat "$work/result"
            echo 'LIGHT_DATA_MOUNT=FAILED'
            if grep -q 'Permission denied' "$work/error"; then echo 'LIGHT_SSH_FAILURE=AUTHORIZATION'; else echo 'LIGHT_SSH_FAILURE=TRANSPORT_OR_REMOTE_COMMAND'; fi
            exit 1
          fi
          cat "$work/result"
