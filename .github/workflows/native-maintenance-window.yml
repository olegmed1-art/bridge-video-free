name: Native maintenance run binding

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact reviewed main for a read-only run-binding proof
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-maintenance-window.yml'
      - 'ops/native_maintenance_run_guard.py'
      - 'tests/test_native_maintenance_run_guard.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: oracle-instance-workload-mutation
  cancel-in-progress: false
  queue: max

jobs:
  maintenance-window:
    name: native-maintenance-window
    if: >-
      github.repository == 'olegmed1-art/bridge-video-free' &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.expected_main_sha == github.sha))
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    concurrency:
      group: oracle-light-backup-mutation
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Verify actual source, actor, attempt and executing job
        env:
          GH_RUN_GUARD_TOKEN: ${{ github.token }}
        run: PYTHONPATH=. python ops/native_maintenance_run_guard.py
