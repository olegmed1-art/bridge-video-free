version: 0.1
status: IMPLEMENTED_AS_POLICY
objectives:
  critical_structured_data_rpo_minutes: 60
  critical_service_rto_minutes: 120
  backup_definition: restore_test_plus_integrity_evidence
current_baseline:
  neon_project: bridge-school-core
  neon_project_id: misty-poetry-18012774
  production_branch_id: br-wispy-lab-b1rq54of
  recovery_baseline_branch_id: br-raspy-fog-b1l6rbbv
  observed_history_retention_seconds: 21600
  production_protected_observed: false
  recovery_ready: false
recovery_states:
  - UNVERIFIED_BACKUP
  - RESTORE_TESTED
  - INTEGRITY_VERIFIED
  - RECOVERY_READY
gates:
  production_launch:
    require:
      - verified_identity_and_authorization
      - database_restore_test
      - critical_integrity_checks
      - artifact_recovery_test
      - versioned_migrations
      - documented_runbook
  destructive_change:
    require:
      - recovery_point_before_change
      - isolated_test_when_possible
      - evidence_after_change
  database_migration:
    require:
      - temporary_branch
      - schema_verification
      - regression_checks
      - explicit_promotion_workflow
checks:
  database:
    - branch_and_project_health
    - schema_integrity
    - critical_table_invariants
    - identity_evidence_link_integrity
    - retention_window_vs_policy
    - recovery_point_age
  artifacts:
    - stable_file_identity
    - provenance
    - checksum_sampling
    - reference_integrity
    - independent_copy_for_irreplaceable_sources
  code:
    - versioned_migrations
    - stable_commit_traceability
    - regression_status
    - no_secrets_in_repo
incidents:
  severity:
    P0: data_loss_or_corruption_or_identity_security_failure
    P1: critical_service_unavailable_or_recovery_uncertain
    P2: degraded_noncritical_pipeline
  actions:
    P0:
      - freeze_nonessential_writes
      - preserve_current_state
      - create_recovery_evidence
      - use_reliability_budget_override_if_material
      - restore_in_isolation_before_cutover
    P1:
      - preserve_recovery_points
      - diagnose
      - test_recovery_path
    P2:
      - retry_or_fallback
      - log_failure
      - create_regression_test_if_material
budget:
  normal_hard_limit_usd: 50
  reliability_max_overrun_percent: 50
  reliability_absolute_cap_usd: 75
  override_requires_material_reliability_gain: true
promotion:
  rule: never_label_RECOVERY_READY_without_restore_and_integrity_evidence
