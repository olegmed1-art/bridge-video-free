name: Oracle SSH key rotation finalize one-shot

on:
  push:
    branches: [codex/diana-autonomous-finalize-20260911]
    paths: ['.github/workflows/oracle-key-rotation-stage-once.yml']

permissions:
  contents: read

jobs:
  finalize:
    if: github.repository == 'olegmed1-art/bridge-video-free'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ORACLE_HOST: 158.180.47.161
      ORACLE_USER: ubuntu
      EXPECTED_HOST_FINGERPRINT: SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk
      EXPECTED_KEY_FINGERPRINT: SHA256:pJgl7Mw6K+v4IBPCaH46uaNCKh3uStnRBxcV5m85oqI
      ROTATED_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Verify new key, revoke old key, verify again
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/oracle-key-rotation"
          mkdir -p "$work"
          chmod 0700 "$work"
          key="$work/id_oracle"
          known="$work/known_hosts"
          printf '%s\n' "$ROTATED_PRIVATE_KEY" | tr -d '\r' > "$key"
          chmod 0600 "$key"
          actual_fingerprint="$(ssh-keygen -lf "$key" | cut -d' ' -f2)"
          [[ "$actual_fingerprint" == "$EXPECTED_KEY_FINGERPRINT" ]]
          ssh-keygen -y -f "$key" > "$work/new.pub"
          ops/oracle_known_hosts_from_scan.sh "$ORACLE_HOST" "$EXPECTED_HOST_FINGERPRINT" "$known"

          ssh_opts=(
            -i "$key"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$known"
            -o ConnectTimeout=15
          )

          ssh "${ssh_opts[@]}" "$ORACLE_USER@$ORACLE_HOST" \
            'test -s "$HOME/.ssh/.codex-compromised-old.pub" && echo ORACLE_NEW_KEY_AUTH_PASS'

          new_b64="$(base64 -w0 < "$work/new.pub")"
          ssh "${ssh_opts[@]}" "$ORACLE_USER@$ORACLE_HOST" \
            "NEW_PUB_B64='$new_b64' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          AUTH="$HOME/.ssh/authorized_keys" OLD_MARKER="$HOME/.ssh/.codex-compromised-old.pub" python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          auth = Path(os.environ["AUTH"])
          marker = Path(os.environ["OLD_MARKER"])
          old_pub = marker.read_text(encoding="utf-8").strip()
          new_pub = base64.b64decode(os.environ["NEW_PUB_B64"]).decode().strip()
          old_type, old_body = old_pub.split()[:2]
          new_type, new_body = new_pub.split()[:2]
          if (old_type, old_body) == (new_type, new_body):
              raise SystemExit("old and new keys unexpectedly match")
          lines = auth.read_text(encoding="utf-8").splitlines()

          def contains_key(line, key_type, key_body):
              parts = line.split()
              return any(
                  parts[i] == key_type and parts[i + 1] == key_body
                  for i in range(max(0, len(parts) - 1))
              )

          old_matches = [line for line in lines if contains_key(line, old_type, old_body)]
          new_matches = [line for line in lines if contains_key(line, new_type, new_body)]
          if len(old_matches) != 1 or len(new_matches) != 1:
              raise SystemExit(
                  f"unexpected key counts old={len(old_matches)} new={len(new_matches)}"
              )
          retained = [line for line in lines if not contains_key(line, old_type, old_body)]
          tmp = auth.with_suffix(".rotation-final")
          tmp.write_text("\n".join(retained) + "\n", encoding="utf-8")
          os.chmod(tmp, 0o600)
          os.replace(tmp, auth)
          marker.unlink()
          PY
          echo ORACLE_OLD_KEY_REVOKED
          REMOTE

          ssh "${ssh_opts[@]}" "$ORACLE_USER@$ORACLE_HOST" \
            'test ! -e "$HOME/.ssh/.codex-compromised-old.pub" && echo ORACLE_ROTATION_PASS'
