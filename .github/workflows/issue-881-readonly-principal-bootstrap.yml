name: Issue 881 read-only principal bootstrap

on:
  pull_request:
    paths:
      - '.github/workflows/issue-881-readonly-principal-bootstrap.yml'
      - 'tests/test_issue_881_readonly_principal_bootstrap.py'
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: issue-881-readonly-principal-bootstrap
  cancel-in-progress: false

jobs:
  contract:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Enforce bounded IAM bootstrap contract
        shell: bash
        run: |
          set -euo pipefail
          ruby -e "require 'yaml'; YAML.parse_file(ARGV.fetch(0))" .github/workflows/issue-881-readonly-principal-bootstrap.yml
          python - <<'PY'
          import runpy
          namespace = runpy.run_path('tests/test_issue_881_readonly_principal_bootstrap.py')
          for name, value in namespace.items():
              if name.startswith('test_') and callable(value):
                  value()
          PY

  bootstrap:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 881 &&
      github.event.comment.user.login == 'olegmed1-art' &&
      github.event.comment.body == '/oracle-ops issue-881-bootstrap-readonly-principal'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    env:
      OWNER_COMMAND: ${{ github.event.comment.body }}
      EXACT_COMMAND: /oracle-ops issue-881-bootstrap-readonly-principal
    steps:
      - name: Reserve job-wide cleanup and receipt deadline before setup
        shell: bash
        run: |
          set -euo pipefail
          now="$(date +%s)"
          job_deadline=$(( now + 1680 ))
          echo "JOB_DEADLINE_EPOCH=$job_deadline" >> "$GITHUB_ENV"
          echo "MUTATION_CUTOFF_EPOCH=$(( job_deadline - 480 ))" >> "$GITHUB_ENV"
          echo "RECEIPT_DEADLINE_EPOCH=$(( job_deadline - 360 ))" >> "$GITHUB_ENV"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Validate exact owner request before credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$OWNER_COMMAND" == "$EXACT_COMMAND" ]] || exit 23

      - name: Install pinned OCI CLI without credentials
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q 'oci-cli==3.90.3'

      - name: Create dedicated read-only OCI principal
        id: bootstrap
        env:
          OCI_USER_RAW: ${{ secrets.OCI_CLI_USER }}
          OCI_TENANCY_RAW: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_FINGERPRINT_RAW: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_KEY_RAW: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_REGION_RAW: ${{ secrets.OCI_CLI_REGION }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          for value in OCI_USER_RAW OCI_TENANCY_RAW OCI_FINGERPRINT_RAW OCI_KEY_RAW OCI_REGION_RAW; do
            [[ -n "${!value:-}" ]] || exit 21
          done
          install -d -m 0700 "$HOME/.oci"
          printf '%s' "$OCI_KEY_RAW" | python -c 'import sys; raw=sys.stdin.read().replace("\\r","").replace("\\n","\n"); open(sys.argv[1],"w").write(raw if raw.endswith("\n") else raw+"\n")' "$HOME/.oci/key.pem"
          chmod 0600 "$HOME/.oci/key.pem"
          python - <<'PY'
          import os
          from pathlib import Path

          def scalar(env, key):
              lines = [x.strip() for x in os.environ[env].replace('\r', '').splitlines() if x.strip()]
              matches = [x.split('=', 1)[1].strip() for x in lines if x.startswith(key + '=')]
              if len(matches) == 1 and matches[0]:
                  return matches[0]
              if not matches and len(lines) == 1 and '=' not in lines[0]:
                  return lines[0]
              raise SystemExit(f'ambiguous {env}')

          values = {
              'user': scalar('OCI_USER_RAW', 'user'),
              'fingerprint': scalar('OCI_FINGERPRINT_RAW', 'fingerprint'),
              'tenancy': scalar('OCI_TENANCY_RAW', 'tenancy'),
              'region': scalar('OCI_REGION_RAW', 'region'),
          }
          if values['region'] != 'eu-frankfurt-1':
              raise SystemExit('unexpected region')
          target = Path.home() / '.oci' / 'config'
          target.write_text(
              '[DEFAULT]\n'
              + ''.join(f'{key}={value}\n' for key, value in values.items())
              + f"key_file={Path.home() / '.oci' / 'key.pem'}\n",
              encoding='utf-8',
          )
          PY
          chmod 0600 "$HOME/.oci/config"
          export OCI_CLI_REGION=eu-frankfurt-1
          timeout --signal=KILL 30s oci iam region list --output json >/dev/null

          cat > "$RUNNER_TEMP/readonly-public.pem" <<'PUBLIC_KEY'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAldxBA0+SxBKYXV/aGzlN
          6wfURQhw9DNqMEQvqK/r90an6Lui9MFlH9oxPir0LvRXm/Wa/bikd9daygiuUhfD
          /h6YH7avD9mtap00I4aX4fSJkEmQiXyvdyda0+owk1TwCLNzVoDbM2E1Nzj72Hus
          KzL05j5hkZp7lyL/ouHPoz7SgZQIU13BwNq8ONavrMu2seyd0t9lL57rCZm/XpKY
          bSieCQBG9ipkozoN4qhhv+DS9vXH7XPEF6NzNcpF/xu4vGTIHZOFZZbHb82+cjRs
          UXJ8ARImbcwRNUKWL1SdJ8Q/9Hv0MYU0J0DvD/Bz9AAu0tvzTyHER3WPOaWF7OuH
          5wIDAQAB
          -----END PUBLIC KEY-----
          PUBLIC_KEY
          NAME_STAMP="issue-881-paid-preflight-readonly-${GITHUB_RUN_ID}"
          OWNERSHIP_TOKEN="$(openssl rand -hex 32)"
          USER_NAME="$NAME_STAMP"
          GROUP_NAME="$NAME_STAMP"
          POLICY_NAME="$NAME_STAMP"
          TENANCY_ID="$(python - <<'PY'
          import os
          lines = [x.strip() for x in os.environ['OCI_TENANCY_RAW'].replace('\r', '').splitlines() if x.strip()]
          matches = [x.split('=', 1)[1].strip() for x in lines if x.startswith('tenancy=')]
          print(matches[0] if len(matches) == 1 else lines[0])
          PY
          )"
          [[ "$TENANCY_ID" == ocid1.tenancy.* ]] || exit 22
          ADMIN_USER_ID="$(python - <<'PY'
          import os
          lines = [x.strip() for x in os.environ['OCI_USER_RAW'].replace('\r', '').splitlines() if x.strip()]
          matches = [x.split('=', 1)[1].strip() for x in lines if x.startswith('user=')]
          print(matches[0] if len(matches) == 1 else lines[0])
          PY
          )"
          [[ "$ADMIN_USER_ID" == ocid1.user.* ]] || exit 22

          request_json() {
            local output="$1"
            local limit=30
            local remaining
            shift
            if (( CLEANUP_DEADLINE_EPOCH > 0 )); then
              remaining=$(( CLEANUP_DEADLINE_EPOCH - $(date +%s) ))
              (( remaining > 0 )) || return 124
              (( remaining >= limit )) || limit=$remaining
            fi
            timeout --signal=KILL "${limit}s" "$@" --output json > "$output"
            python -c 'import json,sys; value=json.load(open(sys.argv[1])); assert isinstance(value,dict)' "$output"
          }
          USER_ID=
          GROUP_ID=
          POLICY_ID=
          EXPECTED_FINGERPRINT=
          USER_CREATED=0
          GROUP_CREATED=0
          MEMBERSHIP_CREATED=0
          POLICY_CREATED=0
          KEY_CREATED=0
          CLEANUP_DEADLINE_EPOCH=0
          retry_delete() {
            local attempt now remaining per_call
            for attempt in 1 2; do
              now="$(date +%s)"
              remaining=$(( CLEANUP_DEADLINE_EPOCH - now ))
              (( remaining > 0 )) || return 1
              per_call=20
              (( remaining >= per_call )) || per_call=$remaining
              if timeout --signal=KILL "${per_call}s" "$@" >/dev/null 2>&1; then
                return 0
              fi
              sleep 3
            done
            return 1
          }
          require_mutation_budget() {
            (( $(date +%s) <= MUTATION_CUTOFF_EPOCH )) || return 25
          }
          publish_success_receipt() {
            local remaining limit=30 rc attempt per_call
            remaining=$(( RECEIPT_DEADLINE_EPOCH - $(date +%s) ))
            (( remaining > 0 )) || return 26
            (( remaining >= limit )) || limit=$remaining
            if timeout --signal=KILL "${limit}s" gh api --method PATCH "/repos/$GITHUB_REPOSITORY/issues/comments/$PENDING_COMMENT_ID" --input "$RUNNER_TEMP/body.json"; then
              return 0
            else
              rc=$?
            fi
            # A lost response can hide an accepted update. Read back the exact
            # pre-created comment ID three times and commit only this run's
            # unpredictable transaction token; otherwise rollback.
            for attempt in 1 2 3; do
              remaining=$(( RECEIPT_DEADLINE_EPOCH - $(date +%s) ))
              (( remaining > 0 )) || return "$rc"
              per_call=10
              (( remaining >= per_call )) || per_call=$remaining
              if timeout --signal=KILL "${per_call}s" gh api "/repos/$GITHUB_REPOSITORY/issues/comments/$PENDING_COMMENT_ID" > "$RUNNER_TEMP/receipt-comment.json" &&
                RECEIPT_TOKEN="$RECEIPT_TOKEN" RUN_URL="$RUN_URL" python - "$RUNNER_TEMP/receipt-comment.json" <<'PY'
          import json, os, sys
          row = json.load(open(sys.argv[1], encoding='utf-8'))
          assert isinstance(row, dict)
          body = row.get('body', '')
          token = f"receipt transaction: `{os.environ['RECEIPT_TOKEN']}`"
          ok = token in body and os.environ['RUN_URL'] in body and 'status: `READY_FOR_SECRET_INSTALL`' in body
          raise SystemExit(0 if ok else 1)
          PY
              then
                return 0
              fi
              (( attempt == 3 )) || sleep 3
            done
            return "$rc"
          }
          cleanup() {
            local rc=$?
            local rollback=NOT_NEEDED
            local failed=0
            local pass
            trap - EXIT
            set +e
            if (( rc != 0 )); then
              rollback=ROLLED_BACK
              now="$(date +%s)"
              CLEANUP_DEADLINE_EPOCH=$(( now + 240 ))
              if (( CLEANUP_DEADLINE_EPOCH > JOB_DEADLINE_EPOCH - 120 )); then
                CLEANUP_DEADLINE_EPOCH=$(( JOB_DEADLINE_EPOCH - 120 ))
              fi
              # A timed-out create may have reached OCI before its response was
              # lost. Recover only objects carrying this run's secret ownership
              # token; an exact public name alone never authorizes deletion.
              for pass in 1 2 3; do
                if (( USER_CREATED == 1 )) && [[ -z "$USER_ID" ]]; then
                  request_json "$RUNNER_TEMP/rollback-users.json" oci iam user list --compartment-id "$TENANCY_ID" --all
                  USER_ID="$(select_owned_exact "$RUNNER_TEMP/rollback-users.json" "$USER_NAME" "$OWNERSHIP_TOKEN")"
                fi
                if (( GROUP_CREATED == 1 )) && [[ -z "$GROUP_ID" ]]; then
                  request_json "$RUNNER_TEMP/rollback-groups.json" oci iam group list --compartment-id "$TENANCY_ID" --all
                  GROUP_ID="$(select_owned_exact "$RUNNER_TEMP/rollback-groups.json" "$GROUP_NAME" "$OWNERSHIP_TOKEN")"
                fi
                if (( POLICY_CREATED == 1 )) && [[ -z "$POLICY_ID" ]]; then
                  request_json "$RUNNER_TEMP/rollback-policies.json" oci iam policy list --compartment-id "$TENANCY_ID" --all
                  POLICY_ID="$(select_owned_exact "$RUNNER_TEMP/rollback-policies.json" "$POLICY_NAME" "$OWNERSHIP_TOKEN")"
                fi
                [[ "$USER_CREATED:$GROUP_CREATED:$POLICY_CREATED" != *1* ]] || sleep 5
              done
              if (( KEY_CREATED == 1 )) && [[ -n "$USER_ID" && -n "$EXPECTED_FINGERPRINT" ]]; then
                retry_delete oci iam user api-key delete --user-id "$USER_ID" --fingerprint "$EXPECTED_FINGERPRINT" --force || true
              fi
              if (( MEMBERSHIP_CREATED == 1 )) && [[ -n "$GROUP_ID" && -n "$USER_ID" ]]; then
                retry_delete oci iam group remove-user --group-id "$GROUP_ID" --user-id "$USER_ID" --force || true
              fi
              if (( POLICY_CREATED == 1 )) && [[ -n "$POLICY_ID" ]]; then
                retry_delete oci iam policy delete --policy-id "$POLICY_ID" --force || true
              fi
              if (( GROUP_CREATED == 1 )) && [[ -n "$GROUP_ID" ]]; then
                retry_delete oci iam group delete --group-id "$GROUP_ID" --force || true
              fi
              if (( USER_CREATED == 1 )) && [[ -n "$USER_ID" ]]; then
                retry_delete oci iam user delete --user-id "$USER_ID" --force || true
              fi
              # Three repeated exact-stamp inventories are authoritative even
              # when a delete returned 404 or its response was lost.
              for pass in 1 2 3; do
                request_json "$RUNNER_TEMP/proof-users-$pass.json" oci iam user list --compartment-id "$TENANCY_ID" --all || failed=1
                request_json "$RUNNER_TEMP/proof-groups-$pass.json" oci iam group list --compartment-id "$TENANCY_ID" --all || failed=1
                request_json "$RUNNER_TEMP/proof-policies-$pass.json" oci iam policy list --compartment-id "$TENANCY_ID" --all || failed=1
                python - "$RUNNER_TEMP/proof-users-$pass.json" "$RUNNER_TEMP/proof-groups-$pass.json" "$RUNNER_TEMP/proof-policies-$pass.json" "$NAME_STAMP" <<'PY' || failed=1
          import json, sys
          for path in sys.argv[1:4]:
              rows = json.load(open(path, encoding='utf-8')).get('data')
              assert isinstance(rows, list)
              active = [x for x in rows if isinstance(x, dict) and x.get('name') == sys.argv[4] and x.get('lifecycle-state') != 'DELETED']
              assert not active
          PY
                (( pass == 3 )) || sleep 5
              done
              (( failed == 0 )) || rollback=ROLLBACK_INCOMPLETE
            fi
            printf '%s\n' "$rollback" > "$RUNNER_TEMP/bootstrap-rollback-status"
            rm -f "$HOME/.oci/config" "$HOME/.oci/key.pem" "$RUNNER_TEMP/readonly-public.pem" "$RUNNER_TEMP"/plain-*.txt "$RUNNER_TEMP"/encrypted-*.bin
            exit "$rc"
          }
          trap cleanup EXIT
          select_exact() {
            python - "$1" "$2" <<'PY'
          import json, sys
          rows = json.load(open(sys.argv[1], encoding='utf-8')).get('data')
          assert isinstance(rows, list) and all(isinstance(x, dict) for x in rows)
          matches = [x for x in rows if x.get('name') == sys.argv[2]]
          assert len(matches) <= 1
          if matches:
              value = matches[0].get('id')
              assert isinstance(value, str) and value.startswith('ocid1.')
              print(value)
          PY
          }
          select_owned_exact() {
            python - "$1" "$2" "$3" <<'PY'
          import json, sys
          rows = json.load(open(sys.argv[1], encoding='utf-8')).get('data')
          assert isinstance(rows, list) and all(isinstance(x, dict) for x in rows)
          marker = f'ownership:{sys.argv[3]}'
          matches = [x for x in rows if x.get('name') == sys.argv[2] and marker in x.get('description', '')]
          assert len(matches) <= 1
          if matches:
              value = matches[0].get('id')
              assert isinstance(value, str) and value.startswith('ocid1.')
              print(value)
          PY
          }

          python - "$GROUP_NAME" <<'PY' > "$RUNNER_TEMP/statements.json"
          import json, sys
          group = sys.argv[1]
          print(json.dumps([
              f'Allow group {group} to inspect compartments in tenancy',
              f'Allow group {group} to inspect instance-family in tenancy',
              f'Allow group {group} to read limits in tenancy',
          ]))
          PY
          request_json "$RUNNER_TEMP/users.json" oci iam user list --compartment-id "$TENANCY_ID" --all
          request_json "$RUNNER_TEMP/groups.json" oci iam group list --compartment-id "$TENANCY_ID" --all
          request_json "$RUNNER_TEMP/policies.json" oci iam policy list --compartment-id "$TENANCY_ID" --all
          request_json "$RUNNER_TEMP/admin-user.json" oci iam user get --user-id "$ADMIN_USER_ID"
          PRIMARY_EMAIL="$(python -c 'import json,sys; x=json.load(open(sys.argv[1]))["data"].get("email"); assert isinstance(x,str) and 3 <= len(x) <= 254 and "@" in x and "\n" not in x and "\r" not in x; print(x)' "$RUNNER_TEMP/admin-user.json")"
          EXISTING_USER_ID="$(select_exact "$RUNNER_TEMP/users.json" "$USER_NAME")"
          EXISTING_GROUP_ID="$(select_exact "$RUNNER_TEMP/groups.json" "$GROUP_NAME")"
          EXISTING_POLICY_ID="$(select_exact "$RUNNER_TEMP/policies.json" "$POLICY_NAME")"
          # Never inherit additive permissions from a reused user or group.
          [[ -z "$EXISTING_USER_ID" && -z "$EXISTING_GROUP_ID" && -z "$EXISTING_POLICY_ID" ]] || exit 24

          # Establish an exact receipt identity before any IAM mutation. A lost
          # create response can leave only a harmless PENDING comment, never a
          # false READY receipt for rolled-back credentials.
          RECEIPT_TOKEN="$(openssl rand -hex 32)"
          {
            echo '## Issue #881 read-only OCI principal bootstrap'
            echo
            echo '- status: `PENDING_IAM_BOOTSTRAP`'
            echo "- receipt transaction: \`$RECEIPT_TOKEN\`"
            echo "- run: $RUN_URL"
          } > "$RUNNER_TEMP/pending-body.md"
          python - "$RUNNER_TEMP/pending-body.md" "$RUNNER_TEMP/pending-body.json" <<'PY'
          import json, sys
          body = open(sys.argv[1], encoding='utf-8').read()
          json.dump({'body': body}, open(sys.argv[2], 'w', encoding='utf-8'))
          PY
          require_mutation_budget
          timeout --signal=KILL 30s gh api --method POST "/repos/$GITHUB_REPOSITORY/issues/881/comments" --input "$RUNNER_TEMP/pending-body.json" > "$RUNNER_TEMP/pending-comment.json"
          PENDING_COMMENT_ID="$(python -c 'import json,sys; x=json.load(open(sys.argv[1]))["id"]; assert isinstance(x,int) and x > 0; print(x)' "$RUNNER_TEMP/pending-comment.json")"
          echo "pending_comment_id=$PENDING_COMMENT_ID" >> "$GITHUB_OUTPUT"

          EXPECTED_FINGERPRINT="$(openssl rsa -pubin -in "$RUNNER_TEMP/readonly-public.pem" -outform DER 2>/dev/null | openssl md5 -c | awk '{print $2}')"
          require_mutation_budget
          USER_CREATED=1
          request_json "$RUNNER_TEMP/user-create.json" oci iam user create --compartment-id "$TENANCY_ID" --name "$USER_NAME" --email "$PRIMARY_EMAIL" --description "Issue 881 paid preflight read-only audit principal ownership:$OWNERSHIP_TOKEN"
          USER_ID="$(python -c 'import json,sys; x=json.load(open(sys.argv[1]))["data"]["id"]; assert x.startswith("ocid1.user."); print(x)' "$RUNNER_TEMP/user-create.json")"
          require_mutation_budget
          GROUP_CREATED=1
          request_json "$RUNNER_TEMP/group-create.json" oci iam group create --compartment-id "$TENANCY_ID" --name "$GROUP_NAME" --description "Issue 881 paid preflight read-only audit group ownership:$OWNERSHIP_TOKEN"
          GROUP_ID="$(python -c 'import json,sys; x=json.load(open(sys.argv[1]))["data"]["id"]; assert x.startswith("ocid1.group."); print(x)' "$RUNNER_TEMP/group-create.json")"
          require_mutation_budget
          MEMBERSHIP_CREATED=1
          request_json "$RUNNER_TEMP/member-create.json" oci iam group add-user --group-id "$GROUP_ID" --user-id "$USER_ID"
          require_mutation_budget
          POLICY_CREATED=1
          request_json "$RUNNER_TEMP/policy-create.json" oci iam policy create --compartment-id "$TENANCY_ID" --name "$POLICY_NAME" --description "Least-privilege reads for Issue 881 paid preflight ownership:$OWNERSHIP_TOKEN" --statements "file://$RUNNER_TEMP/statements.json"
          POLICY_ID="$(python -c 'import json,sys; x=json.load(open(sys.argv[1]))["data"]["id"]; assert x.startswith("ocid1.policy."); print(x)' "$RUNNER_TEMP/policy-create.json")"

          require_mutation_budget
          KEY_CREATED=1
          request_json "$RUNNER_TEMP/key-upload.json" oci iam user api-key upload --user-id "$USER_ID" --key-file "$RUNNER_TEMP/readonly-public.pem"
          ACTUAL_FINGERPRINT="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["data"]["fingerprint"])' "$RUNNER_TEMP/key-upload.json")"
          [[ "$ACTUAL_FINGERPRINT" == "$EXPECTED_FINGERPRINT" ]]

          CIPHERTEXT=v1
          for field in user tenancy fingerprint region; do
            case "$field" in
              user) value="$USER_ID" ;;
              tenancy) value="$TENANCY_ID" ;;
              fingerprint) value="$EXPECTED_FINGERPRINT" ;;
              region) value=eu-frankfurt-1 ;;
            esac
            (( ${#value} > 0 && ${#value} <= 190 ))
            printf '%s' "$value" > "$RUNNER_TEMP/plain-$field.txt"
            openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/readonly-public.pem" -in "$RUNNER_TEMP/plain-$field.txt" -out "$RUNNER_TEMP/encrypted-$field.bin" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
            CIPHERTEXT="$CIPHERTEXT.$(base64 -w0 "$RUNNER_TEMP/encrypted-$field.bin")"
          done
          [[ -n "$CIPHERTEXT" ]]
          echo "ciphertext=$CIPHERTEXT" >> "$GITHUB_OUTPUT"
          {
            echo '## Issue #881 encrypted read-only credential recovery envelope'
            echo
            echo "\`$CIPHERTEXT\`"
          } >> "$GITHUB_STEP_SUMMARY"

          # Receipt publication is part of the transaction: any failure here
          # exits nonzero while the OCI rollback trap and credentials are live.
          {
            echo '## Issue #881 read-only OCI principal bootstrap'
            echo
            echo '- status: `READY_FOR_SECRET_INSTALL`'
            echo '- IAM scope: `inspect compartments`, `inspect instance-family`, `read limits` only'
            echo '- compute/storage/network create, update, delete or launch: `absent`'
            echo '- monetary charge: `none`'
            echo '- failed-step IAM rollback: `NOT_NEEDED`'
            echo "- receipt transaction: \`$RECEIPT_TOKEN\`"
            echo "- encrypted credential metadata: \`$CIPHERTEXT\`"
            echo "- run: $RUN_URL"
          } > "$RUNNER_TEMP/body.md"
          python - "$RUNNER_TEMP/body.md" "$RUNNER_TEMP/body.json" <<'PY'
          import json, sys
          body = open(sys.argv[1], encoding='utf-8').read()
          json.dump({'body': body}, open(sys.argv[2], 'w', encoding='utf-8'))
          PY
          publish_success_receipt

      - name: Publish failed-bootstrap receipt
        if: ${{ always() && steps.bootstrap.outcome != 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLBACK_FILE: ${{ runner.temp }}/bootstrap-rollback-status
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          ROLLBACK_STATUS="$(cat "$ROLLBACK_FILE" 2>/dev/null || echo NOT_RECORDED)"
          {
            echo '## Issue #881 read-only OCI principal bootstrap'
            echo
            echo '- status: `BOOTSTRAP_ERROR`'
            echo '- IAM scope: `inspect compartments`, `inspect instance-family`, `read limits` only'
            echo '- compute/storage/network create, update, delete or launch: `absent`'
            echo '- monetary charge: `none`'
            echo "- failed-step IAM rollback: \`$ROLLBACK_STATUS\`"
            echo '- encrypted credential metadata: `none`'
            echo "- run: $RUN_URL"
          } > "$RUNNER_TEMP/body.md"
          gh issue comment 881 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/body.md"
