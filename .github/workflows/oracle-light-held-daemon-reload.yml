name: Oracle Light held daemon reload

on:
  pull_request:
    paths:
      - 'ops/oracle_light_daemon_reload.py'
      - 'tests/test_oracle_light_daemon_reload.py'
      - '.github/workflows/oracle-light-held-daemon-reload.yml'
  workflow_dispatch:
    inputs:
      main_sha:
        description: 'Reviewed exact current main SHA'
        required: true
        type: string
      invocation_id:
        description: 'Invocation ID from the latest live HOLD preflight'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: oracle-light-backup-mutation
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: |
          python -m pip install 'pytest>=8,<9'
          python -m pytest -q tests/test_oracle_light_daemon_reload.py

  reload:
    needs: contract
    if: github.repository == 'olegmed1-art/bridge-video-free' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Reload pinned HOLD unit without restarting the worker
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN: ${{ inputs.main_sha }}
          INVOCATION: ${{ inputs.invocation_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          [[ "$EXPECTED_MAIN" =~ ^[0-9a-f]{40}$ && "$INVOCATION" =~ ^[0-9a-f]{32}$ ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_MAIN" ]]
          [[ "$(gh api repos/olegmed1-art/bridge-video-free/git/ref/heads/main --jq .object.sha)" == "$EXPECTED_MAIN" ]]
          unset GH_TOKEN
          git diff --exit-code HEAD --
          [[ -n "${SSH_PRIVATE_KEY:-}" ]]
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$work/key"
          unset SSH_PRIVATE_KEY
          ssh-keygen -y -P '' -f "$work/key" > "$work/public" 2>/dev/null
          bash ops/oracle_known_hosts_from_scan.sh 92.5.47.149 SHA256:XBR1x74uJ41BxmDF7Y9P20GjIjNbrYXqieV4c2MC0Go "$work/known_hosts"
          ssh -F /dev/null -i "$work/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$work/known_hosts" -o ConnectTimeout=15 -o ConnectionAttempts=1 ubuntu@92.5.47.149 "sudo -n /usr/bin/python3 - $INVOCATION" < ops/oracle_light_daemon_reload.py
