name: DDS methodology v2.3 smoke

on:
  push:
    branches: [dds-training-local]
    paths:
      - 'dds_training/v23_core.py'
      - 'dds_training/v23_runtime.py'
      - 'dds_training/v23_runtime_selftest.py'
      - 'dds_training/ALGORITHM_DDS_LEARNING_V2_3_RU.md'
      - 'dds_training/STAGE2_READINESS_V23.json'
      - '.github/workflows/dds-training-v23-smoke.yml'
  workflow_dispatch:

concurrency:
  group: dds-methodology-v23-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  methodology-v23:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Compile v2.3 modules
        working-directory: dds_training
        run: |
          python -m py_compile v23_core.py v23_runtime.py v23_runtime_selftest.py

      - name: Run v2.3 end-to-end methodology self-test
        working-directory: dds_training
        run: python v23_runtime_selftest.py

      - name: Verify readiness manifest remains fail-closed
        working-directory: dds_training
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from v23_runtime import audit_stage2_readiness

          committed=json.loads(Path('STAGE2_READINESS_V23.json').read_text(encoding='utf-8'))
          runtime=audit_stage2_readiness()
          assert committed['algorithm_version']==runtime['algorithm_version']=='dds-learning-v2.3'
          assert committed['status']=='blocked'
          assert runtime['status']=='blocked'
          required={x['capability'] for x in runtime['mass_start_blockers']}
          assert required=={
              'dds_partial_position_adapter',
              'full_play_trajectory_integration',
              'stage2_sharded_workflow',
          }, required
          assert committed['mass_training_started'] is False
          print({'v23_readiness':'blocked_as_designed','mass_start_blockers':sorted(required),'stage2_started':False})
          PY

      - name: Re-run holdout and immutable-memory regression tests
        working-directory: dds_training
        run: |
          python experience_selftest.py
          python methodology_v22_selftest.py
          python skill_versions_selftest.py

      - name: Confirm no paid DDS/API dependency was introduced
        working-directory: dds_training
        run: |
          python - <<'PY'
          from pathlib import Path
          paths=[Path('v23_core.py'),Path('v23_runtime.py'),Path('v23_runtime_selftest.py')]
          text='\n'.join(p.read_text(encoding='utf-8') for p in paths).lower()
          forbidden=['openai.api','anthropic','requests.post(','httpx.post(','paid dds api']
          found=[token for token in forbidden if token in text]
          assert not found, found
          print({'paid_api_dependencies':0,'checked_files':[str(p) for p in paths]})
          PY
