name: Issue 881 paid acceptance instance watchdog

on:
  workflow_dispatch:
    inputs:
      stamp:
        description: Exact Issue 881 run-attempt ownership stamp
        required: true
        type: string
      expiry_epoch:
        description: Absolute UTC epoch by which unlaunched temporary storage must be removed
        required: true
        type: string
      expected_ad:
        description: Exact availability domain of the acceptance VM
        required: true
        type: string
      parent_run_id:
        description: Owner-authorized Issue 881 parent workflow run ID
        required: true
        type: string
      parent_run_attempt:
        description: Exact parent workflow run attempt
        required: true
        type: string
      source_original_ocpus:
        description: Sanitized production OCPU count before the temporary lease
        required: true
        type: string
      source_instance_hmac:
        description: HMAC-bound exact production instance identity (never its OCID)
        required: true
        type: string
      source_original_memory:
        description: Sanitized production memory GiB before the temporary lease
        required: true
        type: string
      source_lease_ocpus:
        description: Sanitized temporary production OCPU count
        required: true
        type: string
      source_lease_memory:
        description: Sanitized temporary production memory GiB
        required: true
        type: string
      authorization_hmac:
        description: HMAC correlation issued by the owner-authorized parent
        required: true
        type: string

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: issue-881-paid-watchdog-${{ inputs.stamp }}
  cancel-in-progress: false

jobs:
  terminate-exact-paid-instance:
    runs-on: ubuntu-24.04
    # <=4h pre-launch preparation + 30m paid lifetime + bounded cleanup.
    # The launch receipt shortens the wait to the independently enforced
    # 30-minute compute expiry; it can never extend this outer deadline.
    timeout-minutes: 300
    env:
      OCI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_KEY: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      OCI_REGION: ${{ secrets.OCI_CLI_REGION }}
      ORACLE_HOST: 158.180.47.161
      ORACLE_USER: ubuntu
      EXPECTED_HOSTNAME: bridge-school-dds3-frankfurt
      EXPECTED_FINGERPRINT: SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk
      SSH_KEY_ORACLE: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
      GH_TOKEN: ${{ github.token }}
      STAMP: ${{ inputs.stamp }}
      EXPIRY_EPOCH: ${{ inputs.expiry_epoch }}
      EXPECTED_AD: ${{ inputs.expected_ad }}
      PARENT_RUN_ID: ${{ inputs.parent_run_id }}
      PARENT_RUN_ATTEMPT: ${{ inputs.parent_run_attempt }}
      SOURCE_ORIGINAL_OCPUS: ${{ inputs.source_original_ocpus }}
      SOURCE_ORIGINAL_MEMORY: ${{ inputs.source_original_memory }}
      SOURCE_LEASE_OCPUS: ${{ inputs.source_lease_ocpus }}
      SOURCE_LEASE_MEMORY: ${{ inputs.source_lease_memory }}
      SOURCE_INSTANCE_HMAC: ${{ inputs.source_instance_hmac }}
      AUTHORIZATION_HMAC: ${{ inputs.authorization_hmac }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {persist-credentials: false}
      - name: Wait for provider-independent expiry and terminate exact paid VM
        run: |
          set -euo pipefail
          [[ "$STAMP" =~ ^issue-881-root-recovery-[0-9a-f]{16}-run-[0-9]+-a[1-9][0-9]*$ ]]
          [[ "$EXPIRY_EPOCH" =~ ^[0-9]+$ ]]
          [[ "$PARENT_RUN_ID" =~ ^[0-9]+$ && "$PARENT_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_ORIGINAL_OCPUS" == 6 && "$SOURCE_ORIGINAL_MEMORY" == 12 ]]
          [[ "$SOURCE_LEASE_OCPUS" == 5 && "$SOURCE_LEASE_MEMORY" == 11 ]]
          [[ "$SOURCE_INSTANCE_HMAC" =~ ^[0-9a-f]{64}$ ]]
          [[ "$STAMP" == *"-run-${PARENT_RUN_ID}-a${PARENT_RUN_ATTEMPT}" ]]
          [[ "$GITHUB_ACTOR" == 'github-actions[bot]' ]]
          [[ -n "$EXPECTED_AD" && "$EXPECTED_AD" != *$'\n'* ]]
          [[ "$OCI_REGION" == eu-frankfurt-1 ]]
          # Reserve ten minutes before GitHub's 300-minute hard kill for
          # fence release and exact-stamped storage cleanup.
          watchdog_hard_deadline=$((SECONDS + 17400))
          watchdog_cleanup_cutoff=$((watchdog_hard_deadline - 600))
          watchdog_cleanup_cutoff_epoch=$(( $(date -u +%s) + watchdog_cleanup_cutoff - SECONDS ))
          for value in OCI_USER OCI_TENANCY OCI_FINGERPRINT OCI_KEY; do [[ -n "${!value:-}" ]]; done
          WATCHDOG_PAYLOAD="${STAMP}|${EXPIRY_EPOCH}|${EXPECTED_AD}|${PARENT_RUN_ID}|${PARENT_RUN_ATTEMPT}|${SOURCE_INSTANCE_HMAC}|${SOURCE_ORIGINAL_OCPUS}|${SOURCE_ORIGINAL_MEMORY}|${SOURCE_LEASE_OCPUS}|${SOURCE_LEASE_MEMORY}" python - <<'PY'
          import hashlib,hmac,os
          supplied=os.environ.get('AUTHORIZATION_HMAC','')
          expected=hmac.new(os.environ['OCI_KEY'].encode(),os.environ['WATCHDOG_PAYLOAD'].encode(),hashlib.sha256).hexdigest()
          if not supplied or not hmac.compare_digest(supplied,expected): raise SystemExit('invalid parent correlation')
          PY
          # A GITHUB_TOKEN dispatch is attributed to github-actions[bot]. Bind
          # this destructive child to the exact still-running parent whose
          # issue_comment actor is the repository owner instead of trusting the
          # child caller identity or caller-supplied stamp alone.
          parent_json="$RUNNER_TEMP/parent-run.json"
          timeout --signal=KILL 30s gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PARENT_RUN_ID}" >"$parent_json"
          EXPECTED_REPOSITORY="$GITHUB_REPOSITORY" EXPECTED_ATTEMPT="$PARENT_RUN_ATTEMPT" python - "$parent_json" <<'PY'
          import json,os,sys
          d=json.load(open(sys.argv[1]))
          assert d.get('repository',{}).get('full_name')==os.environ['EXPECTED_REPOSITORY']
          assert d.get('event')=='issue_comment' and d.get('name')=='Issue 881 one-shot root filesystem expansion'
          assert d.get('head_branch')=='main' and d.get('status')=='in_progress'
          assert d.get('run_attempt')==int(os.environ['EXPECTED_ATTEMPT'])
          assert d.get('actor',{}).get('login')=='olegmed1-art'
          assert d.get('triggering_actor',{}).get('login')=='olegmed1-art'
          PY
          now="$(date -u +%s)"
          # A forged far-future input can never extend the watchdog beyond the
          # primary workflow's bounded four-hour mutation window.
          local_cap=$((now + 14400))
          (( EXPIRY_EPOCH < local_cap )) && effective_expiry="$EXPIRY_EPOCH" || effective_expiry="$local_cap"
          python -m pip install --disable-pip-version-check -q 'oci-cli==3.90.3'
          install -d -m 0700 "$HOME/.oci"
          printf '%s' "$OCI_KEY" | python -c 'import sys; raw=sys.stdin.read().replace("\\r","").replace("\\n","\n"); open(sys.argv[1],"w").write(raw if raw.endswith("\n") else raw+"\n")' "$HOME/.oci/key.pem"
          chmod 0600 "$HOME/.oci/key.pem"
          python - <<'PY'
          import os
          from pathlib import Path
          def scalar(env, key):
              lines=[x.strip() for x in os.environ[env].replace('\r','').splitlines() if x.strip()]
              matches=[x.split('=',1)[1].strip() for x in lines if x.startswith(key+'=')]
              if len(matches)==1 and matches[0]: return matches[0]
              if not matches and len(lines)==1 and '=' not in lines[0]: return lines[0]
              raise SystemExit('ambiguous credential')
          values={'user':scalar('OCI_USER','user'),'fingerprint':scalar('OCI_FINGERPRINT','fingerprint'),'tenancy':scalar('OCI_TENANCY','tenancy'),'region':scalar('OCI_REGION','region')}
          (Path.home()/'.oci'/'config').write_text('[DEFAULT]\n'+''.join(f'{k}={v}\n' for k,v in values.items())+f"key_file={Path.home()/'.oci'/'key.pem'}\n")
          PY
          chmod 0600 "$HOME/.oci/config"
          export OCI_CLI_REGION="$OCI_REGION"

          oci_retry_json() {
            local output="$1" deadline="$2"; shift 2
            local remaining request_seconds
            while (( SECONDS < deadline )); do
              remaining=$((deadline - SECONDS)); request_seconds=$((remaining < 30 ? remaining : 30))
              if timeout --signal=KILL "${request_seconds}s" "$@" --output json >"$output" 2>/dev/null \
                  && python -c 'import json,sys; assert isinstance(json.load(open(sys.argv[1])),dict)' "$output"; then
                return 0
              fi
              (( SECONDS < deadline )) && sleep 5
            done
            return 1
          }
          oci_retry_quiet() {
            local deadline="$1"; shift
            local remaining request_seconds
            while (( SECONDS < deadline )); do
              remaining=$((deadline - SECONDS)); request_seconds=$((remaining < 30 ? remaining : 30))
              if timeout --signal=KILL "${request_seconds}s" "$@" --output json >/dev/null 2>/dev/null; then return 0; fi
              (( SECONDS < deadline )) && sleep 5
            done
            return 1
          }

          restore_source_capacity() {
            local source_list="$RUNNER_TEMP/source-instances.json" source_id_file="$RUNNER_TEMP/source-instance-id"
            local source_id source_restore_deadline source_restored=0 source_stop_budget_committed=0 source_get lifecycle ocpus memory command_deadline
            local source_restart_phase=0 source_resize_deadline source_stop_deadline
            local -a source_state
            source_restore_deadline=$((SECONDS + 1500))
            (( source_restore_deadline < watchdog_cleanup_cutoff )) || source_restore_deadline="$watchdog_cleanup_cutoff"
            # Reserve the final twelve minutes for START retries and RUNNING
            # verification. Once restart begins, never issue another resize/stop.
            source_resize_deadline=$((source_restore_deadline - 720))
            # Last STOP submission must leave room for STOPPING as well as
            # update, START, polling, and RUNNING verification.
            source_stop_deadline=$((source_restore_deadline - 1440))
            oci_retry_json "$source_list" "$source_restore_deadline" oci compute instance list --compartment-id "$tenancy_id" --display-name bridge-school-dds3-frankfurt --all
            EXPECTED_AD="$EXPECTED_AD" TENANCY_ID="$tenancy_id" python - "$source_list" >"$source_id_file" <<'PY'
          import json,os,sys
          data=json.load(open(sys.argv[1])).get('data')
          assert isinstance(data,list) and all(isinstance(x,dict) for x in data)
          matched=[x for x in data if x.get('display-name')=='bridge-school-dds3-frankfurt' and x.get('lifecycle-state') not in {'TERMINATED','TERMINATING'}]
          assert len(matched)==1
          d=matched[0]
          assert d.get('compartment-id')==os.environ['TENANCY_ID'] and d.get('availability-domain')==os.environ['EXPECTED_AD']
          assert d.get('shape')=='VM.Standard.E5.Flex' and isinstance(d.get('id'),str) and d['id']
          print(d['id'])
          PY
            source_id="$(<"$source_id_file")"
            SOURCE_ID="$source_id" python - <<'PY'
          import hashlib,hmac,os
          observed=hmac.new(os.environ['OCI_KEY'].encode(),('source-instance|'+os.environ['SOURCE_ID']).encode(),hashlib.sha256).hexdigest()
          assert hmac.compare_digest(observed,os.environ['SOURCE_INSTANCE_HMAC'])
          PY
            [[ $? == 0 ]] || return 103
            while (( SECONDS < source_restore_deadline )); do
              source_get="$RUNNER_TEMP/source-get.json"
              command_deadline=$((SECONDS + 60)); (( command_deadline > source_restore_deadline )) && command_deadline="$source_restore_deadline"
              oci_retry_json "$source_get" "$command_deadline" oci compute instance get --instance-id "$source_id" || continue
              source_state_file="$RUNNER_TEMP/source-state"
              if ! EXPECTED_ID="$source_id" EXPECTED_AD="$EXPECTED_AD" TENANCY_ID="$tenancy_id" python - "$source_get" >"$source_state_file" <<'PY'
          import json,os,sys
          d=json.load(open(sys.argv[1])).get('data'); assert isinstance(d,dict)
          assert d.get('id')==os.environ['EXPECTED_ID'] and d.get('display-name')=='bridge-school-dds3-frankfurt'
          assert d.get('compartment-id')==os.environ['TENANCY_ID'] and d.get('availability-domain')==os.environ['EXPECTED_AD']
          assert d.get('shape')=='VM.Standard.E5.Flex'
          c=d.get('shape-config') or {}; o=c.get('ocpus'); m=c.get('memory-in-gbs')
          assert isinstance(o,(int,float)) and float(o).is_integer()
          assert isinstance(m,(int,float)) and float(m).is_integer()
          print(d.get('lifecycle-state')); print(int(o)); print(int(m))
          PY
              then return 104; fi
              mapfile -t source_state <"$source_state_file"
              (( ${#source_state[@]} == 3 )) || return 104
              lifecycle="${source_state[0]}"; ocpus="${source_state[1]}"; memory="${source_state[2]}"
              if [[ "$ocpus/$memory" != "$SOURCE_ORIGINAL_OCPUS/$SOURCE_ORIGINAL_MEMORY" && "$ocpus/$memory" != "$SOURCE_LEASE_OCPUS/$SOURCE_LEASE_MEMORY" ]]; then
                return 103
              fi
              if [[ "$lifecycle" == RUNNING && "$ocpus/$memory" == "$SOURCE_ORIGINAL_OCPUS/$SOURCE_ORIGINAL_MEMORY" ]]; then
                source_restored=1
                break
              fi
              if [[ "$lifecycle" == RUNNING ]]; then
                (( source_restart_phase == 0 )) || return 105
                if (( SECONDS >= source_stop_deadline )); then
                  # An earlier timed-out STOP may still have been accepted.
                  # Keep observing/restarting, but never submit another STOP.
                  (( source_stop_budget_committed == 1 )) || return 105
                  sleep 5
                  continue
                fi
                if (( source_stop_budget_committed == 0 )); then
                  # Reserve both independently bounded stop and restart
                  # transitions before the first request.
                  (( source_restore_deadline - SECONDS >= 1380 )) || return 105
                  source_stop_budget_committed=1
                fi
                # A fresh RUNNING observation permits an idempotent retry. This
                # recovers from definitely unsubmitted network/DNS failures and
                # remains safe when an earlier request was merely delayed.
                command_deadline=$((SECONDS + 60)); (( command_deadline > source_stop_deadline )) && command_deadline="$source_stop_deadline"
                oci_retry_quiet "$command_deadline" oci compute instance action --instance-id "$source_id" --action SOFTSTOP || true
              elif [[ "$lifecycle" == STOPPED ]]; then
                if (( source_restart_phase == 0 && SECONDS < source_resize_deadline )) && [[ "$ocpus/$memory" == "$SOURCE_LEASE_OCPUS/$SOURCE_LEASE_MEMORY" ]]; then
                  command_deadline=$((SECONDS + 60)); (( command_deadline > source_resize_deadline )) && command_deadline="$source_resize_deadline"
                  oci_retry_quiet "$command_deadline" oci compute instance update --instance-id "$source_id" --shape-config "{\"ocpus\":${SOURCE_ORIGINAL_OCPUS},\"memoryInGBs\":${SOURCE_ORIGINAL_MEMORY}}" --force || true
                fi
                # Even an uncertain/failed update must end in a reachable host.
                # Latch before START, whose response can also be lost.
                source_restart_phase=1
                command_deadline=$((SECONDS + 60)); (( command_deadline > source_restore_deadline )) && command_deadline="$source_restore_deadline"
                oci_retry_quiet "$command_deadline" oci compute instance action --instance-id "$source_id" --action START || true
              elif [[ "$lifecycle" != STARTING && "$lifecycle" != STOPPING ]]; then
                return 104
              fi
              sleep 5
            done
            (( source_restored == 1 )) || return 105
          }
          release_source_workload_fence() {
            local known="$RUNNER_TEMP/source-known-hosts" key="$RUNNER_TEMP/source-key" deadline=$((SECONDS + 300)) remaining attempt_seconds
            while (( SECONDS < deadline )); do
              remaining=$((deadline - SECONDS)); attempt_seconds=$((remaining < 60 ? remaining : 60))
              if timeout --signal=KILL "${attempt_seconds}s" ops/oracle_known_hosts_from_scan.sh "$ORACLE_HOST" "$EXPECTED_FINGERPRINT" "$known" 2>/dev/null; then break; fi
              sleep 5
            done
            [[ -s "$known" ]] || return 106
            printf '%s\n' "$SSH_KEY_ORACLE" >"$key"; chmod 0600 "$key"; ssh-keygen -y -f "$key" >/dev/null || return 106
            while (( SECONDS < deadline )); do
              remaining=$((deadline - SECONDS)); attempt_seconds=$((remaining < 60 ? remaining : 60))
              if timeout --signal=KILL "${attempt_seconds}s" ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST" \
                  "sudo -n env EXPECTED_HOSTNAME='$EXPECTED_HOSTNAME' LEASE_STAMP='$STAMP' /bin/bash -s" <<'REMOTE'
          set -Eeuo pipefail
          [[ "$(hostname)" == "$EXPECTED_HOSTNAME" ]]
          marker=/var/lib/bridge-school/issue-881-capacity-lease
          exec 8>/run/lock/oracle-workload-mutation.lock; flock --exclusive 8
          if [[ -e "$marker" ]]; then
            [[ -f "$marker" && ! -L "$marker" && "$(stat -c '%u:%g:%a:%h' "$marker")" == 0:0:600:1 ]]
            [[ "$(<"$marker")" == "$LEASE_STAMP" ]]
            rm -f -- "$marker"
          fi
          # These operations are deliberately idempotent and unconditional.
          # A prior attempt may have removed the marker after unmasking but
          # lost its connection before enable/start completed.
          systemctl unmask universal-video-container.service
          systemctl enable universal-video-container.service
          systemctl start universal-video-container.service
          [[ "$(systemctl is-enabled universal-video-container.service)" == enabled ]]
          [[ "$(systemctl is-active universal-video-container.service)" == active ]]
          REMOTE
              then return 0; fi
              sleep 5
            done
            return 106
          }

          roots="$RUNNER_TEMP/roots.json"
          instances="$RUNNER_TEMP/instances.json"
          timeout --signal=KILL 30s oci iam compartment list --include-root --all --output json >"$roots" 2>/dev/null
          tenancy_id="$(python - "$roots" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1])).get('data')
          ids=[x.get('id') for x in data if isinstance(x,dict) and isinstance(x.get('id'),str) and x['id'].startswith('ocid1.tenancy.')]
          assert len(ids)==1
          print(ids[0])
          PY
          )"
          # Prepare and authenticate the bounded termination client before the
          # paid deadline. Installation failure therefore prevents the primary
          # workflow's later launch gate from being armed.
          gh api "repos/${GITHUB_REPOSITORY}/issues/881/comments" -f body="PAID_WATCHDOG_ARMED stamp=${STAMP} cleanup_epoch=${EXPIRY_EPOCH} run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # The primary workflow may spend up to four hours preparing the
          # restored volume and isolated network. Once it publishes the exact
          # Actions-authored launch receipt, independently shorten the deadline
          # to at most 30 minutes from observation. Missing/invalid receipts
          # cannot postpone cleanup of an abandoned restored volume.
          while :; do
            now="$(date -u +%s)"
            (( now >= effective_expiry )) && break
            if launch_comments="$(timeout --signal=KILL 30s gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/881/comments" --jq '.[] | select(.user.login=="github-actions[bot]") | .body' 2>/dev/null)"; then
              lease_restore_epoch="$(sed -n "s|^CAPACITY_LEASE_OPEN stamp=${STAMP} restore_epoch=\([0-9][0-9]*\) source_shape=VM.Standard.E5.Flex original=6/12 lease=5/11 run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${PARENT_RUN_ID}$|\1|p" <<<"$launch_comments" | tail -n1)"
              if [[ "$lease_restore_epoch" =~ ^[0-9]+$ ]]; then
                (( lease_restore_epoch <= now + 2700 && lease_restore_epoch <= effective_expiry )) || exit 96
                (( lease_restore_epoch > now )) && effective_expiry="$lease_restore_epoch" || effective_expiry="$now"
              fi
              launch_expiry="$(sed -n "s/^PAID_WATCHDOG_LAUNCH stamp=${STAMP} expiry_epoch=\([0-9][0-9]*\) run=.*/\1/p" <<<"$launch_comments" | tail -n1)"
              if [[ "$launch_expiry" =~ ^[0-9]+$ ]]; then
                (( launch_expiry <= now + 1800 )) || exit 96
                # A delayed authenticated read may discover the launch receipt
                # after its deadline. A later valid launch deadline is capped
                # by the already authenticated capacity-lease deadline; it can
                # never abort or postpone cleanup.
                if (( launch_expiry <= now )); then
                  effective_expiry="$now"
                elif (( launch_expiry < effective_expiry )); then
                  effective_expiry="$launch_expiry"
                fi
                break
              fi
            fi
            sleep_for=$((effective_expiry - now)); (( sleep_for > 5 )) && sleep_for=5
            sleep "$sleep_for"
          done
          now="$(date -u +%s)"
          remaining=$((effective_expiry - now))
          (( remaining > 0 )) && sleep "$remaining"
          reconcile_paid_instance_once() {
          instance_discovery_deadline=$((SECONDS + 120))
          (( instance_discovery_deadline < watchdog_cleanup_cutoff )) || instance_discovery_deadline="$watchdog_cleanup_cutoff"
          while ! timeout --signal=KILL 30s oci compute instance list --compartment-id "$tenancy_id" --all --output json >"$instances" 2>/dev/null; do
            (( SECONDS < instance_discovery_deadline )) || return 97
            sleep 5
          done
          ids_file="$RUNNER_TEMP/instance-ids"
          if ! STAMP="$STAMP" TENANCY_ID="$tenancy_id" EXPECTED_AD="$EXPECTED_AD" python - "$instances" >"$ids_file" <<'PY'
          import json,os,sys
          data=json.load(open(sys.argv[1])).get('data')
          assert isinstance(data,list) and all(isinstance(x,dict) for x in data)
          matched=[]
          for item in data:
              if item.get('display-name') != os.environ['STAMP']+'-boot-acceptance' or item.get('lifecycle-state') == 'TERMINATED': continue
              assert item.get('compartment-id')==os.environ['TENANCY_ID'] and item.get('availability-domain')==os.environ['EXPECTED_AD']
              assert item.get('shape')=='VM.Standard.E5.Flex'
              config=item.get('shape-config') or {}
              assert config.get('ocpus')==1 and config.get('memory-in-gbs')==1
              matched.append(item.get('id'))
          assert len(matched)<=1 and all(isinstance(x,str) and x for x in matched)
          sys.stdout.write('\n'.join(matched)+('\n' if matched else ''))
          PY
          then return 101; fi
          mapfile -t ids <"$ids_file"
          instance_terminal_proven=0
          if (( ${#ids[@]} == 1 )); then
            instance_get_error="$RUNNER_TEMP/instance-get.err"
            instance_cleanup_deadline=$((SECONDS + 600))
            (( instance_cleanup_deadline < watchdog_cleanup_cutoff )) || instance_cleanup_deadline="$watchdog_cleanup_cutoff"
            while (( SECONDS < instance_cleanup_deadline )); do
              timeout --signal=KILL 30s oci compute instance terminate --instance-id "${ids[0]}" --preserve-boot-volume true --force --output json >/dev/null 2>/dev/null || true
              if timeout --signal=KILL 20s oci compute instance get --instance-id "${ids[0]}" --output json >"$instances" 2>"$instance_get_error"; then
                state="$(python - "$instances" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1]))['data']['lifecycle-state'])
          PY
                )"
                if [[ "$state" == TERMINATED ]]; then instance_terminal_proven=1; break; fi
              elif grep -Eq '(^|[^0-9])status([^0-9]+)404([^0-9]|$)' "$instance_get_error"; then
                instance_terminal_proven=1; break
              fi
              : >"$instance_get_error"
              sleep 5
            done
            # A known exact ID can never be downgraded to LIST-based absence.
            (( instance_terminal_proven == 1 )) || return 99
          fi
          # A direct GET terminal result for the known exact ID is stronger
          # than an eventually consistent LIST and permits storage cleanup to
          # proceed. If no ID was observed, require a bounded clean inventory.
          if (( ${#ids[@]} == 0 )); then
            instance_confirmation_deadline=$((SECONDS + 120))
            (( instance_confirmation_deadline < watchdog_cleanup_cutoff )) || instance_confirmation_deadline="$watchdog_cleanup_cutoff"
            instance_inventory_clean=0
            late_instance_clean_count=0
            late_instance_id=""
            while (( SECONDS < instance_confirmation_deadline )); do
              if timeout --signal=KILL 30s oci compute instance list --compartment-id "$tenancy_id" --all --output json >"$instances" 2>/dev/null; then
                late_ids_file="$RUNNER_TEMP/late-instance-ids"
                if ! STAMP="$STAMP" TENANCY_ID="$tenancy_id" EXPECTED_AD="$EXPECTED_AD" python - "$instances" >"$late_ids_file" <<'PY'
          import json,os,sys
