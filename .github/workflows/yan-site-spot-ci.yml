name: Yan Site Spot Integration CI

on:
  push:
    branches: ['codex/yan-site-spot-integration-20261016']
    paths:
      - '.gitattributes'
      - 'site_integration/yan_spot_cycle/**'
      - 'bridge_school_api/school_spot_lesson.py'
      - 'bridge_school_api/school_spot_repository.py'
      - 'bridge_school_api/local_single_user_lesson.py'
      - 'bridge_school_api/diana19_staging.py'
      - 'bridge_school_api/static/diana19/**'
      - 'tests/test_diana19_staging.py'
      - 'tests/test_local_single_user_binding.py'
      - 'tests/test_school_spot_lesson.py'
      - '.github/workflows/yan-site-spot-ci.yml'

permissions:
  contents: read

jobs:
  php-site-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install existing backend test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-api.txt 'pytest==9.1.1' 'httpx==0.28.1'
      - name: Check new PHP code
        run: |
          php --version
          find site_integration/yan_spot_cycle -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Check Diana19 browser transport
        run: node --test site_integration/yan_spot_cycle/tests/test_diana19_browser.cjs
      - name: Check Diana19 reveal, persistence and local admission
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/test_diana19_staging.py tests/test_local_single_user_binding.py
      - name: Verify new HTTP adapters with neutral data and backend restart
        run: >-
          timeout --signal=TERM --kill-after=10s 180s
          python -m site_integration.yan_spot_cycle.tests.verify_diana19_http
          --output deliverables/diana19-protocol-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retain neutral protocol journal and verification report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diana19-neutral-protocol-${{ github.run_id }}-${{ github.run_attempt }}
          path: deliverables/diana19-protocol-${{ github.run_id }}-${{ github.run_attempt }}/artifact/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
