name: Diana Longitudinal Regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'diana_longitudinal_postprocess.py'
      - 'route_drive_job_outputs.py'
      - 'tests/test_diana_longitudinal_postprocess.py'
      - '.github/workflows/diana-longitudinal-regression.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --disable-pip-version-check \
            'requests==2.34.2' 'google-auth==2.56.3' 'pymupdf==1.28.2'
          python -m py_compile diana_longitudinal_postprocess.py route_drive_job_outputs.py
          python -m unittest tests.test_diana_longitudinal_postprocess -v
