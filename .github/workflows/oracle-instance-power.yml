name: Oracle instance power

on:
  workflow_dispatch:
    inputs:
      action:
        description: Exact lifecycle action
        required: true
        type: choice
        options: [status, start, stop]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: oracle-instance-power
  cancel-in-progress: false

jobs:
  power:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.comment.user.login == 'olegmed1-art' &&
       (github.event.comment.body == '/oracle-power status' ||
        github.event.comment.body == '/oracle-power start' ||
        github.event.comment.body == '/oracle-power stop'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OCI_REGION: eu-frankfurt-1
      OCI_INSTANCE_OCID: ocid1.instance.oc1.eu-frankfurt-1.antheljtruoejaica7hj5oubnh2cctnjr7ti7llcgo6ho6wdvgvui6td7saq
      ACTION_VALUE: ${{ github.event_name == 'workflow_dispatch' && inputs.action || (github.event.comment.body == '/oracle-power start' && 'start' || github.event.comment.body == '/oracle-power stop' && 'stop' || 'status') }}
    steps:
      - name: Validate credential presence
        env:
          OCI_CLI_CONFIG: ${{ secrets.OCI_CLI_CONFIG }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
        run: |
          set -euo pipefail
          test -n "${OCI_CLI_CONFIG:-}"
          test -n "${OCI_CLI_KEY_CONTENT:-}"

      - name: Install OCI CLI
        run: python -m pip install --disable-pip-version-check --quiet oci-cli

      - name: Configure bounded OCI client
        env:
          OCI_CLI_CONFIG: ${{ secrets.OCI_CLI_CONFIG }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_CLI_KEY_CONTENT" > "$HOME/.oci/oci_api_key.pem"
          printf '%s\n' "$OCI_CLI_CONFIG" > "$HOME/.oci/config"
          python - <<'PY'
          from pathlib import Path
          p=Path.home()/'.oci/config'
          lines=[]; key=False; region=False
          for line in p.read_text().splitlines():
              if line.strip().startswith('key_file='):
                  lines.append(f'key_file={Path.home()}/.oci/oci_api_key.pem'); key=True
              elif line.strip().startswith('region='):
                  lines.append('region=eu-frankfurt-1'); region=True
              else:
                  lines.append(line)
          if not key: lines.append(f'key_file={Path.home()}/.oci/oci_api_key.pem')
          if not region: lines.append('region=eu-frankfurt-1')
          p.write_text('\n'.join(lines)+'\n')
          PY

      - name: Read current lifecycle state
        id: state
        run: |
          set -euo pipefail
          state="$(oci compute instance get --instance-id "$OCI_INSTANCE_OCID" --query 'data."lifecycle-state"' --raw-output)"
          case "$state" in RUNNING|STOPPED|STARTING|STOPPING) ;; *) exit 1 ;; esac
          echo "current_state=$state" >> "$GITHUB_OUTPUT"
          echo "current lifecycle state: $state"

      - name: Start exact instance
        if: ${{ env.ACTION_VALUE == 'start' && steps.state.outputs.current_state != 'RUNNING' }}
        run: |
          set -euo pipefail
          oci compute instance action --instance-id "$OCI_INSTANCE_OCID" --action START >/dev/null
          oci compute instance get --instance-id "$OCI_INSTANCE_OCID" --wait-for-state RUNNING --wait-interval-seconds 10 --max-wait-seconds 600 >/dev/null
          echo "instance reached RUNNING"

      - name: Stop exact instance
        if: ${{ env.ACTION_VALUE == 'stop' && steps.state.outputs.current_state != 'STOPPED' }}
        run: |
          set -euo pipefail
          oci compute instance action --instance-id "$OCI_INSTANCE_OCID" --action STOP >/dev/null
          oci compute instance get --instance-id "$OCI_INSTANCE_OCID" --wait-for-state STOPPED --wait-interval-seconds 10 --max-wait-seconds 600 >/dev/null
          echo "instance reached STOPPED"

      - name: Publish issue-comment result
        if: ${{ always() && github.event_name == 'issue_comment' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          STATE: ${{ steps.state.outputs.current_state }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -f body="Oracle power ${ACTION_VALUE}: initial_state=${STATE:-UNKNOWN}; workflow=${{ job.status }}" >/dev/null
