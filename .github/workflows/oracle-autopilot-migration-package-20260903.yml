name: Oracle Autopilot migration package (one-shot)

on:
  push:
    branches: [codex/oracle-ssh-recovery-20260903]
    paths: ['.github/workflows/oracle-autopilot-migration-package-20260903.yml']

permissions:
  contents: read

jobs:
  package:
    if: github.repository == 'olegmed1-art/bridge-video-free'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      ORACLE_HOST: 158.180.47.161
      ORACLE_USER: ubuntu
      EXPECTED_FINGERPRINT: SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk
      SSH_KEY_ORACLE: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
    steps:
      - name: Create protected migration package on old server
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/oracle-package"
          mkdir -p "$work"
          key="$work/id_oracle"
          known="$work/known_hosts"
          printf '%s\n' "$SSH_KEY_ORACLE" | tr -d '\r' > "$key"
          chmod 0600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          ssh-keyscan -T 10 -t ed25519,ecdsa,rsa "$ORACLE_HOST" > "$known" 2>/dev/null
          ssh-keygen -lf "$known" | awk '{print $2}' | grep -Fx "$EXPECTED_FINGERPRINT" >/dev/null
          ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes             -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known"             -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST" 'sudo -n bash -se' <<'REMOTE'
          set -Eeuo pipefail
          target=/home/ubuntu/autopilot-migration-20260903.tgz
          tmp="$(mktemp /var/tmp/autopilot-migration.XXXXXXXX.tgz)"
          cleanup() { rm -f -- "$tmp"; }
          trap cleanup EXIT HUP INT TERM
          files=(
            opt/bridge-school/school-autopilot/autopilot-shadow.env
            opt/bridge-school/school-autopilot/autopilot-broker.env
            opt/bridge-school/school-autopilot/bootstrap/oracle-bootstrap-rsa.pem
            opt/bridge-school/school-autopilot/bootstrap/oracle-bootstrap-rsa.pub.pem
          )
          for rel in "${files[@]}"; do
            path="/$rel"
            [[ -f "$path" && ! -L "$path" && -s "$path" ]]
          done
          [[ "$(stat -c '%U:%G:%a' /opt/bridge-school/school-autopilot/autopilot-shadow.env)" == root:root:600 ]]
          [[ "$(stat -c '%U:%G:%a' /opt/bridge-school/school-autopilot/autopilot-broker.env)" == root:root:600 ]]
          [[ "$(stat -c '%U:%G:%a' /opt/bridge-school/school-autopilot/bootstrap/oracle-bootstrap-rsa.pem)" == root:root:600 ]]
          tar -C / -czf "$tmp" "${files[@]}"
          tar -tzf "$tmp" | sort
          chown ubuntu:ubuntu "$tmp"
          chmod 0600 "$tmp"
          mv -f "$tmp" "$target"
          tmp=''
          [[ "$(stat -c '%U:%G:%a' "$target")" == ubuntu:ubuntu:600 ]]
          sha256sum "$target" | awk '{print "MIGRATION_PACKAGE_SHA256=" $1}'
          stat -c 'MIGRATION_PACKAGE_BYTES=%s' "$target"
          echo "MIGRATION_PACKAGE_PATH=$target"
          echo 'MIGRATION_PACKAGE_READY=YES'
          echo 'SECRET_VALUES_EXPOSED=NO'
          echo 'SERVICES_RESTARTED=NO'
          REMOTE
