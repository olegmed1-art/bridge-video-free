name: Validate r25.4 rollback

on:
  push:
    branches: [rollback/3.1-free-r25.5-to-r25.4-2026-08-15]
    paths: ['.github/workflows/rollback-r25-4-regression.yml']

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - name: Install test runtime
        run: python -m pip install --disable-pip-version-check -r requirements-worker.txt
      - name: Run r25.4 regression suite
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/test_asr_qc_r25_1.py
          PYTHONPATH=. python tests/test_semantic_gate_r25_2.py
          PYTHONPATH=. python tests/test_late_oauth_r25_3.py
          PYTHONPATH=. python tests/test_unreliable_asr_isolation_r25_4.py
          python -m py_compile bridge_runtime_hardening_r25_1.py bridge_runtime_hardening_r25_4.py run_drive_3_1_free_generic.py
