name: Oracle DDS3 Pilot-10k failure tail

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  read:
    if: ${{ github.event.comment.user.login == 'olegmed1-art' && github.event.comment.body == '/dds3-pilot10k failure-tail' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ORACLE_HOST: 158.180.47.161
      ORACLE_USER: ubuntu
      EXPECTED_FINGERPRINT: SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk
      SSH_KEY_ORACLE: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
      SSH_KEY_OCI: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
      SSH_KEY_VM: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
      SSH_KEY_BRIDGE: ${{ secrets.BRIDGE_SCHOOL_ORACLE_SSH_PRIVATE_KEY }}
      SSH_KEY_ORACLE_ALT: ${{ secrets.ORACLE_SSH_KEY }}
      SSH_KEY_OCI_ALT: ${{ secrets.OCI_SSH_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Resolve SSH
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/pilot10k-tail"; mkdir -p "$work"
          known="$work/known_hosts"
          ops/oracle_known_hosts_from_scan.sh "$ORACLE_HOST" "$EXPECTED_FINGERPRINT" "$known"
          selected=''; idx=0
          for name in SSH_KEY_ORACLE SSH_KEY_OCI SSH_KEY_VM SSH_KEY_BRIDGE SSH_KEY_ORACLE_ALT SSH_KEY_OCI_ALT; do
            raw="${!name:-}"; [[ -n "$raw" ]] || continue; idx=$((idx+1)); base="$work/k$idx"
            printf '%s\n' "$raw" | tr -d '\r' > "$base"
            chmod 0600 "$base"; ssh-keygen -y -f "$base" >/dev/null 2>&1 || continue
            if ssh -i "$base" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" -o ConnectTimeout=10 "$ORACLE_USER@$ORACLE_HOST" true >/dev/null 2>&1; then selected="$base"; break; fi
          done
          [[ -n "$selected" ]]; echo "key=$selected" >> "$GITHUB_OUTPUT"; echo "known=$known" >> "$GITHUB_OUTPUT"
      - name: Read sanitized evidence tail
        id: tail
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/tail.txt"
          ssh -i '${{ steps.ssh.outputs.key }}' -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='${{ steps.ssh.outputs.known }}' "$ORACLE_USER@$ORACLE_HOST" 'sudo -n python3 -' <<'PY' | tee "$out"
          import json
          p='/opt/bridge-school/dds3-mass-validation/evidence/10000.json'
          x=json.load(open(p))
          print('status='+str(x.get('status')))
          print('returncode='+str(x.get('returncode')))
          print('failure_tail_begin')
          for line in x.get('failure_tail', []): print(line)
          print('failure_tail_end')
          PY
          { echo 'text<<EOF'; sed -n '1,100p' "$out"; echo EOF; } >> "$GITHUB_OUTPUT"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TEXT: ${{ steps.tail.outputs.text }}
        shell: bash
        run: |
          body="Pilot-10k sanitized failure tail:\n\n\`\`\`text\n${TEXT}\n\`\`\`"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -f body="$body" >/dev/null
