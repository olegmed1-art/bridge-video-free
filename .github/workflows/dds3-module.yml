name: DDS3 module integration
on:
  pull_request:
    paths:
      - 'dds/**'
      - 'bridge_school_api/dds3/**'
      - 'dds3_runtime/**'
      - 'Dockerfile.dds3'
      - '.github/workflows/dds3-module.yml'
  workflow_dispatch:

jobs:
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned DDS3 container
        run: docker build -f Dockerfile.dds3 -t bridge-school-dds3 .
      - name: Golden deterministic run
        shell: bash
        run: |
          set -euo pipefail
          DEAL='N:QJ6.K652.J85.T98 873.J97.AT764.Q4 K5.T83.KQ9.A7652 AT942.AQ4.32.KJ3'
          docker run --rm bridge-school-dds3 N None "$DEAL" > run1.json
          docker run --rm bridge-school-dds3 N None "$DEAL" > run2.json
          cmp run1.json run2.json
          python3 - <<'PY'
          import json
          d=json.load(open('run1.json'))
          assert d['hand_order']==['N','E','S','W']
          assert d['strain_order']==['S','H','D','C','NT']
          assert d['par_score_ns']==-110
          assert d['par_contracts']==['2S-EW']
          assert all(len(v)==4 and all(0<=x<=13 for x in v) for v in d['dd_table'].values())
          print(json.dumps(d, sort_keys=True))
          PY
      - name: Board 16 end-to-end DD table
        shell: bash
        run: |
          set -euo pipefail
          DEAL='N:K54.7654.875432. Q972.AT82.J.KQT7 8.KQJ3.AQT96.943 AJT63.9.K.AJ8652'
          docker run --rm bridge-school-dds3 N None "$DEAL" | tee board16.json
          python3 - <<'PY'
          import json
          d=json.load(open('board16.json'))
          assert d['hand_order']==['N','E','S','W']
          assert set(d['dd_table'])=={'S','H','D','C','NT'}
          print('BOARD16_DDS3_PASS', json.dumps(d, sort_keys=True))
          PY
      - name: Build production DDS3 runtime from verified core
        run: docker build -f dds3_runtime/Dockerfile -t bridge-school-dds3-runtime:test .
      - name: Start production runtime
        run: docker run -d --rm --name dds3-runtime -p 18080:8080 -e DDS3_RUNTIME_TOKEN=ci-secret bridge-school-dds3-runtime:test
      - name: Require real DDS3 readiness
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/readyz > runtime-ready.json; then cat runtime-ready.json; exit 0; fi
            sleep 1
          done
          docker logs dds3-runtime
          exit 1
      - name: Golden computation through embeddable HTTP runtime
        run: |
          curl -fsS -H 'Authorization: Bearer ci-secret' -H 'Content-Type: application/json' \
            -d '{"operation":"dd_table","pbn":"N:QJ6.K652.J85.T98 873.J97.AT764.Q4 K5.T83.KQ9.A7652 AT942.AQ4.32.KJ3","dealer":"N","vulnerability":"None"}' \
            http://127.0.0.1:18080/v1/compute > runtime-result.json
          python3 - <<'PY'
          import json
          r=json.load(open('runtime-result.json'))
          assert r['engine']=='DDS3'
          assert r['fallback_used'] is False
          assert r['par_score_ns']==-110
          assert r['dd_table']=={'S':[5,8,5,8],'H':[6,6,6,6],'D':[5,7,5,7],'C':[7,5,7,5],'NT':[6,6,6,6]}
          print('DDS3_RUNTIME_HTTP_PASS')
          PY
      - name: Persistent position all-moves and TT reuse through HTTP runtime
        shell: bash
        run: |
          set -euo pipefail
          BODY='{"operation":"position_all_moves","position":{"pbn":"N:QJ6.K652.J85.T98 873.J97.AT764.Q4 K5.T83.KQ9.A7652 AT942.AQ4.32.KJ3","trump":"NT","first":"N","current_trick":[]}}'
          curl -fsS -H 'Authorization: Bearer ci-secret' -H 'Content-Type: application/json' -d "$BODY" \
            http://127.0.0.1:18080/v1/compute > position1.json
          curl -fsS -H 'Authorization: Bearer ci-secret' -H 'Content-Type: application/json' -d "$BODY" \
            http://127.0.0.1:18080/v1/compute > position2.json
          python3 - <<'PY'
          import json
          a=json.load(open('position1.json')); b=json.load(open('position2.json'))
          for r in (a,b):
              assert r['engine']=='DDS3' and r['fallback_used'] is False
              assert r['operation']=='position_all_moves'
              assert 0 <= r['best_tricks'] <= 13
              assert r['moves'] and r['optimal_cards']
              assert all(m['regret'] >= 0 and m['regret_class'] in {'0','1','2+'} for m in r['moves'])
          assert a['moves']==b['moves']
          assert a['solver_context']['request_seq']==1
          assert b['solver_context']['request_seq']==2
          assert b['solver_context']['tt_present_before'] is True
          assert b['solver_context']['tt_present_after'] is True
          assert b['solver_context']['same_tt_instance'] is True
          assert a['nodes'] > b['nodes'] >= 0
          print('DDS3_POSITION_TT_REUSE_PASS', a['nodes'], '->', b['nodes'])
          PY
      - name: Runtime logs on failure
        if: failure()
        run: docker logs dds3-runtime || true
      - uses: actions/upload-artifact@v4
        with:
          name: dds3-integration-results
          path: |
            run1.json
            run2.json
            board16.json
            runtime-ready.json
            runtime-result.json
            position1.json
            position2.json
