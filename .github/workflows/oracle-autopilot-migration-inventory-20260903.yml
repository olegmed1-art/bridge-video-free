name: Oracle Autopilot migration inventory (one-shot)

on:
  push:
    branches: [codex/oracle-ssh-recovery-20260903]
    paths: ['.github/workflows/oracle-autopilot-migration-inventory-20260903.yml']

permissions:
  contents: read

jobs:
  inventory:
    if: github.repository == 'olegmed1-art/bridge-video-free'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      ORACLE_HOST: 158.180.47.161
      ORACLE_USER: ubuntu
      EXPECTED_FINGERPRINT: SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk
      SSH_KEY_ORACLE: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
    steps:
      - name: Read migration inventory without secret values
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/oracle-inventory"
          mkdir -p "$work"
          key="$work/id_oracle"
          known="$work/known_hosts"
          printf '%s\n' "$SSH_KEY_ORACLE" | tr -d '\r' > "$key"
          chmod 0600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          ssh-keyscan -T 10 -t ed25519,ecdsa,rsa "$ORACLE_HOST" > "$known" 2>/dev/null
          ssh-keygen -lf "$known" | awk '{print $2}' | grep -Fx "$EXPECTED_FINGERPRINT" >/dev/null
          ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes             -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known"             -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST" 'sudo -n bash -se' <<'REMOTE'
          set -Eeuo pipefail
          root=/opt/bridge-school/school-autopilot
          echo "HOSTNAME=$(hostname)"
          echo 'AUTOPILOT_FILES_BEGIN'
          if [[ -d "$root" ]]; then
            find "$root" -xdev -maxdepth 4 -type f               -printf '%p|owner=%u:%g|mode=%m|bytes=%s\n' | sort
          else
            echo 'AUTOPILOT_ROOT_MISSING'
          fi
          echo 'AUTOPILOT_FILES_END'
          echo 'AUTOPILOT_UNITS_BEGIN'
          for unit in             school-autopilot-shadow.service             school-autopilot-online-observer.service             school-autopilot-production-canary.service; do
            printf '%s|enabled=' "$unit"
            systemctl is-enabled "$unit" 2>/dev/null || true
            printf '%s|active=' "$unit"
            systemctl is-active "$unit" 2>/dev/null || true
          done
          echo 'AUTOPILOT_UNITS_END'
          echo 'AUTOPILOT_PROCESSES_BEGIN'
          pgrep -a -f 'school_autopilot|oracle_autopilot|autopilot.*worker|autopilot.*observer' || true
          echo 'AUTOPILOT_PROCESSES_END'
          echo 'SECRET_VALUES_EXPOSED=NO'
          echo 'FILES_MUTATED=NO'
          echo 'SERVICES_RESTARTED=NO'
          REMOTE
