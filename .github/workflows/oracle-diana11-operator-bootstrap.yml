name: Oracle Diana 11 Operator Bootstrap

on:
  pull_request:
    paths:
      - '.github/workflows/oracle-diana11-operator-bootstrap.yml'
      - 'ops/universal_video_diana11_operator.sh'
      - 'ops/install_universal_video_diana11_operator.sh'
  push:
    branches: [main]
    paths:
      - 'ops/oracle-diana11-bootstrap-requests/*.json'

permissions:
  contents: read
  issues: write

concurrency:
  group: oracle-diana11-operator-bootstrap
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      issue: ${{ steps.request.outputs.issue }}
      request_id: ${{ steps.request.outputs.request_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Validate scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n ops/universal_video_diana11_operator.sh
          bash -n ops/install_universal_video_diana11_operator.sh
          grep -Fq "diana11-transcript-20260825-01" ops/universal_video_diana11_operator.sh
          grep -Fq "1PGRLozLJKG8tl-JYGPTCcS_lT-nn-T7C" ops/universal_video_diana11_operator.sh
      - name: Validate request
        id: request
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff-tree -m --no-commit-id --name-only -r "$GITHUB_SHA" \
            | grep -E '^ops/oracle-diana11-bootstrap-requests/[^/]+\.json$' | sort -u)
          [[ ${#files[@]} -eq 1 ]] || { echo "expected exactly one bootstrap request" >&2; exit 1; }
          REQUEST_FILE="${files[0]}" python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          x=json.load(open(os.environ['REQUEST_FILE'], encoding='utf-8'))
          assert set(x)=={'request_id','issue'}
          assert re.fullmatch(r'[A-Za-z0-9._-]{1,80}', str(x['request_id']))
          assert x['issue']==441
          print('request_id='+x['request_id'])
          print('issue=441')
          PY

  bootstrap:
    if: ${{ github.event_name == 'push' }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ORACLE_HOST: 158.180.47.161
      ORACLE_USER: ubuntu
      SSH_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ needs.validate.outputs.issue }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Verify host identity and key
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          key="$RUNNER_TEMP/id_oracle"
          printf '%s\n' "$SSH_KEY" > "$key"
          chmod 0600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          known="$RUNNER_TEMP/known_hosts"
          : > "$known"
          for _ in 1 2 3; do
            ssh-keyscan -T 10 -t ed25519,ecdsa,rsa "$ORACLE_HOST" >> "$known" 2>/dev/null || true
            test -s "$known" && break
            sleep 2
          done
          sort -u -o "$known" "$known"
          test -s "$known"
          actual="$(ssh-keygen -lf "$known" | awk '{print $2}' | sort -u | paste -sd, -)"
          expected="$(printf '%s\n' \
            'SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk' \
            'SHA256:UGJo5yPdnk/wf8DVrzvXt2xJkE9GJ8+3IIcQ2vA+mkc' \
            'SHA256:eRCJ8c4V7HCBlIoNVSlpPSWZE5xPUMjBD6f0PvHDj64' | sort -u | paste -sd, -)"
          [[ "$actual" == "$expected" ]] || { echo ORACLE_HOST_KEY_SET_MISMATCH >&2; exit 1; }
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "known=$known" >> "$GITHUB_OUTPUT"
      - name: Install exact operator
        shell: bash
        run: |
          set -euo pipefail
          ssh_cmd=(ssh -i '${{ steps.ssh.outputs.key }}' -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='${{ steps.ssh.outputs.known }}' -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST")
          "${ssh_cmd[@]}" 'sudo -n true'
          cat ops/universal_video_diana11_operator.sh | "${ssh_cmd[@]}" 'cat > /tmp/universal_video_diana11_operator.sh && chmod 0600 /tmp/universal_video_diana11_operator.sh'
          cat ops/install_universal_video_diana11_operator.sh | "${ssh_cmd[@]}" 'cat > /tmp/install_universal_video_diana11_operator.sh && chmod 0600 /tmp/install_universal_video_diana11_operator.sh'
          "${ssh_cmd[@]}" 'sudo -n env SOURCE_FILE=/tmp/universal_video_diana11_operator.sh bash /tmp/install_universal_video_diana11_operator.sh'
          "${ssh_cmd[@]}" 'sudo -n /usr/local/sbin/universal-video-diana11 status'
          echo ORACLE_DIANA11_OPERATOR_BOOTSTRAP_PASS
      - name: Report status
        if: ${{ success() }}
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Статус «Диана 11»: **FIX_IN_REVIEW → OPERATOR_INSTALLED**. Exact submit/status operator установлен на существующем Oracle; следующий шаг — enqueue transcript-only job. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Report failure
        if: ${{ failure() }}
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Bootstrap operator для «Диана 11» завершился fail-closed; job не отправлен. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
