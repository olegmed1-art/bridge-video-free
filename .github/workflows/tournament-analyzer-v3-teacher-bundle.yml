name: Tournament Analyzer v3 Teacher Bundle

on:
  pull_request:
    paths:
      - "bridge_school_api/tournament_teacher_review_bundle_v3.py"
      - "tools/tournament_teacher_review_bundle_v3.py"
      - "tests/test_tournament_teacher_review_bundle_v3.py"
      - ".github/workflows/tournament-analyzer-v3-teacher-bundle.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  real-teacher-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile bundle modules
        run: |
          python -m py_compile bridge_school_api/tournament_teacher_review_bundle_v3.py
          python -m py_compile tools/tournament_teacher_review_bundle_v3.py
      - name: Run focused contracts
        run: |
          python -m pytest -q \
            tests/test_tournament_teacher_review_queue_v3.py \
            tests/test_tournament_teacher_decisions_v3.py \
            tests/test_tournament_teacher_review_dossier_v3.py \
            tests/test_tournament_teacher_review_bundle_v3.py
      - name: Restore exact historical tournament evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/30041 evidence/29912 evidence/29912-source
          for spec in \
            "9463631738:/tmp/30041.zip:evidence/30041" \
            "9471054929:/tmp/29912-dds3.zip:evidence/29912" \
            "9470920077:/tmp/29912-source.zip:evidence/29912-source"; do
            IFS=: read -r aid zip dest <<< "$spec"
            curl -fsSL --retry 3 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${aid}/zip" \
              -o "$zip"
            unzip -q "$zip" -d "$dest"
          done
          DDS30041="$(find evidence/30041 -type f -name 'diana-30041-round2-dds3.json' -print -quit)"
          DDS29912="$(find evidence/29912 -type f -name 'diana-29912-cross-session-dds3.json' -print -quit)"
          FACTS29912="$(find evidence/29912-source -type d -name facts29912 -print -quit)"
          test -n "$DDS30041" && test -n "$DDS29912" && test -n "$FACTS29912"
          echo "DDS30041=$DDS30041" >> "$GITHUB_ENV"
          echo "DDS29912=$DDS29912" >> "$GITHUB_ENV"
          echo "FACTS29912=$FACTS29912" >> "$GITHUB_ENV"
      - name: Rebuild queue, ledger and dossier from exact evidence
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python tools/tournament_teacher_review_queue_v3.py \
            --facts-30041 data/tournaments/tournament_30041_round2_diana_facts_v1.json \
            --dds3-30041 "$DDS30041" \
            --dds3-29912 "$DDS29912" \
            --facts-29912-dir "$FACTS29912" \
            --per-event-limit 10 \
            --out-json tournament-teacher-review-queue.json \
            --out-md /tmp/tournament-teacher-review-queue.md
          PYTHONPATH="$PWD" python tools/tournament_teacher_decisions_v3.py \
            --queue tournament-teacher-review-queue.json \
            --out tournament-teacher-decision-ledger.json
          PYTHONPATH="$PWD" python tools/tournament_teacher_review_dossier_v3.py \
            --queue tournament-teacher-review-queue.json \
            --ledger tournament-teacher-decision-ledger.json \
            --facts-30041 data/tournaments/tournament_30041_round2_diana_facts_v1.json \
            --dds3-30041 "$DDS30041" \
            --dds3-29912 "$DDS29912" \
            --out-json tournament-teacher-review-dossier.json \
            --out-md /tmp/tournament-teacher-review-dossier.md
      - name: Build portable hash-bound teacher bundle
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python tools/tournament_teacher_review_bundle_v3.py \
            --queue tournament-teacher-review-queue.json \
            --ledger tournament-teacher-decision-ledger.json \
            --dossier tournament-teacher-review-dossier.json \
            --out-json tournament-teacher-review-bundle.json \
            --out-md tournament-teacher-review-bundle.md
          cat tournament-teacher-review-bundle.md
      - name: Real bundle evidence gate
        run: |
          PYTHONPATH="$PWD" python - <<'PY'
          import json
          from bridge_school_api.tournament_teacher_review_bundle_v3 import verify_teacher_review_bundle
          p=json.load(open('tournament-teacher-review-bundle.json', encoding='utf-8'))
          verify_teacher_review_bundle(p)
          assert p['schema']=='tournament-teacher-review-portable-bundle-v1'
          assert p['review_state']=='PENDING_TEACHER_DECISION'
          assert p['item_count']==17
          assert p['event_counts']=={'29912': 10, '30041': 7}
          assert p['automatic_decisions_allowed'] is False
          assert p['automatic_methodology_mapping_allowed'] is False
          assert p['automatic_student_error_attribution_allowed'] is False
          assert p['cross_event_numeric_ranking_allowed'] is False
          assert set(p['component_sha256'])=={'queue','ledger','dossier'}
          assert all(len(x)==64 for x in p['component_sha256'].values())
          assert len(p['bundle_id'])==64
          print('TOURNAMENT_TEACHER_REVIEW_PORTABLE_BUNDLE_PASS')
          print('bundle_id', p['bundle_id'])
          print('items', p['item_count'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tournament-analyzer-v3-teacher-review-portable-bundle
          path: |
            tournament-teacher-review-bundle.json
            tournament-teacher-review-bundle.md
          if-no-files-found: error
          retention-days: 30
