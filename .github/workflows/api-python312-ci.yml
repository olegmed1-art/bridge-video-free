name: Bridge School API Python 3.12 CI

on:
  pull_request:
    paths:
      - 'app.py'
      - 'bridge_school_api/**'
      - 'bridge_contracts/**'
      - 'assistant_lab/contract.py'
      - 'assistant_lab/dispatch.py'
      - 'tests/test_api_dsn_contract.py'
      - 'tests/test_api_health_contract.py'
      - 'tests/test_api_response_headers.py'
      - 'tests/test_dds3_remote.py'
      - 'tests/test_vercel_oidc_context.py'
      - 'scripts/process_drive_video.py'
      - '.github/workflows/process-video.yml'
      - '.github/workflows/drive-upload-diagnostic.yml'
      - 'pyproject.toml'
      - '.python-version'
      - '.vercelignore'
      - 'vercel.json'
      - '.github/workflows/api-python312-ci.yml'
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'bridge_school_api/**'
      - 'bridge_contracts/**'
      - 'assistant_lab/contract.py'
      - 'assistant_lab/dispatch.py'
      - 'tests/test_api_dsn_contract.py'
      - 'tests/test_api_health_contract.py'
      - 'tests/test_api_response_headers.py'
      - 'tests/test_dds3_remote.py'
      - 'tests/test_vercel_oidc_context.py'
      - 'scripts/process_drive_video.py'
      - '.github/workflows/process-video.yml'
      - '.github/workflows/drive-upload-diagnostic.yml'
      - 'pyproject.toml'
      - '.python-version'
      - '.vercelignore'
      - 'vercel.json'
      - '.github/workflows/api-python312-ci.yml'

permissions:
  contents: read

jobs:
  python-312:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install API dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-api.txt
      - name: Verify Vercel bundle includes only Assistant Lab web wrappers
        run: |
          set -euo pipefail
          grep -Fx '!bridge_school_api' .vercelignore
          grep -Fx '!bridge_contracts' .vercelignore
          grep -Fx '!assistant_lab/' .vercelignore
          grep -Fx 'assistant_lab/**' .vercelignore
          grep -Fx '!assistant_lab/__init__.py' .vercelignore
          grep -Fx '!assistant_lab/contract.py' .vercelignore
          grep -Fx '!assistant_lab/dispatch.py' .vercelignore
          ! grep -Fx '!assistant_lab' .vercelignore
      - name: Compile Python entry points
        run: python -m py_compile app.py bridge_school_api/__init__.py bridge_school_api/db.py bridge_school_api/main.py bridge_school_api/dds3/remote.py bridge_contracts/assistant_lab.py assistant_lab/__init__.py assistant_lab/contract.py assistant_lab/dispatch.py scripts/process_drive_video.py tests/test_api_health_contract.py tests/test_api_response_headers.py tests/test_dds3_remote.py tests/test_vercel_oidc_context.py
      - name: Verify database DSN contract
        run: PYTHONPATH=. python tests/test_api_dsn_contract.py
      - name: Verify public health endpoint contract
        run: PYTHONPATH=. python tests/test_api_health_contract.py
      - name: Verify protected API response headers
        run: PYTHONPATH=. python tests/test_api_response_headers.py
      - name: Verify remote DDS3 fail-closed transport contract
        run: PYTHONPATH=. python tests/test_dds3_remote.py
      - name: Verify Vercel deployment OIDC context contract
        run: PYTHONPATH=. python tests/test_vercel_oidc_context.py
      - name: Import FastAPI application
        run: python -c "from bridge_school_api.main import app; assert app.title == 'Bridge School API'"
