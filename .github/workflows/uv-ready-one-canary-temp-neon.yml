name: Universal Video temporary Neon queue evidence

on:
  push:
    branches: ['autopilot/uv-ready-one-canary-20260901']
    paths:
      - '.github/workflows/uv-ready-one-canary-temp-neon.yml'
      - 'database/migrations/0056_universal_video_queue.sql'
      - 'database/rollbacks/0056_universal_video_queue.sql'
      - 'database/tests/uv_ready_one_canary_metadata_only.sql'

permissions:
  contents: read

concurrency:
  group: uv-ready-one-canary-exclusive-temp-neon
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout exact integration source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Validate bounded no-media contract
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF_NAME" == 'autopilot/uv-ready-one-canary-20260901' ]]
          [[ "$(git hash-object database/migrations/0056_universal_video_queue.sql)" == '2093628baa90d091ddc2f0a214800f5204d1fc79' ]]
          [[ "$(git hash-object database/rollbacks/0056_universal_video_queue.sql)" == '09ffcb3e1fdd03b164eefb5ff9066ef103acbcfd' ]]
          [[ "$(git hash-object database/tests/uv_ready_one_canary_metadata_only.sql)" == 'b4573109bab7dc64c8d8f896e737a411c6f159ca' ]]
          grep -F "'synthetic_jobs', 2" database/tests/uv_ready_one_canary_metadata_only.sql >/dev/null
          grep -F "'media_execution', 'DISABLED'" database/tests/uv_ready_one_canary_metadata_only.sql >/dev/null
          ! grep -Eiq 'ASR|OCR|DDS3|BEN|Diana|media execution enabled' database/tests/uv_ready_one_canary_metadata_only.sql
          echo 'UV_TEMP_NEON_CONTRACT=PASS'

  queue-evidence:
    if: github.repository == 'olegmed1-art/bridge-video-free'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: database-production
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      SOURCE_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      PROJECT_ID: misty-poetry-18012774
      PARENT_BRANCH_ID: br-cold-moon-a1sgkzfd
      EXPECTED_MAIN_SHA: 1f866040f407f4a3c2571fa6c44554dfc9b95f79
      MEDIA_EXECUTION: DISABLED
    steps:
      - name: Checkout exact integration source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Initialize bounded receipt state
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          printf '%s\n' 'UV_TEMP_NEON_RESULT=UNKNOWN' > "$RUNNER_TEMP/uv-state"
          printf '%s\n' 'UV_TEMP_NEON_DELETE=NOT_CREATED' > "$RUNNER_TEMP/uv-delete-state"
          printf '%s\n' 'UV_TEMP_NEON_BRANCH_ID=NOT_CREATED' > "$RUNNER_TEMP/uv-branch-state"

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client >/dev/null

      - name: Create exclusive expiring Neon branch
        id: branch
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "${NEON_API_KEY:-}" ]] || { echo 'UV_TEMP_NEON_API_KEY_MISSING'; exit 20; }
          [[ -n "${SOURCE_DATABASE_URL:-}" ]] || { echo 'UV_TEMP_NEON_DATABASE_URL_MISSING'; exit 21; }
          [[ "$PARENT_BRANCH_ID" == 'br-cold-moon-a1sgkzfd' ]]

          branch_name="uv-one-canary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          expires_at="$(date -u -d '+4 hours' '+%Y-%m-%dT%H:%M:%SZ')"
          request="$RUNNER_TEMP/uv-create-request.json"
          response="$RUNNER_TEMP/uv-create-response.json"
          jq -n \
            --arg name "$branch_name" \
            --arg parent "$PARENT_BRANCH_ID" \
            --arg expires "$expires_at" \
            '{branch:{name:$name,parent_id:$parent,expires_at:$expires},endpoints:[{type:"read_write"}]}' \
            > "$request"

          http_code="$(curl --silent --show-error \
            --output "$response" --write-out '%{http_code}' \
            --request POST \
            "https://console.neon.tech/api/v2/projects/${PROJECT_ID}/branches" \
            --header 'Accept: application/json' \
            --header "Authorization: Bearer ${NEON_API_KEY}" \
            --header 'Content-Type: application/json' \
            --data-binary "@$request")"
          rm -f "$request"
          [[ "$http_code" == '200' || "$http_code" == '201' ]] || {
            echo 'UV_TEMP_NEON_CREATE_FAILED'
            rm -f "$response"
            exit 22
          }

          branch_id="$(jq -er '.branch.id' "$response")"
          parent_id="$(jq -er '.branch.parent_id' "$response")"
          endpoint_host="$(jq -er '[.endpoints[] | select(.type == "read_write") | .host][0]' "$response")"
          [[ "$branch_id" =~ ^br-[a-z0-9-]+$ ]]
          [[ "$branch_id" != "$PARENT_BRANCH_ID" ]]
          [[ "$parent_id" == "$PARENT_BRANCH_ID" ]]
          [[ "$endpoint_host" =~ ^ep-[a-z0-9-]+\..+\.neon\.tech$ ]]
          printf '%s\n' "$branch_id" > "$RUNNER_TEMP/uv-branch-id"
          printf '%s\n' "$endpoint_host" > "$RUNNER_TEMP/uv-endpoint-host"
          printf 'UV_TEMP_NEON_BRANCH_ID=%s\n' "$branch_id" > "$RUNNER_TEMP/uv-branch-state"
          echo "branch_id=$branch_id" >> "$GITHUB_OUTPUT"
          echo "endpoint_host_sha256=$(printf '%s' "$endpoint_host" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          rm -f "$response"
          echo 'UV_TEMP_NEON_BRANCH_CREATED=PASS'

      - name: Derive child-only connection without contacting parent host
        shell: bash
        run: |
          set -Eeuo pipefail
          SOURCE_DATABASE_URL="$SOURCE_DATABASE_URL" \
          ENDPOINT_HOST="$(cat "$RUNNER_TEMP/uv-endpoint-host")" \
          OUTPUT_PATH="$RUNNER_TEMP/uv-database-url" \
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import urllib.parse

          raw = os.environ['SOURCE_DATABASE_URL']
          endpoint_host = os.environ['ENDPOINT_HOST'].lower()
          output_path = pathlib.Path(os.environ['OUTPUT_PATH'])
          parsed = urllib.parse.urlsplit(raw)
          source_host = (parsed.hostname or '').lower()
          assert parsed.scheme in {'postgres', 'postgresql'}
          assert source_host.endswith('.neon.tech')
          assert endpoint_host.endswith('.neon.tech')
          assert endpoint_host != source_host
          assert re.fullmatch(r'ep-[a-z0-9-]+\..+\.neon\.tech', endpoint_host)
          user = urllib.parse.quote(parsed.username or '', safe='')
          password = urllib.parse.quote(parsed.password or '', safe='')
          assert user and password
          port = f':{parsed.port}' if parsed.port else ''
          target = urllib.parse.urlunsplit(
              (parsed.scheme, f'{user}:{password}@{endpoint_host}{port}', parsed.path, parsed.query, parsed.fragment)
          )
          output_path.write_text(target, encoding='utf-8')
          output_path.chmod(0o600)
          print(f'::add-mask::{target}')
          print('SOURCE_NEON_HOST_CONTACTED=NO')
          print('PRODUCTION_BRANCH_TARGETED=NO')
          PY

      - name: Wait for exclusive child compute
        shell: bash
        run: |
          set -Eeuo pipefail
          database_url="$(cat "$RUNNER_TEMP/uv-database-url")"
          ready=0
          for _ in $(seq 1 40); do
            if psql "$database_url" -X -A -t -v ON_ERROR_STOP=1 -c 'SELECT 1' >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 3
          done
          [[ "$ready" == 1 ]] || { echo 'UV_TEMP_NEON_COMPUTE_NOT_READY'; exit 23; }
          echo 'UV_TEMP_NEON_COMPUTE_READY=PASS'

      - name: Verify clean child prestate
        shell: bash
        run: |
          set -Eeuo pipefail
          database_url="$(cat "$RUNNER_TEMP/uv-database-url")"
          pre="$(psql "$database_url" -X -A -t -F '|' -v ON_ERROR_STOP=1 <<'SQL'
          SELECT current_database(),
                 to_regnamespace('video_queue') IS NULL,
                 NOT EXISTS (
                     SELECT 1 FROM public.schema_migration
                     WHERE migration_key='0056_universal_video_queue'
                 );
          SQL
          )"
          [[ "$pre" == 'neondb|t|t' ]] || { echo 'UV_TEMP_NEON_PRESTATE_NOT_CLEAN'; exit 24; }
          echo 'UV_TEMP_NEON_PRESTATE=PASS'

      - name: Apply migration 0056 only
        shell: bash
        run: |
          set -Eeuo pipefail
          database_url="$(cat "$RUNNER_TEMP/uv-database-url")"
          if ! psql "$database_url" -X -v ON_ERROR_STOP=1 \
            -f database/migrations/0056_universal_video_queue.sql \
            >"$RUNNER_TEMP/uv-apply.log" 2>&1; then
            echo 'UV_TEMP_NEON_MIGRATION_0056_FAILED'
            exit 25
          fi
          echo 'UV_TEMP_NEON_MIGRATION_0056=PASS'

      - name: Run two-job metadata-only state-machine cycle
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$MEDIA_EXECUTION" == 'DISABLED' ]]
          database_url="$(cat "$RUNNER_TEMP/uv-database-url")"
          if ! psql "$database_url" -X -v ON_ERROR_STOP=1 \
            -f database/tests/uv_ready_one_canary_metadata_only.sql \
            >"$RUNNER_TEMP/uv-metadata-test.log" 2>&1; then
            echo 'UV_TEMP_NEON_METADATA_CYCLE_FAILED'
            exit 26
          fi
          grep -F '"gate" : "UV_QUEUE_METADATA_ONLY"' "$RUNNER_TEMP/uv-metadata-test.log" >/dev/null \
            || grep -F 'UV_QUEUE_METADATA_ONLY' "$RUNNER_TEMP/uv-metadata-test.log" >/dev/null
          echo 'UV_TEMP_NEON_METADATA_CYCLE=PASS'

      - name: Prove rollback refuses a non-empty queue
        shell: bash
        run: |
          set -Eeuo pipefail
          database_url="$(cat "$RUNNER_TEMP/uv-database-url")"
          set +e
          psql "$database_url" -X -v ON_ERROR_STOP=1 \
            -f database/rollbacks/0056_universal_video_queue.sql \
            >"$RUNNER_TEMP/uv-rollback-nonempty.log" 2>&1
          rc=$?
          set -e
          [[ "$rc" -ne 0 ]]
          grep -F 'VIDEO_QUEUE_ROLLBACK_REFUSES_NONEMPTY_QUEUE' \
            "$RUNNER_TEMP/uv-rollback-nonempty.log" >/dev/null
          echo 'UV_TEMP_NEON_ROLLBACK_NONEMPTY_REFUSAL=PASS'

      - name: Empty queue, rollback, reapply, and rollback cleanly
        shell: bash
        run: |
          set -Eeuo pipefail
          database_url="$(cat "$RUNNER_TEMP/uv-database-url")"
          psql "$database_url" -X -v ON_ERROR_STOP=1 >/dev/null <<'SQL'
          TRUNCATE video_queue.job_event, video_queue.job, video_queue.batch RESTART IDENTITY CASCADE;
          SQL
          psql "$database_url" -X -v ON_ERROR_STOP=1 \
            -f database/rollbacks/0056_universal_video_queue.sql >/dev/null
          absent="$(psql "$database_url" -X -A -t -F '|' -v ON_ERROR_STOP=1 <<'SQL'
          SELECT to_regnamespace('video_queue') IS NULL,
                 NOT EXISTS (
                     SELECT 1 FROM public.schema_migration
                     WHERE migration_key='0056_universal_video_queue'
                 );
          SQL
          )"
          [[ "$absent" == 't|t' ]]
          psql "$database_url" -X -v ON_ERROR_STOP=1 \
            -f database/migrations/0056_universal_video_queue.sql >/dev/null
          psql "$database_url" -X -v ON_ERROR_STOP=1 \
            -f database/rollbacks/0056_universal_video_queue.sql >/dev/null
          final_absent="$(psql "$database_url" -X -A -t -F '|' -v ON_ERROR_STOP=1 <<'SQL'
          SELECT to_regnamespace('video_queue') IS NULL,
                 NOT EXISTS (
                     SELECT 1 FROM public.schema_migration
                     WHERE migration_key='0056_universal_video_queue'
                 );
          SQL
          )"
          [[ "$final_absent" == 't|t' ]]
          printf '%s\n' 'UV_TEMP_NEON_RESULT=PASS' > "$RUNNER_TEMP/uv-state"
          echo 'UV_TEMP_NEON_ROLLBACK_AND_REAPPLY=PASS'

      - name: Delete exclusive temporary branch
        id: cleanup
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! -s "$RUNNER_TEMP/uv-branch-id" ]]; then
            printf '%s\n' 'UV_TEMP_NEON_DELETE=NOT_CREATED' > "$RUNNER_TEMP/uv-delete-state"
            exit 0
          fi
          [[ -n "${NEON_API_KEY:-}" ]] || {
            printf '%s\n' 'UV_TEMP_NEON_DELETE=API_KEY_MISSING' > "$RUNNER_TEMP/uv-delete-state"
            exit 1
          }
          branch_id="$(cat "$RUNNER_TEMP/uv-branch-id")"
          [[ "$branch_id" =~ ^br-[a-z0-9-]+$ ]]
          [[ "$branch_id" != "$PARENT_BRANCH_ID" ]]
          response="$RUNNER_TEMP/uv-delete-response.json"
          http_code="$(curl --silent --show-error \
            --output "$response" --write-out '%{http_code}' \
            --request DELETE \
            "https://console.neon.tech/api/v2/projects/${PROJECT_ID}/branches/${branch_id}" \
            --header 'Accept: application/json' \
            --header "Authorization: Bearer ${NEON_API_KEY}")"
          rm -f "$response"
          [[ "$http_code" == '200' || "$http_code" == '202' ]] || {
            printf '%s\n' 'UV_TEMP_NEON_DELETE=FAILED_AUTO_EXPIRY_RETAINED' > "$RUNNER_TEMP/uv-delete-state"
            exit 1
          }
          printf '%s\n' 'UV_TEMP_NEON_DELETE=PASS' > "$RUNNER_TEMP/uv-delete-state"
          echo 'UV_TEMP_NEON_BRANCH_DELETE=PASS'

      - name: Build secret-safe retained receipt
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          result="$(cut -d= -f2- "$RUNNER_TEMP/uv-state" 2>/dev/null || echo UNKNOWN)"
          delete_state="$(cut -d= -f2- "$RUNNER_TEMP/uv-delete-state" 2>/dev/null || echo UNKNOWN)"
          branch_id="$(cut -d= -f2- "$RUNNER_TEMP/uv-branch-state" 2>/dev/null || echo NOT_CREATED)"
          endpoint_hash="${{ steps.branch.outputs.endpoint_host_sha256 }}"
          jq -n \
            --arg gate 'UV_TEMP_NEON_QUEUE_EVIDENCE' \
            --arg result "$result" \
            --arg delete_state "$delete_state" \
            --arg branch_id "$branch_id" \
            --arg endpoint_host_sha256 "$endpoint_hash" \
            --arg github_sha "$GITHUB_SHA" \
            --arg expected_main_sha "$EXPECTED_MAIN_SHA" \
            --arg migration_blob '2093628baa90d091ddc2f0a214800f5204d1fc79' \
            --arg rollback_blob '09ffcb3e1fdd03b164eefb5ff9066ef103acbcfd' \
            --arg test_blob 'b4573109bab7dc64c8d8f896e737a411c6f159ca' \
            '{
              gate:$gate,
              result:$result,
              temporary_branch_delete:$delete_state,
              temporary_branch_id:$branch_id,
              endpoint_host_sha256:$endpoint_host_sha256,
              github_sha:$github_sha,
              expected_main_sha:$expected_main_sha,
              migration_blob:$migration_blob,
              rollback_blob:$rollback_blob,
              test_blob:$test_blob,
              synthetic_jobs:2,
              media_execution:"DISABLED",
              drive_writes:"NONE",
              production_branch_targeted:false,
              publication_state:"NOT_PUBLISHED",
              canonical_promotion_allowed:false,
              database_persistence_allowed:false
            }' > uv-temp-neon-receipt.json
          cat uv-temp-neon-receipt.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload retained receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: uv-temp-neon-queue-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: uv-temp-neon-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce final queue-evidence gate
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          result="$(cut -d= -f2- "$RUNNER_TEMP/uv-state" 2>/dev/null || echo UNKNOWN)"
          delete_state="$(cut -d= -f2- "$RUNNER_TEMP/uv-delete-state" 2>/dev/null || echo UNKNOWN)"
          [[ "$result" == 'PASS' ]]
          [[ "$delete_state" == 'PASS' ]]
          echo 'UV_TEMP_NEON_QUEUE_EVIDENCE=PASS'
