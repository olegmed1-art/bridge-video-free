name: ISSUE 840 read-only server transcript replay

on:
  push:
    branches: [ops/840-server-transcript-replay]

permissions:
  contents: read

concurrency:
  group: issue-840-server-transcript-replay
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      INSTANCE_ID: ocid1.instance.oc1.eu-frankfurt-1.antheljtruoejaica7hj5oubnh2cctnjr7ti7llcgo6ho6wdvgvui6td7saq
      OCI_CLI_CONFIG: ${{ secrets.OCI_CLI_CONFIG }}
      OCI_KEY: ${{ secrets.OCI_CLI_KEY_CONTENT }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Configure bounded OCI client
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OCI_CLI_CONFIG:-}"
          test -n "${OCI_KEY:-}"
          python -m pip install --disable-pip-version-check -q 'oci-cli==3.90.3'
          umask 077
          mkdir -p "$HOME/.oci"
          if [[ "$OCI_KEY" == base64:* ]]; then
            printf '%s' "${OCI_KEY#base64:}" | base64 --decode > "$HOME/.oci/oci_api_key.pem"
          else
            printf '%s\n' "$OCI_KEY" > "$HOME/.oci/oci_api_key.pem"
          fi
          printf '%s\n' "$OCI_CLI_CONFIG" > "$HOME/.oci/config"
          openssl pkey -in "$HOME/.oci/oci_api_key.pem" -traditional -out "$HOME/.oci/key.pem"
          mv "$HOME/.oci/key.pem" "$HOME/.oci/oci_api_key.pem"
          fingerprint="$(openssl pkey -in "$HOME/.oci/oci_api_key.pem" -pubout -outform DER | openssl md5 -r | awk '{print $1}' | sed 's/../&:/g;s/:$//')"
          FINGERPRINT="$fingerprint" python - <<'PY'
          import os
          from pathlib import Path
          p=Path.home()/'.oci/config'
          lines=[]; found=set()
          for line in p.read_text().splitlines():
              key=line.strip().split('=',1)[0]
              if key=='key_file': lines.append(f'key_file={Path.home()}/.oci/oci_api_key.pem'); found.add(key)
              elif key=='region': lines.append('region=eu-frankfurt-1'); found.add(key)
              elif key=='fingerprint': lines.append('fingerprint='+os.environ['FINGERPRINT']); found.add(key)
              else: lines.append(line)
          if 'key_file' not in found: lines.append(f'key_file={Path.home()}/.oci/oci_api_key.pem')
          if 'region' not in found: lines.append('region=eu-frankfurt-1')
          if 'fingerprint' not in found: lines.append('fingerprint='+os.environ['FINGERPRINT'])
          p.write_text('\n'.join(lines)+'\n')
          PY
          chmod 0600 "$HOME/.oci/config" "$HOME/.oci/oci_api_key.pem"

      - name: Find and replay completed transcript artifacts read-only
        shell: bash
        run: |
          set -euo pipefail
          compartment="$(oci compute instance get --instance-id "$INSTANCE_ID" --query 'data."compartment-id"' --raw-output)"
          state="$(oci compute instance get --instance-id "$INSTANCE_ID" --query 'data."lifecycle-state"' --raw-output)"
          [[ "$state" == RUNNING ]]
          remote="$(cat <<'REMOTE'
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from collections import Counter, defaultdict
          from pathlib import Path

          root=Path('/opt/bridge-school/universal-video/spool/results')
          output=[]
          for job in sorted(root.iterdir()) if root.is_dir() else []:
              transcript=job/'transcript.jsonl'
              speaker=job/'speaker_diarization.json'
              if not transcript.is_file():
                  continue
              try:
                  rows=[json.loads(line) for line in transcript.read_text(encoding='utf-8').splitlines() if line.strip()]
                  report=json.loads(speaker.read_text(encoding='utf-8')) if speaker.is_file() else {}
              except Exception:
                  output.append({'job_id':job.name,'state':'INCONCLUSIVE','reason':'INVALID_RESULT_ARTIFACT'})
                  continue
              counts=Counter(str(row.get('speaker') or '') for row in rows if row.get('speaker'))
              total_duration=labeled_duration=0.0
              for row in rows:
                  try: duration=max(0.0,float(row.get('end'))-float(row.get('start')))
                  except Exception: duration=0.0
                  total_duration+=duration
                  if row.get('speaker'): labeled_duration+=duration
              seg_cov=sum(counts.values())/len(rows) if rows else 0.0
              dur_cov=labeled_duration/total_duration if total_duration else 0.0
              evidence=report.get('speaker_count_evidence')
              open_set=bool(isinstance(evidence,dict) and evidence.get('mode')=='OPEN_SET')
              output.append({
                  'job_id':job.name,
                  'state':'PASS' if open_set and seg_cov>=0.8 and dur_cov>=0.8 else 'INCONCLUSIVE',
                  'segments_total':len(rows),
                  'segments_labeled':sum(counts.values()),
                  'coverage_by_segments':round(seg_cov,4),
                  'coverage_by_duration':round(dur_cov,4),
                  'observed_clusters':len(counts),
                  'speaker_status':report.get('status','UNAVAILABLE'),
                  'open_set_count_proved':open_set,
              })
          print('UV840_REPLAY_BEGIN')
          print(json.dumps({'schema':'uv840-server-transcript-replay-v1','result_scope':'SHADOW_ONLY','jobs':output},separators=(',',':')))
          print('UV840_REPLAY_END')
          PY
          REMOTE
          )"
          content="$(SCRIPT_TEXT="$remote" python -c 'import json,os; print(json.dumps({"source":{"sourceType":"TEXT","text":os.environ["SCRIPT_TEXT"]},"output":{"outputType":"TEXT"}},separators=(",",":")))')"
          target="$(python -c 'import json,os; print(json.dumps({"instanceId":os.environ["INSTANCE_ID"]},separators=(",",":")))')"
          command_id="$(oci instance-agent command create --compartment-id "$compartment" --content "$content" --target "$target" --timeout-in-seconds 300 --display-name "uv840-replay-${GITHUB_RUN_ID}" --query data.id --raw-output)"
          for _ in $(seq 1 90); do
            execution="$(oci instance-agent command-execution get --command-id "$command_id" --instance-id "$INSTANCE_ID" --output json 2>/dev/null || true)"
            [[ -n "$execution" ]] || { sleep 3; continue; }
            lifecycle="$(printf '%s' "$execution" | python -c 'import json,sys; print(json.load(sys.stdin).get("data",{}).get("lifecycle-state",""))')"
            case "$lifecycle" in SUCCEEDED|FAILED|CANCELED|TIMED_OUT) break;; esac
            sleep 3
          done
          [[ "${lifecycle:-}" == SUCCEEDED ]]
          printf '%s' "$execution" | python -c 'import json,sys; d=json.load(sys.stdin).get("data",{}); print((d.get("content") or {}).get("text","") or "")' > "$RUNNER_TEMP/raw.txt"
          python - <<'PY'
          import json, os
          from pathlib import Path
          raw=Path(os.environ['RUNNER_TEMP'],'raw.txt').read_text(encoding='utf-8')
          lines=[line.strip() for line in raw.splitlines()]
          a=lines.index('UV840_REPLAY_BEGIN'); b=lines.index('UV840_REPLAY_END')
          assert b==a+2
          data=json.loads(lines[a+1])
          assert data['schema']=='uv840-server-transcript-replay-v1'
          Path('server-transcript-replay.json').write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('SERVER_TRANSCRIPT_REPLAY_PASS jobs='+str(len(data['jobs'])))
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue-840-server-transcript-replay
          path: server-transcript-replay.json
          if-no-files-found: error
          retention-days: 14
