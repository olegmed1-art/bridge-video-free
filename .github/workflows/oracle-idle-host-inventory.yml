name: Oracle idle guard host inventory

on:
  push:
    branches:
      - autopilot/oracle-idle-stop-guard-627-v2
    paths:
      - '.github/workflows/oracle-idle-host-inventory.yml'

permissions:
  contents: read

concurrency:
  group: oracle-idle-host-inventory-627
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ORACLE_HOST: 158.180.47.161
      ORACLE_USER: ubuntu
      SSH_KEY_ORACLE: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
      SSH_KEY_OCI: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
      SSH_KEY_VM: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
      SSH_KEY_BRIDGE: ${{ secrets.BRIDGE_SCHOOL_ORACLE_SSH_PRIVATE_KEY }}
      SSH_KEY_ORACLE_ALT: ${{ secrets.ORACLE_SSH_KEY }}
      SSH_KEY_OCI_ALT: ${{ secrets.OCI_SSH_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Prepare pinned SSH identity
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          known="$RUNNER_TEMP/oracle-idle-inventory-known-hosts"
          : > "$known"
          index=0
          for expected in \
            'SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk' \
            'SHA256:UGJo5yPdnk/wf8DVrzvXt2xJkE9GJ8+3IIcQ2vA+mkc' \
            'SHA256:eRCJ8c4V7HCBlIoNVSlpPSWZE5xPUMjBD6f0PvHDj64'; do
            part="$RUNNER_TEMP/oracle-idle-inventory-known-hosts.$index"
            ops/oracle_known_hosts_from_scan.sh "$ORACLE_HOST" "$expected" "$part"
            cat "$part" >> "$known"
            index=$((index + 1))
          done
          sort -u -o "$known" "$known"
          selected=''
          for name in SSH_KEY_ORACLE SSH_KEY_OCI SSH_KEY_VM SSH_KEY_BRIDGE SSH_KEY_ORACLE_ALT SSH_KEY_OCI_ALT; do
            if [[ -n "${!name:-}" ]]; then selected="$name"; break; fi
          done
          [[ -n "$selected" ]] || { echo 'Oracle SSH credential unavailable' >&2; exit 1; }
          key="$RUNNER_TEMP/id_oracle_idle_inventory"
          printf '%s\n' "${!selected}" > "$key"
          chmod 0600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "known=$known" >> "$GITHUB_OUTPUT"

      - name: Resolve authoritative telemetry sources read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i '${{ steps.ssh.outputs.key }}' -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile='${{ steps.ssh.outputs.known }}' \
            -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST" \
            'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          LAB_ENV=/opt/bridge-school/assistant-lab/assistant-lab.env
          AUTO_ENV=/opt/bridge-school/school-autopilot/autopilot-shadow.env
          UV_SECRET_ENV=/opt/bridge-school/universal-video/universal-video-secrets.env
          PY=/opt/bridge-school/assistant-lab/.venv/bin/python

          env_value() {
            local file="$1" key="$2"
            awk -F= -v key="$key" '$1==key {sub(/^[^=]*=/,""); print; exit}' "$file" 2>/dev/null
          }

          assistant_dsn="$(env_value "$LAB_ENV" ASSISTANT_LAB_DATABASE_URL)"
          autopilot_dsn="$(env_value "$AUTO_ENV" AUTOPILOT_DATABASE_URL)"
          video_file="$(env_value "$UV_SECRET_ENV" BRIDGE_VIDEO_QUEUE_DATABASE_URL_FILE)"
          if [[ "$video_file" =~ ^/[A-Za-z0-9_./-]+$ && -f "$video_file" && ! -L "$video_file" ]]; then
            video_dsn="$(tr -d '\r\n' < "$video_file")"
            echo "VIDEO_QUEUE_DSN_FILE_PATH=$video_file"
            echo VIDEO_QUEUE_DSN_FILE_STATUS=PRESENT
          else
            video_dsn=''
            echo VIDEO_QUEUE_DSN_FILE_PATH=UNRESOLVED
            echo VIDEO_QUEUE_DSN_FILE_STATUS=UNAVAILABLE
          fi
          [[ -n "$assistant_dsn" ]] && echo ASSISTANT_DSN=AVAILABLE || echo ASSISTANT_DSN=UNAVAILABLE
          [[ -n "$autopilot_dsn" ]] && echo AUTOPILOT_DSN=AVAILABLE || echo AUTOPILOT_DSN=UNAVAILABLE
          [[ -n "$video_dsn" ]] && echo VIDEO_DSN=AVAILABLE || echo VIDEO_DSN=UNAVAILABLE

          ASSISTANT_DSN="$assistant_dsn" AUTOPILOT_DSN="$autopilot_dsn" VIDEO_DSN="$video_dsn" "$PY" - <<'PY'
          import os
          try:
              import psycopg
          except Exception:
              print('PSYCOPG=UNAVAILABLE')
              raise SystemExit(0)

          def probe(label, dsn, sql):
              if not dsn:
                  print(f'{label}=DSN_UNAVAILABLE')
                  return
              try:
                  with psycopg.connect(
                      dsn,
                      connect_timeout=5,
                      application_name='oracle-idle-627-readonly-probe',
                      options='-c default_transaction_read_only=on -c statement_timeout=5000 -c lock_timeout=1000',
                  ) as conn:
                      with conn.cursor() as cur:
                          cur.execute(sql)
                          row = cur.fetchone()
                  print(f"{label}=PASS:{','.join(str(x) for x in row)}")
              except Exception as exc:
                  print(f'{label}=FAIL:{type(exc).__name__}')

          probe(
              'ASSISTANT_IDLE_RPC',
              os.environ.get('ASSISTANT_DSN',''),
              "SELECT schema_version,active_jobs,active_research_jobs,active_research_child_jobs,active_control_commands,active_operator_maintenance_leases,stale_operator_maintenance_leases FROM assistant_lab.oracle_idle_snapshot()",
          )
          probe(
              'AUTOPILOT_ACTIVE',
              os.environ.get('AUTOPILOT_DSN',''),
              "SELECT count(*)::bigint FROM autopilot.task_status WHERE status NOT IN ('OWNER_REQUIRED','FAILED_CLOSED','BUDGET_STOP','DONE','CANCELLED')",
          )
          probe(
              'VIDEO_ACTIVE',
              os.environ.get('VIDEO_DSN',''),
              "SELECT count(*)::bigint FROM video_queue.job_status WHERE status IN ('PENDING_CANARY','QUEUED','LEASED')",
          )
          PY

          for p in \
            /opt/bridge-school/universal-video/spool/inbox \
            /opt/bridge-school/universal-video/spool/running \
            /opt/bridge-school/assistant-lab-observer/jobs/pending \
            /opt/bridge-school/assistant-lab-observer/jobs/running; do
            [[ -d "$p" && ! -L "$p" ]] || { echo "REQUIRED_SPOOL=$p:UNAVAILABLE"; continue; }
            first="$(find "$p" -mindepth 1 -print -quit 2>/dev/null || true)"
            [[ -n "$first" ]] && echo "REQUIRED_SPOOL=$p:NONEMPTY" || echo "REQUIRED_SPOOL=$p:EMPTY"
          done

          echo GUARD_PROOF_BEGIN
          /usr/local/sbin/oracle-idle-state
          echo GUARD_PROOF_END
          REMOTE
