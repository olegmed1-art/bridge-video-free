name: Oracle Light stage native pilot under HOLD

on:
  pull_request:
    paths: ['.github/workflows/light-native-pilot-stage.yml', 'ops/light_native_pilot_release.py', 'tests/test_light_native_pilot_release.py']
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: 'Reviewed exact current main SHA to stage under unchanged HOLD'
        required: true
        type: string

      accepted_package_sha256:
        description: 'Independently accepted SHA256 covering runtime and installer helpers'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'olegmed1-art/bridge-video-free' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && inputs.expected_main_sha == github.sha && 'oracle-light-backup-mutation' || format('light-pilot-stage-noop-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Test stage-only source and HOLD boundaries
        run: |
          python -m pip install pytest "psycopg[binary]>=3.2,<4"
          python -m pytest -q tests/test_light_native_pilot_release.py tests/test_oracle_autopilot_light_native_loader.py
      - name: Exercise root metadata and stage fault injection
        shell: bash
        run: |
          runtime_test_site="$(python -c 'from pathlib import Path; import pytest; print(Path(pytest.__file__).resolve().parent.parent)')"
          sudo -n env PYTHONPATH="$PWD:$runtime_test_site" "$(command -v python)" -m pytest -q tests/test_light_native_pilot_release.py tests/test_oracle_autopilot_light_native_loader.py
      - name: Validate shell syntax
        run: |
          ruby -ryaml -e 'd=YAML.load_file(ARGV[0]); d.fetch("jobs").each_value { |j| j.fetch("steps").each { |s| next unless s["run"]; IO.popen(["bash", "-n"], "w") { |p| p.write(s["run"]) }; abort "invalid shell" unless $?.success? } }' .github/workflows/light-native-pilot-stage.yml

  probe:
    needs: contract
    if: github.repository == 'olegmed1-art/bridge-video-free' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.expected_main_sha == github.sha && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-24.04
    environment: database-production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Stage reviewed candidate without changing the running service
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          SOURCE_REVISION: ${{ github.sha }}
          ACCEPTED_PACKAGE_SHA256: ${{ inputs.accepted_package_sha256 }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          if [[ -z "${SSH_PRIVATE_KEY:-}" ]]; then
            echo 'LIGHT_SSH_KEY=ABSENT'
            exit 1
          fi
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$work/key"
          unset SSH_PRIVATE_KEY
          if ! ssh-keygen -y -P '' -f "$work/key" > "$work/public" 2>/dev/null; then
            echo 'LIGHT_SSH_KEY=INVALID_OR_ENCRYPTED'
            exit 1
          fi
          echo 'LIGHT_SSH_KEY=VALID'
          bash ops/oracle_known_hosts_from_scan.sh 92.5.47.149 SHA256:XBR1x74uJ41BxmDF7Y9P20GjIjNbrYXqieV4c2MC0Go "$work/known_hosts"
          echo 'LIGHT_SSH_HOST=VERIFIED_AGAINST_OWNER_ACCEPTED_FINGERPRINT'
          [[ "$(git rev-parse HEAD)" == "$SOURCE_REVISION" ]]
          git diff --exit-code HEAD --
          [[ "$(gh api repos/olegmed1-art/bridge-video-free/git/ref/heads/main --jq .object.sha)" == "$SOURCE_REVISION" ]]
          unset GH_TOKEN
          python -m ops.light_native_pilot_release program "$SOURCE_REVISION" "$ACCEPTED_PACKAGE_SHA256" > "$work/preflight.py"
          if ! ssh -F /dev/null -i "$work/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$work/known_hosts" -o ConnectTimeout=15 -o ConnectionAttempts=1 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 ubuntu@92.5.47.149 'sudo -n /usr/bin/python3 -I -S -B -' < "$work/preflight.py" > "$work/result" 2> "$work/error"; then
            cat "$work/result"
            echo 'LIGHT_NATIVE_PILOT_STAGE=FAILED'
            if grep -q 'Permission denied' "$work/error"; then echo 'LIGHT_SSH_FAILURE=AUTHORIZATION'; else echo 'LIGHT_SSH_FAILURE=TRANSPORT_OR_REMOTE_COMMAND'; fi
            exit 1
          fi
          cat "$work/result"
