name: Autopilot Universal Video exact runtime image preflight v2

on:
  push:
    branches: [codex/oracle-autopilot-lite-shadow]
    paths: ['.github/workflows/autopilot-uv-runtime-image-preflight-v2.yml']

permissions:
  contents: read

concurrency:
  group: autopilot-uv-runtime-image-preflight-545ef013-v2
  cancel-in-progress: false

jobs:
  exact-image:
    if: github.repository == 'olegmed1-art/bridge-video-free'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      EXACT_RUNTIME_SHA: 545ef0135e3cfe436b918c3ec26f5e2b77500977
      IMAGE_TAG: universal-video-preflight:545ef0135e3c
    steps:
      - name: Initialize fail-closed state
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '%s\n' 'RESOURCE=UNKNOWN' 'BUILD=NOT_RUN' 'IMPORT=NOT_RUN' 'IMAGE_ID=UNAVAILABLE' > "$RUNNER_TEMP/state.env"

      - name: Checkout exact runtime head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: 545ef0135e3cfe436b918c3ec26f5e2b77500977
          persist-credentials: false
          fetch-depth: 1

      - name: Bind source and check disposable-runner resources
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXACT_RUNTIME_SHA" ]]
          [[ -z "$(git status --porcelain)" ]]
          [[ "$(git hash-object deploy/oracle-universal-video/Dockerfile)" == '52db61c75a88f3ff89d22641f432f4ee7b9e7a6f' ]]
          python3 - <<'PY' > "$RUNNER_TEMP/resources.json"
          import json, os, shutil
          disk = shutil.disk_usage(os.environ['GITHUB_WORKSPACE']).free
          mem_kb = 0
          with open('/proc/meminfo', encoding='ascii') as handle:
              for line in handle:
                  if line.startswith('MemAvailable:'):
                      mem_kb = int(line.split()[1]); break
          cpus = os.cpu_count() or 0
          load1 = os.getloadavg()[0]
          receipt = {'disk_free_bytes': disk, 'mem_available_kb': mem_kb, 'cpus': cpus, 'load1': load1}
          print(json.dumps(receipt, sort_keys=True))
          assert disk >= 12 * 1024**3, 'UV_RUNTIME_RESOURCE_DISK_INSUFFICIENT'
          assert mem_kb >= 4 * 1024**2, 'UV_RUNTIME_RESOURCE_MEMORY_INSUFFICIENT'
          assert cpus >= 2, 'UV_RUNTIME_RESOURCE_CPU_INSUFFICIENT'
          assert load1 <= cpus * 2.0, 'UV_RUNTIME_RESOURCE_LOAD_TOO_HIGH'
          PY
          sed -i 's/^RESOURCE=.*/RESOURCE=PASS/' "$RUNNER_TEMP/state.env"
          echo 'UV_RUNTIME_RESOURCE_GATE=PASS'

      - name: Build exact image without activation
        shell: bash
        run: |
          set -Eeuo pipefail
          docker build --file deploy/oracle-universal-video/Dockerfile \
            --label "org.opencontainers.image.revision=$EXACT_RUNTIME_SHA" \
            --iidfile "$RUNNER_TEMP/image-id" --tag "$IMAGE_TAG" .
          image_id="$(cat "$RUNNER_TEMP/image-id")"
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          sed -i 's/^BUILD=.*/BUILD=PASS/' "$RUNNER_TEMP/state.env"
          sed -i "s/^IMAGE_ID=.*/IMAGE_ID=$image_id/" "$RUNNER_TEMP/state.env"
          echo "UV_RUNTIME_IMAGE_ID=$image_id"

      - name: Run network-disabled exact-image import preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/mounts"
          install -d -m 0777 "$root/spool" "$root/media" "$root/model-cache/speaker" "$root/results"
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=536870912 \
            --mount "type=bind,src=$root/spool,dst=/var/lib/universal-video/spool" \
            --mount "type=bind,src=$root/media,dst=/var/lib/universal-video/media" \
            --mount "type=bind,src=$root/model-cache,dst=/var/lib/universal-video/model-cache" \
            --mount "type=bind,src=$root/results,dst=/var/lib/universal-video/results" \
            -e UNIVERSAL_VIDEO_SPEAKER_MODEL_CACHE=/var/lib/universal-video/model-cache/speaker \
            -e BRIDGE_PERSIST_DATABASE=false \
            --entrypoint /usr/local/bin/python "$IMAGE_TAG" - <<'PY'
          import importlib, json, os
          from pathlib import Path
          modules = (
              'universal_video.neon_worker', 'universal_video.container_runtime',
              'bridge_worker_3_1_free', 'bridge_runtime_hardening_r25_16',
              'route_drive_job_outputs', 'bridge_vision', 'bridge_vision.runtime',
              'bridge_contracts', 'bridge_contracts.video_deal', 'database',
          )
          for name in modules:
              importlib.import_module(name)
          cache = Path(os.environ['UNIVERSAL_VIDEO_SPEAKER_MODEL_CACHE'])
          probe = cache / '.write-probe'; probe.write_text('ok\n'); probe.unlink()
          fonts = [Path('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'), Path('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf')]
          assert all(path.is_file() and path.stat().st_size for path in fonts)
          from reportlab.pdfbase import pdfmetrics
          from reportlab.pdfbase.ttfonts import TTFont
          pdfmetrics.registerFont(TTFont('UVDejaVu', str(fonts[0])))
          print(json.dumps({'status':'PASS','modules':len(modules),'speaker_cache_writable':True,'fonts':True,'media_execution':'DISABLED','network':'NONE'}, sort_keys=True))
          PY
          sed -i 's/^IMPORT=.*/IMPORT=PASS/' "$RUNNER_TEMP/state.env"
          echo 'UV_RUNTIME_IMPORT_GATE=PASS'

      - name: Retain exact receipt
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$RUNNER_TEMP/state.env"
          result=FAIL
          [[ "$RESOURCE" == PASS && "$BUILD" == PASS && "$IMPORT" == PASS ]] && result=PASS
          resources='{}'; [[ -f "$RUNNER_TEMP/resources.json" ]] && resources="$(cat "$RUNNER_TEMP/resources.json")"
          jq -n --arg result "$result" --arg runtime_sha "$EXACT_RUNTIME_SHA" --arg workflow_sha "$GITHUB_SHA" \
            --arg image_id "$IMAGE_ID" --arg resource "$RESOURCE" --arg build "$BUILD" --arg import_gate "$IMPORT" \
            --argjson resources "$resources" \
            '{gate:"UV_RUNTIME_EXACT_IMAGE_PREFLIGHT",result:$result,runtime_sha:$runtime_sha,workflow_sha:$workflow_sha,image_id:$image_id,resource_gate:$resource,build_gate:$build,import_gate:$import_gate,resources:$resources,media_execution:"DISABLED",drive_write:false,oracle_contact:false,production_mutation:false}' \
            > uv-runtime-image-preflight-v2.json
          cat uv-runtime-image-preflight-v2.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: uv-runtime-image-preflight-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: uv-runtime-image-preflight-v2.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce terminal gate
        if: always()
        shell: bash
        run: jq -e '.result == "PASS" and .runtime_sha == "545ef0135e3cfe436b918c3ec26f5e2b77500977" and .media_execution == "DISABLED" and .production_mutation == false' uv-runtime-image-preflight-v2.json >/dev/null
