name: Autopilot Universal Video P1 checkpoint

on:
  push:
    branches: [codex/oracle-autopilot-lite-shadow]
    paths: ['.github/workflows/autopilot-uv-p1-checkpoint.yml']

permissions:
  actions: read
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: autopilot-uv-p1-checkpoint
  cancel-in-progress: true

jobs:
  checkpoint:
    if: github.repository == 'olegmed1-art/bridge-video-free'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: olegmed1-art/bridge-video-free
      COORDINATOR_BRANCH: codex/oracle-autopilot-lite-shadow
      RUNTIME_HEAD: 545ef0135e3cfe436b918c3ec26f5e2b77500977
      INTAKE_BASELINE_HEAD: 5af0675a9e13a9725348661be297abc5f52ff0e4
      IDLE_HEAD: ef5f6401e7ba423c063d7c260fdd91733540c7b8
    steps:
      - name: Checkout coordinator source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Wait for current bounded evidence workflows
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          install -d -m 0700 "$RUNNER_TEMP/uv-checkpoint/artifacts"
          workflows=(
            autopilot-uv-idle-guard-latest-evidence.yml
            autopilot-uv-0056-disposable-neon-evidence.yml
            autopilot-uv-idle-latest-register.yml
          )
          printf '[]' > "$RUNNER_TEMP/uv-checkpoint/runs.json"
          for workflow in "${workflows[@]}"; do
            run=''
            for _ in $(seq 1 80); do
              run="$(gh api "repos/$REPO/actions/workflows/$workflow/runs?branch=$COORDINATOR_BRANCH&event=push&per_page=10" \
                --jq '[.workflow_runs[] | select(.status == "completed")][0] // empty')"
              [[ -n "$run" ]] && break
              sleep 10
            done
            if [[ -z "$run" ]]; then
              run="$(jq -n --arg workflow "$workflow" '{name:$workflow,id:null,head_sha:null,status:"missing",conclusion:"UNKNOWN",html_url:null,artifact_ids:[]}')"
            else
              run_id="$(jq -r '.id' <<<"$run")"
              artifacts="$(gh api "repos/$REPO/actions/runs/$run_id/artifacts?per_page=100" --jq '[.artifacts[] | {id,name,expired,size_in_bytes,archive_download_url}]')"
              run="$(jq --arg workflow "$workflow" --argjson artifacts "$artifacts" '{name:$workflow,id:.id,head_sha:.head_sha,status:.status,conclusion:(.conclusion // "UNKNOWN"),html_url:.html_url,artifact_ids:[$artifacts[].id],artifacts:$artifacts}' <<<"$run")"
              while IFS='|' read -r artifact_id artifact_name; do
                [[ -n "$artifact_id" ]] || continue
                zip="$RUNNER_TEMP/uv-checkpoint/artifacts/${artifact_id}.zip"
                gh api "repos/$REPO/actions/artifacts/$artifact_id/zip" > "$zip"
                mkdir -p "$RUNNER_TEMP/uv-checkpoint/artifacts/$artifact_id"
                unzip -q "$zip" -d "$RUNNER_TEMP/uv-checkpoint/artifacts/$artifact_id"
                rm -f "$zip"
                echo "UV_CHECKPOINT_ARTIFACT=$workflow|$artifact_id|$artifact_name"
              done < <(jq -r '.artifacts[]? | select(.expired == false) | [.id,.name] | @tsv' <<<"$run" | tr '\t' '|')
            fi
            jq --argjson run "$run" '. + [$run]' "$RUNNER_TEMP/uv-checkpoint/runs.json" > "$RUNNER_TEMP/uv-checkpoint/runs.next"
            mv "$RUNNER_TEMP/uv-checkpoint/runs.next" "$RUNNER_TEMP/uv-checkpoint/runs.json"
          done
          cat "$RUNNER_TEMP/uv-checkpoint/runs.json"

      - name: Validate retained workflow receipts
        shell: bash
        run: |
          set -Eeuo pipefail
          receipt_dir="$RUNNER_TEMP/uv-checkpoint/artifacts"
          idle_result='UNKNOWN'; neon_result='UNKNOWN'; registration_result='UNKNOWN'; latest_idle_task_id='UNRESOLVED'
          idle_receipt="$(find "$receipt_dir" -type f -name 'uv-idle-stop-guard-receipt.json' -print -quit)"
          neon_receipt="$(find "$receipt_dir" -type f -name 'uv-0056-disposable-neon-receipt.json' -print -quit)"
          registration_receipt="$(find "$receipt_dir" -type f -name 'uv-idle-latest-registration-receipt.json' -print -quit)"
          if [[ -n "$idle_receipt" ]] && jq -e '.gate == "UV_ORACLE_IDLE_STOP_GUARD_LATEST_HEAD" and .idle_head == "ef5f6401e7ba423c063d7c260fdd91733540c7b8" and .result == "PASS" and .unknown_blocks_stop == true and .oracle_contact == false and .oracle_lifecycle_action == "NONE"' "$idle_receipt" >/dev/null; then idle_result='PASS'; fi
          if [[ -n "$neon_receipt" ]] && jq -e '.gate == "UV_0056_DISPOSABLE_NEON_EVIDENCE" and .result == "PASS" and .synthetic_jobs == 2 and .media_execution == "DISABLED" and .drive_writes == "NONE" and .production_branch_mutated == false and .delete_gate == "PASS"' "$neon_receipt" >/dev/null; then neon_result='PASS'; fi
          if [[ -n "$registration_receipt" ]] && jq -e '.gate == "UV_IDLE_LATEST_AUTOPILOT_REGISTRATION" and (.task_id | test("^[0-9a-f-]{36}$")) and .target_head == "ef5f6401e7ba423c063d7c260fdd91733540c7b8" and .production_branch_targeted == false' "$registration_receipt" >/dev/null; then
            registration_result='PASS'
            latest_idle_task_id="$(jq -r '.task_id' "$registration_receipt")"
          fi
          jq -n --arg idle "$idle_result" --arg neon "$neon_result" --arg registration "$registration_result" --arg task_id "$latest_idle_task_id" '{idle_guard_evidence:$idle,migration_0056_evidence:$neon,idle_task_registration:$registration,latest_idle_task_id:$task_id}' > "$RUNNER_TEMP/uv-checkpoint/receipt-status.json"
          cat "$RUNNER_TEMP/uv-checkpoint/receipt-status.json"

      - name: Snapshot exact PR heads, reviews and unresolved threads
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '[]' > "$RUNNER_TEMP/uv-checkpoint/prs.json"
          for pr in 997 1000 1047 991; do
            info="$(gh api "repos/$REPO/pulls/$pr")"
            head="$(jq -r '.head.sha' <<<"$info")"
            draft="$(jq -r '.draft' <<<"$info")"
            state="$(jq -r '.state' <<<"$info")"
            reviews="$(gh api --paginate "repos/$REPO/pulls/$pr/reviews?per_page=100")"
            exact_reviews="$(jq --arg head "$head" '[.[] | select(.commit_id == $head and (.user.login != "olegmed1-art"))] | length' <<<"$reviews")"
            changes_requested="$(jq --arg head "$head" '[.[] | select(.commit_id == $head and .state == "CHANGES_REQUESTED")] | length' <<<"$reviews")"
            owner='olegmed1-art'; repo_name='bridge-video-free'
            query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved isOutdated comments(first:20){nodes{author{login}commit{oid}path}}}}}}}'
            threads="$(gh api graphql -f query="$query" -f owner="$owner" -f name="$repo_name" -F number="$pr" --jq '.data.repository.pullRequest.reviewThreads.nodes')"
            unresolved="$(jq '[.[] | select((.isResolved|not) and (.isOutdated|not))] | length' <<<"$threads")"
            exact_unresolved="$(jq --arg head "$head" '[.[] | select((.isResolved|not) and (.isOutdated|not)) | select(any(.comments.nodes[]?; .commit.oid == $head))] | length' <<<"$threads")"
            row="$(jq -n --argjson pr "$pr" --arg head "$head" --arg state "$state" --argjson draft "$draft" --argjson exact_reviews "$exact_reviews" --argjson changes_requested "$changes_requested" --argjson unresolved "$unresolved" --argjson exact_unresolved "$exact_unresolved" '{pr:$pr,head:$head,state:$state,draft:$draft,exact_head_independent_reviews:$exact_reviews,exact_head_changes_requested:$changes_requested,unresolved_current_threads:$unresolved,unresolved_threads_with_exact_head_comments:$exact_unresolved}')"
            jq --argjson row "$row" '. + [$row]' "$RUNNER_TEMP/uv-checkpoint/prs.json" > "$RUNNER_TEMP/uv-checkpoint/prs.next"
            mv "$RUNNER_TEMP/uv-checkpoint/prs.next" "$RUNNER_TEMP/uv-checkpoint/prs.json"
          done
          cat "$RUNNER_TEMP/uv-checkpoint/prs.json"

      - name: Build unified checkpoint receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          main_sha="$(gh api "repos/$REPO/branches/main" --jq '.commit.sha')"
          runtime_ci="$(gh api "repos/$REPO/commits/$RUNTIME_HEAD/check-runs?per_page=100" -H 'Accept: application/vnd.github+json' --jq '[.check_runs[] | {name,conclusion,status,html_url}]')"
          intake_head="$(jq -r '.[] | select(.pr == 1000) | .head' "$RUNNER_TEMP/uv-checkpoint/prs.json")"
          intake_ci="$(gh api "repos/$REPO/commits/$intake_head/check-runs?per_page=100" -H 'Accept: application/vnd.github+json' --jq '[.check_runs[] | {name,conclusion,status,html_url}]')"
          idle_ci="$(gh api "repos/$REPO/commits/$IDLE_HEAD/check-runs?per_page=100" -H 'Accept: application/vnd.github+json' --jq '[.check_runs[] | {name,conclusion,status,html_url}]')"
          jq -n \
            --arg gate 'UV_P1_CHECKPOINT' \
            --arg workflow_head "$GITHUB_SHA" \
            --arg main_sha "$main_sha" \
            --arg runtime_head "$RUNTIME_HEAD" \
            --arg intake_head "$intake_head" \
            --arg idle_head "$IDLE_HEAD" \
            --slurpfile runs "$RUNNER_TEMP/uv-checkpoint/runs.json" \
            --slurpfile receipts "$RUNNER_TEMP/uv-checkpoint/receipt-status.json" \
            --slurpfile prs "$RUNNER_TEMP/uv-checkpoint/prs.json" \
            --argjson runtime_ci "$runtime_ci" \
            --argjson intake_ci "$intake_ci" \
            --argjson idle_ci "$idle_ci" \
            '{gate:$gate,workflow_head:$workflow_head,main_sha:$main_sha,runtime_head:$runtime_head,intake_head:$intake_head,idle_head:$idle_head,runs:$runs[0],receipts:$receipts[0],pull_requests:$prs[0],ci:{runtime:$runtime_ci,intake:$intake_ci,idle:$idle_ci},real_video:false,drive_write:false,oracle_lifecycle_action:"NONE",production_mutation:false,verdict:"BLOCKED_UNTIL_EXACT_HEAD_REVIEWS_AND_INTAKE_RECEIPT"}' > uv-p1-checkpoint-receipt.json
          cat uv-p1-checkpoint-receipt.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload retained checkpoint receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: uv-p1-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: uv-p1-checkpoint-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish exact checkpoint to issue 946
        shell: bash
        run: |
          set -Eeuo pipefail
          main_sha="$(jq -r '.main_sha' uv-p1-checkpoint-receipt.json)"
          runtime_review="$(jq -r '.pull_requests[] | select(.pr==997) | "reviews="+(.exact_head_independent_reviews|tostring)+", unresolved="+(.unresolved_current_threads|tostring)' uv-p1-checkpoint-receipt.json)"
          intake_head="$(jq -r '.intake_head' uv-p1-checkpoint-receipt.json)"
          intake_review="$(jq -r '.pull_requests[] | select(.pr==1000) | "reviews="+(.exact_head_independent_reviews|tostring)+", unresolved="+(.unresolved_current_threads|tostring)' uv-p1-checkpoint-receipt.json)"
          idle_review="$(jq -r '.pull_requests[] | select(.pr==1047) | "reviews="+(.exact_head_independent_reviews|tostring)+", unresolved="+(.unresolved_current_threads|tostring)' uv-p1-checkpoint-receipt.json)"
          idle_evidence="$(jq -r '.receipts.idle_guard_evidence' uv-p1-checkpoint-receipt.json)"
          neon_evidence="$(jq -r '.receipts.migration_0056_evidence' uv-p1-checkpoint-receipt.json)"
          idle_registration="$(jq -r '.receipts.idle_task_registration' uv-p1-checkpoint-receipt.json)"
          idle_task_id="$(jq -r '.receipts.latest_idle_task_id' uv-p1-checkpoint-receipt.json)"
          cat > "$RUNNER_TEMP/uv-checkpoint-comment.md" <<EOF
          ## Autopilot P1 exact checkpoint — run ${GITHUB_RUN_ID}

          - current main: \`${main_sha}\`
          - runtime PR #997: \`${RUNTIME_HEAD}\`; ${runtime_review}
          - intake PR #1000: \`${intake_head}\`; ${intake_review}
          - idle-guard PR #1047: \`${IDLE_HEAD}\`; ${idle_review}
          - latest idle-guard retained evidence: \`${idle_evidence}\`
          - disposable Neon migration 0056 evidence: \`${neon_evidence}\`
          - latest idle durable-task registration: \`${idle_registration}\`; task \`${idle_task_id}\`
          - real media: \`NO\`; Drive write: \`NO\`; Oracle lifecycle action: \`NONE\`; production mutation: \`NO\`

          Verdict remains \`BLOCKED\` unless every exact-head review/integrity gate and the integrated metadata-only receipt is readable. No canary or batch was released.
          EOF
          gh issue comment 946 --repo "$REPO" --body-file "$RUNNER_TEMP/uv-checkpoint-comment.md"
