name: Tournament Analyzer v3 Portfolio Decision Intake

on:
  pull_request:
    paths:
      - "bridge_school_api/tournament_teacher_review_portfolio_intake_v3.py"
      - "tests/test_tournament_teacher_review_portfolio_intake_v3.py"
      - ".github/workflows/tournament-analyzer-v3-portfolio-decision-intake.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  real-portfolio-intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests and compile
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m py_compile bridge_school_api/tournament_teacher_review_portfolio_intake_v3.py
          python -m pytest -q tests/test_tournament_teacher_review_portfolio_intake_v3.py
      - name: Restore exact portfolio and source review batches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/portfolio evidence/historical evidence/opening
          for spec in \
            "9569845552:/tmp/portfolio.zip:evidence/portfolio" \
            "9558677983:/tmp/historical.zip:evidence/historical" \
            "9569379785:/tmp/opening.zip:evidence/opening"; do
            IFS=: read -r aid zip dest <<< "$spec"
            curl -fsSL --retry 3 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${aid}/zip" \
              -o "$zip"
            unzip -q "$zip" -d "$dest"
          done
          PORTFOLIO="$(find evidence/portfolio -type f -name 'tournament-teacher-review-portfolio.json' -print -quit)"
          HISTORICAL="$(find evidence/historical -type f -name 'tournament-teacher-review-bundle.json' -print -quit)"
          OPENING="$(find evidence/opening -type f -name 'tournament-30041-opening-lead-review-handoff.json' -print -quit)"
          test -n "$PORTFOLIO" && test -n "$HISTORICAL" && test -n "$OPENING"
          echo "PORTFOLIO=$PORTFOLIO" >> "$GITHUB_ENV"
          echo "HISTORICAL=$HISTORICAL" >> "$GITHUB_ENV"
          echo "OPENING=$OPENING" >> "$GITHUB_ENV"
      - name: Rebuild exact opening-lead portable bundle
        run: |
          PYTHONPATH="$PWD" python - <<'PY'
          import json
          from bridge_school_api.tournament_teacher_review_bundle_v3 import build_teacher_review_bundle, verify_teacher_review_bundle
          h=json.load(open('${{ env.OPENING }}', encoding='utf-8'))
          b=build_teacher_review_bundle(h['queue'], h['decision_ledger'], h['dossier'])
          verify_teacher_review_bundle(b)
          json.dump(b, open('opening-lead-portable-bundle.json','w',encoding='utf-8'), ensure_ascii=False, indent=2)
          PY
      - name: Build inert portfolio-wide decision template
        run: |
          PYTHONPATH="$PWD" python - <<'PY'
          import json
          from bridge_school_api.tournament_teacher_review_portfolio_intake_v3 import (
              build_portfolio_teacher_decision_template,
              apply_portfolio_teacher_decision_intake,
          )
          p=json.load(open('${{ env.PORTFOLIO }}', encoding='utf-8'))
          h=json.load(open('${{ env.HISTORICAL }}', encoding='utf-8'))
          o=json.load(open('opening-lead-portable-bundle.json', encoding='utf-8'))
          bundles=[h,o]
          template=build_portfolio_teacher_decision_template(p,bundles)
          result=apply_portfolio_teacher_decision_intake(p,bundles,template)
          json.dump(template,open('portfolio-decision-intake-template.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          json.dump(result,open('portfolio-decision-intake-result.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          assert p['portfolio_id']=='ea9d926ead13982d4deec40f6f367b568a9dbfef45f71b31ad58a548bb2c5e35'
          assert template['decision_count']==21
          assert len(template['decisions'])==21
          assert all(row['status'] is None for row in template['decisions'])
          assert all(row['explicit_teacher_decision'] is False for row in template['decisions'])
          assert all(row['decision_actor'] is None for row in template['decisions'])
          assert {row['source_bundle_id'] for row in template['decisions']}=={h['bundle_id'],o['bundle_id']}
          assert result['source_bundle_count']==2
          assert result['decided_count']==0
          assert result['pending_count']==21
          assert result['review_state']=='PENDING_TEACHER_DECISIONS'
          assert result['automatic_decisions_allowed'] is False
          assert result['automatic_methodology_mapping_allowed'] is False
          assert result['automatic_student_error_attribution_allowed'] is False
          assert sum(row['pending_count'] for row in result['bundle_results'])==21
          print('TOURNAMENT_PORTFOLIO_DECISION_INTAKE_REAL_PASS')
          print('portfolio_id',p['portfolio_id'])
          print('rows',template['decision_count'],'decided',result['decided_count'],'pending',result['pending_count'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tournament-analyzer-v3-portfolio-decision-intake
          path: |
            portfolio-decision-intake-template.json
            portfolio-decision-intake-result.json
          if-no-files-found: error
          retention-days: 30
