name: PR 1106 Diana 23-26 download once

on:
  push:
    branches: [codex/bridgit-rank-layout-shadow-609]
    paths:
      - '.github/workflows/pr1106-diana23-26-download-once.yml'

permissions:
  contents: read

concurrency:
  group: oracle-instance-workload-mutation
  cancel-in-progress: false

jobs:
  download:
    if: >-
      github.repository == 'olegmed1-art/bridge-video-free' &&
      github.actor == 'olegmed1-art' &&
      github.event.before == '90df05ec500736cf7148ab9948213ef5d84ef30b'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ORACLE_HOST: 158.180.47.161
      ORACLE_USER: ubuntu
      EXPECTED_FINGERPRINT: SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk
      GOOGLE_DRIVE_OAUTH_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_JSON }}
      SSH_KEY_ORACLE: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
      SSH_KEY_OCI: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
      SSH_KEY_VM: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
      SSH_KEY_BRIDGE: ${{ secrets.BRIDGE_SCHOOL_ORACLE_SSH_PRIVATE_KEY }}
      SSH_KEY_ORACLE_ALT: ${{ secrets.ORACLE_SSH_KEY }}
      SSH_KEY_OCI_ALT: ${{ secrets.OCI_SSH_KEY }}
      REMOTE_ROOT: /home/ubuntu/bridge-school-private-media/diana-23-26
      EXPECTED_TOTAL_BYTES: '2476968046'
      MIN_FREE_AFTER_BYTES: '8589934592'

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Validate exact one-shot change
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t changed < <(git diff --name-only "$GITHUB_EVENT_BEFORE" "$GITHUB_SHA")
          [[ ${#changed[@]} -eq 1 ]]
          [[ "${changed[0]}" == '.github/workflows/pr1106-diana23-26-download-once.yml' ]]
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}

      - name: Resolve pinned SSH transport and fresh capacity
        id: ssh
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "${GOOGLE_DRIVE_OAUTH_JSON:-}" ]]
          selected=''
          for name in SSH_KEY_ORACLE SSH_KEY_OCI SSH_KEY_VM SSH_KEY_BRIDGE SSH_KEY_ORACLE_ALT SSH_KEY_OCI_ALT; do
            if [[ -n "${!name:-}" ]]; then selected="$name"; break; fi
          done
          [[ -n "$selected" ]]
          known="$RUNNER_TEMP/known_hosts"
          key="$RUNNER_TEMP/id_oracle"
          ops/oracle_known_hosts_from_scan.sh "$ORACLE_HOST" "$EXPECTED_FINGERPRINT" "$known"
          printf '%s\n' "${!selected}" > "$key"
          chmod 0600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          echo "known=$known" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"

          remote_capacity="$(ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST" 'set -Eeuo pipefail
              [[ "$(hostname)" == bridge-school-dds3-frankfurt ]]
              root=/home/ubuntu/bridge-school-private-media/diana-23-26
              parent=/home/ubuntu/bridge-school-private-media
              [[ ! -L "$parent" && ! -L "$root" ]]
              install -d -m 0700 "$parent" "$root"
              [[ "$(stat -c "%U:%G:%a" "$root")" == ubuntu:ubuntu:700 ]]
              df -B1 --output=avail /home/ubuntu | tail -n1')"
          [[ "$remote_capacity" =~ ^[0-9]+$ ]]
          required=$((EXPECTED_TOTAL_BYTES + MIN_FREE_AFTER_BYTES))
          (( remote_capacity >= required ))
          echo "REMOTE_CAPACITY_PASS free_bytes=$remote_capacity required_bytes=$required"

      - name: Download four exact Drive files and transfer atomically
        shell: bash
        env:
          SSH_KEY: ${{ steps.ssh.outputs.key }}
          KNOWN_HOSTS: ${{ steps.ssh.outputs.known }}
        run: |
          set -Eeuo pipefail
          umask 077
          work="$RUNNER_TEMP/diana-23-26"
          install -d -m 0700 "$work"
          receipt="$work/receipt.tsv"
          : > "$receipt"
          cleanup() {
            rm -f "$work/diana-23.mp4" "$work/diana-24.mp4" "$work/diana-25-2021-09-13.mp4" "$work/diana-26.mp4"
          }
          trap cleanup EXIT

          python -m pip install --disable-pip-version-check -q 'google-auth>=2.30,<3' 'requests>=2.31,<3'

          for index in 0 1 2 3; do
            INDEX="$index" WORK="$work" python - <<'PY' > "$work/source.env"
          from __future__ import annotations

          import os
          import re
          import shlex
          from pathlib import Path

          import requests

          from universal_video.drive_adapter import access_token, download_file, list_folder_files

          folders = [
              "Школа спортивного бриджа",
              "00 — Видеотека — единый архив",
              "01 — Диана",
              "01 — Полный курс",
              "Диана Конвеер",
          ]
          expected = [
              ("Диана 23.mp4", 652603861, "diana-23.mp4"),
              ("Диана 24.mp4", 388557680, "diana-24.mp4"),
              ("Диана 25. 13.09.21.mp4", 643234068, "diana-25-2021-09-13.mp4"),
              ("Диана 26.mp4", 792572437, "diana-26.mp4"),
          ]

          def fail() -> None:
              raise SystemExit("DRIVE_SOURCE_SELECTION_OR_DOWNLOAD_FAILED")

          def exact_children(parent: str | None, name: str) -> list[dict]:
              escaped = name.replace("\\", "\\\\").replace("'", "\\'")
              clauses = [
                  f"name = '{escaped}'",
                  "mimeType = 'application/vnd.google-apps.folder'",
                  "trashed = false",
              ]
              if parent is not None:
                  clauses.append(f"'{parent}' in parents")
              response = requests.get(
                  "https://www.googleapis.com/drive/v3/files",
                  headers={"Authorization": f"Bearer {token}"},
                  params={
                      "q": " and ".join(clauses),
                      "fields": "files(id,name,mimeType,parents,trashed)",
                      "pageSize": 100,
                      "spaces": "drive",
                      "includeItemsFromAllDrives": "true",
                      "supportsAllDrives": "true",
                  },
                  timeout=60,
              )
              if response.status_code != 200:
                  fail()
              payload = response.json()
              items = payload.get("files")
              if not isinstance(items, list):
                  fail()
              return [item for item in items if isinstance(item, dict)]

          try:
              token = access_token()
              parent = None
              for folder_name in folders:
                  matches = exact_children(parent, folder_name)
                  if len(matches) != 1:
                      fail()
                  parent = str(matches[0].get("id") or "")
                  if not re.fullmatch(r"[A-Za-z0-9_-]{10,200}", parent):
                      fail()

              direct = list_folder_files(parent, token)
              source_name, expected_size, target_name = expected[int(os.environ["INDEX"])]
              matches = [
                  item
                  for item in direct
                  if item.get("name") == source_name
                  and item.get("mimeType") == "video/mp4"
                  and int(item.get("size") or 0) == expected_size
                  and item.get("parents") == [parent]
                  and item.get("trashed") is False
              ]
              if len(matches) != 1:
                  fail()
              file_id = str(matches[0].get("id") or "")
              if not re.fullmatch(r"[A-Za-z0-9_-]{10,200}", file_id):
                  fail()
              destination = Path(os.environ["WORK"]) / target_name
              downloaded = download_file(
                  file_id,
                  destination,
                  token,
                  max_bytes=expected_size,
                  metadata=matches[0],
              )
              observed_size = destination.stat().st_size
              observed_sha = str(downloaded.get("_download_sha256") or "").lower()
              if observed_size != expected_size or not re.fullmatch(r"[0-9a-f]{64}", observed_sha):
                  fail()
          except SystemExit:
              raise
          except Exception:
              fail()

          print("SOURCE_NAME=" + shlex.quote(source_name))
          print("SOURCE_BYTES=" + str(expected_size))
          print("SOURCE_SHA256=" + shlex.quote(observed_sha))
          print("LOCAL_PATH=" + shlex.quote(str(destination)))
          print("TARGET_NAME=" + shlex.quote(target_name))
          PY

            source "$work/source.env"
            [[ -f "$LOCAL_PATH" && ! -L "$LOCAL_PATH" ]]
            [[ "$(stat -c %s "$LOCAL_PATH")" == "$SOURCE_BYTES" ]]
            [[ "$(sha256sum "$LOCAL_PATH" | awk '{print $1}')" == "$SOURCE_SHA256" ]]

            remote_final="$REMOTE_ROOT/$TARGET_NAME"
            remote_part="$REMOTE_ROOT/.$TARGET_NAME.part"
            remote_state="$(ssh -i "$SSH_KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN_HOSTS" "$ORACLE_USER@$ORACLE_HOST" "set -Eeuo pipefail
               final='$remote_final'
               if [[ -e \"\$final\" ]]; then
                 [[ -f \"\$final\" && ! -L \"\$final\" ]]
                 printf 'EXISTS %s %s\\n' \"\$(stat -c %s \"\$final\")\" \"\$(sha256sum \"\$final\" | cut -c1-64)\"
               else
                 printf 'ABSENT\\n'
               fi")"

            if [[ "$remote_state" == "EXISTS $SOURCE_BYTES $SOURCE_SHA256" ]]; then
              echo "TRANSFER_REUSED name=$TARGET_NAME bytes=$SOURCE_BYTES"
            else
              [[ "$remote_state" == ABSENT ]]
              ssh -i "$SSH_KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN_HOSTS" "$ORACLE_USER@$ORACLE_HOST" "rm -f '$remote_part'"
              if ! scp -q -i "$SSH_KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN_HOSTS" "$LOCAL_PATH" "$ORACLE_USER@$ORACLE_HOST:$remote_part"; then
                ssh -i "$SSH_KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN_HOSTS" "$ORACLE_USER@$ORACLE_HOST" "rm -f '$remote_part'" || true
                exit 41
              fi
              ssh -i "$SSH_KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN_HOSTS" "$ORACLE_USER@$ORACLE_HOST" "set -Eeuo pipefail
                 [[ -f '$remote_part' && ! -L '$remote_part' ]]
                 [[ \"\$(stat -c %s '$remote_part')\" == '$SOURCE_BYTES' ]]
                 [[ \"\$(sha256sum '$remote_part' | cut -c1-64)\" == '$SOURCE_SHA256' ]]
                 chmod 0600 '$remote_part'
                 mv '$remote_part' '$remote_final'
                 [[ \"\$(stat -c '%U:%G:%a' '$remote_final')\" == 'ubuntu:ubuntu:600' ]]"
              echo "TRANSFER_VERIFIED name=$TARGET_NAME bytes=$SOURCE_BYTES"
            fi
            printf '%s\t%s\t%s\t%s\n' "$SOURCE_NAME" "$TARGET_NAME" "$SOURCE_BYTES" "$SOURCE_SHA256" >> "$receipt"
            rm -f "$LOCAL_PATH"
          done

          RECEIPT="$receipt" python - <<'PY' > "$work/manifest.json"
          import json
          import os
          from pathlib import Path

          rows = []
          for line in Path(os.environ["RECEIPT"]).read_text(encoding="utf-8").splitlines():
              source_name, stored_name, size, sha256 = line.split("\t")
              rows.append({
                  "source_name": source_name,
                  "stored_name": stored_name,
                  "size_bytes": int(size),
                  "sha256": sha256,
              })
          assert len(rows) == 4
          assert sum(item["size_bytes"] for item in rows) == 2476968046
          print(json.dumps({
              "schema": "diana-23-26-download-receipt/v1",
              "status": "DOWNLOADED_VERIFIED",
              "source_mutated": False,
              "recognition_run": False,
              "asr_run": False,
              "frames_extracted": False,
              "canon_or_neon_written": False,
              "files": rows,
          }, ensure_ascii=False, indent=2, sort_keys=True))
          PY
          python -m json.tool "$work/manifest.json" >/dev/null
          scp -q -i "$SSH_KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN_HOSTS" "$work/manifest.json" "$ORACLE_USER@$ORACLE_HOST:$REMOTE_ROOT/.manifest.json.part"
          ssh -i "$SSH_KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN_HOSTS" "$ORACLE_USER@$ORACLE_HOST" "set -Eeuo pipefail
             python3 -m json.tool '$REMOTE_ROOT/.manifest.json.part' >/dev/null
             chmod 0600 '$REMOTE_ROOT/.manifest.json.part'
             mv '$REMOTE_ROOT/.manifest.json.part' '$REMOTE_ROOT/manifest.json'
             [[ \"\$(find '$REMOTE_ROOT' -maxdepth 1 -type f -name '*.mp4' | wc -l)\" == 4 ]]"

          {
            echo '## Diana 23-26 bounded download'
            echo
            echo '- status: `DOWNLOADED_VERIFIED`'
            echo '- files: `4`'
            echo '- total_bytes: `2476968046`'
            echo '- destination: `/home/ubuntu/bridge-school-private-media/diana-23-26`'
            echo '- Drive IDs logged or committed: `false`'
            echo '- recognition / ASR / frame extraction: `false`'
            echo '- Canon / Neon write: `false`'
          } >> "$GITHUB_STEP_SUMMARY"
