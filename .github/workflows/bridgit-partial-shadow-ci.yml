name: Bridgit partial shadow CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'bridge_vision/bridgit_adjacent_candidate_profile.py'
      - 'bridge_vision/bridgit_board_number.py'
      - 'bridge_vision/bridgit_holdout_manifest.py'
      - 'bridge_vision/bridgit_partial_evidence.py'
      - 'bridge_vision/bridgit_partial_gambler_adapter.py'
      - 'bridge_vision/bridgit_partial_pixel_observer.py'
      - 'bridge_vision/gambler_classic_reference.py'
      - 'tests/test_bridge_vision_bridgit_board_number_shadow.py'
      - 'tests/test_bridge_vision_holdout_manifest.py'
      - 'tests/test_bridge_vision_partial_evidence.py'
      - 'tests/test_bridge_vision_partial_gambler_adapter.py'
      - 'tests/test_bridge_vision_partial_pixel_observer.py'
      - 'tests/test_bridge_vision_gambler_classic_reference.py'
      - '.github/workflows/bridgit-partial-shadow-ci.yml'

permissions:
  contents: read

concurrency:
  group: bridgit-partial-shadow-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  offline-synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact PR head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install bounded public dependencies
        run: python -m pip install --disable-pip-version-check 'pytest==8.4.1' 'numpy==2.2.6' 'opencv-python-headless==4.11.0.86'
      - name: Run offline shadow and manifest regressions
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/test_bridge_vision_bridgit_board_number_shadow.py
          tests/test_bridge_vision_holdout_manifest.py
          tests/test_bridge_vision_partial_evidence.py
          tests/test_bridge_vision_partial_gambler_adapter.py
          tests/test_bridge_vision_partial_pixel_observer.py
          tests/test_bridge_vision_gambler_classic_reference.py
