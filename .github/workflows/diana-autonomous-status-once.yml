name: Diana autonomous recognizer status one-shot

on:
  push:
    branches: [codex/diana-autonomous-finalize-20260911]
    paths: ['.github/workflows/diana-autonomous-status-once.yml']

permissions:
  contents: read

jobs:
  status:
    if: github.repository == 'olegmed1-art/bridge-video-free'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ORACLE_HOST: 158.180.47.161
      ORACLE_USER: ubuntu
      EXPECTED_FINGERPRINT: SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk
      SSH_KEY_ORACLE: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
      SSH_KEY_OCI: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
      SSH_KEY_VM: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
      SSH_KEY_BRIDGE: ${{ secrets.BRIDGE_SCHOOL_ORACLE_SSH_PRIVATE_KEY }}
      SSH_KEY_ORACLE_ALT: ${{ secrets.ORACLE_SSH_KEY }}
      SSH_KEY_OCI_ALT: ${{ secrets.OCI_SSH_KEY }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Read bounded recognition status
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/diana-status"
          mkdir -p "$work"
          known="$work/known_hosts"
          ops/oracle_known_hosts_from_scan.sh "$ORACLE_HOST" "$EXPECTED_FINGERPRINT" "$known"
          selected=''
          for name in SSH_KEY_ORACLE SSH_KEY_OCI SSH_KEY_VM SSH_KEY_BRIDGE SSH_KEY_ORACLE_ALT SSH_KEY_OCI_ALT; do
            if [[ -n "${!name:-}" ]]; then selected="$name"; break; fi
          done
          [[ -n "$selected" ]]
          key="$work/id_oracle"
          printf '%s\n' "${!selected}" | tr -d '\r' > "$key"
          chmod 0600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" \
            -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          root=/home/ubuntu/bridge-school-private-media/diana-23-26
          results="$root/autonomous-results-7afc3f1a"
          active=0
          current=none
          elapsed_seconds=0
          cpu_percent=0
          input_percent=unknown
          while IFS= read -r pid; do
            [[ -n "$pid" ]] || continue
            active=$((active + 1))
            command="$(tr '\0' ' ' < "/proc/$pid/cmdline")"
            read -r elapsed_seconds cpu_percent < <(ps -o etimes=,pcpu= -p "$pid")
            for name in diana-23 diana-24 diana-25 diana-26; do
              if [[ "$command" == *"$name"* ]]; then current="$name"; fi
            done
            for descriptor in "/proc/$pid/fd"/*; do
              target="$(readlink "$descriptor" 2>/dev/null || true)"
              if [[ "$target" == *.mp4 && -f "$target" ]]; then
                position="$(awk '$1 == "pos:" {print $2}' "/proc/$pid/fdinfo/${descriptor##*/}")"
                size="$(stat -c %s "$target")"
                input_percent="$((100 * position / size))"
              fi
            done
          done < <(pgrep -f 'tools/bridge_vision_autonomous_video.py' || true)
          completed=0
          for name in diana-23 diana-24 diana-25 diana-26; do
            if [[ -s "$results/$name.json" ]]; then
              completed=$((completed + 1))
              echo "AUTONOMOUS_RECEIPT_READY=$name"
            fi
            if [[ -s "$results/$name.log" ]]; then
              tail -n 4 "$results/$name.log" | sed -E 's#/home/ubuntu/[^ ]+#PRIVATE_PATH#g' | sed "s/^/AUTONOMOUS_LOG_${name}=/"
            fi
          done
          echo "AUTONOMOUS_STATUS active=$active current=$current completed=$completed elapsed_seconds=$elapsed_seconds cpu_percent=$cpu_percent input_percent=$input_percent"
          uptime | sed 's/.*load average: /AUTONOMOUS_LOAD_AVERAGE=/'
          REMOTE

          ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" \
            -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          root=/home/ubuntu/bridge-school-private-media/diana-23-26
          code="$root/autonomous-code-7afc3f1a"
          venv="$root/recognition-diana23/pixel-venv"
          results="$root/autonomous-results-7afc3f1a"
          ROOT="$root" PYTHONPATH="$code" "$venv/bin/python" - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          import cv2

          from bridge_vision.bridgit_played_card_observer import build_suit_bank, observe_played_cards
          from bridge_vision.bridgit_visible_hand_observer import build_rank_bank, decode_frame, observe_frame, parse_profile
          from tools.bridge_vision_autonomous_video import _json

          root = Path(os.environ['ROOT'])
          profile_file = root / 'recognition-diana23/visible-hand-profile-v1.runtime.json'
          profile = parse_profile(_json(profile_file))
          references = {}
          for reference_id, (raw_path, expected_sha) in profile.references.items():
              payload = (profile_file.parent / raw_path).read_bytes()
              assert hashlib.sha256(payload).hexdigest() == expected_sha
              references[reference_id] = decode_frame(payload, profile)
          rank_bank = build_rank_bank(profile, references)
          suit_bank = build_suit_bank(profile, references)
          source = root / 'diana-23.mp4'
          capture = cv2.VideoCapture(str(source))
          assert capture.isOpened()
          fps = float(capture.get(cv2.CAP_PROP_FPS))
          frames = int(capture.get(cv2.CAP_PROP_FRAME_COUNT))
          duration_ms = round(frames * 1000 / fps)
          observations = []
          for timestamp_ms in range(15_000, duration_ms, 5_000):
              capture.set(cv2.CAP_PROP_POS_MSEC, timestamp_ms)
              ok, image = capture.read()
              if not ok:
                  continue
              hands = observe_frame(image, rank_bank, profile)
              played = observe_played_cards(image, rank_bank, suit_bank, profile)
              if played['cards'] or played['status'] == 'CONFLICT':
                  observations.append({
                      'timestamp_ms': timestamp_ms,
                      'hand_status': hands['status'],
                      'hand_cards': [{'card': x['card'], 'seat': x['seat']} for x in hands['cards']],
                      'played_status': played['status'],
                      'played_cards': played['cards'],
                      'played_conflicts': played['conflicts'],
                  })
          capture.release()
          payload = {
              'schema': 'diana-autonomous-numeric-probe/v1',
              'sample_ms': 5000,
              'observations': observations,
          }
          target = root / 'autonomous-results-7afc3f1a/diana-23-numeric-probe.json'
          encoded = json.dumps(payload, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode() + b'\n'
          target.write_bytes(encoded)
          os.chmod(target, 0o600)
          print(f'AUTONOMOUS_NUMERIC_PROBE_PASS observations={len(observations)}')
          PY
          REMOTE

          diagnostic="$RUNNER_TEMP/diana-autonomous-diagnostic"
          mkdir -p "$diagnostic"
          remote_root=/home/ubuntu/bridge-school-private-media/diana-23-26
          scp -q -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" \
            "$ORACLE_USER@$ORACLE_HOST:$remote_root/autonomous-results-7afc3f1a/diana-23.json" \
            "$diagnostic/diana-23.json"
          for name in diana24 diana25 diana26; do
            scp -q -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" \
              "$ORACLE_USER@$ORACLE_HOST:$remote_root/recognition-${name}-canary-v1/profile.json" \
              "$diagnostic/${name}-profile.json"
          done
          chmod 0600 "$diagnostic"/*
          scp -q -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" \
            "$ORACLE_USER@$ORACLE_HOST:$remote_root/autonomous-results-7afc3f1a/diana-23-numeric-probe.json" \
            "$diagnostic/diana-23-numeric-probe.json"
          chmod 0600 "$diagnostic/diana-23-numeric-probe.json"
          echo "DIAGNOSTIC_PATH=$diagnostic" >> "$GITHUB_ENV"

# status probe 5

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diana-autonomous-diagnostic-${{ github.sha }}
          path: ${{ env.DIAGNOSTIC_PATH }}
          if-no-files-found: error
          retention-days: 7
