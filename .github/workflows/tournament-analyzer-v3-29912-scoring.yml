name: Tournament Analyzer v3 29912 Scoring

on:
  pull_request:
    paths:
      - "bridge_school_api/tournament_scoring_context_29912_v3.py"
      - "tools/tournament_29912_scoring_context_v3.py"
      - "tests/test_tournament_scoring_context_29912_v3.py"
      - ".github/workflows/tournament-analyzer-v3-29912-scoring.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  scoring-29912:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile modules
        run: |
          python -m py_compile bridge_school_api/tournament_scoring_context_29912_v3.py
          python -m py_compile tools/tournament_29912_scoring_context_v3.py
      - name: Run focused contracts
        run: |
          python -m pytest -q \
            tests/test_tournament_analyzer_v3.py \
            tests/test_tournament_analyzer_v3_stage2.py \
            tests/test_tournament_real_sources_v3.py \
            tests/test_tournament_scoring_context_29912_v3.py
      - name: Restore exact historical 29912 DDS3 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/29912
          curl -fsSL --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9471054929/zip" \
            -o /tmp/29912.zip
          unzip -q /tmp/29912.zip -d evidence/29912
          DDS29912="$(find evidence/29912 -type f -name 'diana-29912-cross-session-dds3.json' -print -quit)"
          test -n "$DDS29912"
          echo "DDS29912=$DDS29912" >> "$GITHUB_ENV"
      - name: Verify raw MP scale and build context
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python tools/tournament_29912_scoring_context_v3.py \
            --dds3-29912 "$DDS29912" \
            --out-json tournament-29912-mp-context.json \
            --out-md tournament-29912-mp-context.md
          cat tournament-29912-mp-context.md
      - name: Real evidence gate
        run: |
          python - <<'PY'
          import json
          p=json.load(open('tournament-29912-mp-context.json', encoding='utf-8'))
          assert p['schema']=='tournament-29912-mp-outcome-context-v1'
          assert p['event_id']=='29912'
          assert [x['round_no'] for x in p['session_scales']]==[1,2,4,5,6]
          assert len(p['outcomes'])==100
          assert all(x['verified'] is True for x in p['session_scales'])
          assert all(x['absolute_difference'] <= 0.11 for x in p['session_scales'])
          assert p['mp_scale_verified_against_reported_session_scores'] is True
          assert p['dd_to_mp_conversion_available'] is False
          assert p['causal_error_attribution_allowed'] is False
          assert p['pedagogically_recoverable_result_estimated'] is False
          assert p['student_error_attribution_allowed'] is False
          assert all(x['causal_link']=='NOT_ESTABLISHED' for x in p['technical_finding_context'])
          assert all(x['source_consistency_ok'] is True for x in p['technical_finding_context'])
          print('TOURNAMENT_29912_MP_CONTEXT_PASS')
          print('cross_session_mean', round(p['cross_session_observed_mean_percentage'], 4))
          print('below_neutral_mass', round(p['total_below_neutral_mass_percentage_points'], 4))
          print('neutralized_mean', round(p['counterfactual_mean_if_all_below_neutral_were_neutral'], 4))
          print('technical_findings', len(p['technical_finding_context']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tournament-analyzer-v3-29912-scoring-context
          path: |
            tournament-29912-mp-context.json
            tournament-29912-mp-context.md
          if-no-files-found: error
          retention-days: 30
