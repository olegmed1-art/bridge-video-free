name: Oracle idle source model fix once

on:
  push:
    branches: [autopilot/oracle-idle-stop-guard-627-v2]
    paths: ['.github/workflows/oracle-idle-source-model-fix-once.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: autopilot/oracle-idle-stop-guard-627-v2
          fetch-depth: 0
      - name: Apply exact source-model correction
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('ops/oracle_idle_state.sh')
          s = p.read_text(encoding='utf-8')

          old = 'QUEUE_DSN_FILE="${BRIDGE_VIDEO_QUEUE_DSN_FILE:-/opt/bridge-school/universal-video/secrets/video-queue-dsn}"\n'
          new = 'UV_SECRETS_ENV="${UNIVERSAL_VIDEO_SECRETS_ENV_FILE:-$VIDEO_DIR/universal-video-secrets.env}"\nQUEUE_DSN_FILE="${BRIDGE_VIDEO_QUEUE_DSN_FILE:-}"\n'
          assert old in s
          s = s.replace(old, new, 1)

          old = 'REQUIRED_LOCAL_SPOOLS="${ORACLE_IDLE_REQUIRED_LOCAL_SPOOLS:-$LAB_DIR/spool:$LAB_DIR/feedback-spool:$VIDEO_DIR/spool/inbox:$VIDEO_DIR/spool/running:$OBSERVER_DIR/jobs/pending:$OBSERVER_DIR/jobs/running}"'
          new = 'REQUIRED_LOCAL_SPOOLS="${ORACLE_IDLE_REQUIRED_LOCAL_SPOOLS:-$VIDEO_DIR/spool/inbox:$VIDEO_DIR/spool/running:$OBSERVER_DIR/jobs/pending:$OBSERVER_DIR/jobs/running}"'
          assert old in s
          s = s.replace(old, new, 1)

          old = '''  value="${matches[0]#${key}=}"
          if [[ -z "$value" || "$value" == *$'\\r'* ]]; then
            mark_unknown "${source}_dsn_empty_or_invalid"
            return 1
          fi
          printf -v "$destination" '%s' "$value"
          return 0
          }
          '''
          new = '''  value="${matches[0]#${key}=}"
          if [[ "$value" == \\"*\\" && "$value" == *\\" ]]; then
            value="${value:1:${#value}-2}"
          elif [[ "$value" == \\'*\\' && "$value" == *\\' ]]; then
            value="${value:1:${#value}-2}"
          elif [[ "$value" == \\"* || "$value" == *\\" || "$value" == \\'* || "$value" == *\\' ]]; then
            mark_unknown "${source}_dsn_quote_invalid"
            return 1
          fi
          if [[ -z "$value" || "$value" == *$'\\r'* || "$value" == *$'\\n'* ]]; then
            mark_unknown "${source}_dsn_empty_or_invalid"
            return 1
          fi
          printf -v "$destination" '%s' "$value"
          return 0
          }
          '''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''assistant_dsn=""
          autopilot_dsn=""
          queue_dsn=""
          read_single_assignment "$LAB_ENV" 'ASSISTANT_LAB_DATABASE_URL' 'assistant_lab' assistant_dsn || true
          read_single_assignment "$AUTOPILOT_ENV" 'AUTOPILOT_DATABASE_URL' 'autopilot' autopilot_dsn || true

          if [[ ! -f "$QUEUE_DSN_FILE" || -L "$QUEUE_DSN_FILE" || ! -r "$QUEUE_DSN_FILE" ]]; then
          '''
          new = '''assistant_dsn=""
          autopilot_dsn=""
          queue_dsn=""
          read_single_assignment "$LAB_ENV" 'ASSISTANT_LAB_DATABASE_URL' 'assistant_lab' assistant_dsn || true
          read_single_assignment "$AUTOPILOT_ENV" 'AUTOPILOT_DATABASE_URL' 'autopilot' autopilot_dsn || true

          if [[ -z "$QUEUE_DSN_FILE" ]]; then
            read_single_assignment "$UV_SECRETS_ENV" 'BRIDGE_VIDEO_QUEUE_DATABASE_URL_FILE' 'video_queue_file' QUEUE_DSN_FILE || true
          fi
          if [[ -z "$QUEUE_DSN_FILE" || "$QUEUE_DSN_FILE" != /* || "$QUEUE_DSN_FILE" == *'..'* ]]; then
            mark_unknown "video_queue_dsn_path_invalid"
          elif [[ ! -f "$QUEUE_DSN_FILE" || -L "$QUEUE_DSN_FILE" || ! -r "$QUEUE_DSN_FILE" ]]; then
          '''
          assert old in s
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

          bash -n ops/oracle_idle_state.sh
          grep -F 'ORACLE_IDLE_REQUIRED_LOCAL_SPOOLS:-$VIDEO_DIR/spool/inbox:$VIDEO_DIR/spool/running:$OBSERVER_DIR/jobs/pending:$OBSERVER_DIR/jobs/running' ops/oracle_idle_state.sh >/dev/null
          grep -F "BRIDGE_VIDEO_QUEUE_DATABASE_URL_FILE" ops/oracle_idle_state.sh >/dev/null
          ! grep -F '$LAB_DIR/spool:$LAB_DIR/feedback-spool' ops/oracle_idle_state.sh >/dev/null

          git rm .github/workflows/oracle-idle-source-model-fix-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/oracle_idle_state.sh
          git commit -m 'fix(oracle): align idle guard with deployed telemetry sources'
          git push origin HEAD:autopilot/oracle-idle-stop-guard-627-v2
