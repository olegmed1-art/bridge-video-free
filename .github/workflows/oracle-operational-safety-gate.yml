name: Oracle operational safety gate

on:
  pull_request:
    paths:
      - '.github/workflows/oracle-operational-safety-gate.yml'
      - 'ops/oracle_dds3_operational_gate.sh'
      - 'tests/test_oracle_operational_acceptance.py'
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      operation:
        description: Safe operation to execute
        required: true
        type: choice
        options: [preflight, restore-preflight, reboot]
        default: preflight

permissions:
  contents: read
  issues: write

concurrency:
  group: oracle-operational-safety-gate
  cancel-in-progress: false

jobs:
  contract:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Validate fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          ruby -e "require 'yaml'; YAML.parse_file(ARGV.fetch(0))" .github/workflows/oracle-operational-safety-gate.yml
          bash -n ops/oracle_dds3_operational_gate.sh
          grep -F 'oci compute instance action --instance-id "$INSTANCE_ID" --action SOFTRESET' ops/oracle_dds3_operational_gate.sh >/dev/null
          grep -F 'bridge-ben-healthcheck.timer' ops/oracle_dds3_operational_gate.sh >/dev/null
          grep -F 'BACKUP_STATE' ops/oracle_dds3_operational_gate.sh >/dev/null

  operate:
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.comment.user.login == 'olegmed1-art' &&
       (github.event.comment.body == '/oracle-ops preflight' ||
        github.event.comment.body == '/oracle-ops restore-preflight' ||
        github.event.comment.body == '/oracle-ops reboot')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OCI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_KEY: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      OCI_REGION: ${{ secrets.OCI_CLI_REGION }}
      BUDGET_EMAIL: ${{ secrets.OCI_BUDGET_EMAIL || secrets.BUDGET_EMAIL }}
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: '265'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve exact operation
        id: operation
        shell: bash
        env:
          COMMENT: ${{ github.event.comment.body }}
          DISPATCH_OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          operation="${DISPATCH_OPERATION:-}"
          if [[ -z "$operation" ]]; then
            case "$COMMENT" in
              '/oracle-ops preflight') operation=preflight ;;
              '/oracle-ops restore-preflight') operation=restore-preflight ;;
              '/oracle-ops reboot') operation=reboot ;;
              *) exit 20 ;;
            esac
          fi
          [[ "$operation" == preflight || "$operation" == restore-preflight || "$operation" == reboot ]]
          echo "operation=$operation" >> "$GITHUB_OUTPUT"

      - name: Configure pinned OCI CLI credential
        shell: bash
        run: |
          set -euo pipefail
          for value in OCI_USER OCI_TENANCY OCI_FINGERPRINT OCI_KEY OCI_REGION; do
            [[ -n "${!value:-}" ]] || { echo "$value is not configured" >&2; exit 21; }
          done
          python -m pip install --disable-pip-version-check -q 'oci-cli==3.90.3'
          install -d -m 0700 "$HOME/.oci"
          printf '%s' "$OCI_KEY" | python -c '
          import sys
          raw = sys.stdin.read().replace("\\r", "").replace("\\n", "\n")
          if not raw.endswith("\n"):
              raw += "\n"
          open(sys.argv[1], "w", encoding="utf-8", newline="\n").write(raw)
          ' "$HOME/.oci/key.pem"
          chmod 0600 "$HOME/.oci/key.pem"
          python - <<'PY'
          import os
          from pathlib import Path

          def scalar(env_name, config_key):
              lines = [line.strip() for line in os.environ[env_name].replace("\\r", "").splitlines() if line.strip()]
              matches = [line.split("=", 1)[1].strip() for line in lines if line.startswith(config_key + "=")]
              if len(matches) == 1 and matches[0]:
                  return matches[0]
              if not matches and len(lines) == 1 and "=" not in lines[0]:
                  return lines[0]
              raise SystemExit(f"{env_name} is ambiguous; expected one scalar or one {config_key}= entry")

          config = {
              "user": scalar("OCI_USER", "user"),
              "fingerprint": scalar("OCI_FINGERPRINT", "fingerprint"),
              "tenancy": scalar("OCI_TENANCY", "tenancy"),
              "region": scalar("OCI_REGION", "region"),
          }
          text = "[DEFAULT]\n" + "".join(f"{key}={value}\n" for key, value in config.items())
          text += f"key_file={Path.home() / '.oci' / 'key.pem'}\n"
          (Path.home() / ".oci" / "config").write_text(text, encoding="utf-8")
          PY
          chmod 0600 "$HOME/.oci/config"
          oci iam region list --output json >/dev/null

      - name: Execute backup, budget and optional reboot gate
        if: ${{ steps.operation.outputs.operation != 'restore-preflight' }}
        id: gate
        shell: bash
        env:
          OPERATION: ${{ steps.operation.outputs.operation }}
        run: |
          set -euo pipefail
          export REGION="$OCI_REGION"
          export ALLOW_REBOOT=0
          [[ "$OPERATION" == reboot ]] && export ALLOW_REBOOT=1
          export NONINTERACTIVE=1
          export SSH_KEY="$RUNNER_TEMP/no-ssh-control-key"
          export EVIDENCE_FILE="$RUNNER_TEMP/oracle-operational-evidence.json"
          bash ops/oracle_dds3_operational_gate.sh


      - name: Read-only boot-volume restore preflight
        if: ${{ steps.operation.outputs.operation == 'restore-preflight' }}
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          [[ "$OCI_REGION" == "eu-frankfurt-1" ]] || { echo "Refusing non-Frankfurt region" >&2; exit 30; }
          export OCI_CLI_REGION="$OCI_REGION"
          instance_name=bridge-school-dds3-frankfurt
          evidence="$RUNNER_TEMP/oracle-operational-evidence.json"
          roots="$(oci iam compartment list --include-root --all --output json)"
          tenancy_id="$(printf '%s' "$roots" | python -c 'import json,sys; xs=[x["id"] for x in json.load(sys.stdin)["data"] if x.get("id","").startswith("ocid1.tenancy.")]; assert len(xs)==1; print(xs[0])')"
          instances="$(oci compute instance list --compartment-id "$tenancy_id" --display-name "$instance_name" --all --output json)"
          instance_count="$(printf '%s' "$instances" | python -c 'import json,sys; print(len([x for x in json.load(sys.stdin)["data"] if x.get("lifecycle-state") not in {"TERMINATED","TERMINATING"}]))')"
          [[ "$instance_count" == 1 ]] || { echo "Expected exactly one live instance, found $instance_count" >&2; exit 32; }
          instance_id="$(printf '%s' "$instances" | python -c 'import json,sys; print([x for x in json.load(sys.stdin)["data"] if x.get("lifecycle-state") not in {"TERMINATED","TERMINATING"}][0]["id"])')"
          instance_json="$(oci compute instance get --instance-id "$instance_id" --output json)"
          instance_state="$(printf '%s' "$instance_json" | python -c 'import json,sys; print(json.load(sys.stdin)["data"]["lifecycle-state"])')"
          availability_domain="$(printf '%s' "$instance_json" | python -c 'import json,sys; print(json.load(sys.stdin)["data"]["availability-domain"])')"
          [[ "$instance_state" == RUNNING ]] || { echo "Instance is not RUNNING" >&2; exit 33; }
          attachments="$(oci compute boot-volume-attachment list --compartment-id "$tenancy_id" --availability-domain "$availability_domain" --instance-id "$instance_id" --all --output json)"
          attachment_count="$(printf '%s' "$attachments" | python -c 'import json,sys; print(len([x for x in json.load(sys.stdin)["data"] if x.get("lifecycle-state")=="ATTACHED"]))')"
          [[ "$attachment_count" == 1 ]] || { echo "Expected exactly one attached boot volume, found $attachment_count" >&2; exit 34; }
          boot_volume_id="$(printf '%s' "$attachments" | python -c 'import json,sys; print([x for x in json.load(sys.stdin)["data"] if x.get("lifecycle-state")=="ATTACHED"][0]["boot-volume-id"])')"
          boot_volume_json="$(oci bv boot-volume get --boot-volume-id "$boot_volume_id" --output json)"
          boot_volume_size_gb="$(printf '%s' "$boot_volume_json" | python -c 'import json,sys; print(json.load(sys.stdin)["data"]["size-in-gbs"])')"
          backups="$(oci bv boot-volume-backup list --compartment-id "$tenancy_id" --boot-volume-id "$boot_volume_id" --all --output json)"
          backup_json="$(printf '%s' "$backups" | python -c '
          import json,sys
          xs=[x for x in json.load(sys.stdin)["data"] if x.get("lifecycle-state")=="AVAILABLE" and x.get("type")=="FULL" and x.get("source-boot-volume-id")==sys.argv[1]]
          xs.sort(key=lambda x:x.get("time-created",""), reverse=True)
          assert xs, "no AVAILABLE FULL backup for attached production boot volume"
          print(json.dumps(xs[0]))
          ' "$boot_volume_id")"
          backup_state="$(printf '%s' "$backup_json" | python -c 'import json,sys; print(json.load(sys.stdin)["lifecycle-state"])')"
          backup_type="$(printf '%s' "$backup_json" | python -c 'import json,sys; print(json.load(sys.stdin)["type"])')"
          backup_size_gb="$(printf '%s' "$backup_json" | python -c 'import json,sys; print(json.load(sys.stdin).get("size-in-gbs") or "")')"
          [[ "$backup_state" == AVAILABLE && "$backup_type" == FULL ]] || exit 35
          [[ -n "$backup_size_gb" && "$backup_size_gb" -ge "$boot_volume_size_gb" ]] || { echo "Backup capacity is smaller than source volume" >&2; exit 36; }
          STATUS=RESTORE_PREFLIGHT_PASS INSTANCE_STATE="$instance_state" AVAILABILITY_DOMAIN="$availability_domain" \
          BOOT_VOLUME_SIZE_GB="$boot_volume_size_gb" BACKUP_STATE="$backup_state" BACKUP_TYPE="$backup_type" \
          BACKUP_SIZE_GB="$backup_size_gb" python - <<'PY' > "$evidence"
          import json, os
          print(json.dumps({
              "status": os.environ["STATUS"], "instance_state": os.environ["INSTANCE_STATE"],
              "availability_domain": os.environ["AVAILABILITY_DOMAIN"],
              "boot_volume_size_gb": int(os.environ["BOOT_VOLUME_SIZE_GB"]),
              "backup_state": os.environ["BACKUP_STATE"], "backup_type": os.environ["BACKUP_TYPE"],
              "backup_size_gb": int(os.environ["BACKUP_SIZE_GB"]),
              "restore_executed": False, "production_volume_modified": False,
              "evidence_class": "READ_ONLY_RESTORE_PREFLIGHT",
              "next_gate": "isolated_restore_and_acceptance_still_required",
          }, sort_keys=True))
          PY

      - name: Publish sanitized evidence
        if: ${{ always() }}
        shell: bash
        env:
          OPERATION: ${{ steps.operation.outputs.operation }}
          GATE_OUTCOME: ${{ steps.operation.outputs.operation == 'restore-preflight' && steps.restore.outcome || steps.gate.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/oracle-operational-evidence.json"
          body="$RUNNER_TEMP/oracle-operational-report.md"
          EVIDENCE="$evidence" python - <<'PY' > "$body"
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["EVIDENCE"])
          print(f"Oracle operational gate **{os.environ.get('OPERATION') or 'unknown'}**: **{os.environ['GATE_OUTCOME'].upper()}**")
          print()
          if path.is_file():
              x = json.loads(path.read_text(encoding="utf-8"))
              for key in (
                  "status", "shape", "ocpu", "memory_gb", "boot_volume_size_gb",
                  "backup_state", "budget_amount", "budget_email_configured",
                  "rebooted", "host_disk", "host_memory", "control_path",
                  "instance_state", "availability_domain", "backup_type", "backup_size_gb",
                  "restore_executed", "production_volume_modified", "evidence_class", "next_gate",
              ):
                  print(f"- `{key}`: `{x.get(key, 'unknown')}`")
          else:
              print("- Evidence file was not produced; the gate stopped fail-closed before acceptance.")
          print(f"- Run: {os.environ['RUN_URL']}")
          PY
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$body"
