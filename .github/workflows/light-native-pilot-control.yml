name: Oracle Light bounded native pilot control

on:
  pull_request:
    paths: ['.github/workflows/light-native-pilot-control.yml', 'ops/light_native_pilot_control.py', 'tests/test_light_native_pilot_control.py']
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Reviewed current main running this fixed launcher
        required: true
        type: string
      source_sha:
        description: Accepted candidate source (current main for baseline and launch)
        required: true
        type: string
      action:
        description: One accepted control operation
        required: true
        type: choice
        options: [baseline, prepare-retained, launch-retained, launch, observe, restore]
      accepted_package_sha256:
        description: Independently accepted immutable package SHA256
        required: true
        type: string
      accepted_payload_sha256:
        description: Independently accepted canonical operation payload SHA256
        required: true
        type: string
      payload_base64:
        description: Canonical accepted operation data encoded as base64 (no credentials)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'olegmed1-art/bridge-video-free' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && inputs.expected_main_sha == github.sha && 'oracle-instance-workload-mutation' || format('light-pilot-control-noop-{0}', github.run_id) }}
  cancel-in-progress: false
  queue: max

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: |
          python -m pip install 'pytest==8.4.2'
          python -m pytest -q tests/test_light_native_pilot_control.py tests/test_light_native_service_controller.py
      - name: Verify workflow shell syntax
        run: |
          ruby -ryaml -e 'd=YAML.load_file(ARGV[0]); d.fetch("jobs").each_value { |j| j.fetch("steps").each { |s| next unless s["run"]; IO.popen(["bash", "-n"], "w") { |p| p.write(s["run"]) }; abort "invalid shell" unless $?.success? } }' .github/workflows/light-native-pilot-control.yml

  control:
    needs: contract
    if: github.repository == 'olegmed1-art/bridge-video-free' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.expected_main_sha == github.sha && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-24.04
    environment: database-production
    timeout-minutes: 6
    concurrency:
      group: oracle-light-backup-mutation
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Send fixed accepted operation to the durable host controller
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          EXPECTED_MAIN: ${{ inputs.expected_main_sha }}
          PILOT_SOURCE: ${{ inputs.source_sha }}
          PILOT_ACTION: ${{ inputs.action }}
          PILOT_ACCEPTED_PACKAGE: ${{ inputs.accepted_package_sha256 }}
          PILOT_ACCEPTED_PAYLOAD: ${{ inputs.accepted_payload_sha256 }}
          PILOT_PAYLOAD_BASE64: ${{ inputs.payload_base64 }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          if [[ -z "${SSH_PRIVATE_KEY:-}" ]]; then
            echo 'LIGHT_SSH_KEY=ABSENT'
            exit 1
          fi
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$work/key"
          unset SSH_PRIVATE_KEY
          if ! ssh-keygen -y -P '' -f "$work/key" > "$work/public" 2>/dev/null; then
            echo 'LIGHT_SSH_KEY=INVALID_OR_ENCRYPTED'
            exit 1
          fi
          echo 'LIGHT_SSH_KEY=VALID'
          bash ops/oracle_known_hosts_from_scan.sh 92.5.47.149 SHA256:XBR1x74uJ41BxmDF7Y9P20GjIjNbrYXqieV4c2MC0Go "$work/known_hosts"
          echo 'LIGHT_SSH_HOST=VERIFIED_AGAINST_OWNER_ACCEPTED_FINGERPRINT'
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_MAIN" ]]
          git diff --exit-code HEAD --
          [[ "$(gh api repos/olegmed1-art/bridge-video-free/git/ref/heads/main --jq .object.sha)" == "$EXPECTED_MAIN" ]]
          unset GH_TOKEN
          python -m ops.light_native_pilot_control > "$work/preflight.py"
          if ! ssh -F /dev/null -i "$work/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$work/known_hosts" -o ConnectTimeout=15 -o ConnectionAttempts=1 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 ubuntu@92.5.47.149 'sudo -n /usr/bin/python3 -I -S -B -' < "$work/preflight.py" > "$work/result" 2> "$work/error"; then
            cat "$work/result"
            echo 'LIGHT_NATIVE_PILOT_CONTROL=FAILED'
            if grep -q 'Permission denied' "$work/error"; then echo 'LIGHT_SSH_FAILURE=AUTHORIZATION'; else echo 'LIGHT_SSH_FAILURE=TRANSPORT_OR_REMOTE_COMMAND'; fi
            exit 1
          fi
          cat "$work/result"
