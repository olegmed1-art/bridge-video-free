name: DDS3 real vision corpus contract
on:
  pull_request:
    paths:
      - 'tools/dds3_vision/**'
      - 'bridge_school_api/dds3/vision_local.py'
      - 'bridge_school_api/dds3/image_ingress.py'
      - 'bridge_school_api/dds3/screenshot.py'
      - 'dds3_runtime/**'
      - 'requirements-dds3-vision.txt'
      - 'docs/dds3-vision-corpus-field-evidence-*.md'
      - 'docs/dds3-local-vision-field-evidence-*.md'
      - 'docs/dds3-issue236-final-evidence-*.md'
      - '.github/workflows/dds3-vision-corpus.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus-builder-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install local vision dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr
          python -m pip install --disable-pip-version-check -r requirements-dds3-vision.txt
      - name: Compile corpus and local vision code
        run: |
          python -m py_compile tools/dds3_vision/build_federation_corpus.py
          python -m py_compile tools/dds3_vision/evaluate_local_extractor.py
          python -m py_compile bridge_school_api/dds3/vision_local.py
          python -m py_compile bridge_school_api/dds3/image_ingress.py
      - name: Fail-closed geometry contract
        run: |
          python - <<'PY'
          import importlib.util
          import numpy as np
          spec=importlib.util.spec_from_file_location('builder','tools/dds3_vision/build_federation_corpus.py')
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          image=np.zeros((360,380,3),dtype=np.uint8); image[:]=255
          image[0:356,0:115]=[255,255,0]; image[0:356,116:374]=[255,255,0]
          panels=m.detect_yellow_board_panels(image)
          assert len(panels)==1, panels
          x,y,w,h,_=panels[0]
          assert (x,y)==(0,0) and w>=374 and h==356, panels[0]
          blank=np.full((360,380,3),255,dtype=np.uint8)
          assert m.detect_yellow_board_panels(blank)==[]
          print('DDS3_VISION_CORPUS_CONTRACT_PASS')
          PY
      - name: Raw-image fail-closed source contract
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path('bridge_school_api/dds3/vision_local.py').read_text(encoding='utf-8')
          ingress=Path('bridge_school_api/dds3/image_ingress.py').read_text(encoding='utf-8')
          assert 'DECK_VALIDATION_FAILED' in source
          assert 'INCOMPLETE_HAND' in source
          assert 'derive_board_metadata' not in source
          assert 'local_tesseract_federation_yellow_v1' in source
          assert 'image->local_free_vision->52_card_validation->DDS3' in ingress
          assert 'fallback' in ingress and 'paid' in ingress
          assert '_require_raw_vision_evidence' in ingress
          assert 'RAW_VISION_METADATA_MISSING' in ingress
          assert 'RAW_VISION_HAND_CONFIDENCE_MISSING' in ingress
          assert 'RAW_VISION_IMAGE_SHA256_MISMATCH' in ingress
          print('DDS3_LOCAL_VISION_SOURCE_CONTRACT_PASS')
          PY
      - name: Public evidence privacy and metric contract
        run: |
          python - <<'PY'
          from pathlib import Path
          corpus=Path('docs/dds3-vision-corpus-field-evidence-20260821.md').read_text(encoding='utf-8')
          local=Path('docs/dds3-local-vision-field-evidence-20260821.md').read_text(encoding='utf-8')
          final=Path('docs/dds3-issue236-final-evidence-20260822.md').read_text(encoding='utf-8')
          assert '**60**' in corpus
          assert 'DDS3 is not used to create or repair truth' in corpus
          assert '42/60 (70.0%)' in local
          assert 'Accepted but wrong | **0**' in local
          assert '42/42 (100%)' in local
          assert '5/5 were rejected' in local
          for family in (
              'federation yellow panel',
              'publication cross',
              'publication grid',
              'named quadrant',
              'EBU appeals cross',
          ):
              assert family in final, family
          for marker in (
              'Raw image -> vision -> validation -> DDS3 without manual deal structuring: PASS',
              'Stable table + position/all-moves API: PASS',
              'DDS3 provenance / no fallback: PASS',
              'Real golden + position/TT + image negative CI: PASS',
              'Real regression corpus and vision metrics separate from solver: PASS',
          ):
              assert marker in final, marker
          forbidden=('drive.google.com/file/d/','docs.google.com/')
          for text in (corpus,local,final):
              for token in forbidden:
                  assert token not in text, token
          print('DDS3_VISION_PUBLIC_EVIDENCE_PASS')
          PY
