name: DDS Stage 2B v2.5 — temporary preparation evidence

# Temporary read-only execution harness. Close the PR without merging after the
# evidence artifact is verified. No DDS call and no validation/sealed opening.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/dds-stage2b-v25-pr-evidence.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: dds-stage2b-v25-pr-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  TRAIN_ARTIFACT_ID: '9302550154'
  TRAIN_ARTIFACT_ZIP_SHA256: c46cda2fb127371cbc1ab836c74580b25f0a0bb8ab358dfaab97cf591dd8a246
  WORK: dds_training/work/pilot
  OUT: dds_training/work/stage2b-v25
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare-evidence:
    if: >-
      github.actor == 'olegmed1-art' &&
      github.event.pull_request.head.ref == 'dds-stage2b-v25-evidence-20260818'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout temporary evidence merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Compile and run refined Stage 2B contracts
        working-directory: dds_training
        run: |
          set -euo pipefail
          python -m compileall -q .
          python stage2b_blueprint_selftest.py
          python stage2b_v25_selftest.py
          python stage2b_prepare_v25_selftest.py
          python test_runner.py --manifest test_matrix.json --check-only

      - name: Restore exact completed 30k TRAIN artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/dds-main-train "$WORK" "$OUT"
          mkdir -p /tmp/dds-main-train dds_training/work
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${TRAIN_ARTIFACT_ID}/zip" \
            > /tmp/dds-main-train/artifact.zip
          echo "$TRAIN_ARTIFACT_ZIP_SHA256  /tmp/dds-main-train/artifact.zip" | sha256sum -c -
          unzip -q /tmp/dds-main-train/artifact.zip -d /tmp/dds-main-train/extracted
          test -f /tmp/dds-main-train/extracted/dds-main-train-progress-state.tgz
          test -f /tmp/dds-main-train/extracted/dds-main-train-progress-state.sha256
          (cd /tmp/dds-main-train/extracted && sha256sum -c dds-main-train-progress-state.sha256)
          tar -xzf /tmp/dds-main-train/extracted/dds-main-train-progress-state.tgz -C dds_training/work
          test -f "$WORK/training.sqlite3"
          test -f "$WORK/blind_tasks_crossfit.jsonl"
          test -f "$WORK/blind_tasks_crossfit_main.jsonl"
          test -f "$WORK/derived_blind_tasks.jsonl"

      - name: Verify immutable TRAIN closure and holdout isolation
        working-directory: dds_training
        run: |
          set -euo pipefail
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(Path('work/pilot/training.sqlite3'))
          counts = dict(db.execute('select split,count(*) from dds_results group by split'))
          assert counts == {'derived': 2497, 'sealed_test': 3000, 'train': 42000, 'validation': 3000}, counts
          assert db.execute('select count(*) from dds_results').fetchone()[0] == 50497
          events = dict(db.execute('select event_type,count(*) from investigation_events group by event_type'))
          assert events == {'opened': 8140, 'resolved': 8140}, events
          print({'dds_results': 50497, 'train': 42000, 'validation_unchanged': 3000, 'sealed_unchanged': 3000, 'open_investigations': 0})
          PY
          sha256sum work/pilot/training.sqlite3 > /tmp/stage2b-v25-db-before.sha256

      - name: Prepare refined Stage 2B v2.5 from TRAIN facts only
        working-directory: dds_training
        run: |
          set -euo pipefail
          mkdir -p work/stage2b-v25
          python stage2b_prepare_v25.py \
            --work work/pilot \
            --tasks \
              work/pilot/blind_tasks_crossfit.jsonl \
              work/pilot/blind_tasks_crossfit_main.jsonl \
              work/pilot/derived_blind_tasks.jsonl \
            --main-tasks work/pilot/blind_tasks_crossfit_main.jsonl \
            --out work/stage2b-v25 \
            --line-sources 650 \
            --continuations-per-actor 1000 \
            --line-cards 16 \
            --blueprint-families 500 \
            | tee work/stage2b-v25/stage2b_prepare_v25.log

      - name: Verify refined evidence and unchanged database
        working-directory: dds_training
        run: |
          set -euo pipefail
          sha256sum -c /tmp/stage2b-v25-db-before.sha256
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          root = Path('work/stage2b-v25')
          summary = json.loads((root / 'stage2b_summary_v25.json').read_text(encoding='utf-8'))
          ready = summary['readiness']
          assert ready['train_rows'] == 42000, ready
          assert ready['oof_rows'] == 42000, ready
          assert ready['continuation_tasks'] == 2000, ready
          assert ready['continuation_by_actor'] == {'declarer': 1000, 'defense': 1000}, ready
          assert ready['multi_contract_blueprint']['families'] == 500, ready
          assert ready['multi_contract_blueprint']['tasks'] == 10000, ready
          assert ready['multi_contract_blueprint']['dds_called'] is False, ready
          assert ready['multi_contract_blueprint']['predictions_locked'] is False, ready
          assert ready['family_selection']['contract_suit'] == 'candidate_v0.3', ready
          assert ready['family_selection']['opening_lead_suit'] == 'candidate_v0.3', ready
          assert ready['family_selection']['contract_nt'] == 'source_v0.2_fallback', ready
          assert ready['family_selection']['opening_lead_nt'] == 'source_v0.2_fallback', ready
          assert 'NT' in ready['review_queue_strains'], ready
          assert ready['dds_called'] is False
          assert ready['mass_training_started'] is False
          assert ready['validation_opened'] is False
          assert ready['sealed_opened'] is False

          diagnostics = json.loads((root / 'calibration_diagnostics_v25.json').read_text(encoding='utf-8'))
          baseline_groups = [v for k,v in diagnostics['groups'].items() if k.startswith('contract_') and k.endswith(':baseline')]
          assert baseline_groups, diagnostics
          assert max(group['mean_raw_probability'] for group in baseline_groups) <= 0.18 + 1e-12

          comparison = json.loads((root / 'oof_comparison_v03_stratified.json').read_text(encoding='utf-8'))
          primary = comparison['source_versions']['bridge-adaptive-v0.2']
          assert primary['contract_suit']['bootstrap_95_lower'] > 0, primary
          assert primary['opening_lead_suit']['bootstrap_95_lower'] > 0, primary
          assert primary['contract_nt']['candidate_supported'] is False, primary
          assert primary['opening_lead_nt']['candidate_supported'] is False, primary

          manifest = json.loads((root / 'CURRENT_STAGE_MANIFEST.json').read_text(encoding='utf-8'))
          assert manifest['current_algorithm'] == 'dds-learning-v2.5-stage2b-candidate'
          assert manifest['holdout_status'] == 'closed'
          assert manifest['sealed_status'] == 'closed'
          assert manifest['metadata']['dds_results'] == 50497
          assert manifest['metadata']['multi_contract_blueprint_tasks'] == 10000

          db = sqlite3.connect(Path('work/pilot/training.sqlite3'))
          counts = dict(db.execute('select split,count(*) from dds_results group by split'))
          assert counts == {'derived': 2497, 'sealed_test': 3000, 'train': 42000, 'validation': 3000}, counts
          print({
              'stage2b_v25_prepared': True,
              'oof_rows': ready['oof_rows'],
              'continuation_by_actor': ready['continuation_by_actor'],
              'blueprint_tasks': ready['multi_contract_blueprint']['tasks'],
              'family_selection': ready['family_selection'],
              'counterexample_candidates': ready['counterexample_candidates'],
              'structural_investigations': ready['investigations']['structural'],
              'card_level_investigations': ready['investigations']['card_level'],
              'database_unchanged': True,
              'paid_api_used': False,
          })
          PY
          test -f work/stage2b-v25/dds-stage2b-v25-prepared-compact.tgz
          test -f work/stage2b-v25/dds-stage2b-v25-prepared-compact.tgz.sha256
          (cd work/stage2b-v25 && sha256sum -c dds-stage2b-v25-prepared-compact.tgz.sha256)

      - name: Verify repository source tree remained clean
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all | grep -v '^?? dds_training/work/' || true)"

      - name: Upload refined Stage 2B preparation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dds-stage2b-v25-prepared-evidence-${{ github.run_id }}
          path: |
            dds_training/work/stage2b-v25/stage2b_summary_v25.json
            dds_training/work/stage2b-v25/stage2b_readiness_v25.json
            dds_training/work/stage2b-v25/CURRENT_STAGE_MANIFEST.json
            dds_training/work/stage2b-v25/oof_comparison_v03_stratified.json
            dds_training/work/stage2b-v25/family_selection_policy.json
            dds_training/work/stage2b-v25/oof_calibration_v25.json
            dds_training/work/stage2b-v25/calibration_diagnostics_v25.json
            dds_training/work/stage2b-v25/candidate_model_v03_refined.json
            dds_training/work/stage2b-v25/oof_predictions_v03_refined.jsonl
            dds_training/work/stage2b-v25/line_wave_sources_v25.jsonl
            dds_training/work/stage2b-v25/continuation_curriculum_balanced.jsonl
            dds_training/work/stage2b-v25/counterexample_candidates.jsonl
            dds_training/work/stage2b-v25/multi_contract_blueprint.jsonl
            dds_training/work/stage2b-v25/investigation_resolution_classes.json
            dds_training/work/stage2b-v25/review_queue_projection_enriched.json
            dds_training/work/stage2b-v25/dds-stage2b-v25-prepared-compact.tgz
            dds_training/work/stage2b-v25/dds-stage2b-v25-prepared-compact.tgz.sha256
          if-no-files-found: warn
          retention-days: 14
