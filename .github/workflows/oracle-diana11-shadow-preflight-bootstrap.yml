name: Oracle Diana 11 Shadow Preflight Bootstrap

on:
  pull_request:
    paths:
      - '.github/workflows/oracle-diana11-shadow-preflight-bootstrap.yml'
      - 'ops/universal_video_diana11_shadow_preflight.py'
      - 'ops/install_universal_video_diana11_shadow_preflight.sh'
      - 'ops/oracle_known_hosts_from_scan.sh'
      - 'tests/test_diana11_shadow_preflight.py'
  push:
    branches: [main]
    paths:
      - 'ops/oracle-diana11-shadow-preflight-requests/*.json'

permissions:
  contents: read
  issues: write

concurrency:
  group: oracle-diana11-shadow-preflight-bootstrap
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      issue: ${{ steps.request.outputs.issue }}
      expected_runtime_commit: ${{ steps.request.outputs.expected_runtime_commit }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Validate preparation-only contract
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile ops/universal_video_diana11_shadow_preflight.py
          bash -n ops/install_universal_video_diana11_shadow_preflight.sh
          bash -n ops/oracle_known_hosts_from_scan.sh
          grep -Fq 'UV003_EXECUTION_AUTHORIZED=NO' ops/universal_video_diana11_shadow_preflight.py
          grep -Fq 'UV003_PUBLICATION_AUTHORIZED=NO' ops/universal_video_diana11_shadow_preflight.py
          grep -Fq 'NOPASSWD: /usr/local/sbin/universal-video-diana11-shadow-preflight ""' ops/install_universal_video_diana11_shadow_preflight.sh
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q tests/test_diana11_shadow_preflight.py
      - name: Validate exact bootstrap request
        id: request
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff-tree -m --no-commit-id --name-only -r "$GITHUB_SHA" \
            | grep -E '^ops/oracle-diana11-shadow-preflight-requests/[^/]+\.json$' | sort -u)
          [[ ${#files[@]} -eq 1 ]] || { echo 'expected exactly one UV003 preflight request' >&2; exit 1; }
          REQUEST_FILE="${files[0]}" python - <<'PY' >> "$GITHUB_OUTPUT"
          import json,os,re
          x=json.load(open(os.environ['REQUEST_FILE'], encoding='utf-8'))
          assert set(x)=={'request_id','issue','expected_runtime_commit'}
          assert re.fullmatch(r'[A-Za-z0-9._-]{1,80}', str(x['request_id']))
          assert x['issue']==566
          assert re.fullmatch(r'[0-9a-f]{40}', str(x['expected_runtime_commit']))
          print('issue=566')
          print('expected_runtime_commit='+x['expected_runtime_commit'])
          PY

  bootstrap:
    if: ${{ github.event_name == 'push' }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ORACLE_HOST: 158.180.47.161
      ORACLE_USER: ubuntu
      SSH_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ needs.validate.outputs.issue }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Verify host identity and key
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          key="$RUNNER_TEMP/id_oracle"
          printf '%s\n' "$SSH_KEY" > "$key"
          chmod 0600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          known="$RUNNER_TEMP/known_hosts"
          : > "$known"
          index=0
          for expected in \
            'SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk' \
            'SHA256:UGJo5yPdnk/wf8DVrzvXt2xJkE9GJ8+3IIcQ2vA+mkc' \
            'SHA256:eRCJ8c4V7HCBlIoNVSlpPSWZE5xPUMjBD6f0PvHDj64'; do
            part="$RUNNER_TEMP/known_hosts.$index"
            ops/oracle_known_hosts_from_scan.sh "$ORACLE_HOST" "$expected" "$part"
            cat "$part" >> "$known"
            index=$((index + 1))
          done
          sort -u -o "$known" "$known"
          test -s "$known"
          actual="$(ssh-keygen -lf "$known" | awk '{print $2}' | sort -u | paste -sd, -)"
          expected="$(printf '%s\n' \
            'SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk' \
            'SHA256:UGJo5yPdnk/wf8DVrzvXt2xJkE9GJ8+3IIcQ2vA+mkc' \
            'SHA256:eRCJ8c4V7HCBlIoNVSlpPSWZE5xPUMjBD6f0PvHDj64' | sort -u | paste -sd, -)"
          [[ "$actual" == "$expected" ]] || { echo UV003_HOST_KEY_SET_MISMATCH >&2; exit 1; }
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "known=$known" >> "$GITHUB_OUTPUT"
      - name: Install and execute exact read-only preflight
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          ssh_cmd=(ssh -i '${{ steps.ssh.outputs.key }}' -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='${{ steps.ssh.outputs.known }}' -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST")
          "${ssh_cmd[@]}" 'sudo -n true'
          cat ops/universal_video_diana11_shadow_preflight.py | "${ssh_cmd[@]}" 'cat > /tmp/uv003_preflight.py && chmod 0600 /tmp/uv003_preflight.py'
          cat ops/install_universal_video_diana11_shadow_preflight.sh | "${ssh_cmd[@]}" 'cat > /tmp/install_uv003_preflight.sh && chmod 0600 /tmp/install_uv003_preflight.sh'
          raw=''
          if ! raw="$("${ssh_cmd[@]}" "sudo -n env SOURCE_FILE=/tmp/uv003_preflight.py EXPECTED_RUNTIME_COMMIT='${{ needs.validate.outputs.expected_runtime_commit }}' bash /tmp/install_uv003_preflight.sh && sudo -n /usr/local/sbin/universal-video-diana11-shadow-preflight" 2>&1)"; then
            echo 'UV003_REMOTE_PREFLIGHT=FAILED_CLOSED'
            exit 1
          fi
          RAW="$raw" python - <<'PY' > "$RUNNER_TEMP/uv003-safe.txt"
          import os,re
          patterns=(
            r'UV003_EXPERIMENT_ID=UV-DIANA11-DURABLE-003',
            r'UV003_JOB_ID=diana11-shadow-20260826-001',
            r'UV003_JOB_HASH=[0-9a-f]{64}',
            r'UV003_PROFILE=bridge_lesson',
            r'UV003_SOURCE_FILE_ID=[A-Za-z0-9_-]{10,200}',
            r'UV003_SOURCE_SIZE_BYTES=[0-9]+',
            r'UV003_DESTINATION_FOLDER_ID=[A-Za-z0-9_-]{10,200}',
            r'UV003_PROCESSING_REVISION=[0-9a-f]{40}',
            r'UV003_PROCESSING_WHISPER_MODEL=[A-Za-z0-9._/-]{1,80}',
            r'UV003_PROCESSING_FINGERPRINT=[0-9a-f]{64}',
            r'UV003_JOB_GUARD=ABSENT',
            r'UV003_AUTOMATIC_RETRIES=0',
            r'UV003_EXECUTION_AUTHORIZED=NO',
            r'UV003_PUBLICATION_AUTHORIZED=NO',
            r'UV003_PRODUCTION_PROMOTION=BLOCKED',
            r'UV003_PREFLIGHT_PASS',
            r'UV003_PREFLIGHT_OPERATOR_INSTALLED',
          )
          safe=[]
          for line in os.environ['RAW'].splitlines():
              if any(re.fullmatch(p,line) for p in patterns) and line not in safe:
                  safe.append(line)
          print('\n'.join(safe))
          PY
          cat "$RUNNER_TEMP/uv003-safe.txt"
          for marker in \
            'UV003_EXPERIMENT_ID=UV-DIANA11-DURABLE-003' \
            'UV003_JOB_ID=diana11-shadow-20260826-001' \
            'UV003_JOB_HASH=a43e11beb0765aa91551d4c4a69767f02c4dcb3b5e485cd5bb0f2996e734d73d' \
            'UV003_PROFILE=bridge_lesson' \
            'UV003_SOURCE_SIZE_BYTES=740292560' \
            'UV003_JOB_GUARD=ABSENT' \
            'UV003_AUTOMATIC_RETRIES=0' \
            'UV003_EXECUTION_AUTHORIZED=NO' \
            'UV003_PUBLICATION_AUTHORIZED=NO' \
            'UV003_PRODUCTION_PROMOTION=BLOCKED' \
            'UV003_PREFLIGHT_PASS' \
            'UV003_PREFLIGHT_OPERATOR_INSTALLED'; do
            grep -Fx "$marker" "$RUNNER_TEMP/uv003-safe.txt" >/dev/null
          done
          [[ "$(grep -c '^UV003_PROCESSING_REVISION=' "$RUNNER_TEMP/uv003-safe.txt")" == 1 ]]
          [[ "$(grep -c '^UV003_PROCESSING_WHISPER_MODEL=' "$RUNNER_TEMP/uv003-safe.txt")" == 1 ]]
          [[ "$(grep -c '^UV003_PROCESSING_FINGERPRINT=' "$RUNNER_TEMP/uv003-safe.txt")" == 1 ]]
          echo 'validated=true' >> "$GITHUB_OUTPUT"
      - name: Verify DDS3 non-regression
        id: dds3
        if: ${{ success() }}
        shell: bash
        run: |
          READY="$(curl -fsS --retry 3 --retry-delay 3 --max-time 20 https://158.180.47.161/readyz)" python - <<'PY'
          import json,os
          x=json.loads(os.environ['READY'])
          assert x.get('status')=='ready', x
          assert x.get('engine')=='DDS3', x
          assert x.get('fallback_used') is False, x
          assert x.get('position_solver')=='ready', x
          print('UV003_DDS3_NONREGRESSION_PASS')
          PY
      - name: Record bounded evidence
        if: ${{ always() }}
        shell: bash
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          PREFLIGHT_VALIDATED: ${{ steps.preflight.outputs.validated }}
          DDS3_OUTCOME: ${{ steps.dds3.outcome }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/uv003-comment.md"
          {
            echo '[OBSERVATORY] UV003 resident read-only preflight.'
            echo
            if [[ "${PREFLIGHT_VALIDATED:-}" == true && -s "$RUNNER_TEMP/uv003-safe.txt" ]]; then
              echo '```text'
              cat "$RUNNER_TEMP/uv003-safe.txt"
              echo '```'
              echo
              echo 'No submit, ASR/media processing, retry, or Drive publication was authorized or attempted.'
            else
              echo "Preflight failed closed before READY_FOR_GO. Outcome: ${PREFLIGHT_OUTCOME:-UNKNOWN}."
            fi
            echo "DDS3 non-regression: ${DDS3_OUTCOME:-NOT_RUN}."
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$body"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$body"
