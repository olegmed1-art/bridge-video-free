name: One-shot Oracle Autopilot broker secret provision

on:
  push:
    branches:
      - codex/oracle-autopilot-lite-shadow
    paths:
      - '.github/workflows/autopilot-oracle-broker-provision-once.yml'

permissions:
  contents: read

concurrency:
  group: oracle-instance-workload-mutation
  cancel-in-progress: false

jobs:
  provision:
    if: github.repository == 'olegmed1-art/bridge-video-free'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ORACLE_HOST: 158.180.47.161
      ORACLE_USER: ubuntu
      EXPECTED_FINGERPRINT: SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk
      VERCEL_PROJECT: bridge-school-autopilot
      VERCEL_SCOPE: olegmed1-4368s-projects
      BROKER_URL: https://bridge-school-autopilot-cslfiz83g-olegmed1-4368s-projects.vercel.app/v1/github/draft-repair
      NODE_IMAGE: node:24.19.0-bookworm
      VERCEL_CLI_VERSION: 59.10.0
      SSH_KEY_ORACLE: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
      SSH_KEY_OCI: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
      SSH_KEY_VM: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
      SSH_KEY_BRIDGE: ${{ secrets.BRIDGE_SCHOOL_ORACLE_SSH_PRIVATE_KEY }}
      SSH_KEY_ORACLE_ALT: ${{ secrets.ORACLE_SSH_KEY }}
      SSH_KEY_OCI_ALT: ${{ secrets.OCI_SSH_KEY }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Resolve verified Oracle SSH credential
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/oracle-broker-provision"
          mkdir -p "$work"
          known="$work/known_hosts"
          ops/oracle_known_hosts_from_scan.sh "$ORACLE_HOST" "$EXPECTED_FINGERPRINT" "$known"

          selected=''
          index=0
          for name in SSH_KEY_ORACLE SSH_KEY_OCI SSH_KEY_VM SSH_KEY_BRIDGE SSH_KEY_ORACLE_ALT SSH_KEY_OCI_ALT; do
            raw="${!name:-}"
            [[ -n "$raw" ]] || continue
            index=$((index + 1))
            base="$work/key-$index"
            printf '%s\n' "$raw" > "$base.raw"
            tr -d '\r' < "$base.raw" > "$base.crlf"
            printf '%s' "$raw" | python -c '
          import sys
          raw = sys.stdin.read()
          path = sys.argv[1]
          if "\\n" in raw and "\n" not in raw:
              raw = raw.replace("\\r", "").replace("\\n", "\n")
          with open(path, "w", newline="\n") as handle:
              handle.write(raw)
              if not raw.endswith("\n"):
                  handle.write("\n")
          ' "$base.escaped"
            for key in "$base.raw" "$base.crlf" "$base.escaped"; do
              chmod 0600 "$key"
              ssh-keygen -y -f "$key" >/dev/null 2>&1 || continue
              if ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes \
                   -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" \
                   -o ConnectTimeout=10 "$ORACLE_USER@$ORACLE_HOST" true >/dev/null 2>&1; then
                selected="$key"
                break 2
              fi
            done
          done
          [[ -n "$selected" ]]
          cp "$selected" "$work/id_oracle"
          chmod 0600 "$work/id_oracle"
          echo "key=$work/id_oracle" >> "$GITHUB_OUTPUT"
          echo "known=$known" >> "$GITHUB_OUTPUT"

      - name: Provision root-owned broker boundary
        id: provision
        shell: bash
        run: |
          set -euo pipefail
          ssh -tt -i '${{ steps.ssh.outputs.key }}' \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile='${{ steps.ssh.outputs.known }}' -o ConnectTimeout=15 \
            "$ORACLE_USER@$ORACLE_HOST" \
            "sudo -n env VERCEL_PROJECT='$VERCEL_PROJECT' VERCEL_SCOPE='$VERCEL_SCOPE' BROKER_URL='$BROKER_URL' NODE_IMAGE='$NODE_IMAGE' VERCEL_CLI_VERSION='$VERCEL_CLI_VERSION' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          service=school-autopilot-shadow.service
          final=/opt/bridge-school/school-autopilot/autopilot-broker.env
          container="autopilot-broker-provision-$(date +%s)"
          work="$(mktemp -d /var/tmp/autopilot-broker-provision.XXXXXXXX)"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            if [[ "$work" == /var/tmp/autopilot-broker-provision.* && -d "$work" ]]; then
              find "$work" -depth -delete
            fi
          }
          trap cleanup EXIT HUP INT TERM

          systemctl is-active --quiet "$service"
          command -v docker >/dev/null
          [[ ! -e "$final" ]]
          [[ "$BROKER_URL" == https://bridge-school-autopilot-*-olegmed1-4368s-projects.vercel.app/v1/github/draft-repair ]]
          install -d -m 0700 -o root -g root "$work/output"

          cat > "$work/extract.mjs" <<'NODE'
          import fs from 'node:fs';
          const broker = process.env.AUTOPILOT_TOKEN_BROKER_SECRET || '';
          const bypass = process.env.VERCEL_AUTOMATION_BYPASS_SECRET || '';
          const brokerUrl = process.env.BROKER_URL || '';
          const safe = /^[A-Za-z0-9_-]+$/;
          if (!safe.test(broker) || broker.length < 43 || broker.length > 512) {
            throw new Error('broker ingress secret unavailable');
          }
          if (!safe.test(bypass) || bypass.length < 32 || bypass.length > 512) {
            throw new Error('Vercel automation bypass secret unavailable');
          }
          if (!/^https:\/\/bridge-school-autopilot-[a-z0-9]+-olegmed1-4368s-projects\.vercel\.app\/v1\/github\/draft-repair$/.test(brokerUrl)) {
            throw new Error('broker URL invalid');
          }
          const value = [
            `AUTOPILOT_TOKEN_BROKER_URL=${brokerUrl}`,
            `AUTOPILOT_TOKEN_BROKER_SECRET=${broker}`,
            `AUTOPILOT_VERCEL_BYPASS_SECRET=${bypass}`,
            '',
          ].join('\n');
          fs.writeFileSync('/output/autopilot-broker.env', value, {
            encoding: 'utf8', flag: 'wx', mode: 0o600,
          });
          NODE
          chmod 0600 "$work/extract.mjs"

          cat > "$work/run.sh" <<'CONTAINER'
          #!/bin/sh
          set -eu
          umask 077
          export HOME=/tmp/vercel-home
          export npm_config_cache=/tmp/npm-cache
          export NO_UPDATE_NOTIFIER=1
          export VERCEL_TELEMETRY_DISABLED=1
          export NO_COLOR=1
          mkdir -p "$HOME" /tmp/link
          cd /tmp/link
          npm install --global --no-audit --no-fund "vercel@${VERCEL_CLI_VERSION}"
          vercel --version
          vercel login
          vercel link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" >/dev/null
          vercel project protection enable "$VERCEL_PROJECT" --protection-bypass \
            --scope "$VERCEL_SCOPE" --format json >/tmp/protection.json
          vercel env run -e preview -- node /runner/extract.mjs
          timeout 8s vercel logout >/dev/null 2>&1 || true
          find "$HOME" -depth -delete
          CONTAINER
          chmod 0700 "$work/run.sh"

          docker pull "$NODE_IMAGE" >/dev/null
          resolved_image="$(docker image inspect --format '{{index .RepoDigests 0}}' "$NODE_IMAGE")"
          [[ "$resolved_image" == node@sha256:* ]]
          docker run --rm -it --name "$container" --cpus=1 --memory=1g --pids-limit=256 \
            --cap-drop=ALL --security-opt=no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=1024m \
            --mount type=bind,src="$work/output",dst=/output \
            --mount type=bind,src="$work/extract.mjs",dst=/runner/extract.mjs,readonly \
            --mount type=bind,src="$work/run.sh",dst=/runner/run.sh,readonly \
            -e VERCEL_PROJECT -e VERCEL_SCOPE -e VERCEL_CLI_VERSION -e BROKER_URL -e TERM=xterm \
            "$resolved_image" /bin/sh /runner/run.sh

          candidate="$work/output/autopilot-broker.env"
          python3 - "$candidate" <<'PY'
          import re
          import sys
          values = {}
          for line in open(sys.argv[1], encoding='utf-8'):
              name, value = line.rstrip('\n').split('=', 1)
              assert name not in values
              values[name] = value
          assert set(values) == {
              'AUTOPILOT_TOKEN_BROKER_URL',
              'AUTOPILOT_TOKEN_BROKER_SECRET',
              'AUTOPILOT_VERCEL_BYPASS_SECRET',
          }
          assert re.fullmatch(
              r'https://bridge-school-autopilot-[a-z0-9]+-olegmed1-4368s-projects\.vercel\.app/v1/github/draft-repair',
              values['AUTOPILOT_TOKEN_BROKER_URL'],
          )
          assert re.fullmatch(r'[A-Za-z0-9_-]{43,512}', values['AUTOPILOT_TOKEN_BROKER_SECRET'])
          assert re.fullmatch(r'[A-Za-z0-9_-]{32,512}', values['AUTOPILOT_VERCEL_BYPASS_SECRET'])
          PY
          install -m 0600 -o root -g root "$candidate" "$final"
          [[ "$(stat -c '%U:%G:%a' "$final")" == root:root:600 ]]

          set -a
          source "$final"
          set +a
          health="$(curl -fsS --max-time 20 \
            -H "x-vercel-protection-bypass: $AUTOPILOT_VERCEL_BYPASS_SECRET" \
            "${AUTOPILOT_TOKEN_BROKER_URL%/v1/github/draft-repair}/healthz")"
          HEALTH_JSON="$health" python3 - <<'PY'
          import json
          import os
          payload = json.loads(os.environ['HEALTH_JSON'])
          expected = {
              'status': 'ok',
              'service': 'school-autopilot-github-token-broker',
              'service_version': '0.2.0',
              'preview_only': True,
              'production_mutations_enabled': False,
              'github_token_broker_enabled': True,
              'raw_installation_token_exposed': False,
              'bounded_draft_executor_enabled': True,
          }
          for key, value in expected.items():
              assert payload.get(key) == value, key
          PY
          unset AUTOPILOT_TOKEN_BROKER_SECRET AUTOPILOT_VERCEL_BYPASS_SECRET health
          systemctl is-active --quiet "$service"
          echo 'AUTOPILOT_BROKER_SECRET_PROVISION=PASS'
          echo 'AUTOPILOT_BROKER_ENV_MODE=root:root:600'
          echo 'AUTOPILOT_VERCEL_PROTECTION_BYPASS=PASS'
          echo 'AUTOPILOT_SERVICE_REMAINED_ACTIVE=YES'
          echo 'ORACLE_INSTANCE_STOP_REQUESTED=NO'
          REMOTE

      - name: Confirm bounded provisioning result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          printf 'production_requested=false\n'
          printf 'merge_requested=false\n'
          printf 'video_requested=false\n'
          printf 'train_requested=false\n'
          printf 'oracle_instance_stop_requested=false\n'
          [[ '${{ steps.provision.outcome }}' == 'success' ]]
