              lines.append('- fresh backup retained: ' + code('false_or_unproven') + '; no accepted backup ID was emitted')
          lines += [
              '- superseded operation backups remaining: ' + code(os.environ.get('SUPERSEDED_BACKUP_COUNT') or value('superseded_backup_count')),
              '- temporary instance runtime seconds: ' + code(os.environ.get('TEMP_INSTANCE_SECONDS') or 'unknown'),
              '- locked host mutation outcome: ' + code(os.environ.get('MUTATION_OUTCOME') or 'skipped'),
              '- shared host fence: ' + code('/run/lock/oracle-workload-mutation.lock'),
              '- exact monetary charge: ' + code('PENDING_OCI_BILLING_EXPORT'),
              '- media canary: ' + code('false'),
              '- supersedes malformed failure receipt: https://github.com/olegmed1-art/bridge-video-free/issues/881#issuecomment-5543399377',
              '- run: ' + os.environ['RUN_URL'],
          ]
          Path(os.environ['BODY_PATH']).write_text('\n'.join(lines) + '\n')
          PY
          gh issue comment 881 --repo "$GITHUB_REPOSITORY" --body-file "$body"
