name: Cancel stale Oracle queue 2026-08-28

on:
  push:
    paths:
      - '.github/workflows/cancel-stale-oracle-queue-20260828.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel only verified stale queued runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_IDS: >-
            32985080125 32985077884 32985077922 32985077945 32985077981
            32985078067 32985077718 32985071819 32985070714 32985070412
        run: |
          set -euo pipefail
          for run_id in $RUN_IDS; do
            state="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq .status)"
            jobs="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" --jq .total_count)"
            [[ "$state" == queued ]]
            [[ "$jobs" == 0 ]]
          done
          for run_id in $RUN_IDS; do
            gh api --method POST "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel"
          done
          echo STALE_ORACLE_QUEUE_CANCEL_REQUESTED
