name: Light 1867 administrative recovery contract
on:
  pull_request:
    paths: ['ops/light_1867_admin.py', 'tests/test_light_1867_admin.py', '.github/workflows/light-1867-admin.yml']
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_light_1867_admin.py tests/test_light_1867_comment_review.py
