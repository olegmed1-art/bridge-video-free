name: Issue 881 Exact Pre-Canary Evidence

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: issue-881-precanary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  exact-precanary-contract:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXACT_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.EXACT_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Validate exact revision and no-media contracts
        run: |
          set -euo pipefail
          [[ "$EXACT_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXACT_SHA"
          grep -Eq '^FROM python@sha256:[0-9a-f]{64}$' deploy/oracle-universal-video/Dockerfile
          bash -n ops/issue_881_external_precanary_workflow.sh
          bash -n ops/oracle_universal_video_precanary_attest.sh
          bash -n ops/oracle_universal_video_container_install.sh
          python3 -m py_compile ops/issue_881_precanary_one_shot.py \
            ops/issue_881_precanary_queue_proof.py
          grep -F 'flock --exclusive --nonblock 9' ops/oracle_universal_video_precanary_attest.sh
          grep -F 'bash "$PREPARE_SCRIPT"' ops/oracle_universal_video_precanary_attest.sh
          grep -F 'restore_service "$SOURCE_SERVICE" "$source_target_state"' ops/oracle_universal_video_precanary_attest.sh
          grep -F 'start_container_under_fence' ops/oracle_universal_video_precanary_attest.sh
          grep -F 'validate_started_container_after_fence' ops/oracle_universal_video_precanary_attest.sh
          grep -F 'verify_postrestore_runtime_queue' ops/oracle_universal_video_precanary_attest.sh
          grep -F 'verify_postrestore_owner_release' ops/oracle_universal_video_precanary_attest.sh
          grep -F 'UNIVERSAL_VIDEO_QUEUE_PROOF_SHA256' ops/oracle_universal_video_precanary_attest.sh
          grep -F 'UNIVERSAL_VIDEO_CONTAINER_ALLOW_CACHE_RECLAIM=0' ops/oracle_universal_video_precanary_attest.sh
          ! grep -F 'find "$root_cache"' ops/oracle_universal_video_precanary_attest.sh
          grep -F '"$image_id" "$@"' ops/oracle_universal_video_precanary_attest.sh
          grep -F 'UNIVERSAL_VIDEO_IMAGE=$image_id' ops/oracle_universal_video_container_install.sh
          grep -F '"$image_id" true' ops/oracle_universal_video_container_install.sh
          grep -F 'with shared_workload_lock():' universal_video/neon_worker.py
          grep -F 'verify_terminal_output_live(claim, output' universal_video/neon_worker.py
          git diff --check "$EXACT_SHA^" "$EXACT_SHA"

      - name: Prove the only external entrypoint is Director-gated
        run: |
          set -euo pipefail
          workflow=.github/workflows/issue-881-authoritative-external-evidence.yml
          runner=ops/issue_881_external_precanary_workflow.sh
          grep -F 'director_go:' "$workflow"
          grep -F 'approval_receipt_id:' "$workflow"
          grep -F 'approval_nonce:' "$workflow"
          grep -F 'github.actor == github.repository_owner' "$workflow"
          grep -F "github.repository == 'olegmed1-art/bridge-video-free'" "$workflow"
          grep -F 'run: bash ops/issue_881_external_precanary_workflow.sh' "$workflow"
          ! grep -F '$''{{' "$runner"
          grep -F 'verify_live_gate(){' "$runner"
          test "$(grep -c '^[[:space:]]*verify_live_gate$' "$runner")" -eq 2
          grep -F 'verify_one_shot_gate(){' "$runner"
          test "$(grep -c '^[[:space:]]*verify_one_shot_gate$' "$runner")" -eq 2
          test "$(( $(grep -c 'issue_881_precanary_one_shot.py verify' "$workflow") + $(grep -c 'issue_881_precanary_one_shot.py verify' "$runner") ))" -eq 2
          grep -F 'verify_no_competing_infrastructure_runs(){' "$runner"
          grep -F 'UNIVERSAL_VIDEO_PRECANARY_INFRASTRUCTURE_EXCLUSIVE' "$runner"
          grep -F 'verify_no_active_oracle_admin_commands(){' "$runner"
          grep -F 'instance-agent command-execution get' "$runner"
          grep -F 'UNIVERSAL_VIDEO_PRECANARY_OCI_ADMIN_EXCLUSIVE' "$runner"
          grep -F 'root_pr_number=991' "$runner"
          grep -F 'prior_gate_pr_number=1070' "$runner"
          grep -F 'protected_gate_paths=(' "$runner"
          grep -F "'ops/issue_881_external_precanary_workflow.sh'" "$runner"
          grep -F "'ops/oracle_known_hosts_from_scan.sh'" "$runner"
          grep -F "'.github/workflows/oracle-universal-video-admin.yml'" "$runner"
          grep -F 'group: oracle-instance-workload-mutation' \
            .github/workflows/oracle-universal-video-admin.yml
          grep -F "'.github/workflows/oracle-universal-video-container-promote.yml'" "$runner"
          grep -F "'ops/oracle_universal_video_container_promote.sh'" "$runner"
          grep -F 'commits/$gate_commit/pulls' "$runner"
          grep -F 'git diff --quiet "$reviewed_sha" "$gate_commit"' "$runner"
          grep -F 'Protected gate files changed after the reviewed merge' "$runner"
          grep -F 'main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq' "$runner"
          grep -F 'Root Autopilot PR #991 is not merged' "$runner"
          grep -F 'git merge-base --is-ancestor "$gate_merge_sha" "$EXACT_SHA"' "$runner"
          grep -F 'Reviewed head has no current independent approval at final reconciliation' "$runner"
          grep -F 'exact clean Codex bot receipt' "$runner"
          grep -F 'issue_881_precanary_queue_proof.py owner-before' "$workflow"
          grep -F 'issue_881_precanary_queue_proof.py owner-after' "$workflow"
          grep -F 'UNIVERSAL_VIDEO_PRECANARY_POSTRESTORE_RUNTIME' "$runner"
          retired=.github/workflows/oracle-universal-video-container-evidence.yml
          grep -F 'UNIVERSAL_VIDEO_LEGACY_CONTAINER_EVIDENCE_RETIRED=true' "$retired"
          ! grep -E 'workflow[_]dispatch:' "$retired"
          ! grep -F 'push:' "$retired"
