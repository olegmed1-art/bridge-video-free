name: Book WORLD contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'bridge_contracts/book_*.py'
      - 'database/book_world_persistence.py'
      - 'bridge_school_api/knowledge.py'
      - 'bridge_school_api/book_runtime_identity.py'
      - 'tests/test_book_*.py'
      - 'tests/fixtures/book_world_postgres.sql'
      - 'schemas/book-material-staging-v1.schema.json'
      - '.github/workflows/book-world-contract.yml'

permissions:
  contents: read

jobs:
  synthetic-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: book_world_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      BOOK_WORLD_PG_TEST: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-api.txt pytest==8.4.2 httpx==0.28.1 jsonschema==4.25.1
      - run: >-
          python -m pytest -q tests/test_book_material_staging.py tests/test_book_world.py
          tests/test_book_teacher_api.py tests/test_book_world_postgres.py
          tests/test_book_runtime_identity.py
          tests/test_knowledge_read_api.py tests/test_canon_source_domain_policy.py
