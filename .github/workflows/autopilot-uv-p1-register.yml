name: Autopilot Universal Video P1 task registration

on:
  push:
    branches: [codex/oracle-autopilot-lite-shadow]
    paths: ['.github/workflows/autopilot-uv-p1-register.yml']

permissions:
  contents: read

concurrency:
  group: autopilot-universal-video-p1-registration
  cancel-in-progress: false

jobs:
  register:
    if: github.repository == 'olegmed1-art/bridge-video-free'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: database-production
    env:
      ORACLE_HOST: 158.180.47.161
      ORACLE_USER: ubuntu
      EXPECTED_FINGERPRINT: SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk
      SSH_KEY_ORACLE: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
      PROJECT_ID: misty-poetry-18012774
      TEMP_BRANCH_ID: br-still-tooth-b1ilkfcj
      PRODUCTION_BRANCH_ID: br-wispy-lab-b1rq54of
      TEMP_ENDPOINT_ID: ep-floral-field-b1pjs2of
    steps:
      - name: Checkout exact Autopilot source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Register and observe three exact-head durable tasks
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$TEMP_BRANCH_ID" != "$PRODUCTION_BRANCH_ID" ]]
          key="$RUNNER_TEMP/id_oracle"
          known="$RUNNER_TEMP/known_hosts"
          printf '%s\n' "$SSH_KEY_ORACLE" | tr -d '\r' > "$key"
          chmod 0600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          ops/oracle_known_hosts_from_scan.sh "$ORACLE_HOST" "$EXPECTED_FINGERPRINT" "$known"
          ssh -i "$key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known" \
            -o ConnectTimeout=15 \
            "$ORACLE_USER@$ORACLE_HOST" \
            "sudo -n env PROJECT_ID='$PROJECT_ID' TEMP_BRANCH_ID='$TEMP_BRANCH_ID' PRODUCTION_BRANCH_ID='$PRODUCTION_BRANCH_ID' TEMP_ENDPOINT_ID='$TEMP_ENDPOINT_ID' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          /opt/bridge-school/school-autopilot/.venv/bin/python - <<'PY'
          import os
          import re
          import shlex
          import sys
          import time
          import urllib.parse
          from pathlib import Path

          import psycopg

          project_id = os.environ['PROJECT_ID']
          branch_id = os.environ['TEMP_BRANCH_ID']
          production_branch_id = os.environ['PRODUCTION_BRANCH_ID']
          endpoint = os.environ['TEMP_ENDPOINT_ID']
          assert re.fullmatch(r'ep-[a-z0-9-]+', endpoint)
          assert branch_id != production_branch_id

          approved = (
              ('RUNTIME', 'uv-p1-runtime-pr997-545ef013-20260901', 997, '545ef0135e3cfe436b918c3ec26f5e2b77500977'),
              ('INTAKE', 'uv-p1-intake-pr1000-5af0675a-20260901', 1000, '5af0675a9e13a9725348661be297abc5f52ff0e4'),
              ('IDLE', 'uv-p1-idle-pr1047-621ab073-20260901', 1047, '621ab073418b3f3d1b75cb6abb074dba4ea305cb'),
          )
          terminal = {'OWNER_REQUIRED', 'FAILED_CLOSED', 'BUDGET_STOP', 'DONE', 'CANCELLED'}
          roots = [Path('/opt/bridge-school'), Path('/etc/systemd/system'), Path('/etc/default')]
          pattern = re.compile(
              r'^(?:export\s+)?([A-Z0-9_]*(?:DATABASE_URL|POSTGRES_URL|DIRECT_URL|NEON_DSN|DATABASE_DSN)[A-Z0-9_]*)=(.*)$'
          )

          def parse_value(raw: str) -> str:
              raw = raw.strip()
              if len(raw) >= 2 and raw[0] == raw[-1] and raw[0] in {'"', "'"}:
                  try:
                      parts = shlex.split(raw)
                  except ValueError:
                      return ''
                  return parts[0] if len(parts) == 1 else ''
              return raw

          candidates = []
          seen_inodes = set()
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  try:
                      stat_result = path.stat()
                  except Exception:
                      continue
                  if not path.is_file() or stat_result.st_size > 131072:
                      continue
                  if (
                      path.suffix.lower() not in {'.env', '.service', '.conf', '.config', '.ini'}
                      and '.env' not in path.name.lower()
                  ):
                      continue
                  inode = (stat_result.st_dev, stat_result.st_ino)
                  if inode in seen_inodes:
                      continue
                  seen_inodes.add(inode)
                  try:
                      lines = path.read_text(encoding='utf-8', errors='strict').splitlines()
                  except Exception:
                      continue
                  for raw_line in lines:
                      line = raw_line.strip()
                      if not line or line.startswith('#'):
                          continue
                      match = pattern.fullmatch(line)
                      if match:
                          value = parse_value(match.group(2))
                          if value:
                              candidates.append(value)

          tested = set()
          selected = None
          bounded_failure = 'AUTOPILOT_UV_P1_RUNTIME_DSN_UNAVAILABLE'
          for dsn in candidates[:64]:
              try:
                  parsed = urllib.parse.urlsplit(dsn)
              except ValueError:
                  continue
              host = (parsed.hostname or '').lower()
              if (
                  parsed.scheme not in {'postgres', 'postgresql'}
                  or not host.endswith('.neon.tech')
                  or not parsed.username
                  or parsed.password is None
              ):
                  continue
              first, separator, suffix = host.partition('.')
              if not separator or not first.startswith('ep-'):
                  continue
              temp_host = endpoint + ('-pooler' if first.endswith('-pooler') else '') + '.' + suffix
              identity = (parsed.username, parsed.password, parsed.path, temp_host)
              if identity in tested:
                  continue
              tested.add(identity)
              user = urllib.parse.quote(parsed.username, safe='')
              password = urllib.parse.quote(parsed.password, safe='')
              port = f':{parsed.port}' if parsed.port else ''
              query = [
                  (key, value)
                  for key, value in urllib.parse.parse_qsl(parsed.query, keep_blank_values=True)
                  if key.lower() != 'channel_binding'
              ]
              if not any(key.lower() == 'sslmode' for key, _ in query):
                  query.append(('sslmode', 'require'))
              temp_dsn = urllib.parse.urlunsplit(
                  (
                      parsed.scheme,
                      f'{user}:{password}@{temp_host}{port}',
                      parsed.path or '/neondb',
                      urllib.parse.urlencode(query),
                      '',
                  )
              )
              try:
                  connection = psycopg.connect(
                      temp_dsn,
                      connect_timeout=5,
                      application_name='autopilot-uv-p1-bounded-registration',
                      autocommit=True,
                  )
                  with connection.cursor() as cursor:
                      cursor.execute(
                          """
                          SELECT current_user,
                                 current_database(),
                                 current_setting('neon.project_id', true),
                                 current_setting('neon.branch_id', true),
                                 EXISTS (
                                     SELECT 1 FROM public.schema_migration
                                     WHERE migration_key='0309_autopilot_uv_p1_bounded_ingress'
                                 ),
                                 to_regprocedure('autopilot.register_approved_uv_p1_ci(text)') IS NOT NULL,
                                 has_function_privilege(
                                     current_user,
                                     'autopilot.register_approved_uv_p1_ci(text)',
                                     'EXECUTE'
                                 )
                          """
                      )
                      row = cursor.fetchone()
                  valid = (
                      row[0] == 'autopilot_runtime_login'
                      and row[1] == 'neondb'
                      and row[2] == project_id
                      and row[3] == branch_id
                      and bool(row[4])
                      and bool(row[5])
                      and bool(row[6])
                  )
                  if valid:
                      selected = connection
                      break
                  if row[2] == project_id and row[3] == branch_id and not row[4]:
                      bounded_failure = 'AUTOPILOT_UV_P1_0309_NOT_APPLIED'
                  connection.close()
              except psycopg.Error:
                  continue

          if selected is None:
              print(f'AUTOPILOT_UV_P1_REGISTRATION={bounded_failure}')
              print(f'AUTOPILOT_UV_P1_CREDENTIALS_TESTED={len(tested)}')
              print('TEMPORARY_NEON_BRANCH_ONLY=YES')
              print('PRODUCTION_DATABASE_CONTACTED=NO')
              print('PRODUCTION_MUTATION=NO')
              sys.exit(20)

          print('AUTOPILOT_UV_P1_SCHEMA_PREFLIGHT=PASS')
          print('AUTOPILOT_UV_P1_CALLER=autopilot_runtime_login')
          print('AUTOPILOT_UV_P1_MIGRATION_0309=ALREADY_APPLIED')
          print('MIGRATION_APPLIED_BY_THIS_RUN=NO')
          print('TEMPORARY_NEON_BRANCH_ONLY=YES')
          print('PRODUCTION_DATABASE_CONTACTED=NO')

          global_deadline = time.monotonic() + 1800
          task_ids = []
          with selected:
              for label, task_key, pr_number, expected_head in approved:
                  task_id = None
                  created = None
                  while time.monotonic() < global_deadline:
                      try:
                          with selected.cursor() as cursor:
                              cursor.execute(
                                  'SELECT task_id,status,created FROM autopilot.register_approved_uv_p1_ci(%s)',
                                  (task_key,),
                              )
                              row = cursor.fetchone()
                          task_id, status, created = str(row[0]), row[1], bool(row[2])
                          break
                      except psycopg.Error as error:
                          primary = getattr(error.diag, 'message_primary', '') or ''
                          if primary != 'AUTOPILOT_INGRESS_ACTIVE_LIMIT':
                              print(f'AUTOPILOT_UV_P1_{label}_REGISTRATION=FAILED_CLOSED')
                              sys.exit(21)
                          print(f'AUTOPILOT_UV_P1_{label}_REGISTRATION=WAITING_EXTERNAL')
                          time.sleep(5)
                  if task_id is None:
                      print(f'AUTOPILOT_UV_P1_{label}_REGISTRATION=WAIT_TIMEOUT')
                      sys.exit(22)

                  task_ids.append(task_id)
                  print(f'UV_P1_{label}_TASK_ID={task_id}')
                  print(f'UV_P1_{label}_PR={pr_number}')
                  print(f'UV_P1_{label}_EXPECTED_HEAD={expected_head}')
                  print(f'UV_P1_{label}_REGISTER_CREATED={str(created).lower()}')
                  print(f'UV_P1_{label}_REGISTER_STATUS={status}')

                  last_status = None
                  final_row = None
                  while time.monotonic() < global_deadline:
                      with selected.cursor() as cursor:
                          cursor.execute(
                              """
                              SELECT t.status,
                                     t.attempts,
                                     COALESCE(t.terminal_reason_code, ''),
                                     t.goal_json->>'expected_head_sha',
                                     (SELECT count(*) FROM autopilot.task_event e WHERE e.task_id=t.task_id),
                                     (SELECT count(*) FROM autopilot.evidence v WHERE v.task_id=t.task_id AND v.retained)
                                FROM autopilot.task t
                               WHERE t.task_id=%s::uuid
                              """,
                              (task_id,),
                          )
                          final_row = cursor.fetchone()
                      if final_row is None:
                          print(f'AUTOPILOT_UV_P1_{label}_OBSERVATION=TASK_MISSING')
                          sys.exit(23)
                      current_status = final_row[0]
                      if current_status != last_status:
                          print(f'UV_P1_{label}_STATE={current_status}')
                          last_status = current_status
                      if current_status in terminal:
                          break
                      time.sleep(5)
                  if final_row is None or final_row[0] not in terminal:
                      print(f'AUTOPILOT_UV_P1_{label}_OBSERVATION=WAITING_EXTERNAL_TIMEOUT')
                      sys.exit(24)
                  if final_row[3] != expected_head:
                      print(f'AUTOPILOT_UV_P1_{label}_EXACT_HEAD=FAIL')
                      sys.exit(25)
                  print(f'UV_P1_{label}_TERMINAL_STATUS={final_row[0]}')
                  print(f'UV_P1_{label}_ATTEMPTS={final_row[1]}')
                  print(f'UV_P1_{label}_TERMINAL_REASON={final_row[2] or "NONE"}')
                  print(f'UV_P1_{label}_EVENT_COUNT={final_row[4]}')
                  print(f'UV_P1_{label}_RETAINED_EVIDENCE_COUNT={final_row[5]}')

              placeholders = ','.join(['%s'] * len(task_ids))
              with selected.cursor() as cursor:
                  cursor.execute(
                      f"""
                      SELECT count(*),
                             count(*) FILTER (WHERE status IN ('OWNER_REQUIRED','FAILED_CLOSED','BUDGET_STOP','DONE','CANCELLED')),
                             (SELECT count(*) FROM autopilot.evidence v WHERE v.task_id::text = ANY(%s) AND v.retained)
                        FROM autopilot.task
                       WHERE task_id::text IN ({placeholders})
                      """,
                      (task_ids, *task_ids),
                  )
                  totals = cursor.fetchone()
              if totals[0] != 3 or totals[1] != 3:
                  print('AUTOPILOT_UV_P1_TERMINAL_COUNT=FAIL')
                  sys.exit(26)

          print('AUTOPILOT_DURABLE_TASK_COUNT=3')
          print(f'AUTOPILOT_UV_P1_TERMINAL_TASK_COUNT={totals[1]}')
          print(f'AUTOPILOT_UV_P1_RETAINED_EVIDENCE_COUNT={totals[2]}')
          print('REAL_VIDEO_EXECUTION=NO')
          print('DRIVE_WRITE=NO')
          print('ORACLE_LIFECYCLE_ACTION=NO')
          print('PRODUCTION_MUTATION=NO')
          PY
          REMOTE

      - name: Publish bounded registration receipt
        if: always()
        shell: bash
        run: |
          {
            echo '### Universal Video P1 Autopilot registration'
            echo '- target: temporary Neon branch `br-still-tooth-b1ilkfcj` only'
            echo '- bounded ingress: `autopilot.register_approved_uv_p1_ci(text)`'
            echo '- allowed work: exact-head GitHub CI snapshots only'
            echo '- production database contacted: `NO`'
            echo '- migration applied by this run: `NO`'
            echo '- real media execution: `NO`'
            echo '- Drive write: `NO`'
            echo '- Oracle lifecycle action: `NO`'
          } >> "$GITHUB_STEP_SUMMARY"
