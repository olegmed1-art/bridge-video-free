name: Autopilot Token Broker Contract

on:
  pull_request:
    paths:
      - 'autopilot_token_broker_service/**'
      - '.github/workflows/autopilot-token-broker.yml'
  push:
    branches:
      - main
      - codex/oracle-autopilot-lite-shadow
    paths:
      - 'autopilot_token_broker_service/**'
      - '.github/workflows/autopilot-token-broker.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: autopilot_token_broker_service/pyproject.toml
      - name: Install exact service
        run: python -m pip install --disable-pip-version-check -q -e ./autopilot_token_broker_service
      - name: Compile
        run: python -m compileall -q autopilot_token_broker_service/broker_app
      - name: Unit and contract tests
        run: python -m unittest discover -s autopilot_token_broker_service/tests -p 'test_*.py' -v
      - name: Independent static boundary
        run: python autopilot_token_broker_service/tools/verify_token_broker_contract.py
      - name: Physical no-merge contract
        shell: bash
        run: |
          set -euo pipefail
          result="$(python autopilot_token_broker_service/tools/verify_token_broker_contract.py)"
          python - "$result" <<'PY'
          import json
          import sys

          result = json.loads(sys.argv[1])
          assert result["result"] == "PASS"
          assert result["policy_version"] == "physical-no-merge-v1"
          assert result["merge_routes"] == 0
          assert result["delete_routes"] == 0
          assert result["raw_token_responses"] == 0
          PY
      - name: Secret scan
        run: bash ops/check_no_committed_secrets.sh
