name: Oracle idle review fixes once

on:
  push:
    branches:
      - autopilot/oracle-idle-stop-guard-627-v2
    paths:
      - '.github/workflows/oracle-idle-review-fixes-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: autopilot/oracle-idle-stop-guard-627-v2
          fetch-depth: 0
      - name: Apply exact review patch
        run: python3 tools/patch_oracle_idle_review_fixes.py
      - name: Validate safety surface
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n ops/oracle_idle_state.sh
          bash -n ops/install_oracle_idle_state_ocarun.sh
          python3 -m py_compile ops/oracle_idle_stop_guard.py tests/test_oracle_idle_stop_guard.py tests/test_oracle_idle_workload_fence.py
          python3 -m pip install -q pytest pyyaml
          python3 -m pytest -q tests/test_oracle_idle_stop_guard.py tests/test_oracle_idle_unknown_precedence.py tests/test_oracle_idle_workload_fence.py
          git diff --check
      - name: Commit fixes and remove helpers
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/oracle-idle-review-fixes-once.yml tools/patch_oracle_idle_review_fixes.py
          git config user.name 'olegmed1-art'
          git config user.email '315099490+olegmed1-art@users.noreply.github.com'
          git add -A
          git commit -m 'fix(oracle): close final idle guard install review gaps'
          git push origin HEAD:autopilot/oracle-idle-stop-guard-627-v2
