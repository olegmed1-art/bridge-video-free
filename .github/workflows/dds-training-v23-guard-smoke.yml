name: DDS methodology v2.3 launch guard

on:
  push:
    branches: [dds-training-local]
    paths:
      - 'dds_training/run_stage_v23.py'
      - 'dds_training/run_stage_v23_guard_selftest.py'
      - 'dds_training/STAGE2_READINESS_V23.json'
      - '.github/workflows/dds-training-v23-guard-smoke.yml'
  workflow_dispatch:

concurrency:
  group: dds-methodology-v23-guard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  launch-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Compile v2.3 launch guard
        working-directory: dds_training
        run: python -m py_compile run_stage_v23.py run_stage_v23_guard_selftest.py

      - name: Verify Stage 2 is blocked and double-confirmation is enforced
        working-directory: dds_training
        run: python run_stage_v23_guard_selftest.py

      - name: Confirm no mass-training workflow was invoked
        run: |
          echo '{"stage2_mass_training_started":false,"guard":"passed"}'
