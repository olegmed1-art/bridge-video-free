name: OCI backup bucket review harness

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Exact reviewed mode gate; write probe requires separate policy review and one-write approval'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: oracle-light-backup-mutation
  cancel-in-progress: false

jobs:
  inventory:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'olegmed1-art/bridge-video-free' &&
      github.actor == 'olegmed1-art' &&
      github.triggering_actor == 'olegmed1-art' &&
      github.ref == 'refs/heads/review/oci-readonly-inventory-20261001' &&
      (inputs.source_run_id == format('oci-backup-bucket-metadata-v1:{0}', github.sha) ||
       inputs.source_run_id == format('oci-backup-write-probe-v1:{0}:policies-reviewed:one-write-approved', github.sha))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate reviewed ref before checkout and credentials
        env:
          REVIEW_GATE: ${{ inputs.source_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REVIEW_GATE" == "oci-backup-bucket-metadata-v1:$GITHUB_SHA" || "$REVIEW_GATE" == "oci-backup-write-probe-v1:$GITHUB_SHA:policies-reviewed:one-write-approved" ]]
          [[ "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" ]]
          [[ "$GITHUB_WORKFLOW_REF" == 'olegmed1-art/bridge-video-free/.github/workflows/oracle-epoch-readonly-probe.yml@refs/heads/review/oci-readonly-inventory-20261001' ]]
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Offline safety tests before credentials
        run: |
          python -m unittest discover -s tests -p 'test_oci_readonly_inventory*.py'
          python -m unittest discover -s tests -p 'test_oci_backup_bucket_metadata.py'
          python -m unittest discover -s tests -p 'test_oci_backup_write_probe.py'
      - name: Install pinned SDK without OCI credentials
        run: timeout 60s python -m pip install --disable-pip-version-check --quiet 'oci==2.187.1'
      - name: Construct real SDK clients with synthetic key and network blocked
        run: |
          python -c "import oci; assert oci.__version__ == '2.187.1'"
          python -m unittest discover -s tests -p 'test_oci_readonly_inventory_sdk.py'
      - name: GET metadata of the one owner-authorized backup bucket
        if: inputs.source_run_id == format('oci-backup-bucket-metadata-v1:{0}', github.sha)
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
        run: python -m ops.oci_backup_bucket_metadata
      - name: Separately approved one-object synthetic write and readback
        if: inputs.source_run_id == format('oci-backup-write-probe-v1:{0}:policies-reviewed:one-write-approved', github.sha)
        env:
          WRITE_GATE: ${{ inputs.source_run_id }}
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
        run: python -m ops.oci_backup_write_probe
