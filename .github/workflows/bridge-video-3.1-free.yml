name: bridge-video-3.1-free

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Opaque deterministic job id"
        required: true
        type: string
  push:
    paths:
      - 'run_requests/*.txt'

permissions:
  contents: read
  id-token: write

concurrency:
  group: bridge-${{ github.event_name }}-${{ github.sha }}-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  free-guard-and-worker:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330

    env:
      BRIDGE_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      BRIDGE_RUNNER_LABEL: ubuntu-24.04
      BRIDGE_LARGER_RUNNER: "false"
      BRIDGE_PAID_CLOUD: "false"
      BRIDGE_BILLING_FALLBACK: "false"
      PYTHONUNBUFFERED: "1"
      WHISPER_MODEL: small
      GOOGLE_DRIVE_OAUTH_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_JSON }}

    steps:
      - name: Checkout public technical code only
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve opaque job id
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            JOB_ID='${{ inputs.job_id }}'
          else
            REQUEST_FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^run_requests/.*\.txt$' | head -n 1)"
            test -n "$REQUEST_FILE"
            JOB_ID="$(sed -n 's/^JOB_ID=//p' "$REQUEST_FILE" | tail -n 1 | tr -d '[:space:]')"
            if [ -z "$JOB_ID" ]; then
              JOB_ID="$(basename "$REQUEST_FILE" .txt)"
            fi
          fi
          test -n "$JOB_ID"
          case "$JOB_ID" in
            *[!0-9a-f]*) echo "invalid opaque job id" >&2; exit 2 ;;
          esac
          test "${#JOB_ID}" -eq 32
          echo "BRIDGE_JOB_ID=$JOB_ID" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud with Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: bridge-video-automation
          workload_identity_provider: projects/499454355457/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: bridge-video-worker@bridge-video-automation.iam.gserviceaccount.com
          create_credentials_file: true

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install free open-source runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check \
            google-auth requests faster-whisper pillow imagehash \
            opencv-python-headless reportlab pymupdf 'psycopg[binary]'

      - name: Google ADC preflight
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import google.auth
          from google.auth.transport.requests import Request
          creds, project = google.auth.default(scopes=['https://www.googleapis.com/auth/drive'])
          creds.refresh(Request())
          if not creds.token:
              raise SystemExit('BLOCKED_ACCESS: ADC token unavailable')
          print('Google Workload Identity ADC preflight: PASS')
          PY

      - name: Google Drive user OAuth preflight
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from run_drive_3_1_free_oidc import user_oauth_token
          token = user_oauth_token()
          if not token:
              raise SystemExit('BLOCKED_ACCESS: GOOGLE_DRIVE_OAUTH_JSON secret is not configured')
          print('Google Drive user OAuth preflight: PASS')
          PY

      - name: Worker database runtime preflight
        shell: bash
        env:
          BRIDGE_WORKER_DATABASE_URL: ${{ secrets.BRIDGE_WORKER_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${BRIDGE_WORKER_DATABASE_URL:-}" ]; then
            echo 'RUNTIME_DB_PREFLIGHT: SKIPPED — BRIDGE_WORKER_DATABASE_URL is not configured'
            exit 0
          fi
          python database/runtime_worker_preflight.py

      - name: FREE-GUARD
        run: python bridge_worker_3_1_free.py

      - name: Process one opaque Drive job
        env:
          BRIDGE_WORKER_DATABASE_URL: ${{ secrets.BRIDGE_WORKER_DATABASE_URL }}
        run: python run_drive_3_1_free_oidc.py

      # User media/transcripts are never uploaded as GitHub workflow artifacts.
