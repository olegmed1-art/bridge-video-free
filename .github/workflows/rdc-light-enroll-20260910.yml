name: Light boot-volume recovery preflight

on:
  push:
    branches: [ops/rdc-light-enroll-20260910]
    paths: ['.github/workflows/rdc-light-enroll-20260910.yml']

permissions:
  contents: read

concurrency:
  group: oracle-light-rdc-enrollment
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OCI_CLI_CONFIG: ${{ secrets.OCI_CLI_CONFIG }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
      LIGHT_INSTANCE_ID: ocid1.instance.oc1.eu-frankfurt-1.antheljtruoejaicnbolm4whz6iex5lduf4gvk42jaj5maselesau66vvxpq
      HEAVY_INSTANCE_ID: ocid1.instance.oc1.eu-frankfurt-1.antheljtruoejaica7hj5oubnh2cctnjr7ti7llcgo6ho6wdvgvui6td7saq
      EXPECTED_HEAVY_FINGERPRINT: SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Configure bounded OCI client
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${OCI_CLI_CONFIG:-}"
          test -n "${OCI_CLI_KEY_CONTENT:-}"
          test -n "${ORACLE_SSH_PRIVATE_KEY:-}"
          python -m pip install --disable-pip-version-check --quiet 'oci-cli==3.90.3'
          umask 077
          mkdir -p "$HOME/.oci"
          if [[ "$OCI_CLI_KEY_CONTENT" == base64:* ]]; then
            printf '%s' "${OCI_CLI_KEY_CONTENT#base64:}" | base64 --decode > "$HOME/.oci/key.pem"
          else
            printf '%s\n' "$OCI_CLI_KEY_CONTENT" > "$HOME/.oci/key.pem"
          fi
          printf '%s\n' "$OCI_CLI_CONFIG" > "$HOME/.oci/config"
          openssl pkey -in "$HOME/.oci/key.pem" -traditional -out "$HOME/.oci/key-pkcs1.pem"
          mv "$HOME/.oci/key-pkcs1.pem" "$HOME/.oci/key.pem"
          fingerprint="$(openssl pkey -in "$HOME/.oci/key.pem" -pubout -outform DER | openssl md5 -r | awk '{print $1}' | sed 's/../&:/g;s/:$//')"
          export OCI_DERIVED_FINGERPRINT="$fingerprint"
          python - <<'PY'
          import os
          from pathlib import Path
          p=Path.home()/'.oci/config'
          lines=[]; key=region=fp=False
          for line in p.read_text().splitlines():
              s=line.strip()
              if s.startswith('key_file='):
                  lines.append(f'key_file={Path.home()}/".oci"/"key.pem"}'); key=True
              elif s.startswith('region='):
                  lines.append('region=eu-frankfurt-1'); region=True
              elif s.startswith('fingerprint='):
                  lines.append(f'fingerprint={os.environ["OCI_DERIVED_FINGERPRINT"]}'); fp=True
              else: lines.append(line)
          if not key: lines.append(f'key_file={Path.home()/".oci"/"key.pem"}')
          if not region: lines.append('region=eu-frankfurt-1')
          if not fp: lines.append(f'fingerprint={os.environ["OCI_DERIVED_FINGERPRINT"]}')
          p.write_text('\n'.join(lines)+'\n')
          PY
          oci iam region list --output json >/dev/null
          printf '%s\n' "$ORACLE_SSH_PRIVATE_KEY" | tr -d '\r' > "$RUNNER_TEMP/heavy_key"
          chmod 600 "$RUNNER_TEMP/heavy_key"
          ssh-keygen -y -f "$RUNNER_TEMP/heavy_key" > "$RUNNER_TEMP/approved_key.pub"
          echo "APPROVED_KEY_FINGERPRINT=$(ssh-keygen -lf "$RUNNER_TEMP/approved_key.pub" | awk '{print $2}')"

      - name: Verify exact instances and movable boot volume
        shell: bash
        run: |
          set -Eeuo pipefail
          oci compute instance get --instance-id "$LIGHT_INSTANCE_ID" > "$RUNNER_TEMP/light.json"
          oci compute instance get --instance-id "$HEAVY_INSTANCE_ID" > "$RUNNER_TEMP/heavy.json"
          python - "$RUNNER_TEMP/light.json" "$RUNNER_TEMP/heavy.json" <<'PY'
          import json,sys
          light=json.load(open(sys.argv[1]))['data']
          heavy=json.load(open(sys.argv[2]))['data']
          assert light['display-name']=='bridge-school-autopilot-lite', light['display-name']
          assert light['shape']=='VM.Standard.A1.Flex', light['shape']
          assert light['lifecycle-state']=='RUNNING', light['lifecycle-state']
          assert heavy['display-name']=='bridge-school-dds3-frankfurt', heavy['display-name']
          assert heavy['lifecycle-state']=='RUNNING', heavy['lifecycle-state']
          assert light['availability-domain']==heavy['availability-domain'], (light['availability-domain'],heavy['availability-domain'])
          print('EXACT_INSTANCE_GUARDS=PASS')
          print('SAME_AVAILABILITY_DOMAIN=PASS')
          print('AVAILABILITY_DOMAIN='+light['availability-domain'])
          print('COMPARTMENT_ID='+light['compartment-id'])
          PY
          compartment="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["data"]["compartment-id"])' "$RUNNER_TEMP/light.json")"
          oci compute boot-volume-attachment list --compartment-id "$compartment" --instance-id "$LIGHT_INSTANCE_ID" --all > "$RUNNER_TEMP/light-bva.json"
          python - "$RUNNER_TEMP/light-bva.json" <<'PY' > "$RUNNER_TEMP/bva.env"
          import json,sys
          rows=[x for x in json.load(open(sys.argv[1]))['data'] if x.get('lifecycle-state')=='ATTACHED']
          assert len(rows)==1, rows
          x=rows[0]
          print('BOOT_VOLUME_ATTACHMENT_ID='+x['id'])
          print('BOOT_VOLUME_ID='+x['boot-volume-id'])
          PY
          source "$RUNNER_TEMP/bva.env"
          echo "BOOT_VOLUME_ATTACHMENT_ID=$BOOT_VOLUME_ATTACHMENT_ID" >> "$GITHUB_ENV"
          echo "BOOT_VOLUME_ID=$BOOT_VOLUME_ID" >> "$GITHUB_ENV"
          oci bv boot-volume get --boot-volume-id "$BOOT_VOLUME_ID" > "$RUNNER_TEMP/boot.json"
          python - "$RUNNER_TEMP/boot.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))['data']
          assert x['lifecycle-state']=='AVAILABLE', x['lifecycle-state']
          print('LIGHT_BOOT_VOLUME_IDENTIFIED=PASS')
          print('BOOT_VOLUME_SIZE_GB='+str(x['size-in-gbs']))
          PY

      - name: Verify Heavy SSH and bounded recovery prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          oci compute instance list-vnics --instance-id "$HEAVY_INSTANCE_ID" --all > "$RUNNER_TEMP/heavy-vnics.json"
          heavy_ip="$(python - "$RUNNER_TEMP/heavy-vnics.json" <<'PY'
          import json,sys
          rows=[x for x in json.load(open(sys.argv[1]))['data'] if x.get('is-primary')]
          assert len(rows)==1 and rows[0].get('public-ip')
          print(rows[0]['public-ip'])
          PY
          )"
          [[ "$heavy_ip" == 158.180.47.161 ]]
          known="$RUNNER_TEMP/heavy-known-hosts"
          scan="$(ssh-keyscan -T 10 -t ed25519 "$heavy_ip" 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$known"
          actual="$(ssh-keygen -lf "$known" | awk '{print $2}' | head -1)"
          [[ "$actual" == "$EXPECTED_HEAVY_FINGERPRINT" ]]
          ssh -i "$RUNNER_TEMP/heavy_key" -o BatchMode=yes -o IdentitiesOnly=yes             -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" -o ConnectTimeout=15             "ubuntu@$heavy_ip" 'sudo -n true; test "$(hostname)" = bridge-school-dds3-frankfurt; findmnt -no SOURCE /; lsblk -dn -o NAME,SIZE,TYPE'
          echo "HEAVY_IP=$heavy_ip" >> "$GITHUB_ENV"
          echo "HEAVY_KNOWN_HOSTS=$known" >> "$GITHUB_ENV"
          echo 'HEAVY_RECOVERY_HOST_PREFLIGHT=PASS'

      - name: Publish preflight verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'BOOT_VOLUME_RECOVERY_PREFLIGHT=PASS'
          echo 'LIGHT_STOP_REQUESTED=NO'
          echo 'VOLUME_ATTACHMENT_MUTATION=NO'
          echo 'HEAVY_FILESYSTEM_MUTATION=NO'
