name: Oracle Operator v2

on:
  pull_request:
    paths:
      - '.github/workflows/oracle-operator-v2.yml'
      - 'ops/install_ben_runtime.sh'
      - 'ops/install_dds3_runtime.sh'
      - 'ops/oracle_known_hosts_from_scan.sh'
      - 'ops/oracle_ben_benchmark.py'
      - 'tests/test_oracle_ben_benchmark.py'
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: oracle-operator-v2-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  contract:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: |
          set -euo pipefail
          ruby -e "require 'yaml'; YAML.parse_file(ARGV.fetch(0))" .github/workflows/oracle-operator-v2.yml
          grep -F '/oracle-v2 rollout-worker' .github/workflows/oracle-operator-v2.yml >/dev/null
          grep -F '/oracle-v2 rollout-dds3-runtime' .github/workflows/oracle-operator-v2.yml >/dev/null
          grep -F '/oracle-v2 canary-worlds' .github/workflows/oracle-operator-v2.yml >/dev/null
          grep -F '/oracle-v2 rollout-ben' .github/workflows/oracle-operator-v2.yml >/dev/null
          grep -F '/oracle-v2 canary-ben' .github/workflows/oracle-operator-v2.yml >/dev/null
          grep -F '/oracle-v2 canary-ben-dds3' .github/workflows/oracle-operator-v2.yml >/dev/null
          grep -F '/oracle-v2 benchmark-ben-100-500' .github/workflows/oracle-operator-v2.yml >/dev/null
          bash -n ops/install_ben_runtime.sh ops/install_dds3_runtime.sh ops/oracle_known_hosts_from_scan.sh
          python -m py_compile ops/oracle_ben_benchmark.py
          grep -F 'ghcr.io/lorserker/ben@sha256:' .github/workflows/oracle-operator-v2.yml >/dev/null
          grep -F '127.0.0.1:8085:8085' ops/install_ben_runtime.sh >/dev/null
          grep -F -- '--read-only' ops/install_ben_runtime.sh >/dev/null

  operate:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.comment.user.login == 'olegmed1-art' &&
      (github.event.comment.body == '/oracle-v2 rollout-worker' ||
       github.event.comment.body == '/oracle-v2 rollout-dds3-runtime' ||
       github.event.comment.body == '/oracle-v2 canary-worlds' ||
       github.event.comment.body == '/oracle-v2 rollout-ben' ||
       github.event.comment.body == '/oracle-v2 canary-ben' ||
       github.event.comment.body == '/oracle-v2 canary-ben-dds3' ||
       github.event.comment.body == '/oracle-v2 benchmark-ben-100-500')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ORACLE_HOST: 158.180.47.161
      ORACLE_USER: ubuntu
      EXPECTED_FINGERPRINT: SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk
      BEN_IMAGE: ghcr.io/lorserker/ben@sha256:474065d99c796a54e32cab4a83dee09685749cff2fbde5edc84ab2b961ba514d
      SSH_KEY_ORACLE: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
      SSH_KEY_OCI: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
      SSH_KEY_VM: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
      SSH_KEY_BRIDGE: ${{ secrets.BRIDGE_SCHOOL_ORACLE_SSH_PRIVATE_KEY }}
      SSH_KEY_ORACLE_ALT: ${{ secrets.ORACLE_SSH_KEY }}
      SSH_KEY_OCI_ALT: ${{ secrets.OCI_SSH_KEY }}
      COMMAND: ${{ github.event.comment.body }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Resolve host and a normalized working SSH key
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/oracle-v2"; mkdir -p "$work"
          known="$work/known_hosts"
          ops/oracle_known_hosts_from_scan.sh "$ORACLE_HOST" "$EXPECTED_FINGERPRINT" "$known"

          selected=''
          selected_name=''
          idx=0
          for name in SSH_KEY_ORACLE SSH_KEY_OCI SSH_KEY_VM SSH_KEY_BRIDGE SSH_KEY_ORACLE_ALT SSH_KEY_OCI_ALT; do
            raw="${!name:-}"
            [[ -n "$raw" ]] || continue
            idx=$((idx+1))
            base="$work/key-$idx"
            candidates=("$base.raw" "$base.crlf" "$base.escaped")
            printf '%s\n' "$raw" > "${candidates[0]}"
            tr -d '\r' < "${candidates[0]}" > "${candidates[1]}"
            printf '%s' "$raw" | python -c '
          import sys
          raw = sys.stdin.read()
          path = sys.argv[1]
          if "\\n" in raw and "\n" not in raw:
              raw = raw.replace("\\r", "").replace("\\n", "\n")
          with open(path, "w", newline="\n") as handle:
              handle.write(raw)
              if not raw.endswith("\n"):
                  handle.write("\n")
          ' "${candidates[2]}"
            for key in "${candidates[@]}"; do
              chmod 0600 "$key"
              ssh-keygen -y -f "$key" >/dev/null 2>&1 || continue
              if ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
                   -o UserKnownHostsFile="$known" -o ConnectTimeout=10 "$ORACLE_USER@$ORACLE_HOST" true >/dev/null 2>&1; then
                selected="$key"; selected_name="$name"; break 2
              fi
            done
          done
          [[ -n "$selected" ]]
          cp "$selected" "$work/id_oracle"; chmod 0600 "$work/id_oracle"
          echo "key=$work/id_oracle" >> "$GITHUB_OUTPUT"
          echo "known=$known" >> "$GITHUB_OUTPUT"
          echo "selected_name=$selected_name" >> "$GITHUB_OUTPUT"

      - name: Roll out reviewed main worker
        id: worker
        if: ${{ env.COMMAND == '/oracle-v2 rollout-worker' }}
        shell: bash
        run: |
          set -euo pipefail
          ref="$(git rev-parse HEAD)"
          ssh -i '${{ steps.ssh.outputs.key }}' -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='${{ steps.ssh.outputs.known }}' -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST" "sudo -n env WORKER_GIT_REF='$ref' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          repo=/opt/bridge-school/bridge-video-free
          git -C "$repo" fetch --quiet origin "$WORKER_GIT_REF"
          git -C "$repo" cat-file -e "$WORKER_GIT_REF^{commit}"
          git -C "$repo" checkout --force --quiet --detach "$WORKER_GIT_REF"
          /opt/bridge-school/assistant-lab/.venv/bin/python -m py_compile \
            "$repo/assistant_lab/worker.py" \
            "$repo/assistant_lab/ben_runtime.py" \
            "$repo/assistant_lab/contract.py" \
            "$repo/bridge_school_api/ai_auction_rollout.py" \
            "$repo/bridge_school_api/ai_auction_scoring.py" \
            "$repo/bridge_school_api/ai_ben_dds3_canary.py"
          systemctl restart assistant-lab.service
          sleep 3
          systemctl is-active --quiet assistant-lab.service
          curl -fsS --max-time 5 http://127.0.0.1:8080/readyz >/dev/null
          REMOTE

      - name: Roll out reviewed localhost DDS3 runtime
        id: dds3
        if: ${{ env.COMMAND == '/oracle-v2 rollout-dds3-runtime' }}
        shell: bash
        run: |
          set -euo pipefail
          ref="$(git rev-parse HEAD)"
          ssh -i '${{ steps.ssh.outputs.key }}' -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='${{ steps.ssh.outputs.known }}' -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST" \
            "sudo -n env DDS3_GIT_REF='$ref' bash -s" < ops/install_dds3_runtime.sh

      - name: Roll out localhost BEN runtime
        id: ben
        if: ${{ env.COMMAND == '/oracle-v2 rollout-ben' }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i '${{ steps.ssh.outputs.key }}' -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='${{ steps.ssh.outputs.known }}' -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST" \
            "sudo -n env BEN_IMAGE='$BEN_IMAGE' bash -s" < ops/install_ben_runtime.sh

      - name: Run unique Oracle WORLDS canary
        id: worlds
        if: ${{ env.COMMAND == '/oracle-v2 canary-worlds' }}
        env:
          CANARY_RUN_ID: ${{ github.run_id }}
          CANARY_RUN_ATTEMPT: ${{ github.run_attempt }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$NEON_DATABASE_URL" ]]
          python -m pip install --disable-pip-version-check --no-input --quiet 'psycopg[binary]==3.3.4'
          python - <<'PY'
          import os
          import time

          import psycopg
          from psycopg.rows import dict_row
          from psycopg.types.json import Jsonb

          from assistant_lab.contract import canonical_idempotency_key, validate_job_payload

          count = 4
          run_id = int(os.environ["CANARY_RUN_ID"])
          run_attempt = int(os.environ["CANARY_RUN_ATTEMPT"])
          payload = validate_job_payload("WORLD_GENERATE", {
              "known_seat": "N",
              "known_hand_pbn": "AKQJ.T98.765.432",
              "constraints": None,
              "count": count,
              "seed": (run_id % 200_000_000) * 10 + run_attempt,
          })
          idempotency_key = canonical_idempotency_key("WORLD_GENERATE", payload)
          provenance = {
              "dispatcher": "github-oracle-v2-worlds-canary",
              "github_run_id": str(run_id),
              "github_run_attempt": run_attempt,
          }

          with psycopg.connect(os.environ["NEON_DATABASE_URL"], autocommit=True, row_factory=dict_row) as conn:
              with conn.cursor() as cur:
                  cur.execute(
                      """SELECT * FROM assistant_lab.enqueue_job(
                          %s, %s, %s::smallint, %s, %s, %s,
                          now() + interval '5 minutes', NULL
                      )""",
                      (
                          "WORLD_GENERATE",
                          Jsonb(payload),
                          10,
                          idempotency_key,
                          "GITHUB_ORACLE_V2_WORLDS_CANARY",
                          Jsonb(provenance),
                      ),
                  )
                  job = cur.fetchone()

              deadline = time.monotonic() + 180
              while job["status"] not in {"COMPLETED", "FAILED", "CANCELLED"}:
                  if time.monotonic() >= deadline:
                      raise TimeoutError("WORLDS canary did not reach a terminal state")
                  time.sleep(2)
                  with conn.cursor() as cur:
                      cur.execute("SELECT * FROM assistant_lab.job WHERE job_id = %s", (job["job_id"],))
                      job = cur.fetchone()

          if job["status"] != "COMPLETED":
              raise RuntimeError(f"WORLDS canary ended with {job['status']}: {job['error_text']}")
          if job["attempts"] != 1 or job["claimed_by"] != "oracle-assistant-lab-1":
              raise RuntimeError("WORLDS canary worker/attempt provenance mismatch")

          result = dict(job["result_json"] or {})
          provenance = dict(job["provenance_json"] or {})
          if not (
              result.get("engine") == "WORLD_GENERATOR"
              and result.get("fallback_used") is False
              and result.get("complete") is True
              and result.get("requested") == count
              and result.get("accepted") == count
              and len(result.get("worlds") or []) == count
          ):
              raise RuntimeError("WORLDS canary result contract mismatch")
          if not (
              provenance.get("worker_id") == "oracle-assistant-lab-1"
              and provenance.get("execution_path") == "oracle_local_world_generator"
          ):
              raise RuntimeError("WORLDS canary execution provenance mismatch")

          for world in result["worlds"]:
              cards = []
              for hand in world["hands"].values():
                  for suit, ranks in zip("SHDC", hand.split(".")):
                      cards.extend(suit + rank for rank in ranks)
              if len(cards) != 52 or len(set(cards)) != 52:
                  raise RuntimeError("WORLDS canary produced an invalid 52-card deal")
              if world["hands"]["N"] != payload["known_hand_pbn"]:
                  raise RuntimeError("WORLDS canary did not preserve the known hand")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"job_id={job['job_id']}\n")
          print(f"WORLDS_CANARY_PASS job_id={job['job_id']} worlds={count} attempts=1")
          PY

      - name: Run unique Oracle BEN canary
        id: ben_canary
        if: ${{ env.COMMAND == '/oracle-v2 canary-ben' }}
        env:
          CANARY_RUN_ID: ${{ github.run_id }}
          CANARY_RUN_ATTEMPT: ${{ github.run_attempt }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$NEON_DATABASE_URL" ]]
          python -m pip install --disable-pip-version-check --no-input --quiet 'psycopg[binary]==3.3.4'
          python - <<'PY'
          import os
          import time

          import psycopg
          from psycopg.rows import dict_row
          from psycopg.types.json import Jsonb

          from assistant_lab.contract import canonical_idempotency_key, validate_job_payload, verify_ben_result

          run_id = int(os.environ["CANARY_RUN_ID"])
          run_attempt = int(os.environ["CANARY_RUN_ATTEMPT"])
          payload = validate_job_payload("BEN_COMPUTE", {
              "hand": "AK97543.K.T3.AK7",
              "seat": "S",
              "dealer": "N",
              "vul": "",
              "auction": [],
          })
          idempotency_key = (
              f"{canonical_idempotency_key('BEN_COMPUTE', payload)}"
              f":canary:{run_id}:{run_attempt}"
          )
          provenance = {
              "dispatcher": "github-oracle-v2-ben-canary",
              "github_run_id": str(run_id),
              "github_run_attempt": run_attempt,
          }

          with psycopg.connect(os.environ["NEON_DATABASE_URL"], autocommit=True, row_factory=dict_row) as conn:
              with conn.cursor() as cur:
                  cur.execute(
                      """SELECT * FROM assistant_lab.enqueue_job(
                          %s, %s, %s::smallint, %s, %s, %s,
                          now() + interval '5 minutes', NULL
                      )""",
                      (
                          "BEN_COMPUTE",
                          Jsonb(payload),
                          10,
                          idempotency_key,
                          "GITHUB_ORACLE_V2_BEN_CANARY",
                          Jsonb(provenance),
                      ),
                  )
                  job = cur.fetchone()

              deadline = time.monotonic() + 180
              while job["status"] not in {"COMPLETED", "FAILED", "CANCELLED"}:
                  if time.monotonic() >= deadline:
                      raise TimeoutError("BEN canary did not reach a terminal state")
                  time.sleep(2)
                  with conn.cursor() as cur:
                      cur.execute("SELECT * FROM assistant_lab.job WHERE job_id = %s", (job["job_id"],))
                      job = cur.fetchone()

          if job["status"] != "COMPLETED":
              raise RuntimeError(f"BEN canary ended with {job['status']}: {job['error_text']}")
          if job["attempts"] != 1 or job["claimed_by"] != "oracle-assistant-lab-1":
              raise RuntimeError("BEN canary worker/attempt provenance mismatch")

          result = verify_ben_result(job["result_json"])
          provenance = dict(job["provenance_json"] or {})
          if not (
              result.get("engine") == "BEN"
              and result.get("evidence_class") == "POLICY_ONLY"
              and result.get("dds_search_evidence") is False
          ):
              raise RuntimeError("BEN canary policy-only contract mismatch")
          if not (
              provenance.get("worker_id") == "oracle-assistant-lab-1"
              and provenance.get("execution_path") == "oracle_local_ben_policy"
          ):
              raise RuntimeError("BEN canary execution provenance mismatch")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"job_id={job['job_id']}\n")
          print(f"BEN_CANARY_PASS job_id={job['job_id']} attempts=1 evidence=POLICY_ONLY")
          PY

      - name: Run bounded Oracle BEN to DDS3 scoring canary
        id: ben_dds3_canary
        if: ${{ env.COMMAND == '/oracle-v2 canary-ben-dds3' }}
        shell: bash
        run: |
          set -euo pipefail
          detail="$RUNNER_TEMP/ben-dds3-canary.log"
          set +e
          ssh -i '${{ steps.ssh.outputs.key }}' -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='${{ steps.ssh.outputs.known }}' -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST" 'sudo -n bash -s' >"$detail" 2>&1 <<'REMOTE'
          set -Eeuo pipefail
          repo=/opt/bridge-school/bridge-video-free
          env_file=/opt/bridge-school/assistant-lab/assistant-lab.env
          [[ -r "$env_file" ]]
          [[ -f "$repo/bridge_school_api/ai_ben_dds3_canary.py" ]]
          systemctl is-active --quiet assistant-lab.service
          systemctl is-active --quiet bridge-ben.service
          curl -fsS --max-time 5 http://127.0.0.1:8080/readyz >/dev/null
          [[ -r /opt/bridge-school/dds3-runtime.env ]]
          systemd-run --quiet --wait --pipe --collect --service-type=exec \
            --property=User=assistant-lab \
            --property=Group=assistant-lab \
            --property=WorkingDirectory="$repo" \
            --property=EnvironmentFile="$env_file" \
            --property=EnvironmentFile=/opt/bridge-school/dds3-runtime.env \
            --property=NoNewPrivileges=yes \
            --property=PrivateTmp=yes \
            --property=ProtectHome=yes \
            /opt/bridge-school/assistant-lab/.venv/bin/python \
            -m bridge_school_api.ai_ben_dds3_canary
          REMOTE
          rc=$?
          set -e
          python - "$detail" >> "$GITHUB_OUTPUT" <<'PY'
          import re
          import sys
          from pathlib import Path

          raw = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          raw = re.sub(r"postgres(?:ql)?://\S+", "[REDACTED_DSN]", raw, flags=re.IGNORECASE)
          raw = re.sub(r"Bearer\s+\S+", "Bearer [REDACTED]", raw, flags=re.IGNORECASE)
          safe = re.sub(r"\s+", " ", raw).strip()[-900:]
          print(f"detail={safe or 'no diagnostic output'}")
          PY
          exit "$rc"

      - name: Run Oracle BEN Pilot-100 then Pilot-500 benchmark
        id: ben_benchmark
        if: ${{ env.COMMAND == '/oracle-v2 benchmark-ben-100-500' }}
        shell: bash
        run: |
          set -euo pipefail
          remote_script="/tmp/oracle-ben-benchmark-${GITHUB_RUN_ID}.py"
          detail="$RUNNER_TEMP/oracle-ben-benchmark.jsonl"
          scp -i '${{ steps.ssh.outputs.key }}' -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile='${{ steps.ssh.outputs.known }}' \
            -o ConnectTimeout=15 ops/oracle_ben_benchmark.py \
            "$ORACLE_USER@$ORACLE_HOST:$remote_script"
          set +e
          ssh -i '${{ steps.ssh.outputs.key }}' -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile='${{ steps.ssh.outputs.known }}' \
            -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST" \
            "sudo -n env BEN_P95_LIMIT_MS=5000 BEN_MIN_INTERVAL_SECONDS=0.65 python3 '$remote_script'; rc=\$?; sudo -n rm -f '$remote_script'; exit \$rc" \
            >"$detail" 2>&1
          rc=$?
          set -e
          cat "$detail"
          python - "$detail" >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = None
          for line in reversed(Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace").splitlines()):
              try:
                  candidate = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if candidate.get("benchmark") == "oracle-ben-pilot-100-500-v1":
                  report = candidate
                  break
          if report is None:
              print("detail=benchmark report missing")
          else:
              b100 = report.get("ben", {}).get("100", {})
              b500 = report.get("ben", {}).get("500", {})
              before = report.get("dds3", {}).get("before", {}).get("latency_ms", {})
              after = report.get("dds3", {}).get("after", {}).get("latency_ms", {})
              memory = report.get("memory", {})
              detail = (
                  f"pass={report.get('passed')} "
                  f"ben100={b100.get('successes')}/100 p50={b100.get('latency_ms', {}).get('p50')}ms p95={b100.get('latency_ms', {}).get('p95')}ms "
                  f"ben500={b500.get('successes')}/500 p50={b500.get('latency_ms', {}).get('p50')}ms p95={b500.get('latency_ms', {}).get('p95')}ms "
                  f"memory_delta={memory.get('delta_bytes')}B memory_pass={memory.get('passed')} "
                  f"dds3_p95={before.get('p95')}->{after.get('p95')}ms dds3_pass={report.get('dds3', {}).get('passed')}"
              )
              print(f"detail={detail}")
          PY
          exit "$rc"

      - name: Publish result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SSH_OUTCOME: ${{ steps.ssh.outcome }}
          WORKER_OUTCOME: ${{ steps.worker.outcome }}
          BEN_OUTCOME: ${{ steps.ben.outcome }}
          DDS3_OUTCOME: ${{ steps.dds3.outcome }}
          WORLDS_OUTCOME: ${{ steps.worlds.outcome }}
          WORLDS_JOB_ID: ${{ steps.worlds.outputs.job_id }}
          BEN_CANARY_OUTCOME: ${{ steps.ben_canary.outcome }}
          BEN_CANARY_JOB_ID: ${{ steps.ben_canary.outputs.job_id }}
          BEN_DDS3_CANARY_OUTCOME: ${{ steps.ben_dds3_canary.outcome }}
          BEN_DDS3_CANARY_DETAIL: ${{ steps.ben_dds3_canary.outputs.detail }}
          BEN_BENCHMARK_OUTCOME: ${{ steps.ben_benchmark.outcome }}
          BEN_BENCHMARK_DETAIL: ${{ steps.ben_benchmark.outputs.detail }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="Oracle v2 **${COMMAND}**: ssh=${SSH_OUTCOME}, worker=${WORKER_OUTCOME}, dds3=${DDS3_OUTCOME}, ben=${BEN_OUTCOME}, worlds=${WORLDS_OUTCOME}, worlds_job=${WORLDS_JOB_ID:-none}, ben_canary=${BEN_CANARY_OUTCOME}, ben_job=${BEN_CANARY_JOB_ID:-none}, ben_dds3_canary=${BEN_DDS3_CANARY_OUTCOME}, canary_detail=${BEN_DDS3_CANARY_DETAIL:-none}, ben_benchmark=${BEN_BENCHMARK_OUTCOME}, benchmark_detail=${BEN_BENCHMARK_DETAIL:-none}" >/dev/null
