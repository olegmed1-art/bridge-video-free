name: L1 runtime coverage audit

on:
  pull_request:
    paths:
      - 'tools/l1_runtime_coverage_audit.py'
      - 'tests/test_l1_runtime_coverage_audit.py'
      - '.github/workflows/l1-runtime-coverage-audit-ci.yml'
  push:
    branches: [main]
    paths:
      - 'tools/l1_runtime_coverage_audit.py'
      - 'tests/test_l1_runtime_coverage_audit.py'
      - '.github/workflows/l1-runtime-coverage-audit-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Print deterministic coverage snapshot
        run: python tools/l1_runtime_coverage_audit.py
      - name: Verify coverage partition
        run: python -m pytest -q tests/test_l1_runtime_coverage_audit.py
