name: Tournament teacher test-only

on:
  push:
    branches: ['test/tournament-teacher-canon-20261004']
    paths:
      - 'experiments/tournament_teacher/**'
      - 'bridge_school_api/ai_teacher.py'
      - 'bridge_school_api/tournament_teacher_test_adapter.py'
      - '.github/workflows/tournament-teacher-test-only.yml'

permissions:
  contents: read

jobs:
  offline-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: tournament_rehearsal
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - '127.0.0.1:55432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d tournament_rehearsal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest==8.4.2 PyYAML==6.0.2 httpx==0.28.1 fastapi==0.141.1 'psycopg[binary]==3.3.4'
      - name: Exact SHA and isolation preflight
        run: |
          git rev-parse HEAD
          python -m experiments.tournament_teacher.preflight
      - name: Real consumer, finite model, and L1 regression
        run: >-
          python -m pytest -q experiments/tournament_teacher
          tests/test_l1_canonical_registry.py tests/test_l1_canonical_runtime.py
          tests/test_l1_canonical_runtime_v3.py tests/test_l1_canonical_runtime_v4.py
          tests/test_l1_runtime_coverage_audit.py tests/test_knowledge_read_api.py
          tests/test_ai_api_routes.py tests/test_ai_final_decision_contract.py
      - name: Before and after, explanation and provenance
        run: python -m experiments.tournament_teacher.demo
      - name: Independent exhaustive choice-policy review
        run: python -m experiments.tournament_teacher.independent_review
      - name: All fourteen decisions with hands and source-linked results
        run: python -m experiments.tournament_teacher.coverage > tournament-teacher-evidence.json
      - name: Existing teacher HTTP API to source-linked answer
        run: python -m experiments.tournament_teacher.api_demo > tournament-teacher-api-evidence.json
      - name: Build non-activatable candidate package
        run: python -m experiments.tournament_teacher.candidate_package > tournament-candidate-package.json
      - name: Apply unchanged schema to disposable PostgreSQL 18
        run: python -m experiments.tournament_teacher.postgres_bootstrap '${{ job.services.postgres.id }}'
      - name: Rehearse candidate import, HTTP readback, gates and rollback
        run: python -m experiments.tournament_teacher.postgres_rehearsal > tournament-postgres-evidence.json
      - name: Preserve synthetic decision evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tournament-teacher-evidence-${{ github.sha }}
          path: |
            tournament-teacher-evidence.json
            tournament-teacher-api-evidence.json
            tournament-candidate-package.json
            tournament-postgres-evidence.json
          retention-days: 7
