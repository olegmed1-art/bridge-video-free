name: Bridge Video r25.12 META Evidence Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'bridge_runtime_hardening_r25_12_meta.py'
      - 'database/**'
      - 'tests/fixtures/asr_block_11_r25_11.json'
      - 'tests/test_meta_asr_gate_r25_12.py'
      - '.github/workflows/video-r25-12-meta-gate.yml'
  push:
    branches:
      - agent/video-meta-evidence-r25-12

permissions:
  contents: read

jobs:
  candidate-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install regression runtime
        run: python -m pip install --disable-pip-version-check -r requirements-worker.txt
      - name: Verify candidate and inherited evidence contracts
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/test_meta_asr_gate_r25_12.py
          PYTHONPATH=. python tests/test_asr_policy_r25_6.py
          PYTHONPATH=. python tests/test_unreliable_asr_isolation_r25_4.py
          PYTHONPATH=. python tests/test_pdf_presentation_r25_6.py
          PYTHONPATH=. python tests/test_content_persistence_r25_10.py
          PYTHONPATH=. python -m unittest tests.test_diana_longitudinal_postprocess tests.test_diana_longitudinal_quality_v2 -v
          python -m py_compile \
            bridge_runtime_hardening_r25_12_meta.py \
            database/video_result_persistence.py
      - name: Verify candidate preserves the live production baseline
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED_FILES="$(git diff --name-only HEAD^1 HEAD)"
            META_CANDIDATE_CHANGED=false
            if printf '%s\n' "$CHANGED_FILES" | grep -Eq \
              '^(bridge_runtime_hardening_r25_12_meta\.py|tests/fixtures/asr_block_11_r25_11\.json|tests/test_meta_asr_gate_r25_12\.py)$'; then
              META_CANDIDATE_CHANGED=true
            fi
            if [ "$META_CANDIDATE_CHANGED" = "true" ] && \
               printf '%s\n' "$CHANGED_FILES" | grep -Eq \
                 '^(\.github/workflows/bridge-video-3\.1-free\.yml|run_drive_3_1_free_generic\.py)$'; then
              echo 'META implementation/test candidate must not modify the production workflow/runtime adapter.' >&2
              exit 1
            fi
          fi
          python - <<'PY'
          from pathlib import Path
          import re

          workflow = Path('.github/workflows/bridge-video-3.1-free.yml').read_text(encoding='utf-8')
          adapter = Path('run_drive_3_1_free_generic.py').read_text(encoding='utf-8')
          match = re.search(
              r'BRIDGE_REQUESTED_ALGORITHM_REVISION:\s*["\']3\.1-free-r([0-9]+(?:\.[0-9]+)*)["\']',
              workflow,
          )
          if not match:
              raise SystemExit('production algorithm revision is missing or malformed')
          revision = match.group(1)
          expected_module = f"bridge_runtime_hardening_r{revision.replace('.', '_')}"
          expected_import = f'import {expected_module} as hardening'
          if expected_import not in adapter:
              raise SystemExit(
                  f'production workflow/runtime mismatch: revision r{revision} expects {expected_module}'
              )
          print(f'Production baseline preserved and internally consistent: r{revision}')
          PY
