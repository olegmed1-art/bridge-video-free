name: Global School Observer bounded read-only canary

on:
  push:
    branches: [main]
    paths:
      - "autopilot_service/autopilot_app/observer.py"
      - "autopilot_service/tools/run_observer_canary.py"
      - ".github/workflows/global-school-observer-canary.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

jobs:
  read-only-canary:
    if: github.repository == 'olegmed1-art/bridge-video-free'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Run one bounded live read-only observation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: autopilot_service
          OBSERVER_CANARY_OUTPUT: observer-canary.json
        run: python autopilot_service/tools/run_observer_canary.py

      - name: Verify canary receipt contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path("observer-canary.json").read_text(encoding="utf-8"))
          assert receipt["schema"] == "GLOBAL_SCHOOL_OBSERVER_CANARY_V1"
          assert receipt["mode"] == "READ_ONLY_CANARY"
          assert receipt["external_mutation_allowed"] is False
          assert receipt["source_state"]["autopilot_installed_receipt"]
          assert receipt["source_state"]["pr_1158_merged_at"]
          assert isinstance(receipt["finding_count"], int)
          assert receipt["finding_count"] == len(receipt["findings"])
          for finding in receipt["findings"]:
              assert finding["evidence_refs"]
              assert finding["dedupe_key"]
              assert finding["status"] == "OPEN"
          print("OBSERVER_READ_ONLY_CANARY_PASS")
          PY

      - name: Publish concise canary summary to job log
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path("observer-canary.json").read_text(encoding="utf-8"))
          print(f"mode={receipt['mode']}")
          print(f"observed_at={receipt['observed_at']}")
          print(f"finding_count={receipt['finding_count']}")
          print(f"autopilot_receipt={receipt['source_state']['autopilot_installed_receipt']}")
          print(f"observer_core_merged_at={receipt['source_state']['pr_1158_merged_at']}")
          PY
