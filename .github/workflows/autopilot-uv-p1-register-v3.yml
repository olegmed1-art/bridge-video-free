name: Autopilot Universal Video P1 bounded registration v3

on:
  push:
    branches: [codex/oracle-autopilot-lite-shadow]
    paths:
      - '.github/workflows/autopilot-uv-p1-register-v3.yml'
      - 'ops/autopilot/register_uv_p1_runtime.py'
      - 'database/migrations/0309_autopilot_uv_p1_bounded_ingress.sql'
      - 'database/migrations/0313_autopilot_uv_p1_allowlist_upgrade.sql'
  workflow_dispatch:
    inputs:
      allow_temporary_registration:
        description: 'Explicitly authorize temporary-Neon registration from Oracle'
        required: true
        type: choice
        default: 'NO'
        options: ['NO', 'YES']

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: autopilot-universal-video-p1-registration-v3
  cancel-in-progress: false

jobs:
  register:
    if: github.repository == 'olegmed1-art/bridge-video-free' && github.event_name == 'workflow_dispatch' && inputs.allow_temporary_registration == 'YES'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: database-production
    env:
      ORACLE_HOST: 158.180.47.161
      ORACLE_USER: ubuntu
      EXPECTED_FINGERPRINT: SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk
      SSH_KEY_ORACLE: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
      PROJECT_ID: misty-poetry-18012774
      TEMP_BRANCH_ID: br-still-tooth-b1ilkfcj
      PRODUCTION_BRANCH_ID: br-wispy-lab-b1rq54of
      LEGACY_PRODUCTION_BRANCH_ID: br-cold-moon-a1sgkzfd
      TEMP_ENDPOINT_ID: ep-floral-field-b1pjs2of
      MIGRATION_ROLE: autopilot_migration_owner_login
      EXPECTED_0309_BLOB: c0cbc59177c5926079c8657b4d7649b5a6a4181f
      EXPECTED_0309_SHA256: 14db4783f63375e79f8340be4c6f26ff27211eb0f920deec8455777098343422
      EXPECTED_0313_BLOB: fa86391dd960ec19752099c83147faf8a9d3c5ae
      EXPECTED_0313_SHA256: e6184520c9df8d3ab8565fc80eb81c604b79a056e8ced4d1ec5b7246c9ccfd39
    steps:
      - name: Checkout exact Autopilot source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Validate bounded registration source
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile ops/autopilot/register_uv_p1_runtime.py
          [[ "$(git hash-object database/migrations/0309_autopilot_uv_p1_bounded_ingress.sql)" == "$EXPECTED_0309_BLOB" ]]
          [[ "$(sha256sum database/migrations/0309_autopilot_uv_p1_bounded_ingress.sql | awk '{print $1}')" == "$EXPECTED_0309_SHA256" ]]
          [[ "$(git hash-object database/migrations/0313_autopilot_uv_p1_allowlist_upgrade.sql)" == "$EXPECTED_0313_BLOB" ]]
          [[ "$(sha256sum database/migrations/0313_autopilot_uv_p1_allowlist_upgrade.sql | awk '{print $1}')" == "$EXPECTED_0313_SHA256" ]]
          grep -F 'autopilot.register_approved_uv_p1_ci' ops/autopilot/register_uv_p1_runtime.py >/dev/null
          grep -F 'PRODUCTION_DATABASE_CONTACTED=NO' ops/autopilot/register_uv_p1_runtime.py >/dev/null
          ! grep -Eiq 'video[_ -]?execution=true|drive[_ -]?write=true|systemctl +(stop|restart)|shutdown|reboot' \
            ops/autopilot/register_uv_p1_runtime.py
          echo 'AUTOPILOT_UV_P1_SOURCE_CONTRACT=PASS'

      - name: Resolve live PR heads immediately before registration
        id: refs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: olegmed1-art/bridge-video-free
        shell: bash
        run: |
          set -Eeuo pipefail
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json')
          api="https://api.github.com/repos/$REPOSITORY"
          for spec in runtime:997 canary:1062 idle:1047; do
            lane="${spec%%:*}"
            pr="${spec##*:}"
            payload="$(curl -fsS --retry 2 --retry-all-errors --max-time 20 "${auth[@]}" "$api/pulls/$pr")"
            jq -e '.state == "open" and .draft == true' <<<"$payload" >/dev/null
            head="$(jq -er '.head.sha' <<<"$payload")"
            [[ "$head" =~ ^[0-9a-f]{40}$ ]]
            echo "${lane}_head=$head" >> "$GITHUB_OUTPUT"
          done
          echo 'AUTOPILOT_UV_P1_LIVE_HEADS_RESOLVED=PASS'

      - name: Install PostgreSQL client for the bounded forward migration
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client >/dev/null

      - name: Resolve only the exact temporary-branch migration-owner URI
        id: neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "${NEON_API_KEY:-}" ]]
          [[ "$TEMP_BRANCH_ID" != "$PRODUCTION_BRANCH_ID" ]]
          [[ "$TEMP_BRANCH_ID" != "$LEGACY_PRODUCTION_BRANCH_ID" ]]
          api="https://console.neon.tech/api/v2/projects/$PROJECT_ID"
          auth=(-H "Authorization: Bearer $NEON_API_KEY" -H 'Accept: application/json')
          branch_json="$(curl -fsS --retry 2 --retry-all-errors --max-time 20 "${auth[@]}" "$api/branches/$TEMP_BRANCH_ID")"
          endpoint_json="$(curl -fsS --retry 2 --retry-all-errors --max-time 20 "${auth[@]}" "$api/branches/$TEMP_BRANCH_ID/endpoints")"
          role_json="$(curl -fsS --retry 2 --retry-all-errors --max-time 20 "${auth[@]}" "$api/branches/$TEMP_BRANCH_ID/roles/$MIGRATION_ROLE")"
          uri_json="$(curl -fsS --retry 2 --retry-all-errors --max-time 20 "${auth[@]}" \
            "$api/connection_uri?branch_id=$TEMP_BRANCH_ID&database_name=neondb&role_name=$MIGRATION_ROLE&pooled=false")"
          BRANCH_JSON="$branch_json" ENDPOINT_JSON="$endpoint_json" ROLE_JSON="$role_json" URI_JSON="$uri_json" \
            python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import sys
          import urllib.parse

          project = os.environ['PROJECT_ID']
          branch_id = os.environ['TEMP_BRANCH_ID']
          endpoint_id = os.environ['TEMP_ENDPOINT_ID']
          role = os.environ['MIGRATION_ROLE']
          branch_payload = json.loads(os.environ['BRANCH_JSON'])
          endpoint_payload = json.loads(os.environ['ENDPOINT_JSON'])
          role_payload = json.loads(os.environ['ROLE_JSON'])
          uri_payload = json.loads(os.environ['URI_JSON'])
          branch = branch_payload.get('branch', branch_payload)
          assert branch.get('id') == branch_id
          endpoints = endpoint_payload.get('endpoints', [])
          assert any(
              item.get('id') == endpoint_id and item.get('branch_id') == branch_id
              for item in endpoints
          )
          role_object = role_payload.get('role', role_payload)
          assert role_object.get('name') == role
          uri = uri_payload.get('uri')
          assert isinstance(uri, str) and uri
          parsed = urllib.parse.urlsplit(uri)
          assert parsed.username == role
          assert (parsed.path.lstrip('/') or 'neondb') == 'neondb'
          host = (parsed.hostname or '').lower()
          assert host.startswith(endpoint_id + '.') and host.endswith('.neon.tech')
          print(f'::add-mask::{uri}', file=sys.stderr)
          print(f'database_url={uri}')
          print(f'project_id={project}')
          print(f'branch_id={branch_id}')
          print(f'endpoint_id={endpoint_id}')
          print('NEON_PRODUCTION_BRANCH_TARGETED=NO')
          PY

      - name: Apply and verify only forward migration 0313
        id: migration
        env:
          DATABASE_URL: ${{ steps.neon.outputs.database_url }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_RUNTIME_HEAD: ${{ steps.refs.outputs.runtime_head }}
          EXPECTED_CANARY_HEAD: ${{ steps.refs.outputs.canary_head }}
          EXPECTED_IDLE_HEAD: ${{ steps.refs.outputs.idle_head }}
        shell: bash
        run: |
          set -Eeuo pipefail
          revalidate_pr_heads(){
            local spec lane pr expected payload live
            local auth=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json')
            local api="https://api.github.com/repos/olegmed1-art/bridge-video-free"
            for spec in \
              "runtime:997:$EXPECTED_RUNTIME_HEAD" \
              "canary:1062:$EXPECTED_CANARY_HEAD" \
              "idle:1047:$EXPECTED_IDLE_HEAD"; do
              IFS=: read -r lane pr expected <<<"$spec"
              [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
              payload="$(curl -fsS --retry 2 --retry-all-errors --max-time 20 "${auth[@]}" "$api/pulls/$pr")"
              jq -e '.state == "open" and .draft == true' <<<"$payload" >/dev/null
              live="$(jq -er '.head.sha' <<<"$payload")"
              [[ "$live" == "$expected" ]] \
                || { echo "AUTOPILOT_UV_P1_PRE_MIGRATION_HEAD_DRIFT lane=$lane pr=$pr" >&2; return 1; }
            done
            echo 'AUTOPILOT_UV_P1_PRE_MIGRATION_HEADS_VERIFIED=PASS'
          }
          [[ "$(git hash-object database/migrations/0309_autopilot_uv_p1_bounded_ingress.sql)" == "$EXPECTED_0309_BLOB" ]]
          [[ "$(sha256sum database/migrations/0309_autopilot_uv_p1_bounded_ingress.sql | awk '{print $1}')" == "$EXPECTED_0309_SHA256" ]]
          [[ "$(git hash-object database/migrations/0313_autopilot_uv_p1_allowlist_upgrade.sql)" == "$EXPECTED_0313_BLOB" ]]
          [[ "$(sha256sum database/migrations/0313_autopilot_uv_p1_allowlist_upgrade.sql | awk '{print $1}')" == "$EXPECTED_0313_SHA256" ]]
          pre="$(psql "$DATABASE_URL" -X -A -t -F '|' -v ON_ERROR_STOP=1 <<'SQL'
          SELECT current_database(), current_user,
                 current_setting('neon.project_id', true),
                 current_setting('neon.branch_id', true),
                 EXISTS (
                     SELECT 1 FROM public.schema_migration
                      WHERE migration_key='0309_autopilot_uv_p1_bounded_ingress'
                 ),
                 COALESCE((
                     SELECT checksum FROM public.schema_migration
                      WHERE migration_key='0309_autopilot_uv_p1_bounded_ingress'
                 ), ''),
                 EXISTS (
                     SELECT 1 FROM public.schema_migration
                      WHERE migration_key='0313_autopilot_uv_p1_allowlist_upgrade'
                 ),
                 (SELECT rolcreaterole FROM pg_roles WHERE rolname=current_user),
                 has_database_privilege(current_user,current_database(),'CREATE');
          SQL
          )"
          IFS='|' read -r database_name database_user project_id branch_id migration_0309 checksum_0309 migration_0313 can_create_role can_create_objects <<<"$pre"
          [[ "$database_name" == neondb && "$database_user" == "$MIGRATION_ROLE" ]]
          [[ "$project_id" == "$PROJECT_ID" && "$branch_id" == "$TEMP_BRANCH_ID" ]]
          [[ "$branch_id" != "$PRODUCTION_BRANCH_ID" && "$branch_id" != "$LEGACY_PRODUCTION_BRANCH_ID" ]]
          [[ "$migration_0309" == t && "$checksum_0309" == "$EXPECTED_0309_SHA256" ]]
          [[ "$can_create_role" == f && "$can_create_objects" == t ]]
          applied=NO
          # This is the final primary-source comparison before either forward
          # migration or checksum-ledger mutation reaches temporary Neon.
          revalidate_pr_heads
          if [[ "$migration_0313" == f ]]; then
            psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
              -f database/migrations/0313_autopilot_uv_p1_allowlist_upgrade.sql >/dev/null
            applied=YES
          fi
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -v migration_checksum="$EXPECTED_0313_SHA256" <<'SQL' >/dev/null
          UPDATE public.schema_migration
             SET checksum = :'migration_checksum'
           WHERE migration_key = '0313_autopilot_uv_p1_allowlist_upgrade'
             AND checksum IS NULL;
          SQL
          post="$(psql "$DATABASE_URL" -X -A -t -F '|' -v ON_ERROR_STOP=1 <<'SQL'
          WITH definition AS (
              SELECT pg_get_functiondef(
                  'autopilot.register_approved_uv_p1_ci(text)'::regprocedure
              ) AS body
          )
          SELECT EXISTS (
                     SELECT 1 FROM public.schema_migration
                      WHERE migration_key='0313_autopilot_uv_p1_allowlist_upgrade'
                 ),
                 (SELECT checksum FROM public.schema_migration
                   WHERE migration_key='0313_autopilot_uv_p1_allowlist_upgrade'),
                 position('uv-p1-runtime-pr997-17b74b86b309-20260902' in body) > 0,
                 position('uv-p1-canary-pr1062-164d0d509fa3-20260902' in body) > 0,
                 position('uv-p1-idle-pr1047-e8e71b569f81-20260902' in body) > 0,
                 position('uv-p1-runtime-pr997-545ef013-20260901' in body) = 0,
                 position('uv-p1-intake-pr1000-5af0675a-20260901' in body) = 0,
                 position('uv-p1-idle-pr1047-621ab073-20260901' in body) = 0,
                 has_function_privilege(
                     'autopilot_runtime',
                     'autopilot.register_approved_uv_p1_ci(text)',
                     'EXECUTE'
                 ),
                 has_table_privilege('autopilot_runtime','autopilot.task_status','SELECT'),
                 has_table_privilege('autopilot_runtime','autopilot.task','SELECT')
            FROM definition;
          SQL
          )"
          [[ "$post" == "t|$EXPECTED_0313_SHA256|t|t|t|t|t|t|t|t|f" ]]
          echo "applied=$applied" >> "$GITHUB_OUTPUT"
          echo 'AUTOPILOT_TEMP_NEON_MIGRATION_0313=PASS'
          echo 'AUTOPILOT_RUNTIME_DIRECT_TABLE_ACCESS=NO'
          echo 'PRODUCTION_MUTATION=NO'

      - name: Register and observe through runtime-only ingress
        id: register
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$TEMP_BRANCH_ID" != "$PRODUCTION_BRANCH_ID" ]]
          key="$RUNNER_TEMP/id_oracle"
          known="$RUNNER_TEMP/known_hosts"
          log="$RUNNER_TEMP/uv-p1-registration.log"
          printf '%s\n' "$SSH_KEY_ORACLE" | tr -d '\r' > "$key"
          chmod 0600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          ops/oracle_known_hosts_from_scan.sh "$ORACLE_HOST" "$EXPECTED_FINGERPRINT" "$known"
          set +e
          ssh -i "$key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known" \
            -o ConnectTimeout=15 \
            "$ORACLE_USER@$ORACLE_HOST" \
            "sudo -n env PROJECT_ID='$PROJECT_ID' TEMP_BRANCH_ID='$TEMP_BRANCH_ID' PRODUCTION_BRANCH_ID='$PRODUCTION_BRANCH_ID' TEMP_ENDPOINT_ID='$TEMP_ENDPOINT_ID' MIGRATION_APPLIED_BY_THIS_RUN='${{ steps.migration.outputs.applied }}' LIVE_RUNTIME_HEAD_SHA='${{ steps.refs.outputs.runtime_head }}' LIVE_CANARY_HEAD_SHA='${{ steps.refs.outputs.canary_head }}' LIVE_IDLE_HEAD_SHA='${{ steps.refs.outputs.idle_head }}' /opt/bridge-school/school-autopilot/.venv/bin/python -" \
            < ops/autopilot/register_uv_p1_runtime.py | tee "$log"
          rc=${PIPESTATUS[0]}
          set -e
          receipt="$(sed -n 's/^UV_P1_REGISTRATION_RECEIPT=//p' "$log" | tail -n1)"
          if [[ -n "$receipt" ]]; then
            printf '%s\n' "$receipt" | jq -e \
              '.result == "PASS" and .task_count == 3 and
               .real_video_execution == false and .drive_write == false and
               .oracle_lifecycle_action == false and
               .production_database_contacted == false and
               .production_mutation == false and
               (.migration_applied_by_this_run | type) == "boolean"' \
              > uv-p1-registration-receipt.json
          else
            jq -n \
              --arg result 'FAIL' \
              --argjson exit_code "$rc" \
              --arg head_sha "$GITHUB_SHA" \
              '{gate:"AUTOPILOT_UV_P1_DURABLE_REGISTRATION",result:$result,exit_code:$exit_code,workflow_head_sha:$head_sha,real_video_execution:false,drive_write:false,oracle_lifecycle_action:false,production_mutation:false}' \
              > uv-p1-registration-receipt.json
          fi
          exit "$rc"

      - name: Upload retained bounded receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: autopilot-uv-p1-registration-${{ github.run_id }}-${{ github.run_attempt }}
          path: uv-p1-registration-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish bounded summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Universal Video P1 Autopilot registration v3'
            echo '- target: temporary Neon endpoint `ep-floral-field-b1pjs2of` only'
            echo '- bounded ingress: `autopilot.register_approved_uv_p1_ci(text)`'
            echo '- migration: restored immutable `0309`; applied/verified forward-only `0313`'
            echo '- migration applied by this run: `${{ steps.migration.outputs.applied }}`'
            echo '- observation: least-privilege `autopilot.task_status` view'
            echo '- direct Autopilot table reads: `NO`'
            echo '- production database contacted: `NO`'
            echo '- real media execution: `NO`'
            echo '- Drive write: `NO`'
            echo '- Oracle lifecycle action: `NO`'
          } >> "$GITHUB_STEP_SUMMARY"
