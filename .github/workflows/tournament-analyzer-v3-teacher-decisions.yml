name: Tournament Analyzer v3 Teacher Decisions

on:
  pull_request:
    paths:
      - "bridge_school_api/tournament_teacher_decisions_v3.py"
      - "tools/tournament_teacher_decisions_v3.py"
      - "tests/test_tournament_teacher_decisions_v3.py"
      - ".github/workflows/tournament-analyzer-v3-teacher-decisions.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  decision-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile modules
        run: |
          python -m py_compile bridge_school_api/tournament_teacher_decisions_v3.py
          python -m py_compile tools/tournament_teacher_decisions_v3.py
      - name: Run focused contracts
        run: |
          python -m pytest -q \
            tests/test_tournament_teacher_review_queue_v3.py \
            tests/test_tournament_teacher_decisions_v3.py
      - name: Restore exact real teacher-review queue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/review
          curl -fsSL --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9555624857/zip" \
            -o /tmp/review.zip
          unzip -q /tmp/review.zip -d evidence/review
          QUEUE="$(find evidence/review -type f -name 'tournament-teacher-review-queue.json' -print -quit)"
          test -n "$QUEUE"
          echo "QUEUE=$QUEUE" >> "$GITHUB_ENV"
      - name: Build pending decision ledger
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python tools/tournament_teacher_decisions_v3.py \
            --queue "$QUEUE" \
            --out tournament-teacher-decision-ledger.json
      - name: Real evidence gate
        run: |
          python - <<'PY'
          import json
          p=json.load(open('tournament-teacher-decision-ledger.json', encoding='utf-8'))
          assert p['schema']=='tournament-teacher-decision-ledger-v1'
          assert p['automatic_decisions_allowed'] is False
          assert p['automatic_methodology_mapping_allowed'] is False
          assert p['automatic_student_error_attribution_allowed'] is False
          assert len(p['decisions'])==17
          assert all(x['status']=='PENDING' for x in p['decisions'])
          assert all(x['teacher_decision_required'] is True for x in p['decisions'])
          assert all(x['automatic_methodology_mapping_allowed'] is False for x in p['decisions'])
          assert all(x['automatic_student_error_attribution_allowed'] is False for x in p['decisions'])
          assert len({x['review_id'] for x in p['decisions']})==17
          print('TOURNAMENT_TEACHER_DECISION_BOUNDARY_PASS')
          print('queue_sha256', p['queue_sha256'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tournament-analyzer-v3-teacher-decision-ledger
          path: tournament-teacher-decision-ledger.json
          if-no-files-found: error
          retention-days: 30
