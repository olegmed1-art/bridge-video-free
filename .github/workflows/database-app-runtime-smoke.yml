name: Bridge School Neon App Runtime Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'database/app_smoke_requests/**'
      - 'database/runtime_app_preflight.py'
      - '.github/workflows/database-app-runtime-smoke.yml'

permissions:
  contents: read

jobs:
  app-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install PostgreSQL client library
        run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.3.4'

      - name: Verify dedicated app credential exists
        shell: bash
        env:
          BRIDGE_APP_DATABASE_URL: ${{ secrets.BRIDGE_APP_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "${BRIDGE_APP_DATABASE_URL:-}" || { echo 'BRIDGE_APP_DATABASE_URL is not configured'; exit 1; }

      - name: Verify least-privilege interactive app access
        env:
          BRIDGE_APP_DATABASE_URL: ${{ secrets.BRIDGE_APP_DATABASE_URL }}
        run: python database/runtime_app_preflight.py
