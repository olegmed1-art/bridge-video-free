name: Autopilot Codex event callback

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: autopilot-codex-event-callback-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  acknowledge:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.repository.id == 1330085090 &&
      github.event.comment.user.id == 315099490 &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.performed_via_github_app.id == 1144995 &&
      startsWith(github.event.comment.body, '@codex') &&
      contains(github.event.comment.body, 'SLAVIK_CODEX_DISPATCH_V1')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout immutable default-branch receiver
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install pinned callback dependency
        run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.3.4'

      - name: Require Codex bot acknowledgement and ingest delivery
        env:
          AUTOPILOT_CALLBACK_DATABASE_URL: ${{ secrets.AUTOPILOT_CALLBACK_DATABASE_URL }}
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "${AUTOPILOT_CALLBACK_DATABASE_URL:-}"
          test -n "${GITHUB_TOKEN:-}"
          python -m ops.github_autopilot_db_route codex-ack

  terminal:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.repository.id == 1330085090 &&
      github.event.comment.user.id == 199175422 &&
      github.event.comment.author_association == 'NONE' &&
      github.event.comment.performed_via_github_app.id == 1144995 &&
      !contains(github.event.comment.body, 'AUTOPILOT_CODEX_PUBLICATION_V1') &&
      (
        contains(github.event.comment.body, 'AUTOPILOT_CODEX_RESULT_V1') ||
        github.event.comment.body == 'Codex couldn''t complete this request. Try again later.'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout immutable default-branch receiver
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install pinned callback dependency
        run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.3.4'

      - name: Validate pinned Codex App result and ingest terminal receipt
        env:
          AUTOPILOT_CALLBACK_DATABASE_URL: ${{ secrets.AUTOPILOT_CALLBACK_DATABASE_URL }}
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "${AUTOPILOT_CALLBACK_DATABASE_URL:-}"
          test -n "${GITHUB_TOKEN:-}"
          python -m ops.github_autopilot_db_route codex-terminal

  publish:
    # Disabled-by-default receiver. Activation requires 0338/0339/0340, exact-head CI,
    # independent security review, and a separate owner gate. Other callback jobs stay read-only.
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.AUTOPILOT_BOUNDED_PUBLICATION_ENABLED == 'true' &&
      github.event.repository.id == 1330085090 &&
      github.event.comment.user.id == 199175422 &&
      github.event.comment.author_association == 'NONE' &&
      github.event.comment.performed_via_github_app.id == 1144995 &&
      contains(github.event.comment.body, 'AUTOPILOT_CODEX_PUBLICATION_V1')
    permissions:
      contents: write
      issues: read
      pull-requests: read
    concurrency:
      group: autopilot-codex-publication-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout immutable default-branch receiver
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned callback dependency
        run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.3.4'
      - name: Authorize, publish with exact-head CAS, and verify readback
        env:
          AUTOPILOT_CALLBACK_DATABASE_URL: ${{ secrets.AUTOPILOT_CALLBACK_DATABASE_URL }}
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "${AUTOPILOT_CALLBACK_DATABASE_URL:-}"
          test -n "${GITHUB_TOKEN:-}"
          python -m ops.github_autopilot_db_route codex-publication
