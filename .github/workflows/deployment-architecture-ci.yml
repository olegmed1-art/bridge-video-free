name: Deployment architecture contract

on:
  pull_request:
    paths:
      - 'app.py'
      - 'bridge_school_api/**'
      - 'bridge_contracts/**'
      - 'assistant_lab/bootstrap_contract.py'
      - 'assistant_lab/contract.py'
      - 'assistant_lab/dispatch.py'
      - '.vercelignore'
      - 'vercel.json'
      - 'scripts/vercel_ignore_build.sh'
      - 'docs/architecture/**'
      - '.github/workflows/deployment-architecture-ci.yml'
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'bridge_school_api/**'
      - 'bridge_contracts/**'
      - 'assistant_lab/bootstrap_contract.py'
      - 'assistant_lab/contract.py'
      - 'assistant_lab/dispatch.py'
      - '.vercelignore'
      - 'vercel.json'
      - 'scripts/vercel_ignore_build.sh'
      - 'docs/architecture/**'
      - '.github/workflows/deployment-architecture-ci.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Validate Vercel boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/vercel_ignore_build.sh
          grep -F 'VERCEL_GIT_COMMIT_REF' scripts/vercel_ignore_build.sh >/dev/null
          grep -F 'assistant_lab/(__init__|contract|dispatch)' scripts/vercel_ignore_build.sh >/dev/null
          VERCEL_GIT_COMMIT_REF=feature/should-never-build \
            bash scripts/vercel_ignore_build.sh > "$RUNNER_TEMP/vercel-non-main.log"
          grep -F 'non-main ref' "$RUNNER_TEMP/vercel-non-main.log" >/dev/null
          VERCEL_GIT_COMMIT_REF='' \
            bash scripts/vercel_ignore_build.sh > "$RUNNER_TEMP/vercel-missing-ref.log"
          grep -F "non-main ref 'unknown'; skip" "$RUNNER_TEMP/vercel-missing-ref.log" >/dev/null
          python -m json.tool vercel.json >/dev/null
          python - <<'PY'
          import json
          x=json.load(open('vercel.json', encoding='utf-8'))
          deployment=(x.get('git') or {}).get('deploymentEnabled') or {}
          assert deployment.get('main') is True, deployment
          assert deployment.get('preview') is False, deployment
          assert deployment.get('*') is False, deployment
          PY
          grep -F 'ignoreCommand' vercel.json >/dev/null
          grep -Fx '!bridge_school_api' .vercelignore >/dev/null
          grep -Fx '!bridge_contracts' .vercelignore >/dev/null
          if grep -Fx '!assistant_lab' .vercelignore >/dev/null; then
            echo 'assistant_lab compute package must not be bundled by Vercel' >&2
            exit 1
          fi
          ! grep -E '^!?assistant_lab(/|$)' .vercelignore
          grep -F 'from bridge_contracts.assistant_lab import' bridge_school_api/main.py >/dev/null
          ! grep -F 'from assistant_lab' bridge_school_api/main.py
          python -m py_compile bridge_contracts/assistant_lab.py bridge_school_api/main.py

      - name: Validate shared bootstrap contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile bridge_contracts/bootstrap.py assistant_lab/bootstrap_contract.py bridge_school_api/assistant_lab_bootstrap.py
          grep -F 'from bridge_contracts.bootstrap import' assistant_lab/bootstrap_contract.py >/dev/null
          grep -F 'from bridge_contracts.bootstrap import' bridge_school_api/assistant_lab_bootstrap.py >/dev/null

      - name: Validate architecture guardrails
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -F 'MUST NOT by itself create a Vercel deployment' docs/architecture/deployment.md >/dev/null
          grep -F 'Do not store raw media bytes in Neon' docs/architecture/video-data-policy.md >/dev/null
          grep -F 'must not become an unnecessary media proxy' docs/architecture/video-data-policy.md >/dev/null
