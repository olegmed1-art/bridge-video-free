name: Diana 23-26 raw receipts export one-shot

on:
  push:
    branches: [codex/diana-autonomous-finalize-20260911]
    paths: ['.github/workflows/diana-23-26-raw-receipts-export-once.yml']

permissions:
  contents: read

jobs:
  export:
    if: github.repository == 'olegmed1-art/bridge-video-free'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ORACLE_HOST: 158.180.47.161
      ORACLE_USER: ubuntu
      EXPECTED_FINGERPRINT: SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk
      SSH_KEY_ORACLE: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
      SSH_KEY_OCI: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
      SSH_KEY_VM: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
      SSH_KEY_BRIDGE: ${{ secrets.BRIDGE_SCHOOL_ORACLE_SSH_PRIVATE_KEY }}
      SSH_KEY_ORACLE_ALT: ${{ secrets.ORACLE_SSH_KEY }}
      SSH_KEY_OCI_ALT: ${{ secrets.OCI_SSH_KEY }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Select verified Oracle credential
        id: ssh
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/diana-raw-receipts"
          mkdir -p "$work"
          known="$work/known_hosts"
          ops/oracle_known_hosts_from_scan.sh "$ORACLE_HOST" "$EXPECTED_FINGERPRINT" "$known"
          selected=''
          for name in SSH_KEY_ORACLE SSH_KEY_OCI SSH_KEY_VM SSH_KEY_BRIDGE SSH_KEY_ORACLE_ALT SSH_KEY_OCI_ALT; do
            if [[ -n "${!name:-}" ]]; then selected="$name"; break; fi
          done
          [[ -n "$selected" ]]
          key="$work/id_oracle"
          printf '%s\n' "${!selected}" | tr -d '\r' > "$key"
          chmod 0600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" \
            -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST" true
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "known=$known" >> "$GITHUB_OUTPUT"

      - name: Retrieve and verify sealed receipts
        shell: bash
        run: |
          set -Eeuo pipefail
          key='${{ steps.ssh.outputs.key }}'
          known='${{ steps.ssh.outputs.known }}'
          remote=/home/ubuntu/bridge-school-private-media/diana-23-26/autonomous-results-da646515
          out="$RUNNER_TEMP/diana-raw-receipts/out"
          mkdir -p "$out"
          names=(diana-23 diana-24 diana-25 diana-26)
          for name in "${names[@]}"; do
            ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" \
              -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST" \
              "test -f '$remote/$name.json' && test ! -L '$remote/$name.json' && test \$(stat -c %s '$remote/$name.json') -le 67108864"
            scp -q -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" \
              -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST:$remote/$name.json" "$out/$name.json"
          done
          OUT="$out" python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["OUT"])
          expected = {
              "diana-23": "diana-23.mp4",
              "diana-24": "diana-24.mp4",
              "diana-25": "diana-25-2021-09-13.mp4",
              "diana-26": "diana-26.mp4",
          }
          for name, source in expected.items():
              path = root / f"{name}.json"
              receipt = json.loads(path.read_text(encoding="utf-8"))
              claimed = receipt["receipt_sha256"]
              material = dict(receipt)
              material.pop("receipt_sha256")
              actual = hashlib.sha256(
                  json.dumps(material, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode()
              ).hexdigest()
              assert actual == claimed
              assert receipt["source"]["filename"] == source
              assert receipt["uses_language_model"] is False
              assert receipt["requires_screenshot_review"] is False
              assert receipt["canonical_promotion_allowed"] is False
              print(f"SEALED_RECEIPT_PASS name={name} sha256={claimed}")
          PY
          echo "artifact_path=$out" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diana-23-26-raw-receipts-da646515
          path: ${{ env.artifact_path }}
          if-no-files-found: error
          retention-days: 7
