name: Restore Light boot volume after guarded stop

on:
  push:
    branches: [ops/rdc-light-enroll-20260910]
    paths: ['.github/workflows/rdc-light-enroll-20260910.yml']

permissions:
  contents: read

concurrency:
  group: oracle-light-rdc-enrollment
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OCI_CLI_CONFIG: ${{ secrets.OCI_CLI_CONFIG }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      LIGHT_INSTANCE_ID: ocid1.instance.oc1.eu-frankfurt-1.antheljtruoejaicnbolm4whz6iex5lduf4gvk42jaj5maselesau66vvxpq
      HEAVY_INSTANCE_ID: ocid1.instance.oc1.eu-frankfurt-1.antheljtruoejaica7hj5oubnh2cctnjr7ti7llcgo6ho6wdvgvui6td7saq
      BOOT_VOLUME_ID: ocid1.bootvolume.oc1.eu-frankfurt-1.abtheljt66fmdcrsvixovpzx4du4ebwje7yg66b6hkyslz5b54p3636rmn3a
      AVAILABILITY_DOMAIN: vbRF:EU-FRANKFURT-1-AD-1
      COMPARTMENT_ID: ocid1.tenancy.oc1..aaaaaaaa52xuylcexzuwuqj4un36qchvmcxqtggmthadvoiho75r6vbkv24q
    steps:
      - name: Configure OCI client
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --quiet 'oci-cli==3.90.3'
          umask 077
          mkdir -p "$HOME/.oci"
          if [[ "$OCI_CLI_KEY_CONTENT" == base64:* ]]; then
            printf '%s' "${OCI_CLI_KEY_CONTENT#base64:}" | base64 --decode > "$HOME/.oci/key.pem"
          else
            printf '%s\n' "$OCI_CLI_KEY_CONTENT" > "$HOME/.oci/key.pem"
          fi
          printf '%s\n' "$OCI_CLI_CONFIG" > "$HOME/.oci/config"
          openssl pkey -in "$HOME/.oci/key.pem" -traditional -out "$HOME/.oci/key-pkcs1.pem"
          mv "$HOME/.oci/key-pkcs1.pem" "$HOME/.oci/key.pem"
          fingerprint="$(openssl pkey -in "$HOME/.oci/key.pem" -pubout -outform DER | openssl md5 -r | awk '{print $1}' | sed 's/../&:/g;s/:$//')"
          export OCI_DERIVED_FINGERPRINT="$fingerprint"
          python - <<'PY'
          import os
          from pathlib import Path
          p=Path.home()/'.oci/config'; lines=[]; key=region=fp=False
          for line in p.read_text().splitlines():
              s=line.strip()
              if s.startswith('key_file='): lines.append('key_file='+str(Path.home()/'.oci'/'key.pem')); key=True
              elif s.startswith('region='): lines.append('region=eu-frankfurt-1'); region=True
              elif s.startswith('fingerprint='): lines.append(f'fingerprint={os.environ["OCI_DERIVED_FINGERPRINT"]}'); fp=True
              else: lines.append(line)
          if not key: lines.append('key_file='+str(Path.home()/'.oci'/'key.pem'))
          if not region: lines.append('region=eu-frankfurt-1')
          if not fp: lines.append(f'fingerprint={os.environ["OCI_DERIVED_FINGERPRINT"]}')
          p.write_text('\n'.join(lines)+'\n')
          PY
          oci iam region list --output json >/dev/null

      - name: Reattach exact boot volume and start exact Light
        shell: bash
        run: |
          set -Eeuo pipefail
          oci compute instance get --instance-id "$LIGHT_INSTANCE_ID" > "$RUNNER_TEMP/light.json"
          oci compute instance get --instance-id "$HEAVY_INSTANCE_ID" > "$RUNNER_TEMP/heavy.json"
          oci bv boot-volume get --boot-volume-id "$BOOT_VOLUME_ID" > "$RUNNER_TEMP/boot.json"
          python - "$RUNNER_TEMP/light.json" "$RUNNER_TEMP/heavy.json" "$RUNNER_TEMP/boot.json" <<'PY'
          import json,sys
          light=json.load(open(sys.argv[1]))['data']; heavy=json.load(open(sys.argv[2]))['data']; boot=json.load(open(sys.argv[3]))['data']
          assert light['display-name']=='bridge-school-autopilot-lite' and light['shape']=='VM.Standard.A1.Flex'
          assert light['lifecycle-state']=='STOPPED', light['lifecycle-state']
          assert heavy['display-name']=='bridge-school-dds3-frankfurt' and heavy['lifecycle-state']=='RUNNING'
          assert light['availability-domain']==heavy['availability-domain']==boot['availability-domain']=='vbRF:EU-FRANKFURT-1-AD-1'
          assert boot['id']=='ocid1.bootvolume.oc1.eu-frankfurt-1.abtheljt66fmdcrsvixovpzx4du4ebwje7yg66b6hkyslz5b54p3636rmn3a'
          assert boot['size-in-gbs']==47 and boot['lifecycle-state']=='AVAILABLE'
          print('RESTORE_GUARDS=PASS')
          PY
          oci compute boot-volume-attachment list --availability-domain "$AVAILABILITY_DOMAIN" --compartment-id "$COMPARTMENT_ID" --all > "$RUNNER_TEMP/all-bva.json"
          python - "$RUNNER_TEMP/all-bva.json" "$BOOT_VOLUME_ID" <<'PY'
          import json,sys
          rows=[x for x in json.load(open(sys.argv[1]))['data'] if x.get('boot-volume-id')==sys.argv[2] and x.get('lifecycle-state') not in {'DETACHED','DETACHING'}]
          assert not rows, rows
          print('BOOT_VOLUME_UNATTACHED=PASS')
          PY
          oci compute boot-volume-attachment attach --instance-id "$LIGHT_INSTANCE_ID" --boot-volume-id "$BOOT_VOLUME_ID" --wait-for-state ATTACHED --max-wait-seconds 600 --wait-interval-seconds 10 > "$RUNNER_TEMP/reattach.json"
          attachment_id="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["data"]["id"])' "$RUNNER_TEMP/reattach.json")"
          test -n "$attachment_id"
          echo 'LIGHT_BOOT_VOLUME_REATTACHED=PASS'
          oci compute instance action --instance-id "$LIGHT_INSTANCE_ID" --action START --wait-for-state RUNNING --max-wait-seconds 600 --wait-interval-seconds 10 >/dev/null
          [[ "$(oci compute instance get --instance-id "$LIGHT_INSTANCE_ID" --query 'data."lifecycle-state"' --raw-output)" == RUNNING ]]
          echo 'LIGHT_RESTORED_RUNNING=PASS'

