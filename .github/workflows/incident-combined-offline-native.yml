name: Incident 1911 combined offline and native preflight
on: create
permissions: {}
jobs:
  preflight:
    if: >-
      github.repository == 'olegmed1-art/bridge-video-free' &&
      github.event.repository.full_name == 'olegmed1-art/bridge-video-free' &&
      github.event_name == 'create' && github.event.ref_type == 'branch' &&
      github.event.ref == 'codex-incident-1911-combined-preflight-20261013' &&
      github.ref_name == 'codex-incident-1911-combined-preflight-20261013' &&
      github.ref == 'refs/heads/codex-incident-1911-combined-preflight-20261013' &&
      github.workflow_sha == github.sha && github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Stage public pinned artifacts
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          timeout --kill-after=2s 35s python3 -I -S -B - <<'PY'
          import hashlib, os, re, sys, urllib.request
          from pathlib import Path
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  raise ValueError("redirect")
          try:
              sha = os.environ.get("GITHUB_SHA", "")
              if not re.fullmatch("[a-f0-9]{40}", sha) or os.environ.get("GITHUB_WORKFLOW_SHA") != sha:
                  raise ValueError("context")
              root = Path.cwd() / ".native-phase-preflight"
              root.mkdir()
              pins = {'bootstrap.py': {'sha256': '2312e14577910ff5f5986ba21e02be1ad0ba70e4440d77b306806f5aa396ebb4', 'bytes': 3948, 'path': 'scripts/diagnostics/native_phase_preflight/bootstrap.py'}, 'package-lock.json': {'sha256': '4f2d3c63a28396f31640b3d53a156c1540fd0e7360fe768297c5f83f4ac56896', 'bytes': 2575, 'path': 'scripts/diagnostics/native_phase_preflight/package-lock.json'}, 'tls_offline/probe.py': {'sha256': 'df1c9efb51063f76abad196e223b15b74b22e4cd23ab2b30fb6e7a460dbdd530', 'bytes': 19559, 'path': 'scripts/diagnostics/tls_offline_preflight/probe.py'}, 'tls_offline/worker.py': {'sha256': '033aa0fcca801be3b2d7fe73020d0fca93573a8de85191baff9daf9f2939f7fa', 'bytes': 955, 'path': 'scripts/diagnostics/tls_offline_preflight/worker.py'}, 'tls_offline/linux_preflight.py': {'sha256': 'c664cf24def47b591cb17d217ccfd7c2dc294badd6d88107cabde026835646a7', 'bytes': 5498, 'path': 'scripts/diagnostics/tls_offline_preflight/linux_preflight.py'}}
              for name, pin in pins.items():
                  url = "https://raw.githubusercontent.com/olegmed1-art/bridge-video-free/" + sha + "/" + pin["path"]
                  with urllib.request.build_opener(NoRedirect()).open(url, timeout=4) as response:
                      if response.status != 200 or response.geturl() != url:
                          raise ValueError("response")
                      data = response.read(pin["bytes"] + 1)
                  if len(data) != pin["bytes"] or hashlib.sha256(data).hexdigest() != pin["sha256"]:
                      raise ValueError("integrity")
                  (root / name).parent.mkdir(parents=True, exist_ok=True)
                  with (root / name).open("xb") as output:
                      output.write(data)
                  (root / name).chmod(0o444)
              os.execv(sys.executable, [sys.executable, "-I", "-S", "-B", str(root / "bootstrap.py")])
          except BaseException:
              print('{"status":"public_loader_failed"}')
              raise SystemExit(1)
          PY
      - name: Four offline process fixtures, once
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          sudo -n /usr/bin/timeout --signal=TERM --kill-after=2s 25s \
            /usr/bin/unshare --net --pid --fork --kill-child=KILL --mount-proc -- \
            /usr/bin/setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups \
            --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs --pdeathsig=KILL \
            /usr/bin/env -i LC_ALL=C.UTF-8 /usr/bin/python3 -I -S -B \
            "$PWD/.native-phase-preflight/tls_offline/linux_preflight.py" "$(readlink /proc/self/ns/net)"
      - name: Fourteen native ABI cases after offline PASS, no connections
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          echo '{"schema":"native-preflight-launch-v2","state":"STARTED"}'
          set +e
          sudo -n /usr/bin/timeout --signal=TERM --kill-after=2s 45s /usr/bin/unshare --net --pid --fork --kill-child=KILL --mount-proc -- \
            /usr/bin/setpriv --reuid="$(id -u)" --regid="$(id -g)" \
            --clear-groups --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs --pdeathsig=KILL \
            /usr/bin/env -i LC_ALL=C.UTF-8 "$(command -v python3)" -I -S -B \
            "$PWD/.native-phase-preflight/runner.py" "$(readlink /proc/self/ns/net)" "$(id -u)" 2>/dev/null
          result=$?
          set -e
          printf '{"schema":"native-preflight-launch-v3","returncode":%d}\n' "$result"
          if [[ -f "$PWD/.native-phase-preflight/runner-entered.flag" ]]; then
            echo '{"schema":"native-preflight-launch-v2","harness_entry":"observed"}'
          else
            echo '{"schema":"native-preflight-launch-v2","harness_entry":"not_observed","status":"ISOLATION_OR_ENTRY_FAILED"}'
          fi
          case "$result" in
            0) echo '{"schema":"native-preflight-launch-v2","exit":"zero"}' ;;
            124|137) echo '{"schema":"native-preflight-launch-v2","exit":"timeout_or_kill"}' ;;
            *) echo '{"schema":"native-preflight-launch-v2","exit":"nonzero"}' ;;
          esac
          exit "$result"
