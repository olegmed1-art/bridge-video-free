name: Tournament Render Artifact Builder v3

on:
  pull_request:
    paths:
      - "bridge_school_api/tournament_render_artifact_builder_v3.py"
      - "bridge_school_api/tournament_render_release_evidence_v3.py"
      - "tests/test_tournament_render_artifact_builder_v3.py"
      - "tests/test_tournament_render_release_evidence_v3.py"
      - ".github/workflows/tournament-render-artifact-builder-v3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest PyMuPDF
      - name: Compile artifact-derived evidence module
        run: python -m py_compile bridge_school_api/tournament_render_artifact_builder_v3.py
      - name: Run artifact-derived and adjacent render evidence tests
        run: >-
          python -m pytest -q
          tests/test_tournament_render_artifact_builder_v3.py
          tests/test_tournament_render_release_evidence_v3.py
