name: Diana 23 PDF evidence frames 6e871d9b one-shot

on:
  push:
    branches: [codex/diana-autonomous-finalize-20260911]
    paths: ['.github/workflows/diana23-6e871d9b-pdf-frames-once.yml']

permissions:
  contents: read

concurrency:
  group: diana23-6e871d9b-pdf-evidence
  cancel-in-progress: false

jobs:
  export:
    if: github.repository == 'olegmed1-art/bridge-video-free'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ORACLE_HOST: 158.180.47.161
      ORACLE_USER: ubuntu
      EXPECTED_FINGERPRINT: SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk
      ALGORITHM_SHA: 6e871d9bd38817a334f685749836ef417c1600c4
      SSH_KEY_ORACLE: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
      SSH_KEY_OCI: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
      SSH_KEY_VM: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
      SSH_KEY_BRIDGE: ${{ secrets.BRIDGE_SCHOOL_ORACLE_SSH_PRIVATE_KEY }}
      SSH_KEY_ORACLE_ALT: ${{ secrets.ORACLE_SSH_KEY }}
      SSH_KEY_OCI_ALT: ${{ secrets.OCI_SSH_KEY }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Select verified Oracle credential
        id: ssh
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/d23-pdf-frames-6e871d9b"
          mkdir -p "$work/bundle"
          known="$work/known_hosts"
          ops/oracle_known_hosts_from_scan.sh "$ORACLE_HOST" "$EXPECTED_FINGERPRINT" "$known"
          selected=''
          for name in SSH_KEY_ORACLE SSH_KEY_OCI SSH_KEY_VM SSH_KEY_BRIDGE SSH_KEY_ORACLE_ALT SSH_KEY_OCI_ALT; do
            if [[ -n "${!name:-}" ]]; then selected="$name"; break; fi
          done
          [[ -n "$selected" ]]
          key="$work/id_oracle"
          printf '%s\n' "${!selected}" | tr -d '\r' > "$key"
          chmod 0600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "known=$known" >> "$GITHUB_OUTPUT"
          echo "work=$work" >> "$GITHUB_OUTPUT"
      - name: Extract deterministic representative frames on Oracle
        shell: bash
        run: |
          set -Eeuo pipefail
          key='${{ steps.ssh.outputs.key }}'
          known='${{ steps.ssh.outputs.known }}'
          work='${{ steps.ssh.outputs.work }}'
          ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" \
            -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST" "ALGORITHM_SHA='$ALGORITHM_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          root=/home/ubuntu/bridge-school-private-media/diana-23-26
          short="${ALGORITHM_SHA:0:8}"
          receipt="$root/autonomous-results-$short-d23-validation/diana-23.json"
          video="$root/diana-23.mp4"
          bundle="$root/pdf-evidence-$short-$$"
          mkdir -p "$bundle/frames"
          trap 'rm -rf "$bundle"' EXIT
          test "$(stat -c %s "$video")" = 652603861
          RECEIPT="$receipt" VIDEO="$video" BUNDLE="$bundle" ALGORITHM_SHA="$ALGORITHM_SHA" python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          receipt_path=Path(os.environ["RECEIPT"])
          video=Path(os.environ["VIDEO"])
          bundle=Path(os.environ["BUNDLE"])
          algorithm_sha=os.environ["ALGORITHM_SHA"]
          receipt=json.loads(receipt_path.read_text())
          claimed=receipt["receipt_sha256"]
          material=dict(receipt); material.pop("receipt_sha256")
          actual=hashlib.sha256(json.dumps(material,ensure_ascii=False,sort_keys=True,separators=(",",":")).encode()).hexdigest()
          assert actual==claimed
          assert receipt["source"]["filename"]=="diana-23.mp4"
          assert receipt["source"]["sha256"]==hashlib.sha256(video.read_bytes()).hexdigest()
          assert receipt["uses_language_model"] is False
          assert receipt["requires_screenshot_review"] is False
          assert receipt["canonical_promotion_allowed"] is False
          deals=receipt["reconstruction"]["deals"]
          rows=[]
          for idx,deal in enumerate(deals,1):
              first=int(deal["first_timestamp_ms"]); last=int(deal["last_timestamp_ms"])
              midpoint=(first+last)//2
              candidates={midpoint}
              for item in deal.get("accepted",[]):
                  a=int(item["first_timestamp_ms"]); b=int(item["last_timestamp_ms"])
                  candidates.update((a,b,(a+b)//2))
              def score(t):
                  active=sum(int(i["first_timestamp_ms"]) <= t <= int(i["last_timestamp_ms"]) for i in deal.get("accepted",[]))
                  return (active,-abs(t-midpoint),-t)
              rep=max((min(last,max(first,t)) for t in candidates),key=score)
              frame=bundle/"frames"/f"deal-{idx:03d}.jpg"
              subprocess.run(["ffmpeg","-hide_banner","-loglevel","error","-ss",f"{rep/1000:.3f}","-i",str(video),"-frames:v","1","-q:v","2","-y",str(frame)],check=True)
              rows.append({"index":idx,"representative_timestamp_ms":rep,"frame_sha256":hashlib.sha256(frame.read_bytes()).hexdigest()})
          manifest={"algorithm_sha":algorithm_sha,"receipt_sha256":claimed,"source_sha256":receipt["source"]["sha256"],"deals":rows}
          (bundle/"manifest.json").write_text(json.dumps(manifest,ensure_ascii=False,sort_keys=True,indent=2)+"\n")
          PY
          printf '%s\n' "$bundle" > "$root/.pdf-evidence-6e871d9b-latest"
          REMOTE
          remote="$(ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" "$ORACLE_USER@$ORACLE_HOST" 'cat /home/ubuntu/bridge-school-private-media/diana-23-26/.pdf-evidence-6e871d9b-latest')"
          scp -q -r -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" \
            "$ORACLE_USER@$ORACLE_HOST:$remote/." "$work/bundle/"
          cp "$RUNNER_TEMP/d23-depleted-hand/out/diana-23.json" "$work/bundle/diana-23.json" 2>/dev/null || true
          ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" \
            "$ORACLE_USER@$ORACLE_HOST" "rm -rf '$remote' /home/ubuntu/bridge-school-private-media/diana-23-26/.pdf-evidence-6e871d9b-latest"
      - name: Download validated receipt from Oracle
        shell: bash
        run: |
          set -Eeuo pipefail
          key='${{ steps.ssh.outputs.key }}'
          known='${{ steps.ssh.outputs.known }}'
          work='${{ steps.ssh.outputs.work }}'
          remote="/home/ubuntu/bridge-school-private-media/diana-23-26/autonomous-results-6e871d9b-d23-validation/diana-23.json"
          scp -q -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" \
            "$ORACLE_USER@$ORACLE_HOST:$remote" "$work/bundle/diana-23.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diana23-pdf-evidence-6e871d9b
          path: ${{ steps.ssh.outputs.work }}/bundle
          retention-days: 2
          if-no-files-found: error
