name: Connector recovery disposable PostgreSQL 18
on:
  push:
    branches: [codex/sync-subset-recovery-pg18-default-acl-20261014]
  pull_request:
    paths:
      - '.github/workflows/connector-recovery-postgres.yml'
      - '.gitattributes'
      - 'database/**'
      - 'tests/test_universal_video_connector_recovery.py'
permissions:
  contents: read
concurrency:
  group: connector-recovery-pg18-disposable
  cancel-in-progress: false
jobs:
  connector-recovery:
    if: >-
      github.repository == 'olegmed1-art/bridge-video-free' &&
      github.event.repository.private == false &&
      github.actor == github.repository_owner &&
      github.run_attempt == 1 &&
      ((github.event_name == 'push' &&
        github.ref == 'refs/heads/codex/sync-subset-recovery-pg18-default-acl-20261014' &&
        github.event.created == true && github.event.deleted == false &&
        github.event.forced == false) ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.number == 2168 &&
        github.event.pull_request.head.repo.full_name == 'olegmed1-art/bridge-video-free' &&
        github.event.pull_request.head.ref == 'codex/sync-subset-recovery-pg18-default-acl-20261014'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
        env:
          POSTGRES_DB: neondb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_INITDB_ARGS: >-
            -c max_connections=8 -c superuser_reserved_connections=0
            -c reserved_connections=0 -c max_wal_senders=0
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --cpus 2 --memory 1536m
          --health-cmd "test -f /tmp/connector-recovery-ready || (pg_isready -h 127.0.0.1 -U postgres -d neondb && touch /tmp/connector-recovery-ready)"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Require one initial push
        if: github.event_name == 'push'
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          test "$EVENT_BEFORE" = 0000000000000000000000000000000000000000
          test "$EVENT_AFTER" = "$GITHUB_SHA"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Verify source and create evidence directory
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          if [[ "$EVENT_NAME" == pull_request ]]; then
            test "$(git cat-file -p HEAD | sed -n 's/^parent //p')" = 78a455266452dc2018e1d6b1193fca9bdd9b87e4
          else
            test "$(git cat-file -p HEAD | sed -n 's/^parent //p')" = fb0d2bb3402dd55140749447b37ebbb8ca8a2343
          fi
          mkdir -p "$RUNNER_TEMP/connector-recovery-evidence" "$RUNNER_TEMP/connector-recovery-home"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/connector-recovery-evidence/source.txt"
          git diff --name-only HEAD^ HEAD > "$RUNNER_TEMP/connector-recovery-evidence/changed-files.txt"
          git diff --diff-filter=ACMR --name-only HEAD^ HEAD -z | xargs -0 sha256sum > "$RUNNER_TEMP/connector-recovery-evidence/source-sha256.txt"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install public test dependencies
        timeout-minutes: 3
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client >/dev/null
          fi
          python -m pip install 'pytest==8.4.2' 'psycopg[binary]==3.3.4'
          python --version > "$RUNNER_TEMP/connector-recovery-evidence/python.txt"
          psql --version > "$RUNNER_TEMP/connector-recovery-evidence/psql.txt"
          python -m pip freeze > "$RUNNER_TEMP/connector-recovery-evidence/packages.txt"
      - name: Offline envelope unit checks
        run: |
          set -euo pipefail
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/connector-recovery-home" \
            PYTHONPATH="$GITHUB_WORKSPACE" PYTHONDONTWRITEBYTECODE=1 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            python -m pytest -q -p no:cacheprovider tests/test_universal_video_connector_recovery.py \
            --basetemp="$RUNNER_TEMP/connector-recovery-pytest" \
            --junitxml="$RUNNER_TEMP/connector-recovery-evidence/unit.xml"
      - name: One scoped synthetic installer verifier recovery rehearsal
        run: |
          set -euo pipefail
          timeout --signal=INT --kill-after=20s 840s \
            env -i PATH="$PATH" HOME="$RUNNER_TEMP/connector-recovery-home" \
            PYTHONPATH="$GITHUB_WORKSPACE" PYTHONDONTWRITEBYTECODE=1 \
            python database/tests/fixed_subset_admission/connector_recovery_fixture.py \
            --execute --evidence "$RUNNER_TEMP/connector-recovery-evidence/runner"
      - name: Capture final database census
        if: always()
        timeout-minutes: 1
        run: |
          mkdir -p "$RUNNER_TEMP/connector-recovery-evidence"
          env -i PATH="$PATH" PGCONNECT_TIMEOUT=5 PGOPTIONS='-c statement_timeout=5000' \
            timeout 15s psql 'postgresql://postgres:postgres@127.0.0.1:5432/neondb' \
            -X -A -t -v ON_ERROR_STOP=1 -c \
            "SELECT jsonb_build_object('version',current_setting('server_version_num'),'other_clients',(SELECT count(*) FROM pg_stat_activity WHERE backend_type='client backend' AND pid<>pg_backend_pid()),'advisory_locks',(SELECT count(*) FROM pg_locks WHERE locktype='advisory'),'prepared',(SELECT count(*) FROM pg_prepared_xacts));" \
            > "$RUNNER_TEMP/connector-recovery-evidence/final-census.json" \
            2> "$RUNNER_TEMP/connector-recovery-evidence/final-census.stderr"
      - name: Destroy only this disposable service and its storage
        if: always()
        timeout-minutes: 2
        env:
          PG_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          python - <<'PY'
          import json, os, pathlib, re, subprocess
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "connector-recovery-evidence"
          out.mkdir(exist_ok=True)
          result = {"status": "FAIL_OR_UNKNOWN", "commands": []}
          def call(*args):
              r = subprocess.run(["docker", *args], capture_output=True, text=True, timeout=25)
              result["commands"].append({"args": args, "code": r.returncode, "stdout": r.stdout, "stderr": r.stderr})
              return r
          try:
              cid = os.environ["PG_SERVICE_ID"]
              assert re.fullmatch(r"[0-9a-f]{64}", cid)
              inspect = call("inspect", cid)
              assert inspect.returncode == 0
              data = json.loads(inspect.stdout)[0]
              assert data["Config"]["Image"] == "postgres:18-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c"
              networks = list(data["NetworkSettings"]["Networks"])
              assert len(networks) == 1 and networks[0].startswith("github_network_")
              volumes = [m["Name"] for m in data["Mounts"] if m["Type"] == "volume"]
              result.update(container_id=cid, networks=networks, volumes=volumes, image_id=data["Image"])
              assert call("rm", "--force", "--volumes", cid).returncode == 0
              assert call("inspect", cid).returncode != 0
              for volume in volumes:
                  assert call("volume", "inspect", volume).returncode != 0
              assert call("network", "rm", networks[0]).returncode == 0
              assert call("network", "inspect", networks[0]).returncode != 0
              result["status"] = "PASS"
          finally:
              (out / "service-cleanup.json").write_text(json.dumps(result, indent=2)+"\n")
          PY
      - name: Accept only complete scoped evidence
        if: always()
        run: |
          python - <<'PY'
          import json, os, pathlib, xml.etree.ElementTree as ET
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "connector-recovery-evidence"
          r = json.loads((out / "runner/results.json").read_text())
          assert r["status"] == "PASS_ISOLATED_CONNECTOR_RECOVERY"
          assert len(r["negative_cases"]) == 17
          assert r["rollback_acl_matrix"] == "PASS_12_FUNCTIONS_FOUR_ROLES_TRANSACTION_RESTORED"
          assert all(x["status"] == "PASS" and x["exact_snapshot_equal"] for x in r["negative_cases"])
          assert r["legacy_acl_owner_definition_equal"] and r["duplicate_reservations_preserved"]
          assert r["retained_0059"] and r["retained_tables"] == 4 and r["retained_nologin_roles"] == 5
          assert r["migrator"] == "FOUR_SKIPS_EXTERNAL_CANDIDATE_AND_REPAIR_RECOGNIZED"
          census = json.loads((out / "final-census.json").read_text())
          assert 180000 <= int(census["version"]) < 190000
          assert all(census[k] == 0 for k in ("other_clients", "advisory_locks", "prepared"))
          assert json.loads((out / "service-cleanup.json").read_text())["status"] == "PASS"
          suites = list(ET.parse(out / "unit.xml").getroot().iter("testsuite"))
          assert sum(int(s.attrib["tests"]) for s in suites) == 26
          assert all(int(s.attrib[k]) == 0 for s in suites for k in ("errors", "failures", "skipped"))
          (out / "acceptance.json").write_text(json.dumps({"status":"PASS_ISOLATED_CONNECTOR_RECOVERY",
              "negative_pass":17,"cleanup":"PASS","unit_pass":26,"production_execution_allowed":False})+"\n")
          PY
      - name: Preserve bounded evidence in logs without paid artifact storage
        if: always()
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "connector-recovery-evidence"
          files = {}
          for p in sorted(out.rglob("*")):
              if p.is_file():
                  data = p.read_bytes()
                  assert len(data) <= 16*1024*1024
                  files[str(p.relative_to(out))] = {"sha256":hashlib.sha256(data).hexdigest(),
                      "base64":base64.b64encode(data).decode()}
          raw = json.dumps(files, sort_keys=True).encode()
          packed = gzip.compress(raw, mtime=0)
          assert len(packed) <= 2*1024*1024
          encoded = base64.b64encode(packed).decode()
          print("RECOVERY_EVIDENCE_BEGIN", hashlib.sha256(packed).hexdigest(), len(packed))
          for i in range(0,len(encoded),3000):
              print("RECOVERY_EVIDENCE_CHUNK",i//3000,encoded[i:i+3000])
          print("RECOVERY_EVIDENCE_END")
          PY
