name: Native host contracts and transition rehearsal

on:
  pull_request:
    paths:
      - '.github/workflows/native-host-preflight.yml'
      - 'ops/light_native_continuity.py'
      - 'ops/light_native_legacy_capture.py'
      - 'ops/light_native_legacy_transition.py'
      - 'ops/light_native_current_*.py'
      - 'ops/light_native_reconciliation.py'
      - 'ops/light_native_retirement.py'
      - 'ops/light_native_lane_run_guard.py'
      - 'ops/light_native_lane_controller.py'
      - 'ops/light_native_lane_execution.py'
      - 'ops/light_native_lane_install.py'
      - 'ops/light_native_lane_issuer.py'
      - 'ops/light_native_lane_cycle.py'
      - 'ops/light_native_retirement_live.py'
      - 'ops/light_native_pilot_release.py'
      - 'ops/native_maintenance_bundle.py'
      - 'ops/native_maintenance_agreement.py'
      - 'ops/native_maintenance_workflow_pause.py'
      - 'ops/native_permission_hold_guard.py'
      - 'ops/oracle_light_active_hold_attest.py'
      - 'ops/oracle_light_runtime_hold_install.py'
      - 'oracle_autopilot/light_native_adapter.py'
      - 'database/native_cli_permission_engine.py'
      - 'database/light_native_pilot_intake.py'
      - '.github/workflows/light-native-retirement-observe.yml'
      - 'ops/light_native_service_authority.py'
      - 'ops/light_native_service_supervisor.py'
      - 'ops/light_native_service_unit.py'
      - 'ops/light_native_service_plan.py'
      - 'ops/light_native_service_switch.py'
      - 'ops/light_native_readiness.py'
      - 'ops/light_native_readiness_observe.sql'
      - 'tests/test_light_native_continuity.py'
      - 'tests/test_light_native_legacy_capture.py'
      - 'tests/test_light_native_legacy_transition.py'
      - 'tests/fixtures/light_native_legacy_transition_systemd.py'
      - 'tests/test_light_native_current_*.py'
      - 'tests/test_light_native_reconciliation*.py'
      - 'tests/test_light_native_service_authority.py'
      - 'tests/test_light_native_service_supervisor.py'
      - 'tests/test_light_native_service_unit.py'
      - 'tests/test_light_native_readiness.py'
      - 'tests/test_light_native_plan_codec.py'
      - 'tests/test_light_native_execution_session.py'
      - 'tests/test_native_host_preflight_scope.py'
      - 'tests/fixtures/light_native_host_boundary_systemd.py'
      - 'tests/fixtures/light_native_execution_session_systemd.py'

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    outputs:
      legacy: ${{ steps.select.outputs.legacy }}
      transition: ${{ steps.select.outputs.transition }}
      host: ${{ steps.select.outputs.host }}
      codec: ${{ steps.select.outputs.codec }}
      session: ${{ steps.select.outputs.session }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: select
        name: Select only affected proof boundaries
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          /usr/bin/python3 -I -S -B - <<'PY'
          import fnmatch, json, os, re, subprocess
          base, head = os.environ['BASE'], os.environ['HEAD']
          assert all(re.fullmatch('[0-9a-f]{40}', value) for value in (base, head))
          raw = subprocess.check_output(['git', 'diff', '--no-renames', '--name-only', '-z', base, head, '--'], timeout=10)
          assert len(raw) <= 1048576
          changed = [name.decode('utf-8') for name in raw.split(b'\0') if name]
          def matches(patterns):
              return any(fnmatch.fnmatchcase(name, pattern) for name in changed for pattern in patterns)
          transition = matches(['ops/light_native_legacy_transition.py',
              'tests/test_light_native_legacy_transition.py',
              'tests/fixtures/light_native_legacy_transition_systemd.py'])
          legacy = transition or matches(['ops/light_native_continuity.py',
              'ops/light_native_legacy_capture.py', 'ops/light_native_current_*.py',
              'ops/light_native_reconciliation.py', 'ops/light_native_retirement.py',
              'ops/light_native_lane_run_guard.py', '.github/workflows/light-native-retirement-observe.yml',
              'tests/test_light_native_continuity.py', 'tests/test_light_native_legacy_capture.py',
              'tests/test_light_native_current_*.py', 'tests/test_light_native_reconciliation*.py'])
          host = matches(['ops/light_native_service_*.py', 'ops/light_native_readiness*',
              'tests/test_light_native_service_*.py', 'tests/test_light_native_readiness.py',
              'tests/fixtures/light_native_host_boundary_systemd.py', 'ops/light_native_legacy_transition.py'])
          workflow = '.github/workflows/native-host-preflight.yml'
          if workflow in changed:
              def old_job(ref, name, output):
                  text = subprocess.check_output(['git', 'show', ref+':'+workflow], timeout=10).decode('utf-8')
                  assert len(text) <= 262144
                  blocks = re.findall(r'(?ms)^  '+re.escape(name)+r':\n(.*?)(?=^  [a-zA-Z0-9_-]+:\n|\Z)', text)
                  assert len(blocks) == 1
                  # Adding this exact dependency gate does not change a proof's executable body.
                  gates = {'    needs: scope', "    if: needs.scope.outputs."+output+" == 'true'"}
                  return '\n'.join(line for line in blocks[0].splitlines() if line not in gates).strip()
              legacy = legacy or old_job(base, 'linux-root-contract', 'legacy') != old_job(head, 'linux-root-contract', 'legacy')
              transition = transition or old_job(base, 'disposable-systemd-transition', 'transition') != old_job(head, 'disposable-systemd-transition', 'transition')
              host = host or old_job(base, 'host-loaded-boundary', 'host') != old_job(head, 'host-loaded-boundary', 'host')
          codec = matches(['ops/light_native_lane_controller.py', 'ops/light_native_lane_execution.py',
              'ops/light_native_lane_issuer.py', 'ops/light_native_lane_cycle.py',
              'ops/light_native_retirement_live.py', 'ops/light_native_pilot_release.py',
              'ops/native_maintenance_bundle.py', 'ops/native_maintenance_agreement.py',
              'ops/native_maintenance_workflow_pause.py', 'ops/native_permission_hold_guard.py',
              'ops/oracle_light_active_hold_attest.py', 'oracle_autopilot/light_native_adapter.py',
              'ops/light_native_retirement.py', 'ops/light_native_service_authority.py',
              'database/native_cli_permission_engine.py', 'database/light_native_pilot_intake.py',
              'tests/test_light_native_service_authority.py', 'tests/test_light_native_plan_codec.py',
              'tests/test_native_host_preflight_scope.py', workflow])
          session = matches(['ops/light_native_lane_execution.py', 'ops/light_native_lane_controller.py',
              'ops/light_native_lane_install.py', 'ops/light_native_pilot_release.py',
              'ops/light_native_service_plan.py', 'ops/light_native_service_switch.py',
              'ops/light_native_service_unit.py', 'ops/native_maintenance_bundle.py',
              'ops/oracle_light_active_hold_attest.py', 'ops/oracle_light_runtime_hold_install.py',
              'tests/test_light_native_execution_session.py',
              'tests/fixtures/light_native_execution_session_systemd.py', workflow])
          result = dict(legacy=legacy, transition=transition, host=host, codec=codec, session=session)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(''.join(name+'='+str(value).lower()+'\n' for name, value in result.items()))
          print(json.dumps(dict(audit='AFFECTED_NATIVE_PROOFS', **result), sort_keys=True))
          PY
  portable-codec-contract:
    needs: scope
    if: needs.scope.outputs.codec == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Verify historical Plan bytes through issuer and downstream consumers
        run: |
          /usr/bin/python3 -I -S -B - <<'PY'
          import pathlib, sys, unittest
          sys.path.insert(0, str(pathlib.Path.cwd()))
          names = ['tests.test_light_native_service_authority.HistoricalCodecContracts',
              'tests.test_light_native_plan_codec', 'tests.test_native_host_preflight_scope']
          result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.loadTestsFromNames(names))
          assert not result.skipped, result.skipped
          assert result.testsRun >= 25
          raise SystemExit(not result.wasSuccessful())
          PY
  execution-session-boundary:
    needs: scope
    if: needs.scope.outputs.session == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Verify original execution deadline and first-invocation barriers
        run: |
          /usr/bin/python3 -I -S -B - <<'PY'
          import pathlib, sys, unittest
          sys.path.insert(0, str(pathlib.Path.cwd()))
          result = unittest.TextTestRunner(verbosity=2).run(
              unittest.defaultTestLoader.loadTestsFromName('tests.test_light_native_execution_session'))
          assert not result.skipped, result.skipped
          assert result.testsRun >= 23
          raise SystemExit(not result.wasSuccessful())
          PY
      - name: Rehearse execution identity on disposable real PID1 only
        run: |
          sudo -n --preserve-env=GITHUB_ACTIONS,GITHUB_REPOSITORY /usr/bin/python3 -I -S -B \
            tests/fixtures/light_native_execution_session_systemd.py ci \
            "$GITHUB_WORKSPACE" "$GITHUB_SHA"
  linux-root-contract:
    needs: scope
    if: needs.scope.outputs.legacy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Exercise kernel and protected-file contracts without services
        shell: bash
        run: |
          sudo -n /usr/bin/python3 -I -S -B - <<'PY'
          import os, pathlib, sys, unittest
          assert sys.platform == 'linux' and os.geteuid() == 0
          sys.path.insert(0, str(pathlib.Path.cwd()))
          names = [
              'tests.test_light_native_continuity',
              'tests.test_light_native_service_authority',
              'tests.test_light_native_service_supervisor',
              'tests.test_light_native_legacy_capture',
              'tests.test_light_native_legacy_transition',
              'tests.test_light_native_current_anchor',
              'tests.test_light_native_reconciliation',
              'tests.test_light_native_reconciliation_transport',
          ]
          suite = unittest.defaultTestLoader.loadTestsFromNames(names)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          allowed_notrun = {
              'tests.test_light_native_continuity.ContinuityTests.test_actual_linux_metadata_and_live_acceptance',
              'tests.test_light_native_legacy_capture.CaptureTests.test_real_linux_capture',
          }
          unexpected_skips = [(test.id(), reason) for test, reason in result.skipped
                              if test.id() not in allowed_notrun]
          assert not unexpected_skips, unexpected_skips
          assert result.testsRun >= 150
          raise SystemExit(not result.wasSuccessful())
          PY
  disposable-systemd-transition:
    needs: scope
    if: needs.scope.outputs.transition == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Rehearse bounded transition and PID1 recovery in disposable units
        shell: bash
        run: |
          sudo -n /usr/bin/env GITHUB_ACTIONS="$GITHUB_ACTIONS" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            /usr/bin/python3 -I -S -B tests/fixtures/light_native_legacy_transition_systemd.py \
            ci "$GITHUB_WORKSPACE" "$GITHUB_SHA"
  host-loaded-boundary:
    needs: scope
    if: needs.scope.outputs.host == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Test changed HOST and read-only readiness contracts
        run: |
          sudo -n /usr/bin/python3 -I -S -B - <<'PY'
          import os, pathlib, sys, unittest
          assert sys.platform == 'linux' and os.geteuid() == 0
          sys.path.insert(0, str(pathlib.Path.cwd()))
          names = ['tests.test_light_native_service_unit',
              'tests.test_light_native_service_authority',
              'tests.test_light_native_service_supervisor',
              'tests.test_light_native_readiness']
          result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.loadTestsFromNames(names))
          assert not result.skipped, result.skipped
          assert result.testsRun >= 107
          raise SystemExit(not result.wasSuccessful())
          PY
      - name: Verify actual loaded unit and independent process identity
        run: |
          sudo -n /usr/bin/env GITHUB_ACTIONS="$GITHUB_ACTIONS" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            /usr/bin/python3 -I -S -B tests/fixtures/light_native_host_boundary_systemd.py "$GITHUB_WORKSPACE"
