  teacher_methodology_protected: true
  unknown_over_invention: true
  preserve_failed_experiments: true
  regression_on_material_failure: true
  new_sql_auto_production: false
  folder_name_is_identity: false
  learning_join_requires_resolved_identity: true
  coach_requires_approved_school_knowledge: true
  pedagogical_hypothesis_requires_teacher_approval: true
  online_school_and_learning_engine_are_meta_clients: true
