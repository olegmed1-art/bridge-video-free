name: Tournament Analyzer v3 Stage3

on:
  pull_request:
    paths:
      - "bridge_school_api/tournament_bridge_co_il_v3.py"
      - "bridge_school_api/tournament_real_sources_v3.py"
      - "bridge_school_api/tournament_adapters_v3.py"
      - "bridge_school_api/tournament_analyzer_v3.py"
      - "data/tournaments/tournament_30041_round2_diana_facts_v1.json"
      - "tests/test_tournament_analyzer_v3_stage3.py"
      - "tests/test_tournament_real_sources_v3.py"
      - ".github/workflows/tournament-analyzer-v3-stage3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-facts-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile adapter and canonical real-source layer
        run: |
          python -m py_compile bridge_school_api/tournament_bridge_co_il_v3.py
          python -m py_compile bridge_school_api/tournament_real_sources_v3.py
      - name: Run v3 core, stage2, canonical real-source and Stage3 compatibility tests
        run: |
          python -m pytest -q \
            tests/test_tournament_analyzer_v3.py \
            tests/test_tournament_analyzer_v3_stage2.py \
            tests/test_tournament_real_sources_v3.py \
            tests/test_tournament_analyzer_v3_stage3.py
