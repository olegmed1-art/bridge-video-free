name: Retired Oracle Universal Video Container Evidence Contract

# Retired legacy entrypoint. This PR-only job uses a deliberately non-promotable
# workflow and check identity while proving that the sole Issue 881 external
# pre-canary evidence path is Director-gated. It has no secrets, dispatch
# trigger, OCI, SSH, Docker, or host action.
on:
  pull_request:
    paths:
      - '.github/workflows/oracle-universal-video-container-evidence.yml'
      - '.github/workflows/issue-881-authoritative-external-evidence.yml'
      - 'tests/test_oracle_container_evidence_workflow_contract.py'
      - 'tests/test_universal_video_container_promotion_contract.py'

permissions:
  contents: read

concurrency:
  group: retired-oracle-container-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  retired-evidence-contract:
    name: Retired legacy evidence entrypoint contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Prove authoritative Issue 881 entrypoint remains Director-gated
        run: |
          set -euo pipefail
          workflow=.github/workflows/issue-881-authoritative-external-evidence.yml
          test "$(grep -Fxc '      director_go:' "$workflow")" -eq 1
          gate_prefix='    if: $'
          gate_suffix="{{ inputs.director_go && github.actor == github.repository_owner && github.repository == 'olegmed1-art/bridge-video-free' }}"
          test "$(grep -Fxc "$gate_prefix$gate_suffix" "$workflow")" -eq 1
          grep -F 'verify_live_gate(){' "$workflow"
          test "$(grep -c '^[[:space:]]*verify_live_gate$' "$workflow")" -eq 2
          echo UNIVERSAL_VIDEO_LEGACY_CONTAINER_EVIDENCE_RETIRED=true
