name: Universal Video Analyzer CI

on:
  pull_request:
    paths:
      - 'universal_video/**'
      - 'bridge_vision/**'
      - 'bridge_contracts/video_deal.py'
      - 'bridge_contracts/video_frame.py'
      - 'bridge_contracts/__init__.py'
      - 'tools/bridge_video_positions.py'
      - 'tools/bridge_video_deals.py'
      - 'requirements-universal-video.txt'
      - 'requirements-universal-video-speaker.txt'
      - 'deploy/oracle-universal-video/**'
      - 'ops/oracle_universal_video_*.sh'
      - 'ops/universal_video_receipt_reader.py'
      - 'tests/test_universal_video_*.py'
      - 'tests/test_bridge_video_*.py'
      - 'tests/test_bridge_vision_*.py'
      - '.github/workflows/universal-video-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -q pytest requests google-auth
      - name: Syntax-check host scripts
        run: |
          bash -n ops/oracle_universal_video_preflight.sh
          bash -n ops/oracle_universal_video_install.sh
          bash -n ops/oracle_universal_video_spool_guard.sh
          bash -n ops/oracle_universal_video_run_command.sh
          bash -n ops/oracle_universal_video_drive_secret_install.sh
          bash -n ops/oracle_universal_video_productionize.sh
          python -m py_compile ops/universal_video_receipt_reader.py
          grep -q 'requirements-universal-video-speaker.txt' ops/oracle_universal_video_install.sh
          grep -q 'from universal_video.speaker_structure import run_speaker_structure' ops/oracle_universal_video_install.sh
      - name: Validate systemd boundaries
        run: |
          unit=deploy/oracle-universal-video/universal-video.service
          grep -q '^User=universal-video$' "$unit"
          grep -q '^Nice=10$' "$unit"
          grep -q '^CPUQuota=400%$' "$unit"
          grep -q '^CPUWeight=20$' "$unit"
          grep -q '^MemoryAccounting=true$' "$unit"
          grep -q '^MemoryHigh=6G$' "$unit"
          grep -q '^MemoryMax=8G$' "$unit"
          grep -q '^IOSchedulingClass=idle$' "$unit"
          grep -q '^IOWeight=20$' "$unit"
          grep -q '^WorkingDirectory=/opt/bridge-school/universal-video-src$' "$unit"
          grep -q '^ReadOnlyPaths=/opt/bridge-school/universal-video-src$' "$unit"
          grep -q '^EnvironmentFile=-/opt/bridge-school/universal-video/universal-video-secrets.env$' "$unit"
          grep -q 'universal_video.maintenance' deploy/oracle-universal-video/universal-video-maintenance.service
          grep -q '^OnUnitActiveSec=1h$' deploy/oracle-universal-video/universal-video-maintenance.timer
          grep -q '^Persistent=true$' deploy/oracle-universal-video/universal-video-maintenance.timer
          ! grep -q '/opt/bridge-school/bridge-video-free' "$unit"
          ! grep -q '^Requires=assistant-lab.service$' "$unit"
          ! grep -RniE 'systemctl +(stop|restart|disable).*assistant-lab|docker +(stop|rm|restart).*dds3' \
            ops/oracle_universal_video_install.sh \
            ops/oracle_universal_video_run_command.sh \
            ops/oracle_universal_video_drive_secret_install.sh \
            ops/oracle_universal_video_productionize.sh \
            deploy/oracle-universal-video
      - name: Validate isolated checkout, retention and Drive boundaries
        run: |
          grep -q 'UNIVERSAL_VIDEO_SOURCE_DIR' ops/oracle_universal_video_install.sh
          grep -q 'universal-video-src' ops/oracle_universal_video_run_command.sh
          grep -q 'DDS3_BEFORE_PASS' ops/oracle_universal_video_run_command.sh
          grep -q 'DDS3_AFTER_PASS' ops/oracle_universal_video_run_command.sh
          grep -q 'UNIVERSAL_VIDEO_ORACLE_RUN_COMMAND_PASS' ops/oracle_universal_video_run_command.sh
          grep -q 'GOOGLE_DRIVE_OAUTH_JSON_FILE' universal_video/drive_adapter.py
          grep -q 'GOOGLE_DRIVE_OAUTH_JSON_FILE' ops/oracle_universal_video_install.sh
          grep -q 'chmod 0640' ops/oracle_universal_video_drive_secret_install.sh
          grep -q 'UNIVERSAL_VIDEO_DRIVE_SECRET_INSTALL_PASS' ops/oracle_universal_video_drive_secret_install.sh
          grep -q 'UNIVERSAL_VIDEO_DRIVE_SOURCE_NO_ASR_PASS' ops/oracle_universal_video_productionize.sh
          grep -q 'UNIVERSAL_VIDEO_RESULT_ROUTING_PASS' ops/oracle_universal_video_productionize.sh
          grep -q 'raw_media_included' universal_video/drive_results.py
          grep -q 'active_job_ids' universal_video/maintenance.py
          ! grep -q 'set -x' ops/oracle_universal_video_drive_secret_install.sh
          ! grep -q 'set -x' ops/oracle_universal_video_productionize.sh
      - name: Enforce student-agnostic core
        run: |
          ! grep -Rni 'Diana' universal_video bridge_vision tests/test_universal_video_*.py tests/test_bridge_vision_*.py bridge_contracts/video_deal.py bridge_contracts/video_frame.py tools/bridge_video_positions.py tools/bridge_video_deals.py tests/test_bridge_video_*.py
      - name: Enforce native vision default
        run: |
          grep -q 'BridgeVisionEngine' tools/bridge_video_positions.py
          grep -q 'allow_legacy_old_bbo: bool = False' tools/bridge_video_positions.py
          ! grep -q 'from bridge_report_board_reconstruction import parse_image' tools/bridge_video_positions.py
      - name: Audit external decision dependencies
        run: python -m bridge_vision.dependency_audit
      - name: Run contract tests
        run: python -m pytest -q tests/test_universal_video_*.py tests/test_bridge_video_*.py tests/test_bridge_vision_*.py tests/test_dense_field_workflow.py
      - name: Compile Python modules
        run: python -m compileall -q universal_video bridge_vision bridge_contracts tools/bridge_video_positions.py tools/bridge_video_deals.py
      - name: Record requirements checksum
        run: sha256sum requirements-universal-video.txt requirements-universal-video-speaker.txt

  dense-diana14-shadow:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'codex/issue-733-shadow-derived-persistence' &&
      contains(github.event.pull_request.body, '<!-- diana14-dense-r5 -->')
    uses: ./.github/workflows/field-diana14-3-1-test-r5-dense.yml
    secrets: inherit
