name: DDS3 module integration
on:
  pull_request:
    paths:
      - 'dds/**'
      - 'bridge_school_api/dds3/**'
      - 'dds3_runtime/**'
      - 'Dockerfile.dds3'
      - '.github/workflows/dds3-module.yml'
  workflow_dispatch:

jobs:
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned DDS3 container
        run: docker build -f Dockerfile.dds3 -t bridge-school-dds3 .
      - name: Random generated deal through DDS3
        run: |
          DEAL='N:9.A93.J7632.A865 AKQJ642.Q4.84.K2 875.K752.KT9.Q97 T3.JT86.AQ5.JT43'
          docker run --rm bridge-school-dds3 N None "$DEAL" | tee random-deal.json
      - uses: actions/upload-artifact@v4
        with:
          name: dds3-integration-results
          path: random-deal.json
