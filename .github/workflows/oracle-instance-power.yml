name: Oracle instance power

on:
  workflow_dispatch:
    inputs:
      action:
        description: Exact lifecycle action
        required: true
        type: choice
        options: [status, start, stop]
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: oracle-instance-power
  cancel-in-progress: false

jobs:
  power:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.actor == github.repository_owner &&
       contains(fromJSON('["/oracle-instance status","/oracle-instance start","/oracle-instance stop"]'), github.event.comment.body))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OCI_REGION: eu-frankfurt-1
      OCI_INSTANCE_OCID: ocid1.instance.oc1.eu-frankfurt-1.antheljtruoejaica7hj5oubnh2cctnjr7ti7llcgo6ho6wdvgvui6td7saq
    steps:
      - name: Checkout bounded control code
        uses: actions/checkout@v4

      - name: Resolve bounded action
        id: command
        env:
          DISPATCH_ACTION: ${{ inputs.action }}
          COMMENT_COMMAND: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            action="${DISPATCH_ACTION}"
          else
            action="${COMMENT_COMMAND#/oracle-instance }"
          fi
          case "$action" in status|start|stop) ;; *) echo "invalid action" >&2; exit 2 ;; esac
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "bounded action: $action"

      - name: Validate credential presence
        env:
          OCI_CLI_CONFIG: ${{ secrets.OCI_CLI_CONFIG }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
        run: |
          set -euo pipefail
          test -n "${OCI_CLI_CONFIG:-}"
          test -n "${OCI_CLI_KEY_CONTENT:-}"

      - name: Install OCI CLI
        run: python -m pip install --disable-pip-version-check --quiet 'oci-cli==3.90.3'

      - name: Configure bounded OCI client
        env:
          OCI_CLI_CONFIG: ${{ secrets.OCI_CLI_CONFIG }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.oci"
          if [[ "$OCI_CLI_KEY_CONTENT" == base64:* ]]; then
            printf '%s' "${OCI_CLI_KEY_CONTENT#base64:}" | base64 --decode > "$HOME/.oci/oci_api_key.pem"
          else
            printf '%s\n' "$OCI_CLI_KEY_CONTENT" > "$HOME/.oci/oci_api_key.pem"
          fi
          printf '%s\n' "$OCI_CLI_CONFIG" > "$HOME/.oci/config"
          if ! openssl pkey -in "$HOME/.oci/oci_api_key.pem" -noout -check >/dev/null 2>&1; then
            echo "OCI_KEY_INVALID: expected an unencrypted private PEM key or base64:<single-line-Pem-base64>" >&2
            exit 6
          fi
          openssl pkey -in "$HOME/.oci/oci_api_key.pem" -traditional -out "$HOME/.oci/oci_api_key.pkcs1.pem"
          mv "$HOME/.oci/oci_api_key.pkcs1.pem" "$HOME/.oci/oci_api_key.pem"
          actual_fingerprint="$(openssl pkey -in "$HOME/.oci/oci_api_key.pem" -pubout -outform DER | openssl md5 -r | awk '{print $1}' | sed 's/../&:/g;s/:$//')"
          test -n "$actual_fingerprint"
          export OCI_DERIVED_FINGERPRINT="$actual_fingerprint"
          python - <<'PY'
          import os
          from pathlib import Path
          p=Path.home()/'.oci/config'
          lines=[]; key=False; region=False; fingerprint=False
          for line in p.read_text().splitlines():
              if line.strip().startswith('key_file='):
                  lines.append(f'key_file={Path.home()}/.oci/oci_api_key.pem'); key=True
              elif line.strip().startswith('region='):
                  lines.append('region=eu-frankfurt-1'); region=True
              elif line.strip().startswith('fingerprint='):
                  lines.append(f'fingerprint={os.environ["OCI_DERIVED_FINGERPRINT"]}'); fingerprint=True
              else:
                  lines.append(line)
          if not key: lines.append(f'key_file={Path.home()}/.oci/oci_api_key.pem')
          if not region: lines.append('region=eu-frankfurt-1')
          if not fingerprint: lines.append(f'fingerprint={os.environ["OCI_DERIVED_FINGERPRINT"]}')
          p.write_text('\n'.join(lines)+'\n')
          PY
          oci iam region list --output json >/dev/null

      - name: Read current lifecycle state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          instance_json="$(oci compute instance get --instance-id "$OCI_INSTANCE_OCID" --output json)"
          state="$(printf '%s' "$instance_json" | python -c 'import json,sys; print(json.load(sys.stdin)["data"].get("lifecycle-state",""))')"
          compartment="$(printf '%s' "$instance_json" | python -c 'import json,sys; print(json.load(sys.stdin)["data"].get("compartment-id",""))')"
          case "$state" in RUNNING|STOPPED|STARTING|STOPPING) ;; *) echo "unexpected lifecycle state: $state" >&2; exit 1 ;; esac
          test -n "$compartment"
          echo "current_state=$state" >> "$GITHUB_OUTPUT"
          echo "compartment_id=$compartment" >> "$GITHUB_OUTPUT"
          echo "current lifecycle state: $state"

      - name: Prove host idle before stop
        id: idle
        if: ${{ steps.command.outputs.action == 'stop' && steps.state.outputs.current_state == 'RUNNING' }}
        shell: bash
        env:
          COMPARTMENT_ID: ${{ steps.state.outputs.compartment_id }}
        run: |
          set -euo pipefail

          plugins_json="$(oci instance-agent plugin list \
            --compartment-id "$COMPARTMENT_ID" \
            --instanceagent-id "$OCI_INSTANCE_OCID" \
            --all --output json)"
          run_command_status="$(printf '%s' "$plugins_json" | python -c 'import json,sys; xs=json.load(sys.stdin).get("data",[]); print(next((x.get("status","") for x in xs if "Run Command" in str(x.get("name",""))),""))')"
          if [[ "$run_command_status" != "RUNNING" ]]; then
            echo "idle_state=UNKNOWN" >> "$GITHUB_OUTPUT"
            echo "idle_reason=oci_run_command_${run_command_status:-unknown}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          classifier_text="$(cat ops/oracle_idle_state.sh)"
          classifier_payload="$(printf '%s' "$classifier_text" | gzip -9 -c | base64 -w0)"
          script_text="$(printf "if ! sudo -n true 2>/dev/null; then echo OCARUN_SUDO_NOT_CONFIGURED; exit 77; fi\nprintf '%%s' '%s' | base64 --decode | gzip --decompress | sudo -n bash\n" "$classifier_payload")"
          if (( ${#script_text} > 4096 )); then
            echo "idle_state=UNKNOWN" >> "$GITHUB_OUTPUT"
            echo "idle_reason=classifier_payload_too_large" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          content_json="$(SCRIPT_TEXT="$script_text" python -c 'import json,os; print(json.dumps({"source":{"sourceType":"TEXT","text":os.environ["SCRIPT_TEXT"]},"output":{"outputType":"TEXT"}},separators=(",",":")))')"
          target_json="$(python -c 'import json,os; print(json.dumps({"instanceId":os.environ["OCI_INSTANCE_OCID"]},separators=(",",":")))')"
          if ! command_id="$(oci instance-agent command create \
            --compartment-id "$COMPARTMENT_ID" \
            --content "$content_json" \
            --target "$target_json" \
            --timeout-in-seconds 120 \
            --display-name "bridge-school-oracle-idle-proof-${GITHUB_RUN_ID}" \
            --query data.id --raw-output 2>/dev/null)"; then
            echo "idle_state=UNKNOWN" >> "$GITHUB_OUTPUT"
            echo "idle_reason=instance_agent_command_create_failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -n "$command_id"

          execution_json=""
          lifecycle=""
          for _ in $(seq 1 36); do
            execution_json="$(oci instance-agent command-execution get \
              --command-id "$command_id" \
              --instance-id "$OCI_INSTANCE_OCID" \
              --output json 2>/dev/null || true)"
            if [[ -n "$execution_json" ]]; then
              lifecycle="$(printf '%s' "$execution_json" | python -c 'import json,sys; print(json.load(sys.stdin).get("data",{}).get("lifecycle-state",""))')"
              case "$lifecycle" in SUCCEEDED|FAILED|CANCELED|TIMED_OUT) break ;; esac
            fi
            sleep 5
          done

          exit_code="$(printf '%s' "$execution_json" | python -c 'import json,sys; print(json.load(sys.stdin).get("data",{}).get("content",{}).get("exit-code","") or "")' 2>/dev/null || true)"
          text="$(printf '%s' "$execution_json" | python -c 'import json,sys; print(json.load(sys.stdin).get("data",{}).get("content",{}).get("text","") or "")' 2>/dev/null || true)"
          if [[ "$lifecycle" != "SUCCEEDED" ]]; then
            diagnostic="$(printf '%s\n' "$text" | grep -E '^(OCARUN_SUDO_NOT_CONFIGURED|ORACLE_IDLE_REASON=|ORACLE_IDLE_STATE=)' | tail -n2 | tr '\n' ',' | sed 's/,$//' || true)"
            printf 'idle command failed: lifecycle=%s exit=%s diagnostic=%s\n' "${lifecycle:-timeout}" "${exit_code:-unknown}" "${diagnostic:-unavailable}"
            echo "idle_state=UNKNOWN" >> "$GITHUB_OUTPUT"
            if [[ "$diagnostic" == *OCARUN_SUDO_NOT_CONFIGURED* ]]; then
              echo "idle_reason=ocarun_sudo_not_configured" >> "$GITHUB_OUTPUT"
            else
              echo "idle_reason=instance_agent_${lifecycle:-timeout}_exit_${exit_code:-unknown}" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          if [[ "$exit_code" != "0" ]]; then
            echo "idle_state=UNKNOWN" >> "$GITHUB_OUTPUT"
            echo "idle_reason=classifier_exit_${exit_code:-unknown}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          idle_state="$(printf '%s\n' "$text" | sed -n 's/^ORACLE_IDLE_STATE=//p' | tail -n1)"
          idle_reason="$(printf '%s\n' "$text" | sed -n 's/^ORACLE_IDLE_REASON=//p' | tail -n1)"
          case "$idle_state" in IDLE|BUSY|UNKNOWN) ;; *) idle_state=UNKNOWN; idle_reason=invalid_idle_proof ;; esac
          printf 'idle proof: %s (%s)\n' "$idle_state" "$idle_reason"
          echo "idle_state=$idle_state" >> "$GITHUB_OUTPUT"
          echo "idle_reason=$idle_reason" >> "$GITHUB_OUTPUT"

      - name: Start exact instance
        id: start
        if: ${{ steps.command.outputs.action == 'start' && steps.state.outputs.current_state == 'STOPPED' }}
        shell: bash
        run: |
          set -euo pipefail
          oci compute instance action --instance-id "$OCI_INSTANCE_OCID" --action START >/dev/null
          oci compute instance get --instance-id "$OCI_INSTANCE_OCID" --wait-for-state RUNNING --wait-interval-seconds 10 --max-wait-seconds 600 >/dev/null
          echo "started=true" >> "$GITHUB_OUTPUT"
          echo "instance reached RUNNING"

      - name: Verify DDS3 health after start
        if: ${{ steps.command.outputs.action == 'start' && (steps.start.outputs.started == 'true' || steps.state.outputs.current_state == 'RUNNING') }}
        shell: bash
        run: |
          set -euo pipefail
          public_ip="$(oci compute instance list-vnics --instance-id "$OCI_INSTANCE_OCID" --all --query 'data[0]."public-ip"' --raw-output)"
          test -n "$public_ip" && [[ "$public_ip" != "null" ]]
          ready=""
          for _ in $(seq 1 30); do
            if ready="$(curl -fsS --max-time 10 "https://${public_ip}/readyz" 2>/dev/null)"; then
              if printf '%s' "$ready" | python -c 'import json,sys; x=json.load(sys.stdin); assert x.get("status")=="ready" and x.get("engine")=="DDS3" and x.get("fallback_used") is False'; then
                echo "DDS3 health verified after start"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "instance is RUNNING but DDS3 health was not proven" >&2
          exit 4

      - name: Stop exact instance only with IDLE proof
        if: ${{ steps.command.outputs.action == 'stop' && steps.state.outputs.current_state == 'RUNNING' && steps.idle.outputs.idle_state == 'IDLE' }}
        run: |
          set -euo pipefail
          oci compute instance action --instance-id "$OCI_INSTANCE_OCID" --action STOP >/dev/null
          oci compute instance get --instance-id "$OCI_INSTANCE_OCID" --wait-for-state STOPPED --wait-interval-seconds 10 --max-wait-seconds 600 >/dev/null
          echo "instance reached STOPPED after IDLE proof"

      - name: Refuse stop unless IDLE is proven
        if: ${{ steps.command.outputs.action == 'stop' && steps.state.outputs.current_state == 'RUNNING' && steps.idle.outputs.idle_state != 'IDLE' }}
        run: |
          echo "STOP REFUSED: host idle state is ${{ steps.idle.outputs.idle_state || 'UNKNOWN' }}" >&2
          exit 3

      - name: Refuse transition-state mutation
        if: ${{ (steps.command.outputs.action == 'start' || steps.command.outputs.action == 'stop') && (steps.state.outputs.current_state == 'STARTING' || steps.state.outputs.current_state == 'STOPPING') }}
        run: |
          echo "MUTATION REFUSED: lifecycle transition already in progress" >&2
          exit 5

      - name: Publish run summary
        if: ${{ always() }}
        env:
          ACTION_VALUE: ${{ steps.command.outputs.action }}
          STATE: ${{ steps.state.outputs.current_state }}
          IDLE_STATE: ${{ steps.idle.outputs.idle_state }}
          IDLE_REASON: ${{ steps.idle.outputs.idle_reason }}
        run: |
          {
            echo "### Oracle instance power"
            echo "- action: ${ACTION_VALUE:-UNKNOWN}"
            echo "- initial_state: ${STATE:-UNKNOWN}"
            echo "- idle_state: ${IDLE_STATE:-not_applicable}"
            echo "- idle_reason: ${IDLE_REASON:-not_applicable}"
            echo "- target: exact Frankfurt VM only"
            echo "- automatic idle shutdown: disabled"
          } >> "$GITHUB_STEP_SUMMARY"
