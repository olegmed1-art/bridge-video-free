name: Tournament Analyzer v3 Non-DDS Source Census

on:
  pull_request:
    paths:
      - "bridge_school_api/tournament_episode_source_census_v3.py"
      - "bridge_school_api/tournament_episode_coverage_handoff_v3.py"
      - "tests/test_tournament_episode_source_census_v3.py"
      - "tests/test_tournament_episode_source_census_handoff_v3.py"
      - ".github/workflows/tournament-analyzer-v3-non-dd-census.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile census and handoff
        run: |
          python -m py_compile \
            bridge_school_api/tournament_episode_source_census_v3.py \
            bridge_school_api/tournament_episode_coverage_handoff_v3.py
      - name: Run census contracts
        run: |
          python -m pytest -q \
            tests/test_tournament_episode_source_census_v3.py \
            tests/test_tournament_episode_source_census_handoff_v3.py
