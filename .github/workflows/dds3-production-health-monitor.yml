name: DDS3 Production Health Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '47 * * * *'
  pull_request:
    paths:
      - '.github/workflows/dds3-production-health-monitor.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: dds3-production-health-monitor
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ORACLE_DDS3_READY_URL: https://158.180.47.161/readyz
      VERCEL_APP_HEALTH_URL: https://bridge-video-free.vercel.app/healthz
      VERCEL_DDS3_READY_URL: https://bridge-video-free.vercel.app/dds3/readyz
    steps:
      - name: Verify Oracle DDS3 and authenticated Vercel route
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import time
          from datetime import UTC, datetime
          import urllib.request


          def fetch_json(name: str, url: str) -> dict:
              last_error: Exception | None = None
              for attempt in range(1, 4):
                  try:
                      request = urllib.request.Request(
                          url,
                          headers={
                              "Accept": "application/json",
                              "User-Agent": "bridge-school-dds3-health-monitor/1.0",
                          },
                      )
                      with urllib.request.urlopen(request, timeout=20) as response:
                          if response.status != 200:
                              raise RuntimeError(f"HTTP {response.status}")
                          payload = json.load(response)
                      print(f"{name}: HTTP 200")
                      return payload
                  except Exception as exc:
                      last_error = exc
                      print(f"{name}: attempt {attempt}/3 failed: {exc}")
                      if attempt < 3:
                          time.sleep(5 * attempt)
              raise RuntimeError(f"{name} unavailable after 3 attempts: {last_error}")


          oracle = fetch_json("oracle_dds3", os.environ["ORACLE_DDS3_READY_URL"])
          assert oracle.get("status") == "ready", oracle
          assert oracle.get("engine") == "DDS3", oracle
          assert oracle.get("fallback_used") is False, oracle
          assert oracle.get("position_solver") == "ready", oracle

          app = fetch_json("vercel_app", os.environ["VERCEL_APP_HEALTH_URL"])
          assert app.get("status") == "ok", app

          routed = fetch_json("vercel_dds3", os.environ["VERCEL_DDS3_READY_URL"])
          assert routed.get("status") == "ready", routed
          assert routed.get("engine") == "DDS3", routed
          assert routed.get("fallback_used") is False, routed
          assert routed.get("transport") == "remote_https", routed
          assert routed.get("authenticated_compute") == "ready", routed

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## DDS3 production health\n\n")
              summary.write(f"- Checked: `{datetime.now(UTC).isoformat()}`\n")
              summary.write(f"- Oracle: `ready`, `{oracle.get('engine_version', 'unknown')}`\n")
              summary.write("- Vercel app: `ok`\n")
              summary.write("- Authenticated route: `ready`\n")
              summary.write("- Fallback used: `false`\n")

          print("DDS3_PRODUCTION_MONITOR_PASS")
          PY

      - name: Open or update production health incident
        if: ${{ failure() && github.event_name != 'pull_request' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title='[Monitor] DDS3 production health failure'
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)"
          body="DDS3 production monitoring failed at $(date -u +'%Y-%m-%dT%H:%M:%SZ'). Run: $RUN_URL"
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

      - name: Close recovered production health incident
        if: ${{ success() && github.event_name != 'pull_request' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title='[Monitor] DDS3 production health failure'
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)"
          if [[ -n "$number" ]]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "DDS3 production health recovered at $(date -u +'%Y-%m-%dT%H:%M:%SZ'). Passing run: $RUN_URL"
          fi
