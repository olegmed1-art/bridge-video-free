name: Verify recovered Light SSH key and audit host

on:
  push:
    branches: [ops/rdc-light-enroll-20260910]
    paths: ['.github/workflows/rdc-light-enroll-20260910.yml']

permissions:
  contents: read

concurrency:
  group: oracle-light-rdc-enrollment
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OCI_CLI_CONFIG: ${{ secrets.OCI_CLI_CONFIG }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      LIGHT_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_LIGHT_SSH_PRIVATE_KEY }}
      LIGHT_INSTANCE_ID: ocid1.instance.oc1.eu-frankfurt-1.antheljtruoejaicnbolm4whz6iex5lduf4gvk42jaj5maselesau66vvxpq
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Configure bounded clients
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${LIGHT_SSH_PRIVATE_KEY:-}"
          python -m pip install --disable-pip-version-check --quiet 'oci-cli==3.90.3'
          umask 077
          mkdir -p "$HOME/.oci"
          if [[ "$OCI_CLI_KEY_CONTENT" == base64:* ]]; then
            printf '%s' "${OCI_CLI_KEY_CONTENT#base64:}" | base64 --decode > "$HOME/.oci/key.pem"
          else
            printf '%s\n' "$OCI_CLI_KEY_CONTENT" > "$HOME/.oci/key.pem"
          fi
          printf '%s\n' "$OCI_CLI_CONFIG" > "$HOME/.oci/config"
          openssl pkey -in "$HOME/.oci/key.pem" -traditional -out "$HOME/.oci/key-pkcs1.pem"
          mv "$HOME/.oci/key-pkcs1.pem" "$HOME/.oci/key.pem"
          fingerprint="$(openssl pkey -in "$HOME/.oci/key.pem" -pubout -outform DER | openssl md5 -r | awk '{print $1}' | sed 's/../&:/g;s/:$//')"
          export OCI_DERIVED_FINGERPRINT="$fingerprint"
          python - <<'PY'
          import os
          from pathlib import Path
          p=Path.home()/'.oci/config'; lines=[]; key=region=fp=False
          for line in p.read_text().splitlines():
              s=line.strip()
              if s.startswith('key_file='): lines.append('key_file='+str(Path.home()/'.oci'/'key.pem')); key=True
              elif s.startswith('region='): lines.append('region=eu-frankfurt-1'); region=True
              elif s.startswith('fingerprint='): lines.append(f'fingerprint={os.environ["OCI_DERIVED_FINGERPRINT"]}'); fp=True
              else: lines.append(line)
          if not key: lines.append('key_file='+str(Path.home()/'.oci'/'key.pem'))
          if not region: lines.append('region=eu-frankfurt-1')
          if not fp: lines.append(f'fingerprint={os.environ["OCI_DERIVED_FINGERPRINT"]}')
          p.write_text('\n'.join(lines)+'\n')
          PY
          printf '%s\n' "$LIGHT_SSH_PRIVATE_KEY" | tr -d '\r' > "$RUNNER_TEMP/light_key"
          chmod 600 "$RUNNER_TEMP/light_key"
          ssh-keygen -y -f "$RUNNER_TEMP/light_key" > "$RUNNER_TEMP/light_key.pub"
          echo 'LIGHT_PRIVATE_KEY_PARSE=PASS'

      - name: Match key to exact Light metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          oci compute instance get --instance-id "$LIGHT_INSTANCE_ID" > "$RUNNER_TEMP/light.json"
          oci compute instance list-vnics --instance-id "$LIGHT_INSTANCE_ID" --all > "$RUNNER_TEMP/light-vnics.json"
          python - "$RUNNER_TEMP/light.json" "$RUNNER_TEMP/light_key.pub" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))['data']
          assert x['display-name']=='bridge-school-autopilot-lite'
          assert x['shape']=='VM.Standard.A1.Flex'
          assert x['lifecycle-state']=='RUNNING'
          supplied=open(sys.argv[2]).read().split()[1]
          configured=x.get('metadata',{}).get('ssh_authorized_keys','').split()
          configured_blobs={configured[i+1] for i,v in enumerate(configured[:-1]) if v.startswith('ssh-')}
          assert supplied in configured_blobs, 'SUPPLIED_KEY_DOES_NOT_MATCH_LIGHT_METADATA'
          print('LIGHT_KEY_METADATA_MATCH=PASS')
          PY
          light_ip="$(python - "$RUNNER_TEMP/light-vnics.json" <<'PY'
          import json,sys
          rows=[x for x in json.load(open(sys.argv[1]))['data'] if x.get('is-primary')]
          assert len(rows)==1 and rows[0].get('public-ip')
          print(rows[0]['public-ip'])
          PY
          )"
          echo "LIGHT_IP=$light_ip" >> "$GITHUB_ENV"

      - name: Verify SSH and collect read-only host evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          opts=(-i "$RUNNER_TEMP/light_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/light-known-hosts" -o ConnectTimeout=15)
          ssh "${opts[@]}" "ubuntu@$LIGHT_IP" 'set -eu; test "$(hostname)" = autopilot-lite-vnic || test "$(hostname)" = bridge-school-autopilot-lite; echo LIGHT_SSH=PASS; id -un; uname -sr; test -r /etc/os-release; echo LIGHT_FILESYSTEM_READ=PASS'
          ssh "${opts[@]}" "ubuntu@$LIGHT_IP" 'set -u; echo SERVICE_UNITS_BEGIN; systemctl list-units --type=service --state=running --no-legend --no-pager 2>/dev/null | sed -n "1,120p"; echo SERVICE_UNITS_END; echo CONTAINERS_BEGIN; if command -v docker >/dev/null; then sudo -n docker ps --format "{{.Names}}|{{.Image}}|{{.Status}}"; elif command -v podman >/dev/null; then sudo -n podman ps --format "{{.Names}}|{{.Image}}|{{.Status}}"; else echo NO_CONTAINER_RUNTIME; fi; echo CONTAINERS_END; echo APP_PATHS_BEGIN; find /opt /srv /home/ubuntu -maxdepth 2 -type f \( -name "docker-compose*.yml" -o -name "compose*.yml" -o -name "*.service" -o -name ".env.example" \) -print 2>/dev/null | sed -n "1,160p"; echo APP_PATHS_END'
          echo 'LIGHT_TERMINAL=PASS'

      - name: Audit Light autopilot health without exposing configuration values
        shell: bash
        run: |
          set -Eeuo pipefail
          opts=(-i "$RUNNER_TEMP/light_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/light-known-hosts" -o ConnectTimeout=15)
          ssh "${opts[@]}" "ubuntu@$LIGHT_IP" 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          for svc in school-autopilot-shadow.service school-autopilot-online-observer.service; do
            echo "UNIT=$svc"
            systemctl show "$svc" \
              -p ActiveState -p SubState -p MainPID -p ExecMainStatus -p Result \
              -p NRestarts -p ActiveEnterTimestamp -p WorkingDirectory -p FragmentPath
            unit="$(systemctl show "$svc" -p FragmentPath --value)"
            test -r "$unit"
            awk -F= '/^(Description|User|Group|WorkingDirectory|Restart|RestartSec)=/{print}' "$unit"
            awk -F= '/^ExecStart=/{print "ExecStart=" $2}' "$unit" | sed -E 's#(https?://)[^ ]+#\1<redacted>#g; s#(token|password|secret|key)=[^ ]+#\1=<redacted>#Ig'
            envfiles="$(sed -nE 's/^EnvironmentFile=-?"?([^" ]+)"?.*/\1/p' "$unit" || true)"
            for ef in $envfiles; do
              test -r "$ef" || continue
              echo "EnvironmentFile=$ef"
              sed -E 's/^[[:space:]]*export[[:space:]]+//' "$ef" | sed -nE 's/^([A-Za-z_][A-Za-z0-9_]*)=.*/ENV_KEY=\1/p' | sort -u
            done
          done
          echo 'AUTOPILOT_UNITS=PASS'
          echo 'WORKDIR_FILES_BEGIN'
          for d in $(systemctl show school-autopilot-shadow.service school-autopilot-online-observer.service -p WorkingDirectory --value | sort -u); do
            test -d "$d" || continue
            echo "WORKDIR=$d"
            resolved="$(readlink -f "$d")"
            echo "RESOLVED_WORKDIR=$resolved"
            find -L "$d" -maxdepth 3 -type f -printf '%p\n' 2>/dev/null | sed -n '1,240p'
          done
          echo 'WORKDIR_FILES_END'
          echo 'SAFE_JOURNAL_SIGNALS_BEGIN'
          for svc in school-autopilot-shadow.service school-autopilot-online-observer.service; do
            echo "JOURNAL_UNIT=$svc"
            journalctl -u "$svc" --since '-30 minutes' --no-pager -o short-iso 2>/dev/null \
              | grep -Ei 'heartbeat|queue|connected|connection|ready|healthy|error|failed|warning|poll|shadow' \
              | tail -n 100 \
              | sed -E 's#(https?://)[^ ]+#\1<redacted>#g; s#(postgres(ql)?://)[^ ]+#\1<redacted>#Ig; s#([A-Za-z0-9_]*(TOKEN|PASSWORD|SECRET|KEY)[A-Za-z0-9_]*)=[^ ]+#\1=<redacted>#Ig' || true
          done
          echo 'SAFE_JOURNAL_SIGNALS_END'
          REMOTE
