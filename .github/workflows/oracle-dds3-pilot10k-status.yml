name: Oracle DDS3 Pilot-10k status

on:
  pull_request_target:
    branches: [main]
    paths:
      - 'ops/oracle-dds3-pilot10k-status-requests/*.json'

permissions:
  contents: read
  issues: write

jobs:
  status:
    if: >-
      ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'olegmed1-art' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.changed_files == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ORACLE_HOST: 158.180.47.161
      ORACLE_USER: ubuntu
      EXPECTED_FINGERPRINT: SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk
      SSH_KEY_ORACLE: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
      SSH_KEY_OCI: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
      SSH_KEY_VM: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
      SSH_KEY_BRIDGE: ${{ secrets.BRIDGE_SCHOOL_ORACLE_SSH_PRIVATE_KEY }}
      SSH_KEY_ORACLE_ALT: ${{ secrets.ORACLE_SSH_KEY }}
      SSH_KEY_OCI_ALT: ${{ secrets.OCI_SSH_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Select credential and verify host
        id: ssh
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/pilot10k-status"
          mkdir -p "$work"
          known="$work/known_hosts"
          ssh-keyscan -T 10 -t ed25519,ecdsa,rsa "$ORACLE_HOST" > "$known" 2>/dev/null
          ssh-keygen -lf "$known" | awk '{print $2}' | grep -Fx "$EXPECTED_FINGERPRINT" >/dev/null
          selected=''
          for name in SSH_KEY_ORACLE SSH_KEY_OCI SSH_KEY_VM SSH_KEY_BRIDGE SSH_KEY_ORACLE_ALT SSH_KEY_OCI_ALT; do
            if [[ -n "${!name:-}" ]]; then selected="$name"; break; fi
          done
          [[ -n "$selected" ]]
          key="$work/id_oracle"
          printf '%s\n' "${!selected}" > "$key"
          chmod 0600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "known=$known" >> "$GITHUB_OUTPUT"

      - name: Read live Pilot-10k state
        id: audit
        if: ${{ steps.ssh.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pilot10k-status.txt"
          ssh -i '${{ steps.ssh.outputs.key }}' -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile='${{ steps.ssh.outputs.known }}' \
            -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE' | tee "$out"
          set -Eeuo pipefail
          sudo -n true
          state=/opt/bridge-school/dds3-mass-validation
          echo "service=$(sudo -n systemctl is-active dds3-mass@10000.service 2>/dev/null || true)"
          echo "unit_load=$(sudo -n systemctl show dds3-mass@10000.service -p LoadState --value 2>/dev/null || true)"
          echo "assistant_lab=$(sudo -n systemctl is-active assistant-lab.service 2>/dev/null || true)"
          ready="$(curl -fsS --max-time 10 http://127.0.0.1:8080/readyz)"
          READY="$ready" python3 -c 'import json,os; x=json.loads(os.environ["READY"]); print("dds3_status="+str(x.get("status"))); print("dds3_engine="+str(x.get("engine"))); print("dds3_fallback_used="+str(x.get("fallback_used")).lower())'
          if [[ -f "$state/evidence/10000.json" ]]; then
            echo evidence_present=true
            python3 -c 'import json; x=json.load(open("/opt/bridge-school/dds3-mass-validation/evidence/10000.json")); [print(f"{k}={x[k]}") for k in ("schema","target","status","compute_plane","compute_host","engine","fallback_used","corpus_sha256","corpus_deals","expected_train_tasks","returncode","log_sha256") if k in x]'
          else
            echo evidence_present=false
          fi
          if [[ -f "$state/logs/10000.log" ]]; then
            echo "log_bytes=$(stat -c %s "$state/logs/10000.log")"
            echo log_tail_begin
            tail -n 12 "$state/logs/10000.log" | sed -E 's/(token|password|secret|key)=[^[:space:]]+/\1=[REDACTED]/Ig'
            echo log_tail_end
          fi
          REMOTE

      - name: Publish live status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SSH_OUTCOME: ${{ steps.ssh.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pilot10k-status.txt"
          body="$RUNNER_TEMP/pilot10k-status.md"
          {
            echo 'Oracle DDS3 Pilot-10k live status:'
            echo
            echo "ssh_step=$SSH_OUTCOME"
            echo "audit_step=$AUDIT_OUTCOME"
            echo
            echo '```text'
            if [[ -f "$out" ]]; then sed -n '1,120p' "$out"; else echo 'No live status payload was produced.'; fi
            echo '```'
          } > "$body"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$(cat "$body")" >/dev/null
