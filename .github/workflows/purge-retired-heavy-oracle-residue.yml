name: Purge retired heavy Oracle residue

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: purge-retired-heavy-oracle-residue
  cancel-in-progress: false

jobs:
  purge:
    if: >-
      github.actor == github.repository_owner &&
      github.event.issue.number == 1131 &&
      github.event.comment.body == '/purge-retired-heavy-oracle-residue confirm-16-backups-and-50gb-volume'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OCI_INSTANCE_OCID: ocid1.instance.oc1.eu-frankfurt-1.antheljtruoejaica7hj5oubnh2cctnjr7ti7llcgo6ho6wdvgvui6td7saq
      EXPECTED_NAME: bridge-school-dds3-frankfurt
      EXPECTED_VOLUME_NAME: assistant-lab-observer-archive
    steps:
      - name: Configure bounded OCI client
        env:
          OCI_CLI_CONFIG: ${{ secrets.OCI_CLI_CONFIG }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
        run: |
          set -euo pipefail
          test -n "${OCI_CLI_CONFIG:-}"
          test -n "${OCI_CLI_KEY_CONTENT:-}"
          python -m pip install --disable-pip-version-check --quiet 'oci-cli==3.90.3'
          umask 077
          mkdir -p "$HOME/.oci"
          if [[ "$OCI_CLI_KEY_CONTENT" == base64:* ]]; then
            printf '%s' "${OCI_CLI_KEY_CONTENT#base64:}" | base64 --decode > "$HOME/.oci/key.pem"
          else
            printf '%s\n' "$OCI_CLI_KEY_CONTENT" > "$HOME/.oci/key.pem"
          fi
          printf '%s\n' "$OCI_CLI_CONFIG" > "$HOME/.oci/config"
          openssl pkey -in "$HOME/.oci/key.pem" -traditional -out "$HOME/.oci/key.pkcs1.pem"
          mv "$HOME/.oci/key.pkcs1.pem" "$HOME/.oci/key.pem"
          fp="$(openssl pkey -in "$HOME/.oci/key.pem" -pubout -outform DER | openssl md5 -r | awk '{print $1}' | sed 's/../&:/g;s/:$//')"
          OCI_FP="$fp" python - <<'PY'
          import os
          from pathlib import Path
          p=Path.home()/'.oci/config'
          out=[]; found=set()
          repl={'key_file':str(Path.home()/'.oci/key.pem'),'region':'eu-frankfurt-1','fingerprint':os.environ['OCI_FP']}
          for line in p.read_text().splitlines():
              key=line.partition('=')[0].strip()
              if key in repl:
                  out.append(f'{key}={repl[key]}'); found.add(key)
              else:
                  out.append(line)
          for key,value in repl.items():
              if key not in found: out.append(f'{key}={value}')
          p.write_text('\n'.join(out)+'\n')
          PY
          chmod 0600 "$HOME/.oci/config" "$HOME/.oci/key.pem"
          oci iam region list --output json >/dev/null

      - name: Resolve, validate, delete, and verify exact residue
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, time
          import oci

          cfg=oci.config.from_file()
          compute=oci.core.ComputeClient(cfg)
          block=oci.core.BlockstorageClient(cfg)

          def all_pages(fn, **kwargs):
              return oci.pagination.list_call_get_all_results(fn, **kwargs).data
          def missing(exc):
              return isinstance(exc, oci.exceptions.ServiceError) and exc.status == 404
          def suffix(value):
              return '…'+value[-12:]

          instance=compute.get_instance(os.environ['OCI_INSTANCE_OCID']).data
          assert instance.display_name == os.environ['EXPECTED_NAME']
          assert instance.lifecycle_state == 'TERMINATED'
          compartment=instance.compartment_id
          ad=instance.availability_domain

          boot_attachments=all_pages(
              compute.list_boot_volume_attachments,
              compartment_id=compartment,
              availability_domain=ad,
              instance_id=instance.id,
          )
          assert len(boot_attachments) == 1
          boot_attachment=boot_attachments[0]
          assert boot_attachment.lifecycle_state == 'DETACHED'
          heavy_boot_id=boot_attachment.boot_volume_id

          try:
              heavy_boot=block.get_boot_volume(heavy_boot_id).data
              assert heavy_boot.lifecycle_state == 'TERMINATED'
          except Exception as exc:
              if not missing(exc):
                  raise

          volume_attachments=all_pages(
              compute.list_volume_attachments,
              compartment_id=compartment,
              instance_id=instance.id,
          )
          assert len(volume_attachments) == 1
          volume_attachment=volume_attachments[0]
          assert volume_attachment.lifecycle_state == 'DETACHED'
          archive=block.get_volume(volume_attachment.volume_id).data
          assert archive.display_name == os.environ['EXPECTED_VOLUME_NAME']
          assert archive.size_in_gbs == 50
          assert archive.lifecycle_state == 'AVAILABLE'

          backups=all_pages(block.list_boot_volume_backups, compartment_id=compartment)
          selected=[b for b in backups if b.boot_volume_id == heavy_boot_id and b.lifecycle_state == 'AVAILABLE']
          assert len(selected) == 16
          allowed_prefixes=(
              'bridge-school-dds3-pre-reboot-',
              'Auto-backup for bridge-school-dds3-frankfurt (Boot Volume) via policy: gold',
              'issue-881-root-recovery-',
          )
          assert all(b.display_name.startswith(allowed_prefixes) for b in selected)
          assert all(b.size_in_gbs in (47,97) for b in selected)
          assert sum(b.size_in_gbs for b in selected) == 1252

          print('validated_instance=TERMINATED')
          print('validated_archive=AVAILABLE size_gb=50 id='+suffix(archive.id))
          print('validated_backups=16 logical_gb=1252')
          for b in sorted(selected, key=lambda x: x.time_created):
              print('deleting_backup id='+suffix(b.id)+' size_gb='+str(b.size_in_gbs)+' name='+b.display_name)
              block.delete_boot_volume_backup(b.id)
          print('deleting_archive id='+suffix(archive.id))
          block.delete_volume(archive.id)

          pending={b.id for b in selected}
          volume_done=False
          for _ in range(180):
              remaining=set()
              for backup_id in pending:
                  try:
                      state=block.get_boot_volume_backup(backup_id).data.lifecycle_state
                      if state != 'TERMINATED':
                          remaining.add(backup_id)
                  except Exception as exc:
                      if not missing(exc):
                          raise
              pending=remaining
              try:
                  volume_state=block.get_volume(archive.id).data.lifecycle_state
                  volume_done=(volume_state == 'TERMINATED')
              except Exception as exc:
                  if missing(exc):
                      volume_done=True
                  else:
                      raise
              if not pending and volume_done:
                  break
              time.sleep(5)

          assert not pending, 'backup deletion timeout'
          assert volume_done, 'archive volume deletion timeout'
          print('PURGE_RECEIPT backups=16 backup_state=TERMINATED_OR_ABSENT archive_gb=50 archive_state=TERMINATED_OR_ABSENT')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('### Heavy Oracle residue purge\n')
              f.write('- exact heavy instance: TERMINATED\n')
              f.write('- heavy boot backups deleted: 16 (1,252 logical GB)\n')
              f.write('- observer archive block volume deleted: 50 GB\n')
              f.write('- light Oracle resources touched: 0\n')
          PY
