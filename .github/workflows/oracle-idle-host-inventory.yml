name: Oracle idle guard host inventory

on:
  push:
    branches:
      - autopilot/oracle-idle-stop-guard-627-v2
    paths:
      - '.github/workflows/oracle-idle-host-inventory.yml'

permissions:
  contents: read

concurrency:
  group: oracle-idle-host-inventory-627
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ORACLE_HOST: 158.180.47.161
      ORACLE_USER: ubuntu
      SSH_KEY_ORACLE: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
      SSH_KEY_OCI: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
      SSH_KEY_VM: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
      SSH_KEY_BRIDGE: ${{ secrets.BRIDGE_SCHOOL_ORACLE_SSH_PRIVATE_KEY }}
      SSH_KEY_ORACLE_ALT: ${{ secrets.ORACLE_SSH_KEY }}
      SSH_KEY_OCI_ALT: ${{ secrets.OCI_SSH_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Prepare pinned SSH identity
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          known="$RUNNER_TEMP/oracle-idle-inventory-known-hosts"
          : > "$known"
          index=0
          for expected in \
            'SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk' \
            'SHA256:UGJo5yPdnk/wf8DVrzvXt2xJkE9GJ8+3IIcQ2vA+mkc' \
            'SHA256:eRCJ8c4V7HCBlIoNVSlpPSWZE5xPUMjBD6f0PvHDj64'; do
            part="$RUNNER_TEMP/oracle-idle-inventory-known-hosts.$index"
            ops/oracle_known_hosts_from_scan.sh "$ORACLE_HOST" "$expected" "$part"
            cat "$part" >> "$known"
            index=$((index + 1))
          done
          sort -u -o "$known" "$known"
          selected=''
          for name in SSH_KEY_ORACLE SSH_KEY_OCI SSH_KEY_VM SSH_KEY_BRIDGE SSH_KEY_ORACLE_ALT SSH_KEY_OCI_ALT; do
            if [[ -n "${!name:-}" ]]; then selected="$name"; break; fi
          done
          [[ -n "$selected" ]] || { echo 'Oracle SSH credential unavailable' >&2; exit 1; }
          key="$RUNNER_TEMP/id_oracle_idle_inventory"
          printf '%s\n' "${!selected}" > "$key"
          chmod 0600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "known=$known" >> "$GITHUB_OUTPUT"

      - name: Discover authoritative runtime layout and env keys read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i '${{ steps.ssh.outputs.key }}' -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile='${{ steps.ssh.outputs.known }}' \
            -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST" \
            'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          echo "GUARD_SHA256=$(sha256sum /usr/local/sbin/oracle-idle-state | awk '{print $1}')"
          for unit in assistant-lab.service school-autopilot-shadow.service universal-video-container.service universal-video.service; do
            echo "UNIT=$unit"
            systemctl show "$unit" --property=LoadState --property=ActiveState --property=FragmentPath --property=WorkingDirectory --property=ExecStart --property=User --no-pager 2>/dev/null || true
            systemctl cat "$unit" --no-pager 2>/dev/null \
              | grep -E '^(EnvironmentFile|WorkingDirectory|ExecStart|User|RuntimeDirectory|StateDirectory)=' || true
          done

          echo ENV_KEY_NAMES_BEGIN
          for path in \
            /opt/bridge-school/assistant-lab/assistant-lab.env \
            /opt/bridge-school/school-autopilot/autopilot-shadow.env \
            /opt/bridge-school/universal-video/universal-video.env \
            /opt/bridge-school/universal-video/universal-video-secrets.env; do
            if [[ -f "$path" && ! -L "$path" ]]; then
              echo "ENV_FILE=$path"
              awk -F= '/^[[:space:]]*(export[[:space:]]+)?[A-Za-z_][A-Za-z0-9_]*[[:space:]]*=/{k=$1; sub(/^[[:space:]]*export[[:space:]]+/,"",k); gsub(/[[:space:]]/,"",k); print "ENV_KEY=" k}' "$path" | sort -u
            else
              echo "ENV_FILE_MISSING=$path"
            fi
          done
          echo ENV_KEY_NAMES_END

          echo DISCOVERED_ENV_AND_DSN_PATHS_BEGIN
          find /opt/bridge-school /var/lib/bridge-school /run/bridge-school \
            -maxdepth 7 \( -type f -o -type l \) \
            \( -name '*.env' -o -name '*dsn*' -o -name '*database*url*' \) \
            -print 2>/dev/null | sort -u || true
          echo DISCOVERED_ENV_AND_DSN_PATHS_END

          echo DISCOVERED_WORK_DIRS_BEGIN
          find /opt/bridge-school /var/lib/bridge-school /run/bridge-school \
            -maxdepth 7 -type d \
            \( -name spool -o -name pending -o -name running -o -name inbox -o -name progress -o -name jobs \) \
            -print 2>/dev/null | sort -u || true
          echo DISCOVERED_WORK_DIRS_END

          check() {
            local label="$1" path="$2"
            if [[ -L "$path" ]]; then echo "$label=SYMLINK"
            elif [[ -d "$path" ]]; then
              if first="$(find "$path" -mindepth 1 -print -quit 2>/dev/null)"; then
                [[ -n "$first" ]] && echo "$label=DIR_NONEMPTY" || echo "$label=DIR_EMPTY"
              else echo "$label=DIR_SCAN_FAILED"; fi
            elif [[ -f "$path" ]]; then echo "$label=FILE_PRESENT"
            elif [[ -e "$path" ]]; then echo "$label=OTHER_PRESENT"
            else echo "$label=MISSING"; fi
          }

          check LAB_ENV /opt/bridge-school/assistant-lab/assistant-lab.env
          check AUTOPILOT_ENV /opt/bridge-school/school-autopilot/autopilot-shadow.env
          check UV_ENV /opt/bridge-school/universal-video/universal-video.env
          check UV_SECRETS_ENV /opt/bridge-school/universal-video/universal-video-secrets.env
          check ASSISTANT_PYTHON /opt/bridge-school/assistant-lab/.venv/bin/python
          check LAB_SPOOL /opt/bridge-school/assistant-lab/spool
          check LAB_FEEDBACK_SPOOL /opt/bridge-school/assistant-lab/feedback-spool
          check VIDEO_INBOX /opt/bridge-school/universal-video/spool/inbox
          check VIDEO_RUNNING /opt/bridge-school/universal-video/spool/running
          check VIDEO_PROGRESS /opt/bridge-school/universal-video/spool/progress
          check OBSERVER_PENDING /opt/bridge-school/assistant-lab-observer/jobs/pending
          check OBSERVER_RUNNING /opt/bridge-school/assistant-lab-observer/jobs/running
          check AUTOPILOT_RUNNING /opt/bridge-school/school-autopilot/runtime/running
          check HOST_LEASE_PARENT /run/bridge-school
          check HOST_LEASE /run/bridge-school/oracle-host-lease

          echo GUARD_PROOF_BEGIN
          /usr/local/sbin/oracle-idle-state
          echo GUARD_PROOF_END
          REMOTE
