name: Diana verifier artifacts cleanup one-shot

on:
  push:
    branches: [codex/diana-autonomous-finalize-20260911]
    paths: ['.github/workflows/diana-23-26-verifier-frames-export-once.yml']

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    if: github.repository == 'olegmed1-art/bridge-video-free'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Delete transient verifier artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for artifact_id in 10273483711 10273588742; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/$artifact_id")"
            [[ "$code" == 204 || "$code" == 404 ]]
          done
          echo VERIFIER_ARTIFACTS_DELETED
