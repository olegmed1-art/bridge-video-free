name: Bridge School API Python 3.12 CI

on:
  pull_request:
    paths:
      - 'bridge_school_api/**'
      - 'tests/test_api_dsn_contract.py'
      - 'scripts/process_drive_video.py'
      - '.github/workflows/process-video.yml'
      - '.github/workflows/drive-upload-diagnostic.yml'
      - 'pyproject.toml'
      - '.python-version'
      - 'vercel.json'
      - '.github/workflows/api-python312-ci.yml'
  push:
    branches: [main]
    paths:
      - 'bridge_school_api/**'
      - 'tests/test_api_dsn_contract.py'
      - 'scripts/process_drive_video.py'
      - '.github/workflows/process-video.yml'
      - '.github/workflows/drive-upload-diagnostic.yml'
      - 'pyproject.toml'
      - '.python-version'
      - 'vercel.json'
      - '.github/workflows/api-python312-ci.yml'

permissions:
  contents: read

jobs:
  python-312:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install API dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-api.txt
      - name: Compile Python entry points
        run: python -m py_compile bridge_school_api/__init__.py bridge_school_api/db.py bridge_school_api/main.py scripts/process_drive_video.py
      - name: Verify database DSN contract
        run: PYTHONPATH=. python tests/test_api_dsn_contract.py
      - name: Import FastAPI application
        run: python -c "from bridge_school_api.main import app; assert app.title == 'Bridge School API'"
