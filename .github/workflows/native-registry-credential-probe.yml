name: Local backup validation ONLY (review harness)

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Reviewed unchanged main SHA
        required: true
        type: string
      expected_review_sha:
        description: Exact independently reviewed harness SHA
        required: true
        type: string
      operation:
        description: Must be LOCAL_VALIDATION_NO_UPLOAD_V1
        required: true
        type: string
      deadline_epoch:
        description: Owner-approved UTC Unix deadline, within 20 minutes of job start
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: backup-local-validation-only-20261001
  cancel-in-progress: false

jobs:
  local_validation_only:
    if: >-
      github.repository == 'olegmed1-art/bridge-video-free' &&
      github.ref == 'refs/heads/test/neon-backup-maintenance-review-20261001' &&
      github.event_name == 'workflow_dispatch' &&
      github.actor == 'olegmed1-art' && github.triggering_actor == 'olegmed1-art' &&
      github.run_attempt == 1 && inputs.expected_review_sha == github.sha &&
      inputs.expected_main_sha == '1440920191e1778fb9a9ba24e6701937a1a7459c' &&
      inputs.operation == 'LOCAL_VALIDATION_NO_UPLOAD_V1'
    environment: database-production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Record start before checkout
        shell: bash
        run: echo "VALIDATION_STARTED=$(date -u +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: One local roundtrip with sanitized summary only
        env:
          DATABASE_URL: ${{ secrets.LIGHT_MAINTENANCE_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.NEON_BACKUP_PASSPHRASE }}
          EXPECTED_MAIN: ${{ inputs.expected_main_sha }}
          EXPECTED_REVIEW: ${{ inputs.expected_review_sha }}
          VALIDATION_OPERATION: ${{ inputs.operation }}
          VALIDATION_DEADLINE: ${{ inputs.deadline_epoch }}
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          timeout --signal=TERM --kill-after=30s 1140s python -m ops.neon_backup_validate_once
      - name: Always remove this run's local containers and files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          timeout 10s docker rm -f -v "backup-validation-${GITHUB_RUN_ID}-source" "backup-validation-${GITHUB_RUN_ID}-restore" >/dev/null 2>&1 || true
          python - <<'PY'
          import os, pathlib, shutil
          base = pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
          target = base / ('backup-validation-' + os.environ['GITHUB_RUN_ID'])
          assert target.parent == base and not target.is_symlink()
          if target.exists():
              shutil.rmtree(target)
          PY
