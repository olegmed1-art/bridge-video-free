name: BBO100 public archive probe

on:
  push:
    branches:
      - bbo100-harvest-20260819
    paths:
      - 'tools/bbo100_archive_probe.py'
      - '.github/workflows/bbo100-archive-probe.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'tools/bbo100_archive_probe.py'
      - '.github/workflows/bbo100-archive-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Probe public BBO Robot Tournament Archive
        run: python tools/bbo100_archive_probe.py
      - name: Upload probe diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bbo100-archive-probe
          path: bbo100_probe/
          if-no-files-found: warn
          retention-days: 7
