name: Oracle Universal Video Queue Credential Install

on:
  pull_request:
    paths:
      - '.github/workflows/oracle-universal-video-queue-credential-install.yml'
      - 'tests/test_issue_881_queue_dsn.py'
  workflow_dispatch:
    inputs:
      exact_sha:
        description: Exact current main commit
        required: true
        type: string
      director_go:
        description: Explicit authorization for credential-only installation
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('uv-queue-credential-contract-{0}', github.run_id) || 'oracle-instance-workload-mutation' }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest 'psycopg[binary]'
          python -m pytest -q tests/test_issue_881_queue_dsn.py

  install:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.director_go && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.repository == 'olegmed1-art/bridge-video-free' }}
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXACT_SHA: ${{ inputs.exact_sha }}
      GH_TOKEN: ${{ github.token }}
      ORACLE_HOST: 158.180.47.161
      ORACLE_USER: ubuntu
      EXPECTED_FINGERPRINT: SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk
      SSH_KEY_ORACLE: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
      SSH_KEY_OCI: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
      SSH_KEY_VM: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
      SSH_KEY_BRIDGE: ${{ secrets.BRIDGE_SCHOOL_ORACLE_SSH_PRIVATE_KEY }}
      SSH_KEY_ORACLE_ALT: ${{ secrets.ORACLE_SSH_KEY }}
      SSH_KEY_OCI_ALT: ${{ secrets.OCI_SSH_KEY }}
      VIDEO_QUEUE_DSN: ${{ secrets.BRIDGE_WORKER_DATABASE_URL }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.EXACT_SHA }}
          persist-credentials: false
      - name: Validate exact main and local credential
        run: |
          set -euo pipefail
          [[ "$EXACT_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXACT_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_SHA"
          [[ -n "$VIDEO_QUEUE_DSN" ]]
          local_dsn="$RUNNER_TEMP/video-queue-dsn"
          printf '%s' "$VIDEO_QUEUE_DSN" > "$local_dsn"
          chmod 0600 "$local_dsn"
          python ops/validate_video_queue_dsn.py "$local_dsn" >/dev/null
      - name: Resolve pinned SSH identity
        id: ssh
        run: |
          set -euo pipefail
          known="$RUNNER_TEMP/known_hosts"
          ops/oracle_known_hosts_from_scan.sh "$ORACLE_HOST" "$EXPECTED_FINGERPRINT" "$known"
          selected=''
          for name in SSH_KEY_ORACLE SSH_KEY_OCI SSH_KEY_VM SSH_KEY_BRIDGE SSH_KEY_ORACLE_ALT SSH_KEY_OCI_ALT; do
            if [[ -n "${!name:-}" ]]; then selected="$name"; break; fi
          done
          [[ -n "$selected" ]]
          key="$RUNNER_TEMP/id_oracle"
          printf '%s\n' "${!selected}" > "$key"
          chmod 0600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          echo "known=$known" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Install credential atomically without service mutation
        run: |
          set -euo pipefail
          key='${{ steps.ssh.outputs.key }}'
          known='${{ steps.ssh.outputs.known }}'
          remote_stage="/tmp/uv-queue-dsn-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh_base=(ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST")
          scp_base=(scp -q -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" -o ConnectTimeout=15)
          cleanup(){ "${ssh_base[@]}" "rm -rf '$remote_stage'" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          "${ssh_base[@]}" "umask 077; rm -rf '$remote_stage'; mkdir -m 0700 '$remote_stage'"
          "${scp_base[@]}" "$RUNNER_TEMP/video-queue-dsn" "$ORACLE_USER@$ORACLE_HOST:$remote_stage/video-queue-dsn"
          "${scp_base[@]}" ops/validate_video_queue_dsn.py "$ORACLE_USER@$ORACLE_HOST:$remote_stage/validate.py"
          "${ssh_base[@]}" "set -eu; sudo -n /opt/bridge-school/universal-video/.venv/bin/python '$remote_stage/validate.py' '$remote_stage/video-queue-dsn'; sudo -n install -d -o root -g universal-video -m 0750 /opt/bridge-school/universal-video/secrets; sudo -n test ! -e /opt/bridge-school/universal-video/secrets/video-queue-dsn; sudo -n install -o root -g universal-video -m 0640 '$remote_stage/video-queue-dsn' /opt/bridge-school/universal-video/secrets/.video-queue-dsn.new; sudo -n mv -T /opt/bridge-school/universal-video/secrets/.video-queue-dsn.new /opt/bridge-school/universal-video/secrets/video-queue-dsn; sudo -n -u universal-video test -r /opt/bridge-school/universal-video/secrets/video-queue-dsn"
          meta="$("${ssh_base[@]}" "sudo -n stat -c '%U:%G:%a:%s' /opt/bridge-school/universal-video/secrets/video-queue-dsn")"
          [[ "$meta" =~ ^root:universal-video:640:([1-9][0-9]{0,3})$ ]]
          (( BASH_REMATCH[1] <= 4096 ))
          echo "UV_QUEUE_CREDENTIAL_INSTALL_PASS exact_sha=$EXACT_SHA service_mutation=false docker_mutation=false media_execution=false"
