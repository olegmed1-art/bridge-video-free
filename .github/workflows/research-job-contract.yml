name: ResearchJob contract

on:
  pull_request:
    paths:
      - 'assistant_lab/**'
      - 'tests/test_research_*.py'
      - 'tests/test_ben_runtime_contract.py'
      - 'tests/test_m1_fixture_contract.py'
      - '.github/workflows/research-job-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install bounded test dependencies
        run: python -m pip install 'pytest>=8,<9' 'psycopg[binary]>=3.2,<4'
      - name: Run ResearchJob contracts
        run: >-
          pytest -q
          tests/test_research_pipeline_contract.py
          tests/test_research_job_end_to_end_contract.py
          tests/test_research_schema_contract.py
          tests/test_ben_runtime_contract.py
          tests/test_research_runtime_surface.py
          tests/test_m1_fixture_contract.py
          tests/test_research_contract_allowed_kinds.py
