name: Retired Oracle Autopilot staging finalizer

on:
  pull_request:
    paths:
      - '.github/workflows/oracle-autopilot-staging-finalize.yml'

permissions:
  contents: read

concurrency:
  group: oracle-autopilot-finalizer-contract-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Prove automatic STOP stays retired
        shell: bash
        run: |
          set -euo pipefail
          target='.github/workflows/oracle-autopilot-staging-finalize.yml'
          forbidden_action="--action S"'TOP'
          forbidden_oci="oci compute instance act"'ion'
          forbidden_trigger="oracle-autopilot-finalize-re"'quests/'
          ! grep -F -- "$forbidden_action" "$target" >/dev/null
          ! grep -F "$forbidden_oci" "$target" >/dev/null
          ! grep -F "$forbidden_trigger" "$target" >/dev/null
          echo AUTOPILOT_AUTOMATIC_STOP_RETIRED_PASS
