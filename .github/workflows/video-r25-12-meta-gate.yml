name: Bridge Video r25.12 META Evidence Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'bridge_runtime_hardening_r25_12_meta.py'
      - 'database/**'
      - 'tests/fixtures/asr_block_11_r25_11.json'
      - 'tests/test_meta_asr_gate_r25_12.py'
      - '.github/workflows/video-r25-12-meta-gate.yml'
  push:
    branches:
      - agent/video-meta-evidence-r25-12

permissions:
  contents: read

jobs:
  candidate-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install regression runtime
        run: python -m pip install --disable-pip-version-check -r requirements-worker.txt
      - name: Verify candidate and inherited evidence contracts
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/test_meta_asr_gate_r25_12.py
          PYTHONPATH=. python tests/test_asr_policy_r25_6.py
          PYTHONPATH=. python tests/test_unreliable_asr_isolation_r25_4.py
          PYTHONPATH=. python tests/test_pdf_presentation_r25_6.py
          PYTHONPATH=. python tests/test_content_persistence_r25_10.py
          PYTHONPATH=. python -m unittest tests.test_diana_longitudinal_postprocess tests.test_diana_longitudinal_quality_v2 -v
          python -m py_compile \
            bridge_runtime_hardening_r25_12_meta.py \
            database/video_result_persistence.py
      - name: Verify candidate preserves the live production baseline
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED_FILES="$(git diff --name-only HEAD^1 HEAD)"
            META_CANDIDATE_CHANGED=false
            if printf '%s\n' "$CHANGED_FILES" | grep -Eq \
              '^(bridge_runtime_hardening_r25_12_meta\.py|tests/fixtures/asr_block_11_r25_11\.json|tests/test_meta_asr_gate_r25_12\.py)$'; then
              META_CANDIDATE_CHANGED=true
            fi
            if [ "$META_CANDIDATE_CHANGED" = "true" ] && \
               printf '%s\n' "$CHANGED_FILES" | grep -Eq \
                 '^(\.github/workflows/bridge-video-3\.1-free\.yml|run_drive_3_1_free_generic\.py)$'; then
              echo 'META implementation/test candidate must not modify the production workflow/runtime adapter.' >&2
              exit 1
            fi
          fi
          python - <<'PY'
          import ast
          from pathlib import Path
          import re

          workflow = Path('.github/workflows/bridge-video-3.1-free.yml').read_text(encoding='utf-8')
          adapter = Path('run_drive_3_1_free_generic.py').read_text(encoding='utf-8')

          class ModuleBindingVisitor(ast.NodeVisitor):
              """Collect bindings evaluated in module scope, excluding nested scopes."""

              def __init__(self, name):
                  self.name = name
                  self.bindings = []
                  self.literal_assignments = []

              def visit_Import(self, node):
                  for alias in node.names:
                      bound_name = alias.asname or alias.name.split('.')[0]
                      if bound_name == self.name:
                          self.bindings.append(('import', alias.name, node.lineno))

              def visit_ImportFrom(self, node):
                  for alias in node.names:
                      bound_name = alias.asname or alias.name
                      if bound_name == self.name:
                          self.bindings.append(('import-from', node.module, node.lineno))

              def visit_Name(self, node):
                  if node.id == self.name and isinstance(node.ctx, (ast.Store, ast.Del)):
                      self.bindings.append(('name', None, node.lineno))

              def visit_Assign(self, node):
                  if (
                      len(node.targets) == 1
                      and isinstance(node.targets[0], ast.Name)
                      and node.targets[0].id == self.name
                      and isinstance(node.value, ast.Constant)
                      and isinstance(node.value.value, str)
                  ):
                      self.literal_assignments.append(node.value.value)
                  self.generic_visit(node)

              def _visit_definition_header(self, node):
                  if node.name == self.name:
                      self.bindings.append(('definition', None, node.lineno))
                  for decorator in node.decorator_list:
                      self.visit(decorator)

              def visit_FunctionDef(self, node):
                  self._visit_definition_header(node)
                  for default in (*node.args.defaults, *node.args.kw_defaults):
                      if default is not None:
                          self.visit(default)

              visit_AsyncFunctionDef = visit_FunctionDef

              def visit_ClassDef(self, node):
                  self._visit_definition_header(node)
                  for base in node.bases:
                      self.visit(base)
                  for keyword in node.keywords:
                      self.visit(keyword.value)

              def visit_Lambda(self, node):
                  return

              def visit_ExceptHandler(self, node):
                  if node.name == self.name:
                      self.bindings.append(('except', None, node.lineno))
                  if node.type is not None:
                      self.visit(node.type)
                  for statement in node.body:
                      self.visit(statement)

          match = re.search(
              r'BRIDGE_REQUESTED_ALGORITHM_REVISION:\s*["\']3\.1-free-r([0-9]+(?:\.[0-9]+)*)["\']',
              workflow,
          )
          if not match:
              raise SystemExit('production algorithm revision is missing or malformed')
          requested_revision = f"3.1-free-r{match.group(1)}"

          adapter_tree = ast.parse(adapter, filename='run_drive_3_1_free_generic.py')
          hardening_bindings = ModuleBindingVisitor('hardening')
          hardening_bindings.visit(adapter_tree)
          if len(hardening_bindings.bindings) != 1:
              raise SystemExit('production adapter must import exactly one versioned runtime as hardening')
          binding_kind, runtime_module, _ = hardening_bindings.bindings[0]
          if binding_kind != 'import' or not re.fullmatch(
              r'bridge_runtime_hardening_r[0-9_]+', runtime_module or ''
          ):
              raise SystemExit('production adapter hardening binding must be a versioned runtime import')
          runtime_path = Path(f'{runtime_module}.py')
          if not runtime_path.is_file():
              raise SystemExit(f'production runtime module is missing: {runtime_module}')
          runtime_tree = ast.parse(runtime_path.read_text(encoding='utf-8'), filename=str(runtime_path))
          revision_bindings = ModuleBindingVisitor('REVISION')
          revision_bindings.visit(runtime_tree)
          if (
              len(revision_bindings.bindings) != 1
              or revision_bindings.literal_assignments != [requested_revision]
          ):
              raise SystemExit(
                  'production workflow/runtime mismatch: '
                  f'workflow requests {requested_revision}, '
                  f'{runtime_module} bindings={revision_bindings.bindings!r} '
                  f'literals={revision_bindings.literal_assignments!r}'
              )
          print(
              'Production baseline preserved and internally consistent: '
              f'{requested_revision} via {runtime_module}'
          )
          PY
