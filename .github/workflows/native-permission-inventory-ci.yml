name: Native permission writer inventory CI

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'ops/native_permission_writer_inventory.py'
      - 'tests/test_native_permission_writer_inventory.py'
      - 'docs/ops/NATIVE_PERMISSION_WRITER_INVENTORY.md'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
      - run: python -m unittest discover -s tests -p test_native_permission_writer_inventory.py -v
      - name: Inventory exact checked-out Git tree without production access
        run: |
          python ops/native_permission_writer_inventory.py --revision "$(git rev-parse HEAD)" > "$RUNNER_TEMP/native-writers.json"
          python - "$RUNNER_TEMP/native-writers.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          assert report['workflow_count'] > 0
          assert report['maintenance_exclusion'] == 'NOT_ESTABLISHED'
          assert all(row['review'] == 'UNREVIEWED' for row in report['workflows'])
          print('NATIVE_PERMISSION_WRITER_INVENTORY_PASS', report['workflow_count'])
          PY
