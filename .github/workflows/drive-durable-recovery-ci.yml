name: Drive durable recovery CI

on:
  push:
    branches: ['fix/autonomous-drive-durable-recovery']
  pull_request:
    paths:
      - 'universal_video/**'
      - 'tests/test_universal_video_*.py'
      - '.github/workflows/drive-durable-recovery-ci.yml'

permissions:
  contents: read

concurrency:
  group: drive-durable-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact event head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public test dependencies
        run: python -m pip install -q pytest requests google-auth 'psycopg[binary]==3.3.4'
      - name: Synthetic Drive and resident recovery regression
        run: python -m pytest -q tests/test_universal_video_*.py
      - name: Compile worker modules
        run: python -m compileall -q universal_video
