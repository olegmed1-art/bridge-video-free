name: Oracle Autopilot online observer

on:
  pull_request:
    paths:
      - '.github/workflows/oracle-autopilot-online-observer.yml'
      - 'oracle_autopilot/online_observer.py'
      - 'deploy/oracle-autopilot/school-autopilot-online-observer.service'
      - 'ops/oracle_autopilot_online_observer_install.sh'
      - 'database/migrations/0304_autopilot_online_pilot.sql'
      - 'database/tests/304_autopilot_online_pilot.sql'
      - 'tests/test_oracle_autopilot_online_observer.py'
  push:
    branches: [codex/oracle-autopilot-lite-shadow]
    paths:
      - 'ops/oracle-autopilot-online-observer-requests/*.json'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Validate online observer contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'psycopg[binary]==3.3.4' 'pytest==8.4.2'
          python -m py_compile oracle_autopilot/online_observer.py
          python -m pytest -q tests/test_oracle_autopilot_online_observer.py
          bash -n ops/oracle_autopilot_online_observer_install.sh
          verify_output="$(systemd-analyze verify \
            deploy/oracle-autopilot/school-autopilot-online-observer.service 2>&1 || true)"
          unexpected_output="$(printf '%s\n' "$verify_output" | grep -vF \
            'Command /opt/bridge-school/school-autopilot/.venv/bin/python is not executable: No such file or directory' \
            | sed '/^[[:space:]]*$/d' || true)"
          test -z "$unexpected_output" || { printf '%s\n' "$unexpected_output" >&2; exit 1; }

      - name: Validate fail-closed no-stop boundary
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/oracle-autopilot-online-observer.yml'
          grep -F "request['activation_scope'] == 'SHADOW_ONLY'" "$workflow" >/dev/null
          grep -F "request['no_instance_stop'] is True" "$workflow" >/dev/null
          grep -F "request['no_consumer_restart'] is True" "$workflow" >/dev/null
          grep -F 'Environment=AUTOPILOT_RUNTIME_MODE=SHADOW' \
            deploy/oracle-autopilot/school-autopilot-online-observer.service >/dev/null
          grep -F 'AUTOPILOT_CONSUMER_RESTARTED=NO' \
            ops/oracle_autopilot_online_observer_install.sh >/dev/null
          python - <<'PY'
          from pathlib import Path

          source = Path('oracle_autopilot/online_observer.py').read_text()
          unit = Path('deploy/oracle-autopilot/school-autopilot-online-observer.service').read_text()
          installer = Path('ops/oracle_autopilot_online_observer_install.sh').read_text()
          workflow = Path('.github/workflows/oracle-autopilot-online-observer.yml').read_text()
          for forbidden in ('subprocess', 'os.system', 'shell=True', 'OPENAI_API_KEY', 'GITHUB_TOKEN'):
              assert forbidden not in source
          assert 'autopilot-broker.env' not in unit
          assert 'school-autopilot-shadow.service' in installer
          assert 'systemctl restart' not in installer
          assert 'systemctl stop' not in installer
          for forbidden in ('--action ' + 'STOP', 'oci compute instance ' + 'action'):
              assert forbidden not in workflow
          PY

  install:
    if: ${{ github.event_name == 'push' }}
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    concurrency:
      group: oracle-instance-workload-mutation
      cancel-in-progress: false
    env:
      ORACLE_HOST: 158.180.47.161
      ORACLE_USER: ubuntu
      EXPECTED_CONSUMER_REVISION: d908565a5de4481f0bf9a1d2a489f04f8893af65
      SSH_KEY_ORACLE: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
      SSH_KEY_OCI: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
      SSH_KEY_VM: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
      SSH_KEY_BRIDGE: ${{ secrets.BRIDGE_SCHOOL_ORACLE_SSH_PRIVATE_KEY }}
      SSH_KEY_ORACLE_ALT: ${{ secrets.ORACLE_SSH_KEY }}
      SSH_KEY_OCI_ALT: ${{ secrets.OCI_SSH_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Validate exact online observer request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff-tree -m --no-commit-id --name-only -r "$GITHUB_SHA" \
            | grep -E '^ops/oracle-autopilot-online-observer-requests/[^/]+\.json$' | sort -u)
          [[ ${#files[@]} -eq 1 ]] || { echo 'expected exactly one observer request' >&2; exit 1; }
          REQUEST_FILE="${files[0]}" python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import re

          request = json.load(open(os.environ['REQUEST_FILE'], encoding='utf-8'))
          assert set(request) == {
              'request_id', 'action', 'target_host', 'source_revision',
              'expected_consumer_revision', 'activation_scope',
              'no_instance_stop', 'no_consumer_restart',
              'min_interval_seconds', 'max_tasks_per_hour',
          }
          assert re.fullmatch(r'[A-Za-z0-9._-]{1,80}', request['request_id'])
          assert request['action'] == 'install_online_observer'
          assert request['target_host'] == '158.180.47.161'
          assert re.fullmatch(r'[0-9a-f]{40}', request['source_revision'])
          assert request['expected_consumer_revision'] == os.environ['EXPECTED_CONSUMER_REVISION']
          assert request['activation_scope'] == 'SHADOW_ONLY'
          assert request['no_instance_stop'] is True
          assert request['no_consumer_restart'] is True
          assert request['min_interval_seconds'] == 5
          assert request['max_tasks_per_hour'] == 720
          print(f"request_id={request['request_id']}")
          print(f"source_revision={request['source_revision']}")
          PY
          source_revision="$(python -c \
            'import json,sys; print(json.load(open(sys.argv[1]))["source_revision"])' \
            "${files[0]}")"
          [[ "$(git rev-parse "$GITHUB_SHA^")" == "$source_revision" ]] \
            || { echo 'observer source must be the request parent' >&2; exit 1; }
          git diff --quiet "$source_revision" "$GITHUB_SHA" -- \
            oracle_autopilot \
            deploy/oracle-autopilot/school-autopilot-online-observer.service \
            ops/oracle_autopilot_online_observer_install.sh

      - name: Verify pinned Oracle identity and SSH access
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          known="$RUNNER_TEMP/oracle-autopilot-online-known-hosts"
          : > "$known"
          index=0
          for expected in \
            'SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk' \
            'SHA256:UGJo5yPdnk/wf8DVrzvXt2xJkE9GJ8+3IIcQ2vA+mkc' \
            'SHA256:eRCJ8c4V7HCBlIoNVSlpPSWZE5xPUMjBD6f0PvHDj64'; do
            part="$RUNNER_TEMP/oracle-autopilot-online-known-hosts.$index"
            ops/oracle_known_hosts_from_scan.sh "$ORACLE_HOST" "$expected" "$part"
            cat "$part" >> "$known"
            index=$((index + 1))
          done
          sort -u -o "$known" "$known"
          selected=''
          for name in SSH_KEY_ORACLE SSH_KEY_OCI SSH_KEY_VM SSH_KEY_BRIDGE SSH_KEY_ORACLE_ALT SSH_KEY_OCI_ALT; do
            if [[ -n "${!name:-}" ]]; then selected="$name"; break; fi
          done
          [[ -n "$selected" ]] || { echo 'Oracle SSH credential unavailable' >&2; exit 1; }
          key="$RUNNER_TEMP/id_oracle"
          printf '%s\n' "${!selected}" > "$key"
          chmod 0600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" \
            -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST" 'sudo -n true'
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "known=$known" >> "$GITHUB_OUTPUT"

      - name: Build pinned observer bundle
        id: bundle
        shell: bash
        env:
          SOURCE_REVISION: ${{ steps.request.outputs.source_revision }}
        run: |
          set -euo pipefail
          printf '%s\n' "$SOURCE_REVISION" > AUTOPILOT_OBSERVER_SOURCE_REVISION
          bundle="$RUNNER_TEMP/autopilot-online-observer-$SOURCE_REVISION.tgz"
          tar --sort=name --owner=0 --group=0 --numeric-owner -czf "$bundle" \
            AUTOPILOT_OBSERVER_SOURCE_REVISION \
            oracle_autopilot \
            deploy/oracle-autopilot/school-autopilot-online-observer.service \
            ops/oracle_autopilot_online_observer_install.sh
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
          echo "bundle_sha=$(sha256sum "$bundle" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "unit_sha=$(sha256sum deploy/oracle-autopilot/school-autopilot-online-observer.service | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Install observer without consumer or Oracle lifecycle
        id: install
        shell: bash
        env:
          SOURCE_REVISION: ${{ steps.request.outputs.source_revision }}
          BUNDLE_SHA: ${{ steps.bundle.outputs.bundle_sha }}
          UNIT_SHA: ${{ steps.bundle.outputs.unit_sha }}
        run: |
          set -euo pipefail
          remote_bundle="/tmp/autopilot-online-observer-$SOURCE_REVISION.tgz"
          scp -i '${{ steps.ssh.outputs.key }}' -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile='${{ steps.ssh.outputs.known }}' \
            '${{ steps.bundle.outputs.bundle }}' "$ORACLE_USER@$ORACLE_HOST:$remote_bundle"
          ssh -i '${{ steps.ssh.outputs.key }}' -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile='${{ steps.ssh.outputs.known }}' \
            -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST" \
            "sudo -n env SOURCE_REVISION='$SOURCE_REVISION' EXPECTED_CONSUMER_REVISION='$EXPECTED_CONSUMER_REVISION' EXPECTED_BUNDLE_SHA='$BUNDLE_SHA' EXPECTED_UNIT_SHA='$UNIT_SHA' REMOTE_BUNDLE='$remote_bundle' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          service=school-autopilot-online-observer.service
          consumer=school-autopilot-shadow.service
          stage="$(mktemp -d /tmp/autopilot-online-observer-stage.XXXXXX)"
          cleanup(){ rm -rf "$stage" "$REMOTE_BUNDLE"; }
          trap cleanup EXIT

          [[ "$(sha256sum "$REMOTE_BUNDLE" | awk '{print $1}')" == "$EXPECTED_BUNDLE_SHA" ]]
          tar -xzf "$REMOTE_BUNDLE" -C "$stage" --no-same-owner --no-same-permissions
          [[ "$(cat "$stage/AUTOPILOT_OBSERVER_SOURCE_REVISION")" == "$SOURCE_REVISION" ]]
          [[ "$(sha256sum "$stage/deploy/oracle-autopilot/$service" | awk '{print $1}')" == "$EXPECTED_UNIT_SHA" ]]

          consumer_pid_before="$(systemctl show -p MainPID --value "$consumer")"
          consumer_restarts_before="$(systemctl show -p NRestarts --value "$consumer")"
          [[ "$(systemctl is-active "$consumer")" == active ]]
          [[ "$(systemctl is-enabled "$consumer")" == enabled ]]

          AUTOPILOT_REPO_DIR="$stage" \
          AUTOPILOT_OBSERVER_SOURCE_REVISION="$SOURCE_REVISION" \
          AUTOPILOT_EXPECTED_CONSUMER_REVISION="$EXPECTED_CONSUMER_REVISION" \
            bash "$stage/ops/oracle_autopilot_online_observer_install.sh"

          sleep 15
          [[ "$(systemctl is-active "$service")" == active ]]
          [[ "$(systemctl is-enabled "$service")" == enabled ]]
          [[ "$(systemctl show -p NRestarts --value "$service")" == 0 ]]
          [[ "$(systemctl is-active "$consumer")" == active ]]
          [[ "$(systemctl is-enabled "$consumer")" == enabled ]]
          [[ "$(systemctl show -p MainPID --value "$consumer")" == "$consumer_pid_before" ]]
          [[ "$(systemctl show -p NRestarts --value "$consumer")" == "$consumer_restarts_before" ]]
          [[ "$(readlink -f /opt/bridge-school/school-autopilot-online-observer/current)" == \
             "/opt/bridge-school/school-autopilot-online-observer/releases/$SOURCE_REVISION" ]]

          journal="$(journalctl -u "$service" --since '3 minutes ago' --no-pager -n 200)"
          started_count="$(grep -Fc 'online_observer_started' <<<"$journal" || true)"
          unsafe_count="$(grep -Ec 'Traceback|RuntimeError|online_circuit_open|online_local_circuit_open' <<<"$journal" || true)"
          [[ "$started_count" -eq 1 ]]
          [[ "$unsafe_count" -eq 0 ]]
          [[ ! -e /var/lib/school-autopilot-online-observer/circuit-open.json ]]

          /opt/bridge-school/school-autopilot/.venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/var/lib/school-autopilot-online-observer/heartbeat.json').read_text())
          assert payload['runtime_mode'] == 'SHADOW_ONLY', payload
          assert payload['action'] in {'CREATED', 'MONITORING', 'INTERVAL_HOLD'}, payload
          assert payload['created_count'] >= 1, payload
          assert payload['pass_count'] >= 1, payload
          assert payload['finding_count'] == 0, payload
          assert payload['circuit_open'] is False, payload
          print(f"AUTOPILOT_ONLINE_CREATED_COUNT={payload['created_count']}")
          print(f"AUTOPILOT_ONLINE_PASS_COUNT={payload['pass_count']}")
          print('AUTOPILOT_ONLINE_CIRCUIT_OPEN=NO')
          PY
          echo 'AUTOPILOT_ONLINE_OBSERVER_ACTIVATION_PASS'
          echo 'AUTOPILOT_RUNTIME_MODE=SHADOW_ONLY'
          echo 'AUTOPILOT_CONSUMER_RESTARTED=NO'
          echo 'AUTOPILOT_PRODUCTION_MUTATIONS=NO'
          echo 'ORACLE_INSTANCE_STOP_REQUESTED=NO'
          REMOTE

      - name: Verify DDS3 non-regression
        shell: bash
        run: |
          set -euo pipefail
          READY_JSON="$(curl -fsS --retry 3 --retry-delay 3 --max-time 20 "https://$ORACLE_HOST/readyz")" \
            python - <<'PY'
          import json
          import os

          payload = json.loads(os.environ['READY_JSON'])
          assert payload.get('status') == 'ready', payload
          assert payload.get('engine') == 'DDS3', payload
          assert payload.get('fallback_used') is False, payload
          print('AUTOPILOT_ONLINE_DDS3_NONREGRESSION_PASS')
          PY

      - name: Publish safe observer summary
        if: ${{ always() }}
        shell: bash
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
        run: |
          {
            echo '### Oracle Autopilot online observer'
            echo "- request: ${REQUEST_ID:-unresolved}"
            echo "- install: ${INSTALL_OUTCOME:-not-run}"
            echo '- runtime: `SHADOW_ONLY`'
            echo '- existing consumer restarted: `NO`'
            echo '- Oracle instance stop requested: `NO`'
            echo '- production mutations: `NO`'
            echo '- model calls / task cost: `0`'
          } >> "$GITHUB_STEP_SUMMARY"
