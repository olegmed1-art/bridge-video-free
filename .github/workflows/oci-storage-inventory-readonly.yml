name: OCI storage inventory read-only

on:
  pull_request:
    paths:
      - '.github/workflows/oci-storage-inventory-readonly.yml'
      - 'ops/oci-storage-inventory-requests/*.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/oci-storage-inventory-readonly.yml'
      - 'ops/oci-storage-inventory-requests/*.json'

permissions:
  contents: read

concurrency:
  group: oci-storage-inventory-readonly
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Enforce read-only surface
        run: |
          set -euo pipefail
          f=.github/workflows/oci-storage-inventory-readonly.yml
          awk '$0 == "          # BEGIN OCI_READ_ONLY_SDK" {copy=1;next} $0 == "          # END OCI_READ_ONLY_SDK" {copy=0} copy' "$f" > "$RUNNER_TEMP/inventory.py"
          INVENTORY_SCRIPT="$RUNNER_TEMP/inventory.py" python - <<'PY'
          import ast, os, textwrap

          source=textwrap.dedent(open(os.environ['INVENTORY_SCRIPT'], encoding='utf-8').read())
          tree=ast.parse(source)
          allowed={
              'identity': {'list_region_subscriptions','list_compartments'},
              'regional_identity': {'list_availability_domains'},
              'compute': {'list_instances','list_boot_volume_attachments'},
              'block': {'get_boot_volume','list_boot_volumes','list_volumes'},
          }
          seen=set()
          for node in ast.walk(tree):
              if not isinstance(node, ast.Attribute) or not isinstance(node.value, ast.Name):
                  continue
              client=node.value.id
              if client not in allowed:
                  continue
              assert node.attr in allowed[client], f'non-read-only SDK attribute: {client}.{node.attr}'
              seen.add((client,node.attr))
          required={(client,method) for client,methods in allowed.items() for method in methods}
          assert required <= seen, f'missing expected read-only calls: {sorted(required-seen)}'
          PY
          grep -F "access_level='ANY'" "$f"
          grep -F 'list_region_subscriptions' "$f"
          grep -F 'OCI_STORAGE_INVENTORY_FAILED' "$f"

  inventory:
    if: ${{ github.event_name == 'push' }}
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OCI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_KEY: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      OCI_REGION: ${{ secrets.OCI_CLI_REGION }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Validate bounded request
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff-tree -m --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^ops/oci-storage-inventory-requests/[^/]+\.json$' | sort -u)
          [[ ${#files[@]} -eq 1 ]]
          REQUEST_FILE="${files[0]}" python - <<'PY'
          import json, os
          x=json.load(open(os.environ['REQUEST_FILE'], encoding='utf-8'))
          assert x == {'operation':'read_only_storage_inventory'}
          PY
      - name: Configure OCI SDK
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q 'oci==2.164.0'
          install -d -m 0700 "$RUNNER_TEMP/oci"
          if [[ "$OCI_KEY" == base64:* ]]; then
            printf '%s' "${OCI_KEY#base64:}" | base64 --decode > "$RUNNER_TEMP/oci/key.pem"
          else
            printf '%s\n' "$OCI_KEY" > "$RUNNER_TEMP/oci/key.pem"
          fi
          grep -q -- '-----BEGIN .*PRIVATE KEY-----' "$RUNNER_TEMP/oci/key.pem"
          chmod 0600 "$RUNNER_TEMP/oci/key.pem"
          cat > "$RUNNER_TEMP/oci/config" <<EOF
          [DEFAULT]
          user=$OCI_USER
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY
          region=$OCI_REGION
          key_file=$RUNNER_TEMP/oci/key.pem
          EOF
          chmod 0600 "$RUNNER_TEMP/oci/config"
      - name: Read all instance and volume allocations
        env:
          OCI_CONFIG_FILE: ${{ runner.temp }}/oci/config
        run: |
          set -euo pipefail
          python - <<'PY'
          # BEGIN OCI_READ_ONLY_SDK
          import os
          import oci

          operation='initialize'
          try:
              operation='load_config'
              base_config=oci.config.from_file(os.environ['OCI_CONFIG_FILE'])
              tenancy=base_config['tenancy']
              identity=oci.identity.IdentityClient(base_config)
              paginate=oci.pagination.list_call_get_all_results

              operation='list_region_subscriptions'
              subscriptions=identity.list_region_subscriptions(tenancy).data
              regions=sorted({
                  x.region_name for x in subscriptions
                  if str(x.status).upper() in {'READY','ACTIVE'}
              })
              if not regions:
                  raise RuntimeError('no subscribed regions')

              operation='list_all_compartments'
              compartments=[tenancy]
              for c in paginate(
                  identity.list_compartments,
                  tenancy,
                  compartment_id_in_subtree=True,
                  access_level='ANY',
              ).data:
                  if c.lifecycle_state == 'ACTIVE':
                      compartments.append(c.id)
              compartments=list(dict.fromkeys(compartments))

              instances=[]
              boot_volumes={}
              block_volumes={}
              for region in regions:
                  region_config=dict(base_config)
                  region_config['region']=region
                  regional_identity=oci.identity.IdentityClient(region_config)
                  compute=oci.core.ComputeClient(region_config)
                  block=oci.core.BlockstorageClient(region_config)
                  operation='list_availability_domains'
                  ads=[x.name for x in regional_identity.list_availability_domains(tenancy).data]
                  for compartment_id in compartments:
                      operation='list_instances'
                      for inst in paginate(compute.list_instances, compartment_id).data:
                          if inst.lifecycle_state == 'TERMINATED':
                              continue
                          attached=[]
                          operation='list_boot_volume_attachments'
                          for a in paginate(
                              compute.list_boot_volume_attachments,
                              availability_domain=inst.availability_domain,
                              compartment_id=compartment_id,
                              instance_id=inst.id,
                          ).data:
                              if a.lifecycle_state in {'ATTACHED','ATTACHING'}:
                                  attached.append(a.boot_volume_id)
                          boot_gb='unknown'
                          if len(set(attached)) == 1:
                              operation='get_attached_boot_volume'
                              boot=block.get_boot_volume(attached[0]).data
                              boot_volumes[boot.id]=boot
                              boot_gb=boot.size_in_gbs
                          instances.append((region,inst.lifecycle_state,inst.shape,boot_gb))
                      for ad in ads:
                          operation='list_boot_volumes'
                          for vol in paginate(
                              block.list_boot_volumes,
                              availability_domain=ad,
                              compartment_id=compartment_id,
                          ).data:
                              if vol.lifecycle_state not in {'TERMINATED','TERMINATING'}:
                                  boot_volumes[vol.id]=vol
                      operation='list_block_volumes'
                      for vol in paginate(block.list_volumes, compartment_id).data:
                          if vol.lifecycle_state not in {'TERMINATED','TERMINATING'}:
                              block_volumes[vol.id]=vol

              boot_total=sum(int(v.size_in_gbs or 0) for v in boot_volumes.values())
              block_total=sum(int(v.size_in_gbs or 0) for v in block_volumes.values())
              combined=boot_total+block_total
              print('OCI_STORAGE_INVENTORY_PASS')
              print(f'subscribed_regions={len(regions)}')
              print(f'queried_compartments={len(compartments)}')
              print(f'nonterminated_instances={len(instances)}')
              for n,(region,state,shape,boot_gb) in enumerate(sorted(instances),1):
                  print(f'instance_{n}_region={region}')
                  print(f'instance_{n}_state={state}')
                  print(f'instance_{n}_shape={shape}')
                  print(f'instance_{n}_boot_volume_gb={boot_gb}')
              print(f'allocated_boot_volume_gb={boot_total}')
              print(f'allocated_block_volume_gb={block_total}')
              print(f'allocated_combined_volume_gb={combined}')
              print(f'nominal_headroom_vs_200gb={200-combined}')
              print('mutation_performed=false')
          except oci.exceptions.ServiceError as exc:
              status=str(exc.status) if exc.status is not None else 'unknown'
              code=str(exc.code or 'unknown')
              safe_code=''.join(ch for ch in code if ch.isalnum() or ch in '._-')[:80] or 'unknown'
              print(f'OCI_STORAGE_INVENTORY_FAILED operation={operation} status={status} code={safe_code}')
              raise SystemExit(1)
          except Exception:
              print(f'OCI_STORAGE_INVENTORY_FAILED operation={operation} status=local code=BOUNDED_FAILURE')
              raise SystemExit(1)
          # END OCI_READ_ONLY_SDK
          PY
