name: Universal Video Intake CI

on:
  pull_request:
    paths:
      - 'universal_video/server_intake.py'
      - 'universal_video/drive_stage.py'
      - 'universal_video/contract.py'
      - 'universal_video/profiles.py'
      - 'tests/test_universal_video_server_intake.py'
      - 'tests/test_universal_video_drive_stage.py'
      - '.github/workflows/universal-video-intake-ci.yml'
  push:
    branches: [main]
    paths:
      - 'universal_video/server_intake.py'
      - 'universal_video/drive_stage.py'
      - 'universal_video/contract.py'
      - 'universal_video/profiles.py'
      - 'tests/test_universal_video_server_intake.py'
      - 'tests/test_universal_video_drive_stage.py'

permissions:
  contents: read

jobs:
  intake-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest requests
      - run: python -m pytest -q tests/test_universal_video_server_intake.py tests/test_universal_video_drive_stage.py tests/test_universal_video_contract.py
