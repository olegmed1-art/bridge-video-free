name: Oracle Diana 11 Durable 002 Verified Delivery

on:
  pull_request:
    paths:
      - '.github/workflows/oracle-diana11-002-delivery.yml'
      - 'ops/universal_video_diana11_002_operator.sh'
      - 'ops/install_universal_video_diana11_002_operator.sh'
      - 'universal_video/result_conformance.py'
      - 'universal_video/drive_results.py'
  push:
    branches: [main]
    paths:
      - 'ops/oracle-diana11-002-delivery-requests/*.json'

permissions:
  contents: read
  issues: write

concurrency:
  group: oracle-diana11-002-verified-delivery
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      request_id: ${{ steps.request.outputs.request_id }}
      issue: ${{ steps.request.outputs.issue }}
      operation: ${{ steps.request.outputs.operation }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Validate delivery contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n ops/universal_video_diana11_002_operator.sh
          grep -Fq "readonly BRIDGE_JOB_HASH='e53fa37ce69d97bc9d8c995bc8f416b0e7b5ad42610cda4d75faa2385bcf60fc'" ops/universal_video_diana11_002_operator.sh
          grep -Fq 'UV_BRIDGE_PRODUCTION_READY=NO' ops/universal_video_diana11_002_operator.sh
          grep -Fq 'UNIVERSAL_VIDEO_DIANA11_PUBLISH_VERIFIED_PASS' ops/universal_video_diana11_002_operator.sh
          python -m py_compile universal_video/result_conformance.py universal_video/drive_results.py
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q tests/test_exact_delivery_contract.py
      - name: Validate exact experiment request
        id: request
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff-tree -m --no-commit-id --name-only -r "$GITHUB_SHA" \
            | grep -E '^ops/oracle-diana11-002-delivery-requests/[^/]+\.json$' | sort -u)
          [[ ${#files[@]} -eq 1 ]] || { echo "expected exactly one delivery request" >&2; exit 1; }
          REQUEST_FILE="${files[0]}" python - <<'PY' >> "$GITHUB_OUTPUT"
          import json,os,re
          x=json.load(open(os.environ['REQUEST_FILE'], encoding='utf-8'))
          assert set(x)=={'request_id','issue','operation','job_id','expected_job_hash'}, x
          assert re.fullmatch(r'[A-Za-z0-9._-]{1,80}', str(x['request_id']))
          assert x['issue']==562
          assert x['operation'] in {'inspect-status-bridge','conform-publish-bridge'}
          assert x['job_id']=='diana11-durable-002-20260826-01'
          assert x['expected_job_hash']=='e53fa37ce69d97bc9d8c995bc8f416b0e7b5ad42610cda4d75faa2385bcf60fc'
          print('request_id='+x['request_id'])
          print('issue=562')
          print('operation='+x['operation'])
          PY

  deliver:
    if: ${{ github.event_name == 'push' }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      INSTANCE_ID: ocid1.instance.oc1.eu-frankfurt-1.antheljtruoejaica7hj5oubnh2cctnjr7ti7llcgo6ho6wdvgvui6td7saq
      OCI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_KEY: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      OCI_REGION: ${{ secrets.OCI_CLI_REGION }}
      ISSUE_NUMBER: ${{ needs.validate.outputs.issue }}
      OPERATION: ${{ needs.validate.outputs.operation }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Configure OCI CLI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q oci-cli
          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_KEY" > "$HOME/.oci/key.pem"
          chmod 600 "$HOME/.oci/key.pem"
          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=$OCI_USER
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY
          region=$OCI_REGION
          key_file=$HOME/.oci/key.pem
          EOF
          chmod 600 "$HOME/.oci/config"
          oci iam region list --output json >/dev/null
          [[ "$(oci compute instance get --instance-id "$INSTANCE_ID" --query 'data."lifecycle-state"' --raw-output)" == RUNNING ]]
          echo ORACLE_DIANA11_DELIVERY_OCI_PASS
      - name: Inspect status or conform and publish exact result
        id: remote
        shell: bash
        run: |
          set -euo pipefail
          compartment="$(oci compute instance get --instance-id "$INSTANCE_ID" --query 'data."compartment-id"' --raw-output)"
          case "$OPERATION" in
            inspect-status-bridge)
              command='sudo -n /usr/local/sbin/universal-video-diana11-002 status-bridge'
              timeout=180
              display="diana11-status-${GITHUB_RUN_ID}"
              ;;
            conform-publish-bridge)
              command='sudo -n /usr/local/sbin/universal-video-diana11-002 publish-bridge'
              timeout=1800
              display="diana11-delivery-${GITHUB_RUN_ID}"
              ;;
            *) echo 'unsupported operation after validation' >&2; exit 64;;
          esac
          content="$(SCRIPT_TEXT="$command" python -c 'import json,os; print(json.dumps({"source":{"sourceType":"TEXT","text":"set -Eeuo pipefail\n"+os.environ["SCRIPT_TEXT"]+"\n"},"output":{"outputType":"TEXT"}},separators=(",",":")))')"
          target="$(python -c 'import json,os; print(json.dumps({"instanceId":os.environ["INSTANCE_ID"]},separators=(",",":")))')"
          command_id="$(oci instance-agent command create \
            --compartment-id "$compartment" --content "$content" --target "$target" \
            --timeout-in-seconds "$timeout" --display-name "$display" \
            --query data.id --raw-output)"
          execution=''; lifecycle=''
          for _ in $(seq 1 360); do
            execution="$(oci instance-agent command-execution get --command-id "$command_id" --instance-id "$INSTANCE_ID" --output json 2>/dev/null || true)"
            [[ -n "$execution" ]] || { sleep 5; continue; }
            lifecycle="$(printf '%s' "$execution" | python -c 'import json,sys; print(json.load(sys.stdin).get("data",{}).get("lifecycle-state",""))')"
            case "$lifecycle" in SUCCEEDED|FAILED|CANCELED|TIMED_OUT) break;; esac
            sleep 5
          done
          printf 'state=%s\n' "$lifecycle" >> "$GITHUB_OUTPUT"
          printf '%s' "$execution" | python -c 'import json,sys; d=json.load(sys.stdin).get("data",{}); print((d.get("content") or {}).get("text","") or "")' > "$RUNNER_TEMP/diana11-delivery-raw.txt"
          python - "$RUNNER_TEMP/diana11-delivery-raw.txt" "$RUNNER_TEMP/diana11-delivery-safe.txt" <<'PY'
          import re,sys
          patterns=[
              r'UV_STATE=(?:MISSING|CONFLICT|NONCONFORMANT|FAILED|RUNNING|QUEUED|REVIEW|TECHNICAL_CONFORMANT)',
              r'UV_RESULT_STATUS=(?:COMPLETED|REVIEW)',
              r'UV_CONFORMANCE_STATE=PASS',
              r'UV_ATTESTATION_MODE=(?:GENERATION_FINALIZATION)',
              r'UV_(?:ARTIFACT_SET_SHA256|MANIFEST_SHA256|PUBLICATION_BUNDLE_SHA256)=[0-9a-f]{64}',
              r'UV_(?:ARTIFACT_COUNT|TOTAL_BYTES)=[0-9]{1,20}',
              r'UV_DOMAIN_ANALYSIS_STATUS=DEFERRED',
              r'UV_(?:TECHNICAL_BUNDLE_READY|BRIDGE_PRODUCTION_READY)=(?:YES|NO)',
              r'UV_PEDAGOGICAL_STATUS=NOT_EVALUATED',
              r'UV_PUBLICATION_STATE=(?:NOT_PUBLISHED|FAILED|NOT_CURRENTLY_VERIFIABLE|STALE_LOCAL_MISMATCH|PUBLISHED_VERIFIED)',
              r'UV_PUBLICATION_FOLDER_ID=[A-Za-z0-9_-]{10,128}',
              r'UV_ERROR_TYPE=(?:MULTIPLE_SPOOL_STATES|UNSAFE_SPOOL_RECEIPT|UNSAFE_FAILED_RECEIPT|DONE_RECEIPT_IDENTITY_MISMATCH|UNEXPECTED_DONE_STATUS|RESULT_CONFORMANCE_FAILED)',
              r'UNIVERSAL_VIDEO_DIANA11_BRIDGE_STATUS_PASS',
              r'UNIVERSAL_VIDEO_DIANA11_PUBLISH_VERIFIED_PASS',
          ]
          safe=[]
          with open(sys.argv[1],encoding='utf-8') as source:
              for line in source:
                  line=line.rstrip('\r\n')
                  if any(re.fullmatch(pattern,line) for pattern in patterns) and line not in safe:
                      safe.append(line)
          with open(sys.argv[2],'w',encoding='utf-8') as target:
              target.write(''.join(line+'\n' for line in safe))
          PY
          cat "$RUNNER_TEMP/diana11-delivery-safe.txt"
          [[ "$lifecycle" == SUCCEEDED ]]
          if [[ "$OPERATION" == inspect-status-bridge ]]; then
            [[ "$(grep -c '^UV_STATE=' "$RUNNER_TEMP/diana11-delivery-safe.txt")" == 1 ]]
            grep -Eq '^UV_STATE=(MISSING|CONFLICT|NONCONFORMANT|FAILED|RUNNING|QUEUED|REVIEW|TECHNICAL_CONFORMANT)$' \
              "$RUNNER_TEMP/diana11-delivery-safe.txt"
            grep -Fx 'UNIVERSAL_VIDEO_DIANA11_BRIDGE_STATUS_PASS' "$RUNNER_TEMP/diana11-delivery-safe.txt"
            echo 'publication_attempted=false' >> "$GITHUB_OUTPUT"
          else
            grep -Fx 'UV_PUBLICATION_STATE=PUBLISHED_VERIFIED' "$RUNNER_TEMP/diana11-delivery-safe.txt"
            grep -Fx 'UV_DOMAIN_ANALYSIS_STATUS=DEFERRED' "$RUNNER_TEMP/diana11-delivery-safe.txt"
            grep -Fx 'UV_BRIDGE_PRODUCTION_READY=NO' "$RUNNER_TEMP/diana11-delivery-safe.txt"
            grep -Fx 'UV_PEDAGOGICAL_STATUS=NOT_EVALUATED' "$RUNNER_TEMP/diana11-delivery-safe.txt"
            grep -Fx 'UNIVERSAL_VIDEO_DIANA11_PUBLISH_VERIFIED_PASS' "$RUNNER_TEMP/diana11-delivery-safe.txt"
            echo 'publication_attempted=true' >> "$GITHUB_OUTPUT"
          fi
          echo 'validated=true' >> "$GITHUB_OUTPUT"
      - name: Verify DDS3 non-regression
        id: dds3
        if: ${{ success() }}
        shell: bash
        run: |
          READY="$(curl -fsS --retry 3 --retry-delay 3 --max-time 20 https://158.180.47.161/readyz)" python - <<'PY'
          import json,os
          x=json.loads(os.environ['READY'])
          assert x.get('status')=='ready', x
          assert x.get('engine')=='DDS3', x
          assert x.get('fallback_used') is False, x
          assert x.get('position_solver')=='ready', x
          print('ORACLE_DIANA11_DELIVERY_DDS3_NONREGRESSION_PASS')
          PY
      - name: Record experiment result
        if: ${{ always() }}
        shell: bash
        env:
          REMOTE_STATE: ${{ steps.remote.outputs.state }}
          REMOTE_VALIDATED: ${{ steps.remote.outputs.validated }}
          PUBLICATION_ATTEMPTED: ${{ steps.remote.outputs.publication_attempted }}
          REMOTE_OUTCOME: ${{ steps.remote.outcome }}
          DDS3_OUTCOME: ${{ steps.dds3.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/experiment-result.md"
          {
            if [[ "$OPERATION" == inspect-status-bridge ]]; then
              echo "[OBSERVATORY] Read-only bridge status: **${REMOTE_OUTCOME:-UNKNOWN}** (OCI state: ${REMOTE_STATE:-UNKNOWN})."
            else
              echo "[COORDINATOR] Delivery step: **${REMOTE_OUTCOME:-UNKNOWN}** (OCI state: ${REMOTE_STATE:-UNKNOWN})."
            fi
            if [[ -s "$RUNNER_TEMP/diana11-delivery-safe.txt" ]]; then
              echo
              echo '```text'
              cat "$RUNNER_TEMP/diana11-delivery-safe.txt"
              echo '```'
            fi
            echo
            if [[ "$OPERATION" == inspect-status-bridge && "${REMOTE_VALIDATED:-}" == true ]]; then
              echo 'Exact status was read without submit, ASR/media processing, or publication. This observation makes no new conformance, methodology, or production claim.'
            elif [[ "${REMOTE_VALIDATED:-}" == true && "${PUBLICATION_ATTEMPTED:-}" == true ]]; then
              echo 'Validated evidence: post-hoc technical bundle and verified Drive transfer. Domain analysis remains DEFERRED; methodology is NOT_EVALUATED; production promotion is BLOCKED.'
            else
              echo '**No conformance or publication claim is established by this run.** The remote output did not pass every required marker assertion.'
            fi
            echo "DDS3 non-regression step: **${DDS3_OUTCOME:-NOT_RUN}**."
            echo "Run: $RUN_URL"
          } > "$body"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$body"
