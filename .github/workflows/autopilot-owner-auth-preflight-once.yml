name: Autopilot temporary Neon runtime queue audit (one-shot)

on:
  push:
    branches: [codex/oracle-autopilot-lite-shadow]
    paths: ['.github/workflows/autopilot-owner-auth-preflight-once.yml']

permissions:
  contents: read

concurrency:
  group: oracle-instance-workload-mutation
  cancel-in-progress: false

jobs:
  audit:
    if: github.repository == 'olegmed1-art/bridge-video-free'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ORACLE_HOST: 158.180.47.161
      ORACLE_USER: ubuntu
      EXPECTED_FINGERPRINT: SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk
      SSH_KEY_ORACLE: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Resolve verified Oracle SSH key
        id: ssh
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/oracle-runtime-audit"
          mkdir -p "$work"
          key="$work/id_oracle"
          printf '%s\n' "$SSH_KEY_ORACLE" | tr -d '\r' > "$key"
          chmod 0600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          known="$work/known_hosts"
          ops/oracle_known_hosts_from_scan.sh "$ORACLE_HOST" "$EXPECTED_FINGERPRINT" "$known"
          ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" \
            -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST" \
            'sudo -n systemctl is-active school-autopilot-shadow.service' >/dev/null
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "known=$known" >> "$GITHUB_OUTPUT"
          echo 'AUTOPILOT_ORACLE_SSH_PREFLIGHT=PASS'

      - name: Query branch-local runtime privileges and queue without credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i '${{ steps.ssh.outputs.key }}' \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile='${{ steps.ssh.outputs.known }}' -o ConnectTimeout=15 \
            "$ORACLE_USER@$ORACLE_HOST" 'sudo -n /opt/bridge-school/school-autopilot/.venv/bin/python -' <<'PY'
          import re
          from pathlib import Path
          from urllib.parse import urlparse
          import psycopg

          env_path = Path('/opt/bridge-school/school-autopilot/autopilot-shadow.env')
          assert env_path.is_file() and not env_path.is_symlink()
          dsn = ''
          for raw in env_path.read_text(encoding='utf-8').splitlines():
              if raw.startswith('AUTOPILOT_DATABASE_URL='):
                  dsn = raw.split('=', 1)[1].strip().strip('"').strip("'")
                  break
          parsed = urlparse(dsn)
          assert re.fullmatch(r'ep-floral-field-b1pjs2of(?:-pooler)?(?:\.[a-z0-9-]+)+\.aws\.neon\.tech', parsed.hostname or '')

          with psycopg.connect(dsn, connect_timeout=15, application_name='autopilot-runtime-queue-audit') as conn:
              with conn.cursor() as cur:
                  cur.execute("""
                      SELECT current_user,
                             has_function_privilege(
                                 current_user,
                                 'autopilot.create_shadow_task(text,text,jsonb,integer,bigint,text,text)',
                                 'EXECUTE'
                             ),
                             has_schema_privilege(current_user, 'autopilot', 'USAGE')
                  """)
                  user, can_create, schema_usage = cur.fetchone()
                  print(f'AUTOPILOT_RUNTIME_USER={user}')
                  print(f'AUTOPILOT_RUNTIME_CREATE_TASK_EXECUTE={"YES" if can_create else "NO"}')
                  print(f'AUTOPILOT_RUNTIME_SCHEMA_USAGE={"YES" if schema_usage else "NO"}')

                  cur.execute("""
                      SELECT task_id::text, task_key, status, attempts, max_attempts
                        FROM autopilot.task_status
                       WHERE goal_type = 'GITHUB_DRAFT_REPAIR_V1'
                       ORDER BY created_at DESC
                       LIMIT 10
                  """)
                  rows = cur.fetchall()
                  print(f'AUTOPILOT_DRAFT_TASK_COUNT_VISIBLE={len(rows)}')
                  for index, row in enumerate(rows, 1):
                      task_id, task_key, status, attempts, max_attempts = row
                      safe_key = re.sub(r'[^A-Za-z0-9._:-]', '_', task_key)[:200]
                      print(f'AUTOPILOT_DRAFT_TASK_{index}={task_id}|{safe_key}|{status}|{attempts}/{max_attempts}')
          print('AUTOPILOT_DATABASE_CREDENTIAL_VALUES_EXPOSED=NO')
          print('AUTOPILOT_DATABASE_MUTATED=NO')
          print('ORACLE_INSTANCE_STOP_REQUESTED=NO')
          PY
