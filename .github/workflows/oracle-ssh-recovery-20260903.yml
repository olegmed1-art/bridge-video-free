name: Oracle SSH recovery (one-shot)

on:
  push:
    branches: [codex/oracle-ssh-recovery-20260903]
    paths: ['.github/workflows/oracle-ssh-recovery-20260903.yml']

permissions:
  contents: read

concurrency:
  group: oracle-ssh-recovery-20260903
  cancel-in-progress: false

jobs:
  recover:
    if: github.repository == 'olegmed1-art/bridge-video-free'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      OCI_REGION: eu-frankfurt-1
      OLD_INSTANCE_OCID: ocid1.instance.oc1.eu-frankfurt-1.antheljtruoejaica7hj5oubnh2cctnjr7ti7llcgo6ho6wdvgvui6td7saq
      OLD_PUBLIC_IP: 158.180.47.161
      NEW_INSTANCE_NAME: bridge-school-autopilot-lite
      NEW_PUBLIC_IP: 92.5.47.149
      ORACLE_USER: ubuntu
      EXPECTED_OLD_FINGERPRINT: SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk
      SSH_KEY_ORACLE: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
      SSH_KEY_OCI: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
      SSH_KEY_VM: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
      SSH_KEY_BRIDGE: ${{ secrets.BRIDGE_SCHOOL_ORACLE_SSH_PRIVATE_KEY }}
      SSH_KEY_ORACLE_ALT: ${{ secrets.ORACLE_SSH_KEY }}
      SSH_KEY_OCI_ALT: ${{ secrets.OCI_SSH_KEY }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Configure OCI client
        env:
          OCI_CLI_CONFIG: ${{ secrets.OCI_CLI_CONFIG }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${OCI_CLI_CONFIG:-}"
          test -n "${OCI_CLI_KEY_CONTENT:-}"
          python -m pip install --disable-pip-version-check --quiet 'oci-cli==3.90.3'
          umask 077
          mkdir -p "$HOME/.oci"
          if [[ "$OCI_CLI_KEY_CONTENT" == base64:* ]]; then
            printf '%s' "${OCI_CLI_KEY_CONTENT#base64:}" | base64 --decode > "$HOME/.oci/oci_api_key.pem"
          else
            printf '%s\n' "$OCI_CLI_KEY_CONTENT" > "$HOME/.oci/oci_api_key.pem"
          fi
          printf '%s\n' "$OCI_CLI_CONFIG" > "$HOME/.oci/config"
          openssl pkey -in "$HOME/.oci/oci_api_key.pem" -traditional -out "$HOME/.oci/key.pkcs1.pem"
          mv "$HOME/.oci/key.pkcs1.pem" "$HOME/.oci/oci_api_key.pem"
          actual_fingerprint="$(openssl pkey -in "$HOME/.oci/oci_api_key.pem" -pubout -outform DER | openssl md5 -r | awk '{print $1}' | sed 's/../&:/g;s/:$//')"
          export OCI_DERIVED_FINGERPRINT="$actual_fingerprint"
          python - <<'PY'
          import os
          from pathlib import Path
          p = Path.home() / '.oci/config'
          lines=[]; key=False; region=False; fingerprint=False
          for line in p.read_text().splitlines():
              if line.strip().startswith('key_file='):
                  lines.append(f'key_file={Path.home()}/.oci/oci_api_key.pem'); key=True
              elif line.strip().startswith('region='):
                  lines.append('region=eu-frankfurt-1'); region=True
              elif line.strip().startswith('fingerprint='):
                  lines.append(f'fingerprint={os.environ["OCI_DERIVED_FINGERPRINT"]}'); fingerprint=True
              else:
                  lines.append(line)
          if not key: lines.append(f'key_file={Path.home()}/.oci/oci_api_key.pem')
          if not region: lines.append('region=eu-frankfurt-1')
          if not fingerprint: lines.append(f'fingerprint={os.environ["OCI_DERIVED_FINGERPRINT"]}')
          p.write_text('\n'.join(lines)+'\n')
          PY
          oci iam region list --output json >/dev/null

      - name: Read the new instance public SSH key from OCI metadata
        id: newkey
        shell: bash
        run: |
          set -Eeuo pipefail
          tenancy="$(python -c 'import oci; print(oci.config.from_file()["tenancy"])')"
          instances="$RUNNER_TEMP/new-instances.json"
          oci compute instance list --compartment-id "$tenancy" --all             --display-name "$NEW_INSTANCE_NAME" --lifecycle-state RUNNING > "$instances"
          count="$(jq '[.data[] | select(."display-name" == env.NEW_INSTANCE_NAME and ."lifecycle-state" == "RUNNING")] | length' "$instances")"
          [[ "$count" == 1 ]]
          new_ocid="$(jq -r '.data[] | select(."display-name" == env.NEW_INSTANCE_NAME and ."lifecycle-state" == "RUNNING") | .id' "$instances")"
          observed_ip="$(oci compute instance list-vnics --instance-id "$new_ocid" --all --query 'data[0]."public-ip"' --raw-output)"
          [[ "$observed_ip" == "$NEW_PUBLIC_IP" ]]
          metadata="$RUNNER_TEMP/new-instance.json"
          oci compute instance get --instance-id "$new_ocid" > "$metadata"
          jq -r '.data.metadata.ssh_authorized_keys // empty' "$metadata" | tr -d '\r' | sed '/^[[:space:]]*$/d' > "$RUNNER_TEMP/new-instance.pub"
          [[ "$(wc -l < "$RUNNER_TEMP/new-instance.pub")" == 1 ]]
          ssh-keygen -lf "$RUNNER_TEMP/new-instance.pub" >/dev/null
          chmod 0644 "$RUNNER_TEMP/new-instance.pub"
          echo "path=$RUNNER_TEMP/new-instance.pub" >> "$GITHUB_OUTPUT"
          echo "NEW_INSTANCE_RESOLVED=YES"
          echo "NEW_PUBLIC_KEY_FROM_OCI_METADATA=YES"
          ssh-keygen -lf "$RUNNER_TEMP/new-instance.pub" | awk '{print "NEW_PUBLIC_KEY_FINGERPRINT=" $2}'

      - name: Resolve a working old-server SSH credential
        id: oldssh
        shell: bash
        run: |
          set -Eeuo pipefail
          state="$(oci compute instance get --instance-id "$OLD_INSTANCE_OCID" --query 'data."lifecycle-state"' --raw-output)"
          [[ "$state" == RUNNING ]]
          observed_ip="$(oci compute instance list-vnics --instance-id "$OLD_INSTANCE_OCID" --all --query 'data[0]."public-ip"' --raw-output)"
          [[ "$observed_ip" == "$OLD_PUBLIC_IP" ]]
          work="$RUNNER_TEMP/old-ssh"; mkdir -p "$work"
          known="$work/known_hosts"
          ssh-keyscan -T 10 -t ed25519,ecdsa,rsa "$OLD_PUBLIC_IP" > "$known" 2>/dev/null
          [[ -s "$known" ]]
          ssh-keygen -lf "$known" | awk '{print $2}' | grep -Fx "$EXPECTED_OLD_FINGERPRINT" >/dev/null

          selected=''
          idx=0
          for name in SSH_KEY_ORACLE SSH_KEY_OCI SSH_KEY_VM SSH_KEY_BRIDGE SSH_KEY_ORACLE_ALT SSH_KEY_OCI_ALT; do
            raw="${!name:-}"
            [[ -n "$raw" ]] || continue
            idx=$((idx+1))
            base="$work/key-$idx"
            printf '%s\n' "$raw" > "$base.raw"
            tr -d '\r' < "$base.raw" > "$base.crlf"
            printf '%s' "$raw" | python -c '
          import sys
          raw = sys.stdin.read()
          path = sys.argv[1]
          if "\\n" in raw and "\n" not in raw:
              raw = raw.replace("\\r", "").replace("\\n", "\n")
          with open(path, "w", newline="\n") as handle:
              handle.write(raw)
              if not raw.endswith("\n"):
                  handle.write("\n")
          ' "$base.escaped"
            for key in "$base.raw" "$base.crlf" "$base.escaped"; do
              chmod 0600 "$key"
              ssh-keygen -y -f "$key" >/dev/null 2>&1 || continue
              if ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes                    -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known"                    -o ConnectTimeout=12 "$ORACLE_USER@$OLD_PUBLIC_IP" true >/dev/null 2>&1; then
                selected="$key"
                break 2
              fi
            done
          done
          [[ -n "$selected" ]]
          cp "$selected" "$work/id_oracle"
          chmod 0600 "$work/id_oracle"
          echo "key=$work/id_oracle" >> "$GITHUB_OUTPUT"
          echo "known=$known" >> "$GITHUB_OUTPUT"
          echo "OLD_SERVER_SSH_SECRET=PASS"

      - name: Add the new instance public key to the old server
        shell: bash
        run: |
          set -Eeuo pipefail
          key='${{ steps.oldssh.outputs.key }}'
          known='${{ steps.oldssh.outputs.known }}'
          public_key='${{ steps.newkey.outputs.path }}'
          remote="/tmp/oracle-ssh-recovery-${GITHUB_RUN_ID}.pub"
          scp -q -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes             -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known"             -o ConnectTimeout=15 "$public_key" "$ORACLE_USER@$OLD_PUBLIC_IP:$remote"
          ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes             -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known"             -o ConnectTimeout=15 "$ORACLE_USER@$OLD_PUBLIC_IP"             "sudo -n bash -se -- '$remote'" <<'REMOTE'
          set -Eeuo pipefail
          remote_pub="$1"
          target=/home/ubuntu/.ssh/authorized_keys
          tmp=''
          cleanup() {
            rm -f -- "$remote_pub"
            [[ -z "$tmp" ]] || rm -f -- "$tmp"
          }
          trap cleanup EXIT HUP INT TERM
          [[ -f "$remote_pub" && ! -L "$remote_pub" ]]
          pub="$(tr -d '\r' < "$remote_pub" | sed '/^[[:space:]]*$/d')"
          [[ "$(printf '%s\n' "$pub" | wc -l)" == 1 ]]
          printf '%s\n' "$pub" > "$remote_pub"
          ssh-keygen -lf "$remote_pub" >/dev/null
          install -d -o ubuntu -g ubuntu -m 0700 /home/ubuntu/.ssh
          tmp="$(mktemp /home/ubuntu/.ssh/.authorized_keys.XXXXXXXX)"
          if [[ -f "$target" ]]; then cat "$target"; fi > "$tmp"
          printf '%s\n' "$pub" >> "$tmp"
          awk 'NF && !seen[$0]++' "$tmp" > "$tmp.dedup"
          mv "$tmp.dedup" "$tmp"
          install -o ubuntu -g ubuntu -m 0600 "$tmp" "$target"
          grep -Fx -- "$pub" "$target" >/dev/null
          echo 'NEW_PUBLIC_KEY_INSTALLED=YES'
          echo 'OLD_SERVER_REBUILT=NO'
          echo 'SERVICES_RESTARTED=NO'
          REMOTE
