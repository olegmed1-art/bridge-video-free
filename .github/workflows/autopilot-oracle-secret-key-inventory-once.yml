name: Autopilot Oracle secret-key inventory (names only)

on:
  push:
    branches: [codex/oracle-autopilot-lite-shadow]
    paths: ['.github/workflows/autopilot-oracle-secret-key-inventory-once.yml']

permissions:
  contents: read

concurrency:
  group: oracle-instance-workload-mutation
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ORACLE_HOST: 158.180.47.161
      ORACLE_USER: ubuntu
      EXPECTED_FINGERPRINT: SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk
      SSH_KEY_ORACLE: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: List relevant environment key names without values
        shell: bash
        run: |
          set -Eeuo pipefail
          key="$RUNNER_TEMP/id_oracle"; known="$RUNNER_TEMP/known_hosts"
          printf '%s\n' "$SSH_KEY_ORACLE" | tr -d '\r' > "$key"; chmod 0600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          ops/oracle_known_hosts_from_scan.sh "$ORACLE_HOST" "$EXPECTED_FINGERPRINT" "$known"
          ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known" -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST" \
            'sudo -n python3 -' <<'PY'
          from pathlib import Path
          import re
          roots=[Path('/opt/bridge-school/school-autopilot'),Path('/etc/default')]
          found=[]
          for root in roots:
              if not root.exists(): continue
              for p in root.rglob('*'):
                  try: st=p.stat()
                  except Exception: continue
                  if not p.is_file() or st.st_size>131072: continue
                  if p.suffix.lower() not in {'.env','.conf','.config','.ini'} and '.env' not in p.name.lower(): continue
                  try: lines=p.read_text(encoding='utf-8',errors='strict').splitlines()
                  except Exception: continue
                  for line in lines:
                      m=re.match(r'^\s*(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)\s*=',line)
                      if not m: continue
                      name=m.group(1)
                      if any(t in name.upper() for t in ('NEON','MIGRATION','OWNER','DATABASE','POSTGRES')):
                          found.append((str(p),name))
          for p,name in sorted(set(found)):
              print(f'AUTOPILOT_ENV_KEY path={p} key={name}')
          print(f'AUTOPILOT_ENV_KEY_COUNT={len(set(found))}')
          print('AUTOPILOT_ENV_VALUES_EXPOSED=NO')
          print('DATABASE_MUTATED=NO')
          print('ORACLE_INSTANCE_STOP_REQUESTED=NO')
          PY
