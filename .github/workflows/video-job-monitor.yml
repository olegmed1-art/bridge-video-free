name: Video Job Monitor

on:
  push:
    branches: [main]
    paths:
      - 'monitor_requests/*.txt'
  workflow_dispatch:
    inputs:
      job_id:
        required: true
        type: string
      work_folder_id:
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Resolve monitor request
        shell: bash
        env:
          INPUT_JOB_ID: ${{ inputs.job_id }}
          INPUT_WORK_FOLDER_ID: ${{ inputs.work_folder_id }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            JOB_ID="$INPUT_JOB_ID"
            WORK_FOLDER_ID="$INPUT_WORK_FOLDER_ID"
          else
            REQUEST_FILE="$(git show --pretty='' --name-only "$GITHUB_SHA" | grep -E '^monitor_requests/.*\.txt$' | head -n 1 || true)"
            test -n "$REQUEST_FILE"
            JOB_ID="$(sed -n 's/^JOB_ID=//p' "$REQUEST_FILE" | tail -n 1 | tr -d '[:space:]')"
            WORK_FOLDER_ID="$(sed -n 's/^WORK_FOLDER_ID=//p' "$REQUEST_FILE" | tail -n 1 | tr -d '[:space:]')"
          fi
          case "$JOB_ID" in *[!0-9a-f]*) exit 2 ;; esac
          test "${#JOB_ID}" -eq 32
          case "$WORK_FOLDER_ID" in *[!0-9A-Za-z_-]*) exit 2 ;; esac
          echo "BRIDGE_MONITOR_JOB_ID=$JOB_ID" >> "$GITHUB_ENV"
          echo "BRIDGE_MONITOR_WORK_FOLDER_ID=$WORK_FOLDER_ID" >> "$GITHUB_ENV"
      - run: |
          python -m pip install --disable-pip-version-check \
            'requests==2.34.2' 'google-auth==2.56.3' 'psycopg[binary]==3.3.4'
      - name: Inspect matching runs and publish Drive status
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_DRIVE_OAUTH_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_JSON }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import json, os, tempfile
          from pathlib import Path
          import requests
          import run_drive_3_1_free as io
          from run_drive_3_1_free_oidc import user_oauth_token

          repo = os.environ['GH_REPOSITORY']
          job_id = os.environ['BRIDGE_MONITOR_JOB_ID']
          parent = os.environ['BRIDGE_MONITOR_WORK_FOLDER_ID']
          headers = {
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          base = f'https://api.github.com/repos/{repo}'
          response = requests.get(
              base + '/actions/workflows/bridge-video-3.1-free.yml/runs',
              headers=headers,
              params={'branch': 'main', 'event': 'push', 'per_page': 100},
              timeout=60,
          )
          response.raise_for_status()
          matches = []
          for run in response.json().get('workflow_runs', []):
              commit = requests.get(base + '/commits/' + run['head_sha'], headers=headers, timeout=60)
              commit.raise_for_status()
              files = commit.json().get('files', [])
              patches = '\n'.join(str(item.get('patch') or '') for item in files if str(item.get('filename') or '').startswith('run_requests/'))
              if job_id not in patches:
                  continue
              matches.append({
                  'run_id': run['id'],
                  'run_number': run.get('run_number'),
                  'attempt': run.get('run_attempt'),
                  'status': run.get('status'),
                  'conclusion': run.get('conclusion'),
                  'created_at': run.get('created_at'),
                  'run_started_at': run.get('run_started_at'),
                  'updated_at': run.get('updated_at'),
                  'head_sha': run.get('head_sha'),
                  'display_title': run.get('display_title'),
                  'html_url': run.get('html_url'),
              })
          matches.sort(key=lambda item: item.get('created_at') or '')
          payload = {
              'status': 'VIDEO_JOB_MONITOR',
              'job_id': job_id,
              'observed_at': datetime.now(timezone.utc).isoformat(),
              'matching_runs': matches,
          }
          token = user_oauth_token()
          if not token:
              raise SystemExit('Drive OAuth unavailable')
          stamp = datetime.now(timezone.utc).strftime('%Y%m%dT%H%M%SZ')
          with tempfile.TemporaryDirectory(prefix='video-monitor-') as td:
              path = Path(td) / f'VIDEO_JOB_STATUS_{job_id}_{stamp}.json'
              path.write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8')
              uploaded = io.upload_file(token, parent, path, 'application/json')
          print(json.dumps({'status': 'published', 'drive_id': uploaded['id'], 'matching_runs': matches}, ensure_ascii=False))
          PY
