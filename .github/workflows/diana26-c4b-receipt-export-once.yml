name: Export Diana 26 c4b receipt one-shot

on:
  push:
    branches: [codex/diana-autonomous-finalize-20260911]
    paths: ['.github/workflows/diana26-c4b-receipt-export-once.yml']

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ORACLE_HOST: 158.180.47.161
      ORACLE_USER: ubuntu
      EXPECTED_FINGERPRINT: SHA256:NXmGcng3fzof9b6Hs5Xgh4yYnzxGyVwa/EcfOxu0WPk
      SSH_KEY_ORACLE: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
      SSH_KEY_OCI: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
      SSH_KEY_VM: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
      SSH_KEY_BRIDGE: ${{ secrets.BRIDGE_SCHOOL_ORACLE_SSH_PRIVATE_KEY }}
      SSH_KEY_ORACLE_ALT: ${{ secrets.ORACLE_SSH_KEY }}
      SSH_KEY_OCI_ALT: ${{ secrets.OCI_SSH_KEY }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Retrieve one immutable receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/diana26-export"
          mkdir -p "$work/out"
          known="$work/known_hosts"
          ops/oracle_known_hosts_from_scan.sh "$ORACLE_HOST" "$EXPECTED_FINGERPRINT" "$known"
          selected=''
          for name in SSH_KEY_ORACLE SSH_KEY_OCI SSH_KEY_VM SSH_KEY_BRIDGE SSH_KEY_ORACLE_ALT SSH_KEY_OCI_ALT; do
            if [[ -n "${!name:-}" ]]; then selected="$name"; break; fi
          done
          [[ -n "$selected" ]]
          key="$work/id_oracle"
          printf '%s\n' "${!selected}" | tr -d '\r' > "$key"
          chmod 0600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          remote="/home/ubuntu/bridge-school-private-media/diana-23-26/autonomous-results-c4b68d45/diana-26.json"
          scp -q -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" \
            -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST:$remote" "$work/out/diana-26.json"
          python3 - "$work/out/diana-26.json" <<'PY'
          import hashlib, json, sys
          p=sys.argv[1]
          raw=open(p,'rb').read()
          data=json.loads(raw)
          expected=data.pop('receipt_sha256')
          encoded=json.dumps(data,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()
          assert hashlib.sha256(encoded).hexdigest()==expected
          print('RECEIPT_EXPORT_PASS')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diana26-c4b-receipt
          path: ${{ runner.temp }}/diana26-export/out/diana-26.json
          retention-days: 1
          if-no-files-found: error
