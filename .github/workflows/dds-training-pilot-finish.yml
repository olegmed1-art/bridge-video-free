name: DDS pilot 10k — finish phase

on:
  workflow_dispatch:
    inputs:
      approval_token:
        description: 'Введите ПИЛОТ-10К-ФИНИШ-ОДОБРЕН для явного продолжения пилота'
        required: true
        type: string

concurrency:
  group: dds-pilot-10k-finish
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  TRAIN_RUN_ID: '31908256854'
  TRAIN_ARTIFACT: dds-pilot-10k-train-state-31908256854
  WORK: dds_training/work/pilot
  DDS_TRAINING_CONFIRM: YES
  PYTHONUNBUFFERED: '1'
  GH_TOKEN: ${{ github.token }}

jobs:
  finish:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Verify explicit human authorization for pilot finish
        env:
          APPROVAL_TOKEN: ${{ inputs.approval_token }}
        run: |
          set -euo pipefail
          if [ "$APPROVAL_TOKEN" != "ПИЛОТ-10К-ФИНИШ-ОДОБРЕН" ]; then
            echo "Pilot finish is blocked: explicit approval token is missing." >&2
            exit 2
          fi
          echo '{"pilot_finish_authorized":true,"automatic_trigger":false}'

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Compile completion code
        working-directory: dds_training
        run: python -m compileall -q .

      - name: Wait for the TRAIN artifact
        run: |
          set -euo pipefail
          completed=0
          for attempt in $(seq 1 360); do
            payload="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TRAIN_RUN_ID}")"
            status="$(jq -r '.status' <<<"$payload")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$payload")"
            echo "train run ${TRAIN_RUN_ID}: status=${status} conclusion=${conclusion:-pending} attempt=${attempt}"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" != "success" ]; then
                echo "TRAIN run ended with ${conclusion}" >&2
                exit 2
              fi
              completed=1
              break
            fi
            sleep 30
          done
          test "$completed" = 1

      - name: Download and restore durable TRAIN state
        run: |
          set -euo pipefail
          rm -rf /tmp/dds-train-artifact dds_training/work/pilot
          mkdir -p /tmp/dds-train-artifact dds_training/work
          gh run download "$TRAIN_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$TRAIN_ARTIFACT" \
            --dir /tmp/dds-train-artifact
          archive="$(find /tmp/dds-train-artifact -name '*.tgz' -print -quit)"
          test -n "$archive"
          tar -xzf "$archive" -C dds_training/work
          test -f "$WORK/training.sqlite3"
          test -f "$WORK/blind_tasks.jsonl"
          test -f "$WORK/locked_predictions_train.jsonl"

      - name: Verify complete TRAIN coverage before learning consolidation
        working-directory: dds_training
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db=sqlite3.connect(Path('work/pilot/training.sqlite3'))
          facts=db.execute("select count(*) from dds_results where split='train'").fetchone()[0]
          preds=db.execute("select count(*) from predictions where split='train'").fetchone()[0]
          assert facts==14000, facts
          assert preds==14000, preds
          assert db.execute("select count(*) from dds_results where split in ('validation','sealed_test')").fetchone()[0]==0
          print({'train_predictions':preds,'train_dds_results':facts,'holdouts_opened':False})
          PY

      - name: Restore DDS3 Bazel disk cache
        id: dds-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/bazel-dds3
          key: dds3-v3.0.0-bazel7.6.1-py314-${{ runner.os }}

      - name: Bootstrap local DDS3
        run: bash dds_training/bootstrap_linux.sh

      - name: Resolve TRAIN overclaims without inventing a missing card line
        working-directory: dds_training
        run: |
          source .venv/bin/activate
          python resolve_investigations_auto.py \
            --work work/pilot \
            --tasks work/pilot/blind_tasks.jsonl work/pilot/derived_blind_tasks.jsonl \
            --run-id pilot-train-consolidation-${{ github.run_id }} \
            --out work/pilot/investigations_train_resolved.json

      - name: Train adaptive predictor only from TRAIN DDS evidence
        working-directory: dds_training
        run: |
          source .venv/bin/activate
          python adaptive_predictor.py train \
            --tasks work/pilot/blind_tasks.jsonl \
            --predictions work/pilot/locked_predictions_train.jsonl \
            --db work/pilot/training.sqlite3 \
            --out work/pilot/adaptive_model_v0.2.json \
            | tee work/pilot/adaptive_model_training.json

      - name: Create and evaluate blind derived transfer tasks
        working-directory: dds_training
        run: |
          set -euo pipefail
          source .venv/bin/activate
          if [ -s work/pilot/derived_blind_tasks.jsonl ]; then
            python adaptive_predictor.py predict \
              --tasks work/pilot/derived_blind_tasks.jsonl \
              --model work/pilot/adaptive_model_v0.2.json \
              --out work/pilot/locked_predictions_derived_v0.2.jsonl \
              --splits derived
            python run_stage.py evaluate \
              --stage pilot \
              --work work/pilot \
              --tasks-file derived_blind_tasks.jsonl \
              --predictions work/pilot/locked_predictions_derived_v0.2.jsonl \
              --splits derived \
              --start \
              --run-id pilot-derived-${{ github.run_id }} \
              --checkpoint-every 100 \
              --snapshot-every 1000 \
              --milestone-every 5000 \
              --no-generate-followups \
              | tee work/pilot/derived_evaluate.log
          else
            echo '{"derived_tasks":0,"reason":"no TRAIN errors generated follow-ups"}' > work/pilot/derived_evaluate.log
          fi

      - name: Resolve derived overclaims and preserve their lessons
        working-directory: dds_training
        run: |
          source .venv/bin/activate
          python resolve_investigations_auto.py \
            --work work/pilot \
            --tasks work/pilot/blind_tasks.jsonl work/pilot/derived_blind_tasks.jsonl \
            --run-id pilot-derived-resolution-${{ github.run_id }} \
            --out work/pilot/investigations_derived_resolved.json

      - name: Lock baseline and adaptive VALIDATION predictions before DDS
        working-directory: dds_training
        run: |
          set -euo pipefail
          source .venv/bin/activate
          python - <<'PY'
          import sqlite3
          db=sqlite3.connect('work/pilot/training.sqlite3')
          assert db.execute("select count(*) from dds_results where split='validation'").fetchone()[0]==0
          PY
          python baseline_predictor.py \
            --tasks work/pilot/blind_tasks.jsonl \
            --out work/pilot/locked_predictions_validation_baseline.jsonl \
            --splits validation \
            --predictor-version bridge-baseline-v0.1
          python adaptive_predictor.py predict \
            --tasks work/pilot/blind_tasks.jsonl \
            --model work/pilot/adaptive_model_v0.2.json \
            --out work/pilot/locked_predictions_validation_adaptive.jsonl \
            --splits validation
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('baseline','adaptive'):
              p=Path(f'work/pilot/locked_predictions_validation_{name}.jsonl')
              rows=[json.loads(x) for x in p.read_text(encoding='utf-8').splitlines() if x.strip()]
              assert len(rows)==3000, (name,len(rows))
              assert all(x.get('locked') is True for x in rows)
          print({'validation_predictions_locked_per_model':3000,'dds_called_before_lock':False})
          PY

      - name: Evaluate adaptive predictor on VALIDATION only
        working-directory: dds_training
        run: |
          source .venv/bin/activate
          python run_stage.py evaluate \
            --stage pilot \
            --work work/pilot \
            --predictions work/pilot/locked_predictions_validation_adaptive.jsonl \
            --splits validation \
            --start \
            --run-id pilot-validation-${{ github.run_id }} \
            --checkpoint-every 100 \
            --snapshot-every 1000 \
            --milestone-every 5000 \
            --no-generate-followups \
            | tee work/pilot/validation_evaluate.log

      - name: Compare both pre-locked predictors and choose the sealed model
        working-directory: dds_training
        run: |
          source .venv/bin/activate
          python compare_predictors.py \
            --tasks work/pilot/blind_tasks.jsonl \
            --db work/pilot/training.sqlite3 \
            --split validation \
            --candidate baseline work/pilot/locked_predictions_validation_baseline.jsonl \
            --candidate adaptive work/pilot/locked_predictions_validation_adaptive.jsonl \
            --out work/pilot/validation_model_comparison.json \
            | tee work/pilot/validation_model_comparison.log

      - name: Lock both SEALED prediction sets before opening the sealed test
        working-directory: dds_training
        run: |
          set -euo pipefail
          source .venv/bin/activate
          python - <<'PY'
          import sqlite3
          db=sqlite3.connect('work/pilot/training.sqlite3')
          assert db.execute("select count(*) from dds_results where split='sealed_test'").fetchone()[0]==0
          PY
          python baseline_predictor.py \
            --tasks work/pilot/blind_tasks.jsonl \
            --out work/pilot/locked_predictions_sealed_baseline.jsonl \
            --splits sealed_test \
            --predictor-version bridge-baseline-v0.1
          python adaptive_predictor.py predict \
            --tasks work/pilot/blind_tasks.jsonl \
            --model work/pilot/adaptive_model_v0.2.json \
            --out work/pilot/locked_predictions_sealed_adaptive.jsonl \
            --splits sealed_test
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          root=Path('work/pilot')
          comparison=json.loads((root/'validation_model_comparison.json').read_text(encoding='utf-8'))
          selected=comparison['selected']
          source=root/f'locked_predictions_sealed_{selected}.jsonl'
          target=root/'locked_predictions_sealed_selected.jsonl'
          shutil.copyfile(source,target)
          rows=[json.loads(x) for x in target.read_text(encoding='utf-8').splitlines() if x.strip()]
          assert len(rows)==3000, len(rows)
          assert all(x.get('locked') is True for x in rows)
          (root/'selected_sealed_model.json').write_text(json.dumps({'selected':selected,'source':str(source)},indent=2),encoding='utf-8')
          print({'sealed_model':selected,'sealed_predictions_locked':len(rows),'dds_called_before_lock':False})
          PY

      - name: Open and evaluate SEALED test exactly once
        working-directory: dds_training
        run: |
          source .venv/bin/activate
          python run_stage.py evaluate \
            --stage pilot \
            --work work/pilot \
            --predictions work/pilot/locked_predictions_sealed_selected.jsonl \
            --splits sealed_test \
            --start \
            --open-sealed \
            --run-id pilot-sealed-${{ github.run_id }} \
            --checkpoint-every 100 \
            --snapshot-every 1000 \
            --milestone-every 5000 \
            --no-generate-followups \
            | tee work/pilot/sealed_evaluate.log

      - name: Resolve all remaining pilot overclaim investigations
        working-directory: dds_training
        run: |
          source .venv/bin/activate
          python resolve_investigations_auto.py \
            --work work/pilot \
            --tasks work/pilot/blind_tasks.jsonl work/pilot/derived_blind_tasks.jsonl \
            --run-id pilot-final-resolution-${{ github.run_id }} \
            --out work/pilot/investigations_final_resolved.json

      - name: Final database audit
        working-directory: dds_training
        run: |
          source .venv/bin/activate
          python run_stage.py audit \
            --work work/pilot \
            --run-id pilot-final-audit-${{ github.run_id }} \
            --fail-on-error \
            | tee work/pilot/final_audit.json

      - name: Generate English and Russian final reports
        working-directory: dds_training
        run: |
          source .venv/bin/activate
          python run_stage.py report --stage pilot --work work/pilot
          python pilot_report_ru.py \
            --work work/pilot \
            --comparison work/pilot/validation_model_comparison.json \
            --model work/pilot/adaptive_model_v0.2.json \
            --out work/pilot/report_pilot_ru.md

      - name: Verify the pilot stage is completely closed
        working-directory: dds_training
        run: |
          source .venv/bin/activate
          python stage_gate.py --work work/pilot --stage pilot | tee work/pilot/stage_gate_final.json
          python - <<'PY'
          import json
          from pathlib import Path
          gate=json.loads(Path('work/pilot/stage_gate_final.json').read_text(encoding='utf-8'))
          assert gate['ready_for_report'] is True, gate
          assert gate['report_exists'] is True, gate
          assert gate['ready_for_next_stage'] is True, gate
          assert gate['open_mandatory_investigations']==0, gate
          assert all(v==0 for v in gate['missing_by_split'].values()), gate
          print({'pilot_complete':True,'next_action':gate['next_action']})
          PY

      - name: Create final machine summary
        working-directory: dds_training
        run: |
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          root=Path('work/pilot')
          db=sqlite3.connect(root/'training.sqlite3')
          out={
            'stage':'pilot',
            'deals':10000,
            'tasks_by_split':{s:db.execute('select count(*) from dds_results where split=?',(s,)).fetchone()[0] for s in ('train','derived','validation','sealed_test')},
            'errors':db.execute('select count(*) from error_events').fetchone()[0],
            'skill_evidence':db.execute('select count(*) from skill_evidence').fetchone()[0],
            'selected_model':json.loads((root/'selected_sealed_model.json').read_text())['selected'],
            'validation_comparison':json.loads((root/'validation_model_comparison.json').read_text()),
            'stage_gate':json.loads((root/'stage_gate_final.json').read_text()),
            'audit':json.loads((root/'final_audit.json').read_text()),
          }
          (root/'pilot_final_summary.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - name: Package complete durable pilot state
        if: always()
        run: |
          if [ -d dds_training/work/pilot ]; then
            tar -czf dds-pilot-10k-complete-state.tgz -C dds_training/work pilot
          fi

      - name: Upload complete pilot state and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dds-pilot-10k-complete-state-${{ github.run_id }}
          path: |
            dds-pilot-10k-complete-state.tgz
            dds_training/work/pilot/report_pilot.md
            dds_training/work/pilot/report_pilot_ru.md
            dds_training/work/pilot/pilot_final_summary.json
            dds_training/work/pilot/validation_model_comparison.json
            dds_training/work/pilot/stage_gate_final.json
          if-no-files-found: warn
          retention-days: 90

      - name: Save DDS3 Bazel disk cache
        if: always() && steps.dds-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/bazel-dds3
          key: dds3-v3.0.0-bazel7.6.1-py314-${{ runner.os }}
